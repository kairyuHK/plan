<style>
  :root{
    --bg:#f3f6fa;
    --surface:#ffffff;
    --surface-2:#eef3f9;
    --ink:#2b3440;
    --ink-soft:#5b6b7b;
    --line:#dde5ee;
    --accent:#3a7bd5;
    --accent-ink:#2c5fa8;
    --ok:#2e9e6b;
    --ok-bg:#e6f6ee;
    --ng:#d9534f;
    --ng-bg:#fcebea;
    --warn:#e08a2b;
    --radius:14px;
    --shadow:0 4px 18px rgba(43,52,64,.07);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.6;
    font-size:16px;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:720px;margin:0 auto;padding:16px 16px 48px;}
  header.top{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 2px 14px;gap:10px;
  }
  header.top h1{font-size:18px;margin:0;letter-spacing:.02em;}
  header.top .sub{font-size:12px;color:var(--ink-soft);font-weight:400;}
  .btn{
    font:inherit;border:none;cursor:pointer;border-radius:10px;
    padding:11px 16px;background:var(--accent);color:#fff;font-weight:600;
    transition:filter .15s, transform .05s;
  }
  .btn:active{transform:translateY(1px);}
  .btn:hover{filter:brightness(1.05);}
  .btn.ghost{background:var(--surface);color:var(--accent-ink);border:1px solid var(--line);}
  .btn.ghost:hover{background:var(--surface-2);filter:none;}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:9px;}
  .btn.wide{width:100%;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .card{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px;margin-bottom:14px;
  }
  h2.sec{font-size:15px;margin:0 0 12px;color:var(--ink-soft);font-weight:700;letter-spacing:.04em;}
  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:480px){.mode-grid{grid-template-columns:1fr;}}
  .mode-card{
    text-align:left;padding:16px;border-radius:var(--radius);
    border:1.5px solid var(--line);background:var(--surface);cursor:pointer;
    transition:border-color .15s, box-shadow .15s;
  }
  .mode-card:hover{border-color:var(--accent);box-shadow:var(--shadow);}
  .mode-card .mi{font-size:22px;}
  .mode-card .mt{font-weight:700;margin:6px 0 2px;font-size:16px;}
  .mode-card .md{font-size:12.5px;color:var(--ink-soft);}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    border:1.5px solid var(--line);background:var(--surface);color:var(--ink);
    border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;user-select:none;
    transition:all .12s;
  }
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .chip.grp{font-weight:700;background:var(--surface-2);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .row.between{justify-content:space-between;}
  .muted{color:var(--ink-soft);font-size:13px;}
  .count-opts{display:flex;gap:8px;flex-wrap:wrap;}
  .qbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;}
  .qbar .left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tag{font-size:11.5px;background:var(--surface-2);color:var(--accent-ink);padding:3px 9px;border-radius:999px;font-weight:700;}
  .prog{font-size:13px;color:var(--ink-soft);font-weight:600;}
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;background:var(--surface-2);padding:4px 10px;border-radius:8px;}
  .timer.low{color:var(--ng);background:var(--ng-bg);}
  .pbar{height:5px;background:var(--surface-2);border-radius:999px;overflow:hidden;margin-bottom:14px;}
  .pbar>i{display:block;height:100%;background:var(--accent);transition:width .3s;}
  .qtext{font-size:16.5px;line-height:1.75;margin:4px 0 16px;white-space:pre-wrap;}
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{
    display:flex;gap:11px;align-items:flex-start;text-align:left;
    border:1.5px solid var(--line);background:var(--surface);
    border-radius:12px;padding:13px 14px;cursor:pointer;font:inherit;color:var(--ink);
    transition:border-color .12s, background .12s;width:100%;
  }
  .choice:hover:not(.locked){border-color:var(--accent);}
  .choice .mk{
    flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);
    display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink-soft);
  }
  .choice.sel{border-color:var(--accent);background:#eef4fc;}
  .choice.sel .mk{background:var(--accent);color:#fff;border-color:var(--accent);}
  .choice.correct{border-color:var(--ok);background:var(--ok-bg);}
  .choice.correct .mk{background:var(--ok);color:#fff;border-color:var(--ok);}
  .choice.wrong{border-color:var(--ng);background:var(--ng-bg);}
  .choice.wrong .mk{background:var(--ng);color:#fff;border-color:var(--ng);}
  .choice.locked{cursor:default;}
  .explain{margin-top:16px;border-left:4px solid var(--accent);background:var(--surface-2);border-radius:0 10px 10px 0;padding:13px 15px;}
  .explain .et{font-weight:700;font-size:13px;color:var(--accent-ink);margin-bottom:6px;}
  .explain ol{margin:0;padding-left:20px;}
  .explain li{margin:3px 0;font-size:14.5px;}
  .verdict{font-weight:700;margin:14px 0 2px;font-size:15px;}
  .verdict.ok{color:var(--ok);}
  .verdict.ng{color:var(--ng);}
  .qactions{margin-top:16px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
  .notice{font-size:12px;color:var(--warn);font-weight:600;}
  .score-big{font-size:42px;font-weight:800;text-align:center;letter-spacing:.02em;}
  .score-sub{text-align:center;color:var(--ink-soft);margin-top:-4px;}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px;}
  .stat-box{background:var(--surface-2);border-radius:12px;padding:12px;text-align:center;}
  .stat-box b{display:block;font-size:22px;}
  .stat-box span{font-size:12px;color:var(--ink-soft);}
  .wrong-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;}
  .wrong-item .wq{font-size:14.5px;margin-bottom:6px;}
  .wrong-item .wa{font-size:13px;}
  .wrong-item .wa .you{color:var(--ng);font-weight:600;}
  .wrong-item .wa .ans{color:var(--ok);font-weight:600;}
  textarea.export{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:12.5px;resize:vertical;background:var(--surface-2);color:var(--ink);}
  #padToggle{position:fixed;right:16px;bottom:16px;z-index:40;border-radius:999px;padding:13px 17px;box-shadow:0 6px 20px rgba(43,52,64,.25);}
  #padOverlay{position:fixed;inset:0;z-index:50;background:#fbfcfe;display:none;flex-direction:column;}
  #padOverlay.open{display:flex;}
  #padToolbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;}
  #padCanvas{flex:1;touch-action:none;display:block;background:
     linear-gradient(90deg,#eef3f9 1px,transparent 1px),
     linear-gradient(#eef3f9 1px,transparent 1px);
     background-size:26px 26px;cursor:crosshair;}
  .tool{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;font-weight:600;}
  .tool.on{background:var(--accent);color:#fff;border-color:var(--accent);}
  .hidden{display:none !important;}
  .lead{font-size:13.5px;color:var(--ink-soft);margin:0 0 14px;}
  .kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px;}
  .kv:last-child{border-bottom:none;}
  .backlink{background:none;border:none;color:var(--accent-ink);font:inherit;font-weight:600;cursor:pointer;padding:0;font-size:14px;}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div>
      <h1>SPI試験 トレーニング</h1>
      <div class="sub">非言語（数理）＋ 言語　模擬演習</div>
    </div>
    <button class="btn ghost sm" id="homeBtn">🏠 ホーム</button>
  </header>

  <!-- ============ HOME ============ -->
  <section id="screen-home">
    <div class="card">
      <h2 class="sec">モードを選ぶ</h2>
      <div class="mode-grid">
        <button class="mode-card" data-mode="practice">
          <div class="mi">📖</div>
          <div class="mt">練習モード</div>
          <div class="md">1問ごとに正解と詳しい解説をすぐ確認。じっくり学習向け。</div>
        </button>
        <button class="mode-card" data-mode="test">
          <div class="mi">⏱️</div>
          <div class="mt">模擬テストモード</div>
          <div class="md">Test-center再現。各問カウントダウン・送信後は戻れない・電卓禁止。</div>
        </button>
      </div>
    </div>

    <div class="card">
      <h2 class="sec">出題カテゴリ</h2>
      <div style="margin-bottom:10px;">
        <div class="muted" style="margin-bottom:6px;font-weight:700;">非言語（数理）</div>
        <div class="chips" id="chips-math"></div>
      </div>
      <div style="margin-bottom:12px;">
        <div class="muted" style="margin-bottom:6px;font-weight:700;">言語</div>
        <div class="chips" id="chips-verbal"></div>
      </div>
      <div class="row between">
        <button class="btn ghost sm" id="selAll">全選択</button>
        <span class="muted" id="poolCount"></span>
      </div>
    </div>

    <div class="card" id="testConfig">
      <h2 class="sec">出題数（練習・模擬テスト共通）</h2>
      <div class="count-opts" id="countOpts"></div>
    </div>

    <div class="card">
      <button class="btn wide" id="startBtn">スタート</button>
      <p class="muted" style="text-align:center;margin:10px 0 0;" id="startHint"></p>
    </div>

    <div class="card">
      <h2 class="sec">学習データ</h2>
      <div class="stat-grid">
        <div class="stat-box"><b id="h-total">0</b><span>総回答数</span></div>
        <div class="stat-box"><b id="h-acc">0%</b><span>正答率</span></div>
        <div class="stat-box"><b id="h-wrong">0</b><span>錯題数</span></div>
      </div>

 ch:["8分後","10分後","12分後","15分後"],a:1,
 ex:["反対方向 → 1分で 100 + 80 = 180m 近づく","1800 ÷ 180 = 10分後"]},
{id:"tabibito5",c:"tabibito",q:"長さ100mの列車が、長さ200mの鉄橋を渡り始めてから渡り終えるまで20秒かかった。列車の速さは毎秒何mか。",
 ch:["12m","15m","18m","20m"],a:1,
 ex:["進む距離 = 鉄橋200m + 列車100m = 300m","速さ = 300 ÷ 20 = 15m/秒"]},
{id:"tabibito6",c:"tabibito",q:"時速60kmの自動車で150kmの道のりを走ると、何時間かかるか。",
 ch:["2時間","2.5時間","3時間","3.5時間"],a:1,
 ex:["時間 = 距離 ÷ 速さ","= 150 ÷ 60 = 2.5時間"]},
{id:"tabibito7",c:"tabibito",q:"家から駅まで1.2kmある。分速60mで歩くと何分かかるか。",
 ch:["15分","18分","20分","24分"],a:2,
 ex:["1.2km = 1200m","1200 ÷ 60 = 20分"]},
{id:"tabibito8",c:"tabibito",q:"1周1500mの池を、A と B が同じ地点から同じ方向に同時に出発した。A は分速90m、B は分速60m。A が B にちょうど1周差をつけて追いつくのは何分後か。",
 ch:["40分後","50分後","60分後","75分後"],a:1,
 ex:["同方向 → 1分で 90 − 60 = 30m 差がつく","1500 ÷ 30 = 50分後"]},
{id:"tabibito9",c:"tabibito",q:"同じ山道を、上りは時速3km、下りは時速6kmで往復した。往復全体の平均の速さは時速何kmか。",
 ch:["4km","4.5km","4.8km","5km"],a:0,
 ex:["片道を x km とすると 往復距離 = 2x","所要時間 = x/3 + x/6 = 2x/6 + x/6 = 3x/6 = x/2","平均 = 2x ÷ (x/2) = 4km/時"]},
{id:"tabibito10",c:"tabibito",q:"長さ150mの列車が時速72kmで走っている。長さ850mのトンネルに入り始めてから完全に出るまで何秒かかるか。",
 ch:["40秒","45秒","50秒","60秒"],a:2,
 ex:["時速72km = 72000 ÷ 3600 = 20m/秒","進む距離 = 850 + 150 = 1000m","1000 ÷ 20 = 50秒"]},

/* ---------- 確率 ---------- */
{id:"kakuritsu1",c:"kakuritsu",q:"サイコロを2回投げたとき、出た目の和が7になる確率はいくらか。",
 ch:["1/6","1/9","5/36","1/12"],a:0,
 ex:["全事象 = 6 × 6 = 36通り","和が7 = (1,6)(2,5)(3,4)(4,3)(5,2)(6,1) の6通り","6/36 = 1/6"]},
{id:"kakuritsu2",c:"kakuritsu",q:"コインを3回投げたとき、3回ともすべて表が出る確率はいくらか。",
 ch:["1/8","1/6","1/4","3/8"],a:0,
 ex:["各回 表の確率 = 1/2","1/2 × 1/2 × 1/2 = 1/8"]},
{id:"kakuritsu3",c:"kakuritsu",q:"赤玉3個と白玉2個が入った袋から1個取り出すとき、赤玉である確率はいくらか。",
 ch:["1/2","2/5","3/5","2/3"],a:2,
 ex:["全体 = 3 + 2 = 5個","赤 = 3個 → 3/5"]},
{id:"kakuritsu4",c:"kakuritsu",q:"1から10までの番号札が1枚ずつある。1枚引いたとき、偶数または3の倍数である確率はいくらか。",
 ch:["1/2","3/5","7/10","4/5"],a:2,
 ex:["偶数 {2,4,6,8,10} = 5個, 3の倍数 {3,6,9} = 3個","6 が重複 → 5 + 3 − 1 = 7個","7/10"]},
{id:"kakuritsu5",c:"kakuritsu",q:"当たり2本、はずれ8本の合計10本のくじから同時に2本引くとき、2本とも当たりである確率はいくらか。",
 ch:["1/45","1/40","1/25","2/45"],a:0,
 ex:["全体 = C(10,2) = 45通り","2本とも当たり = C(2,2) = 1通り","1/45"]},
{id:"kakuritsu6",c:"kakuritsu",q:"サイコロを1回投げたとき、偶数の目が出る確率はいくらか。",
 ch:["1/3","1/2","2/3","1/6"],a:1,
 ex:["偶数 = {2,4,6} の3通り","3/6 = 1/2"]},
{id:"kakuritsu7",c:"kakuritsu",q:"赤玉4個と白玉6個が入った袋から1個取り出すとき、白玉である確率はいくらか。",
 ch:["2/5","1/2","3/5","2/3"],a:2,
 ex:["全体 = 4 + 6 = 10個","白 = 6個 → 6/10 = 3/5"]},
{id:"kakuritsu8",c:"kakuritsu",q:"コインを2回投げたとき、少なくとも1回は表が出る確率はいくらか。",
 ch:["1/2","2/3","3/4","1/4"],a:2,
 ex:["余事象 = 2回とも裏 = 1/2 × 1/2 = 1/4","1 − 1/4 = 3/4"]},
{id:"kakuritsu9",c:"kakuritsu",q:"サイコロを2回投げたとき、2回とも同じ目（ゾロ目）が出る確率はいくらか。",
 ch:["1/6","1/9","1/12","5/36"],a:0,
 ex:["全事象 = 36通り","ゾロ目 = (1,1)…(6,6) の6通り","6/36 = 1/6"]},
{id:"kakuritsu10",c:"kakuritsu",q:"当たり3本、はずれ7本の合計10本のくじから1本引くとき、当たりである確率はいくらか。",
 ch:["3/10","1/3","3/7","7/10"],a:0,
 ex:["当たり = 3本、全体 = 10本","3/10"]},

/* ---------- 順列・組み合わせ ---------- */
{id:"junretsu1",c:"junretsu",q:"5人の中から3人を選んで1列に並べる方法は何通りあるか。",
 ch:["10通り","20通り","60通り","120通り"],a:2,
 ex:["順列 P(5,3) = 5 × 4 × 3","= 60通り"]},
{id:"junretsu2",c:"junretsu",q:"7人の中から3人を選ぶ組み合わせは何通りあるか。",
 ch:["21通り","35通り","42通り","70通り"],a:1,
 ex:["C(7,3) = (7×6×5)/(3×2×1)","= 210 / 6 = 35通り"]},
{id:"junretsu3",c:"junretsu",q:"男子3人、女子2人の計5人を1列に並べる方法は何通りあるか。",
 ch:["60通り","120通り","240通り","720通り"],a:1,
 ex:["5人を1列 = 5! = 5×4×3×2×1","= 120通り"]},
{id:"junretsu4",c:"junretsu",q:"異なる4個の文字から2個を選ぶ組み合わせは何通りあるか。",
 ch:["4通り","6通り","12通り","24通り"],a:1,
 ex:["C(4,2) = (4×3)/(2×1)","= 6通り"]},
{id:"junretsu5",c:"junretsu",q:"0,1,2,3,4 の5枚のカードから異なる3枚を使って3桁の整数を作る。全部で何通りか。",
 ch:["48通り","60通り","100通り","120通り"],a:0,
 ex:["百の位は0以外 → 4通り","十の位は残り4通り、一の位は残り3通り","4 × 4 × 3 = 48通り"]},
{id:"junretsu6",c:"junretsu",q:"6人の中から2人を選ぶ組み合わせは何通りあるか。",
 ch:["12通り","15通り","18通り","30通り"],a:1,
 ex:["C(6,2) = (6×5)/(2×1)","= 30 / 2 = 15通り"]},
{id:"junretsu7",c:"junretsu",q:"4人を1列に並べる方法は何通りあるか。",
 ch:["12通り","16通り","24通り","36通り"],a:2,
 ex:["4! = 4 × 3 × 2 × 1","= 24通り"]},
{id:"junretsu8",c:"junretsu",q:"赤・青・黄の3色から2色を選ぶ組み合わせは何通りあるか。",
 ch:["2通り","3通り","6通り","9通り"],a:1,
 ex:["C(3,2) = (3×2)/(2×1)","= 3通り"]},
{id:"junretsu9",c:"junretsu",q:"8人の中から委員長と副委員長を1人ずつ選ぶ方法は何通りあるか。",
 ch:["16通り","28通り","56通り","64通り"],a:2,
 ex:["役割が異なるので順列 P(8,2) = 8 × 7","= 56通り"]},
{id:"junretsu10",c:"junretsu",q:"1,2,3,4 の4枚のカードから異なる2枚を使って2桁の整数を作る。全部で何通りか。",
 ch:["9通り","12通り","16通り","20通り"],a:1,
 ex:["十の位は4通り、一の位は残り3通り","4 × 3 = 12通り"]},

/* ---------- 推論 ---------- */
{id:"suiron1",c:"suiron",q:"A・B・C・D の4人がゴールした順について、次のことがわかっている。\n・A は B より先にゴールした\n・C は A より先にゴールした\n・B は D より先にゴールした\nこのとき、1位は誰か。",
 ch:["A","B","C","D"],a:2,
 ex:["C は A より先 → C < A","A は B より先 → A < B、B は D より先 → B < D","まとめると C < A < B < D","1位は C"]},
{id:"suiron2",c:"suiron",q:"赤・青・白の玉が合わせて12個ある。次のことがわかっている。\n・白は4個\n・赤は青より2個多い\nこのとき、赤は何個か。",
 ch:["4個","5個","6個","7個"],a:1,
 ex:["赤 + 青 = 12 − 4(白) = 8","赤 = 青 + 2 なので 青 + 2 + 青 = 8","青 = 3、赤 = 5個"]},
{id:"suiron3",c:"suiron",q:"ある箱にリンゴとミカンが入っている。「リンゴは5個以上ある」ことだけがわかっている。次のうち、必ず正しいといえるものはどれか。",
 ch:["リンゴはちょうど5個である","リンゴは4個以下である","リンゴは少なくとも5個ある","ミカンは5個ある"],a:2,
 ex:["「5個以上」= 5個かそれより多い","= 「少なくとも5個ある」と同じ意味","個数が確定するわけではないので他は断定できない"]},
{id:"suiron4",c:"suiron",q:"P・Q・R・S の4人の身長について、次のことがわかっている。\n・P は Q より高い\n・R は S より高い\n・Q は R より高い\n最も背が高いのは誰か。",
 ch:["P","Q","R","S"],a:0,
 ex:["P > Q、Q > R、R > S","つなげると P > Q > R > S","最も高いのは P"]},
{id:"suiron5",c:"suiron",q:"5人（A〜E）が1列に並んでいる。\n・A は先頭から3番目\n・B は A のすぐ後ろ\n・C は B のすぐ後ろ\nこのとき、C は先頭から何番目か。",
 ch:["3番目","4番目","5番目","判断できない"],a:2,
 ex:["A = 3番目","B は A のすぐ後ろ → 4番目","C は B のすぐ後ろ → 5番目"]},
{id:"suiron6",c:"suiron",q:"3人が受けたテストの平均点は70点だった。A は65点、B は80点である。C は何点か。",
 ch:["60点","65点","70点","75点"],a:1,
 ex:["3人の合計 = 70 × 3 = 210点","C = 210 − 65 − 80","= 65点"]},
{id:"suiron7",c:"suiron",q:"A〜E の5人がマラソンをした。\n・A は1位だった\n・B は A のすぐ後にゴールした\n・D は5位（最下位）だった\nB は何位か。",
 ch:["2位","3位","4位","判断できない"],a:0,
 ex:["A が1位","B は A のすぐ後 → 2位"]},
{id:"suiron8",c:"suiron",q:"X・Y・Z の3人が、赤・青・緑の帽子を1つずつかぶっている（色の重複なし）。\n・X は赤ではない\n・Y は青である\nこのとき、Z の帽子は何色か。",
 ch:["赤","青","緑","判断できない"],a:0,
 ex:["Y は青","X は赤でも青（Yが使用）でもない → X は緑","残った赤が Z"]},

/* ---------- 熟語（意味） ---------- */
{id:"jukugo1",c:"jukugo",q:"「一石二鳥」の意味として最も適切なものはどれか。",
 ch:["非常に危険な状況のこと","1つの行為で同時に2つの利益を得ること","二者のうち一方を選ぶこと","少しの努力で大きく失敗すること"],a:1,
 ex:["一石二鳥＝1つの石で2羽の鳥を落とす","→ 1つの行為で2つの利益を得るたとえ"]},
{id:"jukugo2",c:"jukugo",q:"「温故知新」の意味として最も適切なものはどれか。",
 ch:["古いものを捨てて新しくすること","古い友人と再会すること","昔のことを研究し、そこから新しい知識や道理を得ること","新旧を比べて優劣をつけること"],a:2,
 ex:["故（ふる）きを温（たず）ねて新しきを知る","→ 過去を学び、新たな理解を得る"]},
{id:"jukugo3",c:"jukugo",q:"「五里霧中」の意味として最も適切なものはどれか。",

 ex:["深い霧の中で方向がわからない様子","→ 見通しが立たず迷うこと"]},
{id:"jukugo4",c:"jukugo",q:"「本末転倒」の意味として最も適切なものはどれか。",

{id:"jukugo5",c:"jukugo",q:"「以心伝心」の意味として最も適切なものはどれか。",
 ch:["言葉で丁寧に説明すること","心を入れ替えて反省すること","言葉にしなくても互いの気持ちが通じ合うこと","手紙で気持ちを伝えること"],a:2,

{id:"jukugo6",c:"jukugo",q:"「臨機応変」の意味として最も適切なものはどれか。",
 ch:["規則どおりに行動すること","その場に応じて柔軟に対応すること","急いで物事を行うこと","臨時に休むこと"],a:1,

{id:"jukugo7",c:"jukugo",q:"「異口同音」の意味として最も適切なものはどれか。",
 ch:["意見がばらばらであること","多くの人が口をそろえて同じことを言うこと","口論が絶えないこと","声が非常に大きいこと"],a:1,

{id:"jukugo8",c:"jukugo",q:"「切磋琢磨」の意味として最も適切なものはどれか。",
 ch:["厳しく叱りつけること","互いに励まし競い合って向上すること","ひとりで黙々と努力すること","細かく分けて考えること"],a:1,
 ex:["学問や人格を磨き合う様子","→ 互いに競い合って高め合うこと"]},
{id:"jukugo9",c:"jukugo",q:"「大同小異」の意味として最も適切なものはどれか。",
 ch:["まったく異なること","大きく食い違っていること","細部は違うが、だいたい同じであること","少数が多数に従うこと"],a:2,
 ex:["大きくは同じ、小さな部分だけ異なる","→ ほとんど同じであること"]},
{id:"jukugo10",c:"jukugo",q:"「花鳥風月」の意味として最も適切なものはどれか。",
 ch:["季節の変わり目のこと","自然の美しい風物・風景のこと","はなやかで贅沢な生活のこと","花や鳥を育てる趣味のこと"],a:1,
 ex:["花・鳥・風・月＝自然の美しいもの","→ 自然の美しい景色や風流のこと"]},
{id:"jukugo11",c:"jukugo",q:"「有言実行」の意味として最も適切なものはどれか。",
 ch:["言わずに黙って行動すること","言ったことを責任を持って実行すること","言うだけで実行しないこと","計画を立ててから行動すること"],a:1,
 ex:["口にした（有言）ことをやり遂げる（実行）","→ 言ったことを実行に移すこと"]},
{id:"jukugo12",c:"jukugo",q:"「自業自得」の意味として最も適切なものはどれか。",
 ch:["自分の努力で成功すること","他人のせいで損をすること","自分の行いの報いを自分が受けること","仕事を自分一人でこなすこと"],a:2,
 ex:["自分の業（行い）の結果を自分が得る","→ 自分の行いの報いを自分が受ける"]},
{id:"jukugo13",c:"jukugo",q:"「試行錯誤」の意味として最も適切なものはどれか。",
 ch:["最初から正解を知っていること","失敗を重ねながら解決方法を見つけていくこと","何度も同じ失敗をすること","他人の方法をまねること"],a:1,
 ex:["試みと失敗（錯誤）を繰り返す","→ 失敗を重ねつつ解決策を探ること"]},
{id:"jukugo14",c:"jukugo",q:"「因果応報」の意味として最も適切なものはどれか。",

 ex:["行い（因）に応じた報い（果）がある","→ 行いの善悪に応じた結果が返ること"]},
{id:"jukugo15",c:"jukugo",q:"「我田引水」の意味として最も適切なものはどれか。",
 ch:["自分の都合のいいように物事を進めること","水不足で困ること","協力して物事を行うこと","他人に利益を譲ること"],a:0,
 ex:["自分の田にだけ水を引く","→ 自分に都合よく取り計らうこと"]},
{id:"jukugo16",c:"jukugo",q:"「油断大敵」の意味として最も適切なものはどれか。",
 ch:["強い敵には勝てないということ","気をゆるめると思わぬ失敗をするので注意が必要だということ","油を大切に使うべきだということ","敵は多いほどよいということ"],a:1,
 ex:["油断は大きな敵になる","→ 気のゆるみが失敗を招くので注意せよ"]},
{id:"jukugo17",c:"jukugo",q:"「一期一会」の意味として最も適切なものはどれか。",
 ch:["一度会った人とは二度と会わないこと","一生に一度の出会いを大切にすること","会議は一度で済ませること","一人で過ごす時間のこと"],a:1,
 ex:["一生に一度の機会（一期一会）","→ その出会いを大切にする心構え"]},
{id:"jukugo18",c:"jukugo",q:"「電光石火」の意味として最も適切なものはどれか。",
 ch:["動作などが非常にすばやいこと","光るものが美しいこと","危険が迫っていること","怒って激しく叱ること"],a:0,
 ex:["稲光や火花が一瞬で光る様子","→ 動作が非常にすばやいこと"]},
{id:"jukugo19",c:"jukugo",q:"「空前絶後」の意味として最も適切なものはどれか。",
 ch:["前後が見えないほど暗いこと","過去にも例がなく今後もないほど珍しいこと","前にも後ろにも進めないこと","何もない空っぽの状態のこと"],a:1,
 ex:["以前に例がなく（空前）、以後もない（絶後）","→ きわめて珍しいこと"]},
{id:"jukugo20",c:"jukugo",q:"「取捨選択」の意味として最も適切なものはどれか。",
 ch:["何でも手に入れようとすること","よいものを取り、不要なものを捨てて選ぶこと","すべてを捨ててしまうこと","他人に選ばせること"],a:1,
 ex:["取るものと捨てるものを選ぶ","→ 必要なものを選び取ること"]},

{id:"taigigo3",c:"taigigo",q:"「具体」の対義語として正しいものはどれか。",

{id:"taigigo4",c:"taigigo",q:"「原因」の対義語として正しいものはどれか。",

{id:"taigigo5",c:"taigigo",q:"「義務」の対義語として正しいものはどれか。",

function ri(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
// 正解＋ダミー選択肢を作る（重複を除き4択に整える）
function pickChoices(correct, cands, fmt){
  const u=[];
  for(const v of cands){ const n=Math.round(v);
    if(Number.isFinite(n) && n>0 && n!==correct && !u.includes(n)){ u.push(n); }
    if(u.length>=3) break;
  }
  let k=1;
  while(u.length<3 && k<correct+200){
    for(const v of [correct+k, correct-k]){ if(v>0 && v!==correct && !u.includes(v)){ u.push(v); if(u.length>=3) break; } }
    k++;
  }
  return {ch:[correct,u[0],u[1],u[2]].map(fmt), a:0};
}

function genShugou(){
  const both=ri(5,18), onlyA=ri(6,22), onlyB=ri(6,22), neither=ri(3,14);
  const A=onlyA+both, B=onlyB+both, N=onlyA+onlyB+both+neither, union=onlyA+onlyB+both;
  const t=pick([["英語","数学"],["犬","猫"],["コーヒー","紅茶"],["野球","サッカー"],["映画","音楽"]]);
  const ch=pickChoices(neither,[N-A-B,both,union,neither+both,neither+ri(1,4),neither+ri(5,9)],v=>v+"人");
  return {q:`${N}人のうち、${t[0]}が好きな人は${A}人、${t[1]}が好きな人は${B}人、両方好きな人は${both}人である。どちらも好きではない人は何人か。`,
    ch:ch.ch, a:ch.a,
    ex:[`少なくとも一方が好き = ${A} + ${B} − ${both} = ${union}人`, `どちらも好きではない = ${N} − ${union} = ${neither}人`]};
}
function genWariai(){
  if(Math.random()<0.5){
    const base=ri(10,40)*100, r=pick([0.2,0.3,0.4,0.5]), price=Math.round(base*(1+r));
    const ch=pickChoices(base,[price,Math.round(price*(1-r)),Math.round(base*(1+r*2)),base+100,base-100,base+200],v=>v+"円");
    return {q:`ある品物の定価は原価の${r*10}割増しである。定価が${price}円のとき、原価はいくらか。`,
      ch:ch.ch, a:ch.a,
      ex:[`原価を x とすると (1 + ${r}) × x = ${price}`, `x = ${price} ÷ ${1+r} = ${base}円`]};
  }else{
    const p=pick([20,25,40,50,60,75]), whole=pick([200,240,300,400,500,600,800]), part=whole*p/100;
    const t=pick([["女性","全体"],["男子","全校生徒"],["合格者","受験者"]]);
    const ch=pickChoices(whole,[part,part*2,Math.round(part/(p/100)/2),whole+(whole>=300?100:50),whole-(whole>=300?100:50),Math.round(whole*1.2)],v=>v+"人");
    return {q:`ある集団の${p}%が${t[0]}で、${t[0]}は${part}人である。${t[1]}は何人か。`,
      ch:ch.ch, a:ch.a,
      ex:[`${t[1]} × ${p/100} = ${part}`, `${t[1]} = ${part} ÷ ${p/100} = ${whole}人`]};
  }
}
function genSoneki(){
  const C=ri(5,30)*100, m=pick([0.3,0.4,0.5]), d=pick([0.1,0.2]);
  const price=Math.round(C*(1+m)), sell=Math.round(price*(1-d)), profit=sell-C;
  const ch=pickChoices(profit,[Math.round(C*m),price-C,Math.round(C*(m-d)),profit+ri(20,60),profit+ri(61,120),Math.max(1,profit-ri(20,60))],v=>v+"円");
  return {q:`原価${C}円の商品に${m*10}割の利益を見込んで定価をつけ、定価の${d*10}割引で売った。利益はいくらか。`,
    ch:ch.ch, a:ch.a,
    ex:[`定価 = ${C} × ${(1+m).toFixed(1)} = ${price}円`, `売価 = ${price} × ${(1-d).toFixed(1)} = ${sell}円`, `利益 = ${sell} − ${C} = ${profit}円`]};
}
function genShigoto(){
  const pairs=[[6,12],[10,15],[20,30],[6,3],[4,12],[12,24],[10,40],[9,18],[8,8],[6,6],[15,10],[30,20],[12,6],[20,5],[12,4],[3,6],[18,9],[24,8]];
  const pr=pick(pairs), a=pr[0], b=pr[1], tog=Math.round(a*b/(a+b));
  const work=Math.random()<0.5, unit=work?"日":"分";
  const q=work
    ? `ある仕事を A は${a}${unit}、B は${b}${unit}で終える。2人で一緒にすると何${unit}で終わるか。`
    : `水そうを満たすのに、管 A では${a}${unit}、管 B では${b}${unit}かかる。両方同時に使うと何${unit}で満たせるか。`;
  const ch=pickChoices(tog,[a+b,Math.abs(a-b)||tog+2,Math.round((a+b)/2),tog+ri(1,3),tog+ri(4,7),Math.max(1,tog-ri(1,3))],v=>v+unit);
  return {q, ch:ch.ch, a:ch.a,
    ex:[`全体を1とすると 1${unit}あたり = 1/${a} + 1/${b} = ${a+b}/${a*b}`, `かかる${unit}数 = ${a*b} ÷ ${a+b} = ${tog}${unit}`]};
}
function genTabibito(){
  if(Math.random()<0.5){
    const s1=pick([50,60,70,80,90]), s2=pick([40,50,60,70,80]), t=ri(8,20), D=(s1+s2)*t;
    const ch=pickChoices(t,[Math.round(D/s1),Math.round(D/s2),Math.round(D/(Math.abs(s1-s2)||1)),t+ri(1,3),t+ri(4,8),Math.max(1,t-ri(1,3))],v=>v+"分後");
    return {q:`${D}m離れた2地点から、2人が向かい合って同時に出発した。1人は分速${s1}m、もう1人は分速${s2}m。2人が出会うのは何分後か。`,
      ch:ch.ch, a:ch.a,
      ex:[`2人は1分で ${s1} + ${s2} = ${s1+s2}m 近づく`, `出会う時間 = ${D} ÷ ${s1+s2} = ${t}分後`]};
  }else{
    const D=pick([1200,1800,2400,3600]);
    const divs=[40,50,60,80,90,100,120,150].filter(v=>D%v===0);
    const v1=pick(divs); let v2=pick(divs), tries=0; while(v2===v1 && tries<12){ v2=pick(divs); tries++; }
    const t1=D/v1, t2=D/v2;
    const ch=pickChoices(t2,[t1,2*t2,t2+ri(1,3),t2+ri(4,8),Math.max(1,t2-ri(1,4)),t1+ri(1,3)],v=>v+"分");
    return {q:`分速${v1}mで歩くと${t1}分かかる道のりを、分速${v2}mで行くと何分かかるか。`,
      ch:ch.ch, a:ch.a,
      ex:[`道のり = ${v1} × ${t1} = ${D}m`, `時間 = ${D} ÷ ${v2} = ${t2}分`]};
  }
}

// 分数・順列組み合わせ用ヘルパー
function gcd(a,b){ return b ? gcd(b,a%b) : a; }
function frac(n,d){ const g=gcd(n,d)||1; n/=g; d/=g; return d===1 ? (""+n) : (n+"/"+d); }
function fact(n){ let r=1; for(let i=2;i<=n;i++) r*=i; return r; }
function perm(n,r){ let x=1; for(let i=0;i<r;i++) x*=(n-i); return x; }
function comb(n,r){ return Math.round(perm(n,r)/fact(r)); }
function permStr(n,r){ const a=[]; for(let i=0;i<r;i++) a.push(n-i); return a.join(" × "); }
function factStr(n){ const a=[]; for(let i=n;i>=1;i--) a.push(i); return a.join(" × "); }
// 文字列（分数）選択肢を重複なく4つに整える
function uniqChoices(correct, cands){
  const u=[correct];
  for(const c of cands){ if(!u.includes(c)) u.push(c); if(u.length>=4) break; }
  let i=5;
  while(u.length<4){ const extra="1/"+i; if(!u.includes(extra)) u.push(extra); i++; }
  return {ch:u, a:0};
}

function genKakuritsu(){
  const t=ri(1,3);
  if(t===1){
    const s=pick([4,5,6,7,8,9,10]);
    const cnt={4:3,5:4,6:5,7:6,8:5,9:4,10:3}[s];
    const correct=frac(cnt,36);
    const ch=uniqChoices(correct,[frac(cnt+1,36),frac(Math.max(1,cnt-1),36),"1/6","1/12","1/9","5/36","1/18"]);
    return {q:`サイコロを2回投げたとき、出た目の和が${s}になる確率はいくらか。`, ch:ch.ch, a:ch.a,
      ex:["全事象 = 6 × 6 = 36通り", `和が${s}になるのは ${cnt}通り`, `${cnt}/36 = ${correct}`]};
  }else if(t===2){
    const r=ri(2,6), w=ri(2,8), askRed=Math.random()<0.5;
    const correct=askRed?frac(r,r+w):frac(w,r+w);
    const ch=uniqChoices(correct,[askRed?frac(w,r+w):frac(r,r+w),"1/2","1/3","2/5","3/5","2/3","1/4","3/4"]);
    return {q:`赤玉${r}個と白玉${w}個が入った袋から1個取り出すとき、${askRed?"赤":"白"}玉である確率はいくらか。`, ch:ch.ch, a:ch.a,
      ex:[`全体 = ${r} + ${w} = ${r+w}個`, `${askRed?"赤":"白"}玉は ${askRed?r:w}個 → ${askRed?r:w}/${r+w} = ${correct}`]};
  }else{
    const n=ri(2,4), correct=frac(1,Math.pow(2,n));
    const ch=uniqChoices(correct,[frac(1,Math.pow(2,n-1)),frac(1,Math.pow(2,n+1)),frac(n,Math.pow(2,n)),"1/2","3/8","1/6"]);
    return {q:`コインを${n}回投げたとき、${n}回ともすべて表が出る確率はいくらか。`, ch:ch.ch, a:ch.a,
      ex:["各回、表が出る確率 = 1/2", `(1/2) を ${n}回かける = 1/${Math.pow(2,n)} = ${correct}`]};
  }
}
function genJunretsu(){
  const t=ri(1,3);
  if(t===1){
    const n=ri(4,7), r=pick([2,3]), correct=perm(n,r);
    const ch=pickChoices(correct,[comb(n,r),fact(n),Math.round(correct/2),perm(n,r-1),correct+n,correct*2],v=>v+"通り");
    return {q:`${n}人の中から${r}人を選んで1列に並べる方法は何通りあるか。`, ch:ch.ch, a:ch.a,
      ex:[`順列 P(${n},${r}) = ${permStr(n,r)}`, `= ${correct}通り`]};
  }else if(t===2){
    const n=ri(4,8), r=pick([2,3]), correct=comb(n,r);
    const ch=pickChoices(correct,[perm(n,r),correct*2,fact(r)*2,correct+n,Math.max(1,comb(n-1,r)),correct+ri(2,6)],v=>v+"通り");
    return {q:`${n}人の中から${r}人を選ぶ組み合わせは何通りあるか。`, ch:ch.ch, a:ch.a,
      ex:[`組み合わせ C(${n},${r}) = (${permStr(n,r)}) ÷ (${factStr(r)})`, `= ${correct}通り`]};
  }else{
    const n=ri(3,5), correct=fact(n);
    const ch=pickChoices(correct,[fact(n-1),perm(n,2),Math.round(correct/2),correct*2,fact(n+1)],v=>v+"通り");
    return {q:`${n}人を1列に並べる方法は何通りあるか。`, ch:ch.ch, a:ch.a,
      ex:[`${n}! = ${factStr(n)}`, `= ${correct}通り`]};
  }
}

// 選択肢をシャッフルして正解indexを付け替える
function shuffleChoices(inst){
  const order = shuffle(inst.ch.map((_,i)=>i));
  inst.ch = order.map(i=>inst.ch[i]);
  inst.a = order.indexOf(inst.a);
}
// baseId から出題インスタンスを1つ作る（生成問題は毎回新しい数字）
function makeInstance(baseId){
  const base = Q_BY_ID[baseId];
  const d = base.gen ? base.gen() : {q:base.q, ch:base.ch, ex:base.ex, a:base.a};
  const inst = {id:base.id, c:base.c, q:d.q, ch:d.ch.slice(), a:d.a, ex:d.ex.slice()};
  shuffleChoices(inst);
  return inst;
}
// 選ばれたカテゴリの問題から n 問のインスタンス列を作る
function buildInstances(poolIds, n){
  const statics = poolIds.filter(id=>!Q_BY_ID[id].gen);
  const gens = poolIds.filter(id=>Q_BY_ID[id].gen);
  const seq = shuffle(statics.concat(gens));
  const out = [];
  for(let i=0;i<seq.length && out.length<n;i++) out.push(makeInstance(seq[i]));
  if(gens.length){ while(out.length<n) out.push(makeInstance(pick(gens))); }
  return out;
}

function poolQuestions(){ return QUESTIONS.filter(q=>selectedCats.has(q.c)); }

  const genN = qs.filter(q=>q.gen).length;

/* ==========================================================================
   クイズ（練習／模擬テスト共通）
   ========================================================================== */
let session = null;
let qTimer = null;

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function startSession(mode, ids, n){
  const queue = buildInstances(ids, n!=null ? n : ids.length);
  session = { mode, queue, idx:0, selected:null, locked:false, answers:[], start:Date.now() };
  show("quiz");
  document.getElementById("q-notice").classList.toggle("hidden", mode!=="test");
  renderQuestion();
}

document.getElementById("startBtn").onclick = ()=>{
  const ids = poolQuestions().map(q=>q.id);
  startSession(selectedMode, ids, testCount);
};

function renderQuestion(){
  clearInterval(qTimer);
  session.selected = null;
  session.locked = false;
  const q = session.queue[session.idx];
  const total = session.queue.length;

  document.getElementById("q-cat").textContent = CATS[q.c].label;
  document.getElementById("q-prog").textContent = "問 " + (session.idx+1) + " / " + total;
  document.getElementById("q-pbar").style.width = ((session.idx)/total*100) + "%";
  document.getElementById("q-text").textContent = q.q;
  document.getElementById("q-feedback").innerHTML = "";

  const labels = ["A","B","C","D"];
  const choicesBox = document.getElementById("q-choices");
  choicesBox.innerHTML = "";
  q.ch.forEach((text,i)=>{
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = '<span class="mk">'+labels[i]+'</span><span>'+escapeHtml(text)+'</span>';
    btn.onclick = ()=>onChoice(i);
    choicesBox.appendChild(btn);
  });

  // timer (test only)
  const timerEl = document.getElementById("q-timer");
  if(session.mode==="test"){
    timerEl.classList.remove("hidden");
    let remain = CATS[q.c].time;
    const tick = ()=>{
      const m = Math.floor(remain/60), s = remain%60;
      timerEl.textContent = "⏱ " + m + ":" + String(s).padStart(2,"0");
      timerEl.classList.toggle("low", remain<=10);
      if(remain<=0){ clearInterval(qTimer); submitTest(true); return; }
      remain--;
    };
    tick();
    qTimer = setInterval(tick,1000);
  }else{
    timerEl.classList.add("hidden");
  }

  renderActions();
}

function renderActions(){
  const box = document.getElementById("q-actions");
  box.innerHTML = "";
  if(session.mode==="test"){
    const submit = document.createElement("button");
    submit.className = "btn";
    submit.textContent = (session.idx===session.queue.length-1) ? "回答を送信して終了" : "回答を送信 →";
    submit.disabled = session.selected===null;
    submit.onclick = ()=>submitTest(false);
    box.appendChild(submit);
  }else{
    if(session.locked){
      const next = document.createElement("button");
      next.className = "btn";
      next.textContent = (session.idx===session.queue.length-1) ? "結果を見る" : "次の問題 →";
      next.onclick = advance;
      box.appendChild(next);
    }
  }
}

function onChoice(i){
  if(session.locked) return;
  if(session.mode==="practice"){
    // 練習：即ロック＋解説
    session.selected = i;
    session.locked = true;
    revealPractice(i);
    recordAnswer(i);
  }else{
    // テスト：選択のみ（送信前は変更可）
    session.selected = i;
    const btns = document.querySelectorAll("#q-choices .choice");
    btns.forEach((b,idx)=>b.classList.toggle("sel", idx===i));
    renderActions();
  }
}

function revealPractice(chosen){
  const q = session.queue[session.idx];
  const btns = document.querySelectorAll("#q-choices .choice");
  btns.forEach((b,idx)=>{
    b.classList.add("locked");
    if(idx===q.a) b.classList.add("correct");
    else if(idx===chosen) b.classList.add("wrong");
  });
  const correct = chosen===q.a;
  const fb = document.getElementById("q-feedback");
  fb.innerHTML =
    '<div class="verdict '+(correct?"ok":"ng")+'">'+(correct?"◎ 正解！":"✕ 不正解")+'</div>'+
    '<div class="explain"><div class="et">解説</div><ol>'+
      q.ex.map(s=>"<li>"+escapeHtml(s)+"</li>").join("")+
    '</ol><div style="margin-top:8px;font-size:13px;color:var(--ink-soft);">正解：'+["A","B","C","D"][q.a]+'　'+escapeHtml(q.ch[q.a])+'</div></div>';
  renderActions();
}

function submitTest(timeout){
  if(session.locked) return;
  session.locked = true;
  clearInterval(qTimer);
  recordAnswer(timeout && session.selected===null ? null : session.selected);
  advance();
}

function recordAnswer(chosen){
  const q = session.queue[session.idx];
  const correct = chosen===q.a;
  session.answers.push({inst:q, chosen, correct});

  // 統計
  stats.answered++;
  if(correct) stats.correct++;
  if(!stats.perCat[q.c]) stats.perCat[q.c] = {a:0,c:0};
  stats.perCat[q.c].a++;
  if(correct) stats.perCat[q.c].c++;
  save(LS.stats, stats);

  // 錯題本（インスタンスのスナップショットを保存）
  if(correct){ if(wrong[q.id]) delete wrong[q.id]; }
  else { wrong[q.id] = {inst:q, count:((wrong[q.id]&&wrong[q.id].count)||0)+1}; }
  save(LS.wrong, wrong);
}

function advance(){
  if(session.idx < session.queue.length-1){
    session.idx++;
    renderQuestion();
  }else{
    finish();
  }
}

document.getElementById("quitQuiz").onclick = ()=>{
  if(confirm("中断してホームに戻りますか？（ここまでの回答は記録されています）")){
    clearInterval(qTimer); goHome();
  }
};

/* ==========================================================================
   結果画面
   ========================================================================== */
function finish(){
  clearInterval(qTimer);
  const ans = session.answers;
  const correct = ans.filter(a=>a.correct).length;
  const total = ans.length;
  const pct = total? Math.round(correct/total*100) : 0;
  const secs = Math.round((Date.now()-session.start)/1000);

  document.getElementById("r-title").textContent =
    (session.mode==="test" ? "模擬テスト 結果" : "練習 結果");
  document.getElementById("r-score").textContent = pct + "点";
  document.getElementById("r-sub").textContent = correct + " / " + total + " 問正解";
  document.getElementById("r-correct").textContent = correct;
  document.getElementById("r-wrong").textContent = total - correct;
  document.getElementById("r-time").textContent = fmtTime(secs);

  const wrongAns = ans.filter(a=>!a.correct);
  const listCard = document.getElementById("r-wronglist-card");
  const list = document.getElementById("r-wronglist");
  if(wrongAns.length===0){
    listCard.style.display = "none";
  }else{
    listCard.style.display = "";
    list.innerHTML = wrongAns.map(a=>wrongItemHtml(a.inst, a.chosen)).join("");
  }
  document.getElementById("r-export").value = buildExport(wrongAns.map(a=>({inst:a.inst, chosen:a.chosen})));

  // redo button
  document.getElementById("r-redo").style.display = wrongAns.length? "" : "none";
  document.getElementById("r-redo").onclick = ()=>{ const ids = wrongAns.map(a=>a.inst.id); startSession("practice", ids, ids.length); };

  show("result");
}

function wrongItemHtml(q, chosen){
  const L = ["A","B","C","D"];
  const you = chosen===null||chosen===undefined ? "未回答" : (L[chosen]+" "+q.ch[chosen]);
  return '<div class="wrong-item">'+
    '<div class="wq"><span class="tag">'+CATS[q.c].label+'</span> '+escapeHtml(q.q.split("\n")[0])+'</div>'+
    '<div class="wa"><span class="you">あなた：'+escapeHtml(you)+'</span>　/　<span class="ans">正解：'+L[q.a]+' '+escapeHtml(q.ch[q.a])+'</span></div>'+
    '<div class="explain" style="margin-top:8px;"><div class="et">解説</div><ol>'+q.ex.map(s=>"<li>"+escapeHtml(s)+"</li>").join("")+'</ol></div>'+
    '</div>';
}

function buildExport(items){
  if(items.length===0) return "間違えた問題はありません。";
  const L = ["A","B","C","D"];
  let out = "===== SPI 間違えた問題リスト =====\n（"+new Date().toLocaleString("ja-JP")+"）\n\n";
  items.forEach((it,n)=>{
    const q = it.inst;
    out += "【"+(n+1)+"】["+CATS[q.c].label+"]\n";
    out += q.q + "\n";
    q.ch.forEach((c,i)=> out += "  "+L[i]+". "+c+"\n");
    const you = (it.chosen===null||it.chosen===undefined) ? "未回答" : L[it.chosen];
    out += "  あなたの回答：" + you + "\n";
    out += "  正解：" + L[q.a] + "（"+q.ch[q.a]+"）\n";
    out += "  解説：" + q.ex.join(" / ") + "\n\n";
  });
  return out;
}

/* ==========================================================================
   草稿メモ（キャンバス）
   ========================================================================== */
const pad = document.getElementById("padOverlay");
const canvas = document.getElementById("padCanvas");
const ctx = canvas.getContext("2d");
let drawing = false, eraser = false, lastX=0, lastY=0, canvasInit=false;

function sizeCanvas(){
  const prev = canvasInit ? ctx.getImageData(0,0,canvas.width,canvas.height) : null;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width; canvas.height = rect.height;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  if(prev){ try{ ctx.putImageData(prev,0,0); }catch(e){} }
  canvasInit = true;
}
function posFromEvent(e){
  const r = canvas.getBoundingClientRect();
  const p = (e.touches && e.touches[0]) ? e.touches[0] : e;
  return [p.clientX - r.left, p.clientY - r.top];
}
function startDraw(e){ drawing = true; [lastX,lastY] = posFromEvent(e); e.preventDefault(); }
function moveDraw(e){
  if(!drawing) return;
  const [x,y] = posFromEvent(e);
  ctx.beginPath();
  ctx.moveTo(lastX,lastY); ctx.lineTo(x,y);
  if(eraser){ ctx.strokeStyle = "rgba(0,0,0,1)"; ctx.globalCompositeOperation = "destination-out"; ctx.lineWidth = 22; }
  else { ctx.strokeStyle = "#1c2b3a"; ctx.globalCompositeOperation = "source-over"; ctx.lineWidth = 2.6; }
  ctx.stroke();
  [lastX,lastY] = [x,y];
  e.preventDefault();
}
function endDraw(){ drawing = false; }

canvas.addEventListener("pointerdown", startDraw);
canvas.addEventListener("pointermove", moveDraw);
window.addEventListener("pointerup", endDraw);

document.getElementById("padToggle").onclick = ()=>{
  pad.classList.add("open");
  requestAnimationFrame(sizeCanvas);
};
document.getElementById("t-close").onclick = ()=> pad.classList.remove("open");
document.getElementById("t-pen").onclick = ()=>{ eraser=false; setTool("t-pen"); };
document.getElementById("t-erase").onclick = ()=>{ eraser=true; setTool("t-erase"); };
document.getElementById("t-clear").onclick = ()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); };
function setTool(id){ document.getElementById("t-pen").classList.toggle("on", id==="t-pen"); document.getElementById("t-erase").classList.toggle("on", id==="t-erase"); }
window.addEventListener("resize", ()=>{ if(pad.classList.contains("open")) sizeCanvas(); });

/* ==========================================================================
   共通ユーティリティ
   ========================================================================== */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtTime(sec){ const m = Math.floor(sec/60), s = sec%60; return m>0 ? (m+"分"+s+"秒") : (s+"秒"); }
function copyText(text, btnId){
  const done = ()=>{ const b = document.getElementById(btnId); if(!b) return; const t=b.textContent; b.textContent="✓ コピー完了"; setTimeout(()=>b.textContent=t,1500); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  }else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement("textarea"); ta.value = text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); done(); }catch(e){ alert("コピーできませんでした。手動で選択してください。"); }
  document.body.removeChild(ta);
}
function printText(text){
  const w = window.open("", "_blank");
  if(!w){ alert("印刷ウィンドウを開けませんでした。"); return; }
  w.document.write('<html><head><meta charset="utf-8"><title>SPI 錯題</title><style>body{font-family:sans-serif;white-space:pre-wrap;line-height:1.7;padding:24px;font-size:13px;}</style></head><body>'+escapeHtml(text)+'</body></html>');
  w.document.close(); w.focus(); setTimeout(()=>w.print(), 300);
}
