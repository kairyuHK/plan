<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>シフト管理</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --today-bg: #c2410c;
  --sat-fg: #3b82f6; --sun-fg: #ef4444;
  --header-bg: #0f172a; --header-fg: #ffffff;
  --surface: #ffffff;
  --border: #e2e8f0;
  --text: #1e293b;
  --muted: #64748b;
  --radius: 10px;
}

body {
  font-family: 'Inter', 'Noto Sans JP', sans-serif;
  background: #f0f4f8;
  color: var(--text);
  min-height: 100vh;
}

.app { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }

.app-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 18px; flex-wrap: wrap; gap: 10px;
}
.app-title { font-size: 20px; font-weight: 700; }
.period-badge {
  background: var(--header-bg); color: var(--header-fg);
  padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 500;
  cursor: pointer; user-select: none;
}
.period-badge:hover { opacity: 0.85; }

.period-editor {
  display: none; background: var(--surface); border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 14px 18px; margin-bottom: 14px;
  font-size: 13px; gap: 10px; align-items: center; flex-wrap: wrap;
}
.period-editor.visible { display: flex; }
.period-editor select {
  border: 1.5px solid var(--border); border-radius: 6px; padding: 5px 8px;
  font-size: 13px; background: #f8fafc; font-family: inherit; outline: none;
}

.toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
  cursor: pointer; border: none; transition: opacity 0.15s, transform 0.1s;
  font-family: inherit;
}
.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.97); }
.btn-primary   { background: #1d4ed8; color: #fff; }
.btn-secondary { background: var(--surface); color: var(--muted); border: 1.5px solid var(--border); }
.btn-success   { background: #16a34a; color: #fff; }
.btn-warning   { background: #d97706; color: #fff; }

/* Calendar */
.calendar-wrap {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: 0 1px 4px rgba(0,0,0,0.08); overflow: hidden;
  border: 1px solid var(--border);
}

.calendar { width: 100%; }

.cal-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  border-bottom: 1px solid var(--border);
}
.cal-row:last-child { border-bottom: none; }
.cal-row.month-boundary { border-top: 2.5px solid #94a3b8; }

.cal-head {
  background: var(--header-bg); color: var(--header-fg);
  text-align: center; padding: 10px 4px; font-weight: 700; font-size: 15px;
  border-right: 1px solid rgba(255,255,255,0.08);
}
.cal-head:last-child { border-right: none; }
.cal-head.sun { color: #fca5a5; }
.cal-head.sat { color: #93c5fd; }

.cal-cell {
  border-right: 1px solid var(--border);
  min-height: 90px; padding: 4px 3px;
  display: flex; flex-direction: column; gap: 2px;
}
.cal-cell:last-child { border-right: none; }
.cal-cell.empty { background: #f8fafc; }

/* Date number area — flex row so month prefix sits beside date */
.cal-date-wrap {
  display: flex; align-items: center; justify-content: center; gap: 1px;
  min-height: 22px;
}
.cal-month-prefix {
  font-size: 10px; font-weight: 800; color: #ef4444;
  line-height: 1; flex-shrink: 0;
}
.cal-date-num {
  font-size: 13px; font-weight: 700; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  min-width: 22px; padding: 2px;
}
.cal-cell.sun .cal-date-num { color: var(--sun-fg); }
.cal-cell.sat .cal-date-num { color: var(--sat-fg); }
.cal-cell.today .cal-date-num {
  background: var(--today-bg); color: #fff; border-radius: 50%;
  width: 26px; height: 26px; padding: 0; font-size: 12px;
}

.shift-row {
  display: flex; align-items: center;
  border-radius: 4px; padding: 1px 2px;
}
.shift-row-emp1 { background: #dbeafe; }
.shift-row-emp2 { background: #fce7f3; }

.shift-slot {
  flex: 1; text-align: center; border-radius: 4px;
  font-weight: 800; font-size: 12px; padding: 3px 0; line-height: 1.3;
  user-select: none; letter-spacing: 0.5px;
}
/* Work = deep blue text; Rest = orange text */
.cell-emp1-work { background: #93c5fd; color: #1e3a8a; }
.cell-emp1-rest { background: #bfdbfe; color: #ea580c; }
.cell-emp2-work { background: #f9a8d4; color: #1e3a8a; }
.cell-emp2-rest { background: #fbcfe8; color: #ea580c; }

body.edit-mode .shift-slot { cursor: pointer; }
body.edit-mode .shift-slot:hover { opacity: 0.65; }

.alert {
  border-radius: var(--radius); padding: 10px 14px; font-size: 13px;
  margin-bottom: 12px; line-height: 1.5;
}
.alert-warn { background: #fef9c3; border: 1.5px solid #fcd34d; color: #78350f; }
.alert-info { background: #dbeafe; border: 1.5px solid #93c5fd; color: #1e3a8a; }

.legend {
  display: flex; gap: 14px; margin-top: 12px; flex-wrap: wrap;
  font-size: 12px; color: var(--muted); align-items: center;
}
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-dot { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }

@media (max-width: 640px) {
  .app { padding: 12px 8px 40px; }
  .app-title { font-size: 17px; }
  .cal-cell { min-height: 70px; padding: 3px 2px; }
  .cal-date-num { font-size: 11px; }
  .shift-slot { font-size: 10px; }
  .cal-head { font-size: 12px; padding: 8px 2px; }
  .cal-month-prefix { font-size: 9px; }
}
</style>
</head>
<body>
<div class="app" id="appRoot">

  <div class="app-header">
    <div class="app-title">📅 シフト管理</div>
    <div class="period-badge" id="periodBadge" onclick="togglePeriodEditor()">—</div>
  </div>

  <div class="period-editor" id="periodEditor">
    <label style="color:var(--muted);font-weight:500">期間変更:</label>
    <select id="periodYear"></select>年
    <select id="periodMonth"></select>月16日〜翌月15日
    <button class="btn btn-primary" style="padding:6px 14px;font-size:12px" onclick="applyPeriodChange()">適用</button>
    <button class="btn btn-secondary" style="padding:6px 14px;font-size:12px" onclick="togglePeriodEditor()">閉じる</button>
  </div>

  <div class="toolbar" id="toolbar">
    <button class="btn btn-secondary" id="editBtn" onclick="toggleEditMode()">✏️ 手動編集</button>
    <button class="btn btn-success" onclick="exportPNG()">📸 PNG出力</button>
    <button class="btn btn-secondary" onclick="clearData()" style="color:#ef4444;border-color:#fecaca">🗑 リセット</button>
  </div>

  <div id="alertContainer"></div>

  <div class="calendar-wrap" id="calendarWrap">
    <div style="padding:40px;text-align:center;color:#94a3b8;font-size:13px">
      ✏️ 手動編集を押してシフトを入力してください
    </div>
  </div>

  <div class="legend" id="legend" style="display:none">
    <span style="font-weight:600;color:#475569">凡例:</span>
    <div class="legend-item"><div class="legend-dot" style="background:#93c5fd"></div>従業員1 出勤</div>
    <div class="legend-item"><div class="legend-dot" style="background:#bfdbfe"></div>従業員1 休暇</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f9a8d4"></div>従業員2 出勤</div>
    <div class="legend-item"><div class="legend-dot" style="background:#fbcfe8"></div>従業員2 休暇</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--today-bg);border-radius:50%"></div>今日</div>
    <div class="legend-item" style="color:var(--sat-fg);font-weight:600">土</div>
    <div class="legend-item" style="color:var(--sun-fg);font-weight:600">日・祝</div>
  </div>

</div>
<script>
const HOLIDAYS = new Set([
  '2024-01-01','2024-01-08','2024-02-11','2024-02-12','2024-02-23',
  '2024-03-20','2024-04-29','2024-05-03','2024-05-04','2024-05-05',
  '2024-05-06','2024-07-15','2024-08-11','2024-08-12','2024-09-16',
  '2024-09-22','2024-09-23','2024-10-14','2024-11-03','2024-11-04','2024-11-23',
  '2025-01-01','2025-01-13','2025-02-11','2025-02-23','2025-02-24',
  '2025-03-20','2025-04-29','2025-05-03','2025-05-04','2025-05-05',
  '2025-05-06','2025-07-21','2025-08-11','2025-09-15','2025-09-23',
  '2025-10-13','2025-11-03','2025-11-23','2025-11-24',
  '2026-01-01','2026-01-12','2026-02-11','2026-02-23','2026-03-20',
  '2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-07-20',
  '2026-08-11','2026-09-21','2026-09-23','2026-10-12','2026-11-03','2026-11-23',
]);

const DAY_LABELS = ['日','月','火','水','木','金','土'];

function toISO(date) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}

function getPeriodDates(year, month) {
  const dates = [];
  const cur = new Date(year, month - 1, 16);
  const endY = month === 12 ? year + 1 : year;
  const endM = month === 12 ? 1 : month + 1;
  const end  = new Date(endY, endM - 1, 15);
  while (cur <= end) { dates.push(new Date(cur)); cur.setDate(cur.getDate() + 1); }
  return dates;
}

function isSunOrHoliday(d) { return d.getDay() === 0 || HOLIDAYS.has(toISO(d)); }
function isSaturday(d)      { return d.getDay() === 6; }
function isToday(iso)        { return iso === toISO(new Date()); }

function periodLabel(year, month) {
  const endY = month === 12 ? year + 1 : year;
  const endM = month === 12 ? 1 : month + 1;
  return `${year}年${month}月16日 〜 ${endY}年${endM}月15日`;
}

// ── State ──
const STORAGE_KEY = 'shift-schedule-v2';
let state = { period: null, employees: ['従業員A', '従業員B'], schedule: {} };

function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function loadState() {
  try { const r = localStorage.getItem(STORAGE_KEY); if (r) state = JSON.parse(r); } catch(_) {}
}

function ensureEmployeeDates(name) {
  if (!state.schedule[name]) state.schedule[name] = {};
  getPeriodDates(state.period.year, state.period.month).forEach(d => {
    const iso = toISO(d);
    if (!state.schedule[name][iso]) state.schedule[name][iso] = 'work';
  });
}

function setPeriod(year, month) {
  state.period = { year, month };
  document.getElementById('periodBadge').textContent = periodLabel(year, month);
}

function setDefaultPeriod() {
  const now = new Date();
  let year = now.getFullYear(), month = now.getMonth() + 1;
  if (now.getDate() <= 15) { month--; if (month === 0) { month = 12; year--; } }
  setPeriod(year, month);
}

// ── Period editor ──
function togglePeriodEditor() {
  const ed = document.getElementById('periodEditor');
  ed.classList.toggle('visible');
  if (ed.classList.contains('visible')) {
    const cur = state.period || { year: new Date().getFullYear(), month: new Date().getMonth()+1 };
    const yEl = document.getElementById('periodYear');
    const mEl = document.getElementById('periodMonth');
    yEl.innerHTML = '';
    for (let y = 2024; y <= 2027; y++) {
      const o = document.createElement('option');
      o.value = y; o.textContent = y; if (y === cur.year) o.selected = true;
      yEl.appendChild(o);
    }
    mEl.innerHTML = '';
    for (let m = 1; m <= 12; m++) {
      const o = document.createElement('option');
      o.value = m; o.textContent = m; if (m === cur.month) o.selected = true;
      mEl.appendChild(o);
    }
  }
}

function applyPeriodChange() {
  const year  = parseInt(document.getElementById('periodYear').value);
  const month = parseInt(document.getElementById('periodMonth').value);
  setPeriod(year, month);
  state.employees.forEach(ensureEmployeeDates);
  saveState(); renderCalendar(); togglePeriodEditor();
  showAlert(`期間を ${periodLabel(year, month)} に変更しました。`, 'info');
}

// ── Calendar render ──
function renderCalendar() {
  if (!state.period) return;
  const dates = getPeriodDates(state.period.year, state.period.month);
  const [name1, name2] = state.employees;

  // Build weeks — break at Saturday OR month boundary
  const weeks = [];
  let week = Array(7).fill(null);
  let prevMonth = null;
  const boundaryFlags = [false];

  dates.forEach(d => {
    const dow = d.getDay();
    const curMonth = d.getMonth();

    if (prevMonth !== null && curMonth !== prevMonth && week.some(x => x !== null)) {
      weeks.push(week);
      boundaryFlags.push(true);
      week = Array(7).fill(null);
    }

    week[dow] = d;
    prevMonth = curMonth;

    if (dow === 6) {
      weeks.push(week);
      boundaryFlags.push(false);
      week = Array(7).fill(null);
    }
  });
  if (week.some(x => x !== null)) {
    weeks.push(week);
    boundaryFlags.push(false);
  }

  let html = '<div class="calendar">';

  // Header row
  html += '<div class="cal-row">';
  DAY_LABELS.forEach((lbl, i) => {
    const cls = i === 0 ? ' sun' : i === 6 ? ' sat' : '';
    html += `<div class="cal-head${cls}">${lbl}</div>`;
  });
  html += '</div>';

  // Week rows
  weeks.forEach((wk, rowIdx) => {
    const bCls = boundaryFlags[rowIdx] ? ' month-boundary' : '';
    html += `<div class="cal-row${bCls}">`;
    wk.forEach((d, i) => {
      if (!d) { html += '<div class="cal-cell empty"></div>'; return; }
      const iso  = toISO(d);
      let cls = 'cal-cell';
      if (isSunOrHoliday(d)) cls += ' sun';
      else if (isSaturday(d)) cls += ' sat';
      if (isToday(iso)) cls += ' today';

      const s1 = (state.schedule[name1] || {})[iso] || 'work';
      const s2 = (state.schedule[name2] || {})[iso] || 'work';

      const dateNum = d.getDate();
      const showMonth = dateNum === 16 || dateNum === 1;
      const monthNum = d.getMonth() + 1;

      // Date row: month prefix (red) + date number, side by side
      const monthPfx = showMonth ? `<span class="cal-month-prefix">${monthNum}月</span>` : '';
      html += `<div class="${cls}">`;
      html += `<div class="cal-date-wrap">${monthPfx}<span class="cal-date-num">${dateNum}</span></div>`;
      html += `<div class="shift-row shift-row-emp1">` +
              `<div class="shift-slot ${s1==='rest'?'cell-emp1-rest':'cell-emp1-work'}" data-name="${escAttr(name1)}" data-iso="${iso}">${s1==='rest'?'休':'出'}</div></div>`;
      html += `<div class="shift-row shift-row-emp2">` +
              `<div class="shift-slot ${s2==='rest'?'cell-emp2-rest':'cell-emp2-work'}" data-name="${escAttr(name2)}" data-iso="${iso}">${s2==='rest'?'休':'出'}</div></div>`;
      html += '</div>';
    });
    html += '</div>';
  });

  html += '</div>';
  document.getElementById('calendarWrap').innerHTML = html;
  document.getElementById('legend').style.display = 'flex';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Click to toggle shift
document.getElementById('calendarWrap').addEventListener('click', e => {
  if (!document.body.classList.contains('edit-mode')) return;
  const slot = e.target.closest('.shift-slot[data-name]');
  if (!slot) return;
  const { name, iso } = slot.dataset;
  if (!state.schedule[name]) state.schedule[name] = {};
  state.schedule[name][iso] = state.schedule[name][iso] === 'rest' ? 'work' : 'rest';
  saveState(); renderCalendar();
});

// ── Edit mode ──
let editMode = false;

function toggleEditMode() {
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
  const btn = document.getElementById('editBtn');
  btn.textContent = editMode ? '✅ 編集完了' : '✏️ 手動編集';
  btn.className   = editMode ? 'btn btn-warning' : 'btn btn-secondary';
  if (editMode) {
    if (!state.period) setDefaultPeriod();
    state.employees.forEach(ensureEmployeeDates);
    renderCalendar();
  } else {
    saveState();
  }
}

// ── Clear ──
function clearData() {
  if (!confirm('すべてのシフトデータをリセットしますか？')) return;
  state = { period: null, employees: ['従業員A', '従業員B'], schedule: {} };
  localStorage.removeItem(STORAGE_KEY);
  editMode = false;
  document.body.classList.remove('edit-mode');
  const btn = document.getElementById('editBtn');
  btn.textContent = '✏️ 手動編集'; btn.className = 'btn btn-secondary';
  setDefaultPeriod();
  document.getElementById('calendarWrap').innerHTML =
    '<div style="padding:40px;text-align:center;color:#94a3b8;font-size:13px">✏️ 手動編集を押してシフトを入力してください</div>';
  document.getElementById('legend').style.display = 'none';
}

// ── Alert ──
function showAlert(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `alert alert-${type}`; el.textContent = msg;
  const c = document.getElementById('alertContainer');
  c.innerHTML = ''; c.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.remove(); }, 5000);
}

// ── PNG Export (captures full app: header + calendar + legend) ──
async function exportPNG() {
  if (!document.getElementById('calendarWrap').querySelector('.calendar')) {
    showAlert('エクスポートするシフト表がありません。', 'warn'); return;
  }
  const root = document.getElementById('appRoot');
  const toolbar = document.getElementById('toolbar');
  const periodEditor = document.getElementById('periodEditor');
  const alertContainer = document.getElementById('alertContainer');
  const btn = document.querySelector('.btn-success');
  const orig = btn.textContent;

  // Temporarily hide UI controls that shouldn't appear in the export
  toolbar.style.display = 'none';
  periodEditor.style.display = 'none';
  alertContainer.style.display = 'none';
  btn.textContent = '⏳ 出力中…'; btn.disabled = true;

  try {
    const canvas = await html2canvas(root, {
      scale: 2, useCORS: true, backgroundColor: '#f0f4f8', logging: false
    });
    const link = document.createElement('a');
    const { year, month } = state.period || { year: 0, month: 0 };
    link.download = `shift-${year}${String(month).padStart(2,'0')}.png`;
    link.href = canvas.toDataURL('image/png'); link.click();
    showAlert('📸 PNG出力完了！', 'info');
  } catch(err) {
    showAlert('出力エラー: ' + err.message, 'warn');
  } finally {
    toolbar.style.display = '';
    periodEditor.classList.contains('visible')
      ? (periodEditor.style.display = '')
      : (periodEditor.style.display = '');
    alertContainer.style.display = '';
    btn.textContent = orig; btn.disabled = false;
  }
}

// ── Init ──
function init() {
  loadState();
  if (!state.period) setDefaultPeriod();
  else document.getElementById('periodBadge').textContent = periodLabel(state.period.year, state.period.month);
  if (state.employees.some(n => state.schedule[n] && Object.keys(state.schedule[n]).length > 0)) {
    renderCalendar();
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
