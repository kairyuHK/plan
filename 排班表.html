<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>シフト管理</title>
<script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  /* 深色基底：低亮度墨蓝灰，护眼且现代 */
  --bg: #0f1115;
  --surface: #1a1d24;
  --surface-soft: #14161c;
  --border: #262932;
  --border-strong: #353945;
  --text: #e4e6eb;
  --text-dim: #9ca3af;
  --muted: #6b7280;

  /* 主色：保留靛蓝但调亮以适配暗底 */
  --primary: #818cf8;
  --primary-hover: #a5b4fc;
  --primary-soft: rgba(129,140,248,0.14);

  /* 出勤：冷蓝调；休息：暖橙调 */
  --work-bg: rgba(129,140,248,0.12);
  --work-fg: #a5b4fc;
  --work-fg-b: #6ee7b7; /* 右侧员工出勤 — 薄荷绿，与冷蓝形成区分 */
  --work-bg-b: rgba(110,231,183,0.10);

  --rest-bg: rgba(251,146,60,0.14);
  --rest-fg: #fdba74;
  --rest-strong: #fb923c;

  --sun: #fca5a5;
  --sat: #93c5fd;
  --today: #fb923c;

  --rest-day-bg: rgba(251,191,36,0.06);
  --rest-day-stripe: rgba(251,191,36,0.14);

  /* 几何 */
  --radius-lg: 18px;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;

  /* 阴影：深色调，强调边缘而非投影 */
  --shadow-xs: 0 1px 2px rgba(0,0,0,0.25);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.35), 0 1px 2px rgba(0,0,0,0.20);
  --shadow: 0 4px 16px rgba(0,0,0,0.40), 0 1px 3px rgba(0,0,0,0.25);
  --shadow-lg: 0 16px 40px rgba(0,0,0,0.55), 0 4px 12px rgba(0,0,0,0.30);
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.45;
  overscroll-behavior: none;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.app {
  max-width: 580px;
  margin: 0 auto;
  padding: 0 14px 80px;
}

/* Sticky top zone: header + period editor + toolbar */
.app-top {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--bg);
  padding: 20px 0 10px;
  margin-bottom: 6px;
}
.app-top::after {
  content: '';
  position: absolute;
  left: -14px; right: -14px; bottom: -12px;
  height: 12px;
  background: linear-gradient(to bottom, var(--bg), rgba(247,248,251,0));
  pointer-events: none;
}
body.exporting .app-top::after { display: none; }
body.exporting #appRoot { background: var(--bg); }

/* ── Header ── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; gap: 10px;
}
.title {
  font-size: 20px; font-weight: 800; letter-spacing: -0.4px;
  display: flex; align-items: center; gap: 8px;
  color: var(--text);
}
.title-icon {
  width: 24px; height: 24px;
  display: inline-block; flex-shrink: 0;
  color: var(--primary);
}
.period-btn {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border-strong);
  padding: 8px 14px; border-radius: 999px;
  font-size: 12px; font-weight: 600;
  cursor: pointer; letter-spacing: 0.2px;
  box-shadow: var(--shadow-xs);
  font-family: inherit;
  transition: all 0.15s ease;
  display: inline-flex; align-items: center; gap: 6px;
}
.period-btn::before {
  content: ''; width: 6px; height: 6px;
  background: var(--primary); border-radius: 50%;
  box-shadow: 0 0 0 3px var(--primary-soft);
}
.period-btn:hover { border-color: var(--primary); color: var(--primary); }
.period-btn:active { transform: scale(0.97); }

/* ── Period editor ── */
.period-editor {
  display: none;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 12px;
  gap: 10px; align-items: center; flex-wrap: wrap;
  box-shadow: var(--shadow);
  font-size: 13px;
}
.period-editor.visible { display: flex; }
.period-editor select {
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  padding: 7px 10px; font-size: 13px; font-family: inherit;
  background: var(--surface); outline: none; color: var(--text);
  cursor: pointer; transition: border-color 0.15s;
}
.period-editor select:focus { border-color: var(--primary); }
.period-editor-label { color: var(--muted); font-weight: 600; font-size: 12px; }

/* ── Toolbar ── */
.toolbar { display: flex; gap: 8px; margin-bottom: 14px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 11px 12px; border-radius: var(--radius-sm);
  font-size: 13px; font-weight: 600;
  border: 1px solid transparent; cursor: pointer;
  font-family: inherit; letter-spacing: 0.1px;
  transition: all 0.15s ease;
  flex: 1; min-width: 0;
  position: relative;
  white-space: nowrap;
}
.btn:active { transform: scale(0.97); }

/* 未保存提示：保存按钮上的红点呼吸动画 */
body.has-unsaved .btn-save::after {
  content: '';
  position: absolute; top: 6px; right: 8px;
  width: 8px; height: 8px;
  background: #ef4444;
  border-radius: 50%;
  box-shadow: 0 0 0 2px #fff;
  animation: pulse-dot 1.4s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.55; transform: scale(0.85); }
}

/* 按钮统一风格：实心主色 / 柔和次要 / 描边危险 */
.btn-edit {
  background: var(--surface); color: var(--text);
  border-color: var(--border-strong);
  box-shadow: var(--shadow-xs);
}
.btn-edit:hover { border-color: var(--primary); color: var(--primary); }
.btn-edit.active {
  background: var(--primary); color: #0f1115;
  border-color: var(--primary);
  box-shadow: 0 4px 14px rgba(129,140,248,0.30);
}
.btn-save {
  background: var(--surface); color: var(--text);
  border-color: var(--border-strong);
  box-shadow: var(--shadow-xs);
}
.btn-save:hover { border-color: var(--primary); color: var(--primary); }
.btn-primary {
  background: var(--surface); color: var(--text);
  border-color: var(--border-strong);
  box-shadow: var(--shadow-xs);
}
.btn-primary:hover { border-color: var(--primary); color: var(--primary); }
.btn-danger {
  background: var(--surface); color: var(--rest-fg);
  border-color: rgba(251,146,60,0.30);
  box-shadow: var(--shadow-xs);
}
.btn-danger:hover { background: var(--rest-bg); border-color: var(--rest-strong); }
.btn-secondary {
  background: var(--surface); color: var(--text-dim);
  border-color: var(--border-strong);
  box-shadow: none;
}
.btn-secondary:hover { color: var(--text); }

/* ── Export dropdown ── */
.export-wrap { position: relative; flex: 1; min-width: 0; display: flex; }
.export-wrap > .btn { flex: 1; }
.export-menu {
  display: none;
  position: absolute; top: calc(100% + 6px); right: 0; left: 0;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-lg);
  padding: 6px; z-index: 60;
  animation: menu-pop 0.12s ease-out;
}
@keyframes menu-pop {
  from { opacity: 0; transform: translateY(-4px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}
.export-menu.show { display: block; }
.export-menu button {
  display: block; width: 100%;
  background: transparent; border: none; cursor: pointer;
  padding: 9px 12px; border-radius: var(--radius-xs);
  font: inherit; font-size: 13px; font-weight: 600;
  color: var(--text); text-align: left;
  transition: background 0.1s;
}
.export-menu button:hover { background: var(--surface-soft); }
.export-menu button:active { background: var(--border); }

/* ── Alert ── */
.alert {
  border-radius: var(--radius-sm); padding: 10px 14px;
  font-size: 12.5px; margin-bottom: 10px; line-height: 1.5;
  border: 1px solid;
}
.alert-info { background: var(--primary-soft); color: var(--primary-hover); border-color: rgba(129,140,248,0.35); }
.alert-warn { background: rgba(251,191,36,0.10); color: #fcd34d; border-color: rgba(251,191,36,0.30); }

/* ── Day list (two-column: 月份 A / 月份 B 并排) ── */
.day-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  align-items: start;
}
.month-col {
  display: flex; flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.month-col-head {
  display: flex; align-items: center; justify-content: center;
  gap: 4px;
  background: var(--surface);
  color: var(--text);
  font-size: 13px; font-weight: 800; letter-spacing: 0.5px;
  padding: 8px 0;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-xs);
  margin-bottom: 2px;
  position: relative;
}

/* Day row (compact, 在两栏内) */
.day-row {
  position: relative;
  display: grid;
  grid-template-columns: 32px 1fr;
  min-height: 40px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  box-shadow: var(--shadow-xs);
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.08s;
}

/* weekend colorings */
.day-row.sun .day-cell .dnum,
.day-row.sun .day-cell .dow { color: var(--sun); }
.day-row.sat .day-cell .dnum,
.day-row.sat .day-cell .dow { color: var(--sat); }

.day-row.today {
  box-shadow: var(--shadow-xs);
}
.day-row.today .day-cell .dnum {
  background: var(--today); color: #0f1115;
  width: 24px; height: 24px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12.5px; font-weight: 800;
  box-shadow: 0 2px 8px rgba(251,146,60,0.45);
}

/* Both rest: 暖色底 + 左侧 2px 内阴影色条 + 角标 */
.day-row.both-rest {
  background: rgba(251,191,36,0.11);
  box-shadow: inset 2px 0 0 #f59e0b, var(--shadow-xs);
}

.day-cell {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 2px 0;
  border-right: 1px solid var(--border);
  background: var(--surface-soft);
  gap: 1px;
}
.day-row.both-rest .day-cell { background: rgba(0,0,0,0.20); }
.day-cell .dow {
  font-size: 9px; font-weight: 700; color: var(--text-dim);
  letter-spacing: 0;
  line-height: 1.1;
  text-transform: uppercase;
}
.day-cell .dnum {
  font-size: 16px; font-weight: 800; line-height: 1.1;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

/* Shifts area */
.shifts {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
  background: var(--border);
}
.shift {
  display: flex; align-items: center; justify-content: center;
  padding: 7px 2px;
  font-weight: 700;
  transition: background 0.15s, transform 0.08s;
}
.shift-mark {
  font-size: 15px; font-weight: 800; letter-spacing: 0.5px;
}
.shift.work { background: var(--work-bg); color: var(--work-fg); }
.shift.rest {
  background: var(--rest-bg);
  color: var(--rest-fg);
  position: relative;
}
.shift.rest .shift-mark { font-size: 16px; }

/* 右侧（従業員B）出 — 绿调，与左侧蓝出形成区分 */
.shifts .shift + .shift.work {
  background: var(--work-bg-b);
  color: var(--work-fg-b);
}
.day-row.both-rest .shift.rest {
  background: rgba(251,146,60,0.08);
  color: #fcd9b8;
}

/* both-rest badge */
.both-rest-tag {
  position: absolute; top: 4px; right: 4px;
  background: linear-gradient(135deg, #fbbf24, #f59e0b);
  color: #1a1d24; font-size: 8px; font-weight: 800;
  padding: 2px 5px; border-radius: 999px; letter-spacing: 0.5px;
  box-shadow: 0 2px 6px rgba(251,191,36,0.30);
  pointer-events: none; z-index: 2;
}

body.edit-mode .shift { cursor: pointer; }
body.edit-mode .shift:hover { filter: brightness(0.97); }
body.edit-mode .shift:active { transform: scale(0.94); }
body.edit-mode .shifts { position: relative; }
body.edit-mode .day-row { box-shadow: 0 0 0 1px var(--primary-soft), var(--shadow-xs); }

/* ── Legend card ── */
.legend-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px; margin-top: 20px;
  box-shadow: var(--shadow-xs);
}
.legend-title {
  font-size: 10.5px; font-weight: 800; color: var(--muted);
  letter-spacing: 2.5px; margin-bottom: 10px;
  text-transform: uppercase;
}
.legend-list {
  display: flex; flex-wrap: wrap; gap: 10px 16px;
  font-size: 11.5px; color: var(--text-dim);
  font-weight: 500;
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot {
  width: 14px; height: 14px; border-radius: 4px;
  flex-shrink: 0; border: 1px solid rgba(255,255,255,0.08);
}
.legend-stripe {
  width: 14px; height: 14px; border-radius: 4px; flex-shrink: 0;
  background: repeating-linear-gradient(-45deg,
    rgba(251,191,36,0.10) 0px, rgba(251,191,36,0.10) 3px,
    rgba(251,191,36,0.30) 3px, rgba(251,191,36,0.30) 6px);
  border: 1px solid rgba(251,191,36,0.35);
}

/* Small phones */
@media (max-width: 380px) {
  .app { padding: 0 8px 60px; }
  .title { font-size: 17px; }
  .period-btn { padding: 7px 11px; font-size: 11px; }
  .day-list { gap: 7px; }
  .day-row { grid-template-columns: 28px 1fr; }
  .day-cell .dnum { font-size: 14px; }
  .day-cell .dow { font-size: 8px; }
  .day-row.today .day-cell .dnum { width: 21px; height: 21px; font-size: 11.5px; }
  .shift { padding: 6px 2px; }
  .shift-mark { font-size: 13.5px; }
  .shift.rest .shift-mark { font-size: 14.5px; }
  .month-col-head { font-size: 12px; padding: 6px 0; }
}

/* Empty state */
.empty-state {
  text-align: center; padding: 56px 16px;
  color: var(--muted); font-size: 13.5px;
  background: var(--surface);
  border: 1.5px dashed var(--border-strong);
  border-radius: var(--radius);
  line-height: 1.6;
}
.empty-state .ic { font-size: 36px; display: block; margin-bottom: 14px; filter: grayscale(0.3); }
</style>
</head>
<body>
<div class="app" id="appRoot">

  <div class="app-top">
  <header class="header">
    <div class="title">
      <svg class="title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="17" rx="2.5"/>
        <line x1="3" y1="9" x2="21" y2="9"/>
        <line x1="8" y1="2.5" x2="8" y2="6"/>
        <line x1="16" y1="2.5" x2="16" y2="6"/>
        <rect x="6.5" y="12" width="3" height="2.5" rx="0.5" fill="currentColor"/>
        <rect x="14.5" y="12" width="3" height="2.5" rx="0.5" fill="currentColor" opacity="0.5"/>
      </svg>
      シフト管理
    </div>
    <button class="period-btn" id="periodBadge" onclick="togglePeriodEditor()">2026年5月16日 〜 2026年6月15日</button>
  </header>

  <div class="period-editor" id="periodEditor">
    <span class="period-editor-label">期間:</span>
    <select id="periodYear"></select>
    <span class="period-editor-label">年</span>
    <select id="periodMonth"></select>
    <span class="period-editor-label">月16日〜翌月15日</span>
    <button class="btn btn-primary" style="flex:none;padding:7px 14px;font-size:12px" onclick="applyPeriodChange()">適用</button>
    <button class="btn btn-secondary" style="flex:none;padding:7px 14px;font-size:12px" onclick="togglePeriodEditor()">閉じる</button>
  </div>

  <div class="toolbar" id="toolbar">
    <button class="btn btn-edit" id="editBtn" onclick="toggleEditMode()">✏️ 編集</button>
    <button class="btn btn-primary" onclick="importJSON()">📥 読取</button>
    <div class="export-wrap">
      <button class="btn btn-save" id="exportBtn" onclick="toggleExportMenu(event)">📤 出力 ▾</button>
      <div class="export-menu" id="exportMenu">
        <button onclick="saveJSON()">💾 保存</button>
        <button onclick="exportPNG()">📸 PNG</button>
      </div>
    </div>
    <button class="btn btn-danger" onclick="clearData()">🗑 リセット</button>
  </div>

  <div id="alertContainer"></div>
  </div><!-- /app-top -->

  <div class="day-list" id="dayList">
    <div class="empty-state">
      <span class="ic">✏️</span>
      「編集」を押してシフトを入力してください
    </div>
  </div>

  <div id="legendCard" style="display:none">
    <div class="legend-card">
      <div class="legend-title">凡例</div>
      <div class="legend-list">
        <div class="legend-item"><span class="legend-dot" style="background:rgba(129,140,248,0.25)"></span>出勤</div>
        <div class="legend-item"><span class="legend-dot" style="background:rgba(251,146,60,0.25)"></span>休み</div>
        <div class="legend-item"><span class="legend-stripe"></span>全員休</div>
        <div class="legend-item"><span class="legend-dot" style="background:#fb923c;border-radius:50%"></span>今日</div>
        <div class="legend-item" style="color:#93c5fd;font-weight:700">土</div>
        <div class="legend-item" style="color:#fca5a5;font-weight:700">日・祝</div>
      </div>
    </div>
  </div>

</div>

<script>
const HOLIDAYS = new Set([
  '2024-01-01','2024-01-08','2024-02-11','2024-02-12','2024-02-23',
  '2024-03-20','2024-04-29','2024-05-03','2024-05-04','2024-05-05',
  '2024-05-06','2024-07-15','2024-08-11','2024-08-12','2024-09-16',
  '2024-09-22','2024-09-23','2024-10-14','2024-11-03','2024-11-04','2024-11-23',
  '2025-01-01','2025-01-13','2025-02-11','2025-02-23','2025-02-24',
  '2025-03-20','2025-04-29','2025-05-03','2025-05-04','2025-05-05',
  '2025-05-06','2025-07-21','2025-08-11','2025-09-15','2025-09-23',
  '2025-10-13','2025-11-03','2025-11-23','2025-11-24',
  '2026-01-01','2026-01-12','2026-02-11','2026-02-23','2026-03-20',
  '2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-07-20',
  '2026-08-11','2026-09-21','2026-09-23','2026-10-12','2026-11-03','2026-11-23',
]);

const DAY_LABELS = ['日','月','火','水','木','金','土'];

function toISO(date) {
  return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}

function getPeriodDates(year, month) {
  const dates = [];
  const cur = new Date(year, month - 1, 16);
  const endY = month === 12 ? year + 1 : year;
  const endM = month === 12 ? 1 : month + 1;
  const end  = new Date(endY, endM - 1, 15);
  while (cur <= end) { dates.push(new Date(cur)); cur.setDate(cur.getDate() + 1); }
  return dates;
}

function isSunOrHoliday(d) { return d.getDay() === 0 || HOLIDAYS.has(toISO(d)); }
function isSaturday(d)      { return d.getDay() === 6; }
function isToday(iso)        { return iso === toISO(new Date()); }

function periodLabel(year, month) {
  const endY = month === 12 ? year + 1 : year;
  const endM = month === 12 ? 1 : month + 1;
  return `${year}年${month}月16日 〜 ${endY}年${endM}月15日`;
}

const STORAGE_KEY = 'shift-schedule-v2';
let state = { period: null, employees: ['従業員A', '従業員B'], schedule: {} };

function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function loadState() {
  try { const r = localStorage.getItem(STORAGE_KEY); if (r) state = JSON.parse(r); } catch(_) {}
}

function ensureEmployeeDates(name) {
  if (!state.schedule[name]) state.schedule[name] = {};
  getPeriodDates(state.period.year, state.period.month).forEach(d => {
    const iso = toISO(d);
    if (!state.schedule[name][iso]) state.schedule[name][iso] = 'work';
  });
}

function setPeriod(year, month) {
  state.period = { year, month };
  document.getElementById('periodBadge').textContent = periodLabel(year, month);
}

function setDefaultPeriod() {
  const now = new Date();
  let year = now.getFullYear(), month = now.getMonth() + 1;
  if (now.getDate() <= 15) { month--; if (month === 0) { month = 12; year--; } }
  setPeriod(year, month);
}

function togglePeriodEditor() {
  const ed = document.getElementById('periodEditor');
  ed.classList.toggle('visible');
  if (ed.classList.contains('visible')) {
    const cur = state.period || { year: new Date().getFullYear(), month: new Date().getMonth()+1 };
    const yEl = document.getElementById('periodYear');
    const mEl = document.getElementById('periodMonth');
    yEl.innerHTML = '';
    for (let y = 2024; y <= 2027; y++) {
      const o = document.createElement('option');
      o.value = y; o.textContent = y; if (y === cur.year) o.selected = true;
      yEl.appendChild(o);
    }
    mEl.innerHTML = '';
    for (let m = 1; m <= 12; m++) {
      const o = document.createElement('option');
      o.value = m; o.textContent = m; if (m === cur.month) o.selected = true;
      mEl.appendChild(o);
    }
  }
}

function applyPeriodChange() {
  const year  = parseInt(document.getElementById('periodYear').value);
  const month = parseInt(document.getElementById('periodMonth').value);
  setPeriod(year, month);
  state.employees.forEach(ensureEmployeeDates);
  saveState();
  renderCalendar(); togglePeriodEditor();
  showAlert(`期間を ${periodLabel(year, month)} に変更しました。`, 'info');
}

function escAttr(s) { return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function renderCalendar() {
  if (!state.period) return;
  const dates = getPeriodDates(state.period.year, state.period.month);
  const [name1, name2] = state.employees;

  // 按月份分组 → 两栏并排（4月 | 5月）
  const monthGroups = [];
  dates.forEach(d => {
    const m = d.getMonth() + 1;
    let g = monthGroups[monthGroups.length - 1];
    if (!g || g.month !== m) {
      g = { month: m, dates: [] };
      monthGroups.push(g);
    }
    g.dates.push(d);
  });

  const renderDay = d => {
    const iso = toISO(d);
    const dow = d.getDay();
    const dateNum = d.getDate();
    const s1 = (state.schedule[name1] || {})[iso] || 'work';
    const s2 = (state.schedule[name2] || {})[iso] || 'work';
    const bothRest = s1 === 'rest' && s2 === 'rest';

    let rowCls = 'day-row';
    if (isSunOrHoliday(d)) rowCls += ' sun';
    else if (isSaturday(d)) rowCls += ' sat';
    if (isToday(iso)) rowCls += ' today';
    if (bothRest) rowCls += ' both-rest';

    return `<div class="${rowCls}">
      ${bothRest ? '<span class="both-rest-tag">全休</span>' : ''}
      <div class="day-cell">
        <div class="dow">${DAY_LABELS[dow]}</div>
        <div class="dnum">${dateNum}</div>
      </div>
      <div class="shifts">
        <div class="shift ${s1==='rest'?'rest':'work'}" data-name="${escAttr(name1)}" data-iso="${iso}">
          <span class="shift-mark">${s1==='rest'?'休':'出'}</span>
        </div>
        <div class="shift ${s2==='rest'?'rest':'work'}" data-name="${escAttr(name2)}" data-iso="${iso}">
          <span class="shift-mark">${s2==='rest'?'休':'出'}</span>
        </div>
      </div>
    </div>`;
  };

  const html = monthGroups.map(g => `
    <div class="month-col">
      <div class="month-col-head">${g.month}月</div>
      ${g.dates.map(renderDay).join('')}
    </div>
  `).join('');

  document.getElementById('dayList').innerHTML = html;
  document.getElementById('legendCard').style.display = '';
}

let unsaved = false;
function markUnsaved() {
  if (unsaved) return;
  unsaved = true;
  document.body.classList.add('has-unsaved');
}
function clearUnsaved() {
  unsaved = false;
  document.body.classList.remove('has-unsaved');
}

document.getElementById('dayList').addEventListener('click', e => {
  if (!document.body.classList.contains('edit-mode')) return;
  const slot = e.target.closest('.shift[data-name]');
  if (!slot) return;
  const { name, iso } = slot.dataset;
  if (!state.schedule[name]) state.schedule[name] = {};
  state.schedule[name][iso] = state.schedule[name][iso] === 'rest' ? 'work' : 'rest';
  saveState();
  renderCalendar();
});

window.addEventListener('beforeunload', e => {
  if (unsaved) { e.preventDefault(); e.returnValue = ''; }
});

let editMode = false;

function toggleEditMode() {
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
  const btn = document.getElementById('editBtn');
  btn.textContent = editMode ? '✅ 完了' : '✏️ 編集';
  btn.classList.toggle('active', editMode);
  if (editMode) {
    if (!state.period) setDefaultPeriod();
    state.employees.forEach(ensureEmployeeDates);
    renderCalendar();
  }
  // 退出编辑不自动保存 — 必须显式点「💾 保存」才会写入 localStorage
}

function toggleExportMenu(e) {
  if (e) e.stopPropagation();
  document.getElementById('exportMenu').classList.toggle('show');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.export-wrap')) {
    document.getElementById('exportMenu')?.classList.remove('show');
  }
});

function clearData() {
  if (!confirm('すべてのシフトデータをリセットしますか？')) return;
  state = { period: null, employees: ['従業員A', '従業員B'], schedule: {} };
  localStorage.removeItem(STORAGE_KEY);
  editMode = false;
  document.body.classList.remove('edit-mode');
  const btn = document.getElementById('editBtn');
  btn.textContent = '✏️ 編集'; btn.classList.remove('active');
  setDefaultPeriod();
  document.getElementById('dayList').innerHTML =
    '<div class="empty-state"><span class="ic">✏️</span>「編集」を押してシフトを入力してください</div>';
  document.getElementById('legendCard').style.display = 'none';
}

function showAlert(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = `alert alert-${type}`; el.textContent = msg;
  const c = document.getElementById('alertContainer');
  c.innerHTML = ''; c.appendChild(el);
  setTimeout(() => { if (el.parentNode) el.remove(); }, 5000);
}

function buildStripeDataURL() {
  const tile = document.createElement('canvas');
  tile.width = 16; tile.height = 16;
  const tc = tile.getContext('2d');
  tc.fillStyle = '#fffbeb';
  tc.fillRect(0, 0, 16, 16);
  tc.strokeStyle = '#fef3c7';
  tc.lineWidth = 8;
  tc.beginPath();
  tc.moveTo(-8, 8);  tc.lineTo(8,  -8);
  tc.moveTo(0,  16); tc.lineTo(16,  0);
  tc.moveTo(8,  24); tc.lineTo(24,  8);
  tc.stroke();
  return tile.toDataURL('image/png');
}

async function exportPNG() {
  document.getElementById('exportMenu')?.classList.remove('show');
  if (!document.querySelector('#dayList .day-row')) {
    showAlert('エクスポートするシフト表がありません。', 'warn'); return;
  }
  if (typeof html2canvas === 'undefined') {
    showAlert('html2canvas が読み込めません。ネット接続をご確認ください。', 'warn'); return;
  }
  const stripeURL = buildStripeDataURL();
  const bothRestRows = [];
  document.querySelectorAll('.day-row.both-rest').forEach(row => {
    row.classList.remove('both-rest');
    row.style.backgroundImage  = `url('${stripeURL}')`;
    row.style.backgroundSize   = '16px 16px';
    row.style.backgroundRepeat = 'repeat';
    row.style.backgroundColor  = '#fffbeb';
    row.style.borderColor      = '#fcd34d';
    bothRestRows.push(row);
  });

  const root    = document.getElementById('appRoot');
  const appTop  = document.querySelector('.app-top');
  const toolbar = document.getElementById('toolbar');
  const pe      = document.getElementById('periodEditor');
  const ac      = document.getElementById('alertContainer');
  const btn     = document.getElementById('exportBtn');
  const orig    = btn.textContent;
  const prevAppTopPos = appTop ? appTop.style.position : '';
  if (appTop) appTop.style.position = 'static';
  document.body.classList.add('exporting');
  toolbar.style.display = 'none';
  pe.style.display = 'none';
  ac.style.display = 'none';
  btn.textContent = '⏳ 出力中…'; btn.disabled = true;

  await new Promise(r => setTimeout(r, 50));

  try {
    const canvas = await html2canvas(root, {
      scale: 2, useCORS: true, backgroundColor: '#f4f6fb', logging: false,
      windowWidth: root.scrollWidth, windowHeight: root.scrollHeight
    });
    const link = document.createElement('a');
    const { year, month } = state.period || { year: 0, month: 0 };
    link.download = `shift-${year}${String(month).padStart(2,'0')}.png`;
    link.href = canvas.toDataURL('image/png'); link.click();
    showAlert('📸 PNG出力完了！', 'info');
  } catch(err) {
    showAlert('出力エラー: ' + err.message, 'warn');
  } finally {
    bothRestRows.forEach(row => {
      row.classList.add('both-rest');
      row.style.backgroundImage  = '';
      row.style.backgroundSize   = '';
      row.style.backgroundRepeat = '';
      row.style.backgroundColor  = '';
      row.style.borderColor      = '';
    });
    if (appTop) appTop.style.position = prevAppTopPos;
    document.body.classList.remove('exporting');
    toolbar.style.display = '';
    pe.style.display = '';
    ac.style.display = '';
    btn.textContent = orig; btn.disabled = false;
  }
}

function saveJSON() {
  document.getElementById('exportMenu')?.classList.remove('show');
  if (!state.period) { showAlert('保存するデータがありません。', 'warn'); return; }
  const { year, month } = state.period;
  const defaultName = `shift-${year}${String(month).padStart(2,'0')}.json`;
  const name = prompt('ファイル名を入力してください', defaultName);
  if (!name) return;
  const filename = /\.json$/i.test(name) ? name : name + '.json';
  const payload = {
    version: 2,
    type: 'shift-schedule',
    period: state.period,
    employees: state.employees,
    schedule: state.schedule
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.download = filename;
  a.href = URL.createObjectURL(blob);
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showAlert(`📤 ${filename} を保存しました。`, 'info');
}

function importJSON() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (data.type !== 'shift-schedule') throw new Error('ファイル種別が不正です');
        if (!data.period || typeof data.period.year !== 'number' || typeof data.period.month !== 'number') throw new Error('期間データが不正です');
        if (!Array.isArray(data.employees) || data.employees.length < 2) throw new Error('従業員データが不正です');
        if (!data.schedule || typeof data.schedule !== 'object') throw new Error('シフトデータが不正です');
        if (!confirm('現在のデータを上書きします。続行しますか？')) return;
        state = { period: data.period, employees: data.employees, schedule: data.schedule };
        setPeriod(state.period.year, state.period.month);
        state.employees.forEach(ensureEmployeeDates);
        saveState();
        clearUnsaved();
        renderCalendar();
        showAlert(`📥 読込完了 — ${periodLabel(state.period.year, state.period.month)}`, 'info');
      } catch (e) {
        showAlert('読込エラー: ' + e.message, 'warn');
      }
    };
    r.readAsText(f);
  };
  inp.click();
}

function init() {
  loadState();
  if (!state.period) setDefaultPeriod();
  else document.getElementById('periodBadge').textContent = periodLabel(state.period.year, state.period.month);
  if (state.employees.some(n => state.schedule[n] && Object.keys(state.schedule[n]).length > 0)) {
    renderCalendar();
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
