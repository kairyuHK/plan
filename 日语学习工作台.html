<!doctype html>
<html lang="zh-CN" data-appver="2026-10-02-1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>日语学习工作台</title>
<style>
:root{
  --paper:#faf6ef; --paper2:#f3ecdf; --card:#fffdf8;
  --ink:#201e1a; --ink-soft:#4a463d; --ink-faint:#8c8578;
  --shu:#c8453b; --shu-deep:#9e2b23; --gold:#b08d3f; --gold-soft:#cbb27a;
  --green:#5a7d55; --line:#e4dccb; --line-soft:#efe8da;
  --ok:#4f7d4a; --bad:#c04a3f;
  --serif:"Yu Mincho","Hiragino Mincho ProN","Songti SC","SimSun",serif;
  --sans:"Hiragino Sans","Yu Gothic","Microsoft YaHei",system-ui,sans-serif;
  --shadow:0 2px 10px rgba(60,45,20,.08), 0 1px 2px rgba(60,45,20,.06);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 500px at 80% -10%, #fdf3e6 0%, transparent 60%),
    var(--paper);
  color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.7; -webkit-text-size-adjust:100%;
}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 80px}

/* ---------- header ---------- */
header.top{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(var(--paper),rgba(250,246,239,.9));
  backdrop-filter:saturate(1.1) blur(6px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:900px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.brand h1{
  font-family:var(--serif);font-weight:600;font-size:21px;margin:0;letter-spacing:.04em;
  display:flex;align-items:center;gap:10px;
}
.brand h1 .mark{color:var(--shu)}
.brand .date{font-size:12.5px;color:var(--ink-faint);letter-spacing:.06em}
.ring{width:52px;height:52px;flex:0 0 auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:13px;font-weight:600;color:var(--shu-deep)}

/* ---------- nav ---------- */
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;border:1px solid var(--line);background:var(--card);
  color:var(--ink-soft);border-radius:999px;padding:7px 14px;font-size:13.5px;
  cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;
  transition:all .15s ease;
}
.tab .i{font-size:15px}
.tab:hover{border-color:var(--gold-soft);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--shu);border-color:var(--shu);color:#fff;box-shadow:var(--shadow)}
.tab .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);margin-left:2px;display:none}
.tab[data-done="1"] .dot{display:inline-block}
.tab[aria-selected="true"] .dot{background:#fff}

/* ---------- panels ---------- */
main{padding-top:18px}
.panel{display:none;animation:fade .25s ease}
.panel.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.phead h2{font-family:var(--serif);font-size:24px;margin:0;font-weight:600;letter-spacing:.03em}
.phead h2 small{display:block;font-family:var(--sans);font-size:12px;color:var(--ink-faint);
  letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px;font-weight:600}
.phead .sub{color:var(--ink-soft);font-size:13px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px 18px;margin-bottom:16px}
.card.flat{box-shadow:none;background:var(--paper2);border-style:dashed}

.lvl{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;
  padding:2px 8px;border-radius:6px;background:var(--shu);color:#fff;vertical-align:middle}
.lvl.n2{background:var(--gold)} .lvl.n1{background:var(--shu-deep)}
.cat-tag{font-size:11.5px;color:var(--ink-faint);letter-spacing:.1em;font-weight:600}

.jp{font-family:var(--serif);font-size:19px;line-height:1.9;color:var(--ink)}
.cn{color:var(--ink-soft);font-size:14px}
.muted{color:var(--ink-faint)}

button.btn{font-family:var(--sans);cursor:pointer;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);padding:8px 14px;font-size:13.5px;transition:all .15s}
button.btn:hover{border-color:var(--gold-soft)}
button.btn.primary{background:var(--shu);color:#fff;border-color:var(--shu)}
button.btn.primary:hover{background:var(--shu-deep);border-color:var(--shu-deep)}
button.btn.ghost{background:transparent}
button.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
button.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.speed{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft)}
.speed input{accent-color:var(--shu)}

.listen-line{padding:10px 0;border-bottom:1px dashed var(--line-soft)}
.listen-line:last-child{border-bottom:0}
.listen-line .lrow{display:flex;gap:10px;align-items:flex-start}
.listen-line .play{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
  background:var(--card);cursor:pointer;color:var(--shu);font-size:13px;display:flex;align-items:center;justify-content:center}
.listen-line .play:hover{background:var(--shu);color:#fff;border-color:var(--shu)}
.hidden-cn{display:none}
.show-cn .hidden-cn{display:block}

.vocab-chip{display:inline-block;background:var(--paper2);border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 4px 0 0;font-size:13px}
.vocab-chip b{font-family:var(--serif);color:var(--ink)}
.vocab-chip .k{color:var(--shu-deep);font-size:12px;margin-left:4px}
.vocab-chip .c{color:var(--ink-faint);font-size:12px;margin-left:6px}

/* word flashcard */
.flash{text-align:center;padding:26px 16px}
.flash .word{font-family:var(--serif);font-size:40px;line-height:1.2}
.flash .kana{color:var(--shu-deep);font-size:16px;margin-top:6px}
.flash .accent{color:var(--ink-faint);font-size:12px;margin-left:8px}
.flash .back{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px;display:none}
.flash.flip .back{display:block}
.flash .pos{display:inline-block;font-size:11px;background:var(--paper2);border:1px solid var(--line);
  border-radius:6px;padding:1px 7px;color:var(--ink-soft)}
.flash .mean{font-size:19px;margin:8px 0}
.flash .ex{font-family:var(--serif);font-size:16px;color:var(--ink)}
.flash .exc{font-size:13px;color:var(--ink-faint)}
.progressbar{height:6px;background:var(--line-soft);border-radius:4px;overflow:hidden;margin:8px 0 2px}
.progressbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--shu));width:0}

.gram{margin-bottom:14px}
.gram .pt{font-family:var(--serif);font-size:22px;color:var(--shu-deep)}
.gram .con{font-size:12.5px;color:var(--ink-faint);margin:2px 0 8px}
.gram .ex{font-family:var(--serif);font-size:16px;margin-top:6px}

.q{margin:12px 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--paper2)}
.q .opt{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);cursor:pointer;font-size:14px;transition:all .12s}
.q .opt:hover{border-color:var(--gold-soft)}
.q .opt.ok{background:#eaf4e8;border-color:var(--ok);color:#2f5e2a}
.q .opt.bad{background:#f8e9e7;border-color:var(--bad);color:#8f2e25}
.q .exp{margin-top:8px;font-size:13px;color:var(--ink-soft);display:none}
.q.answered .exp{display:block}

textarea.write{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:12px;
  font-family:var(--serif);font-size:16px;line-height:1.8;background:var(--card);color:var(--ink);resize:vertical}
textarea.write:focus{outline:2px solid var(--gold-soft);border-color:var(--gold-soft)}
.wc{font-size:12px;color:var(--ink-faint);text-align:right;margin-top:4px}
details.model{margin-top:12px;border:1px dashed var(--line);border-radius:10px;padding:0 12px;background:var(--paper2)}
details.model summary{cursor:pointer;padding:10px 0;font-size:13.5px;color:var(--shu-deep);font-weight:600}
details.model .jp{font-size:16px;margin:4px 0 10px}

/* speaking */
.dlg{padding:10px 0;border-bottom:1px dashed var(--line-soft)}
.dlg:last-child{border-bottom:0}
.dlg .role{font-size:12px;color:var(--shu);font-weight:700;letter-spacing:.06em}
.rec-box{text-align:center;padding:10px}
.rec-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:6px;
  animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* kanji */
.kanji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.kcell{text-align:center;border:1px solid var(--line);border-radius:12px;padding:12px 8px;background:var(--card)}
.kbox{width:92px;height:92px;margin:0 auto 8px;position:relative;border:1px solid var(--gold-soft);border-radius:8px;
  background:
    linear-gradient(var(--line-soft),var(--line-soft)) center/100% 1px no-repeat,
    linear-gradient(var(--line-soft),var(--line-soft)) center/1px 100% no-repeat,
    var(--paper)}
.kbox span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:62px;color:var(--ink)}
.kcell .read{font-size:12px;color:var(--shu-deep);margin:2px 0}
.kcell .mean{font-size:13px;color:var(--ink-soft)}
.kcell .kw{font-size:12px;color:var(--ink-faint);margin-top:4px;font-family:var(--serif)}

/* game */
.match-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mtile{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;cursor:pointer;
  background:var(--card);font-size:15px;transition:all .12s;min-height:48px;display:flex;align-items:center;justify-content:center}
.mtile.jp{font-family:var(--serif);font-size:17px}
.mtile:hover{border-color:var(--gold-soft)}
.mtile.sel{background:var(--shu);color:#fff;border-color:var(--shu)}
.mtile.done{opacity:.35;pointer-events:none;background:#eaf4e8;border-color:var(--ok)}
.mtile.wrong{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.scorebar{display:flex;gap:16px;align-items:center;font-size:13px;color:var(--ink-soft)}
.scorebar b{font-family:var(--serif);color:var(--shu-deep);font-size:18px}

.culture .c-emoji{font-size:40px}
.culture h3{font-family:var(--serif);margin:6px 0;font-size:21px}
.culture .term{color:var(--shu-deep);font-family:var(--serif)}

.done-btn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.timer{font-family:var(--serif);font-size:30px;color:var(--shu-deep);letter-spacing:.04em}
.foot{text-align:center;color:var(--ink-faint);font-size:12px;margin-top:30px}
.pill{font-size:11px;background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--ink-soft)}
@media(max-width:480px){
  .brand h1{font-size:18px} .jp{font-size:17px} .flash .word{font-size:34px}
  .phead h2{font-size:21px}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1><span class="mark">日</span>本語 学習ワークベンチ</h1>
      <span class="date" id="dateLabel"></span>
    </div>
    <div class="ring" title="今日达成">
      <svg width="52" height="52"><circle cx="26" cy="26" r="22" fill="none" stroke="#e4dccb" stroke-width="5"></circle>
        <circle id="ringFg" cx="26" cy="26" r="22" fill="none" stroke="#c8453b" stroke-width="5"
          stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="138.2"></circle></svg>
      <div class="num" id="ringNum">0/7</div>
    </div>
  </div>
  <div class="top-in" style="padding-top:0">
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<div class="wrap">
  <main id="main"></main>
  <div class="foot">
    日本語学習ワークベンチ · 离线单文件 · N2–N1 · 每日自动轮换内容<br>
    <span class="muted">听力/口语为浏览器合成语音 · 进度保存在本机浏览器</span>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   日语学习工作台  —  单文件离线 App (N2–N1)
   模块: 听力 / 单词语法 / 阅读写作 / 口语 / 汉字 / 闯关 / 文化
   ============================================================ */

/* ---------- 工具: 日期种子 & 伪随机 ---------- */
function todayKey(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function seededShuffle(arr,seed){
  const a=arr.slice(),rng=mulberry32(seed);
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
let BATCH=0; // “换一批”偏移
function pickN(arr,n,salt){
  const seed=hashStr(todayKey()+'|'+salt+'|'+BATCH);
  return seededShuffle(arr,seed).slice(0,n);
}
function pickOne(arr,salt){return pickN(arr,1,salt)[0];}

/* ---------- 工具: 本地存储 ---------- */
const _mem={}; // 内存兜底: 当 localStorage 不可用(隐私模式/file://被拦)时仍能在会话内工作
const DB={
  get(k,d){
    if(k in _mem)return _mem[k];
    try{const v=localStorage.getItem('jpwb_'+k);if(v!=null){const o=JSON.parse(v);_mem[k]=o;return o;}}catch(e){}
    return d;
  },
  set(k,v){_mem[k]=v;try{localStorage.setItem('jpwb_'+k,JSON.stringify(v));}catch(e){}}
};
BATCH=DB.get('batch',0);

/* 今日完成状态 */
function doneState(){const all=DB.get('done',{});return all[todayKey()]||{};}
function markDone(mod,on){
  const all=DB.get('done',{});const t=all[todayKey()]||{};
  t[mod]=on?1:0;all[todayKey()]=t;DB.set('done',all);renderRing();syncTabDots();
}

/* ---------- 工具: TTS 日语朗读 ---------- */
let jaVoice=null;
function loadVoices(){
  const vs=speechSynthesis.getVoices();
  jaVoice=vs.find(v=>/ja(-|_)?JP/i.test(v.lang))||vs.find(v=>/ja/i.test(v.lang))||null;
}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
let speakRate=DB.get('rate',0.9);
function speak(text){
  if(!('speechSynthesis' in window)){alert('当前浏览器不支持语音朗读');return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='ja-JP';u.rate=speakRate;if(jaVoice)u.voice=jaVoice;
  speechSynthesis.speak(u);
}
function stopSpeak(){if('speechSynthesis' in window)speechSynthesis.cancel();}

/* ---------- 真人音频挂载接口 ----------
   给每段听力/场景挂一个真人音频(URL 持久保存 / 本地文件仅本次会话),
   挂载后出现播放器;TTS 合成音仍可随时作为后备。 */
function audioMap(){return DB.get('audiomap',{});}
function audioMountHTML(key){
  const url=audioMap()[key]||'';
  return `<div class="card flat audio-mount" data-key="${encodeURIComponent(key)}" style="margin:14px 0 0">
    <div class="row spread" style="margin-bottom:6px">
      <b style="font-size:13px">🎵 真人音频（可选）</b>
      <span class="am-status muted" style="font-size:12px">${url?'已挂载 URL':'未挂载'}</span>
    </div>
    <audio class="am-player" controls ${url?'':'style="display:none"'} ${url?`src="${url}"`:''} style="width:100%;margin-bottom:8px"></audio>
    <div class="row" style="gap:6px">
      <input class="am-url" type="url" placeholder="粘贴音频直链 (mp3/m4a/ogg …)" value="${url.replace(/"/g,'&quot;')}"
        style="flex:1;min-width:140px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;background:var(--card);color:var(--ink)">
      <button class="btn sm am-set">设置</button>
      <button class="btn sm ghost am-file">📁 本地文件</button>
      <button class="btn sm ghost am-clear" ${url?'':'style="display:none"'}>清除</button>
    </div>
    <input class="am-fileinput" type="file" accept="audio/*" style="display:none">
    <div class="muted" style="font-size:11.5px;margin-top:6px">URL 会保存在本机;本地文件仅本次会话有效。请使用你有权使用的音频。</div>
  </div>`;
}
function setupAudioMount(scope){
  scope.querySelectorAll('.audio-mount').forEach(box=>{
    const key=decodeURIComponent(box.dataset.key);
    const player=box.querySelector('.am-player');
    const urlInput=box.querySelector('.am-url');
    const status=box.querySelector('.am-status');
    const clearBtn=box.querySelector('.am-clear');
    const fileInput=box.querySelector('.am-fileinput');
    const show=(src,label)=>{player.src=src;player.style.display='block';status.textContent=label;clearBtn.style.display='inline-block';};
    box.querySelector('.am-set').onclick=()=>{
      const u=urlInput.value.trim();if(!u)return;
      const m=audioMap();m[key]=u;DB.set('audiomap',m);show(u,'已挂载 URL');
    };
    box.querySelector('.am-file').onclick=()=>fileInput.click();
    fileInput.onchange=()=>{const f=fileInput.files[0];if(!f)return;
      show(URL.createObjectURL(f),'本地文件（本次会话）');};
    clearBtn.onclick=()=>{const m=audioMap();delete m[key];DB.set('audiomap',m);
      player.pause();player.removeAttribute('src');player.style.display='none';
      urlInput.value='';status.textContent='未挂载';clearBtn.style.display='none';};
  });
}

/* ============================================================
   内置语料库
   ============================================================ */
const DATA={};

/* ---- 听力: 新闻 / 动漫 / 日剧 ---- */
DATA.listening=[
 {cat:'ニュース',catcn:'新闻',level:'n2',title:'再生可能エネルギーの拡大',
  lines:[
   {jp:'政府は来年度、再生可能エネルギーの導入をさらに加速させる方針を明らかにしました。',cn:'政府明确表示,下一年度将进一步加快可再生能源的引进。'},
   {jp:'特に太陽光と風力発電の割合を、現在の二割から三割へ引き上げることを目指しています。',cn:'尤其力求将太阳能和风力发电的比例从目前的两成提升到三成。'},
   {jp:'一方で、送電網の整備が追いつかず、課題も少なくないと専門家は指摘しています。',cn:'另一方面,专家指出输电网建设跟不上,问题也不少。'},
   {jp:'政府は民間企業への補助金を拡充し、投資を促す考えです。',cn:'政府打算扩充对民营企业的补贴,以促进投资。'}
  ],
  vocab:[{w:'再生可能',k:'さいせいかのう',cn:'可再生'},{w:'送電網',k:'そうでんもう',cn:'输电网'},{w:'補助金',k:'ほじょきん',cn:'补贴'},{w:'促す',k:'うながす',cn:'促使'}]},

 {cat:'ニュース',catcn:'新闻',level:'n1',title:'少子化対策の新制度',
  lines:[

const MODULES=[
 {id:'listen', icon:'🎧', name:'听力训练'},
 {id:'words',  icon:'📘', name:'单词语法'},
 {id:'read',   icon:'📖', name:'阅读写作'},
 {id:'speak',  icon:'🗣️', name:'口语练习'},
 {id:'kanji',  icon:'🖌️', name:'汉字特训'},
 {id:'game',   icon:'🎮', name:'闯关游戏'},
 {id:'culture',icon:'🏯', name:'文化小知识'}
];
let current='listen';

function buildTabs(){
  const nav=document.getElementById('tabs');
  nav.innerHTML='';
  MODULES.forEach(m=>{
    const b=document.createElement('button');
    b.className='tab';b.dataset.id=m.id;
    b.setAttribute('role','tab');
    b.innerHTML=`<span class="i">${m.icon}</span>${m.name}<span class="dot"></span>`;
    b.onclick=()=>switchTo(m.id);
    nav.appendChild(b);
  });
}
function switchTo(id){
  current=id;stopSpeak();
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.id===id?'true':'false'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+id));
  window.scrollTo({top:0,behavior:'smooth'});
}
function syncTabDots(){
  const d=doneState();
  document.querySelectorAll('.tab').forEach(t=>t.dataset.done=d[t.dataset.id]?'1':'0');
}
function renderRing(){
  const d=doneState();const n=MODULES.filter(m=>d[m.id]).length;
  const C=2*Math.PI*22;
  document.getElementById('ringFg').style.strokeDashoffset=C*(1-n/7);
  document.getElementById('ringNum').textContent=n+'/7';
}

/* 公共: 完成按钮 */
function doneBtn(mod){
  const on=!!doneState()[mod];
  return `<button class="btn done-btn ${on?'on':''}" data-done-mod="${mod}">${on?'✓ 今日已完成':'标记今日完成'}</button>`;
}
function bindDoneBtns(scope){
  scope.querySelectorAll('[data-done-mod]').forEach(b=>{
    b.onclick=()=>{const mod=b.dataset.doneMod;const now=!doneState()[mod];markDone(mod,now);
      b.classList.toggle('on',now);b.textContent=now?'✓ 今日已完成':'标记今日完成';};
  });
}

/* 速度滑块(听力/口语共用) */
function speedControl(){
  return `<div class="speed">语速
    <input type="range" min="0.5" max="1.2" step="0.05" value="${speakRate}" oninput="window.setRate(this.value)">
    <span id="rateVal">${speakRate.toFixed(2)}x</span></div>`;
}
window.setRate=function(v){speakRate=parseFloat(v);DB.set('rate',speakRate);
  const el=document.getElementById('rateVal');if(el)el.textContent=speakRate.toFixed(2)+'x';};

function lvlTag(lv){return `<span class="lvl ${lv}">${lv.toUpperCase()}</span>`;}

   ============================================================ */
function renderListen(){
  const item=pickOne(DATA.listening,'listen');
  const fullText=item.lines.map(l=>l.jp).join(' ');
  const html=`
   <div class="phead">
     <h2><small>Listening · 30 min</small>听力训练</h2>
     <div class="sub"><span class="cat-tag">${item.catcn} / ${item.cat}</span> ${lvlTag(item.level)}</div>
   </div>
   <div class="card">
     <div class="row spread" style="margin-bottom:6px">
       <b class="jp" style="font-size:18px">「${item.title}」</b>
       <div class="row">
         <button class="btn primary sm" id="playAll">▶ 全文朗读</button>
         <button class="btn ghost sm" id="stopAll">■ 停止</button>
       </div>
     </div>
     <div class="toolbar">${speedControl()}
       <label class="pill"><input type="checkbox" id="toggleCn"> 显示中文对照</label>
     </div>
     <div id="lines"></div>
     ${audioMountHTML('listen:'+item.title)}
     <div class="card flat" style="margin-top:14px;margin-bottom:0">
       <div class="muted" style="font-size:12px;margin-bottom:4px">重点词注音</div>
       ${item.vocab.map(v=>`<span class="vocab-chip"><b>${v.w}</b><span class="k">${v.k}</span><span class="c">${v.cn}</span></span>`).join('')}
     </div>
   </div>
   <div class="card">
     <div class="row spread">
       <div><div class="muted" style="font-size:13px">30 分钟精听计时</div>
         <div class="timer" id="timer">30:00</div></div>
       <div class="row">
         <button class="btn sm" id="tStart">开始</button>
         <button class="btn sm" id="tPause">暂停</button>
         <button class="btn sm ghost" id="tReset">重置</button>
       </div>
     </div>
   </div>
   <div class="row spread">
     ${doneBtn('listen')}
     <button class="btn ghost sm" onclick="window.shuffleDay()">🔀 换一批内容</button>
   </div>`;
  const p=document.getElementById('panel-listen');p.innerHTML=html;

  const lines=p.querySelector('#lines');
  item.lines.forEach(l=>{
    const div=document.createElement('div');div.className='listen-line';
    div.innerHTML=`<div class="lrow">
        <button class="play" title="朗读本句">▶</button>
        <div><div class="jp">${l.jp}</div><div class="cn hidden-cn">${l.cn}</div></div>
      </div>`;
    div.querySelector('.play').onclick=()=>speak(l.jp);
    lines.appendChild(div);
  });
  p.querySelector('#toggleCn').onchange=e=>p.querySelector('#lines').classList.toggle('show-cn',e.target.checked);
  p.querySelector('#playAll').onclick=()=>speak(fullText);
  p.querySelector('#stopAll').onclick=stopSpeak;
  setupAudioMount(p);
  setupTimer(p);
  bindDoneBtns(p);
}

/* 计时器 */
let timerState={left:1800,h:null};
function setupTimer(p){
  timerState.left=1800;timerState.h&&clearInterval(timerState.h);timerState.h=null;
  const disp=p.querySelector('#timer');
  const paint=()=>{const m=Math.floor(timerState.left/60),s=timerState.left%60;
    disp.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');};
  paint();
  p.querySelector('#tStart').onclick=()=>{if(timerState.h)return;
    timerState.h=setInterval(()=>{if(timerState.left>0){timerState.left--;paint();}
      else{clearInterval(timerState.h);timerState.h=null;disp.textContent='完了!';}},1000);};
  p.querySelector('#tPause').onclick=()=>{if(timerState.h){clearInterval(timerState.h);timerState.h=null;}};
  p.querySelector('#tReset').onclick=()=>{if(timerState.h){clearInterval(timerState.h);timerState.h=null;}timerState.left=1800;paint();};
}

function srsMap(){return DB.get('srs',{});}
const SRS_INTERVALS=[1,2,4,7,15,30];
function dayIndex(){return Math.floor(Date.now()/86400000);}
function srsAdd(word){const m=srsMap();if(!m[word]){m[word]={stage:0,due:dayIndex()};DB.set('srs',m);}}
function srsReview(word,ok){const m=srsMap();const s=m[word]||{stage:0,due:dayIndex()};
  s.stage=ok?Math.min(s.stage+1,SRS_INTERVALS.length-1):0;
  s.due=dayIndex()+SRS_INTERVALS[s.stage];m[word]=s;DB.set('srs',m);}
function srsDue(){const m=srsMap();const di=dayIndex();
  return DATA.words.filter(w=>m[w.w]&&m[w.w].due<=di);}

function setupRecorder(p){
  const btn=p.querySelector('#recBtn');const status=p.querySelector('#recStatus');const audio=p.querySelector('#recAudio');
  if(!navigator.mediaDevices||!window.MediaRecorder){
    btn.disabled=true;status.textContent='当前浏览器不支持录音功能。';return;}
  let recording=false;
  btn.onclick=async()=>{
    if(!recording){
      try{
        rec.stream=await navigator.mediaDevices.getUserMedia({audio:true});
        rec.mr=new MediaRecorder(rec.stream);rec.chunks=[];
        rec.mr.ondataavailable=e=>{if(e.data.size)rec.chunks.push(e.data);};
        rec.mr.onstop=()=>{
          const blob=new Blob(rec.chunks,{type:rec.chunks[0]?.type||'audio/webm'});
          audio.src=URL.createObjectURL(blob);audio.style.display='block';
          rec.stream.getTracks().forEach(t=>t.stop());
        };
        rec.mr.start();recording=true;
        btn.innerHTML='<span class="rec-dot"></span>停止录音';btn.classList.remove('primary');
        status.textContent='录音中…请跟读。';
      }catch(e){status.textContent='无法访问麦克风:'+(e.name||e.message);}
    }else{
      rec.mr&&rec.mr.state!=='inactive'&&rec.mr.stop();recording=false;
      btn.innerHTML='● 重新录音';btn.classList.add('primary');status.textContent='录音完成,可回放对比。';
    }
  };
}

function gameScore(){return DB.get('gameScore',{total:0,streak:0,best:0});}
function addScore(pts,win){
  const s=gameScore();s.total+=pts;
  if(win){s.streak++;s.best=Math.max(s.best,s.streak);}else{s.streak=0;}

}

/* 游戏1: 词义配对 */
function gMatch(area){
  const words=seededShuffle(DATA.words,Math.random()*1e9|0).slice(0,5);
  const left=seededShuffle(words,Math.random()*1e9|0);
  const right=seededShuffle(words,Math.random()*1e9|0);
  area.innerHTML=`<div class="muted" style="font-size:13px;margin-bottom:10px">点击左右两边,把单词和释义配对。</div>
    <div class="match-col"><div id="mL"></div><div id="mR"></div></div>
    <div id="mMsg" class="muted" style="margin-top:10px;font-size:13px"></div>`;
  const L=area.querySelector('#mL'),R=area.querySelector('#mR');
  left.forEach(w=>{const t=document.createElement('div');t.className='mtile jp';t.textContent=w.w;t.dataset.w=w.w;t.dataset.side='L';L.appendChild(t);});
  right.forEach(w=>{const t=document.createElement('div');t.className='mtile';t.textContent=w.cn;t.dataset.w=w.w;t.dataset.side='R';R.appendChild(t);});
  let sel=null,matched=0;
  area.querySelectorAll('.mtile').forEach(t=>t.onclick=()=>{
    if(t.classList.contains('done'))return;
    if(!sel){sel=t;t.classList.add('sel');return;}
    if(sel===t){sel.classList.remove('sel');sel=null;return;}
    if(sel.dataset.side===t.dataset.side){sel.classList.remove('sel');sel=t;t.classList.add('sel');return;}
    if(sel.dataset.w===t.dataset.w){
      sel.classList.add('done');t.classList.add('done');sel.classList.remove('sel');sel=null;matched++;
      addScore(10,true);
      if(matched===left.length)area.querySelector('#mMsg').textContent='🎉 全部配对成功!+'+(left.length*10)+'分';
    }else{
      const a=sel,b=t;a.classList.add('wrong');b.classList.add('wrong');addScore(0,false);
      setTimeout(()=>{a.classList.remove('wrong','sel');b.classList.remove('wrong');},300);sel=null;
    }
  });
}

  area.innerHTML=`<div class="muted" style="font-size:13px;margin-bottom:10px">点喇叭听发音,选出正确的单词。</div>
    <div class="row" style="justify-content:center;margin:10px 0"><button class="btn primary" id="lPlay">🔊 再听一次</button></div>
    <div id="lOpts"></div>
    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn sm ghost" id="lNext" style="display:none">下一题 →</button></div>`;
  area.querySelector('#lPlay').onclick=()=>speak(ans.w);
  speak(ans.w);
  const box=area.querySelector('#lOpts');
  opts.forEach(o=>{const b=document.createElement('button');b.className='opt';
    b.innerHTML=`<b class="jp" style="font-size:17px">${o.w}</b>　<span class="muted" style="font-size:13px">${o.cn}</span>`;
    b.onclick=()=>{if(box.dataset.done)return;box.dataset.done='1';
      if(o.w===ans.w){b.classList.add('ok');addScore(15,true);}
      else{b.classList.add('bad');addScore(0,false);
        box.querySelectorAll('.opt').forEach(x=>{if(x.textContent.includes(ans.w))x.classList.add('ok');});}
      area.querySelector('#lNext').style.display='inline-block';
    };box.appendChild(b);});
  area.querySelector('#lNext').onclick=()=>gListen(area);
}

/* 游戏3: 语法填空 */
function gGrammar(area){
  const g=seededShuffle(DATA.grammar,Math.random()*1e9|0)[0];
  const others=seededShuffle(DATA.grammar.filter(x=>x.pt!==g.pt),Math.random()*1e9|0).slice(0,3);
  const opts=seededShuffle([g,...others],Math.random()*1e9|0);
  // 把例句中的语法核心词挖空
  const blankEj=g.ej;
  area.innerHTML=`<div class="muted" style="font-size:13px;margin-bottom:10px">根据句意和释义,选出最合适的语法。</div>
    <div class="card flat"><div class="jp" style="font-size:17px">${blankEj}</div>
      <div class="cn muted" style="font-size:13px">${g.ec}</div>
      <div style="margin-top:6px;font-size:13px">语意提示: <b>${g.cn}</b></div></div>
    <div id="gOpts" style="margin-top:10px"></div>
    <div class="row" style="justify-content:center;margin-top:10px"><button class="btn sm ghost" id="gNext" style="display:none">下一题 →</button></div>`;
  const box=area.querySelector('#gOpts');
  opts.forEach(o=>{const b=document.createElement('button');b.className='opt';
    b.innerHTML=`<b class="pt" style="font-family:var(--serif);font-size:16px;color:var(--shu-deep)">${o.pt}</b>`;
    b.onclick=()=>{if(box.dataset.done)return;box.dataset.done='1';
      if(o.pt===g.pt){b.classList.add('ok');addScore(15,true);}
      else{b.classList.add('bad');addScore(0,false);
        box.querySelectorAll('.opt').forEach(x=>{if(x.textContent.trim()===g.pt)x.classList.add('ok');});}
      area.querySelector('#gNext').style.display='inline-block';
    };box.appendChild(b);});
  area.querySelector('#gNext').onclick=()=>gGrammar(area);
}

/* ============================================================
   模块 7: 文化小知识
   ============================================================ */
function renderCulture(){
  const todayC=pickOne(DATA.culture,'culture');
  const more=pickN(DATA.culture.filter(c=>c.t!==todayC.t),3,'culture-more');
  const p=document.getElementById('panel-culture');
  p.innerHTML=`
   <div class="phead"><h2><small>Japanese Culture</small>文化小知识</h2>
     <div class="sub">每日一则 · 日本文化 & 冷知识</div></div>
   <div class="card culture">
     <div class="c-emoji">${todayC.e}</div>
     <h3>${todayC.t}</h3>
     <div class="muted" style="font-size:13px">キーワード: <span class="term">${todayC.term}</span>
       <button class="btn sm ghost" onclick="window.speakJP('${todayC.term.replace(/\(.*\)/,'')}')">🔊</button></div>
     <p style="margin-top:10px;line-height:1.85">${todayC.body}</p>
   </div>
   <div class="card">
     <b>📚 延伸阅读</b>
     <div id="moreC" style="margin-top:10px"></div>
   </div>
   <div class="row spread">${doneBtn('culture')}
     <button class="btn ghost sm" onclick="window.shuffleDay()">🔀 换一批内容</button></div>`;
  const mc=p.querySelector('#moreC');
  mc.innerHTML=more.map(c=>`<details class="model" style="background:var(--card)">
     <summary>${c.e} ${c.t}　<span class="muted" style="font-weight:400">${c.term}</span></summary>
     <p style="padding-bottom:10px;line-height:1.8">${c.body}</p></details>`).join('');
  bindDoneBtns(p);
}

/* ============================================================
   启动
   ============================================================ */
function buildPanels(){
  const main=document.getElementById('main');
  main.innerHTML=MODULES.map((m,i)=>`<section class="panel ${i===0?'active':''}" id="panel-${m.id}"></section>`).join('');
}
const RENDERERS={listen:renderListen,words:renderWords,read:renderRead,speak:renderSpeak,kanji:renderKanji,game:renderGame,culture:renderCulture};
function renderAll(){Object.values(RENDERERS).forEach(fn=>{try{fn();}catch(e){console.error(e);}});}

window.shuffleDay=function(){
  BATCH++;DB.set('batch',BATCH);
  renderAll();switchTo(current);
  const el=document.querySelector('.panel.active');
  if(el){el.style.animation='none';void el.offsetWidth;el.style.animation='';}
};

function init(){
  const d=new Date();
  const wk=['日','月','火','水','木','金','土'][d.getDay()];
  document.getElementById('dateLabel').textContent=
    `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${wk}）· 今日のメニュー`;
  buildTabs();buildPanels();renderAll();
  document.querySelector('.tab').setAttribute('aria-selected','true');
  renderRing();syncTabDots();
}
init();
</script>
