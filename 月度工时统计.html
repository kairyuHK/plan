<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>月度工时 · Hours Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Geist:wght@300..600&family=JetBrains+Mono:wght@300..500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0a0c;
    --surface: #121216;
    --surface-2: #181820;
    --surface-3: #1f1f29;
    --border: #26262f;
    --border-soft: #1c1c24;
    --text: #ece8df;
    --text-dim: #8a8780;
    --text-faint: #54524c;
    --accent: #d4a574;
    --accent-dim: #8a6e4d;
    --c-normal: #8fa593;
    --c-ot: #d4a574;
    --c-holiday: #d08566;
    --c-leave: #8aa3c0;
    --c-absent: #6c6c75;
    --c-weekend: #b89c7e;
    --c-sun: #d76b6b;
    --c-sat: #6b8fd7;
    --radius: 4px;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.25);
    --font-display: 'Fraunces', 'Songti SC', 'STSong', serif;
    --font-body: 'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }

  html[data-theme="light"] {
    --bg: #f5f2ea;
    --surface: #fbf9f3;
    --surface-2: #f0ece2;
    --surface-3: #e7e1d3;
    --border: #d9d2c1;
    --border-soft: #e8e2d2;
    --text: #1f1d18;
    --text-dim: #6a6760;
    --text-faint: #a8a59a;
    --accent: #9a6f3e;
    --accent-dim: #c19465;
    --c-normal: #6b8a73;
    --c-ot: #9a6f3e;
    --c-holiday: #b25e3e;
    --c-leave: #5f7a98;
    --c-absent: #9a9a9f;
    --c-weekend: #8a6e4d;
    --c-sun: #c43d3d;
    --c-sat: #2c5a9e;
    --shadow: 0 1px 2px rgba(60,40,20,0.06), 0 12px 32px rgba(60,40,20,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-feature-settings: "ss01", "cv11";
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  body {
    background-image:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(212,165,116,0.11), transparent 60%),
      radial-gradient(ellipse 60% 50% at 90% 100%, rgba(138,163,192,0.07), transparent 60%),
      radial-gradient(ellipse 40% 30% at 10% 40%, rgba(208,133,102,0.05), transparent 60%);
  }

  html[data-theme="light"] body {
    background-image:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(154,111,62,0.12), transparent 60%),
      radial-gradient(ellipse 50% 40% at 90% 80%, rgba(95,122,152,0.05), transparent 60%);
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 48px 32px 96px;
  }

  /* ─── Header ─── */
  header.top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 56px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .brand .eyebrow {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-faint);
  }
  .brand h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-variation-settings: "opsz" 144, "SOFT" 30;
    font-size: clamp(32px, 5vw, 46px);
    line-height: 1.0;
    letter-spacing: -0.02em;
  }
  .brand h1 em {
    font-style: italic;
    color: var(--accent);
    font-weight: 300;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .icon-btn, .ghost-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.05em;
    padding: 9px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .icon-btn:hover, .ghost-btn:hover {
    color: var(--text);
    border-color: var(--text-dim);
    background: var(--surface);
  }
  .icon-btn svg { width: 14px; height: 14px; }

  /* ─── Month nav ─── */
  .month-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .month-pick {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .month-pick button.nav {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .month-pick button.nav:hover {
    color: var(--accent);
    border-color: var(--accent-dim);
  }
  .month-title {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 120;
    font-size: 30px;
    font-weight: 300;
    letter-spacing: -0.01em;
    min-width: 200px;
    text-align: center;
    cursor: pointer;
    position: relative;
  }
  .month-title .yr {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-faint);
    letter-spacing: 0.1em;
    display: block;
    margin-top: 2px;
    font-weight: 300;
  }
  .month-title input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .config {
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
  }
  .config label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .config input[type="number"],
  .config input[type="text"] {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 4px 6px;
    border-radius: 3px;
    text-align: center;
  }
  .config input[type="number"] { width: 44px; }
  .config input[type="text"] { width: 130px; text-align: left; letter-spacing: 0.04em; }

  /* ─── Stats grid ─── */
  .stats {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    margin-bottom: 56px;
    border-radius: var(--radius);
    overflow: hidden;
  }
  .stat {
    background: var(--surface);
    padding: 28px 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    position: relative;
    overflow: hidden;
    transition: transform 0.32s cubic-bezier(0.2,0.7,0.2,1), background 0.32s ease;
  }
  .stat::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--stat-color, var(--accent));
    opacity: 0.55;
    transform-origin: left;
    transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.2,0.7,0.2,1);
  }
  .stat:hover { transform: translateY(-2px); background: var(--surface-2); }
  .stat:hover::after { opacity: 1; }
  .stat:first-child {
    background:
      radial-gradient(ellipse 120% 80% at 0% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%),
      var(--surface);
  }
  .stat:first-child::before {
    content: '';
    position: absolute;
    right: -40px; bottom: -40px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%);
    pointer-events: none;
  }
  .stat:first-child .value { font-size: 56px; }
  .stat .label {
    font-family: var(--font-mono);
    font-size: 11.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat .label::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--stat-color, var(--accent));
  }
  .stat .value {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 144;
    font-weight: 400;
    font-size: 44px;
    line-height: 1;
    letter-spacing: -0.025em;
    color: var(--text);
    font-feature-settings: "tnum";
  }
  .stat .value .unit {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--text-dim);
    margin-left: 4px;
    font-weight: 400;
    letter-spacing: 0.05em;
  }
  .stat .value .dec {
    font-size: 0.55em;
    color: var(--text-dim);
    font-weight: 400;
    letter-spacing: 0;
    margin-left: 1px;
    vertical-align: 0.05em;
  }
  .stat .sub {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-faint);
    margin-top: 2px;
  }

  /* ─── Day list ─── */
  .ledger {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .day.menu-open { position: relative; z-index: 100; }
  .ledger-head {
    display: grid;
    grid-template-columns: 90px 130px 1fr 1fr 110px 110px;
    gap: 12px;
    padding: 14px 24px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text);
    opacity: 0.75;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
  }
  .ledger-head > div { text-align: center; }
  .ledger-head > div:nth-child(2),
  .ledger-head > div:nth-child(3),
  .ledger-head > div:nth-child(4) { transform: translateX(-14px); }

  .day {
    display: grid;
    grid-template-columns: 90px 130px 1fr 1fr 110px 110px;
    padding: 14px 24px;
    align-items: center;
    border-bottom: 1px solid var(--border-soft);
    transition: background 0.2s ease;
    gap: 12px;
    position: relative;
  }
  .day:last-child { border-bottom: none; }
  .day::after {
    content: '';
    position: absolute;
    left: 0; top: 14%; bottom: 14%;
    width: 2px;
    background: var(--accent-dim);
    transform: scaleY(0);
    transition: transform 0.28s cubic-bezier(0.2,0.7,0.2,1);
    pointer-events: none;
  }
  .day:hover { background: var(--surface-2); }
  .day:not(.today):hover::after { transform: scaleY(1); }
  .day.today {
    background: linear-gradient(90deg, rgba(212,165,116,0.07), transparent 40%);
  }
  html[data-theme="light"] .day.today {
    background: linear-gradient(90deg, rgba(154,111,62,0.08), transparent 40%);
  }
  .day.today::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--accent);
    animation: todayPulse 2.6s ease-in-out infinite;
  }
  @keyframes todayPulse {
    0%, 100% { opacity: 0.55; box-shadow: 0 0 0 0 transparent; }
    50%      { opacity: 1;    box-shadow: 0 0 12px 0 var(--accent); }
  }
  .day.dow-sun .date .d, .day.dow-sun .date .wd,
  .day.is-jp-holiday .date .d, .day.is-jp-holiday .date .wd { color: var(--c-sun); }
  .day.dow-sat .date .d, .day.dow-sat .date .wd { color: var(--c-sat); }
  .day .date .jpname {
    font-family: var(--font-body);
    font-size: 10px;
    color: var(--c-sun);
    letter-spacing: 0.02em;
    margin-top: 3px;
    line-height: 1.2;
    max-width: 88px;
    word-break: break-all;
  }
  .day.has-tag-absent { opacity: 0.55; }

  .day .date {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 2px;
  }
  .day .date .d {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 96;
    font-weight: 300;
    font-size: 28px;
    line-height: 1;
    letter-spacing: -0.02em;
    font-feature-settings: "tnum";
  }
  .day .date .wd {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .day .tag-cell {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .tag-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 12px 6px 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s ease;
    width: 100%;
    max-width: 130px;
    justify-content: flex-start;
  }
  .tag-pill:hover {
    border-color: var(--text-dim);
    background: var(--surface-3);
  }
  .tag-pill .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--tag-color, var(--text-dim));
    flex-shrink: 0;
  }
  .tag-pill .chev {
    margin-left: auto;
    color: var(--text-faint);
    font-size: 10px;
  }
  .tag-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    background: var(--surface-3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    z-index: 200;
    min-width: 140px;
    padding: 4px;
    display: none;
  }
  .tag-menu.open { display: block; }
  .tag-menu button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 8px 10px;
    font-family: var(--font-body);
    font-size: 12px;
    cursor: pointer;
    border-radius: 3px;
    text-align: left;
  }
  .tag-menu button:hover { background: var(--surface); }
  .tag-menu button .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
  }

  .time-input {
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--border);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 15px;
    padding: 6px 4px;
    width: 90px;
    letter-spacing: 0.02em;
    font-feature-settings: "tnum";
    color-scheme: dark;
    transition: border-color 0.15s ease;
    text-align: center;
    justify-self: center;
  }
  html[data-theme="light"] .time-input { color-scheme: light; }
  .time-input:hover { border-bottom-color: var(--text-dim); }
  .time-input:focus {
    outline: none;
    border-bottom: 1px solid var(--accent);
  }
  .time-input::-webkit-calendar-picker-indicator {
    filter: invert(0.6);
    opacity: 0.5;
    cursor: pointer;
  }
  html[data-theme="light"] .time-input::-webkit-calendar-picker-indicator {
    filter: invert(0.3);
  }

  .day .num {
    font-family: var(--font-mono);
    font-size: 14px;
    font-feature-settings: "tnum";
    text-align: center;
    letter-spacing: 0.01em;
  }
  .day .num.work { color: var(--c-normal); }
  .day .num.ot { color: var(--c-ot); }
  .day .num.zero { color: var(--text-faint); }

  .day.has-tag-holiday .num.ot,
  .day.has-tag-restday .num.ot { color: var(--c-holiday); }

  /* ─── Footer note ─── */
  .footnote {
    margin-top: 32px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    text-align: center;
    letter-spacing: 0.04em;
    line-height: 1.7;
  }
  .footnote em {
    font-family: var(--font-display);
    font-style: italic;
    color: var(--text-dim);
    font-size: 12px;
  }

  /* ─── Animations ─── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .stat, .day {
    animation: fadeUp 0.5s ease both;
  }
  .stat:nth-child(1) { animation-delay: 0.05s; }
  .stat:nth-child(2) { animation-delay: 0.12s; }
  .stat:nth-child(3) { animation-delay: 0.19s; }
  .stat:nth-child(4) { animation-delay: 0.26s; }
  .stat:nth-child(5) { animation-delay: 0.33s; }

  /* ─── Responsive ─── */
  @media (max-width: 880px) {
    .wrap { padding: 24px 16px 64px; }
    header.top { margin-bottom: 32px; padding-bottom: 16px; flex-wrap: wrap; }
    .stats { grid-template-columns: repeat(2, 1fr); margin-bottom: 32px; }
    .stat { padding: 20px 16px; }
    .stat .value { font-size: 34px; }
    .ledger-head { display: none; }
    .day {
      grid-template-columns: 88px 1fr;
      grid-template-areas:
        "date tag"
        "date times"
        "date nums";
      padding: 16px;
      gap: 10px 16px;
      row-gap: 10px;
    }
    .day .date { grid-area: date; align-self: flex-start; }
    .day .tag-cell { grid-area: tag; }
    .day .times {
      grid-area: times;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .day .times .sep {
      color: var(--text-faint);
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .day .nums {
      grid-area: nums;
      display: flex;
      gap: 20px;
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .day .nums .nlbl { color: var(--text-faint); margin-right: 4px; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; }
    .month-title { font-size: 24px; min-width: 160px; }
    .config { width: 100%; justify-content: space-between; }
  }

  /* Desktop helpers (hide mobile-only wrappers) */
  @media (min-width: 881px) {
    .day .times-wrap { display: contents; }
    .day .times { display: contents; }
    .day .nums { display: contents; }
    .day .times .sep { display: none; }
    .day .nums .nlbl { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="eyebrow">Hours · Ledger · 工时账</div>
      <h1>月度工时<em>统计</em></h1>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="todayBtn" title="跳到本月">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 2"/>
        </svg>
        今天
      </button>
      <button class="icon-btn" id="themeBtn" title="切换主题">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button class="icon-btn" id="importBtn" title="从 JSON 文件导入">导入</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden />
      <button class="icon-btn" id="exportBtn" title="导出全部数据为 JSON">导出</button>
      <button class="icon-btn" id="clearBtn" title="清空当月数据">清空</button>
    </div>
  </header>

  <div class="month-row">
    <div class="month-pick">
      <button class="nav" id="prevBtn" aria-label="上月">‹</button>
      <div class="month-title" id="monthTitle">
        <span id="monthLabel">五月</span>
        <span class="yr" id="yearLabel">2026</span>
        <input type="month" id="monthInput" />
      </div>
      <button class="nav" id="nextBtn" aria-label="下月">›</button>
    </div>
    <div class="config">
      <label>标准工时
        <input type="number" id="stdHours" min="1" max="24" step="0.5" value="8" />
        <span>h</span>
      </label>
      <label>午休扣除
        <input type="number" id="lunchHours" min="0" max="4" step="0.5" value="1" />
        <span>h</span>
      </label>
      <label title="周期起始日:从这一天到下个月该日前一天为一个周期(1 = 自然月)">起始日
        <input type="number" id="cycleStart" min="1" max="28" step="1" value="1" />
      </label>
    </div>
  </div>

  <section class="stats" id="stats"></section>

  <section class="ledger">
    <div class="ledger-head">
      <div>日期</div>
      <div>标签</div>
      <div>上班</div>
      <div>下班</div>
      <div>实际工时</div>
      <div>加班</div>
    </div>
    <div id="days"></div>
  </section>

  <p class="footnote">
    数据自动保存于本地浏览器 · <em>localStorage</em> · 切换设备不同步<br/>
    工作日 / 节假日上班 工时超出 标准工时 计为加班
  </p>
</div>

<script>
(() => {
  'use strict';

  const TAGS = {
    workday:  { label: '工作日',     color: 'var(--c-normal)' },
    restday:  { label: '休息日',     color: 'var(--c-weekend)' },
    holiday:  { label: '节假日上班', color: 'var(--c-holiday)' },
    leave:    { label: '带薪休假',   color: 'var(--c-leave)' },
    absent:   { label: '请假缺勤',   color: 'var(--c-absent)' },
  };
  const WD_JP = ['日','月','火','水','木','金','土'];
  const MONTH_CN = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const LS_KEY = 'hours-ledger-v1';

  // 日本の祝日 (2024 – 2027). 春分/秋分は官報の確定日に基づく。振替休日・国民の休日を含む。
  const JP_HOLIDAYS = {
    '2024-01-01': '元日',
    '2024-01-08': '成人の日',
    '2024-02-11': '建国記念の日',
    '2024-02-12': '振替休日',
    '2024-02-23': '天皇誕生日',
    '2024-03-20': '春分の日',
    '2024-04-29': '昭和の日',
    '2024-05-03': '憲法記念日',
    '2024-05-04': 'みどりの日',
    '2024-05-05': 'こどもの日',
    '2024-05-06': '振替休日',
    '2024-07-15': '海の日',
    '2024-08-11': '山の日',
    '2024-08-12': '振替休日',
    '2024-09-16': '敬老の日',
    '2024-09-22': '秋分の日',
    '2024-09-23': '振替休日',
    '2024-10-14': 'スポーツの日',
    '2024-11-03': '文化の日',
    '2024-11-04': '振替休日',
    '2024-11-23': '勤労感謝の日',
    '2025-01-01': '元日',
    '2025-01-13': '成人の日',
    '2025-02-11': '建国記念の日',
    '2025-02-23': '天皇誕生日',
    '2025-02-24': '振替休日',
    '2025-03-20': '春分の日',
    '2025-04-29': '昭和の日',
    '2025-05-03': '憲法記念日',
    '2025-05-04': 'みどりの日',
    '2025-05-05': 'こどもの日',
    '2025-05-06': '振替休日',
    '2025-07-21': '海の日',
    '2025-08-11': '山の日',
    '2025-09-15': '敬老の日',
    '2025-09-23': '秋分の日',
    '2025-10-13': 'スポーツの日',
    '2025-11-03': '文化の日',
    '2025-11-23': '勤労感謝の日',
    '2025-11-24': '振替休日',
    '2026-01-01': '元日',
    '2026-01-12': '成人の日',
    '2026-02-11': '建国記念の日',
    '2026-02-23': '天皇誕生日',
    '2026-03-20': '春分の日',
    '2026-04-29': '昭和の日',
    '2026-05-03': '憲法記念日',
    '2026-05-04': 'みどりの日',
    '2026-05-05': 'こどもの日',
    '2026-05-06': '振替休日',
    '2026-07-20': '海の日',
    '2026-08-11': '山の日',
    '2026-09-21': '敬老の日',
    '2026-09-22': '国民の休日',
    '2026-09-23': '秋分の日',
    '2026-10-12': 'スポーツの日',
    '2026-11-03': '文化の日',
    '2026-11-23': '勤労感謝の日',
    '2027-01-01': '元日',
    '2027-01-11': '成人の日',
    '2027-02-11': '建国記念の日',
    '2027-02-23': '天皇誕生日',
    '2027-03-21': '春分の日',
    '2027-03-22': '振替休日',
    '2027-04-29': '昭和の日',
    '2027-05-03': '憲法記念日',
    '2027-05-04': 'みどりの日',
    '2027-05-05': 'こどもの日',
    '2027-07-19': '海の日',
    '2027-08-11': '山の日',
    '2027-09-20': '敬老の日',
    '2027-09-23': '秋分の日',
    '2027-10-11': 'スポーツの日',
    '2027-11-03': '文化の日',
    '2027-11-23': '勤労感謝の日',
  };

  // ─── State ───
  const state = load() || {
    cursor: ymKey(new Date()),
    stdHours: 8,
    lunchHours: 1,
    theme: 'dark',
    days: {},
    restdays: {},
    cycleStart: 1,
  };
  // Migrate older saves
  if (!state.restdays) state.restdays = {};
  if (state.cycleStart == null) state.cycleStart = 1;
  // 旧格式 restdays: { 'YYYY-MM': [day,...] } → 新格式 { 'YYYY-MM-DD': true }
  const _firstVal = Object.values(state.restdays)[0];
  if (Array.isArray(_firstVal)) {
    const old = state.restdays;
    state.restdays = {};
    for (const ym in old) {
      for (const d of old[ym]) {
        state.restdays[`${ym}-${String(d).padStart(2,'0')}`] = true;
      }
    }
  }
  for (const k in state.days) {
    if (state.days[k]?.tag === 'weekend') state.days[k].tag = 'restday';
  }

  function save() {
    localStorage.setItem(LS_KEY, JSON.stringify(state));
  }
  function load() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)); }
    catch { return null; }
  }

  function ymKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }
  function ymdKey(y, m, d) {
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  function parseYM(k) {
    const [y, m] = k.split('-').map(Number);
    return { y, m: m - 1 };
  }
  function daysInMonth(y, m) {
    return new Date(y, m + 1, 0).getDate();
  }
  function timeToMin(t) {
    if (!t) return null;
    const [h, m] = t.split(':').map(Number);
    return h * 60 + m;
  }
  function fmtHours(h) {
    if (h == null || isNaN(h)) return '—';
    if (h === 0) return '0';
    return h.toFixed(1).replace(/\.0$/, '');
  }
  function fmtStatValue(h) {
    const s = fmtHours(h);
    return s.replace(/\.(\d+)/, '<span class="dec">.$1</span>');
  }
  function defaultTag(y, m, d) {
    const dateKey = ymdKey(y, m, d);
    if (JP_HOLIDAYS[dateKey]) return 'holiday';
    if (state.restdays[dateKey]) return 'restday';
    return 'workday';
  }

  // 返回当前 cursor 对应的周期 [start, end](Date 对象, 不含时分秒)
  function periodRange(cursor, cycleStart) {
    const { y, m } = parseYM(cursor);
    if (cycleStart <= 1) {
      return { start: new Date(y, m, 1), end: new Date(y, m, daysInMonth(y, m)) };
    }
    // 起始日 = 前一个日历月的 cycleStart 号
    const prevY = m === 0 ? y - 1 : y;
    const prevM = (m + 11) % 12;
    const startDay = Math.min(cycleStart, daysInMonth(prevY, prevM));
    const start = new Date(prevY, prevM, startDay);
    const endDay = Math.min(cycleStart - 1, daysInMonth(y, m));
    const end = new Date(y, m, endDay);
    return { start, end };
  }

  // 返回某个日期归属的 cursor("YYYY-MM")
  function cursorForDate(date, cycleStart) {
    if (cycleStart <= 1) return ymKey(date);
    if (date.getDate() >= cycleStart) {
      return ymKey(new Date(date.getFullYear(), date.getMonth() + 1, 1));
    }
    return ymKey(date);
  }

  // ─── Calculation ───
  function calcDay(rec, y, m, d) {
    const tag = rec?.tag || defaultTag(y, m, d);
    const inMin = timeToMin(rec?.in);
    const outMin = timeToMin(rec?.out);

    let work = 0, normal = 0, ot = 0, holidayHrs = 0, attended = false, absent = false;

    if (tag === 'absent') {
      absent = true;
    } else if (tag === 'restday') {
      // 休息日: 真休息,不计工时
    } else if (tag === 'leave') {
      normal = state.stdHours;
      attended = true;
    } else if (inMin != null && outMin != null && outMin > inMin) {
      let span = (outMin - inMin) / 60;
      if (span > 6) span -= state.lunchHours;
      work = Math.max(0, span);
      attended = work > 0;
      if (tag === 'workday') {
        normal = Math.min(work, state.stdHours);
        ot = Math.max(0, work - state.stdHours);
      } else if (tag === 'holiday') {
        normal = Math.min(work, state.stdHours);
        ot = Math.max(0, work - state.stdHours);
        holidayHrs = work;
      }
    }
    return { tag, work, normal, ot, holidayHrs, attended, absent };
  }

  // ─── Render ───
  const els = {
    monthLabel: document.getElementById('monthLabel'),
    yearLabel: document.getElementById('yearLabel'),
    monthInput: document.getElementById('monthInput'),
    stats: document.getElementById('stats'),
    days: document.getElementById('days'),
    stdHours: document.getElementById('stdHours'),
    lunchHours: document.getElementById('lunchHours'),
    cycleStart: document.getElementById('cycleStart'),
  };

  function render() {
    els.stdHours.value = state.stdHours;
    els.lunchHours.value = state.lunchHours;
    els.cycleStart.value = state.cycleStart;

    const { y, m } = parseYM(state.cursor);
    const { start, end } = periodRange(state.cursor, state.cycleStart);

    els.monthLabel.textContent = MONTH_CN[m];
    if (state.cycleStart > 1) {
      const fmt = dt => `${dt.getMonth() + 1}/${dt.getDate()}`;
      els.yearLabel.textContent = `${fmt(start)} – ${fmt(end)}`;
    } else {
      els.yearLabel.textContent = `${y}`;
    }
    els.monthInput.value = state.cursor;

    document.documentElement.dataset.theme = state.theme;

    const today = new Date();
    const todayKey = ymdKey(today.getFullYear(), today.getMonth(), today.getDate());

    let totalNormal = 0, totalOT = 0, totalHoliday = 0, attendedCount = 0, absentCount = 0;

    const frag = document.createDocumentFragment();
    const iter = new Date(start);
    while (iter <= end) {
      const yy = iter.getFullYear();
      const mm = iter.getMonth();
      const d = iter.getDate();
      const key = ymdKey(yy, mm, d);
      const wd = iter.getDay();
      const rec = state.days[key];
      const calc = calcDay(rec, yy, mm, d);

      totalNormal += calc.normal;
      totalOT += calc.ot;
      totalHoliday += calc.holidayHrs;
      if (calc.attended) attendedCount++;
      if (calc.absent) absentCount++;

      const jpHoliday = JP_HOLIDAYS[key];

      const row = document.createElement('div');
      row.className = `day has-tag-${calc.tag}`;
      if (wd === 0) row.classList.add('dow-sun');
      else if (wd === 6) row.classList.add('dow-sat');
      if (jpHoliday) row.classList.add('is-jp-holiday');
      if (key === todayKey) row.classList.add('today');

      const tag = TAGS[calc.tag];
      const showTimes = calc.tag !== 'leave' && calc.tag !== 'absent' && calc.tag !== 'restday';

      row.innerHTML = `
        <div class="date">
          <div class="d">${String(d).padStart(2,'0')}</div>
          <div class="wd">${WD_JP[wd]}</div>
          ${jpHoliday ? `<div class="jpname" title="${jpHoliday}">${jpHoliday}</div>` : ''}
        </div>
        <div class="tag-cell">
          <button class="tag-pill" data-key="${key}" style="--tag-color:${tag.color}">
            <span class="dot"></span>
            <span class="tlabel">${tag.label}</span>
            <span class="chev">▾</span>
          </button>
          <div class="tag-menu" data-menu="${key}">
            ${Object.entries(TAGS).map(([k, v]) => `
              <button data-set-tag="${k}" data-key="${key}">
                <span class="dot" style="background:${v.color}"></span>
                <span>${v.label}</span>
              </button>
            `).join('')}
          </div>
        </div>
        <div class="times-wrap">
          <div class="times">
            <input type="time" class="time-input" data-field="in" data-key="${key}"
              value="${rec?.in || ''}" ${showTimes ? '' : 'disabled'} />
            <span class="sep">→</span>
            <input type="time" class="time-input" data-field="out" data-key="${key}"
              value="${rec?.out || ''}" ${showTimes ? '' : 'disabled'} />
          </div>
        </div>
        <div class="nums">
          <div class="num work ${calc.normal+calc.ot ? '' : 'zero'}">
            <span class="nlbl">实际</span>${fmtHours(calc.work || calc.normal)}
          </div>
          <div class="num ot ${calc.ot ? '' : 'zero'}">
            <span class="nlbl">加班</span>${calc.ot ? '+' + fmtHours(calc.ot) : '—'}
          </div>
        </div>
      `;
      frag.appendChild(row);
      iter.setDate(iter.getDate() + 1);
    }
    els.days.innerHTML = '';
    els.days.appendChild(frag);

    renderStats({ totalNormal, totalOT, totalHoliday, attendedCount, absentCount });
  }

  function renderStats(s) {
    const cards = [
      { label: '上班总计', value: s.totalNormal + s.totalOT, unit: 'h', color: 'var(--accent)', sub: '正常 + 加班 全部到岗时长' },
      { label: '正常工时', value: s.totalNormal, unit: 'h', color: 'var(--c-normal)', sub: '工作日 + 带薪休假 + 节假日上班' },
      { label: '加班总计', value: s.totalOT, unit: 'h', color: 'var(--c-ot)', sub: '工作日 + 节假日上班溢出' },
      { label: '节假日工时', value: s.totalHoliday, unit: 'h', color: 'var(--c-holiday)', sub: '节假日上班时长' },
      { label: '出勤 / 缺勤', value: `${s.attendedCount}`, unit: `/ ${s.absentCount}`, color: 'var(--c-leave)', sub: '天数' },
    ];
    els.stats.innerHTML = cards.map(c => `
      <div class="stat" style="--stat-color:${c.color}">
        <div class="label">${c.label}</div>
        <div class="value">${typeof c.value === 'number' ? fmtStatValue(c.value) : c.value}<span class="unit">${c.unit}</span></div>
        <div class="sub">${c.sub}</div>
      </div>
    `).join('');
  }

  // ─── Events (delegated, bound once) ───
  function closeAllMenus() {
    els.days.querySelectorAll('.tag-menu.open').forEach(m => {
      m.classList.remove('open');
      m.closest('.day')?.classList.remove('menu-open');
    });
  }

  els.days.addEventListener('change', e => {
    const inp = e.target.closest('.time-input');
    if (!inp) return;
    const key = inp.dataset.key;
    const field = inp.dataset.field;
    const rec = state.days[key] || {};
    rec[field] = inp.value;
    state.days[key] = rec;
    save();
    // 不在这里 render —— 移动端原生选择器还没选完分钟时,
    // 重建 DOM 会让选择器锚点丢失而提前关闭。
  });

  // 输入框失焦后再统一重渲染,确保计算结果同步。
  els.days.addEventListener('focusout', e => {
    if (!e.target.closest('.time-input')) return;
    setTimeout(() => {
      if (!els.days.contains(document.activeElement)) render();
    }, 0);
  });

  // mousedown so the action fires before any focus/blur side-effects.
  els.days.addEventListener('mousedown', e => {
    const opt = e.target.closest('[data-set-tag]');
    if (opt) {
      e.preventDefault();
      e.stopPropagation();
      const key = opt.dataset.key;
      const newTag = opt.dataset.setTag;
      const rec = state.days[key] || {};
      rec.tag = newTag;
      if (newTag === 'restday' || newTag === 'absent' || newTag === 'leave') {
        delete rec.in;
        delete rec.out;
      }
      state.days[key] = rec;
      save();
      render();
      return;
    }
    const pill = e.target.closest('.tag-pill');
    if (pill) {
      e.preventDefault();
      e.stopPropagation();
      const key = pill.dataset.key;
      const menu = els.days.querySelector(`.tag-menu[data-menu="${key}"]`);
      const isOpen = menu?.classList.contains('open');
      closeAllMenus();
      if (menu && !isOpen) {
        menu.classList.add('open');
        menu.closest('.day')?.classList.add('menu-open');
      }
    }
  });

  document.addEventListener('mousedown', e => {
    if (e.target.closest('.tag-pill') || e.target.closest('.tag-menu')) return;
    closeAllMenus();
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    const { y, m } = parseYM(state.cursor);
    const nd = new Date(y, m - 1, 1);
    state.cursor = ymKey(nd);
    save(); render();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    const { y, m } = parseYM(state.cursor);
    const nd = new Date(y, m + 1, 1);
    state.cursor = ymKey(nd);
    save(); render();
  });
  document.getElementById('todayBtn').addEventListener('click', () => {
    state.cursor = cursorForDate(new Date(), state.cycleStart);
    save(); render();
  });
  els.monthInput.addEventListener('change', e => {
    if (e.target.value) {
      state.cursor = e.target.value;
      save(); render();
    }
  });
  document.getElementById('themeBtn').addEventListener('click', () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    save(); render();
  });
  document.getElementById('clearBtn').addEventListener('click', () => {
    if (!confirm('清空当前周期所有录入数据？')) return;
    const { start, end } = periodRange(state.cursor, state.cycleStart);
    Object.keys(state.days).forEach(k => {
      const [yy, mm, dd] = k.split('-').map(Number);
      const dt = new Date(yy, mm - 1, dd);
      if (dt >= start && dt <= end) delete state.days[k];
    });
    save(); render();
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `月度工时${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  const importFile = document.getElementById('importFile');
  document.getElementById('importBtn').addEventListener('click', () => importFile.click());
  importFile.addEventListener('change', e => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || typeof data !== 'object' || typeof data.days !== 'object') {
          throw new Error('文件格式不正确:缺少 days 字段');
        }
        if (!confirm('导入将覆盖当前所有数据,确定继续？')) return;
        Object.keys(state).forEach(k => delete state[k]);
        Object.assign(state, {
          cursor: data.cursor || ymKey(new Date()),
          stdHours: Number(data.stdHours) || 8,
          lunchHours: Number(data.lunchHours) || 1,
          theme: data.theme === 'light' ? 'light' : 'dark',
          days: data.days || {},
          restdays: data.restdays || {},
        });
        // 兼容老数据:weekend → restday
        for (const k in state.days) {
          if (state.days[k]?.tag === 'weekend') state.days[k].tag = 'restday';
        }
        save();
        render();
        alert('导入成功');
      } catch (err) {
        alert('导入失败:' + err.message);
      } finally {
        e.target.value = '';
      }
    };
    reader.readAsText(file);
  });
  els.stdHours.addEventListener('change', e => {
    state.stdHours = Math.max(1, parseFloat(e.target.value) || 8);
    save(); render();
  });
  els.lunchHours.addEventListener('change', e => {
    state.lunchHours = Math.max(0, parseFloat(e.target.value) || 0);
    save(); render();
  });
  els.cycleStart.addEventListener('change', e => {
    const v = parseInt(e.target.value, 10);
    state.cycleStart = Math.max(1, Math.min(28, Number.isFinite(v) ? v : 1));
    // 调整 cursor 到包含 "今天" 的周期, 让感觉自然
    state.cursor = cursorForDate(new Date(), state.cycleStart);
    save(); render();
  });
  render();
})();
</script>
</body>
</html>
