<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>月度工时 · Hours</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Geist:wght@300..600&family=JetBrains+Mono:wght@300..500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0b0e;
    --surface: #14161d;
    --surface-2: #1a1d26;
    --surface-3: #232631;
    --border: #262936;
    --border-soft: #1d2029;
    --text: #ececf1;
    --text-dim: #8a8d99;
    --text-faint: #5a5d6a;
    --accent: #5eead4;
    --accent-dim: #2dd4bf;
    --accent-deep: #0d9488;
    --accent-glow: rgba(94, 234, 212, 0.18);

    /* tag / semantic colors */
    --c-normal: #60a5fa;     /* 出勤 — blue */
    --c-ot:     #fbbf24;     /* 加班 — amber */
    --c-holiday:#fb923c;     /* 祝日出勤 — orange */
    --c-leave:  #f87171;     /* 有休 — red */
    --c-absent: #71717a;     /* 缺勤 — neutral */
    --c-weekend:#a78bfa;     /* 休息 — violet */
    --c-sun:    #f87171;
    --c-sat:    #60a5fa;

    --radius: 12px;
    --radius-sm: 8px;
    --radius-xs: 6px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.5);
    --shadow: 0 4px 24px rgba(0,0,0,0.35), 0 1px 3px rgba(0,0,0,0.4);
    --shadow-lg: 0 24px 56px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.4);

    --font-display: 'Bricolage Grotesque', -apple-system, 'PingFang SC', sans-serif;
    --font-body: 'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }

  html[data-theme="light"] {
    --bg: #f7f7f9;
    --surface: #ffffff;
    --surface-2: #f3f4f7;
    --surface-3: #e7e9ee;
    --border: #e5e7eb;
    --border-soft: #eef0f3;
    --text: #15171c;
    --text-dim: #6b7280;
    --text-faint: #a1a4ad;
    --accent: #0d9488;
    --accent-dim: #0f766e;
    --accent-deep: #115e59;
    --accent-glow: rgba(13, 148, 136, 0.12);

    --c-normal: #2563eb;
    --c-ot: #d97706;
    --c-holiday: #ea580c;
    --c-leave: #dc2626;
    --c-absent: #71717a;
    --c-weekend: #7c3aed;
    --c-sun: #dc2626;
    --c-sat: #2563eb;

    --shadow: 0 4px 20px rgba(15,20,40,0.06), 0 1px 2px rgba(15,20,40,0.04);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  body {
    background-image:
      radial-gradient(ellipse 70% 50% at 50% -10%, var(--accent-glow), transparent 70%),
      radial-gradient(circle at 1px 1px, rgba(255,255,255,0.022) 1px, transparent 0);
    background-size: auto, 22px 22px;
    background-attachment: fixed;
  }
  html[data-theme="light"] body {
    background-image:
      radial-gradient(ellipse 70% 50% at 50% -10%, var(--accent-glow), transparent 70%),
      radial-gradient(circle at 1px 1px, rgba(20,30,50,0.04) 1px, transparent 0);
    background-size: auto, 22px 22px;
    background-attachment: fixed;
  }

  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 32px 96px;
  }

  /* ─── Header ─── */
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    margin: 0 -32px 40px;
    padding: 14px 32px;
    border-bottom: 1px solid var(--border-soft);
    position: sticky;
    top: 0;
    z-index: 50;
    background: color-mix(in srgb, var(--bg) 72%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-deep));
    display: grid;
    place-items: center;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16px;
    color: #07120f;
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent),
                0 8px 28px var(--accent-glow);
    flex-shrink: 0;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1; gap: 3px; min-width: 0; }
  .brand h1 {
    font-family: var(--font-display);
    font-variation-settings: "wdth" 100, "opsz" 24;
    font-weight: 500;
    font-size: 17px;
    letter-spacing: -0.012em;
    color: var(--text);
    white-space: nowrap;
  }
  .brand h1 em {
    font-style: normal;
    color: var(--text-dim);
    font-weight: 400;
    margin-left: 2px;
  }
  .brand .subt {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text-faint);
    text-transform: uppercase;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
  }

  .icon-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--font-body);
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.005em;
    padding: 7px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.16s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .icon-btn:hover {
    color: var(--text);
    border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
    background: var(--surface-2);
  }
  .icon-btn:active { transform: translateY(1px); }
  .icon-btn svg { width: 14px; height: 14px; opacity: 0.85; }

  /* ─── Month nav ─── */
  .month-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .month-pick {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .month-pick .nav {
    width: 36px; height: 36px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .month-pick .nav:hover {
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
    background: var(--surface-2);
  }
  .month-title {
    font-family: var(--font-display);
    font-weight: 500;
    min-width: 240px;
    text-align: center;
    cursor: pointer;
    position: relative;
    padding: 6px 18px;
    border-radius: 10px;
    transition: background 0.15s;
  }
  .month-title:hover { background: var(--surface); }
  #monthLabel {
    display: inline-flex;
    align-items: baseline;
    gap: 4px;
    line-height: 1;
  }
  #monthLabel .m-num {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 96, "wdth" 100;
    font-weight: 500;
    font-feature-settings: "tnum", "lnum";
    letter-spacing: -0.045em;
    font-size: 46px;
    color: var(--text);
  }
  #monthLabel .m-unit {
    font-family: var(--font-body);
    font-size: 17px;
    font-weight: 400;
    color: var(--text-dim);
    letter-spacing: 0.02em;
    margin-left: 2px;
    transform: translateY(-4px);
  }
  .month-title .yr {
    font-family: var(--font-mono);
    font-size: 11.5px;
    color: var(--text-faint);
    letter-spacing: 0.14em;
    display: block;
    margin-top: 6px;
    font-weight: 400;
  }
  /* ─── Month picker popover ─── */
  .month-picker {
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    padding: 12px;
    z-index: 300;
    width: 280px;
    display: none;
    text-align: left;
    cursor: default;
  }
  .month-picker.open {
    display: block;
    animation: pickerIn 0.18s cubic-bezier(0.2,0.7,0.2,1);
  }
  @keyframes pickerIn {
    from { opacity: 0; transform: translateX(-50%) translateY(-4px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  .mp-year {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 0 2px;
  }
  .mp-year .y {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 24;
    font-size: 17px;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .mp-year button {
    width: 30px; height: 30px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
    font-family: var(--font-body);
  }
  .mp-year button:hover {
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 55%, var(--border));
    background: var(--surface-3);
  }
  .mp-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
  }
  .mp-grid button {
    padding: 10px 0;
    border: 1px solid transparent;
    background: var(--surface-2);
    color: var(--text);
    border-radius: 7px;
    cursor: pointer;
    transition: all 0.14s ease;
    display: inline-flex;
    align-items: baseline;
    justify-content: center;
    gap: 2px;
  }
  .mp-grid button .m-num {
    font-family: var(--font-mono);
    font-feature-settings: "tnum";
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .mp-grid button .m-unit {
    font-family: var(--font-body);
    font-size: 10.5px;
    font-weight: 400;
    color: var(--text-dim);
    letter-spacing: 0.02em;
    margin-left: 1px;
  }
  .mp-grid button:hover {
    background: var(--surface-3);
    border-color: var(--border);
  }
  .mp-grid button.today {
    border-color: color-mix(in srgb, var(--accent) 55%, transparent);
  }
  .mp-grid button.today .m-num { color: var(--accent); }
  .mp-grid button.current {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 4px 14px var(--accent-glow);
  }
  .mp-grid button.current .m-num { color: #07120f; }
  .mp-grid button.current .m-unit { color: rgba(7,18,15,0.6); }

  .config {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--text-dim);
  }
  .config label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    transition: border-color 0.15s;
  }
  .config label:focus-within {
    border-color: color-mix(in srgb, var(--accent) 60%, var(--border));
  }
  .config input[type="number"],
  .config input[type="text"] {
    background: transparent;
    border: none;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 500;
    padding: 0;
    text-align: center;
    color-scheme: dark;
  }
  html[data-theme="light"] .config input[type="number"] { color-scheme: light; }
  .config input[type="number"] { width: 30px; }
  .config input[type="number"]:focus { outline: none; color: var(--accent); }
  .config span { font-size: 11px; }

  /* ─── Stats (bento) ─── */
  .stats {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 10px;
    margin-bottom: 36px;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 20px 22px 18px;
    border-radius: var(--radius);
    position: relative;
    overflow: hidden;
    transition: all 0.28s cubic-bezier(0.2, 0.7, 0.2, 1);
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 120px;
  }
  .stat:hover {
    border-color: color-mix(in srgb, var(--stat-color, var(--accent)) 45%, var(--border));
    transform: translateY(-2px);
    box-shadow: var(--shadow);
  }
  .stat::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(
      circle at 100% 0%,
      color-mix(in srgb, var(--stat-color, var(--accent)) 16%, transparent),
      transparent 55%);
    opacity: 0;
    transition: opacity 0.32s ease;
    pointer-events: none;
  }
  .stat:hover::after { opacity: 1; }
  .stat > * { position: relative; z-index: 1; }

  .stat:first-child {
    grid-row: 1 / span 2;
    grid-column: 1;
    background:
      radial-gradient(circle at 100% 0%, var(--accent-glow), transparent 55%),
      var(--surface);
    border-color: color-mix(in srgb, var(--accent) 28%, var(--border));
    padding: 26px 28px 24px;
  }
  .stat:first-child .value { font-size: 64px; }
  .stat:first-child::before {
    content: '';
    position: absolute;
    bottom: -60px; right: -60px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--accent-glow), transparent 70%);
    pointer-events: none;
  }
  /* 有休残 — spans last 2 cols of row 2 */
  .stat.span-2 { grid-column: span 2; }
  .stat.span-2 .value { font-size: 40px; }
  .stat.low { border-color: color-mix(in srgb, var(--c-leave) 50%, var(--border)); }
  .stat.low .value { color: var(--c-leave); }

  .stat .label {
    font-family: var(--font-body);
    font-size: 11.5px;
    font-weight: 500;
    letter-spacing: 0.015em;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stat .label::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--stat-color, var(--accent));
    box-shadow: 0 0 10px var(--stat-color, var(--accent));
  }
  .stat .value {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 96, "wdth" 100;
    font-weight: 500;
    font-size: 32px;
    line-height: 1;
    letter-spacing: -0.035em;
    color: var(--text);
    font-feature-settings: "tnum";
    margin-top: auto;
  }
  .stat .value .unit {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-faint);
    margin-left: 5px;
    font-weight: 400;
    letter-spacing: 0.04em;
  }
  .stat .value .dec {
    font-size: 0.55em;
    color: var(--text-dim);
    font-weight: 400;
    letter-spacing: 0;
    margin-left: 1px;
  }
  .stat .sub {
    font-family: var(--font-body);
    font-size: 11.5px;
    color: var(--text-faint);
    line-height: 1.4;
  }

  /* ─── Day list ─── */
  .ledger {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    /* 不能 hidden,否则 tag-menu 下拉会被截 */
    overflow: visible;
  }
  .day:last-child {
    border-bottom-left-radius: var(--radius);
    border-bottom-right-radius: var(--radius);
  }
  .day.menu-open { position: relative; z-index: 100; }

  .ledger-head {
    display: grid;
    grid-template-columns: 96px 140px 1fr 1fr 110px 110px;
    gap: 12px;
    padding: 13px 24px;
    font-family: var(--font-body);
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
    border-bottom: 1px solid var(--border-soft);
    background: var(--surface-2);
  }
  .ledger-head > div { text-align: center; }

  .day {
    display: grid;
    grid-template-columns: 96px 140px 1fr 1fr 110px 110px;
    padding: 12px 24px;
    align-items: center;
    border-bottom: 1px solid var(--border-soft);
    transition: background 0.16s ease;
    gap: 12px;
    position: relative;
  }
  .day:last-child { border-bottom: none; }
  .day:hover { background: var(--surface-2); }

  .day.today {
    background: linear-gradient(90deg, var(--accent-glow), transparent 45%);
  }
  .day.today::before {
    content: '';
    position: absolute;
    left: 0; top: 8px; bottom: 8px;
    width: 3px;
    border-radius: 0 2px 2px 0;
    background: var(--accent);
    box-shadow: 0 0 14px var(--accent);
    animation: todayPulse 2.6s ease-in-out infinite;
  }
  @keyframes todayPulse {
    0%, 100% { opacity: 0.75; }
    50% { opacity: 1; }
  }

  .day.dow-sun .date .d, .day.dow-sun .date .wd,
  .day.is-jp-holiday .date .d, .day.is-jp-holiday .date .wd { color: var(--c-sun); }
  .day.dow-sat .date .d, .day.dow-sat .date .wd { color: var(--c-sat); }
  .day .date .jpname {
    font-family: var(--font-body);
    font-size: 10px;
    color: var(--c-sun);
    letter-spacing: 0.01em;
    margin-top: 3px;
    line-height: 1.2;
    max-width: 88px;
    word-break: break-all;
  }
  .day.has-tag-absent { opacity: 0.5; }

  .day .date {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 3px;
  }
  .day .date .d {
    font-family: var(--font-display);
    font-variation-settings: "opsz" 48, "wdth" 100;
    font-weight: 500;
    font-size: 26px;
    line-height: 1;
    letter-spacing: -0.025em;
    font-feature-settings: "tnum";
  }
  .day .date .wd {
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  .day .tag-cell {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .tag-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px 7px 11px;
    background: color-mix(in srgb, var(--tag-color, var(--text-dim)) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--tag-color, var(--border)) 28%, var(--border));
    border-radius: 999px;
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 500;
    color: var(--tag-color, var(--text));
    cursor: pointer;
    transition: all 0.16s ease;
    width: 100%;
    max-width: 130px;
    justify-content: flex-start;
  }
  .tag-pill:hover {
    background: color-mix(in srgb, var(--tag-color) 20%, transparent);
    border-color: color-mix(in srgb, var(--tag-color) 55%, var(--border));
  }
  .tag-pill .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--tag-color, var(--text-dim));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--tag-color) 20%, transparent);
    flex-shrink: 0;
  }
  .tag-pill .chev {
    margin-left: auto;
    color: color-mix(in srgb, var(--tag-color) 55%, var(--text-faint));
    font-size: 9px;
  }
  .tag-menu {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-lg);
    z-index: 200;
    min-width: 150px;
    padding: 5px;
    display: none;
  }
  .tag-menu.open {
    display: block;
    animation: menuIn 0.16s ease;
  }
  .tag-menu.up {
    top: auto;
    bottom: calc(100% + 6px);
  }
  .tag-menu.up.open {
    animation: menuInUp 0.16s ease;
  }
  @keyframes menuIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes menuInUp {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .tag-menu button {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 8px 10px;

    background: var(--surface-2);

  html[data-theme="light"] .time-input { color-scheme: light; }
  .time-input:hover {
    background: var(--surface-3);
    border-color: var(--border);
  }
  .time-input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--surface-3);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
  }
  .time-input::-webkit-calendar-picker-indicator {
    filter: invert(0.55);
    opacity: 0.55;
    cursor: pointer;
  }
  html[data-theme="light"] .time-input::-webkit-calendar-picker-indicator {
    filter: invert(0.3);
  }
  .time-input:disabled {
    background: transparent;
    color: var(--text-faint);
    cursor: not-allowed;
  }
  .time-clear {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-dim);
    font-size: 13px;
    line-height: 1;
    font-family: var(--font-body);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: all 0.15s ease;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .time-clear:hover, .time-clear:active {
    background: color-mix(in srgb, var(--c-leave) 18%, var(--surface-2));
    border-color: color-mix(in srgb, var(--c-leave) 55%, var(--border));
    color: var(--c-leave);
  }

  .day .num {
    font-family: var(--font-mono);
    font-size: 13.5px;
    font-weight: 500;
    font-feature-settings: "tnum";
    text-align: center;
    letter-spacing: 0.01em;
  }
  .in-cell, .out-cell {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    justify-self: center;
    position: relative;
  }
  .next-day, .carry-prev {
    font-family: var(--font-mono);
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--c-sun);
    border: 1px solid currentColor;
    border-radius: 3px;
    padding: 1px 4px;
    white-space: nowrap;
    opacity: 0.85;
  }
  .carry-prev { color: var(--text-dim); }
  .day .num.work { color: var(--c-normal); }
  .day .num.ot { color: var(--c-ot); }
  .day .num.zero { color: var(--text-faint); font-weight: 400; }
  .day.has-tag-holiday .num.ot,
  .day.has-tag-restday .num.ot { color: var(--c-holiday); }

  /* ─── Footer ─── */
  .footnote {
    margin-top: 28px;
    font-family: var(--font-body);
    font-size: 11.5px;
    color: var(--text-faint);
    text-align: center;
    line-height: 1.7;
  }
  .footnote code {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    background: var(--surface);
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid var(--border-soft);
  }

  /* ─── Animations ─── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .stat, .day {
    animation: fadeUp 0.42s cubic-bezier(0.2,0.7,0.2,1) both;
  }
  .stat:nth-child(1) { animation-delay: 0.02s; }
  .stat:nth-child(2) { animation-delay: 0.07s; }
  .stat:nth-child(3) { animation-delay: 0.12s; }
  .stat:nth-child(4) { animation-delay: 0.17s; }
  .stat:nth-child(5) { animation-delay: 0.22s; }

  /* ─── Responsive ─── */
  @media (max-width: 880px) {
    .wrap { padding: 0 16px 64px; }
    header.top { margin: 0 -16px 24px; padding: 12px 16px; flex-wrap: wrap; gap: 12px; }
    .brand .subt { display: none; }
    .top-actions { flex-wrap: wrap; }
    .stats {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto;
    }
    .stat:first-child {
      grid-row: auto;
      grid-column: 1 / -1;
    }
    .stat.span-2 { grid-column: 1 / -1; }
    .stat:first-child .value { font-size: 48px; }
    .stat .value { font-size: 26px; }
    .stat.span-2 .value { font-size: 36px; }
    .ledger-head { display: none; }
    .day {
      grid-template-columns: 80px 1fr;
      grid-template-areas:
        "date tag"
        "date times"
        "date nums";
      padding: 14px 16px;
      gap: 10px 14px;
    }
    .day .date { grid-area: date; align-self: flex-start; }
    .day .tag-cell { grid-area: tag; justify-content: flex-start; }
    .day .times {
      grid-area: times;
      display: grid;
      grid-template-columns: 1fr 24px 1fr;
      align-items: center;
    }
    .day .times .in-cell  { justify-self: end; }
    .day .times .sep      { justify-self: center; color: var(--text-faint); font-family: var(--font-mono); font-size: 12px; }
    .day .times .out-cell { justify-self: start; }
    .day .nums {
      grid-area: nums;
      display: grid;
      grid-template-columns: 1fr 24px 1fr;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 12px;
    }
    .day .nums .num.work { grid-column: 1; justify-self: end; }
    .day .nums .num.ot   { grid-column: 3; justify-self: start; }
    .day .nums .nlbl { color: var(--text-faint); margin-right: 4px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
    .month-title { min-width: 180px; padding: 4px 12px; }
    #monthLabel .m-num { font-size: 36px; }
    #monthLabel .m-unit { font-size: 14px; transform: translateY(-3px); }
    .month-title .yr { font-size: 10.5px; margin-top: 4px; }
    .config { width: 100%; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
  }

  @media (min-width: 881px) {
    .day .times-wrap { display: contents; }
    .day .times { display: contents; }
    .day .nums { display: contents; }
    .day .times .sep { display: none; }
    .day .nums .nlbl { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <div class="brand-mark">時</div>
      <div class="brand-text">
        <h1>月度工时 <em>统计</em></h1>
        <div class="subt">Hours · Monthly</div>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="todayBtn" title="跳到本月">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 2"/>
        </svg>
        今天
      </button>
      <button class="icon-btn" id="themeBtn" title="切换主题">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button class="icon-btn" id="importBtn" title="从 JSON 文件导入">导入</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden />
      <button class="icon-btn" id="exportBtn" title="导出全部数据为 JSON">导出</button>
      <button class="icon-btn" id="clearBtn" title="清空当月数据">清空</button>
    </div>
  </header>

  <div class="month-row">
    <div class="month-pick">
      <button class="nav" id="prevBtn" aria-label="上月">‹</button>
      <div class="month-title" id="monthTitle">
        <span id="monthLabel">五月</span>
        <span class="yr" id="yearLabel">2026</span>
        <div class="month-picker" id="monthPicker">
          <div class="mp-year">
            <button id="mpPrevYear" aria-label="上一年">‹</button>
            <div class="y" id="mpYearLabel">2026</div>
            <button id="mpNextYear" aria-label="下一年">›</button>
          </div>
          <div class="mp-grid" id="mpGrid"></div>
        </div>
      </div>
      <button class="nav" id="nextBtn" aria-label="下月">›</button>
    </div>
    <div class="config">
      <label>标准工时
        <input type="number" id="stdHours" min="1" max="24" step="0.5" value="8" />
        <span>h</span>
      </label>
      <label>午休扣除
        <input type="number" id="lunchHours" min="0" max="4" step="0.5" value="1" />
        <span>h</span>
      </label>
      <label title="周期起始日:从这一天到下个月该日前一天为一个周期(1 = 自然月)">起始日
        <input type="number" id="cycleStart" min="1" max="28" step="1" value="1" />
      </label>
      <label title="每年固定月份重置的年度有休总天数">年度有休
        <input type="number" id="annualLeave" min="0" max="365" step="1" value="20" />
        <span>天</span>
      </label>
      <label title="有休重置的月份(1-12)">重置月
        <input type="number" id="leaveResetMonth" min="1" max="12" step="1" value="11" />
      </label>
    </div>
  </div>

  <section class="stats" id="stats"></section>

  <section class="ledger">
    <div class="ledger-head">
      <div>日期</div>
      <div>标签</div>
      <div>上班</div>
      <div>下班</div>
      <div>实际工时</div>
      <div>加班</div>
    </div>
    <div id="days"></div>
  </section>

  <p class="footnote">
    数据自动保存于本地浏览器 · <code>localStorage</code> · 切换设备不同步<br/>
    工作日 / 节假日上班 工时超出 标准工时 计为加班
  </p>
</div>

<script>
(() => {
  'use strict';

  const TAGS = {
    workday:  { label: '出勤',     color: 'var(--c-normal)' },
    restday:  { label: '休息',     color: 'var(--c-weekend)' },
    holiday:  { label: '祝日出勤', color: 'var(--c-holiday)' },
    leave:    { label: '有休',     color: 'var(--c-leave)' },
    absent:   { label: '缺勤',     color: 'var(--c-absent)' },
  };
  const WD_JP = ['日','月','火','水','木','金','土'];
  const MONTH_CN = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const LS_KEY = 'hours-ledger-v1';

  // 日本の祝日 (2024 – 2027). 春分/秋分は官報の確定日に基づく。振替休日・国民の休日を含む。
  const JP_HOLIDAYS = {
    '2024-01-01': '元日',
    '2024-01-08': '成人の日',
    '2024-02-11': '建国記念の日',
    '2024-02-12': '振替休日',
    '2024-02-23': '天皇誕生日',
    '2024-03-20': '春分の日',
    '2024-04-29': '昭和の日',
    '2024-05-03': '憲法記念日',
    '2024-05-04': 'みどりの日',
    '2024-05-05': 'こどもの日',
    '2024-05-06': '振替休日',
    '2024-07-15': '海の日',
    '2024-08-11': '山の日',
    '2024-08-12': '振替休日',
    '2024-09-16': '敬老の日',
    '2024-09-22': '秋分の日',
    '2024-09-23': '振替休日',
    '2024-10-14': 'スポーツの日',
    '2024-11-03': '文化の日',
    '2024-11-04': '振替休日',
    '2024-11-23': '勤労感謝の日',
    '2025-01-01': '元日',
    '2025-01-13': '成人の日',
    '2025-02-11': '建国記念の日',
    '2025-02-23': '天皇誕生日',
    '2025-02-24': '振替休日',
    '2025-03-20': '春分の日',
    '2025-04-29': '昭和の日',
    '2025-05-03': '憲法記念日',
    '2025-05-04': 'みどりの日',
    '2025-05-05': 'こどもの日',
    '2025-05-06': '振替休日',
    '2025-07-21': '海の日',
    '2025-08-11': '山の日',
    '2025-09-15': '敬老の日',
    '2025-09-23': '秋分の日',
    '2025-10-13': 'スポーツの日',
    '2025-11-03': '文化の日',
    '2025-11-23': '勤労感謝の日',
    '2025-11-24': '振替休日',
    '2026-01-01': '元日',
    '2026-01-12': '成人の日',
    '2026-02-11': '建国記念の日',
    '2026-02-23': '天皇誕生日',
    '2026-03-20': '春分の日',
    '2026-04-29': '昭和の日',
    '2026-05-03': '憲法記念日',
    '2026-05-04': 'みどりの日',
    '2026-05-05': 'こどもの日',
    '2026-05-06': '振替休日',
    '2026-07-20': '海の日',
    '2026-08-11': '山の日',
    '2026-09-21': '敬老の日',
    '2026-09-22': '国民の休日',
    '2026-09-23': '秋分の日',
    '2026-10-12': 'スポーツの日',
    '2026-11-03': '文化の日',
    '2026-11-23': '勤労感謝の日',
    '2027-01-01': '元日',
    '2027-01-11': '成人の日',
    '2027-02-11': '建国記念の日',
    '2027-02-23': '天皇誕生日',
    '2027-03-21': '春分の日',
    '2027-03-22': '振替休日',
    '2027-04-29': '昭和の日',
    '2027-05-03': '憲法記念日',
    '2027-05-04': 'みどりの日',
    '2027-05-05': 'こどもの日',
    '2027-07-19': '海の日',
    '2027-08-11': '山の日',
    '2027-09-20': '敬老の日',
    '2027-09-23': '秋分の日',
    '2027-10-11': 'スポーツの日',
    '2027-11-03': '文化の日',
    '2027-11-23': '勤労感謝の日',
  };

  // ─── State ───
  const state = load() || {
    cursor: ymKey(new Date()),
    stdHours: 8,
    lunchHours: 1,
    theme: 'dark',
    days: {},
    restdays: {},
    cycleStart: 1,
    annualLeave: 20,
    leaveResetMonth: 11,
  };
  // Migrate older saves
  if (!state.restdays) state.restdays = {};
  if (state.cycleStart == null) state.cycleStart = 1;
  if (state.annualLeave == null) state.annualLeave = 20;
  if (state.leaveResetMonth == null) state.leaveResetMonth = 11;
  // 旧格式 restdays: { 'YYYY-MM': [day,...] } → 新格式 { 'YYYY-MM-DD': true }
  const _firstVal = Object.values(state.restdays)[0];
  if (Array.isArray(_firstVal)) {
    const old = state.restdays;
    state.restdays = {};
    for (const ym in old) {
      for (const d of old[ym]) {
        state.restdays[`${ym}-${String(d).padStart(2,'0')}`] = true;
      }
    }
  }
  for (const k in state.days) {
    if (state.days[k]?.tag === 'weekend') state.days[k].tag = 'restday';
  }

  function save() {
    localStorage.setItem(LS_KEY, JSON.stringify(state));
  }
  function load() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)); }
    catch { return null; }
  }

  function ymKey(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  }
  function ymdKey(y, m, d) {
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  function parseYM(k) {
    const [y, m] = k.split('-').map(Number);
    return { y, m: m - 1 };
  }
  function daysInMonth(y, m) {
    return new Date(y, m + 1, 0).getDate();
  }
  function timeToMin(t) {
    if (!t) return null;
    const [h, m] = t.split(':').map(Number);
    return h * 60 + m;
  }
  function minToTime(min) {
    const h = Math.floor(min / 60);
    const m = min % 60;
    return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  }
  function fmtHours(h) {
    if (h == null || isNaN(h)) return '—';
    if (h === 0) return '0';
    return h.toFixed(1).replace(/\.0$/, '');
  }
  function fmtStatValue(h) {
    const s = fmtHours(h);
    return s.replace(/\.(\d+)/, '<span class="dec">.$1</span>');
  }
  function defaultTag(y, m, d) {
    const dateKey = ymdKey(y, m, d);
    if (JP_HOLIDAYS[dateKey]) return 'holiday';
    if (state.restdays[dateKey]) return 'restday';
    return 'workday';
  }

  // 返回当前 cursor 对应的周期 [start, end](Date 对象, 不含时分秒)
  function periodRange(cursor, cycleStart) {
    const { y, m } = parseYM(cursor);
    if (cycleStart <= 1) {
      return { start: new Date(y, m, 1), end: new Date(y, m, daysInMonth(y, m)) };
    }
    // 起始日 = 前一个日历月的 cycleStart 号
    const prevY = m === 0 ? y - 1 : y;
    const prevM = (m + 11) % 12;
    const startDay = Math.min(cycleStart, daysInMonth(prevY, prevM));
    const start = new Date(prevY, prevM, startDay);
    const endDay = Math.min(cycleStart - 1, daysInMonth(y, m));
    const end = new Date(y, m, endDay);
    return { start, end };
  }

  // 返回某个日期归属的 cursor("YYYY-MM")
  function cursorForDate(date, cycleStart) {
    if (cycleStart <= 1) return ymKey(date);
    if (date.getDate() >= cycleStart) {
      return ymKey(new Date(date.getFullYear(), date.getMonth() + 1, 1));
    }
    return ymKey(date);
  }

  // 返回 today 所在的年度有休周期 [start, end](Date 对象, 含端点)
  // 周期: resetMonth 月 1 日 → 次年同月前一日
  function leaveYearWindow(today, resetMonth) {
    const m = today.getMonth() + 1;
    const y = today.getFullYear();
    const startYear = m >= resetMonth ? y : y - 1;
    const start = new Date(startYear, resetMonth - 1, 1);
    const end = new Date(startYear + 1, resetMonth - 1, 0); // 上一日
    return { start, end };
  }
  function countLeaveDaysInWindow(start, end) {
    let n = 0;
    for (const k in state.days) {
      if (state.days[k]?.tag !== 'leave') continue;
      const [yy, mm, dd] = k.split('-').map(Number);
      const dt = new Date(yy, mm - 1, dd);
      if (dt >= start && dt <= end) n++;
    }
    return n;
  }

  // ─── Calculation ───
  function calcDay(rec, y, m, d, prevCarryOut) {
    const tag = rec?.tag || defaultTag(y, m, d);
    const inMin = timeToMin(rec?.in);
    const outMin = timeToMin(rec?.out);

    let work = 0, normal = 0, ot = 0, holidayHrs = 0, attended = false, absent = false, paidLeave = false;

    if (tag === 'absent') {
      absent = true;
    } else if (tag === 'restday') {
      // 休息日: 真休息,不计工时
    } else if (tag === 'leave') {
      // 带薪休假: 不计工时, 单独统计为"有休"天数
      paidLeave = true;
    } else if (inMin != null && outMin != null && outMin !== inMin) {
      // 跨日支持:下班 < 上班视为翌日
      // 若前一日跨夜延续到今日 (prevCarryOut 为前日下班时间), 钳制今日起点
      let effectiveIn = inMin;
      const isTodayOvernight = outMin < inMin;
      if (prevCarryOut != null && !isTodayOvernight && inMin < prevCarryOut) {
        effectiveIn = prevCarryOut;
      }
      // 若整个今日班次都在前日跨夜区间内, work = 0
      if (!isTodayOvernight && outMin <= effectiveIn) {
        // 全部被前日吸收
      } else {
        let span = outMin > effectiveIn
          ? (outMin - effectiveIn) / 60
          : (outMin + 24 * 60 - effectiveIn) / 60;
        if (span > 6) span -= state.lunchHours;
        work = Math.max(0, span);
      attended = work > 0;
      if (tag === 'workday') {
        normal = Math.min(work, state.stdHours);
        ot = Math.max(0, work - state.stdHours);
      } else if (tag === 'holiday') {
        normal = Math.min(work, state.stdHours);
        ot = Math.max(0, work - state.stdHours);
        holidayHrs = work;
      }
      }
    }
    return { tag, work, normal, ot, holidayHrs, attended, absent, paidLeave };
  }

  // ─── Render ───
  const els = {
    monthLabel: document.getElementById('monthLabel'),
    yearLabel: document.getElementById('yearLabel'),
    monthTitle: document.getElementById('monthTitle'),
    monthPicker: document.getElementById('monthPicker'),
    mpYearLabel: document.getElementById('mpYearLabel'),
    mpGrid: document.getElementById('mpGrid'),
    stats: document.getElementById('stats'),
    days: document.getElementById('days'),
    stdHours: document.getElementById('stdHours'),
    lunchHours: document.getElementById('lunchHours'),
    cycleStart: document.getElementById('cycleStart'),
    annualLeave: document.getElementById('annualLeave'),
    leaveResetMonth: document.getElementById('leaveResetMonth'),
  };

  let pickerYear = null;

  function renderPicker() {
    els.mpYearLabel.textContent = pickerYear;
    const { y: curY, m: curM } = parseYM(state.cursor);
    const today = new Date();
    const todayY = today.getFullYear();
    const todayM = today.getMonth();
    els.mpGrid.innerHTML = MONTH_CN.map((_, i) => {
      const isCurrent = pickerYear === curY && i === curM;
      const isToday = pickerYear === todayY && i === todayM;
      const cls = [isCurrent && 'current', isToday && !isCurrent && 'today'].filter(Boolean).join(' ');
      return `<button data-month="${i}" class="${cls}"><span class="m-num">${i + 1}</span><span class="m-unit">月</span></button>`;
    }).join('');
  }
  function openPicker() {
    pickerYear = parseYM(state.cursor).y;
    renderPicker();
    els.monthPicker.classList.add('open');
  }
  function closePicker() {
    els.monthPicker.classList.remove('open');
  }

  function render() {
    els.stdHours.value = state.stdHours;
    els.lunchHours.value = state.lunchHours;
    els.cycleStart.value = state.cycleStart;
    els.annualLeave.value = state.annualLeave;
    els.leaveResetMonth.value = state.leaveResetMonth;

    const { y, m } = parseYM(state.cursor);
    const { start, end } = periodRange(state.cursor, state.cycleStart);

    els.monthLabel.innerHTML = `<span class="m-num">${m + 1}</span><span class="m-unit">月</span>`;
    if (state.cycleStart > 1) {
      const fmt = dt => `${dt.getMonth() + 1}/${dt.getDate()}`;
      els.yearLabel.textContent = `${fmt(start)} – ${fmt(end)}`;
    } else {
      els.yearLabel.textContent = `${y}`;
    }
    if (els.monthPicker.classList.contains('open')) {
      pickerYear = parseYM(state.cursor).y;
      renderPicker();
    }

    document.documentElement.dataset.theme = state.theme;

    const today = new Date();
    const todayKey = ymdKey(today.getFullYear(), today.getMonth(), today.getDate());

    let totalNormal = 0, totalOT = 0, totalHoliday = 0, attendedCount = 0, leaveCount = 0, absentCount = 0;

    const frag = document.createDocumentFragment();
    const iter = new Date(start);
    while (iter <= end) {
      const yy = iter.getFullYear();
      const mm = iter.getMonth();
      const d = iter.getDate();
      const key = ymdKey(yy, mm, d);
      const wd = iter.getDay();
      const rec = state.days[key];

      // 前一日跨夜延伸到今日? 前日 out < 前日 in 且两者都有
      const prevDate = new Date(yy, mm, d - 1);
      const prevKey = ymdKey(prevDate.getFullYear(), prevDate.getMonth(), prevDate.getDate());
      const prevRec = state.days[prevKey];
      let prevCarryOut = null;
      if (prevRec?.in && prevRec?.out) {
        const pIn = timeToMin(prevRec.in);
        const pOut = timeToMin(prevRec.out);
        if (pOut < pIn) prevCarryOut = pOut;
      }

      const calc = calcDay(rec, yy, mm, d, prevCarryOut);

      totalNormal += calc.normal;
      totalOT += calc.ot;
      totalHoliday += calc.holidayHrs;
      if (calc.attended) attendedCount++;
      if (calc.paidLeave) leaveCount++;
      if (calc.absent) absentCount++;

      const jpHoliday = JP_HOLIDAYS[key];

      const row = document.createElement('div');
      row.className = `day has-tag-${calc.tag}`;
      if (wd === 0) row.classList.add('dow-sun');
      else if (wd === 6) row.classList.add('dow-sat');
      if (jpHoliday) row.classList.add('is-jp-holiday');
      if (key === todayKey) row.classList.add('today');

      const tag = TAGS[calc.tag];
      const showTimes = calc.tag !== 'leave' && calc.tag !== 'absent' && calc.tag !== 'restday';
      const overnight = showTimes && rec?.in && rec?.out && timeToMin(rec.out) < timeToMin(rec.in);

      row.innerHTML = `
        <div class="date">
          <div class="d">${String(d).padStart(2,'0')}</div>
          <div class="wd">${WD_JP[wd]}</div>
          ${jpHoliday ? `<div class="jpname" title="${jpHoliday}">${jpHoliday}</div>` : ''}
        </div>
        <div class="tag-cell">
          <button class="tag-pill" data-key="${key}" style="--tag-color:${tag.color}">
            <span class="dot"></span>
            <span class="tlabel">${tag.label}</span>
            <span class="chev">▾</span>
          </button>
          <div class="tag-menu" data-menu="${key}">
            ${Object.entries(TAGS).map(([k, v]) => `
              <button data-set-tag="${k}" data-key="${key}">
                <span class="dot" style="background:${v.color}"></span>
                <span>${v.label}</span>
              </button>
            `).join('')}
          </div>
        </div>
        <div class="times-wrap">
          <div class="times">
            <span class="in-cell">
              ${prevCarryOut != null && showTimes ? `<span class="carry-prev" title="前日跨夜至 ${minToTime(prevCarryOut)},此前不再计入">← ${minToTime(prevCarryOut)}</span>` : ''}
              <input type="time" class="time-input" data-field="in" data-key="${key}"
                value="${rec?.in || ''}" ${showTimes ? '' : 'disabled'} />
            </span>
            <span class="sep">→</span>
            <span class="out-cell">
              <input type="time" class="time-input" data-field="out" data-key="${key}"
                value="${rec?.out || ''}" ${showTimes ? '' : 'disabled'} />
              ${overnight ? '<span class="next-day">翌日</span>' : ''}
            </span>
          </div>
        </div>
        <div class="nums">
          <div class="num work ${calc.normal+calc.ot ? '' : 'zero'}">
            <span class="nlbl">实际</span>${fmtHours(calc.work || calc.normal)}
          </div>
          <div class="num ot ${calc.ot ? '' : 'zero'}">
            <span class="nlbl">加班</span>${calc.ot ? '+' + fmtHours(calc.ot) : '—'}
          </div>
        </div>
      `;
      frag.appendChild(row);
      iter.setDate(iter.getDate() + 1);
    }
    els.days.innerHTML = '';
    els.days.appendChild(frag);

    // 年度有休剩余 — 以当前查看周期的截止日为"截至时点"累计
    const asOf = end;
    const { start: lvStart, end: lvEnd } = leaveYearWindow(asOf, state.leaveResetMonth);
    const cutoff = asOf < lvEnd ? asOf : lvEnd;
    const leaveUsed = countLeaveDaysInWindow(lvStart, cutoff);
    const leaveRemaining = Math.max(0, state.annualLeave - leaveUsed);
    const lvPeriod = `${lvStart.getFullYear()}/${String(lvStart.getMonth()+1).padStart(2,'0')} – ${lvEnd.getFullYear()}/${String(lvEnd.getMonth()+1).padStart(2,'0')}`;
    const asOfStr = `${asOf.getFullYear()}/${String(asOf.getMonth()+1).padStart(2,'0')}/${String(asOf.getDate()).padStart(2,'0')}`;

    renderStats({
      totalNormal, totalOT, totalHoliday, attendedCount, leaveCount, absentCount,
      leaveUsed, leaveRemaining, leavePeriod: lvPeriod, leaveTotal: state.annualLeave,
      leaveAsOf: asOfStr,
    });
  }

  function renderStats(s) {
    const lowLeave = s.leaveRemaining <= 5;
    const cards = [
      { label: '上班总计', value: s.totalNormal + s.totalOT, unit: 'h', color: 'var(--accent)', sub: '正常 + 加班 全部到岗时长' },
      { label: '正常工时', value: s.totalNormal, unit: 'h', color: 'var(--c-normal)', sub: '工作日 + 节假日上班' },
      { label: '加班总计', value: s.totalOT, unit: 'h', color: 'var(--c-ot)', sub: '工作日 + 节假日上班溢出' },
      { label: '节假日工时', value: s.totalHoliday, unit: 'h', color: 'var(--c-holiday)', sub: '节假日上班时长' },
      { label: '出勤 / 有休 / 缺勤', value: `${s.attendedCount}`, unit: `/ ${s.leaveCount} / ${s.absentCount}`, color: 'var(--c-normal)', sub: '天数' },
      {
        label: '有休残',
        value: s.leaveRemaining,
        unit: `天 / ${s.leaveTotal}`,
        color: 'var(--c-leave)',
        sub: `截至 ${s.leaveAsOf} 已用 ${s.leaveUsed} 天 · 周期 ${s.leavePeriod}`,
        cls: `span-2${lowLeave ? ' low' : ''}`,
      },
    ];
    els.stats.innerHTML = cards.map(c => `
      <div class="stat ${c.cls || ''}" style="--stat-color:${c.color}">
        <div class="label">${c.label}</div>
        <div class="value">${typeof c.value === 'number' ? fmtStatValue(c.value) : c.value}<span class="unit">${c.unit}</span></div>
        <div class="sub">${c.sub}</div>
      </div>
    `).join('');
  }

  // ─── Events (delegated, bound once) ───
  function closeAllMenus() {
    els.days.querySelectorAll('.tag-menu.open').forEach(m => {
      m.classList.remove('open');
      m.closest('.day')?.classList.remove('menu-open');
    });
  }

  els.days.addEventListener('change', e => {
    const inp = e.target.closest('.time-input');
    if (!inp) return;
    const key = inp.dataset.key;
    const field = inp.dataset.field;
    const rec = state.days[key] || {};
    rec[field] = inp.value;
    state.days[key] = rec;
    save();
    // 不在这里 render —— 移动端原生选择器还没选完分钟时,
    // 重建 DOM 会让选择器锚点丢失而提前关闭。
  });

  // 输入框失焦时:先兜底保存当前值(防止 change 时序未到导致丢失),再重渲染。
  els.days.addEventListener('focusout', e => {
    const inp = e.target.closest('.time-input');
    if (!inp) return;
    const key = inp.dataset.key;
    const field = inp.dataset.field;
    const rec = state.days[key] || {};
    if (rec[field] !== inp.value) {
      rec[field] = inp.value;
      state.days[key] = rec;
      save();
    }
    setTimeout(() => {
      if (!els.days.contains(document.activeElement)) render();
    }, 0);
  });

  // mousedown so the action fires before any focus/blur side-effects.
  els.days.addEventListener('mousedown', e => {
    const opt = e.target.closest('[data-set-tag]');
    if (opt) {
      e.preventDefault();
      e.stopPropagation();
      const key = opt.dataset.key;
      const newTag = opt.dataset.setTag;
      const rec = state.days[key] || {};
      rec.tag = newTag;
      if (newTag === 'restday' || newTag === 'absent' || newTag === 'leave') {
        delete rec.in;
        delete rec.out;
      }
      state.days[key] = rec;
      save();
      render();
      return;
    }
    const pill = e.target.closest('.tag-pill');
    if (pill) {
      e.preventDefault();
      e.stopPropagation();
      const key = pill.dataset.key;
      const menu = els.days.querySelector(`.tag-menu[data-menu="${key}"]`);
      const isOpen = menu?.classList.contains('open');
      closeAllMenus();
      if (menu && !isOpen) {
        // 若下方空间不够,菜单向上展开
        const rect = pill.getBoundingClientRect();
        const menuH = Object.keys(TAGS).length * 36 + 16;
        const flipUp = rect.bottom + menuH + 12 > window.innerHeight && rect.top - menuH - 12 > 0;
        menu.classList.toggle('up', flipUp);
        menu.classList.add('open');
        menu.closest('.day')?.classList.add('menu-open');
      }
    }
  });

  document.addEventListener('mousedown', e => {
    if (e.target.closest('.tag-pill') || e.target.closest('.tag-menu')) return;
    closeAllMenus();
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    const { y, m } = parseYM(state.cursor);
    const nd = new Date(y, m - 1, 1);
    state.cursor = ymKey(nd);
    save(); render();
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    const { y, m } = parseYM(state.cursor);
    const nd = new Date(y, m + 1, 1);
    state.cursor = ymKey(nd);
    save(); render();
  });
  document.getElementById('todayBtn').addEventListener('click', () => {
    state.cursor = cursorForDate(new Date(), state.cycleStart);
    save(); render();
  });
  // Month picker
  els.monthTitle.addEventListener('mousedown', e => {
    if (e.target.closest('.month-picker')) return;
    e.preventDefault();
    if (els.monthPicker.classList.contains('open')) closePicker();
    else openPicker();
  });
  document.getElementById('mpPrevYear').addEventListener('click', e => {
    e.stopPropagation();
    pickerYear--;
    renderPicker();
  });
  document.getElementById('mpNextYear').addEventListener('click', e => {
    e.stopPropagation();
    pickerYear++;
    renderPicker();
  });
  els.mpGrid.addEventListener('click', e => {
    const btn = e.target.closest('button[data-month]');
    if (!btn) return;
    e.stopPropagation();
    const m = parseInt(btn.dataset.month, 10);
    state.cursor = `${pickerYear}-${String(m + 1).padStart(2,'0')}`;
    closePicker();
    save(); render();
  });
  document.addEventListener('mousedown', e => {
    if (!e.target.closest('.month-title')) closePicker();
  });
  document.getElementById('themeBtn').addEventListener('click', () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    save(); render();
  });
  document.getElementById('clearBtn').addEventListener('click', () => {
    if (!confirm('清空当前周期所有录入数据？')) return;
    const { start, end } = periodRange(state.cursor, state.cycleStart);
    Object.keys(state.days).forEach(k => {
      const [yy, mm, dd] = k.split('-').map(Number);
      const dt = new Date(yy, mm - 1, dd);
      if (dt >= start && dt <= end) delete state.days[k];
    });
    save(); render();
  });

  document.getElementById('exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `月度工时${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  const importFile = document.getElementById('importFile');
  document.getElementById('importBtn').addEventListener('click', () => importFile.click());
  importFile.addEventListener('change', e => {
    const file = e.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || typeof data !== 'object' || typeof data.days !== 'object') {
          throw new Error('文件格式不正确:缺少 days 字段');
        }
        if (!confirm('导入将覆盖当前所有数据,确定继续？')) return;
        // 保留当前设置, 文件里没带的字段不被覆盖
        const prev = {
          cycleStart: state.cycleStart,
          stdHours: state.stdHours,
          lunchHours: state.lunchHours,
          theme: state.theme,
          annualLeave: state.annualLeave,
          leaveResetMonth: state.leaveResetMonth,
        };
        const cs = Number(data.cycleStart);
        const al = Number(data.annualLeave);
        const lrm = Number(data.leaveResetMonth);
        Object.keys(state).forEach(k => delete state[k]);
        Object.assign(state, {
          cursor: data.cursor || ymKey(new Date()),
          stdHours: Number(data.stdHours) > 0 ? Number(data.stdHours) : prev.stdHours,
          lunchHours: Number.isFinite(Number(data.lunchHours)) ? Number(data.lunchHours) : prev.lunchHours,
          cycleStart: Number.isFinite(cs) && cs >= 1 && cs <= 28 ? Math.floor(cs) : prev.cycleStart,
          annualLeave: Number.isFinite(al) && al >= 0 ? al : prev.annualLeave,
          leaveResetMonth: Number.isFinite(lrm) && lrm >= 1 && lrm <= 12 ? Math.floor(lrm) : prev.leaveResetMonth,
          theme: data.theme === 'light' || data.theme === 'dark' ? data.theme : prev.theme,
          days: data.days || {},
          restdays: data.restdays || {},
        });
        // 老格式 restdays 自动迁移
        const _firstVal = Object.values(state.restdays)[0];
        if (Array.isArray(_firstVal)) {
          const old = state.restdays;
          state.restdays = {};
          for (const ym in old) {
            for (const dd of old[ym]) {
              state.restdays[`${ym}-${String(dd).padStart(2,'0')}`] = true;
            }
          }
        }
        // 兼容老数据:weekend → restday
        for (const k in state.days) {
          if (state.days[k]?.tag === 'weekend') state.days[k].tag = 'restday';
        }
        save();
        render();
        alert('导入成功');
      } catch (err) {
        alert('导入失败:' + err.message);
      } finally {
        e.target.value = '';
      }
    };
    reader.readAsText(file);
  });
  els.stdHours.addEventListener('change', e => {
    state.stdHours = Math.max(1, parseFloat(e.target.value) || 8);
    save(); render();
  });
  els.lunchHours.addEventListener('change', e => {
    state.lunchHours = Math.max(0, parseFloat(e.target.value) || 0);
    save(); render();
  });
  els.cycleStart.addEventListener('change', e => {
    const v = parseInt(e.target.value, 10);
    state.cycleStart = Math.max(1, Math.min(28, Number.isFinite(v) ? v : 1));
    // 调整 cursor 到包含 "今天" 的周期, 让感觉自然
    state.cursor = cursorForDate(new Date(), state.cycleStart);
    save(); render();
  });
  els.annualLeave.addEventListener('change', e => {
    const v = parseFloat(e.target.value);
    state.annualLeave = Math.max(0, Number.isFinite(v) ? v : 20);
    save(); render();
  });
  els.leaveResetMonth.addEventListener('change', e => {
    const v = parseInt(e.target.value, 10);
    state.leaveResetMonth = Math.max(1, Math.min(12, Number.isFinite(v) ? v : 11));
    save(); render();
  });
  render();
})();
</script>
</body>
</html>
