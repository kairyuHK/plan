<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>月度总出勤表</title>
<script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<!-- 月度工时模块字体:Bricolage Grotesque (展示) + Geist (正文) + JetBrains Mono (等宽) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Geist:wght@300..600&family=JetBrains+Mono:wght@300..500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b; --card:#161618; --border:#26262a;
  --text:#e8e8ea; --muted:#8a8a90;
  --accent:#7c5cff; --ok:#10b981; --warn:#f59e0b; --danger:#ef4444;
  --sat:#3b82f6; --sun:#ef4444; --today:#1e293b; --retired:#52525a;
  --r-card:12px; --r-btn:8px;
  --font:"Noto Sans JP",-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  --font-mono:ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
/* touch-action:manipulation = 允许平移 + 双指捏合缩放,禁用双击放大。
   touch-action 不继承,所以广播到所有元素才能覆盖任意位置的双击。 */
*{touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;background:transparent;border:1px solid var(--border);border-radius:var(--r-btn);padding:6px 12px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{background:#1f1f23}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#6a4def}
button.danger{color:var(--danger);border-color:var(--danger)}
input,select{font:inherit;color:inherit;background:#1f1f23;border:1px solid var(--border);border-radius:var(--r-btn);padding:6px 10px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
/* hide native number spinners (Webkit + Firefox) */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.nav{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100;flex-wrap:wrap;isolation:isolate;will-change:transform;box-shadow:0 6px 0 var(--bg)}
@media (max-width:768px){
  .nav{position:fixed;top:0;left:0;right:0;width:100%}
  body{padding-top:var(--sticky-nav,50px)}
}
/* 手机竖屏三行布局(用 flex order + 伪元素强制换行):
   行1:月度总出勤表 [部门▼]
   行2:◀ 日期 ▶ 今日 ✓已暂存 .......... ⬇⬆数据
   行3:                              🔒锁定 ⚙设置 🖨打印
   「数据」的右边框与「打印」的右边框竖直对齐(都贴 nav 右内边距)。 */
@media (max-width:640px){
  .nav .spacer{display:none}
  .nav .brand{order:0}
  .nav #dept-tabs{order:1}
  .nav::before{content:'';flex-basis:100%;height:0;order:2}
  .nav #period-nav{order:3}
  .nav #dirty-indicator{order:4}
  .nav button[data-route="#/data"]{order:5;margin-left:auto}
  .nav::after{content:'';flex-basis:100%;height:0;order:6}
  .nav button#btn-edit-toggle{order:7;margin-left:auto}
  .nav button[data-route="#/settings"]{order:8}
  .nav button#btn-print{order:9}
  /* 个人视图:出力 PNG 在第三行(数据下方),设置在出力 PNG 左侧。
     锁定/打印被 personal-mode 隐藏后,给设置补 margin-left:auto 把「设置+出力」整体推到右侧。 */
  .nav button#btn-personal-export{order:10}
  body.personal-mode .nav button[data-route="#/settings"]{margin-left:auto}
}
.nav .brand{font-weight:600;margin-right:12px;cursor:pointer}
.nav .brand:hover{color:var(--accent)}
.nav .spacer{flex:1}
.nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.dirty{font-size:12px;color:var(--muted)}
.dirty.warn{color:var(--warn)}
.page{padding:14px 16px;max-width:100%}
.hidden{display:none!important}
#test-results{position:fixed;bottom:0;left:0;right:0;background:#000;color:#0f0;font-family:var(--font-mono);font-size:12px;padding:8px;max-height:40vh;overflow:auto;z-index:9999;white-space:pre-wrap}
/* schedule page */
.dept-tabs button{margin-right:4px}
.dept-tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff}
/* 自定义部门下拉(替代原生 select,与 hours person pop 风格统一) */
.dept-dropdown{position:relative;display:inline-block}
.dept-trigger{
  display:inline-flex;align-items:center;gap:6px;
  background:#1f1f23;border:1px solid var(--border);color:var(--text);
  font:inherit;font-size:13px;font-weight:500;
  padding:6px 10px 6px 12px;border-radius:var(--r-btn);
  cursor:pointer;transition:border-color .15s,background .15s;
  min-width:88px;
}
.dept-trigger:hover{background:#26262a;border-color:#3a3a40}
.dept-dropdown.open .dept-trigger{border-color:var(--accent);background:#23232a}
.dept-trigger .dept-trigger-name{flex:1;text-align:left}
.dept-trigger .dept-trigger-chev{
  font-size:9px;color:var(--muted);
  transition:transform .18s ease,color .18s ease;
}
.dept-dropdown.open .dept-trigger-chev{transform:rotate(180deg);color:var(--accent)}
.dept-pop{
  position:absolute;top:calc(100% + 6px);left:-1px;right:-1px;
  background:linear-gradient(180deg,#1d1d22 0%,#16161a 100%);
  border:1px solid rgba(124,92,255,0.18);
  border-radius:10px;
  box-shadow:0 16px 36px rgba(0,0,0,0.6),0 2px 6px rgba(0,0,0,0.4),0 0 0 1px rgba(255,255,255,0.02) inset;
  padding:5px;z-index:200;display:none;
  min-width:max-content;
  max-height:60vh;overflow:auto;
  scrollbar-width:thin;scrollbar-color:#3a3a40 transparent;
}
.dept-pop::-webkit-scrollbar{width:8px}
.dept-pop::-webkit-scrollbar-track{background:transparent}
.dept-pop::-webkit-scrollbar-thumb{background:#3a3a40;border-radius:4px}
.dept-pop::-webkit-scrollbar-thumb:hover{background:#4a4a52}
.dept-dropdown.open .dept-pop{display:block;animation:deptPopIn .16s cubic-bezier(0.2,0.7,0.2,1)}
@keyframes deptPopIn{
  from{opacity:0;transform:translateY(-6px) scale(.97)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
.dept-item{
  display:flex;align-items:center;gap:8px;
  width:100%;padding:8px 12px;
  background:transparent;border:none;color:var(--text);
  font:inherit;font-size:13px;font-weight:500;
  cursor:pointer;border-radius:7px;text-align:left;
  position:relative;
  transition:background .14s ease,color .14s ease,padding-left .14s ease;
}
.dept-item + .dept-item{margin-top:1px}
.dept-item:hover{background:rgba(124,92,255,0.10);color:var(--text);padding-left:16px}
.dept-item.active{background:rgba(124,92,255,0.16);color:var(--accent)}
.dept-item.active::before{
  content:'';position:absolute;left:3px;top:50%;transform:translateY(-50%);
  width:3px;height:60%;background:var(--accent);border-radius:0 2px 2px 0;
  box-shadow:0 0 8px var(--accent);
}
/* 分隔线 — 虚拟视图(個人 / 月度工时)与真实部门分组 */
.dept-pop .dept-sep{
  height:1px;background:rgba(255,255,255,0.06);
  margin:4px 6px;border-radius:1px;
}
.period-nav{display:inline-flex;gap:4px;align-items:center;font-family:var(--font-mono)}
.period-nav button{padding:3px 9px;font-size:13px;color:var(--muted);border-color:transparent;background:#1c1c20}
.period-nav button:hover{color:var(--accent);border-color:var(--border);background:#222227}
.period-nav span{color:var(--text);padding:0 6px}
/* 表格区做成独立滚动容器:固定高度=视口-工具栏,内部纵向滚动 → 滚动条只滚日期下方的人员内容,
   工具栏 + 日期头(thead sticky 在容器顶端)完全不动。横向滚动也在容器内,氏名列 sticky 照常。
   100dvh 处理 iOS Safari 地址栏开合(老浏览器回退 100vh)。max-height(非 height):人少时容器随内容收缩,不留空白。 */
.schedule-wrap{
  margin-top:0;
  overflow:auto;
  -webkit-overflow-scrolling:touch;
  max-height:calc(100vh - var(--sticky-nav,50px) - 4px);
  max-height:calc(100dvh - var(--sticky-nav,50px) - 4px);
  /* 仅右侧预留滚动条空间(8px)。配合页面左右各 8px 边距 → 左 8px,右 8px+滚动条 8px */
  scrollbar-gutter:stable;
  /* 细滚动条 + 深色主题(Firefox)。默认透明,滚动时(.is-scrolling)才显示 */
  scrollbar-width:thin;
  scrollbar-color:transparent transparent;
}
.schedule-wrap.is-scrolling{scrollbar-color:#3a3a40 transparent}
/* 细滚动条 + 深色主题(Chrome/Edge/桌面 Safari)。滑块默认透明,滚动时才显示 → 停下自动隐藏 */
.schedule-wrap::-webkit-scrollbar{width:8px;height:8px}
.schedule-wrap::-webkit-scrollbar-track{background:transparent}
.schedule-wrap::-webkit-scrollbar-thumb{background:transparent;border-radius:4px;transition:background .25s}
.schedule-wrap.is-scrolling::-webkit-scrollbar-thumb{background:#3a3a40}
.schedule-wrap.is-scrolling::-webkit-scrollbar-thumb:hover{background:#4a4a52}
/* 排班页表格区已自带滚动容器,去掉 body 外层多余滚动条(设置/数据页仍正常滚动) */
body:has(#page-schedule:not(.hidden)){overflow:hidden}
/* 排班页:顶部收紧。左边距 8px;右边距 0,右侧那 8px 由 scrollbar-gutter 预留充当
   (= 滚动条位置)→ 左右视觉留白都是 8px,对称。设置/数据页不动。 */
#page-schedule.page{padding:4px 0 14px 8px}
/* thead 吸附到滚动容器(.schedule-wrap)顶端 — 容器已在工具栏下方,故 top:0 */
table.schedule thead{position:sticky;top:0;z-index:4;background:#1c1c20}
table.schedule thead th{background:#1c1c20}
table.schedule thead th.dept-name{background:#161618}
/* table 自然宽度(width:auto) — 之前 width:100% 配合 table-layout:fixed 会把多余空间按比例
   分配给各列,col 声明 10px 实际渲染成 ~14px,用户无法真正拖到最小值。auto 严格按 col 声明值 */
/* border-collapse:separate — 边框属于各单元格(而非表格),sticky 列冻结时边框跟着冻结,
   横向滚动不再出现"边框线滚走露出后面"的缝。每格只画 右+下 边框(避免相邻格双线);
   首列(役職)补左边框、表格补上边框,闭合网格。打印时被 @media print 覆盖回 collapse。 */
table.schedule{border-collapse:separate;border-spacing:0;border-top:1px solid var(--border);font-size:11px;background:var(--card);width:auto;table-layout:fixed}
table.schedule th,table.schedule td{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:2px 4px;text-align:center;white-space:nowrap;box-sizing:border-box}
table.schedule col.col-role{width:var(--col-role-w, 60px)}
table.schedule col.col-name{width:var(--col-name-w, 130px)}
table.schedule col.col-sum{width:36px}
table.schedule col.col-sum.s-paid{width:var(--col-sum-paid-w, 36px)}
table.schedule col.col-sum.s-contract{width:var(--col-sum-contract-w, 36px)}
table.schedule col.col-sum.s-remain{width:var(--col-sum-remain-w, 36px)}
table.schedule col.col-day{width:var(--col-day-w, 27px)}
table.schedule tbody tr:not(.stat-row)>td{height:var(--row-person-h, 25px)}
table.schedule tbody tr.stat-row>td{height:var(--row-stat-h, 25px)}
table.schedule th{background:#1c1c20;font-weight:500}
table.schedule th.dept-name{text-align:left;padding-left:6px;font-weight:700;font-size:13px;color:var(--accent);background:var(--bg)}
table.schedule th.month-label{font-weight:700;font-size:12px;color:var(--text);background:#1c1c20;letter-spacing:1px}
table.schedule th.role-col,table.schedule td.role-col{min-width:0;text-align:left;padding-left:6px;overflow:hidden;border-left:1px solid var(--border)}
table.schedule th.name-col,table.schedule td.name-col{min-width:0;text-align:left;padding-left:6px;position:sticky;left:0;background:#1c1c20;z-index:1;overflow:hidden}
table.schedule td.name-col{background:var(--card)}
table.schedule th.sum-col,table.schedule td.sum-col{min-width:0;color:var(--muted);overflow:hidden}
table.schedule td.sum-col.over{color:var(--danger);font-weight:700}
table.schedule td.sum-col.under{color:var(--warn);font-weight:700}
table.schedule th:not(.role-col):not(.name-col):not(.sum-col):not(.dept-name):not(.month-label){height:25px;box-sizing:border-box;padding:0;vertical-align:middle}
table.schedule td.day-cell{height:25px;box-sizing:border-box;padding:0;cursor:pointer;font-family:var(--font-mono);font-size:13px;vertical-align:middle;line-height:1;font-weight:400}
table.schedule td.day-cell:hover{background:#1f1f23}
table.schedule td.day-cell.contractRest{color:var(--text)}
table.schedule td.day-cell.paidLeave{color:var(--danger)}
table.schedule td.day-cell.absent{color:var(--danger)}
table.schedule td.day-cell.retired{color:var(--retired);cursor:not-allowed;background:#111114}
body:not(.editing) table.schedule td.day-cell{cursor:default}
body:not(.editing) table.schedule td.day-cell:hover{background:transparent}
body:not(.editing) table.schedule td.required input{cursor:default}
body:not(.editing) table.schedule td.required input:hover{background:transparent}
body:not(.editing) table.schedule td.dispatch input{cursor:default}
body:not(.editing) table.schedule td.dispatch input:hover{background:transparent}
table.schedule th.sat{color:var(--sat)}
table.schedule th.sun{color:var(--sun)}
.today-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;background:#f97316;color:#fff;border-radius:50%;font-weight:500;font-size:11.5px;line-height:1;font-variant-numeric:tabular-nums;padding-top:1px;font-family:var(--font-mono)}
/* row / column highlight (click name-col / date-th to toggle) */
table.schedule td.name-col{cursor:pointer}
table.schedule thead tr.head-row th[data-ymd],table.schedule thead tr.weekday-row th[data-ymd]{cursor:pointer}
table.schedule tr.hl-row td,table.schedule tr.hl-row th{background:rgba(94,234,212,0.10)}
table.schedule td.hl-col,table.schedule th.hl-col{background:var(--today)}
table.schedule tr.hl-row td.hl-col,table.schedule tr.hl-row th.hl-col{background:#2a3f5f}
/* keyboard focus indicator(仅在编辑模式下显示,锁定时即使焦点逻辑保留也不画边框) */
body.editing table.schedule td.day-cell.cell-focus{position:relative;box-shadow:inset 0 0 0 2px var(--accent),0 0 0 1px var(--accent);z-index:2}
/* color palette toolbar */
.color-palette{display:inline-flex;gap:6px;align-items:center;margin-left:12px}
.color-palette .swatch{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.color-palette .swatch:hover{outline:1px solid var(--muted);outline-offset:1px}
.color-palette .swatch.active{border-color:var(--text);box-shadow:0 0 0 1px var(--bg) inset}
.color-palette .swatch-clear{background:transparent;border:2px dashed var(--muted);color:var(--muted)}
.color-palette .swatch-text{background:transparent;border:2px solid var(--accent);color:var(--accent);font-weight:700;font-family:var(--font-mono)}
.entry-hint{margin:8px 0 0;padding:6px 12px;background:rgba(124,92,255,0.08);border:1px solid rgba(124,92,255,0.25);border-radius:6px;font-size:12px;color:var(--text);font-family:var(--font-mono)}
.entry-hint kbd{display:inline-block;background:#1f1f23;border:1px solid var(--border);border-radius:3px;padding:0 5px;margin:0 2px;font-size:11px;color:var(--accent)}
table.schedule tr.stat-row td{background:#161618;font-family:var(--font-mono)}
table.schedule tr.stat-row td.label{text-align:left;padding-left:6px;color:var(--muted)}
table.schedule td.required{cursor:text;padding:0}
table.schedule td.required input{width:100%;padding:2px 0;font-size:12px;font-family:var(--font-mono);text-align:center;background:transparent;border:none;border-radius:0;color:var(--accent);font-weight:600}
table.schedule td.required input:hover{background:#1f1f23}
table.schedule td.required input:focus{background:#1f1f23;outline:1px solid var(--accent);outline-offset:-1px}
/* 派遣短期 input — 蓝色显示(锁定时也保持蓝色) */
table.schedule td.dispatch{cursor:text;padding:0}
table.schedule td.dispatch input{width:100%;padding:2px 0;font-size:12px;font-family:var(--font-mono);text-align:center;background:transparent;border:none;border-radius:0;color:var(--sat);font-weight:600}
table.schedule td.dispatch input:hover{background:#1f1f23}
table.schedule td.dispatch input:focus{background:#1f1f23;outline:1px solid var(--sat);outline-offset:-1px}
table.schedule td.dispatch input::-webkit-outer-spin-button,
table.schedule td.dispatch input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
table.schedule td.dispatch input{-moz-appearance:textfield}
/* settings */
.settings-section{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:14px;margin-bottom:14px}
.settings-section h2{margin:0 0 10px;font-size:16px}
.settings-row{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #1f1f23;flex-wrap:wrap}
.settings-row:last-child{border-bottom:none}
.settings-row .grow{flex:1}
.settings-row input{width:auto}
.settings-row input.name-input{min-width:160px}
.settings-row input.num{width:60px}
.settings-row select.person-dept{min-width:96px;padding:6px 10px}
/* 行内确认弹层(贴近触发按钮,替代浏览器原生 confirm/prompt) */
.confirm-popover{position:fixed;z-index:1000;background:linear-gradient(180deg,#1d1d22 0%,#16161a 100%);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px 16px;box-shadow:0 24px 56px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.03) inset,0 1px 0 rgba(255,255,255,0.06) inset;min-width:220px;max-width:300px;font-size:13px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:confirmIn .2s cubic-bezier(0.2,0.8,0.2,1)}
.confirm-popover .confirm-text{color:var(--text);font-weight:600;font-size:14px;margin-bottom:4px;line-height:1.4;letter-spacing:.01em}
.confirm-popover .confirm-sub{color:var(--muted);font-size:12px;margin-bottom:12px;line-height:1.4}
.confirm-popover .confirm-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.confirm-popover button{padding:7px 14px;font-size:12px;font-weight:500;line-height:1;border-radius:7px;transition:transform .12s ease,background .15s,box-shadow .15s;letter-spacing:.01em}
.confirm-popover button:active{transform:scale(0.97)}
.confirm-popover button.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(124,92,255,0.35)}
.confirm-popover button.primary:hover{background:#6a4def;box-shadow:0 4px 12px rgba(124,92,255,0.45)}
.confirm-popover button.danger{background:var(--danger);border-color:var(--danger);color:#fff;box-shadow:0 2px 8px rgba(239,68,68,0.35)}
.confirm-popover button.danger:hover{background:#dc2626;box-shadow:0 4px 12px rgba(239,68,68,0.45)}
.confirm-popover input.confirm-input{width:100%;margin-bottom:10px;padding:9px 11px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:var(--text);font:inherit;font-size:13px;box-sizing:border-box;transition:border-color .15s,background .15s,box-shadow .15s}
.confirm-popover input.confirm-input:focus{border-color:var(--accent);background:rgba(0,0,0,0.45);outline:none;box-shadow:0 0 0 3px rgba(124,92,255,0.15)}
.confirm-popover button.confirm-extra{display:block;width:100%;margin-bottom:10px;padding:8px;font-size:12px;border-radius:8px}
/* 颜色 swatches 行(用于文字配色) */
.confirm-popover .confirm-swatches{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.confirm-popover .confirm-swatches button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;flex:0 0 auto;transition:transform .1s}
.confirm-popover .confirm-swatches button:hover{transform:scale(1.1)}
.confirm-popover .confirm-swatches button.active{border-color:var(--text);box-shadow:0 0 0 2px rgba(255,255,255,0.15) inset}
.confirm-popover .confirm-swatches button.confirm-sw-clear{background:transparent;border:2px dashed rgba(255,255,255,0.3);color:rgba(255,255,255,0.5);font-size:13px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.confirm-popover .confirm-swatches button.confirm-sw-clear.active{border-color:var(--text);border-style:solid;color:var(--text)}
@keyframes confirmIn{from{opacity:0;transform:translateY(-6px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
/* Toast 通知(临时显示,自动消失) */
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:2000;background:linear-gradient(180deg,#1d1d22 0%,#16161a 100%);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:10px 16px;color:var(--text);font-size:13px;font-weight:500;box-shadow:0 12px 32px rgba(0,0,0,0.5);animation:toastIn .25s cubic-bezier(0.2,0.8,0.2,1);display:flex;align-items:center;gap:8px;max-width:90vw}
.toast.success{border-left:3px solid var(--ok)}
.toast.error{border-left:3px solid var(--danger)}
.toast.info{border-left:3px solid var(--accent)}
.toast.hide{animation:toastOut .2s ease-in forwards}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-10px)}}
.settings-row .role-input{min-width:120px}
.settings-row input.date-input{width:140px;font-family:var(--font-mono);padding:6px 8px}
.settings-row label.no-leave-cb{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:12px;white-space:nowrap;cursor:pointer;flex-shrink:0}
.settings-row label.no-leave-cb input[type=checkbox]{margin:0;cursor:pointer;width:auto}
/* 单元格尺寸输入:左对齐 + 足够宽,iOS Safari 上窄+center 文本框光标定位会异常 */
.settings-row input.size-input{width:80px;font-family:var(--font-mono);text-align:left;padding:6px 10px}
.settings-row>span,.settings-row>button,.settings-row>select{white-space:nowrap;flex-shrink:0}
.settings-sub-people{padding-left:8px;border-left:2px solid var(--border);margin-top:6px}
/* 同部门内人员可拖动重排序。drag-handle 是触发区,鼠标在它上时光标变 grab */
.settings-sub-people .settings-row{position:relative;transition:background .12s,opacity .12s}
.settings-sub-people .drag-handle{display:inline-flex;align-items:center;justify-content:center;width:18px;height:24px;color:var(--muted);cursor:grab;font-size:14px;line-height:1;user-select:none;flex-shrink:0;border-radius:4px;letter-spacing:-1px}
.settings-sub-people .drag-handle:hover{color:var(--text);background:rgba(255,255,255,0.06)}
.settings-sub-people .drag-handle:active{cursor:grabbing}
.settings-sub-people .settings-row.dragging{opacity:0.4;background:rgba(124,92,255,0.08)}
/* 拖到目标行上下半区时,边缘画一条紫色线作为插入位置提示 */
.settings-sub-people .settings-row.drop-before{box-shadow:0 -2px 0 var(--accent) inset;border-top:2px solid var(--accent);margin-top:-2px}
.settings-sub-people .settings-row.drop-after{box-shadow:0 2px 0 var(--accent) inset;border-bottom:2px solid var(--accent);margin-bottom:-2px}
/* 部门拖拽换位 — 视觉与人员一致 */
.settings-sub-depts .settings-row{position:relative;transition:background .12s,opacity .12s}
.settings-sub-depts .drag-handle{display:inline-flex;align-items:center;justify-content:center;width:18px;height:24px;color:var(--muted);cursor:grab;font-size:14px;line-height:1;user-select:none;flex-shrink:0;border-radius:4px;letter-spacing:-1px}
.settings-sub-depts .drag-handle:hover{color:var(--text);background:rgba(255,255,255,0.06)}
.settings-sub-depts .drag-handle:active{cursor:grabbing}
.settings-sub-depts .settings-row.dragging{opacity:0.4;background:rgba(124,92,255,0.08)}
.settings-sub-depts .settings-row.drop-before{box-shadow:0 -2px 0 var(--accent) inset;border-top:2px solid var(--accent);margin-top:-2px}
.settings-sub-depts .settings-row.drop-after{box-shadow:0 2px 0 var(--accent) inset;border-bottom:2px solid var(--accent);margin-bottom:-2px}
/* 手机竖屏:人员行强制单行,隐藏 label,缩小尺寸保证所有控件能挤一行 */
@media (max-width:640px){
  .settings-sub-people .settings-row{
    display:flex;
    flex-wrap:nowrap;
    gap:4px;
    align-items:center;
    padding:6px 0
  }
  /* 手机端隐藏入职/调岗/离职日期 + 无有休复选框(改在桌面端编辑) */
  .settings-sub-people .settings-row>input.date-input{display:none}
  .settings-sub-people .settings-row>label.no-leave-cb{display:none}
  .settings-sub-people .settings-row>.role-input{min-width:0;width:60px;flex:0 0 60px;font-size:12px;padding:6px 4px}
  .settings-sub-people .settings-row>.name-input{min-width:0;flex:1 1 auto;width:auto;font-size:12px;padding:6px 4px}
  /* 隐藏 label「有休残:」「部门:」(短缺空间,留下数字/下拉自身已经够明确) */
  .settings-sub-people .settings-row>span:not(.grow){display:none}
  .settings-sub-people .settings-row>span.grow{display:none}
  .settings-sub-people .settings-row>input.num{width:36px;flex:0 0 36px;padding:6px 2px;font-size:12px;text-align:center}
  .settings-sub-people .settings-row>select.person-dept{min-width:60px;flex:0 0 auto;padding:6px 4px;font-size:11px}
  .settings-sub-people .settings-row>button.danger{padding:6px 8px;font-size:12px;flex:0 0 auto}
  /* 手机竖屏:部门行强制单行(名称 + 必要 + 高度 + 删除 全挤一行)。
     原选择器 .settings-section>.settings-row 现在还匹配「+新增部门」按钮行;
     拖拽改造后部门行包在 .settings-sub-depts 里,需要并列选择两处。 */
  .settings-section>.settings-row,
  .settings-sub-depts>.settings-row{flex-wrap:nowrap;gap:4px}
  .settings-section>.settings-row>.name-input,
  .settings-sub-depts>.settings-row>.name-input{min-width:0;flex:1 1 auto;width:auto;font-size:12px;padding:6px 6px}
  .settings-section>.settings-row>span:not(.grow):not(.drag-handle),
  .settings-sub-depts>.settings-row>span:not(.grow):not(.drag-handle){font-size:11px;flex-shrink:0}
  .settings-section>.settings-row>input.num,
  .settings-sub-depts>.settings-row>input.num{width:44px;flex:0 0 44px;padding:6px 2px;font-size:12px;text-align:center}
  .settings-section>.settings-row>.grow,
  .settings-sub-depts>.settings-row>.grow{display:none}
  .settings-section>.settings-row>button.danger,
  .settings-sub-depts>.settings-row>button.danger{padding:6px 8px;font-size:12px;flex:0 0 auto}
}
/* 单元格尺寸拖拽手柄(屏幕全平台),打印模式隐藏 */
table.schedule thead th[data-ymd]{position:relative}
table.schedule thead th.role-col,table.schedule thead th.name-col,table.schedule thead th.sum-col{position:relative}
table.schedule td.name-col{position:relative}
table.schedule tr.stat-row td.label{position:relative}
.col-resize-handle{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:5;background:transparent}
.col-resize-handle:hover{background:rgba(124,92,255,0.5)}
.row-resize-handle{position:absolute;bottom:-3px;left:0;width:100%;height:6px;cursor:row-resize;z-index:5;background:transparent}
.row-resize-handle:hover{background:rgba(124,92,255,0.5)}
/* 所有触屏设备(手机/平板,横竖屏都算)关闭拖拽手柄 — 触屏拖拽不便,改用设置页输入精确调。
   hover:none + pointer:coarse 精准匹配触屏,不误伤桌面触摸屏笔记本的鼠标操作。 */
@media (hover:none) and (pointer:coarse){
  .col-resize-handle,.row-resize-handle{display:none!important}
}
/* 手机端:加宽手柄触摸区到 12px,禁文字选中(长按选中干扰拖拽),touch-action:none 阻止浏览器抢占手势 */
@media (max-width:640px){
  table.schedule{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  /* 手机端关闭拖拽手柄(屏幕拖动不方便,改用设置页输入精确调) */
  .col-resize-handle,.row-resize-handle{display:none!important}
  /* 横向滚动固定 役職 + 氏名 列。
     役職和氏名之间的分隔线画在 role-col 的右沿(inset -1px)→ 这条线在最左侧 sticky 层上,
     横滑时永远不动。氏名列向左重叠 1px 物理消除两层接触缝(打印后 backing store 精度变化也不漏)。
     氏名列右沿那条分隔线由后面的 sum-col 自身的 border-left 提供(separate 模型下属于 sum-col)。 */
  /* role-col z-index 回到 3(避免盖 thead)。
     役職/氏名之间的分隔线由 role-col 的 inset -1px 右阴影 提供,在 role sticky 层最右沿 1px。
     氏名列 left 改回精确贴合(不重叠),且去掉 border-left → 物理上不存在能盖到这条阴影的东西。 */
  table.schedule th.role-col,table.schedule td.role-col{position:sticky!important;left:0;z-index:3;text-align:left!important;border-right:0!important}
  table.schedule th.role-col{background:#1c1c20!important;box-shadow:inset -1px 0 0 0 var(--border)}
  table.schedule td.role-col{background:var(--card)!important;box-shadow:inset -1px 0 0 0 var(--border)}
  table.schedule th.name-col{position:sticky!important;left:var(--col-role-w,60px);z-index:3;background:#1c1c20!important;border-left:0!important}
  table.schedule td.name-col{position:sticky!important;left:var(--col-role-w,60px);z-index:3;background:var(--card)!important;border-left:0!important}
  /* 行高亮时,sticky 左两列也跟着变 — 否则点人名时高亮线只从有休开始,不连贯 */
  table.schedule tr.hl-row td.role-col{background:#1d2823!important;box-shadow:inset -1px 0 0 0 var(--border)}
  table.schedule tr.hl-row td.name-col{background:#1d2823!important}
}
body.resizing{user-select:none}
body.resizing.resizing-col{cursor:col-resize!important}
body.resizing.resizing-row{cursor:row-resize!important}
/* data */
.data-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:14px;margin-bottom:14px}
.data-stats{font-family:var(--font-mono);color:var(--muted);font-size:13px;line-height:1.8}
.data-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* print */
@media print {
  @page { size: A4 landscape; margin: 4mm; }
  :root {
    /* 每个部门可独立设置打印高度(state.departments[].printHeightMm,默认 192mm)。
       beforeprint 时 JS 读取当前部门设置,覆盖 --print-body-h / --print-row-h-base。
       row-h 加上限 7mm — 人多时铺满 A4 行高变小,人少时行高停在 7mm,
       表格 height: auto + .schedule-wrap flex 自动让 table 垂直居中在 A4 中间。 */
    --row-h: var(--row-h-fixed, min(calc(var(--print-row-h-base, 190mm) / var(--total-rows, 30)), 7mm));
  }
  html, body { background: #fff; color: #000; padding-top: 0 !important; margin: 0 !important; height: var(--print-body-h, 192mm); overflow: hidden; }
  #page-schedule.page { padding: 0 !important; height: var(--print-body-h, 192mm); }
  /* 表格垂直居中于 body(A4 纸张内)。
     注意:之前配合 table 的 break-inside:avoid 会在 130% 缩放下出 bug — body 被放大超出
     A4 可用区,浏览器看到表格上方空白后认为不能整张放进第 1 页,把整张推到第 2 页,第 1 页空白。
     修复办法是去掉 table 层级的 break-inside:avoid,只保留 tr 级别(防止单行被截断)。
     这样 130% 时表格仍按居中位置摆放,且能在第 1 页正常显示。 */
  .schedule-wrap { margin: 0 !important; height: var(--print-body-h, 192mm); max-height: none !important; overflow: visible !important; display: flex; flex-direction: column; justify-content: center; }
  .entry-hint { display: none !important; }
  .col-resize-handle, .row-resize-handle { display: none !important; }
  /* position:relative 在 border-collapse:collapse 的 table cell 上会让浏览器渲染时丢边框,
     屏幕需要 relative 来定位拖拽手柄,但打印不需要 handle,统一强制 static 让边框正常显示 */
  table.schedule thead th[data-ymd],
  table.schedule thead th.role-col,
  table.schedule thead th.name-col,
  table.schedule thead th.sum-col,
  table.schedule td.name-col,
  table.schedule tr.stat-row td.label { position: static !important; }
  table.schedule td.cell-focus { outline: none !important; box-shadow: none !important; }
  .color-palette { display: none !important; }
  /* preserve inline cell colors in print */
  table.schedule td.day-cell { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  /* kill sticky positions in print — iOS Safari / WebKit duplicates / shifts them otherwise */
  table.schedule thead { position: static !important; top: auto !important; box-shadow: none !important; }
  /* 手机端 sticky 的 role-col / name-col 在打印时也要去掉 position 和强制 dark bg,
     否则打印出来 リーダー 列是黑底(屏幕 sticky 用的 var(--card)=#161618) */
  table.schedule th.role-col, table.schedule td.role-col,
  table.schedule th.name-col, table.schedule td.name-col {
    position: static !important; left: auto !important;
    background: #fff !important;
    /* 手机 Safari 打印时 viewport ≤640px → @media(max-width:640px) 仍匹配 →
       屏幕端的 border-right:0 / border-left:0 !important 还在生效 → 打印这两条线缺失。
       用同等 !important 恢复。用 #bbb 比基础 #999 浅一档,补偿"独立 border"vs"collapse 合并 border"
       的视觉重量差,使粗细颜色和邻列一致。 */
    border-right: 1px solid #bbb !important;
    border-left: 1px solid #bbb !important;
  }
  /* 只保留 tr 的 break-inside:avoid(防止单行被分页截断),不再对 table 整体加。
     table 层级的 break-inside:avoid 在缩放 > 100% 时会触发 bug:
     浏览器看到表格上方空白后,认为表格不能整张放进当前页,把整张推到下一页,导致空白页。
     去掉后,缩放时表格仍按 flex center 位置摆放,实际宽度通常仍能在第 1 页放下。 */
  table.schedule tr { page-break-inside: avoid; break-inside: avoid; }
  .nav, #page-settings, #page-data, #modal-host, #test-results { display: none !important; }
  #page-schedule { padding: 0; }
  .schedule-wrap { overflow: visible; margin: 0; }
  table.schedule {
    background: #fff;
    /* height: auto 让 table 按 row heights 自然累加(190mm),
       不强制拉到容器 100%(192mm),否则最后一行下边框会贴 body 底沿被 overflow 裁掉。 */
    width: 100% !important; height: auto; table-layout: fixed;
    border-collapse: collapse; border-top: 0; border-spacing: 0;
    margin: 0;
  }
  table.schedule th, table.schedule td {
    /* 显式 reset 屏幕(separate 模型)留下的 border-right/bottom/inset shadow,
       再统一画 collapse 单线网格,避免叠出双线 / 粗细不一 */
    border: 1px solid #999 !important;
    box-shadow: none !important;
    padding: 0 2px; color: #000; background: #fff !important;
    line-height: 1 !important;
    height: var(--row-h) !important;
    font-size: min(calc(var(--row-h) * 0.55), 3.8mm) !important;
    box-sizing: border-box;
  }
  /* day-cell 字号封顶 4.5mm,防止 〇/● 溢出 col-day (约 6mm 宽) */
  table.schedule td.day-cell {
    height: var(--row-h) !important;
    font-size: min(calc(var(--row-h) * 0.65), 4.5mm) !important;
    width: auto !important;
    /* CJK 字体 ascent > descent,line-height:1 下字形视觉偏上,padding-top 下推到视觉中心。
       PC 端 0.09 看起来居中,手机端浏览器/打印机字体度量不同,默认 0(不偏移)。
       beforeprint 时 JS 按视口宽度切换 --day-cell-pad-ratio。 */
    padding-top: calc(var(--row-h) * var(--day-cell-pad-ratio, 0.09)) !important;
  }
  /* 〇(契休) 大且笔画密,欠/有 是汉字笔画也密,统一压小一档 */
  table.schedule td.day-cell.contractRest,
  table.schedule td.day-cell.absent,
  table.schedule td.day-cell.paidLeave {
    font-size: min(calc(var(--row-h) * 0.55), 3.8mm) !important;
  }
  /* 自定义文字(包/早/晚/研 等汉字)笔画密,字号单独压更小 */
  table.schedule td.day-cell.has-text {
    font-size: min(calc(var(--row-h) * 0.5), 3.2mm) !important;
  }
  /* 払出 部门特例:有/〇/欠 缩到和 has-text 一样小,避免和并排自定义文字大小不一致 */
  body.print-dept-haraidashi table.schedule td.day-cell.paidLeave,
  body.print-dept-haraidashi table.schedule td.day-cell.contractRest,
  body.print-dept-haraidashi table.schedule td.day-cell.absent {
    font-size: min(calc(var(--row-h) * 0.5), 3.2mm) !important;
  }
  table.schedule th:not(.role-col):not(.name-col):not(.sum-col):not(.dept-name):not(.month-label) {
    height: var(--row-h) !important;
    width: auto !important;
    font-size: min(calc(var(--row-h) * 0.5), 3.5mm) !important;
  }
  table.schedule th.dept-name { font-size: min(calc(var(--row-h) * 0.65), 5mm) !important; height: var(--row-h) !important; }
  table.schedule th.month-label { font-size: min(calc(var(--row-h) * 0.55), 4mm) !important; height: var(--row-h) !important; }
  /* 必要人数/ライン合計/派遣短期/過不足 四行字号统一(input 和 td 同一个 cap) */
  table.schedule tr.stat-row td,
  table.schedule td.required input,
  table.schedule td.dispatch input { font-size: min(calc(var(--row-h) * 0.5), 3.5mm) !important; }
  table.schedule th { background: #f5f5f5 !important; font-weight: 600; }
  /* clear interactive highlights in print */
  table.schedule tr.hl-row td, table.schedule tr.hl-row th,
  table.schedule td.hl-col, table.schedule th.hl-col,
  table.schedule tr.hl-row td.hl-col, table.schedule tr.hl-row th.hl-col {
    background: #fff !important;
  }
  /* row striping for body rows */
  table.schedule tbody tr:not(.stat-row):nth-child(even) td { background: #fafafa !important; }
  /* stat row bg (overrides striping) */
  table.schedule tr.stat-row td { background: #f5f5f5 !important; }
  table.schedule th.dept-name { text-align: left; padding-left: 6px; font-weight: 700; font-size: 14px; color: #000 !important; background: #fff !important; height: 26px; }
  table.schedule th.month-label { font-weight: 700; font-size: 13px; color: #000 !important; background: #ddd !important; letter-spacing: 2px; height: 26px; }
  /* fixed column widths(mm) — A4 横向可用 ≈ 289mm
     左侧信息区 100mm (1/3) + 日期区 189mm (2/3) 的黄金比例。
     用户在屏幕拖宽设过 --col-*-w (px) 时生效;否则用 mm fallback。
     用户的 px 值 1mm≈3.78px,印刷尺寸自动按 96dpi 换算。 */
  table.schedule col.col-role { width: var(--col-role-w, 20mm) !important; }
  table.schedule col.col-name { width: var(--col-name-w, 30mm) !important; }
  table.schedule col.col-sum.s-paid { width: var(--col-sum-paid-w, 8mm) !important; }
  table.schedule col.col-sum.s-contract { width: var(--col-sum-contract-w, 8mm) !important; }
  table.schedule col.col-sum.s-remain { width: var(--col-sum-remain-w, 8mm) !important; }
  /* col-day:打印时强制覆盖屏幕的 inline 自动撑满宽度。
     用户显式设过 --col-day-w 则用之;否则 auto 让 fixed layout 把 A4 剩余宽度均分给 31 天 */
  table.schedule col.col-day { width: var(--col-day-w, auto) !important; }
  /* tbody 行高同步 — 用户设过 --row-*-h (px) 用之,否则 fallback 到自动公式 var(--row-h) */
  table.schedule tbody tr:not(.stat-row) > td { height: var(--row-person-h, var(--row-h)) !important; }
  table.schedule tbody tr.stat-row > td { height: var(--row-stat-h, var(--row-h)) !important; }
  /* 各列字号 — 比例 0.5 保持夕盛(人多)原大小,mm 上限保护人少部门 */
  table.schedule th.role-col, table.schedule td.role-col {
    padding-left: 1mm;
    font-size: min(calc(var(--row-h) * 0.5), 4mm) !important;
  }
  table.schedule th.name-col, table.schedule td.name-col {
    padding-left: 1mm; text-align: left; position: static; background: #fff !important;
    /* var(--name-cap) 由 JS 按名字长度逐个 td 设置(纯 mm 值),min() 取它和 row-h 的较小者。
       变量未设时回退 4mm 默认上限。短名字不受影响,长名字按比例缩小到能塞进 30mm 列宽。 */
    font-size: min(calc(var(--row-h) * 0.5), var(--name-cap, 4mm)) !important;
    white-space: nowrap; overflow: hidden;
  }
  table.schedule th.sum-col, table.schedule td.sum-col {
    color: #000;
    font-size: min(calc(var(--row-h) * 0.4), 3mm) !important;
  }
  table.schedule td.sum-col.over { color: #b91c1c !important; font-weight: 700; }
  table.schedule td.sum-col.under { color: #b45309 !important; font-weight: 700; }
  /* day TH 列宽不再硬编码 26px 否则与 mm 单位的 role/name/sum 累加溢出 A4 宽度,
     被浏览器按比例缩小,col-name 48mm 实际只显示 ~40mm。改成 auto 让 col-day:auto 分配剩余 */
  table.schedule th:not(.role-col):not(.name-col):not(.sum-col):not(.dept-name):not(.month-label) { width: auto; }
  table.schedule td.day-cell { width: auto; height: var(--print-row-h, 22px); padding: 0; }
  table.schedule tbody tr:has(td.day-cell) td { height: var(--print-row-h, 22px); }
  table.schedule td.day-cell.contractRest { color: #000; }
  table.schedule td.day-cell.paidLeave { color: #b91c1c !important; font-weight: 400 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  table.schedule td.day-cell.absent { color: #b91c1c !important; }
  table.schedule td.day-cell.retired { color: #888; background: #f5f5f5 !important; }
  table.schedule th.sat { color: #1d4ed8 !important; }
  table.schedule th.sun { color: #b91c1c !important; }
  /* 打印时跟着 --row-h 缩放,字号匹配相邻日期数字,圆只比字大一圈,视觉上协调 */
  .today-badge {
    background: #f97316 !important; color: #fff !important;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
    width: calc(var(--row-h) * 0.67) !important;
    height: calc(var(--row-h) * 0.67) !important;
    font-size: min(calc(var(--row-h) * 0.5), 3.5mm) !important;
    font-weight: 500 !important;
  }
  table.schedule tr.stat-row td { background: #f5f5f5 !important; height: 22px; font-weight: 600; }
  table.schedule td.required, table.schedule td.dispatch { padding: 0; }
  table.schedule td.required input, table.schedule td.dispatch input {
    width: 100%; height: 100%; padding: 0;
    border: none !important; background: transparent !important;
    font-size: 12px; font-weight: 600; text-align: center;
    -webkit-appearance: none; appearance: none;
  }
  table.schedule td.required input { color: #000; }
  /* 派遣短期打印蓝色 — 与屏幕一致 */
  table.schedule td.dispatch input { color: #1d4ed8 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  table.schedule td.required input::-webkit-outer-spin-button,
  table.schedule td.required input::-webkit-inner-spin-button,
  table.schedule td.dispatch input::-webkit-outer-spin-button,
  table.schedule td.dispatch input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; display: none; }
}

/* ============================================================
   个人排班表 (page-personal) — 移植自原排班表,作用域限定 */
/* ============================================================ */
#page-personal { padding: 0; max-width: 100%; }
.personal-app {
  max-width: 580px; margin: 0 auto; padding: 14px 14px 60px;
  position: relative; z-index: 1;
}
.personal-toolbar {
  display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 14px;
}

/* 期间徽章 — 排班表同款,左对齐贴在月份列上方;只读不可点 */
.personal-period-badge {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 14px 9px 12px;
  border-radius: 999px;
  background: #1f2330;
  border: 1px solid #262a36;
  color: #e8eaef;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.3px;
  margin-bottom: 24px;
  font-family: inherit;
  user-select: none;
  -webkit-user-select: none;
  pointer-events: none;
  cursor: default;
}
.personal-period-badge::before {
  content: '';
  width: 7px; height: 7px;
  background: #93c5fd;
  border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(147,197,253,0.14), 0 0 10px rgba(147,197,253,0.28);
  animation: personal-period-pulse 2.4s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes personal-period-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}
.personal-export-btn {
  background: linear-gradient(135deg, #a5b4fc, #93c5fd);
  color: #0a0d12;
  border: 1px solid #93c5fd;
  padding: 9px 18px;
  border-radius: 10px;
  font-size: 13px; font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all .18s cubic-bezier(0.4,0,0.2,1);
  letter-spacing: 0.02em;
  display: inline-flex; align-items: center; gap: 6px;
  box-shadow: 0 4px 12px rgba(129,140,248,0.25);
}
.personal-export-btn:hover {
  filter: brightness(1.1);
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(129,140,248,0.35);
}
.personal-export-btn:active { transform: translateY(0) scale(0.98); }
.personal-export-btn:disabled { opacity: 0.6; cursor: wait; }

.personal-day-list {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; align-items: start;
}
.personal-day-list .month-col {
  display: flex; flex-direction: column; gap: 4px; min-width: 0;
}
.personal-day-list .month-col-head {
  display: flex; align-items: baseline; justify-content: center; gap: 3px;
  color: #e8eaef;
  font-size: 13px; font-weight: 600;
  padding: 8px 0;
  border: 1px solid #262a36;
  background: #1f2330;
  border-radius: 10px;
  margin-bottom: 4px;
  position: relative;
  font-variant-numeric: tabular-nums;
}
.personal-day-list .month-col-head::before {
  content: ''; position: absolute; left: 14px; top: 50%;
  transform: translateY(-50%);
  width: 4px; height: 4px; border-radius: 50%;
  background: #93c5fd; opacity: 0.85;
}
.personal-day-list .month-col-head .m-num { font-size: 16px; font-weight: 700; }
.personal-day-list .month-col-head .m-suffix { color: #6b7280; font-size: 11px; font-weight: 500; margin-left: 1px; }

.personal-day-list .day-row {
  position: relative;
  display: grid; grid-template-columns: 32px 1fr;
  min-height: 40px;
  background: #1f2330;
  border: 1px solid #262a36;
  border-radius: 10px;
  overflow: hidden;
  transition: all .18s cubic-bezier(0.4,0,0.2,1);
}
.personal-day-list .day-row:hover { border-color: #353a48; }
.personal-day-list .day-row.sun .day-cell .dnum,
.personal-day-list .day-row.sun .day-cell .dow { color: #f87171; }
.personal-day-list .day-row.sat .day-cell .dnum,
.personal-day-list .day-row.sat .day-cell .dow { color: #60a5fa; }
.personal-day-list .day-row.today .day-cell .dnum {
  background: #f0b878; color: #0a0d12;
  width: 22px; height: 22px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800;
}
.personal-day-list .day-row.both-rest { background: #3a2a1c; }

.personal-day-list .day-cell {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 2px 0;
  border-right: 1px solid rgba(255,255,255,0.06);
  background: #191d28;
  gap: 1px;
}
.personal-day-list .day-cell .dow {
  font-size: 9px; font-weight: 700; color: #a0a7b4;
  letter-spacing: 0.5px; line-height: 1.1;
}
.personal-day-list .day-cell .dnum {
  font-size: 16px; font-weight: 800; line-height: 1.1;
  color: #e8eaef;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.3px;
}

.personal-day-list .shifts {
  display: grid; grid-template-columns: 1fr 1fr;
}
.personal-day-list .shift {
  display: flex; align-items: center; justify-content: center;
  padding: 7px 2px;
  font-weight: 700;
  position: relative;
}
.personal-day-list .shifts .shift + .shift { border-left: 1px solid #15181e; }
.personal-day-list .shift-mark {
  font-size: 15px; font-weight: 800; letter-spacing: 0.5px;
}
.personal-day-list .shift.work { background: #233148; color: #9fc4ee; }
.personal-day-list .shift.rest { background: #3a2a1c; color: #efbb86; }
.personal-day-list .shift.rest .shift-mark { font-size: 16px; }
.personal-day-list .shifts .shift + .shift.work { background: #243c30; color: #9fd4b3; }
.personal-day-list .day-row.both-rest .shift.rest { background: #3a2a1c; color: #efbb86; }

.personal-day-list .both-rest-tag {
  position: absolute; top: 4px; right: 4px;
  background: rgba(10,13,18,0.55);
  color: #efbb86;
  font-size: 8px; font-weight: 700;
  padding: 2px 5px; border-radius: 3px;
  letter-spacing: 0.06em;
  border: 1px solid rgba(232,165,101,0.30);
  pointer-events: none; z-index: 2;
}

.personal-legend-card {
  background: #1f2330;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  padding: 16px 18px;
  margin-top: 24px;
}
.personal-legend-card .legend-title {
  font-size: 10.5px; font-weight: 600; color: #6b7280;
  letter-spacing: 0.15em; margin-bottom: 14px;
  text-transform: uppercase;
}
.personal-legend-card .legend-list {
  display: flex; flex-wrap: wrap; gap: 10px 18px;
  font-size: 11.5px; color: #a0a7b4;
  font-weight: 600; letter-spacing: 0.2px;
}
.personal-legend-card .legend-item { display: flex; align-items: center; gap: 7px; }
.personal-legend-card .legend-dot {
  width: 14px; height: 14px; border-radius: 4px;
  flex-shrink: 0; border: 1px solid rgba(255,255,255,0.12);
}

.personal-empty-notice {
  padding: 40px 16px;
  text-align: center;
  color: #a0a7b4;
  background: #1f2330;
  border: 1.5px dashed rgba(255,255,255,0.12);
  border-radius: 16px;
  line-height: 1.8;
  font-size: 13.5px;
  margin-bottom: 16px;
}
.personal-empty-notice strong { color: #efbb86; font-weight: 700; }
.personal-empty-notice small { display: block; margin-top: 8px; color: #6b7280; font-size: 12px; }

@media (max-width: 380px) {
  .personal-app { padding: 14px 8px 60px; }
  .personal-day-list { gap: 7px; }
  .personal-day-list .day-row { grid-template-columns: 28px 1fr; }
  .personal-day-list .day-cell .dnum { font-size: 14px; }
  .personal-day-list .day-cell .dow { font-size: 8px; }
  .personal-day-list .day-row.today .day-cell .dnum { width: 21px; height: 21px; font-size: 11.5px; }
  .personal-day-list .shift { padding: 6px 2px; }
  .personal-day-list .shift-mark { font-size: 13.5px; }
  .personal-day-list .shift.rest .shift-mark { font-size: 14.5px; }
  .personal-day-list .month-col-head { font-size: 12px; padding: 6px 0; }
}

/* 进入个人视图时,隐藏与排班表无关的主导航按钮 */
body.personal-mode #btn-edit-toggle,
body.personal-mode #btn-print { display: none !important; }
/* 出力 PNG 按钮 — 仅在个人视图显示 */
body:not(.personal-mode) #btn-personal-export { display: none !important; }

/* 个人视图打印时不出现 — 用 PNG 出力替代 */
@media print {
  body.personal-mode #page-personal { display: none !important; }
}
/* hours 视图:隐藏与之无关的导航按钮(锁定/打印/出力PNG/数据) */
body.hours-mode #btn-edit-toggle,
body.hours-mode #btn-print,
body.hours-mode #btn-personal-export,
body.hours-mode .nav button[data-route="#/data"]{display:none!important}

/* ============================================================
   月度工时系统 (page-hours) — 移植自 月度工时统计.html,全部 scoped */
/* ============================================================ */
#page-hours {
  padding: 0; max-width: 100%;
  /* hours 模块自有变量 — 不污染主表 */
  --h-bg: #0a0b0e;
  --h-surface: #14161d;
  --h-surface-2: #1a1d26;
  --h-surface-3: #232631;
  --h-border: #262936;
  --h-border-soft: #1d2029;
  --h-text: #ececf1;
  --h-text-dim: #8a8d99;
  --h-text-faint: #5a5d6a;
  --h-accent: #5eead4;
  --h-accent-dim: #2dd4bf;
  --h-accent-deep: #0d9488;
  --h-accent-glow: rgba(94, 234, 212, 0.18);
  --h-c-normal: #60a5fa;
  --h-c-ot: #fbbf24;
  --h-c-holiday: #fb923c;
  --h-c-leave: #f87171;
  --h-c-absent: #71717a;
  --h-c-weekend: #a78bfa;
  --h-c-sun: #f87171;
  --h-c-sat: #60a5fa;
  --h-radius: 12px;
  --h-radius-sm: 8px;
  --h-radius-xs: 6px;
  --h-shadow: 0 4px 24px rgba(0,0,0,0.35), 0 1px 3px rgba(0,0,0,0.4);
  --h-shadow-lg: 0 24px 56px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.4);
  --h-font-display: 'Bricolage Grotesque', -apple-system, 'PingFang SC', sans-serif;
  --h-font-body: 'Geist', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --h-font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  background:
    radial-gradient(ellipse 70% 50% at 50% -10%, var(--h-accent-glow), transparent 70%),
    var(--h-bg);
  color: var(--h-text);
  font-family: var(--h-font-body);
  min-height: calc(100vh - var(--sticky-nav, 50px));
  -webkit-font-smoothing: antialiased;
}
#page-hours .h-wrap { max-width: 1200px; margin: 0 auto; padding: 14px 32px 60px; }
#page-hours .h-top {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; margin-bottom: 24px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--h-border-soft);
  flex-wrap: wrap;
}
#page-hours .h-brand {
  display: flex; align-items: center; gap: 12px;
}
#page-hours .h-brand-mark {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(135deg, var(--h-accent), var(--h-accent-deep));
  display: grid; place-items: center;
  font-weight: 600; font-size: 16px; color: #07120f;
  box-shadow: 0 0 0 1px rgba(94,234,212,0.3), 0 8px 28px var(--h-accent-glow);
}
#page-hours .h-brand h1 {
  font-family: var(--h-font-display);
  font-variation-settings: "wdth" 100, "opsz" 24;
  font-size: 17px; font-weight: 500; color: var(--h-text); margin: 0;
  letter-spacing: -0.012em;
}
#page-hours .h-brand h1 em {
  font-style: normal; color: var(--h-text-dim); font-weight: 400; margin-left: 4px;
}
#page-hours .h-subt {

  color: var(--h-text-faint); text-transform: uppercase;
}
#page-hours .h-actions { display: flex; gap: 6px; flex-wrap: wrap; }
#page-hours .h-btn {
  background: var(--h-surface); border: 1px solid var(--h-border);
  color: var(--h-text-dim); font-family: var(--h-font-body);
  font-size: 12.5px; font-weight: 500;
  padding: 7px 12px; border-radius: var(--h-radius-sm);
  cursor: pointer; transition: all 0.16s ease;
  display: inline-flex; align-items: center; gap: 6px;
}
#page-hours .h-btn:hover {
  color: var(--h-text);
  border-color: rgba(94,234,212,0.45);
  background: var(--h-surface-2);
}
#page-hours .h-month-row {

}
#page-hours .h-month-pick { display: flex; align-items: center; gap: 6px; }
#page-hours .h-nav {
  width: 36px; height: 36px; border-radius: 9px;
  border: 1px solid var(--h-border); background: var(--h-surface);
  color: var(--h-text-dim); cursor: pointer; font-size: 16px;
  display: inline-flex; align-items: center; justify-content: center;

}
#page-hours .h-nav:hover {
  color: var(--h-accent);
  border-color: rgba(94,234,212,0.55);
  background: var(--h-surface-2);
}
#page-hours .h-month-title {
  min-width: 220px; text-align: center;
  cursor: pointer; position: relative;
  padding: 6px 18px; border-radius: 10px;
  transition: background 0.15s; font-weight: 500;
}
#page-hours .h-month-title:hover { background: var(--h-surface); }
#page-hours .h-month-label {
  display: inline-flex; align-items: baseline; gap: 4px; line-height: 1;
}
#page-hours .h-m-num {
  font-family: var(--h-font-display);
  font-variation-settings: "opsz" 96, "wdth" 100;
  font-weight: 500; font-size: 46px; color: var(--h-text);
  font-feature-settings: "tnum", "lnum"; letter-spacing: -0.045em;
}
#page-hours .h-m-unit {
  font-size: 17px; color: var(--h-text-dim); margin-left: 2px;
  transform: translateY(-4px);
}
#page-hours .h-yr {
  font-family: var(--h-font-mono); font-size: 11.5px;

}
#page-hours .h-picker {
  position: absolute; top: calc(100% + 8px); left: 50%;
  transform: translateX(-50%);
  background: var(--h-surface); border: 1px solid var(--h-border);
  border-radius: var(--h-radius); box-shadow: var(--h-shadow-lg);
  padding: 12px; z-index: 300; width: 280px;
  display: none; text-align: left; cursor: default;

#page-hours .h-picker.open { display: block; }
#page-hours .h-picker-year {
  display: flex; align-items: center; justify-content: space-between;

}
#page-hours .h-picker-year .y {

#page-hours .h-picker-grid button .h-m-num {

#page-hours .h-picker-year button {

  background: var(--h-surface-3); border-color: var(--h-border);

  background: var(--h-accent); border-color: var(--h-accent); color: #07120f;

<script>
'use strict';

const Util = (() => {
  const pad2 = n => String(n).padStart(2,'0');
  const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
  const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
  const newId = (prefix) => prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const clone = obj => JSON.parse(JSON.stringify(obj));
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  return { pad2, ymd, parseYmd, addDays, newId, clone, debounce };
})();

const Holidays = (() => {
  // 2024-2027 日本国民の祝日 (静的データ; 振替休日含む)
  const list = new Set([
    // 2024
    '2024-01-01','2024-01-08','2024-02-11','2024-02-12','2024-02-23',
    '2024-03-20','2024-04-29','2024-05-03','2024-05-04','2024-05-05','2024-05-06',

    // 2025
    '2025-01-01','2025-01-13','2025-02-11','2025-02-23','2025-02-24',
    '2025-03-20','2025-04-29','2025-05-03','2025-05-04','2025-05-05','2025-05-06',
    '2025-07-21','2025-08-11','2025-09-15','2025-09-23',
    '2025-10-13','2025-11-03','2025-11-23','2025-11-24',
    // 2026
    '2026-01-01','2026-01-12','2026-02-11','2026-02-23',
    '2026-03-20','2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-05-06',
    '2026-07-20','2026-08-11','2026-09-21','2026-09-22','2026-09-23',

    // 2027
