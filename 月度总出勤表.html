<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>月度总出勤表</title>
<style>
:root{
  --bg:#0a0a0b; --card:#161618; --border:#26262a;
  --text:#e8e8ea; --muted:#8a8a90;
  --accent:#7c5cff; --ok:#10b981; --warn:#f59e0b; --danger:#ef4444;
  --sat:#3b82f6; --sun:#ef4444; --today:#1e293b; --retired:#52525a;
  --r-card:12px; --r-btn:8px;
  --font:"Noto Sans JP",-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  --font-mono:ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;background:transparent;border:1px solid var(--border);border-radius:var(--r-btn);padding:6px 12px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{background:#1f1f23}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#6a4def}
button.danger{color:var(--danger);border-color:var(--danger)}
input,select{font:inherit;color:inherit;background:#1f1f23;border:1px solid var(--border);border-radius:var(--r-btn);padding:6px 10px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
/* hide native number spinners (Webkit + Firefox) */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.nav{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100;flex-wrap:wrap;isolation:isolate;will-change:transform;box-shadow:0 6px 0 var(--bg)}
@media (max-width:768px){
  .nav{position:fixed;top:0;left:0;right:0;width:100%}
  body{padding-top:var(--sticky-nav,50px)}
}
/* 手机竖屏三行布局(用 flex order + 伪元素强制换行):
   行1:月度总出勤表 [部门▼]
   行2:◀ 日期 ▶ 今日 ✓已暂存 .......... ⬇⬆数据
   行3:                              🔒锁定 ⚙设置 🖨打印
   「数据」的右边框与「打印」的右边框竖直对齐(都贴 nav 右内边距)。 */
@media (max-width:640px){
  .nav .spacer{display:none}
  .nav .brand{order:0}
  .nav #dept-tabs{order:1}
  .nav::before{content:'';flex-basis:100%;height:0;order:2}
  .nav #period-nav{order:3}
  .nav #dirty-indicator{order:4}
  .nav button[data-route="#/data"]{order:5;margin-left:auto}
  .nav::after{content:'';flex-basis:100%;height:0;order:6}
  .nav button#btn-edit-toggle{order:7;margin-left:auto}
  .nav button[data-route="#/settings"]{order:8}
  .nav button#btn-print{order:9}
}
.nav .brand{font-weight:600;margin-right:12px;cursor:pointer}
.nav .brand:hover{color:var(--accent)}
.nav .spacer{flex:1}
.nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.dirty{font-size:12px;color:var(--muted)}
.dirty.warn{color:var(--warn)}
.page{padding:14px 16px;max-width:100%}
.hidden{display:none!important}
#test-results{position:fixed;bottom:0;left:0;right:0;background:#000;color:#0f0;font-family:var(--font-mono);font-size:12px;padding:8px;max-height:40vh;overflow:auto;z-index:9999;white-space:pre-wrap}
/* schedule page */
.dept-tabs button{margin-right:4px}
.dept-tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.period-nav{display:inline-flex;gap:4px;align-items:center;font-family:var(--font-mono)}
.period-nav button{padding:3px 9px;font-size:13px;color:var(--muted);border-color:transparent;background:#1c1c20}
.period-nav button:hover{color:var(--accent);border-color:var(--border);background:#222227}
.period-nav span{color:var(--text);padding:0 6px}
.schedule-wrap{margin-top:10px}
table.schedule thead{position:sticky;top:var(--sticky-nav,50px);z-index:3;background:#1c1c20}
table.schedule thead th{background:#1c1c20}
table.schedule thead th.dept-name{background:#161618}
table.schedule{border-collapse:collapse;font-size:11px;background:var(--card);width:100%}
table.schedule th,table.schedule td{border:1px solid var(--border);padding:2px 4px;text-align:center;white-space:nowrap}
table.schedule col.col-role{width:60px}
table.schedule col.col-name{width:130px}
table.schedule col.col-sum{width:36px}
table.schedule col.col-day{width:27px}
table.schedule th{background:#1c1c20;font-weight:500}
table.schedule th.dept-name{text-align:left;padding-left:6px;font-weight:700;font-size:13px;color:var(--accent);background:var(--bg)}
table.schedule th.month-label{font-weight:700;font-size:12px;color:var(--text);background:#1c1c20;letter-spacing:1px}
table.schedule th.role-col,table.schedule td.role-col{min-width:60px;text-align:left;padding-left:6px}
table.schedule th.name-col,table.schedule td.name-col{min-width:110px;text-align:left;padding-left:6px;position:sticky;left:0;background:#1c1c20;z-index:1}
table.schedule td.name-col{background:var(--card)}
table.schedule th.sum-col,table.schedule td.sum-col{min-width:36px;color:var(--muted)}
table.schedule td.sum-col.over{color:var(--danger);font-weight:700}
table.schedule td.sum-col.under{color:var(--warn);font-weight:700}
table.schedule th:not(.role-col):not(.name-col):not(.sum-col):not(.dept-name):not(.month-label){width:27px;height:25px;box-sizing:border-box;padding:0;vertical-align:middle}
table.schedule td.day-cell{width:27px;height:25px;box-sizing:border-box;padding:0;cursor:pointer;font-family:var(--font-mono);font-size:13px;vertical-align:middle;line-height:1;font-weight:400}
table.schedule td.day-cell:hover{background:#1f1f23}
table.schedule td.day-cell.contractRest{color:var(--text)}
table.schedule td.day-cell.paidLeave{color:var(--danger)}
table.schedule td.day-cell.absent{color:var(--danger)}
table.schedule td.day-cell.retired{color:var(--retired);cursor:not-allowed;background:#111114}
body:not(.editing) table.schedule td.day-cell{cursor:default}
body:not(.editing) table.schedule td.day-cell:hover{background:transparent}
body:not(.editing) table.schedule td.required input{cursor:default}
body:not(.editing) table.schedule td.required input:hover{background:transparent}
body:not(.editing) table.schedule td.dispatch input{cursor:default}
body:not(.editing) table.schedule td.dispatch input:hover{background:transparent}
table.schedule th.sat{color:var(--sat)}
table.schedule th.sun{color:var(--sun)}
.today-badge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;background:#f97316;color:#fff;border-radius:50%;font-weight:500;font-size:11px;line-height:1}
/* row / column highlight (click name-col / date-th to toggle) */
table.schedule td.name-col{cursor:pointer}
table.schedule thead tr.head-row th[data-ymd],table.schedule thead tr.weekday-row th[data-ymd]{cursor:pointer}
table.schedule tr.hl-row td,table.schedule tr.hl-row th{background:rgba(94,234,212,0.10)}
table.schedule td.hl-col,table.schedule th.hl-col{background:var(--today)}
table.schedule tr.hl-row td.hl-col,table.schedule tr.hl-row th.hl-col{background:#2a3f5f}
/* keyboard focus indicator(仅在编辑模式下显示,锁定时即使焦点逻辑保留也不画边框) */
body.editing table.schedule td.day-cell.cell-focus{position:relative;box-shadow:inset 0 0 0 2px var(--accent),0 0 0 1px var(--accent);z-index:2}
/* color palette toolbar */
.color-palette{display:inline-flex;gap:6px;align-items:center;margin-left:12px}
.color-palette .swatch{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.color-palette .swatch:hover{outline:1px solid var(--muted);outline-offset:1px}
.color-palette .swatch.active{border-color:var(--text);box-shadow:0 0 0 1px var(--bg) inset}
.color-palette .swatch-clear{background:transparent;border:2px dashed var(--muted);color:var(--muted)}
.color-palette .swatch-text{background:transparent;border:2px solid var(--accent);color:var(--accent);font-weight:700;font-family:var(--font-mono)}
.entry-hint{margin:8px 0 0;padding:6px 12px;background:rgba(124,92,255,0.08);border:1px solid rgba(124,92,255,0.25);border-radius:6px;font-size:12px;color:var(--text);font-family:var(--font-mono)}
.entry-hint kbd{display:inline-block;background:#1f1f23;border:1px solid var(--border);border-radius:3px;padding:0 5px;margin:0 2px;font-size:11px;color:var(--accent)}
table.schedule tr.stat-row td{background:#161618;font-family:var(--font-mono)}
table.schedule tr.stat-row td.label{text-align:left;padding-left:6px;color:var(--muted)}
table.schedule td.required{cursor:text;padding:0}
table.schedule td.required input{width:100%;padding:2px 0;font-size:12px;font-family:var(--font-mono);text-align:center;background:transparent;border:none;border-radius:0;color:var(--accent);font-weight:600}
table.schedule td.required input:hover{background:#1f1f23}
table.schedule td.required input:focus{background:#1f1f23;outline:1px solid var(--accent);outline-offset:-1px}
/* 派遣短期 input — 蓝色显示(锁定时也保持蓝色) */
table.schedule td.dispatch{cursor:text;padding:0}
table.schedule td.dispatch input{width:100%;padding:2px 0;font-size:12px;font-family:var(--font-mono);text-align:center;background:transparent;border:none;border-radius:0;color:var(--sat);font-weight:600}
table.schedule td.dispatch input:hover{background:#1f1f23}
table.schedule td.dispatch input:focus{background:#1f1f23;outline:1px solid var(--sat);outline-offset:-1px}
table.schedule td.dispatch input::-webkit-outer-spin-button,
table.schedule td.dispatch input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
table.schedule td.dispatch input{-moz-appearance:textfield}
/* settings */
.settings-section{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:14px;margin-bottom:14px}
.settings-section h2{margin:0 0 10px;font-size:16px}
.settings-row{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #1f1f23;flex-wrap:wrap}
.settings-row:last-child{border-bottom:none}
.settings-row .grow{flex:1}
.settings-row input{width:auto}
.settings-row input.name-input{min-width:160px}
.settings-row input.num{width:60px}
.settings-row select.person-dept{min-width:96px;padding:6px 10px}
/* 行内确认弹层(贴近触发按钮,替代浏览器原生 confirm/prompt) */
.confirm-popover{position:fixed;z-index:1000;background:linear-gradient(180deg,#1d1d22 0%,#16161a 100%);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px 16px;box-shadow:0 24px 56px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.03) inset,0 1px 0 rgba(255,255,255,0.06) inset;min-width:220px;max-width:300px;font-size:13px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:confirmIn .2s cubic-bezier(0.2,0.8,0.2,1)}
.confirm-popover .confirm-text{color:var(--text);font-weight:600;font-size:14px;margin-bottom:4px;line-height:1.4;letter-spacing:.01em}
.confirm-popover .confirm-sub{color:var(--muted);font-size:12px;margin-bottom:12px;line-height:1.4}
.confirm-popover .confirm-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.confirm-popover button{padding:7px 14px;font-size:12px;font-weight:500;line-height:1;border-radius:7px;transition:transform .12s ease,background .15s,box-shadow .15s;letter-spacing:.01em}
.confirm-popover button:active{transform:scale(0.97)}
.confirm-popover button.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(124,92,255,0.35)}
.confirm-popover button.primary:hover{background:#6a4def;box-shadow:0 4px 12px rgba(124,92,255,0.45)}
.confirm-popover button.danger{background:var(--danger);border-color:var(--danger);color:#fff;box-shadow:0 2px 8px rgba(239,68,68,0.35)}
.confirm-popover button.danger:hover{background:#dc2626;box-shadow:0 4px 12px rgba(239,68,68,0.45)}
.confirm-popover input.confirm-input{width:100%;margin-bottom:10px;padding:9px 11px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:var(--text);font:inherit;font-size:13px;box-sizing:border-box;transition:border-color .15s,background .15s,box-shadow .15s}
.confirm-popover input.confirm-input:focus{border-color:var(--accent);background:rgba(0,0,0,0.45);outline:none;box-shadow:0 0 0 3px rgba(124,92,255,0.15)}
.confirm-popover button.confirm-extra{display:block;width:100%;margin-bottom:10px;padding:8px;font-size:12px;border-radius:8px}
/* 颜色 swatches 行(用于文字配色) */
.confirm-popover .confirm-swatches{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.confirm-popover .confirm-swatches button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;flex:0 0 auto;transition:transform .1s}
.confirm-popover .confirm-swatches button:hover{transform:scale(1.1)}
.confirm-popover .confirm-swatches button.active{border-color:var(--text);box-shadow:0 0 0 2px rgba(255,255,255,0.15) inset}
.confirm-popover .confirm-swatches button.confirm-sw-clear{background:transparent;border:2px dashed rgba(255,255,255,0.3);color:rgba(255,255,255,0.5);font-size:13px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.confirm-popover .confirm-swatches button.confirm-sw-clear.active{border-color:var(--text);border-style:solid;color:var(--text)}
@keyframes confirmIn{from{opacity:0;transform:translateY(-6px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
/* Toast 通知(临时显示,自动消失) */
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:2000;background:linear-gradient(180deg,#1d1d22 0%,#16161a 100%);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:10px 16px;color:var(--text);font-size:13px;font-weight:500;box-shadow:0 12px 32px rgba(0,0,0,0.5);animation:toastIn .25s cubic-bezier(0.2,0.8,0.2,1);display:flex;align-items:center;gap:8px;max-width:90vw}
.toast.success{border-left:3px solid var(--ok)}
.toast.error{border-left:3px solid var(--danger)}
.toast.info{border-left:3px solid var(--accent)}
.toast.hide{animation:toastOut .2s ease-in forwards}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-10px)}}
.settings-row .role-input{min-width:120px}
.settings-row>span,.settings-row>button,.settings-row>select{white-space:nowrap;flex-shrink:0}
.settings-sub-people{padding-left:8px;border-left:2px solid var(--border);margin-top:6px}
/* 同部门内人员可拖动重排序。drag-handle 是触发区,鼠标在它上时光标变 grab */
.settings-sub-people .settings-row{position:relative;transition:background .12s,opacity .12s}
.settings-sub-people .drag-handle{display:inline-flex;align-items:center;justify-content:center;width:18px;height:24px;color:var(--muted);cursor:grab;font-size:14px;line-height:1;user-select:none;flex-shrink:0;border-radius:4px;letter-spacing:-1px}
.settings-sub-people .drag-handle:hover{color:var(--text);background:rgba(255,255,255,0.06)}
.settings-sub-people .drag-handle:active{cursor:grabbing}
.settings-sub-people .settings-row.dragging{opacity:0.4;background:rgba(124,92,255,0.08)}
/* 拖到目标行上下半区时,边缘画一条紫色线作为插入位置提示 */
.settings-sub-people .settings-row.drop-before{box-shadow:0 -2px 0 var(--accent) inset;border-top:2px solid var(--accent);margin-top:-2px}
.settings-sub-people .settings-row.drop-after{box-shadow:0 2px 0 var(--accent) inset;border-bottom:2px solid var(--accent);margin-bottom:-2px}
/* 手机竖屏:人员行强制单行,隐藏 label,缩小尺寸保证所有控件能挤一行 */
@media (max-width:640px){
  .settings-sub-people .settings-row{
    display:flex;
    flex-wrap:nowrap;
    gap:4px;
    align-items:center;
    padding:6px 0
  }
  .settings-sub-people .settings-row>.role-input{min-width:0;width:60px;flex:0 0 60px;font-size:12px;padding:6px 4px}
  .settings-sub-people .settings-row>.name-input{min-width:0;flex:1 1 auto;width:auto;font-size:12px;padding:6px 4px}
  /* 隐藏 label「有休残:」「部门:」(短缺空间,留下数字/下拉自身已经够明确) */
  .settings-sub-people .settings-row>span:not(.grow){display:none}
  .settings-sub-people .settings-row>span.grow{display:none}
  .settings-sub-people .settings-row>input.num{width:36px;flex:0 0 36px;padding:6px 2px;font-size:12px;text-align:center}
  .settings-sub-people .settings-row>select.person-dept{min-width:60px;flex:0 0 auto;padding:6px 4px;font-size:11px}
  .settings-sub-people .settings-row>button.danger{padding:6px 8px;font-size:12px;flex:0 0 auto}
  /* 手机竖屏:部门行强制单行(名称 + 必要 + 高度 + 删除 全挤一行) */
  .settings-section>.settings-row{flex-wrap:nowrap;gap:4px}
  .settings-section>.settings-row>.name-input{min-width:0;flex:1 1 auto;width:auto;font-size:12px;padding:6px 6px}
  .settings-section>.settings-row>span:not(.grow){font-size:11px;flex-shrink:0}
  .settings-section>.settings-row>input.num{width:44px;flex:0 0 44px;padding:6px 2px;font-size:12px;text-align:center}
  .settings-section>.settings-row>.grow{display:none}
  .settings-section>.settings-row>button.danger{padding:6px 8px;font-size:12px;flex:0 0 auto}
}
/* data */
.data-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:14px;margin-bottom:14px}
.data-stats{font-family:var(--font-mono);color:var(--muted);font-size:13px;line-height:1.8}
.data-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* print */
@media print {
  @page { size: A4 landscape; margin: 4mm; }
  :root {
    /* 每个部门可独立设置打印高度(state.departments[].printHeightMm,默认 192mm)。
       beforeprint 时 JS 读取当前部门设置,覆盖 --print-body-h / --print-row-h-base。
       row-h 加上限 7mm — 人多时铺满 A4 行高变小,人少时行高停在 7mm,
       表格 height: auto + .schedule-wrap flex 自动让 table 垂直居中在 A4 中间。 */
    --row-h: var(--row-h-fixed, min(calc(var(--print-row-h-base, 190mm) / var(--total-rows, 30)), var(--row-h-cap, 7mm)));
  }
  html, body { background: #fff; color: #000; padding-top: 0 !important; margin: 0 !important; height: var(--print-body-h, 192mm); overflow: hidden; }
  #page-schedule.page { padding: 0 !important; height: var(--print-body-h, 192mm); }
  /* 表格垂直居中于 body(A4 纸张内)。
     注意:之前配合 table 的 break-inside:avoid 会在 130% 缩放下出 bug — body 被放大超出
     A4 可用区,浏览器看到表格上方空白后认为不能整张放进第 1 页,把整张推到第 2 页,第 1 页空白。
     修复办法是去掉 table 层级的 break-inside:avoid,只保留 tr 级别(防止单行被截断)。
     这样 130% 时表格仍按居中位置摆放,且能在第 1 页正常显示。 */
  .schedule-wrap { margin: 0 !important; height: var(--print-body-h, 192mm); display: flex; flex-direction: column; justify-content: center; }
  .entry-hint { display: none !important; }
  table.schedule td.cell-focus { outline: none !important; box-shadow: none !important; }
  .color-palette { display: none !important; }
  /* preserve inline cell colors in print */
  table.schedule td.day-cell { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  /* kill sticky positions in print — iOS Safari / WebKit duplicates / shifts them otherwise */
  table.schedule thead { position: static !important; top: auto !important; box-shadow: none !important; }
  table.schedule th.name-col, table.schedule td.name-col { position: static !important; left: auto !important; }
  /* 只保留 tr 的 break-inside:avoid(防止单行被分页截断),不再对 table 整体加。
     table 层级的 break-inside:avoid 在缩放 > 100% 时会触发 bug:
     浏览器看到表格上方空白后,认为表格不能整张放进当前页,把整张推到下一页,导致空白页。
     去掉后,缩放时表格仍按 flex center 位置摆放,实际宽度通常仍能在第 1 页放下。 */
  table.schedule tr { page-break-inside: avoid; break-inside: avoid; }
  .nav, #page-settings, #page-data, #modal-host, #test-results { display: none !important; }
  #page-schedule { padding: 0; }
  .schedule-wrap { overflow: visible; margin: 0; }
  table.schedule {
    background: #fff;
    /* height: auto 让 table 按 row heights 自然累加(190mm),
       不强制拉到容器 100%(192mm),否则最后一行下边框会贴 body 底沿被 overflow 裁掉。 */
    width: 100%; height: auto; table-layout: fixed;
    border-collapse: collapse;
    margin: 0;
  }
  table.schedule th, table.schedule td {
    border: 1px solid #999; padding: 0 2px; color: #000; background: #fff !important;
    line-height: 1 !important;
    height: var(--row-h) !important;
    font-size: min(calc(var(--row-h) * 0.55), 3.8mm) !important;
    box-sizing: border-box;
  }
  /* day-cell 字号封顶 4.5mm,防止 〇/● 溢出 col-day (约 6mm 宽) */
  table.schedule td.day-cell {
    height: var(--row-h) !important;
    font-size: min(calc(var(--row-h) * 0.65), 4.5mm) !important;
    width: auto !important;
    /* CJK 字体 ascent > descent,line-height:1 下字形视觉偏上,padding-top 下推到视觉中心。
       PC 端 0.09 看起来居中,手机端浏览器/打印机字体度量不同,默认 0(不偏移)。
       beforeprint 时 JS 按视口宽度切换 --day-cell-pad-ratio。 */
    padding-top: calc(var(--row-h) * var(--day-cell-pad-ratio, 0.09)) !important;
  }
  /* 〇(契休) 大且笔画密,欠/有 是汉字笔画也密,统一压小一档 */
  table.schedule td.day-cell.contractRest,
  table.schedule td.day-cell.absent,
  table.schedule td.day-cell.paidLeave {
    font-size: min(calc(var(--row-h) * 0.55), 3.8mm) !important;
  }
  /* 自定义文字(包/早/晚/研 等汉字)笔画密,字号单独压更小 */
  table.schedule td.day-cell.has-text {
    font-size: min(calc(var(--row-h) * 0.5), 3.2mm) !important;
  }
  /* 払出 部门特例:有/〇/欠 缩到和 has-text 一样小,避免和并排自定义文字大小不一致 */
  body.print-dept-haraidashi table.schedule td.day-cell.paidLeave,
  body.print-dept-haraidashi table.schedule td.day-cell.contractRest,
  body.print-dept-haraidashi table.schedule td.day-cell.absent {
    font-size: min(calc(var(--row-h) * 0.5), 3.2mm) !important;
  }
  table.schedule th:not(.role-col):not(.name-col):not(.sum-col):not(.dept-name):not(.month-label) {
    height: var(--row-h) !important;
    width: auto !important;
    font-size: min(calc(var(--row-h) * 0.5), 3.5mm) !important;
  }
  table.schedule th.dept-name { font-size: min(calc(var(--row-h) * 0.65), 5mm) !important; height: var(--row-h) !important; }
  table.schedule th.month-label { font-size: min(calc(var(--row-h) * 0.55), 4mm) !important; height: var(--row-h) !important; }
  /* 必要人数/ライン合計/派遣短期/過不足 四行字号统一(input 和 td 同一个 cap) */
  table.schedule tr.stat-row td,
  table.schedule td.required input,
  table.schedule td.dispatch input { font-size: min(calc(var(--row-h) * 0.5), 3.5mm) !important; }
  table.schedule th { background: #f5f5f5 !important; font-weight: 600; }
  /* clear interactive highlights in print */
  table.schedule tr.hl-row td, table.schedule tr.hl-row th,
  table.schedule td.hl-col, table.schedule th.hl-col,
  table.schedule tr.hl-row td.hl-col, table.schedule tr.hl-row th.hl-col {
    background: #fff !important;
  }
  /* row striping for body rows */
  table.schedule tbody tr:not(.stat-row):nth-child(even) td { background: #fafafa !important; }
  /* stat row bg (overrides striping) */
  table.schedule tr.stat-row td { background: #f5f5f5 !important; }
  table.schedule th.dept-name { text-align: left; padding-left: 6px; font-weight: 700; font-size: 14px; color: #000 !important; background: #fff !important; height: 26px; }
  table.schedule th.month-label { font-weight: 700; font-size: 13px; color: #000 !important; background: #ddd !important; letter-spacing: 2px; height: 26px; }
  /* fixed column widths(mm) — A4 横向可用 ≈ 289mm
     左侧信息区 100mm (1/3) + 日期区 189mm (2/3) 的黄金比例 */
  table.schedule col.col-role { width: 20mm !important; }
  table.schedule col.col-name { width: 30mm !important; }
  table.schedule col.col-sum { width: 8mm !important; }
  table.schedule col.col-day { width: auto !important; }
  /* 各列字号 — 比例 0.5 保持夕盛(人多)原大小,mm 上限保护人少部门 */
  table.schedule th.role-col, table.schedule td.role-col {
    padding-left: 1mm;
    font-size: min(calc(var(--row-h) * 0.5), 4mm) !important;
  }
  table.schedule th.name-col, table.schedule td.name-col {
    padding-left: 1mm; position: static; background: #fff !important;
    /* var(--name-cap) 由 JS 按名字长度逐个 td 设置(纯 mm 值),min() 取它和 row-h 的较小者。
       变量未设时回退 4mm 默认上限。短名字不受影响,长名字按比例缩小到能塞进 30mm 列宽。 */
    font-size: min(calc(var(--row-h) * 0.5), var(--name-cap, 4mm)) !important;
    white-space: nowrap; overflow: hidden;
  }
  table.schedule th.sum-col, table.schedule td.sum-col {
    color: #000;
    font-size: min(calc(var(--row-h) * 0.4), 3mm) !important;
  }
  table.schedule td.sum-col.over { color: #b91c1c !important; font-weight: 700; }
  table.schedule td.sum-col.under { color: #b45309 !important; font-weight: 700; }
  /* day TH 列宽不再硬编码 26px 否则与 mm 单位的 role/name/sum 累加溢出 A4 宽度,
     被浏览器按比例缩小,col-name 48mm 实际只显示 ~40mm。改成 auto 让 col-day:auto 分配剩余 */
  table.schedule th:not(.role-col):not(.name-col):not(.sum-col):not(.dept-name):not(.month-label) { width: auto; }
  table.schedule td.day-cell { width: auto; height: var(--print-row-h, 22px); padding: 0; }
  table.schedule tbody tr:has(td.day-cell) td { height: var(--print-row-h, 22px); }
  table.schedule td.day-cell.contractRest { color: #000; }
  table.schedule td.day-cell.paidLeave { color: #b91c1c !important; font-weight: 400 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  table.schedule td.day-cell.absent { color: #b91c1c !important; }
  table.schedule td.day-cell.retired { color: #888; background: #f5f5f5 !important; }
  table.schedule th.sat { color: #1d4ed8 !important; }
  table.schedule th.sun { color: #b91c1c !important; }
  /* 打印时跟着 --row-h 缩放,字号匹配相邻日期数字,圆只比字大一圈,视觉上协调 */
  .today-badge {
    background: #f97316 !important; color: #fff !important;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
    width: calc(var(--row-h) * 0.67) !important;
    height: calc(var(--row-h) * 0.67) !important;
    font-size: min(calc(var(--row-h) * 0.5), 3.5mm) !important;
    font-weight: 500 !important;
  }
  table.schedule tr.stat-row td { background: #f5f5f5 !important; height: 22px; font-weight: 600; }
  table.schedule td.required, table.schedule td.dispatch { padding: 0; }
  table.schedule td.required input, table.schedule td.dispatch input {
    width: 100%; height: 100%; padding: 0;
    border: none !important; background: transparent !important;
    font-size: 12px; font-weight: 600; text-align: center;
    -webkit-appearance: none; appearance: none;
  }
  table.schedule td.required input { color: #000; }
  /* 派遣短期打印蓝色 — 与屏幕一致 */
  table.schedule td.dispatch input { color: #1d4ed8 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  table.schedule td.required input::-webkit-outer-spin-button,
  table.schedule td.required input::-webkit-inner-spin-button,
  table.schedule td.dispatch input::-webkit-outer-spin-button,
  table.schedule td.dispatch input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; display: none; }
}
</style>

<nav class="nav">
  <span class="brand" data-route="#/schedule" title="返回排班主页">月度总出勤表</span>
  <span id="dept-tabs"></span>

  <span id="dirty-indicator" class="dirty">✓ 已暂存</span>
  <button id="btn-edit-toggle">🔒 锁定</button>
  <button data-route="#/settings">⚙ 设置</button>
  <button data-route="#/data">⬇⬆ 数据</button>
  <button class="primary" id="btn-print">🖨 打印</button>
</nav>
<section id="page-schedule" class="page"></section>
<section id="page-settings" class="page hidden"></section>
<section id="page-data" class="page hidden"></section>
<div id="modal-host"></div>
<div id="test-results" class="hidden"></div>
<script>
'use strict';

const Util = (() => {
  const pad2 = n => String(n).padStart(2,'0');
  const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
  const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
  const newId = (prefix) => prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const clone = obj => JSON.parse(JSON.stringify(obj));
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  return { pad2, ymd, parseYmd, addDays, newId, clone, debounce };
})();

const Holidays = (() => {
  // 2024-2027 日本国民の祝日 (静的データ; 振替休日含む)
  const list = new Set([
    // 2024
    '2024-01-01','2024-01-08','2024-02-11','2024-02-12','2024-02-23',
    '2024-03-20','2024-04-29','2024-05-03','2024-05-04','2024-05-05','2024-05-06',
    '2024-07-15','2024-08-11','2024-08-12','2024-09-16','2024-09-22','2024-09-23',
    '2024-10-14','2024-11-03','2024-11-04','2024-11-23',
    // 2025
    '2025-01-01','2025-01-13','2025-02-11','2025-02-23','2025-02-24',
    '2025-03-20','2025-04-29','2025-05-03','2025-05-04','2025-05-05','2025-05-06',
    '2025-07-21','2025-08-11','2025-09-15','2025-09-23',
    '2025-10-13','2025-11-03','2025-11-23','2025-11-24',
    // 2026
    '2026-01-01','2026-01-12','2026-02-11','2026-02-23',
    '2026-03-20','2026-04-29','2026-05-03','2026-05-04','2026-05-05','2026-05-06',
    '2026-07-20','2026-08-11','2026-09-21','2026-09-22','2026-09-23',
    '2026-10-12','2026-11-03','2026-11-23',
    // 2027
    '2027-01-01','2027-01-11','2027-02-11','2027-02-23',
    '2027-03-21','2027-03-22','2027-04-29','2027-05-03','2027-05-04','2027-05-05',
    '2027-07-19','2027-08-11','2027-09-20','2027-09-23',
    '2027-10-11','2027-11-03','2027-11-23'
  ]);
  const isHoliday = (ymd) => list.has(ymd);
  return { isHoliday };
})();

const Period = (() => {
  // periodKey: 'YYYY-MM' represents YYYY-MM-16 ~ next month 15
  const WEEKDAY_JP = ['日','月','火','水','木','金','土']; // Date.getDay() → 0..6
  const todayKey = () => {
    const d = new Date();
    if (d.getDate() < 16) {
      const p = new Date(d.getFullYear(), d.getMonth() - 1, 1);
      return `${p.getFullYear()}-${Util.pad2(p.getMonth()+1)}`;
    }
    return `${d.getFullYear()}-${Util.pad2(d.getMonth()+1)}`;
  };
  const range = (key) => {
    const [y, m] = key.split('-').map(Number);
    const start = new Date(y, m - 1, 16);
    const end = new Date(y, m, 15);
    return { start, end };
  };
  const days = (key) => {
    const { start, end } = range(key);
    const out = [];
    for (let d = new Date(start); d <= end; d = Util.addDays(d, 1)) {
      const ymdStr = Util.ymd(d);
      out.push({
        ymd: ymdStr,
        day: d.getDate(),
        weekday: d.getDay(),
        weekdayJp: WEEKDAY_JP[d.getDay()],
        isSat: d.getDay() === 6,
        isSun: d.getDay() === 0,
        isHoliday: Holidays.isHoliday(ymdStr)
      });
    }
    return out;
  };
  const prev = (key) => {
    const [y, m] = key.split('-').map(Number);
    const p = new Date(y, m - 2, 1);
    return `${p.getFullYear()}-${Util.pad2(p.getMonth()+1)}`;
  };
  const next = (key) => {
    const [y, m] = key.split('-').map(Number);
    const n = new Date(y, m, 1);
    return `${n.getFullYear()}-${Util.pad2(n.getMonth()+1)}`;
  };
  const label = (key) => {
    const { start, end } = range(key);
    return `${start.getFullYear()}年${start.getMonth()+1}月${start.getDate()}日 ~ ${end.getMonth()+1}月${end.getDate()}日`;
  };
  return { todayKey, range, days, prev, next, label };
})();

const Store = (() => {
  const KEY = 'monthly-attendance-data-v1';
  const VERSION = 1;

  const defaults = () => ({
    version: VERSION,
    departments: [
      { id: 'dept1', name: '部门 A', requiredCount: 22, printHeightMm: 192 },
      { id: 'dept2', name: '部门 B', requiredCount: 22, printHeightMm: 192 },
      { id: 'dept3', name: '部门 C', requiredCount: 22, printHeightMm: 192 }
    ],
    people: { dept1: [], dept2: [], dept3: [] },
    attendance: {},
    cellColors: {},
    cellTexts: {},
    requiredPerDay: {},
    dispatchPerDay: {},
    ui: { currentDept: 'dept1', currentPeriod: Period.todayKey(), editMode: false },
    lastExportAt: null
  });

  let state = load();
  const listeners = new Set();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return defaults();
      const parsed = JSON.parse(raw);
      if (parsed.version !== VERSION) return defaults();
      // backward-compat: old field name shortTermDispatch → requiredPerDay
      if (!parsed.requiredPerDay) parsed.requiredPerDay = parsed.shortTermDispatch || {};
      delete parsed.shortTermDispatch;
      if (!parsed.dispatchPerDay) parsed.dispatchPerDay = {};
      if (!parsed.cellColors) parsed.cellColors = {};
      if (!parsed.cellTexts) parsed.cellTexts = {};
      // 旧数据兼容:部门没有 printHeightMm 时补 192
      if (Array.isArray(parsed.departments)) {
        parsed.departments.forEach(d => { if (d.printHeightMm == null) d.printHeightMm = 192; });
      }
      // 校正 ui.currentDept:如果指向已删除部门(或 null),改为第一个部门。
      // 否则 F5 后 select.value 设置失败,显示首项但 state 还是旧值,
      // 用户「选」首项时 onchange 不触发 → 看起来部门下拉无反应。
      if (parsed.ui && Array.isArray(parsed.departments) && parsed.departments.length > 0) {
        if (!parsed.departments.find(d => d.id === parsed.ui.currentDept)) {
          parsed.ui.currentDept = parsed.departments[0].id;
        }
      }
      return parsed;
    } catch (_) { return defaults(); }
  }

  const persist = Util.debounce(() => {
    localStorage.setItem(KEY, JSON.stringify(state));
    listeners.forEach(fn => fn('persist'));
  }, 100);

  function commit(reason = 'change') {
    listeners.forEach(fn => fn(reason));
    persist();
  }

  // ---- selectors ----
  const get = () => state;
  const dept = (id = state.ui.currentDept) => state.departments.find(d => d.id === id);
  const people = (deptId = state.ui.currentDept) => state.people[deptId] || [];
  const peopleInPeriod = (deptId = state.ui.currentDept, periodKey = state.ui.currentPeriod) => {
    const all = state.people[deptId] || [];
    const { start, end } = Period.range(periodKey);
    const startYmd = Util.ymd(start);
    const endYmd = Util.ymd(end);
    return all.filter(p => {
      const addedOk = !p.addedOn || p.addedOn <= endYmd;
      const retiredOk = !p.retiredOn || p.retiredOn >= startYmd;
      const removedOk = !p.removedOn || p.removedOn > endYmd;
      return addedOk && retiredOk && removedOk;
    });
  };
  const cellKey = (deptId, personId, ymd) => `${deptId}|${personId}|${ymd}`;
  const dispKey = (deptId, ymd) => `${deptId}|${ymd}`;

  const cellStatus = (deptId, personId, ymd) => {
    const person = people(deptId).find(p => p.id === personId);
    if (person && person.retiredOn && ymd >= person.retiredOn) return 'retired';
    return state.attendance[cellKey(deptId, personId, ymd)] || 'work';
  };

  const DEFAULT_REQUIRED = 22;
  const requiredCount = (deptId, ymd) => {
    const v = state.requiredPerDay[dispKey(deptId, ymd)];
    if (v !== undefined && v !== null) return v;
    const d = dept(deptId);
    return (d && d.requiredCount != null) ? d.requiredCount : DEFAULT_REQUIRED;
  };
  const dispatchCount = (deptId, ymd) => {
    const v = state.dispatchPerDay[dispKey(deptId, ymd)];
    return (v !== undefined && v !== null) ? v : 0;
  };

  // ---- mutators ----
  function setUi(patch) { Object.assign(state.ui, patch); commit('ui'); }

  function setCell(deptId, personId, ymd, status, color) {
    const k = cellKey(deptId, personId, ymd);
    if (status === 'work') delete state.attendance[k];
    else state.attendance[k] = status;
    // 非 work(休息)状态强制清色 + 清文字 — 颜色/文字只属于出勤日
    if (status !== 'work') {
      delete state.cellColors[k];
      delete state.cellTexts[k];
    } else if (color !== undefined) {
      if (color === null) delete state.cellColors[k];
      else state.cellColors[k] = color;
    }
    commit('cell');
  }

  function cycleCell(deptId, personId, ymd, color) {
    const current = cellStatus(deptId, personId, ymd);
    // 派生 retired(来自 retiredOn 字段,旧数据兼容)仍不可编辑
    const person = (state.people[deptId] || []).find(pp => pp.id === personId);
    const isDerivedRetired = current === 'retired' && person && person.retiredOn && ymd >= person.retiredOn;
    if (isDerivedRetired) return;
    // 选了颜色 → 当作"涂色刷",强制设为 work + 填色;不再切换状态
    // 选了「clear」(✕)→ 强制设为 work + 清色
    if (color === 'clear') { setCell(deptId, personId, ymd, 'work', null); return; }
    if (color) { setCell(deptId, personId, ymd, 'work', color); return; }
    // 没选颜色 → 状态循环 空→〇→有→✲→空(欠跳过,只能键盘 3 设置);
    // 已经是欠的格子点击会直接回到空
    const next = current === 'work' ? 'contractRest'
               : current === 'contractRest' ? 'paidLeave'
               : current === 'paidLeave' ? 'retired'
               : 'work';
    setCell(deptId, personId, ymd, next);
  }

  const cellColor = (deptId, personId, ymd) => state.cellColors[cellKey(deptId, personId, ymd)] || null;
  // 返回 { text, color } 或 null。兼容旧版字符串格式。
  const cellText = (deptId, personId, ymd) => {
    const v = state.cellTexts[cellKey(deptId, personId, ymd)];
    if (!v) return null;
    if (typeof v === 'string') return { text: v, color: null }; // 旧版兼容
    return v;
  };

  // 设置单元格自定义文字+颜色。空字符串 = 清除。文字属于出勤日,会清空状态。
  function setCellText(deptId, personId, ymd, text, color) {
    const k = cellKey(deptId, personId, ymd);
    const t = (text || '').trim();
    if (!t) {
      delete state.cellTexts[k];
    } else {
      state.cellTexts[k] = { text: t, color: color || null };
      delete state.attendance[k]; // 出勤日
    }
    commit('cellText');
  }

  function setRequired(deptId, ymd, n) {
    const k = dispKey(deptId, ymd);
    const raw = String(n).trim();
    if (raw === '') { delete state.requiredPerDay[k]; commit('required'); return; }
    state.requiredPerDay[k] = Math.max(0, Number(n) || 0);
    commit('required');
  }

  function setDispatch(deptId, ymd, n, silent) {
    const k = dispKey(deptId, ymd);
    const raw = String(n).trim();
    if (raw === '' || Number(raw) === 0) {
      delete state.dispatchPerDay[k];
    } else {
      state.dispatchPerDay[k] = Math.max(0, Number(n) || 0);
    }
    if (silent) {
      // silent: 直接 setItem,绕开 debounce persist
      // (persist 100ms 后会触发 listeners → 整页重渲染破坏焦点,这是之前一直跳不过去的真凶)
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) {}
    } else {
      commit('dispatch');
    }
  }

  // departments
  function addDepartment(name) {
    const id = Util.newId('d');
    // 新部门自动带打印高度默认值 192mm,与现有部门保持一致
    state.departments.push({ id, name, requiredCount: 10, printHeightMm: 192 });
    state.people[id] = [];
    commit('dept');
    return id;
  }
  function renameDepartment(id, name) {
    const d = state.departments.find(x => x.id === id);
    if (d) { d.name = name; commit('dept'); }
  }
  function setDeptRequired(id, n) {
    const d = state.departments.find(x => x.id === id);
    if (d) { d.requiredCount = Math.max(0, Number(n) || 0); commit('dept'); }
  }
  function setDeptPrintHeight(id, mm) {
    const d = state.departments.find(x => x.id === id);
    if (d) {
      // 限制在合理范围 100-210mm 之间(A4 横向高度 210mm)
      d.printHeightMm = Math.max(100, Math.min(210, Number(mm) || 192));
      commit('dept');
    }
  }
  function removeDepartment(id) {
    state.departments = state.departments.filter(d => d.id !== id);
    delete state.people[id];
    for (const k of Object.keys(state.attendance)) if (k.startsWith(id + '|')) delete state.attendance[k];
    for (const k of Object.keys(state.requiredPerDay)) if (k.startsWith(id + '|')) delete state.requiredPerDay[k];
    if (state.ui.currentDept === id) state.ui.currentDept = state.departments[0]?.id || null;
    commit('dept');
  }

  // people
  function addPerson(deptId, person) {
    const { start } = Period.range(state.ui.currentPeriod);
    const defaultAddedOn = Util.ymd(start);
    const p = { id: Util.newId('p'), name: '', role: '', annualLeaveInit: 0, retiredOn: null, addedOn: defaultAddedOn, ...person };
    (state.people[deptId] = state.people[deptId] || []).push(p);
    commit('people');
    return p.id;
  }
  function updatePerson(deptId, personId, patch) {
    const list = state.people[deptId] || [];
    const i = list.findIndex(p => p.id === personId);
    if (i >= 0) { list[i] = { ...list[i], ...patch }; commit('people'); }
  }
  // soft-remove: keeps the person record + all historical attendance.
  // The person disappears from periods after `removedOn`, past periods still show them.
  function removePerson(deptId, personId) {
    const list = state.people[deptId] || [];
    const i = list.findIndex(p => p.id === personId);
    if (i >= 0) {
      const { start } = Period.range(state.ui.currentPeriod);
      list[i] = { ...list[i], removedOn: Util.ymd(start) };
      commit('people');
    }
  }
  // hard delete: nukes the person + all their attendance records. Use with care.
  function purgePerson(deptId, personId) {
    state.people[deptId] = (state.people[deptId] || []).filter(p => p.id !== personId);
    for (const k of Object.keys(state.attendance)) if (k.startsWith(`${deptId}|${personId}|`)) delete state.attendance[k];
    commit('people');
  }
  // 在同一部门内把人员从源位置移动到目标位置。
  // toPid 为目标参考人员 id;beforeTarget=true 插到目标之前,否则之后。
  // 操作底层 state.people[deptId] 完整数组,跨越已软删除的人员(removedOn)保持其原位置稳定。
  function reorderPerson(deptId, fromPid, toPid, beforeTarget) {
    const list = state.people[deptId] || [];
    const fromIdx = list.findIndex(p => p.id === fromPid);
    if (fromIdx < 0 || fromPid === toPid) return;
    const [moved] = list.splice(fromIdx, 1);
    const newToIdx = list.findIndex(p => p.id === toPid);
    if (newToIdx < 0) { list.splice(fromIdx, 0, moved); return; } // 异常回滚
    const insertAt = beforeTarget ? newToIdx : newToIdx + 1;
    list.splice(insertAt, 0, moved);
    commit('people');
  }
  // transfer: 把人员从原部门调到新部门。原部门设 removedOn=今天(过去周期保留),
  // 新部门添加一份(新 id,addedOn=今天,清空 retiredOn)。
  // 不修改 attendance,原部门历史排班按原 personId 保留。
  function transferPerson(fromDeptId, personId, toDeptId) {
    if (fromDeptId === toDeptId) return;
    const fromList = state.people[fromDeptId] || [];
    const i = fromList.findIndex(p => p.id === personId);
    if (i < 0) return;
    const orig = fromList[i];
    const today = Util.ymd(new Date());
    fromList[i] = { ...orig, removedOn: today };
    (state.people[toDeptId] = state.people[toDeptId] || []).push({
      ...orig,
      id: Util.newId('p'),
      addedOn: today,
      removedOn: null,
      retiredOn: null
    });
    commit('people');
  }

  // data
  function exportJson() {
    state.lastExportAt = new Date().toISOString();
    commit('export');
    return JSON.stringify(state, null, 2);
  }
  function importJson(json) {
    const parsed = JSON.parse(json);
    if (parsed.version !== VERSION) throw new Error('版本不兼容');
    // 原子校验:所有字段都补齐 + 校正,验证全部通过后才赋值 state。
    // 之前的 bug:state = parsed 在校验之前,如果 parsed 缺 departments/people 等字段,
    // 后续校验代码抛 TypeError,但 state 已被破坏 → 整页崩溃,所有功能失效。
    if (!Array.isArray(parsed.departments)) throw new Error('数据缺失或损坏:departments');
    if (!parsed.people || typeof parsed.people !== 'object') throw new Error('数据缺失或损坏:people');
    if (!parsed.attendance) parsed.attendance = {};
    if (!parsed.cellColors) parsed.cellColors = {};
    if (!parsed.cellTexts) parsed.cellTexts = {};
    parsed.departments.forEach(d => { if (d.printHeightMm == null) d.printHeightMm = 192; });
    if (!parsed.requiredPerDay) parsed.requiredPerDay = {};
    if (!parsed.dispatchPerDay) parsed.dispatchPerDay = {};
    if (!parsed.ui) parsed.ui = { currentDept: null, currentPeriod: Period.todayKey(), editMode: false };
    if (!parsed.departments.find(d => d.id === parsed.ui.currentDept)) {
      parsed.ui.currentDept = parsed.departments[0]?.id || null;
    }
    if (!parsed.ui.currentPeriod) parsed.ui.currentPeriod = Period.todayKey();
    // 所有验证 + 补全完成,才原子替换 state
    state = parsed;
    commit('import');
  }
  function reset() { state = defaults(); commit('reset'); }

  function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }

  return {
    get, dept, people, peopleInPeriod, cellStatus, cellColor, cellText, requiredCount, dispatchCount,
    setUi, setCell, cycleCell, setRequired, setDispatch, setCellText,
    addDepartment, renameDepartment, setDeptRequired, setDeptPrintHeight, removeDepartment,
    addPerson, updatePerson, removePerson, purgePerson, transferPerson, reorderPerson,
    exportJson, importJson, reset, subscribe
  };
})();

const Render = (() => {
  function el(tag, attrsOrChildren, children) {
    let attrs = {};
    if (Array.isArray(attrsOrChildren) || typeof attrsOrChildren === 'string') {
      children = attrsOrChildren;
    } else if (attrsOrChildren && typeof attrsOrChildren === 'object' && attrsOrChildren.nodeType === undefined) {
      attrs = attrsOrChildren;
    }
    const [name, ...rest] = tag.split(/(?=[.#])/);
    const node = document.createElement(name);
    for (const part of rest) {
      if (part.startsWith('.')) node.classList.add(part.slice(1));
      else if (part.startsWith('#')) node.id = part.slice(1);
    }
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'class') node.className += ' ' + v;
      else if (k === 'dataset') Object.assign(node.dataset, v);
      else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
      else node.setAttribute(k, v);
    }
    if (children != null) {
      const arr = Array.isArray(children) ? children : [children];
      for (const c of arr) {
        if (c == null || c === false) continue;
        node.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
      }
    }
    return node;
  }
  const clear = (node) => { while (node.firstChild) node.removeChild(node.firstChild); };
  const mount = (host, node) => { clear(host); host.appendChild(node); };
  return { el, clear, mount };
})();

const App = (() => {
  const routes = {
    '#/schedule': 'page-schedule',
    '#/settings': 'page-settings',
    '#/data': 'page-data'
  };

  function showRoute() {
    const hash = location.hash in routes ? location.hash : '#/schedule';
    for (const [r, id] of Object.entries(routes)) {
      document.getElementById(id).classList.toggle('hidden', r !== hash);
    }
    if (hash === '#/schedule') Pages.renderSchedule();
    else if (hash === '#/settings') Pages.renderSettings();
    else if (hash === '#/data') Pages.renderData();
  }

  function updateDirtyIndicator() {
    const el = document.getElementById('dirty-indicator');
    const lastExport = Store.get().lastExportAt;
    if (lastExport) {
      const days = (Date.now() - new Date(lastExport).getTime()) / 86400000;
      if (days >= 7) { el.textContent = `⚠ ${Math.floor(days)} 天未导出`; el.classList.add('warn'); return; }
    }
    el.textContent = '✓ 已暂存';
    el.classList.remove('warn');
  }

  function bindNav() {
    document.querySelectorAll('[data-route]').forEach(b => {
      b.addEventListener('click', () => {
        if (b.dataset.route === '#/schedule') {
          history.replaceState(null, '', location.pathname + location.search);
          showRoute();
        } else {
          location.hash = b.dataset.route;
        }
      });
    });
    document.getElementById('btn-print').addEventListener('click', () => window.print());
    document.getElementById('btn-edit-toggle').addEventListener('click', () => {
      Store.setUi({ editMode: !Store.get().ui.editMode });
    });
    window.addEventListener('hashchange', showRoute);
  }

  function updateEditUI() {
    const editing = !!Store.get().ui.editMode;
    document.body.classList.toggle('editing', editing);
    const btn = document.getElementById('btn-edit-toggle');
    btn.textContent = editing ? '✏ 编辑中' : '🔒 锁定';
    btn.classList.toggle('primary', editing);
  }

  let originalTitle = '';
  function buildPrintTitle() {
    const d = Store.dept();
    const period = Store.get().ui.currentPeriod;
    const { start, end } = Period.range(period);
    const y = start.getFullYear();
    const m1 = Util.pad2(start.getMonth() + 1);
    const m2 = Util.pad2(end.getMonth() + 1);
    return `${d ? d.name : ''}月度出勤表${y}${m1}16-${m2}15`;
  }

  function init() {
    bindNav();
    showRoute();
    updateDirtyIndicator();
    updateEditUI();
    Store.subscribe(() => { showRoute(); updateDirtyIndicator(); updateEditUI(); });
    window.addEventListener('beforeprint', () => {
      originalTitle = document.title;
      document.title = buildPrintTitle();
      const peopleN = Store.peopleInPeriod().length;
      // thead 3 行(月份/日期/星期) + N 人员行 + stat 4 行(必要/合計/派遣/不足)
      const totalRows = 3 + peopleN + 4;
      document.documentElement.style.setProperty('--total-rows', String(totalRows));
      // 应用当前部门的打印高度(每个部门可独立设置,默认 192mm)
      const curDept = Store.dept();
      const bodyH = (curDept && curDept.printHeightMm) || 192;
      // 手机端打印特殊处理:
      // 手机 Safari 打印 A4 横向时,实际可用区比 @page margin:4mm 声明小(浏览器最小边距更大),
      // 表格 100% 宽 ≈ 289mm 会横向溢出 → 第 2 页。修复:body 缩到 84% (zoom 0.84) 让表格只占 ~243mm。
      // 但单纯 zoom 0.84 会让表格只填 A4 的 84%,下方有大片空白 → 把 body 高度按 1/0.84 放大,
      // row-h 上限按 1/0.84 放大,缩放后正好和 PC 端 192mm 体验一致(填满 A4 + 单元格同尺寸)。
      // PC 端 (视口 > 640px) 完全不动,继续走原 192mm + 7mm row-h cap。
      const isMobile = window.matchMedia('(max-width: 640px)').matches;
      const PRINT_ZOOM = 0.84;
      const declaredBodyH = isMobile ? (bodyH / PRINT_ZOOM) : bodyH;
      const declaredRowCap = isMobile ? (7 / PRINT_ZOOM) : 7;
      document.documentElement.style.setProperty('--print-body-h', declaredBodyH + 'mm');
      document.documentElement.style.setProperty('--print-row-h-base', (declaredBodyH - 2) + 'mm');
      document.documentElement.style.setProperty('--row-h-cap', declaredRowCap + 'mm');
      document.body.style.zoom = isMobile ? String(PRINT_ZOOM) : '';
      // 手机端 (视口 ≤ 640px) 不给 day-cell 加 padding-top — 移动浏览器字体度量不同,加 padding 反而偏下
      document.documentElement.style.setProperty('--day-cell-pad-ratio', isMobile ? '0' : '0');
      // 払出 部门特例:打印时切换 body class,触发 day-cell 字号缩档(避免 有/〇 比 早/包 大)
      document.body.classList.toggle('print-dept-haraidashi', !!(curDept && curDept.name === '払出'));
      // 已彻底禁用 mobile-print-style 注入,beforeprint 不再做 brute-force inline 覆盖。
      // 所有平台统一走 base print CSS,部门高度由 --print-body-h 控制(已设)。
      // col 宽度直接 inline 设置。注意:CSS 里的 @media print 有 !important,
      // inline style 必须用 setProperty + 'important' 才能压过它(手机 Safari 严格按规范处理,
      // 普通 .style.width 不带 important 会输给 CSS !important,导致 col-name 退回 30mm 截断长名字)。
      document.querySelectorAll('table.schedule col.col-role').forEach(c => c.style.setProperty('width', '20mm', 'important'));
      document.querySelectorAll('table.schedule col.col-name').forEach(c => c.style.setProperty('width', '30mm', 'important'));
      document.querySelectorAll('table.schedule col.col-sum').forEach(c => c.style.setProperty('width', '8mm', 'important'));
      document.querySelectorAll('table.schedule col.col-day').forEach(c => c.style.setProperty('width', 'auto', 'important'));
    });
    window.addEventListener('afterprint', () => {
      if (originalTitle) document.title = originalTitle;
      document.documentElement.style.removeProperty('--total-rows');
      document.documentElement.style.removeProperty('--row-h-fixed');
      document.documentElement.style.removeProperty('--print-body-h');
      document.documentElement.style.removeProperty('--print-row-h-base');
      document.documentElement.style.removeProperty('--day-cell-pad-ratio');
      document.documentElement.style.removeProperty('--row-h-cap');
      document.body.style.removeProperty('zoom');
      document.body.classList.remove('print-dept-haraidashi');
      // 清除 beforeprint 给 col 加的 inline width(否则屏幕显示会异常)
      document.querySelectorAll('table.schedule col').forEach(c => c.style.removeProperty('width'));
      // Clean up brute-force inline styles
      document.documentElement.style.removeProperty('height');
      document.body.style.removeProperty('height');
      document.body.style.removeProperty('overflow');
      const pageEl = document.getElementById('page-schedule');
      const wrapEl = document.querySelector('#page-schedule .schedule-wrap');
      if (pageEl) pageEl.style.removeProperty('height');
      if (wrapEl) wrapEl.style.removeProperty('height');
      const cells = document.querySelectorAll('#page-schedule table.schedule th, #page-schedule table.schedule td');
      cells.forEach(c => {
        c.style.removeProperty('height');
        c.style.removeProperty('font-size');
        c.style.removeProperty('line-height');
        c.style.removeProperty('padding-top');
        c.style.removeProperty('padding-bottom');
      });
      document.querySelectorAll('#page-schedule table.schedule td.required input, #page-schedule table.schedule td.dispatch input').forEach(i => {
        i.style.removeProperty('font-size');
      });
    });
  }

  return { init, showRoute };
})();

const Pages = (() => {
  const highlightedRows = new Set();   // personId
  const highlightedCols = new Set();   // ymd
  let focusedCell = null;              // { personId, ymd } or null
  let activeColor = null;              // 'red'|'orange'|'yellow'|'green'|'blue'|'purple' or null
  const COLOR_MAP = {
    red: '#dc2626', orange: '#ea580c', yellow: '#ca8a04',
    green: '#16a34a', blue: '#2563eb', purple: '#9333ea'
  };
  function setActiveColor(c) { activeColor = (activeColor === c) ? null : c; activeTool = null; renderPalette(); }
  let activeTool = null; // 'text' = 文字工具激活;点击单元格弹 popover 输入一个字符
  function setActiveTool(tool) { activeTool = (activeTool === tool) ? null : tool; activeColor = null; renderPalette(); }

  function setFocus(personId, ymd) {
    const days = Period.days(Store.get().ui.currentPeriod);
    if (!days.find(d => d.ymd === ymd)) return;
    const ppl = Store.peopleInPeriod();
    if (!ppl.find(p => p.id === personId)) return;
    focusedCell = { personId, ymd };
    applyFocus();
  }

  function applyFocus() {
    document.querySelectorAll('.cell-focus').forEach(el => el.classList.remove('cell-focus'));
    if (!focusedCell) return;
    const sel = `td.day-cell[data-person="${focusedCell.personId}"][data-ymd="${focusedCell.ymd}"]`;
    const cell = document.querySelector(sel);
    if (cell) cell.classList.add('cell-focus');
  }

  function moveFocus(dx, dy) {
    if (!focusedCell) return;
    const days = Period.days(Store.get().ui.currentPeriod);
    const ppl = Store.peopleInPeriod();
    const di = days.findIndex(d => d.ymd === focusedCell.ymd);
    const pi = ppl.findIndex(p => p.id === focusedCell.personId);
    const newDi = Math.max(0, Math.min(days.length - 1, di + dx));
    const newPi = Math.max(0, Math.min(ppl.length - 1, pi + dy));
    focusedCell = { personId: ppl[newPi].id, ymd: days[newDi].ymd };
    applyFocus();
  }

  function setFocusedState(status) {
    if (!focusedCell) return;
    const deptId = Store.get().ui.currentDept;
    const days = Period.days(Store.get().ui.currentPeriod);
    const di = days.findIndex(d => d.ymd === focusedCell.ymd);
    const cur = { ...focusedCell };
    // advance focus first so re-render picks it up
    if (di < days.length - 1) {
      focusedCell = { personId: cur.personId, ymd: days[di + 1].ymd };
    }
    const st = Store.cellStatus(deptId, cur.personId, cur.ymd);
    // 派生 retired(来自人员的 retiredOn 字段)不可编辑;手动设的 ✲ 可以覆盖
    const person = (Store.people(deptId) || []).find(pp => pp.id === cur.personId);
    const isDerivedRetired = st === 'retired' && person && person.retiredOn && cur.ymd >= person.retiredOn;
    if (!isDerivedRetired) {
      Store.setCell(deptId, cur.personId, cur.ymd, status, activeColor);
    } else {
      applyFocus();
    }
  }

  function toggleRow(personId) {
    if (highlightedRows.has(personId)) highlightedRows.delete(personId);
    else highlightedRows.add(personId);
    applyHighlight();
  }
  function toggleCol(ymd) {
    if (highlightedCols.has(ymd)) highlightedCols.delete(ymd);
    else highlightedCols.add(ymd);
    applyHighlight();
  }

  function applyHighlight() {
    document.querySelectorAll('.hl-row, .hl-col').forEach(el => {
      el.classList.remove('hl-row');
      el.classList.remove('hl-col');
    });
    highlightedRows.forEach(pid => {
      document.querySelectorAll(`tr[data-person-id="${pid}"]`).forEach(tr => tr.classList.add('hl-row'));
    });
    highlightedCols.forEach(ymd => {
      document.querySelectorAll(`[data-ymd="${ymd}"]`).forEach(el => el.classList.add('hl-col'));
    });
  }

  function renderSchedule() {
    const host = document.getElementById('page-schedule');
    Render.clear(host);
    renderDeptTabs();
    renderPeriodNav();
    if (Store.get().ui.editMode) host.appendChild(buildEntryHint());
    host.appendChild(buildTable());
    requestAnimationFrame(() => { syncStickyOffsets(); applyHighlight(); applyFocus(); });
  }

  function buildEntryHint() {
    const div = Render.el('div.entry-hint');
    const left = Render.el('span');
    left.innerHTML = '键盘: <kbd>1</kbd>=〇 <kbd>2</kbd>=有 <kbd>3</kbd>=空 <kbd>4</kbd>=✲　<kbd>→</kbd><kbd>↓</kbd> 移焦　<kbd>Enter</kbd> 下一人';
    div.appendChild(left);
    div.appendChild(buildColorPalette());
    return div;
  }

  function buildColorPalette() {
    const wrap = Render.el('div.color-palette');
    wrap.appendChild(Render.el('span', { style: { color: 'var(--muted)' } }, '颜色:'));
    const swatches = [
      { c: 'clear', tag: 'button.swatch.swatch-clear', label: '×', title: '出勤+清色(擦除已涂的颜色,保持出勤)' },
      { c: 'red',    tag: 'button.swatch', hex: COLOR_MAP.red,    title: '红' },
      { c: 'orange', tag: 'button.swatch', hex: COLOR_MAP.orange, title: '橙' },
      { c: 'yellow', tag: 'button.swatch', hex: COLOR_MAP.yellow, title: '黄' },
      { c: 'green',  tag: 'button.swatch', hex: COLOR_MAP.green,  title: '绿' },
      { c: 'blue',   tag: 'button.swatch', hex: COLOR_MAP.blue,   title: '蓝' },
      { c: 'purple', tag: 'button.swatch', hex: COLOR_MAP.purple, title: '紫' }
    ];
    for (const s of swatches) {
      const attrs = { onclick: () => setActiveColor(s.c), title: s.title };
      if (s.hex) attrs.style = { background: s.hex };
      const btn = Render.el(s.tag, attrs, s.label || '');
      btn.dataset.colorKey = s.c || '';
      if ((activeColor || '') === (s.c || '')) btn.classList.add('active');
      wrap.appendChild(btn);
    }
    // 文字工具按钮:激活后点击单元格弹 popover 输入一个字符
    const textBtn = Render.el('button.swatch.swatch-text', {
      onclick: () => setActiveTool('text'),
      title: '文字工具(点击单元格输入一个字符)'
    }, 'T');
    textBtn.dataset.toolKey = 'text';
    if (activeTool === 'text') textBtn.classList.add('active');
    wrap.appendChild(textBtn);
    return wrap;
  }

  function renderPalette() {
    document.querySelectorAll('.color-palette .swatch').forEach(b => {
      const isText = b.classList.contains('swatch-text');
      if (isText) b.classList.toggle('active', activeTool === 'text');
      else b.classList.toggle('active', (b.dataset.colorKey || '') === (activeColor || ''));
    });
  }

  function syncStickyOffsets() {
    const nav = document.querySelector('.nav');
    if (!nav) return;
    document.documentElement.style.setProperty('--sticky-nav', nav.offsetHeight + 'px');
  }

  let resizeT;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(syncStickyOffsets, 60);
  });


  // global keyboard speed entry
  document.addEventListener('keydown', (e) => {
    if (!Store.get().ui.editMode || !focusedCell) return;
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    const k = e.key;
    if (k === '1') { setFocusedState('contractRest'); e.preventDefault(); }
    else if (k === '2') { setFocusedState('paidLeave'); e.preventDefault(); }
    else if (k === '3' || k === '0' || k === ' ') { setFocusedState('work'); e.preventDefault(); }
    else if (k === '4') { setFocusedState('retired'); e.preventDefault(); }
    else if (k === 'ArrowRight' || (k === 'Tab' && !e.shiftKey)) { moveFocus(1, 0); e.preventDefault(); }
    else if (k === 'ArrowLeft' || (k === 'Tab' && e.shiftKey)) { moveFocus(-1, 0); e.preventDefault(); }
    else if (k === 'ArrowDown') { moveFocus(0, 1); e.preventDefault(); }
    else if (k === 'ArrowUp') { moveFocus(0, -1); e.preventDefault(); }
    else if (k === 'Enter') {
      const ppl = Store.peopleInPeriod();
      const days = Period.days(Store.get().ui.currentPeriod);
      const pi = ppl.findIndex(p => p.id === focusedCell.personId);
      if (pi >= 0 && pi < ppl.length - 1) {
        focusedCell = { personId: ppl[pi + 1].id, ymd: days[0].ymd };
        applyFocus();
      }
      e.preventDefault();
    } else if (k === 'Escape') {
      focusedCell = null;
      applyFocus();
      e.preventDefault();
    }
  });

  function renderDeptTabs() {
    const host = document.getElementById('dept-tabs');
    Render.clear(host);
    const depts = Store.get().departments;
    let cur = Store.get().ui.currentDept;
    // 运行时保险:cur 指向已删除部门时立即同步,避免 select 显示与 state 脱节
    if (depts.length > 0 && !depts.find(d => d.id === cur)) {
      cur = depts[0].id;
      Store.setUi({ currentDept: cur });
      return; // setUi 会触发 listener 重新渲染整页
    }
    const sel = Render.el('select.dept-select', {
      onchange: (e) => Store.setUi({ currentDept: e.target.value })
    });
    for (const d of depts) {
      sel.appendChild(Render.el('option', { value: d.id }, d.name));
    }
    sel.value = cur || '';
    host.appendChild(sel);
  }

  function renderPeriodNav() {
    const host = document.getElementById('period-nav');
    Render.clear(host);
    host.classList.add('period-nav');
    const cur = Store.get().ui.currentPeriod;
    host.appendChild(Render.el('button', { onclick: () => Store.setUi({ currentPeriod: Period.prev(cur) }) }, '◀'));
    host.appendChild(Render.el('span', { style: { padding: '0 8px' } }, Period.label(cur)));
    host.appendChild(Render.el('button', { onclick: () => Store.setUi({ currentPeriod: Period.next(cur) }) }, '▶'));
    host.appendChild(Render.el('button', { onclick: () => Store.setUi({ currentPeriod: Period.todayKey() }) }, '今日'));
  }

  function buildTable() {
    const wrap = Render.el('div.schedule-wrap');
    const tbl = Render.el('table.schedule');
    const days = Period.days(Store.get().ui.currentPeriod);
    const todayYmd = Util.ymd(new Date());
    tbl.appendChild(buildColgroup(days));
    tbl.appendChild(buildHeader(days, todayYmd));
    tbl.appendChild(buildBody(days, todayYmd));
    wrap.appendChild(tbl);
    // dynamic print row-height based on people count
    const peopleN = Store.peopleInPeriod(Store.get().ui.currentDept).length;
    const AVAIL = 560;
    const MIN = 14, MAX = 31;
    const rowH = Math.max(MIN, Math.min(MAX, Math.round(AVAIL / Math.max(1, peopleN))));
    wrap.style.setProperty('--print-row-h', rowH + 'px');
    // 彻底禁用 mobile-print-style — 直接从 DOM 移除残留元素(任何 textContent 都不留)
    document.querySelectorAll('#mobile-print-style, style[id="mobile-print-style"]').forEach(el => el.remove());
    return wrap;
  }

  function buildColgroup(days) {
    const cg = Render.el('colgroup');
    // inline style 优先级最高,绕过所有 CSS 冲突。
    // 左侧信息区 100mm (役職 20 + 氏名 50 + sum 10×3) = 1/3 A4,日期区 189mm = 2/3。
    cg.appendChild(Render.el('col.col-role', { style: { width: '20mm' } }));
    cg.appendChild(Render.el('col.col-name', { style: { width: '30mm' } }));
    cg.appendChild(Render.el('col.col-sum',  { style: { width: '8mm' } }));
    cg.appendChild(Render.el('col.col-sum',  { style: { width: '8mm' } }));
    cg.appendChild(Render.el('col.col-sum',  { style: { width: '8mm' } }));
    // col-day 不设固定宽度,让 table-layout:fixed 把剩余宽度均分给 N 列
    for (let i = 0; i < days.length; i++) cg.appendChild(Render.el('col.col-day'));
    return cg;
  }

  function buildHeader(days, todayYmd) {
    const thead = Render.el('thead');

    // Row 0: dept name (over 5 summary cols) + month-grouping cells
    const r0 = Render.el('tr.month-row');
    const curDept = Store.dept();
    r0.appendChild(Render.el('th.dept-name', { colspan: 5 }, curDept ? curDept.name : ''));
    let groupStart = 0;
    let currentMonth = parseInt(days[0].ymd.slice(5, 7), 10);
    for (let i = 1; i <= days.length; i++) {
      const month = i < days.length ? parseInt(days[i].ymd.slice(5, 7), 10) : null;
      if (i === days.length || month !== currentMonth) {
        r0.appendChild(Render.el('th.month-label', { colspan: i - groupStart }, `${currentMonth}月`));
        groupStart = i;
        currentMonth = month;
      }
    }
    thead.appendChild(r0);

    const r1 = Render.el('tr.head-row');
    r1.appendChild(Render.el('th.role-col', { rowspan: 2 }, '役職'));
    r1.appendChild(Render.el('th.name-col', { rowspan: 2 }, '氏名'));
    r1.appendChild(Render.el('th.sum-col', { rowspan: 2 }, '有休'));
    r1.appendChild(Render.el('th.sum-col', { rowspan: 2 }, '契休'));
    r1.appendChild(Render.el('th.sum-col', { rowspan: 2 }, '残'));
    for (const d of days) {
      const content = d.ymd === todayYmd
        ? Render.el('span.today-badge', String(d.day))
        : String(d.day);
      const th = Render.el('th', { dataset: { ymd: d.ymd }, onclick: () => toggleCol(d.ymd) }, content);
      if (d.isSat) th.classList.add('sat');
      if (d.isSun || d.isHoliday) th.classList.add('sun');
      r1.appendChild(th);
    }
    thead.appendChild(r1);
    const r2 = Render.el('tr.weekday-row');
    for (const d of days) {
      const th = Render.el('th', { dataset: { ymd: d.ymd }, onclick: () => toggleCol(d.ymd) }, d.weekdayJp);
      if (d.isSat) th.classList.add('sat');
      if (d.isSun || d.isHoliday) th.classList.add('sun');
      r2.appendChild(th);
    }
    thead.appendChild(r2);
    return thead;
  }

  function buildBody(days, todayYmd) {
    const tbody = Render.el('tbody');
    const deptId = Store.get().ui.currentDept;
    const periodKey = Store.get().ui.currentPeriod;
    const people = Store.peopleInPeriod(deptId, periodKey);

    if (people.length === 0) {
      tbody.appendChild(Render.el('tr',
        Render.el('td', { colspan: 5 + days.length, style: { padding: '12px', color: 'var(--muted)', textAlign: 'center' } },
          '本部门暂无人员，请到「⚙ 设置」添加')));
      return tbody;
    }

    for (const p of people) {
      const tr = Render.el('tr', { dataset: { personId: p.id } });
      tr.appendChild(Render.el('td.role-col', p.role || ''));
      // 名字过长时自动缩字体:30mm 列宽 - padding 2mm - border ≈ 27.5mm 实际可用
      // 长名字打印自动缩字号 — col-name 30mm,留 2mm padding+safety,目标名字宽度 ≤ 26mm。
      // 仅设 --name-cap 这个 CSS 变量,由 @media print 的 name-col 规则在 min() 里读取。
      // 不直接设 inline font-size:
      //   - 手机 Safari 对内联 min/calc/var 解析不稳;
      //   - 纯 mm 内联会同时影响屏幕显示(mm→px 转换让屏幕字号反而更大);
      //   - 用 CSS 变量后,屏幕不应用 @media print,完全不受影响。
      const nameTd = Render.el('td.name-col', { onclick: () => toggleRow(p.id) }, p.name || '');
      const nameStr = p.name || '';
      let widthUnits = 0; // 1 全角 = 1, 半角/空格 = 0.5
      for (const ch of nameStr) widthUnits += /[一-鿿぀-ゟ゠-ヿ]/.test(ch) ? 1 : 0.5;
      const TARGET_MM = 26; // 30mm 列宽 - 2mm padding/safety
      if (widthUnits * 4 > TARGET_MM) {
        const capMm = (TARGET_MM / widthUnits).toFixed(2);
        nameTd.style.setProperty('--name-cap', capMm + 'mm');
      }
      tr.appendChild(nameTd);

      const sums = computeSums(deptId, p, periodKey, days);
      tr.appendChild(Render.el('td.sum-col', String(sums.paid)));
      const contractTd = Render.el('td.sum-col', String(sums.contract));
      if (sums.restCount > sums.contract) contractTd.classList.add('over');
      else if (sums.restCount < sums.contract) contractTd.classList.add('under');
      tr.appendChild(contractTd);
      tr.appendChild(Render.el('td.sum-col', String(sums.remaining)));

      for (const d of days) {
        const st = Store.cellStatus(deptId, p.id, d.ymd);
        const ct = Store.cellText(deptId, p.id, d.ymd); // { text, color } 或 null
        // 优先级:自定义文字 > 状态字符
        const displayChar = (ct && ct.text)
          || (st === 'contractRest' ? '〇' : st === 'paidLeave' ? '有' : st === 'absent' ? '欠' : st === 'retired' ? '✲' : '');
        const td = Render.el('td.day-cell',
          { dataset: { person: p.id, ymd: d.ymd } },
          displayChar
        );
        td.classList.add(st);
        if (ct && ct.text) td.classList.add('has-text');
        const c = Store.cellColor(deptId, p.id, d.ymd);
        if (c && COLOR_MAP[c]) {
          // 背景色填满 + 字色变白(默认 cellColor 优先于文字色)
          td.style.setProperty('background-color', COLOR_MAP[c], 'important');
          td.style.setProperty('color', '#fff', 'important');
        } else if (ct && ct.color && COLOR_MAP[ct.color]) {
          // 没填背景色 → 应用自定义文字色(不再强制 bold,保持细字)
          td.style.setProperty('color', COLOR_MAP[ct.color], 'important');
        }
        const isDerivedRetired = st === 'retired' && p.retiredOn && d.ymd >= p.retiredOn;
        if (!isDerivedRetired) {
          td.addEventListener('click', () => {
            if (!Store.get().ui.editMode) return;
            focusedCell = { personId: p.id, ymd: d.ymd };
            // 文字工具激活 → 弹 popover 输入字符 + 选颜色;否则正常状态循环
            if (activeTool === 'text') {
              const ct = Store.cellText(deptId, p.id, d.ymd);
              showConfirmPopover(td, {
                text: '单元格文字',
                sub: '输入字符 + 选颜色(留空=清除)',
                input: { type: 'text', value: ct ? ct.text : '', placeholder: '一个字符' },
                swatches: {
                  initial: ct ? ct.color : null,
                  options: Object.keys(COLOR_MAP).map(k => ({ value: k, hex: COLOR_MAP[k] }))
                },
                confirmText: '保存',
                onConfirm: (v, color) => {
                  const ch = (v || '').trim().slice(0, 2);
                  Store.setCellText(deptId, p.id, d.ymd, ch, color);
                }
              });
            } else {
              Store.cycleCell(deptId, p.id, d.ymd, activeColor);
            }
          });
        }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }

    for (const row of buildStatRows(deptId, days)) tbody.appendChild(row);
    return tbody;
  }

  function computeSums(deptId, person, periodKey, days) {
    let paid = 0, restCount = 0;
    for (const d of days) {
      const st = Store.cellStatus(deptId, person.id, d.ymd);
      if (st === 'paidLeave') paid++;
      else if (st === 'contractRest') restCount++;
    }
    const contract = days.length >= 31 ? 9 : 8;
    return { paid, contract, restCount, remaining: (person.annualLeaveInit || 0) - paid };
  }

  function buildStatRows(deptId, days) {
    const out = [];
    const lineTotals = days.map(d => computeLineTotal(deptId, d.ymd));
    const absentTotals = days.map(d => computeAbsentTotal(deptId, d.ymd));
    const requireds = days.map(d => Store.requiredCount(deptId, d.ymd));
    const dispatches = days.map(d => Store.dispatchCount(deptId, d.ymd));

    // Row 1: 必要人数 (editable, default 22)
    const r1 = Render.el('tr.stat-row');
    r1.appendChild(Render.el('td.label', { colspan: 5 }, '必要人数'));
    const editing = Store.get().ui.editMode;
    for (let i = 0; i < days.length; i++) {
      const td = Render.el('td.required', { dataset: { ymd: days[i].ymd } });
      const input = Render.el('input', {
        type: 'number',
        min: '0',
        value: String(requireds[i]),
        readonly: editing ? null : true,
        onchange: editing ? (e) => Store.setRequired(deptId, days[i].ymd, e.target.value) : null,
        onfocus: (e) => e.target.select()
      });
      td.appendChild(input);
      r1.appendChild(td);
    }
    out.push(r1);

    // Row 2: ライン合計 (auto)
    const r2 = Render.el('tr.stat-row');
    r2.appendChild(Render.el('td.label', { colspan: 5 }, 'ライン合計'));
    for (let i = 0; i < days.length; i++) r2.appendChild(Render.el('td', { dataset: { ymd: days[i].ymd } }, String(lineTotals[i])));
    out.push(r2);

    // Row 3: 派遣短期 (手动输入,蓝色)
    // 派遣是排班时提前预约的,数字由人工填写。
    const r3 = Render.el('tr.stat-row');
    r3.appendChild(Render.el('td.label', { colspan: 5 }, '派遣短期'));
    // 跳焦工具(放在 buildStatRows 函数内,闭包捕获 days 引用)
    // preventScroll: true 关键 — 阻止 focus 触发 scrollIntoView,
    // 否则浏览器会把新 input 滚到视野中导致整个表格跳动,用户以为"没跳"。
    const focusWithoutScroll = (el) => {
      if (!el) return;
      el.focus({ preventScroll: true });
      try { el.select(); } catch (_) {}
    };
    // 静默更新 excess td(数据由 input 内 value 直接读,不依赖 Store 同步状态)
    const updateExcessTd = (ymd, dispatchVal) => {
      const lineTotal = computeLineTotal(deptId, ymd);
      const required = Store.requiredCount(deptId, ymd);
      const excess = lineTotal + dispatchVal - required;
      const excessTd = document.querySelector(`tr.stat-row td.excess[data-ymd="${ymd}"]`);
      if (excessTd) {
        excessTd.textContent = String(excess);
        excessTd.style.color = excess < 0 ? 'var(--danger)' : excess > 0 ? 'var(--muted)' : '';
      }
    };
    const jumpDispatch = (idx, currentInput, currentYmd) => {
      // 1. 先 silent 写入数据 + 同步更新 excess td (DOM 不重建,Store 与 input.value 同步)
      const cur = currentInput.value;
      if (cur !== String(Store.dispatchCount(deptId, currentYmd))) {
        Store.setDispatch(deptId, currentYmd, cur, true); // silent: 仅 persist,不 commit
        updateExcessTd(currentYmd, Number(cur) || 0);
      }
      // 2. 现在 focus 邻居 — 旧 input blur 时 onchange 触发,
      //    但 dedup 检测 input.value === Store 值,所以不再触发 commit → DOM 不动 → focus 保留
      if (idx >= 0 && idx < days.length) {
        focusWithoutScroll(document.querySelector(`tr.stat-row td.dispatch[data-ymd="${days[idx].ymd}"] input`));
      }
    };
    const jumpRequiredSameCol = (currentInput, currentYmd) => {
      // 同上:先 silent 写入,后 focus
      const cur = currentInput.value;
      if (cur !== String(Store.dispatchCount(deptId, currentYmd))) {
        Store.setDispatch(deptId, currentYmd, cur, true);
        updateExcessTd(currentYmd, Number(cur) || 0);
      }
      focusWithoutScroll(document.querySelector(`tr.stat-row td.required[data-ymd="${currentYmd}"] input`));
    };
    for (let i = 0; i < days.length; i++) {
      const td = Render.el('td.dispatch', { dataset: { ymd: days[i].ymd } });
      const idx = i;
      const ymdCur = days[i].ymd;
      const input = Render.el('input', {
        type: 'number',
        min: '0',
        value: String(dispatches[i]),
        readonly: editing ? null : true,
        // dedup:input 失焦时,如果 Store 值与 input.value 已经一致(silent 写过),不再触发 commit
        onchange: editing ? (e) => {
          const v = e.target.value;
          if (v !== String(Store.dispatchCount(deptId, ymdCur))) {
            Store.setDispatch(deptId, ymdCur, v);
          }
        } : null,
        onfocus: (e) => e.target.select(),
        onkeydown: editing ? (e) => {
          const k = e.key;
          if (k === 'Enter' || k === 'ArrowRight' || (k === 'Tab' && !e.shiftKey)) {
            e.preventDefault();
            jumpDispatch(idx + 1, e.target, ymdCur);
          } else if (k === 'ArrowLeft' || (k === 'Tab' && e.shiftKey)) {
            e.preventDefault();
            jumpDispatch(idx - 1, e.target, ymdCur);
          } else if (k === 'ArrowUp') {
            e.preventDefault();
            jumpRequiredSameCol(e.target, ymdCur);
          } else if (k === 'ArrowDown') {
            e.preventDefault();
          }
        } : null
      });
      td.appendChild(input);
      r3.appendChild(td);
    }
    out.push(r3);

    // Row 4: 過不足 = ライン合計 + 派遣短期 − 必要人数
    // 正数 = 人手多余 / 0 = 刚好 / 负数 = 人手不足(临时缺勤导致)
    const r4 = Render.el('tr.stat-row');
    r4.appendChild(Render.el('td.label', { colspan: 5 }, '過不足'));
    for (let i = 0; i < days.length; i++) {
      const excess = lineTotals[i] + dispatches[i] - requireds[i];
      const td = Render.el('td.excess', { dataset: { ymd: days[i].ymd } }, String(excess));
      if (excess < 0) td.style.color = 'var(--danger)';
      else if (excess > 0) td.style.color = 'var(--muted)';
      r4.appendChild(td);
    }
    out.push(r4);

    return out;
  }

  // 算作出勤的特殊文字(例如班次标记):「早」「晚」算上班,其他文字算休息
  const WORK_TEXTS = new Set(['早', '晚']);
  function computeLineTotal(deptId, ymd) {
    let total = 0;
    const periodKey = Store.get().ui.currentPeriod;
    for (const p of Store.peopleInPeriod(deptId, periodKey)) {
      if (Store.cellStatus(deptId, p.id, ymd) !== 'work') continue;
      const ct = Store.cellText(deptId, p.id, ymd);
      // 带自定义文字 + 非班次标记 → 视为休息,不算上班
      if (ct && ct.text && !WORK_TEXTS.has(ct.text)) continue;
      total++;
    }
    return total;
  }

  function computeAbsentTotal(deptId, ymd) {
    let total = 0;
    const periodKey = Store.get().ui.currentPeriod;
    for (const p of Store.peopleInPeriod(deptId, periodKey)) {
      if (Store.cellStatus(deptId, p.id, ymd) === 'absent') total++;
    }
    return total;
  }

  // ---- settings page ----
  function renderSettings() {
    const host = document.getElementById('page-settings');
    Render.clear(host);
    host.appendChild(buildDeptSection());
    host.appendChild(buildPeopleSection());
  }

        onchange: (e) => Store.renameDepartment(d.id, e.target.value || '未命名')
      });
      row.appendChild(nameInput);

        title: '必要人数默认值',
        onchange: (e) => Store.setDeptRequired(d.id, e.target.value)
      }));

      row.appendChild(Render.el('input.num', {

        value: String(d.printHeightMm != null ? d.printHeightMm : 192),

      showConfirmPopover(addDeptBtn, {

          const name = (v || '').trim();

        }
