  function buildBody(days, todayYmd) {
    const tbody = Render.el('tbody');
    const deptId = Store.get().ui.currentDept;
    const periodKey = Store.get().ui.currentPeriod;
    const people = Store.peopleInPeriod(deptId, periodKey);

    if (people.length === 0) {
      tbody.appendChild(Render.el('tr',
        Render.el('td', { colspan: 5 + days.length, style: { padding: '12px', color: 'var(--muted)', textAlign: 'center' } },
          '本部门暂无人员，请到「⚙ 设置」添加')));
      return tbody;
    }

    for (const p of people) {
      const tr = Render.el('tr', { dataset: { personId: p.id } });
      tr.appendChild(Render.el('td.role-col', p.role || ''));
      // 名字过长时自动缩字号完全显示 —— 按"当前氏名列宽"算(含手动调过的宽度),屏幕 + 打印都生效。
      // 文字宽 ≈ widthUnits × fontSize(全角 1em、半角 0.5em),故 fontSize ≤ 可用宽 / widthUnits。
      const nameTd = Render.el('td.name-col', { onclick: () => toggleRow(p.id) }, p.name || '');
      const nameStr = p.name || '';
      let widthUnits = 0; // 1 全角 = 1, 半角/空格 = 0.5
      for (const ch of nameStr) widthUnits += /[一-鿿぀-ゟ゠-ヿ]/.test(ch) ? 1 : 0.5;
      if (widthUnits > 0) {
        const szs = Store.get().sizes || {};
        const colNamePx = szs['col-name'] != null ? szs['col-name'] : 130; // 当前氏名列宽(px)
        // 屏幕:默认 11px 放不下就缩到刚好(留 10px 给左 padding + 安全),下限 6px。
        const screenAvail = colNamePx - 10;
        if (screenAvail / widthUnits < 11) {
          nameTd.style.fontSize = Math.max(6, screenAvail / widthUnits).toFixed(1) + 'px';
        }
        // 打印:列宽自定义时打印列=同一 px,上限用 px;未自定义时打印列=30mm,上限用 mm。
        // --name-cap 被 @media print 的 min(row-h*0.5, name-cap) 读取,自动只在过长时压字号。
        const printCap = szs['col-name'] != null
          ? Math.max(6, (colNamePx - 8) / widthUnits).toFixed(1) + 'px'
          : (26 / widthUnits).toFixed(2) + 'mm'; // 30mm 列 - 4mm padding/safety
        nameTd.style.setProperty('--name-cap', printCap);
      }
      // 行高拖拽手柄 — 名字 td 底部 6px 拖拽区,改写 row-person(所有人员行统一)
      const rowHandle = Render.el('span.row-resize-handle', { title: '拖动调整所有人员行高(统一),双击重置' });
      wireResize(rowHandle, 'row-person', 'y', 'table.schedule tbody tr:not(.stat-row) > td.name-col');
      nameTd.appendChild(rowHandle);
      tr.appendChild(nameTd);

      const sums = computeSums(deptId, p, periodKey, days);
      tr.appendChild(Render.el('td.sum-col', { dataset: { sum: 'paid' } }, String(sums.paid)));
      const contractTd = Render.el('td.sum-col', { dataset: { sum: 'contract' } }, String(sums.contract));
      if (sums.restCount > sums.contract) contractTd.classList.add('over');
      else if (sums.restCount < sums.contract) contractTd.classList.add('under');
      tr.appendChild(contractTd);
      tr.appendChild(Render.el('td.sum-col', { dataset: { sum: 'remain' } }, sums.remaining == null ? '—' : String(sums.remaining)));

      for (const d of days) {
        const st = Store.cellStatus(deptId, p.id, d.ymd);
        const td = Render.el('td.day-cell', { dataset: { person: p.id, ymd: d.ymd } });
        // 视觉(状态 class + 字符 + 颜色)由共享函数填充,与 patchDayCell 完全一致
        applyDayCellVisual(td, deptId, p.id, d.ymd);
        const isDerivedRetired = st === 'retired' && p.retiredOn && d.ymd >= p.retiredOn;
        if (!isDerivedRetired) {
          td.addEventListener('click', () => {
            if (!Store.get().ui.editMode) return;
            focusedCell = { personId: p.id, ymd: d.ymd };
            // 文字工具激活 → 弹 popover 输入字符 + 选颜色(走全量重渲,低频);否则正常状态循环
            if (activeTool === 'text') {
              const ct = Store.cellText(deptId, p.id, d.ymd);
              showConfirmPopover(td, {
                text: '单元格文字',
                sub: '输入字符 + 选颜色(留空=清除)',
                input: { type: 'text', value: ct ? ct.text : '', placeholder: '一个字符' },
                swatches: {
                  initial: ct ? ct.color : null,
                  options: Object.keys(COLOR_MAP).map(k => ({ value: k, hex: COLOR_MAP[k] }))
                },
                confirmText: '保存',
                onConfirm: (v, color) => {
                  const ch = (v || '').trim().slice(0, 2);
                  Store.setCellText(deptId, p.id, d.ymd, ch, color);
                }
              });
            } else {
              // 静默改 store + 只局部更新受影响的格子 → 不重建整表(手机端流畅关键)
              Store.cycleCell(deptId, p.id, d.ymd, activeColor, true);
              patchDayCell(deptId, p.id, d.ymd);
              applyFocus();
            }
          });
        }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }

    for (const row of buildStatRows(deptId, days)) tbody.appendChild(row);
    return tbody;
  }

  // 年度有休窗口 + 残量计算
  // 窗口 = [resetMonth/1 of startYear, last day of (resetMonth-1)/next year]
  // 残 = (本年度基数 + 前年残留) − 本窗口已用
  // 前年残留 = max(0, 前年基数 − 前年使用),向上叠加(实质上把所有过去未用 quota 全计入)
  function annualLeaveWindow(person, asOf) {
    const resetMonth = Number(person.leaveResetMonth) || 3;
    const m = asOf.getMonth() + 1;
    const y = asOf.getFullYear();
    const startYear = m >= resetMonth ? y : y - 1;
    const winStart = new Date(startYear, resetMonth - 1, 1);
    const winEnd = new Date(startYear + 1, resetMonth - 1, 0);
    return { winStart, winEnd, resetMonth, startYear };
  }
  // 自动按入职日 + 重置月计算年度有休基数(日本有给法定简化版)。
  // 规则:
  //   - 入职后未满 6 个月 → 0 天(无有休)
  //   - 满 6 个月 → 10 天
  //   - 之后每过 1 个「重置月 1 日」+1,上限 20 天
  // 没有 addedOn 时回退到 person.annualLeave 字段(向后兼容旧数据)。
  function effectiveAnnualLeave(person, asOf) {
    // 标记为无有休 → null(区别于 0「不满 6 个月」)
    if (person.noAnnualLeave) return null;
    const resetMonth = Number(person.leaveResetMonth) || 3;
    if (!person.addedOn) return Number(person.annualLeave) || 20;
    const added = Util.parseYmd(person.addedOn);
    if (!added || isNaN(added)) return Number(person.annualLeave) || 20;
    // 6 个月生效起点(JS Date 自动处理月份溢出)
    const effectiveStart = new Date(added.getFullYear(), added.getMonth() + 6, added.getDate());
    if (asOf < effectiveStart) return 0;
    const m = resetMonth - 1; // 0-indexed
    // 从 effectiveStart 严格之后的第一个重置月 1 日开始计数
    let firstY = effectiveStart.getFullYear();
    if (new Date(firstY, m, 1) <= effectiveStart) firstY++;
    let count = 0;
    for (let Y = firstY; new Date(Y, m, 1) <= asOf; Y++) count++;
    return Math.min(10 + count, 20);
  }
  // 有休制度起算年:2025 年度(覆盖 2025 重置月 → 2026 重置月前一日)。
  // 之前的窗口不视为「上一年度」→ 不结转。这意味着 2025 年度的 carryover = 0,
  // 2026 年度才能继承 2025 的残留(若有)。
  const LEAVE_START_YEAR = 2025;
  function computeAnnualLeave(deptId, person, asOf) {
    const baseQuota = effectiveAnnualLeave(person, asOf);
    const { winStart, winEnd, resetMonth, startYear } = annualLeaveWindow(person, asOf);
    // 无有休资格 → 直接返回 null 标记
    if (baseQuota === null) {
      return { winStart, winEnd, baseQuota: null, carryover: 0, totalQuota: null, used: 0, remaining: null, noLeave: true, asOf };
    }
    // 仅当上一窗口属于 LEAVE_START_YEAR 及之后时才结转
    let carryover = 0;
    if (startYear > LEAVE_START_YEAR) {
      const prevWinStart = new Date(startYear - 1, resetMonth - 1, 1);
      const prevWinEnd = new Date(startYear, resetMonth - 1, 0);
      const prevBaseQuota = effectiveAnnualLeave(person, prevWinEnd);
      // 上年也无有休 → 0 结转
      const prevUsed = Store.paidLeaveDaysInRange(deptId, person.id, Util.ymd(prevWinStart), Util.ymd(prevWinEnd));
      carryover = prevBaseQuota === null ? 0 : Math.max(0, prevBaseQuota - prevUsed);
    }
    const totalQuota = baseQuota + carryover;
    const cutoffDate = asOf < winEnd ? asOf : winEnd;
    const used = Store.paidLeaveDaysInRange(deptId, person.id, Util.ymd(winStart), Util.ymd(cutoffDate));
    const remaining = Math.max(0, totalQuota - used);
    return { winStart, winEnd, baseQuota, carryover, totalQuota, used, remaining, asOf: cutoffDate };
  }
  function computeSums(deptId, person, periodKey, days) {
    let paid = 0, restCount = 0;
    for (const d of days) {
      const st = Store.cellStatus(deptId, person.id, d.ymd);
      if (st === 'paidLeave') paid++;
      else if (st === 'contractRest') restCount++;
    }
    const contract = days.length >= 31 ? 9 : 8;
    // 残:基于当前查看周期的截止日,按 年度有休 + 前年残留 − 已用 计算
    const asOf = Util.parseYmd(days[days.length - 1].ymd);
    const annual = computeAnnualLeave(deptId, person, asOf);
    return { paid, contract, restCount, remaining: annual.remaining, annualInfo: annual };
  }

  function buildStatRows(deptId, days) {
    const out = [];
    const lineTotals = days.map(d => computeLineTotal(deptId, d.ymd));
    const absentTotals = days.map(d => computeAbsentTotal(deptId, d.ymd));
    const requireds = days.map(d => Store.requiredCount(deptId, d.ymd));
    const dispatches = days.map(d => Store.dispatchCount(deptId, d.ymd));

    // Stat 行 label td 加行高拖拽 handle:4 行共享 row-stat key,拖任意一个都改 --row-stat-h
    const addStatRowHandle = (labelTd) => {
      const handle = Render.el('span.row-resize-handle', { title: '拖动调整 stat 4 行高(统一),双击重置' });
      wireResize(handle, 'row-stat', 'y', 'table.schedule tbody tr.stat-row > td.label');
      labelTd.appendChild(handle);
    };
    // 生成 stat 行的 5 个固定列前缀:役職空 / 氏名含 label(sticky 锚点) / 3 个 sum 空。
    // 之前用 colspan:5 把 label 一格横跨 5 列,但用户要求 label 仅落在氏名列且固定。
    // 拆成 5 个独立 td 后 label 用 td.name-col.label class,在 mobile 上自动继承 name-col 的 sticky 行为。
    const buildStatLeading = (labelText) => {
      const cells = [];
      cells.push(Render.el('td.role-col'));                          // 役職:空
      const labelTd = Render.el('td.name-col.label', labelText);     // 氏名:label(sticky 在此)
      addStatRowHandle(labelTd);
      cells.push(labelTd);
      cells.push(Render.el('td.sum-col'));                           // 有休:空
      cells.push(Render.el('td.sum-col'));                           // 契休:空
      cells.push(Render.el('td.sum-col'));                           // 残:空
      return cells;
    };

    // Row 1: 必要人数 (editable, default 22)
    const r1 = Render.el('tr.stat-row');
    buildStatLeading('必要人数').forEach(c => r1.appendChild(c));
    const editing = Store.get().ui.editMode;
    for (let i = 0; i < days.length; i++) {
      const td = Render.el('td.required', { dataset: { ymd: days[i].ymd } });
      const input = Render.el('input', {
        type: 'number',
        min: '0',
        value: String(requireds[i]),
        readonly: editing ? null : true,
        onchange: editing ? (e) => Store.setRequired(deptId, days[i].ymd, e.target.value) : null,
        onfocus: (e) => e.target.select()
      });
      td.appendChild(input);
      r1.appendChild(td);
    }
    out.push(r1);

    // Row 2: ライン合計 (auto)
    const r2 = Render.el('tr.stat-row');
    buildStatLeading('ライン合計').forEach(c => r2.appendChild(c));
    for (let i = 0; i < days.length; i++) r2.appendChild(Render.el('td.linetotal', { dataset: { ymd: days[i].ymd } }, String(lineTotals[i])));
    out.push(r2);

    // Row 3: 派遣短期 (手动输入,蓝色)
    // 派遣是排班时提前预约的,数字由人工填写。
    const r3 = Render.el('tr.stat-row');
    buildStatLeading('派遣短期').forEach(c => r3.appendChild(c));
    // 跳焦工具(放在 buildStatRows 函数内,闭包捕获 days 引用)
    // preventScroll: true 关键 — 阻止 focus 触发 scrollIntoView,
    // 否则浏览器会把新 input 滚到视野中导致整个表格跳动,用户以为"没跳"。
    const focusWithoutScroll = (el) => {
      if (!el) return;
      el.focus({ preventScroll: true });
      try { el.select(); } catch (_) {}
    };
    // 静默更新 excess td(数据由 input 内 value 直接读,不依赖 Store 同步状态)
    const updateExcessTd = (ymd, dispatchVal) => {
      const lineTotal = computeLineTotal(deptId, ymd);
      const required = Store.requiredCount(deptId, ymd);
      const excess = lineTotal + dispatchVal - required;
      const excessTd = document.querySelector(`tr.stat-row td.excess[data-ymd="${ymd}"]`);
      if (excessTd) {
        excessTd.textContent = String(excess);
        excessTd.style.color = excess < 0 ? 'var(--danger)' : excess > 0 ? 'var(--muted)' : '';
      }
    };
    const jumpDispatch = (idx, currentInput, currentYmd) => {
      // 1. 先 silent 写入数据 + 同步更新 excess td (DOM 不重建,Store 与 input.value 同步)
      const cur = currentInput.value;
      if (cur !== String(Store.dispatchCount(deptId, currentYmd))) {
        Store.setDispatch(deptId, currentYmd, cur, true); // silent: 仅 persist,不 commit
        updateExcessTd(currentYmd, Number(cur) || 0);
      }
      // 2. 现在 focus 邻居 — 旧 input blur 时 onchange 触发,
      //    但 dedup 检测 input.value === Store 值,所以不再触发 commit → DOM 不动 → focus 保留
      if (idx >= 0 && idx < days.length) {
        focusWithoutScroll(document.querySelector(`tr.stat-row td.dispatch[data-ymd="${days[idx].ymd}"] input`));
      }
    };
    const jumpRequiredSameCol = (currentInput, currentYmd) => {
      // 同上:先 silent 写入,后 focus
      const cur = currentInput.value;
      if (cur !== String(Store.dispatchCount(deptId, currentYmd))) {
        Store.setDispatch(deptId, currentYmd, cur, true);
        updateExcessTd(currentYmd, Number(cur) || 0);
      }
      focusWithoutScroll(document.querySelector(`tr.stat-row td.required[data-ymd="${currentYmd}"] input`));
    };
    for (let i = 0; i < days.length; i++) {
      const td = Render.el('td.dispatch', { dataset: { ymd: days[i].ymd } });
      const idx = i;
      const ymdCur = days[i].ymd;
      const input = Render.el('input', {
        type: 'number',
        min: '0',
        value: String(dispatches[i]),
        readonly: editing ? null : true,
        // dedup:input 失焦时,如果 Store 值与 input.value 已经一致(silent 写过),不再触发 commit
        onchange: editing ? (e) => {
          const v = e.target.value;
          if (v !== String(Store.dispatchCount(deptId, ymdCur))) {
            Store.setDispatch(deptId, ymdCur, v);
          }
        } : null,
        onfocus: (e) => e.target.select(),
        onkeydown: editing ? (e) => {
          const k = e.key;
          if (k === 'Enter' || k === 'ArrowRight' || (k === 'Tab' && !e.shiftKey)) {
            e.preventDefault();
            jumpDispatch(idx + 1, e.target, ymdCur);
          } else if (k === 'ArrowLeft' || (k === 'Tab' && e.shiftKey)) {
            e.preventDefault();
            jumpDispatch(idx - 1, e.target, ymdCur);
          } else if (k === 'ArrowUp') {
            e.preventDefault();
            jumpRequiredSameCol(e.target, ymdCur);
          } else if (k === 'ArrowDown') {
            e.preventDefault();
          }
        } : null
      });
      td.appendChild(input);
      r3.appendChild(td);
    }
    out.push(r3);

    // Row 4: 過不足 = ライン合計 + 派遣短期 − 必要人数
    // 正数 = 人手多余 / 0 = 刚好 / 负数 = 人手不足(临时缺勤导致)
    const r4 = Render.el('tr.stat-row');
    buildStatLeading('過不足').forEach(c => r4.appendChild(c));
    for (let i = 0; i < days.length; i++) {
      const excess = lineTotals[i] + dispatches[i] - requireds[i];
      const td = Render.el('td.excess', { dataset: { ymd: days[i].ymd } }, String(excess));
      if (excess < 0) td.style.color = 'var(--danger)';
      else if (excess > 0) td.style.color = 'var(--muted)';
      r4.appendChild(td);
    }
    out.push(r4);

    return out;
  }

  // 算作出勤的特殊文字(例如班次标记):「早」「晚」算上班,其他文字算休息
  const WORK_TEXTS = new Set(['早', '晚']);
  function computeLineTotal(deptId, ymd) {
    let total = 0;
    const periodKey = Store.get().ui.currentPeriod;
    for (const p of Store.peopleInPeriod(deptId, periodKey)) {
      if (Store.cellStatus(deptId, p.id, ymd) !== 'work') continue;
      const ct = Store.cellText(deptId, p.id, ymd);
      // 带自定义文字 + 非班次标记 → 视为休息,不算上班
      if (ct && ct.text && !WORK_TEXTS.has(ct.text)) continue;
      total++;
    }
    return total;
  }

  function computeAbsentTotal(deptId, ymd) {
    let total = 0;
    const periodKey = Store.get().ui.currentPeriod;
    for (const p of Store.peopleInPeriod(deptId, periodKey)) {
      if (Store.cellStatus(deptId, p.id, ymd) === 'absent') total++;
    }
    return total;
  }

  // ---- settings page ----
  function renderSettings() {
    const host = document.getElementById('page-settings');
    Render.clear(host);
    host.appendChild(buildDeptSection());
    host.appendChild(buildSizesSection());
    host.appendChild(buildPeopleSection());
  }

  // 单元格尺寸 section:8 个 px 数值输入框,精确调整,可补充拖拽手柄之外的精度控制。
  // 与拖拽共享 Store.setSize/resetSize,所以调任何一处另一处立即同步。
  function buildSizesSection() {
    const sec = Render.el('div.settings-section');
    sec.appendChild(Render.el('h2', '单元格尺寸'));
    sec.appendChild(Render.el('div', { style: { color: 'var(--muted)', fontSize: '12px', marginBottom: '8px' } },
      '直接输入 px 值,或在排班表头/行底部拖动手柄。调一次屏幕+打印同步。空值=用默认。'));
    const items = [
      { key: 'col-role',        label: '役職列宽',  defaultPx: 60,  unit: 'px' },
      { key: 'col-name',        label: '氏名列宽',  defaultPx: 130, unit: 'px' },
      { key: 'col-sum-paid',    label: '有休列宽',  defaultPx: 36,  unit: 'px' },
      { key: 'col-sum-contract',label: '契休列宽',  defaultPx: 36,  unit: 'px' },
      { key: 'col-sum-remain',  label: '残列宽',    defaultPx: 36,  unit: 'px' },
      { key: 'col-day',         label: '日期列宽',  defaultPx: 27,  unit: 'px' },
      { key: 'row-person',      label: '人员行高',  defaultPx: 25,  unit: 'px' },
      { key: 'row-stat',        label: 'Stat 行高', defaultPx: 25,  unit: 'px' },
    ];
    const sizes = Store.get().sizes || {};
    for (const it of items) {
      const row = Render.el('div.settings-row');
      row.appendChild(Render.el('span', { style: { minWidth: '90px', color: 'var(--muted)' } }, it.label + ':'));
      const cur = sizes[it.key];
      const input = Render.el('input.size-input', {
        // type:text + inputmode:numeric:iOS Safari 上 type=number 光标无法移动,改成 text 保留正常文本编辑
        type: 'text',
        inputmode: 'numeric',
        value: cur != null ? String(cur) : '',
        placeholder: String(it.defaultPx),
        title: '空值=使用默认 ' + it.defaultPx + 'px',
        onchange: (e) => {
          const v = e.target.value.trim();
          if (v === '') Store.resetSize(it.key);
          else Store.setSize(it.key, v);
        }
      });
      row.appendChild(input);
      row.appendChild(Render.el('span', { style: { color: 'var(--muted)', fontSize: '11px' } }, it.unit));
      row.appendChild(Render.el('span.grow'));
      const resetBtn = Render.el('button', { title: '恢复默认' }, '重置');
      resetBtn.addEventListener('click', () => Store.resetSize(it.key));
      row.appendChild(resetBtn);
      sec.appendChild(row);
    }
    return sec;
  }

  function buildDeptSection() {
    const sec = Render.el('div.settings-section');
    sec.appendChild(Render.el('h2', '部门'));
    const list = Render.el('div.settings-sub-depts');
    for (const d of Store.get().departments) {
      const row = Render.el('div.settings-row.dept-row', {
        dataset: { deptid: d.id },
        draggable: 'true'
      });
      row.appendChild(Render.el('span.drag-handle', { title: '拖动重排序部门' }, '⋮⋮'));
      const nameInput = Render.el('input.name-input', {
        value: d.name,
        onchange: (e) => Store.renameDepartment(d.id, e.target.value || '未命名')
      });
      row.appendChild(nameInput);
      row.appendChild(Render.el('span', { style: { color: 'var(--muted)' } }, '必要人数:'));
      row.appendChild(Render.el('input.num', {
        type: 'number', min: '0',
        value: String(d.requiredCount != null ? d.requiredCount : 22),
        title: '必要人数默认值',
        onchange: (e) => Store.setDeptRequired(d.id, e.target.value)
      }));
      row.appendChild(Render.el('span.grow'));
      const delDeptBtn = Render.el('button.danger', {}, '删除');
      delDeptBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        showConfirmPopover(delDeptBtn, {
          text: `删除部门「${d.name}」?`,
          sub: '该部门下所有人员与排班将一并删除',
          confirmText: '删除',
          danger: true,
          onConfirm: () => Store.removeDepartment(d.id)
        });
      });
      row.appendChild(delDeptBtn);
      list.appendChild(row);
    }
    wireDeptsDragDrop(list);
    sec.appendChild(list);
    const addRow = Render.el('div.settings-row');
    const addDeptBtn = Render.el('button.primary', {}, '+ 新增部门');
    addDeptBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      showConfirmPopover(addDeptBtn, {
        text: '新增部门',
        sub: '输入部门名称',
        input: { type: 'text', placeholder: '部门名称' },
        confirmText: '添加',
        onConfirm: (v) => {
          const name = (v || '').trim();
          if (name) Store.addDepartment(name);
        }
      });
    });
    addRow.appendChild(addDeptBtn);
    sec.appendChild(addRow);
    return sec;
  }

  function buildPeopleSection() {
    const sec = Render.el('div.settings-section');
    sec.appendChild(Render.el('h2', '人员'));
    for (const d of Store.get().departments) {
      sec.appendChild(Render.el('div', { style: { marginTop: '10px', fontWeight: '600' } }, d.name));
      const sub = Render.el('div.settings-sub-people', { dataset: { deptid: d.id } });
      // 过滤掉已软删除的人员(removedOn 已设置)。他们的历史排班仍保留在过去周期中,
      // 但不在设置名单里出现。这与「删除」按钮的语义一致。
      for (const p of Store.people(d.id).filter(p => !p.removedOn)) {
        sub.appendChild(buildPersonRow(d.id, p));
      }
      sub.appendChild(buildPersonAddRow(d.id));
      wirePeopleDragDrop(sub, d.id);
      sec.appendChild(sub);
    }
    return sec;
  }

  // 同部门内人员行拖动重排序。仅在 sub 容器内部生效(跨部门请用部门下拉=transfer)。
  // 选择器 .settings-row[data-pid] 过滤掉「+ 新增」行,确保新增行不参与拖放。
  // 边界自动滚动:鼠标拖到视口顶/底 80px 内时,RAF 循环持续滚动页面,
  // 让用户能拖到当前视口外的位置(HTML5 drag-and-drop 默认不会自动滚动)。
  function wirePeopleDragDrop(container, deptId) {
    let draggingPid = null;
    let lastClientY = 0;
    let scrollRafId = null;
    const SCROLL_ZONE = 80; // px,距视口顶/底多远开始滚动
    const SCROLL_SPEED = 14; // px/frame
    const clearIndicators = () => {
      container.querySelectorAll('.drop-before, .drop-after').forEach(el => {
        el.classList.remove('drop-before', 'drop-after');
      });
    };
    // 全局 dragover 跟踪鼠标 Y(原 container dragover 只在容器内触发,鼠标移到边缘时不更新)
    const trackY = (e) => { lastClientY = e.clientY; };
    const scrollTick = () => {
      if (!draggingPid) { scrollRafId = null; return; }
      const h = window.innerHeight;
      if (lastClientY > 0 && lastClientY < SCROLL_ZONE) {
        window.scrollBy(0, -SCROLL_SPEED);
      } else if (lastClientY > h - SCROLL_ZONE) {
        window.scrollBy(0, SCROLL_SPEED);
      }
      scrollRafId = requestAnimationFrame(scrollTick);
    };
    const startAutoScroll = () => { if (!scrollRafId) scrollRafId = requestAnimationFrame(scrollTick); };
    const stopAutoScroll = () => {
      if (scrollRafId) cancelAnimationFrame(scrollRafId);
      scrollRafId = null;
      document.removeEventListener('dragover', trackY);
    };
    container.addEventListener('dragstart', (e) => {
      const row = e.target.closest('.settings-row[data-pid]');
      if (!row) return;
      draggingPid = row.dataset.pid;
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', row.dataset.pid);
      lastClientY = e.clientY;
      document.addEventListener('dragover', trackY);
      startAutoScroll();
    });
    container.addEventListener('dragover', (e) => {
      if (!draggingPid) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      clearIndicators();
      const targetRow = e.target.closest('.settings-row[data-pid]');
      if (!targetRow || targetRow.dataset.pid === draggingPid) return;
      const rect = targetRow.getBoundingClientRect();
      const before = e.clientY < rect.top + rect.height / 2;
      targetRow.classList.add(before ? 'drop-before' : 'drop-after');
    });
    container.addEventListener('dragleave', (e) => {
      // 鼠标离开整个 sub 容器时才清提示(避免在子元素间移动时闪烁)
      if (!container.contains(e.relatedTarget)) clearIndicators();
    });
    container.addEventListener('drop', (e) => {
      e.preventDefault();
      if (!draggingPid) return;
      const targetRow = e.target.closest('.settings-row[data-pid]');
      clearIndicators();
      if (targetRow && targetRow.dataset.pid !== draggingPid) {
        const rect = targetRow.getBoundingClientRect();
        const before = e.clientY < rect.top + rect.height / 2;
        Store.reorderPerson(deptId, draggingPid, targetRow.dataset.pid, before);
        // commit('people') 会触发整页重渲染,后续 dragend 可能落在已被替换的 DOM 上,无影响
      }
      draggingPid = null;
      stopAutoScroll();
    });
    container.addEventListener('dragend', () => {
      container.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
      clearIndicators();
      draggingPid = null;
      stopAutoScroll();
    });
  }

  // 部门列表拖拽换位 — 与 wirePeopleDragDrop 结构一致,只是数据维度从 person 换成 department。
  function wireDeptsDragDrop(container) {
    let draggingId = null;
    let lastClientY = 0;
    let scrollRafId = null;
    const SCROLL_ZONE = 80;
    const SCROLL_SPEED = 14;
    const clearIndicators = () => {
      container.querySelectorAll('.drop-before, .drop-after').forEach(el => {
        el.classList.remove('drop-before', 'drop-after');
      });
    };
    const trackY = (e) => { lastClientY = e.clientY; };
    const scrollTick = () => {
      if (!draggingId) { scrollRafId = null; return; }
      const h = window.innerHeight;
      if (lastClientY > 0 && lastClientY < SCROLL_ZONE) window.scrollBy(0, -SCROLL_SPEED);
      else if (lastClientY > h - SCROLL_ZONE) window.scrollBy(0, SCROLL_SPEED);
      scrollRafId = requestAnimationFrame(scrollTick);
    };
    const startAutoScroll = () => { if (!scrollRafId) scrollRafId = requestAnimationFrame(scrollTick); };
    const stopAutoScroll = () => {
      if (scrollRafId) cancelAnimationFrame(scrollRafId);
      scrollRafId = null;
      document.removeEventListener('dragover', trackY);
    };
    container.addEventListener('dragstart', (e) => {
      const row = e.target.closest('.settings-row[data-deptid]');
      if (!row) return;
      draggingId = row.dataset.deptid;
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', row.dataset.deptid);
      lastClientY = e.clientY;
      document.addEventListener('dragover', trackY);
      startAutoScroll();
    });
    container.addEventListener('dragover', (e) => {
      if (!draggingId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      clearIndicators();
      const targetRow = e.target.closest('.settings-row[data-deptid]');
      if (!targetRow || targetRow.dataset.deptid === draggingId) return;
      const rect = targetRow.getBoundingClientRect();
      const before = e.clientY < rect.top + rect.height / 2;
      targetRow.classList.add(before ? 'drop-before' : 'drop-after');
    });
    container.addEventListener('dragleave', (e) => {
      if (!container.contains(e.relatedTarget)) clearIndicators();
    });
    container.addEventListener('drop', (e) => {
      e.preventDefault();
      if (!draggingId) return;
      const targetRow = e.target.closest('.settings-row[data-deptid]');
      clearIndicators();
      if (targetRow && targetRow.dataset.deptid !== draggingId) {
        const rect = targetRow.getBoundingClientRect();
        const before = e.clientY < rect.top + rect.height / 2;
        Store.reorderDepartment(draggingId, targetRow.dataset.deptid, before);
      }
      draggingId = null;
      stopAutoScroll();
    });
    container.addEventListener('dragend', () => {
      container.querySelectorAll('.dragging').forEach(el => el.classList.remove('dragging'));
      clearIndicators();
      draggingId = null;
      stopAutoScroll();
    });
  }

  function buildPersonRow(deptId, p) {
    const row = Render.el('div.settings-row', { dataset: { pid: p.id }, draggable: 'true' });
    // 拖拽手柄 — 仅作为视觉提示。整行 draggable=true 已让任意空白处都能触发拖拽,
    // 输入框/按钮自身的点击事件不受影响(浏览器默认让 input 元素消耗 mousedown)。
    row.appendChild(Render.el('span.drag-handle', { title: '拖动重排序' }, '⋮⋮'));
    row.appendChild(Render.el('input.role-input', {
      placeholder: '役職', value: p.role || '',
      onchange: (e) => Store.updatePerson(deptId, p.id, { role: e.target.value })
    }));
    row.appendChild(Render.el('input.name-input', {
      placeholder: '氏名', value: p.name || '',
      onchange: (e) => Store.updatePerson(deptId, p.id, { name: e.target.value })
    }));
    // 年度有休 — 自动按入职日 + 重置月计算;noAnnualLeave 勾上则显示「—」
    row.appendChild(Render.el('span', { style: { color: 'var(--muted)' } }, '年度有休:'));
    const autoLeave = effectiveAnnualLeave(p, new Date());
    const leaveDisplay = Render.el('input.num.leave-display', {
      type: 'text',
      value: autoLeave == null ? '—' : String(autoLeave),
      readonly: 'readonly', disabled: 'disabled',
      title: '自动按入职日 + 重置月计算:起点 10 天,每过 1 个重置月 +1,上限 20 天。勾选「无有休」则显示 —',
      style: { opacity: '0.7', cursor: 'not-allowed', textAlign: 'center' }
    });
    row.appendChild(leaveDisplay);
    // 无有休 复选框 — silent 持久化,避免触发整页重渲(checkbox 焦点丢失 + 滚动跳)
    const noLeaveLabel = Render.el('label.no-leave-cb', { title: '勾选 = 该人员无年度有休资格,主表「残」和工时「有休残」显示 —' });
    const noLeaveCb = Render.el('input', {
      type: 'checkbox',
      checked: !!p.noAnnualLeave,
      onchange: (e) => {
        Store.updatePerson(deptId, p.id, { noAnnualLeave: !!e.target.checked }, true);
        // 手动同步旁边的「年度有休」只读显示(因为 silent 不会重渲)
        const updated = Store.findPersonById(p.id)?.person;
        if (updated) {
          const v = effectiveAnnualLeave(updated, new Date());
          leaveDisplay.value = v == null ? '—' : String(v);
        }
      }
    });
    noLeaveLabel.appendChild(noLeaveCb);
    noLeaveLabel.appendChild(Render.el('span', '无有休'));
    row.appendChild(noLeaveLabel);
    row.appendChild(Render.el('span', { style: { color: 'var(--muted)' } }, '重置月:'));
    row.appendChild(Render.el('input.num', {
      type: 'number', min: '1', max: '12', value: String(p.leaveResetMonth || 3),
      onchange: (e) => {
        const v = Math.max(1, Math.min(12, parseInt(e.target.value, 10) || 3));
        Store.updatePerson(deptId, p.id, { leaveResetMonth: v });
      }
    }));
    // 入职 / 调岗 / 离职日期 — 影响该人员在哪些周期显示
    //   入职(addedOn):公司层面的入职日,不随调岗变化,用于年度有休计算
    //   调岗(transferredOn):本部门入职日,该日之前不在本部门列表里显示
    //   离职(retiredOn):离职日,该日当天起不显示
    // silent=true: 只持久化、不触发整页重渲染,避免日期输入框被销毁(焦点丢失 + 滚动跳)
    row.appendChild(Render.el('span', { style: { color: 'var(--muted)' } }, '入职:'));
    row.appendChild(Render.el('input.date-input', {
      type: 'date', value: p.addedOn || '',
      title: '入职日(公司层面,不随调岗变化)',
      onchange: (e) => Store.updatePerson(deptId, p.id, { addedOn: e.target.value || null }, true)
    }));
    row.appendChild(Render.el('span', { style: { color: 'var(--muted)' } }, '调岗:'));
    row.appendChild(Render.el('input.date-input', {
      type: 'date', value: p.transferredOn || '',
      title: '调岗日(本部门入职日。留空=自始在本部门)',
      onchange: (e) => Store.updatePerson(deptId, p.id, { transferredOn: e.target.value || null }, true)
    }));
    row.appendChild(Render.el('span', { style: { color: 'var(--muted)' } }, '离职:'));
    row.appendChild(Render.el('input.date-input', {
      type: 'date', value: p.retiredOn || '',
      title: '离职日(留空=在职)',
      onchange: (e) => Store.updatePerson(deptId, p.id, { retiredOn: e.target.value || null }, true)
    }));
    // 部门下拉:选其他部门即调部门(原部门保留历史,新部门从今天起入职)
    row.appendChild(Render.el('span', { style: { color: 'var(--muted)' } }, '部门:'));
    const deptSelect = Render.el('select.person-dept');
    for (const d of Store.get().departments) {
      deptSelect.appendChild(Render.el('option', { value: d.id }, d.name));
    }
    deptSelect.value = deptId;
    deptSelect.addEventListener('change', (e) => {
      const newDeptId = e.target.value;
      if (newDeptId === deptId) return;
      const newDept = Store.get().departments.find(d => d.id === newDeptId);
      showConfirmPopover(deptSelect, {
        text: `调到「${newDept.name}」?`,
        sub: `${p.name || '该人员'} · 原部门历史保留`,
        confirmText: '调动',
        onConfirm: () => Store.transferPerson(deptId, p.id, newDeptId),
        onCancel: () => { deptSelect.value = deptId; }  // 取消时还原 select 显示
      });
    });
    row.appendChild(deptSelect);

    row.appendChild(Render.el('span.grow'));

    // 删除按钮:软删除(从当前周期起隐藏,之前周期保留)
    const delBtn = Render.el('button.danger', {
      title: '从名单中删除(之前周期的出勤记录保留)'
    }, '删除');
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      showConfirmPopover(delBtn, {
        text: `删除 ${p.name || '该人员'}?`,
        sub: '之前周期的出勤记录保留',
        confirmText: '删除',
        danger: true,
        onConfirm: () => Store.removePerson(deptId, p.id)
      });
    });
    row.appendChild(delBtn);
    return row;
  }

  // 通用行内确认弹层。anchor 是触发按钮,popover 定位在它上方(空间不足时翻到下方)。
  // opts: { text, sub, confirmText, cancelText, danger, onConfirm,
  //         input?: { type, value, placeholder },  // 有则显示输入框,onConfirm 收到值
  //         extra?: { text, danger, onClick }       // 可选的额外操作按钮(如「取消辞职」)
  //       }
  function showConfirmPopover(anchor, opts) {
    document.querySelectorAll('.confirm-popover').forEach(el => el.remove());
    const pop = Render.el('div.confirm-popover');
    pop.appendChild(Render.el('div.confirm-text', opts.text || '确认?'));
    if (opts.sub) pop.appendChild(Render.el('div.confirm-sub', opts.sub));

    // 可选输入框
    let inputEl = null;
    if (opts.input) {
      inputEl = Render.el('input.confirm-input', {
        type: opts.input.type || 'text',
        value: opts.input.value || '',
        placeholder: opts.input.placeholder || ''
      });
      pop.appendChild(inputEl);
    }

    // 可选颜色 swatches 行(用于文字配色等场景)
    // opts.swatches: { options: [{value,hex}], initial: 'red' | null, onChange: (val)=>{} }
    let pickedSwatch = opts.swatches ? (opts.swatches.initial || null) : null;
    if (opts.swatches) {
      const swRow = Render.el('div.confirm-swatches');
      const clearSw = Render.el('button.confirm-sw-clear', { type: 'button', title: '无色' }, '×');
      if (pickedSwatch === null) clearSw.classList.add('active');
      clearSw.addEventListener('click', (e) => {
        e.stopPropagation();
        pickedSwatch = null;
        swRow.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        clearSw.classList.add('active');
        if (inputEl) updateInputColor();
      });
      swRow.appendChild(clearSw);
      for (const o of opts.swatches.options) {
        const sb = Render.el('button.confirm-sw', { type: 'button', style: { background: o.hex }, title: o.value });
        if (pickedSwatch === o.value) sb.classList.add('active');
        sb.addEventListener('click', (e) => {
          e.stopPropagation();
          pickedSwatch = o.value;
          swRow.querySelectorAll('button').forEach(b => b.classList.remove('active'));
          sb.classList.add('active');
          if (inputEl) updateInputColor();
        });
        swRow.appendChild(sb);
      }
      pop.appendChild(swRow);
      // input 预览颜色:输入框文字色跟随选中色
      const updateInputColor = () => {
        if (!inputEl) return;
        const hex = pickedSwatch ? (opts.swatches.options.find(o => o.value === pickedSwatch) || {}).hex : '';
        inputEl.style.color = hex || '';
        inputEl.style.fontWeight = pickedSwatch ? '700' : '';
      };
      updateInputColor();
    }

    // 可选额外按钮(整行宽度,放在 input 和操作按钮之间)
    if (opts.extra) {
      const extraBtn = Render.el(opts.extra.danger ? 'button.confirm-extra.danger' : 'button.confirm-extra', {
        onclick: (e) => { e.stopPropagation(); close(); opts.extra.onClick && opts.extra.onClick(); }
      }, opts.extra.text);
      pop.appendChild(extraBtn);
    }

    const actions = Render.el('div.confirm-actions');
    let confirmed = false;
    const doConfirm = () => {
      const v = inputEl ? inputEl.value : null;
      confirmed = true;
      close();
      // onConfirm 接收 (inputValue, swatchValue) 两个参数
      opts.onConfirm && opts.onConfirm(v, pickedSwatch);
    };
    const yesBtn = Render.el(opts.danger ? 'button.danger' : 'button.primary', {
      onclick: (e) => { e.stopPropagation(); doConfirm(); }
    }, opts.confirmText || '确认');
    const noBtn = Render.el('button', {
      onclick: (e) => { e.stopPropagation(); close(); }
    }, opts.cancelText || '取消');
    actions.appendChild(noBtn);
    actions.appendChild(yesBtn);
    pop.appendChild(actions);

    if (inputEl) {
      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); doConfirm(); }
      });
    }

    document.body.appendChild(pop);
    // 定位:默认 anchor 左侧,左侧空间不足翻到右侧;垂直对齐 anchor 中线且不溢出视口
    const r = anchor.getBoundingClientRect();
    const pr = pop.getBoundingClientRect();
    const margin = 8;
    let left = r.left - pr.width - margin;
    if (left < margin) left = r.right + margin;
    if (left + pr.width > window.innerWidth - margin) left = Math.max(margin, window.innerWidth - pr.width - margin);
    let top = r.top + r.height / 2 - pr.height / 2;
    if (top < margin) top = margin;
    if (top + pr.height > window.innerHeight - margin) top = window.innerHeight - pr.height - margin;
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';

    const close = () => {
      pop.remove();
      document.removeEventListener('click', onDocClick, true);
      document.removeEventListener('keydown', onKey, true);
      window.removeEventListener('scroll', close, true);
      // 只有「未确认」(即取消 / 外部点击 / Esc / 滚动)才触发 onCancel
      if (!confirmed && opts.onCancel) opts.onCancel();
    };
    const onDocClick = (e) => { if (!pop.contains(e.target)) close(); };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    setTimeout(() => {
      document.addEventListener('click', onDocClick, true);
      document.addEventListener('keydown', onKey, true);
      window.addEventListener('scroll', close, true);
      if (inputEl) inputEl.focus();
    }, 0);
  }

  // ---- 个人排班 (personal view) ----
  // 在 state 中按部门名 + 人员名定位人员。容忍空格 / 软删除人员。
  function findPersonByConfig(cfg) {
    const state = Store.get();
    const norm = s => (s || '').replace(/\s+/g, '').trim();
    const dept = state.departments.find(d => d.name === cfg.deptName)
              || state.departments.find(d => norm(d.name) === norm(cfg.deptName));
    if (!dept) return { dept: null, person: null };
    const people = (state.people[dept.id] || []).filter(p => !p.removedOn);
    const target = norm(cfg.personName);
    let person = people.find(p => p.name === cfg.personName)
              || people.find(p => norm(p.name) === target);
    if (!person) {
      // 子串匹配作为最后兜底
      person = people.find(p => norm(p.name) && (norm(p.name).includes(target) || target.includes(norm(p.name))));
    }
    return { dept, person: person || null };
  }

  // 判定某人某天是否「出勤」。规则与 computeLineTotal 一致:
  //   cellStatus === 'work' 且(无文字标记 或 文字是班次标记「早/晚」等)→ 出
  //   其余(〇/有/欠/✲/自定义文字)→ 休
  function isPersonWorking(deptId, personId, ymd) {
    if (!deptId || !personId) return false;
    if (Store.cellStatus(deptId, personId, ymd) !== 'work') return false;
    const ct = Store.cellText(deptId, personId, ymd);
    if (ct && ct.text && !WORK_TEXTS_PERSONAL.has(ct.text)) return false;
    return true;
  }

  }

  // ─── 数据访问层(走 Store)───
  const hoursUi = () => Store.get().ui.hours;
  // 当前选中的人员。返回 { dept, person } 或 null
  function hoursCurrentPerson() {
    const id = hoursUi().selectedPersonId;

  }
  // 全部可选人员(跨部门,过滤掉已软删除的)
  function hoursAllPeople() {
    const out = [];
    for (const d of Store.get().departments) {
      for (const p of (Store.get().people[d.id] || [])) {
        if (p.removedOn) continue;

  // 映射主表 cellStatus → hours 标签。found = { dept, person } 或 null
  function deriveHoursTag(found, ymd) {
    if (!found) return null;
    const st = Store.cellStatus(found.dept.id, found.person.id, ymd);
    if (st === 'retired') return null;
    if (st === 'absent') return 'absent';
    if (st === 'paidLeave') return 'leave';
    if (st === 'contractRest') return 'restday';
    return Holidays.isHoliday(ymd) ? 'holiday' : 'workday';
  }

  function hoursParseYM(k) { const [y,m]=k.split('-').map(Number); return { y, m: m-1 }; }
  function hoursYmdKey(y,m,d) { return `${y}-${Util.pad2(m+1)}-${Util.pad2(d)}`; }
  function hoursDaysInMonth(y,m) { return new Date(y, m+1, 0).getDate(); }
  function hoursTimeToMin(t) { if (!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; }
  function hoursMinToTime(min) { const h=Math.floor(min/60), m=min%60; return `${Util.pad2(h)}:${Util.pad2(m)}`; }
  function hoursFmt(h) {
    if (h == null || isNaN(h)) return '—';
    if (h === 0) return '0';
    return h.toFixed(1).replace(/\.0$/, '');
  }
  function hoursFmtStat(h) { return hoursFmt(h).replace(/\.(\d+)/, '<span class="h-dec">.$1</span>'); }

  function hoursPeriodRange(cursor, cycleStart) {
    const { y, m } = hoursParseYM(cursor);
    if (cycleStart <= 1) {
      return { start: new Date(y, m, 1), end: new Date(y, m, hoursDaysInMonth(y, m)) };
    }
    const prevY = m === 0 ? y - 1 : y;
    const prevM = (m + 11) % 12;
    const startDay = Math.min(cycleStart, hoursDaysInMonth(prevY, prevM));
    const start = new Date(prevY, prevM, startDay);
    const endDay = Math.min(cycleStart - 1, hoursDaysInMonth(y, m));
    const end = new Date(y, m, endDay);
    return { start, end };
  }

  // stdHours / lunchHours 从 ui.hours 读
  function calcHoursDay(rec, derivedTag, prevCarryOut) {
    const u = hoursUi();
    const stdHours = u.stdHours, lunchHours = u.lunchHours;
    const tag = rec?.tag || derivedTag || 'workday';
    const inMin = hoursTimeToMin(rec?.in);
    const outMin = hoursTimeToMin(rec?.out);
    let work=0, normal=0, ot=0, holidayHrs=0, attended=false, absent=false, paidLeave=false;
    if (tag === 'absent') { absent = true; }
    else if (tag === 'restday') {}
    else if (tag === 'leave') { paidLeave = true; }
    else if (inMin != null && outMin != null && outMin !== inMin) {
      let effIn = inMin;
      const isOvernight = outMin < inMin;
      if (prevCarryOut != null && !isOvernight && inMin < prevCarryOut) effIn = prevCarryOut;
      if (!isOvernight && outMin <= effIn) {} else {
        let span = outMin > effIn ? (outMin - effIn) / 60 : (outMin + 24*60 - effIn) / 60;
        if (span > 6) span -= lunchHours;
        work = Math.max(0, span);
        attended = work > 0;
        if (tag === 'workday') {
          normal = Math.min(work, stdHours);
          ot = Math.max(0, work - stdHours);
        } else if (tag === 'holiday') {
          normal = Math.min(work, stdHours);
          ot = Math.max(0, work - stdHours);
          holidayHrs = work;
        }
      }
    }
    return { tag, work, normal, ot, holidayHrs, attended, absent, paidLeave };
  }

      <p class="h-foot">数据保存于本地浏览器 · 人员名匹配出勤表时,标签自动按出勤数据生成<br/>未匹配时按工作日/节假日默认</p>
    `;
    host.appendChild(wrap);
    bindHoursEvents();
    renderHoursAll();
  }

  function renderHoursAll() {
    const s = hoursUi();
    const found = hoursCurrentPerson();
    document.getElementById('h-stdHours').value = s.stdHours;
    document.getElementById('h-lunchHours').value = s.lunchHours;
    document.getElementById('h-cycleStart').value = s.cycleStart;
    document.getElementById('h-personName').value = found ? found.person.name : '';

    // 自定义弹层:首次渲染时填充全部人员;之后由 input 事件过滤
    renderPersonPop('');

    const { y, m } = hoursParseYM(s.cursor);
    const { start, end } = hoursPeriodRange(s.cursor, s.cycleStart);
    document.getElementById('h-monthLabel').innerHTML =
      `<span class="h-m-num">${m+1}</span><span class="h-m-unit">月</span>`;
    if (s.cycleStart > 1) {
      const fmt = dt => `${dt.getMonth()+1}/${dt.getDate()}`;
      document.getElementById('h-yearLabel').textContent = `${fmt(start)} – ${fmt(end)}`;
    } else {
      document.getElementById('h-yearLabel').textContent = `${y}`;
    }
    if (document.getElementById('h-picker').classList.contains('open')) {
      hoursPickerYear = hoursParseYM(s.cursor).y;
      renderHoursPicker();
    }
    renderHoursDays();
  }

  function renderHoursPicker() {
    document.getElementById('h-mpYearLabel').textContent = hoursPickerYear;
    const { y: curY, m: curM } = hoursParseYM(hoursUi().cursor);
    const today = new Date();
    const grid = document.getElementById('h-mpGrid');
    grid.innerHTML = HOURS_MONTH_CN.map((_, i) => {
      const isCurrent = hoursPickerYear === curY && i === curM;
      const isToday = hoursPickerYear === today.getFullYear() && i === today.getMonth();
      const cls = [isCurrent && 'current', isToday && !isCurrent && 'today'].filter(Boolean).join(' ');
      return `<button data-month="${i}" class="${cls}"><span class="h-m-num" style="font-size:13.5px">${i+1}</span><span class="h-m-unit" style="font-size:10.5px;transform:none">月</span></button>`;
    }).join('');
  }

  function renderHoursDays() {
    const s = hoursUi();
    const found = hoursCurrentPerson();
    const days = found ? (found.person.hoursDays || {}) : {};
    const { start, end } = hoursPeriodRange(s.cursor, s.cycleStart);

    const today = new Date();
    const todayKey = hoursYmdKey(today.getFullYear(), today.getMonth(), today.getDate());

    let totalNormal=0, totalOT=0, totalHoliday=0, attendedCount=0, leaveCount=0, absentCount=0;
    const frag = document.createDocumentFragment();
    const iter = new Date(start);
    while (iter <= end) {
      const yy = iter.getFullYear(), mm = iter.getMonth(), d = iter.getDate();
      const key = hoursYmdKey(yy, mm, d);
      const wd = iter.getDay();
      const rec = days[key];
      const derived = deriveHoursTag(found, key);

      // 前日跨夜
      const prevDate = new Date(yy, mm, d-1);
      const prevKey = hoursYmdKey(prevDate.getFullYear(), prevDate.getMonth(), prevDate.getDate());
      const prevRec = days[prevKey];
      let prevCarryOut = null;
      if (prevRec?.in && prevRec?.out) {
        const pIn = hoursTimeToMin(prevRec.in), pOut = hoursTimeToMin(prevRec.out);
        if (pOut < pIn) prevCarryOut = pOut;
      }
      const calc = calcHoursDay(rec, derived, prevCarryOut);
      totalNormal += calc.normal;
      totalOT += calc.ot;
      totalHoliday += calc.holidayHrs;
      if (calc.attended) attendedCount++;
      if (calc.paidLeave) leaveCount++;
      if (calc.absent) absentCount++;

      const jpHoliday = Holidays.isHoliday(key);
      const tag = HOURS_TAGS[calc.tag];
      const showTimes = calc.tag !== 'leave' && calc.tag !== 'absent' && calc.tag !== 'restday';
      const overnight = showTimes && rec?.in && rec?.out && hoursTimeToMin(rec.out) < hoursTimeToMin(rec.in);

      const row = document.createElement('div');
      row.className = `h-day has-tag-${calc.tag}`;
      if (wd === 0) row.classList.add('dow-sun');
      else if (wd === 6) row.classList.add('dow-sat');
      if (jpHoliday) row.classList.add('is-jp-holiday');
      if (key === todayKey) row.classList.add('today');

      row.innerHTML = `
        <div class="h-date">
          <div class="h-d">${Util.pad2(d)}</div>
          <div class="h-wd">${HOURS_WD_JP[wd]}</div>
          ${jpHoliday ? '<div class="h-jpname">祝</div>' : ''}
        </div>
        <div class="h-tag-cell">
          <span class="h-tag-pill h-tag-pill-static" style="--h-tag-color:${tag.color}">
            <span class="h-dot"></span>
            <span>${tag.label}</span>
          </span>
        </div>
        <div class="h-times-wrap">
          <div class="h-times">
            <span class="h-in-cell">
              ${prevCarryOut != null && showTimes ? `<span class="h-carry-prev">← ${hoursMinToTime(prevCarryOut)}</span>` : ''}
              <input type="time" class="h-time" data-field="in" data-key="${key}" value="${showTimes ? (rec?.in || '') : ''}" ${showTimes ? '' : 'disabled'} />
            </span>
            <span class="h-sep">→</span>
            <span class="h-out-cell">
              <input type="time" class="h-time" data-field="out" data-key="${key}" value="${showTimes ? (rec?.out || '') : ''}" ${showTimes ? '' : 'disabled'} />
              ${overnight ? '<span class="h-next-day">翌日</span>' : ''}
            </span>
          </div>
        </div>
        <div class="h-nums">
          <div class="h-num work ${calc.normal+calc.ot ? '' : 'zero'}"><span class="h-nlbl">实际</span>${hoursFmt(calc.work || calc.normal)}</div>
          <div class="h-num ot ${calc.ot ? '' : 'zero'}"><span class="h-nlbl">加班</span>${calc.ot ? '+'+hoursFmt(calc.ot) : '—'}</div>
        </div>
      `;
      frag.appendChild(row);
      iter.setDate(iter.getDate() + 1);
    }
    const daysHost = document.getElementById('h-days');
    daysHost.innerHTML = '';
    daysHost.appendChild(frag);

    // 有休残卡片 — 仅当选中了主表实际人员时显示有效数据
    let leaveInfo = null;
    if (found) {
      const asOf = end;
      leaveInfo = computeAnnualLeave(found.dept.id, found.person, asOf);
    }
    renderHoursStats({ totalNormal, totalOT, totalHoliday, attendedCount, leaveCount, absentCount, leaveInfo, personMatched: !!found });
  }

  // 原地刷新工时计算 + 统计卡(不重建 DOM)— 用于手机端 focusout,避免破坏正在编辑/即将编辑的输入框
  function refreshHoursCalc() {
    const s = hoursUi();
    const found = hoursCurrentPerson();
    const days = found ? (found.person.hoursDays || {}) : {};
    const { start, end } = hoursPeriodRange(s.cursor, s.cycleStart);
    const daysHost = document.getElementById('h-days');
    if (!daysHost) return;
    const rows = daysHost.children;
    // 行数对不上 → 走完整重建兜底(避免视图错位)
    let expectedRows = 0;
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) expectedRows++;
    if (rows.length !== expectedRows) { renderHoursDays(); return; }

    let totalNormal=0, totalOT=0, totalHoliday=0, attendedCount=0, leaveCount=0, absentCount=0;
    let i = 0;
    const iter = new Date(start);
    while (iter <= end) {
      const yy = iter.getFullYear(), mm = iter.getMonth(), d = iter.getDate();
      const key = hoursYmdKey(yy, mm, d);
      const rec = days[key];
      const derived = deriveHoursTag(found, key);

      const prevDate = new Date(yy, mm, d - 1);
      const prevKey = hoursYmdKey(prevDate.getFullYear(), prevDate.getMonth(), prevDate.getDate());
      const prevRec = days[prevKey];
      let prevCarryOut = null;
      if (prevRec?.in && prevRec?.out) {
        const pIn = hoursTimeToMin(prevRec.in), pOut = hoursTimeToMin(prevRec.out);
        if (pOut < pIn) prevCarryOut = pOut;
      }
      const calc = calcHoursDay(rec, derived, prevCarryOut);
      totalNormal += calc.normal;
      totalOT += calc.ot;
      totalHoliday += calc.holidayHrs;
      if (calc.attended) attendedCount++;
      if (calc.paidLeave) leaveCount++;
      if (calc.absent) absentCount++;

      const row = rows[i++];
      if (!row) continue;
      // 工时数字 + zero class
      const workEl = row.querySelector('.h-num.work');
      const otEl = row.querySelector('.h-num.ot');
      const hasWork = !!(calc.normal + calc.ot);
      if (workEl) {
        workEl.classList.toggle('zero', !hasWork);
        workEl.innerHTML = `<span class="h-nlbl">实际</span>${hoursFmt(calc.work || calc.normal)}`;
      }
      if (otEl) {
        otEl.classList.toggle('zero', !calc.ot);
        otEl.innerHTML = `<span class="h-nlbl">加班</span>${calc.ot ? '+' + hoursFmt(calc.ot) : '—'}`;
      }
      // 翌日 / 前日跨夜 badge 原地增删
      const showTimes = calc.tag !== 'leave' && calc.tag !== 'absent' && calc.tag !== 'restday';
      const outCell = row.querySelector('.h-out-cell');
      if (outCell) {
        const overnight = showTimes && rec?.in && rec?.out && hoursTimeToMin(rec.out) < hoursTimeToMin(rec.in);
        const existing = outCell.querySelector('.h-next-day');
        if (overnight && !existing) {
          const badge = document.createElement('span');
          badge.className = 'h-next-day';
          badge.textContent = '翌日';
          outCell.appendChild(badge);
        } else if (!overnight && existing) {
          existing.remove();
        }
      }
      const inCell = row.querySelector('.h-in-cell');
      if (inCell) {
        const existing = inCell.querySelector('.h-carry-prev');
        if (prevCarryOut != null && showTimes && !existing) {
          const span = document.createElement('span');
          span.className = 'h-carry-prev';
          span.textContent = `← ${hoursMinToTime(prevCarryOut)}`;
          inCell.insertBefore(span, inCell.firstElementChild);
        } else if ((prevCarryOut == null || !showTimes) && existing) {
          existing.remove();
        }
      }

      iter.setDate(iter.getDate() + 1);
    }

    // 统计卡 — 原地更新 .h-value
    let leaveInfo = null;
    if (found) {
      const asOf = end;
      leaveInfo = computeAnnualLeave(found.dept.id, found.person, asOf);
    }
    const cards = document.querySelectorAll('#h-stats .h-stat');
    if (cards.length !== 6) {
      // 卡片数量不对 → 完整重渲兜底
      renderHoursStats({ totalNormal, totalOT, totalHoliday, attendedCount, leaveCount, absentCount, leaveInfo, personMatched: !!found });
      return;
    }
    const data = [
      { value: totalNormal + totalOT, unit: 'h' },
      { value: totalNormal, unit: 'h' },
      { value: totalOT, unit: 'h' },
      { value: totalHoliday, unit: 'h' },
      { value: `${attendedCount}`, unit: `/ ${leaveCount} / ${absentCount}` },
      (found && leaveInfo && !leaveInfo.noLeave)
        ? { value: leaveInfo.remaining, unit: `天 / ${leaveInfo.totalQuota}` }
        : { value: '—', unit: '' }
    ];
    cards.forEach((card, idx) => {
      const dd = data[idx];
      const valueEl = card.querySelector('.h-value');
      if (valueEl) {
        valueEl.innerHTML = `${typeof dd.value === 'number' ? hoursFmtStat(dd.value) : dd.value}<span class="h-unit">${dd.unit}</span>`;
      }
    });
  }

  function hoursFmtYmd(d) {
    return `${d.getFullYear()}/${Util.pad2(d.getMonth()+1)}/${Util.pad2(d.getDate())}`;
  }
  function hoursFmtYm(d) {
    return `${d.getFullYear()}/${Util.pad2(d.getMonth()+1)}`;
  }

  function renderHoursStats(s) {
    const cards = [
      { label: '上班总计', value: s.totalNormal + s.totalOT, unit: 'h', color: 'var(--h-accent)', sub: '正常 + 加班 全部到岗时长' },
      { label: '正常工时', value: s.totalNormal, unit: 'h', color: 'var(--h-c-normal)', sub: '工作日 + 节假日上班' },
      { label: '加班总计', value: s.totalOT, unit: 'h', color: 'var(--h-c-ot)', sub: '工作日 + 节假日上班溢出' },
      { label: '节假日工时', value: s.totalHoliday, unit: 'h', color: 'var(--h-c-holiday)', sub: '节假日上班时长' },
      { label: '出勤 / 有休 / 缺勤', value: `${s.attendedCount}`, unit: `/ ${s.leaveCount} / ${s.absentCount}`, color: 'var(--h-c-normal)', sub: '天数' },
    ];
    // 有休残:命中真实人员时按 年度有休 + 前年残留 计算;否则提示选择人员
    if (s.personMatched && s.leaveInfo) {
      const li = s.leaveInfo;
      if (li.noLeave) {
        cards.push({
          label: '有休残',
          value: '—',
          unit: '',
          color: 'var(--h-c-leave)',
          sub: '该人员无有休资格',
          cls: 'h-span-2',
        });
      } else {
        const lowLeave = li.remaining <= 5;
        const carryNote = li.carryover > 0 ? ` · 前年残留 ${li.carryover}` : '';
        cards.push({
          label: '有休残',
          value: li.remaining,
          unit: `天 / ${li.totalQuota}`,
          color: 'var(--h-c-leave)',
          sub: `截至 ${hoursFmtYmd(li.asOf)} 已用 ${li.used} 天 · 周期 ${hoursFmtYm(li.winStart)} – ${hoursFmtYm(li.winEnd)}${carryNote}`,
          cls: `h-span-2${lowLeave ? ' h-low' : ''}`,
        });
      }
    } else {
      cards.push({
        label: '有休残',
        value: '—',
        unit: '',
        color: 'var(--h-c-leave)',
        sub: '请选择主表中存在的人员名',
        cls: 'h-span-2',
      });
    }
    document.getElementById('h-stats').innerHTML = cards.map(c => `
      <div class="h-stat ${c.cls || ''}" style="--h-stat-color:${c.color}">
        <div class="h-label">${c.label}</div>
        <div class="h-value">${typeof c.value === 'number' ? hoursFmtStat(c.value) : c.value}<span class="h-unit">${c.unit}</span></div>
        <div class="h-sub">${c.sub}</div>
      </div>
    `).join('');
  }

  function closeAllHoursMenus() {
    document.querySelectorAll('#page-hours .h-tag-menu.open').forEach(m => m.classList.remove('open'));
  }

  // 自定义人员名弹层渲染:filter 为当前输入的过滤词(子串匹配,大小写不敏感)
  function renderPersonPop(filter) {
    const pop = document.getElementById('h-personPop');
    if (!pop) return;
    const all = hoursAllPeople(); // [{dept, person}]
    const f = (filter || '').trim().toLowerCase();
    const matched = f ? all.filter(r => r.person.name.toLowerCase().includes(f)) : all;
    const currentId = hoursUi().selectedPersonId;
    if (matched.length === 0) {
      pop.innerHTML = `<div class="h-empty">无匹配人员</div>`;
      return;
    }
    const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    pop.innerHTML = matched.map(r => {
      const active = r.person.id === currentId ? ' h-active' : '';
      return `
        <button type="button" class="h-person-item${active}" data-pid="${esc(r.person.id)}">
          <span class="h-person-name">${esc(r.person.name)}</span>
          <span class="h-person-dept">${esc(r.dept.name)}</span>
        </button>
      `;
    }).join('');
  }

  let hoursDocListenersBound = false;
  function bindHoursEvents() {
    const daysHost = document.getElementById('h-days');

    // focusin:打开 session,记录原值。仅手机端用于 iOS picker 完成/放弃判定
    daysHost.addEventListener('focusin', e => {
      const inp = e.target.closest('.h-time');
      if (!inp || !HOURS_IS_MOBILE) return;
      hoursActivePicker = inp;
      hoursTouchedOutside = false;
      hoursPickerSessions.set(inp, { original: inp.value });
    });
    daysHost.addEventListener('change', e => {
      const inp = e.target.closest('.h-time');
      if (!inp) return;
      // 手机端:用户碰过外部 → 视为放弃,本次 change 不写入(focusout 阶段统一还原)
      if (HOURS_IS_MOBILE && hoursPickerSessions.has(inp) && hoursTouchedOutside) return;
      const key = inp.dataset.key, field = inp.dataset.field;
      const found = hoursCurrentPerson();
      if (!found) return;
      const days = found.person.hoursDays || (found.person.hoursDays = {});
      const rec = { ...(days[key] || {}) };
      rec[field] = inp.value;
      Store.setHoursDay(found.person.id, key, rec, true);
      // 不立刻重渲 — 否则正在编辑的 input 会被销毁,PC 上输入第二位数字时焦点丢失
    });
    // 焦点离开:手机端按 touchedOutside 还原或保存;PC 端只触发延迟重渲
    daysHost.addEventListener('focusout', e => {
      const inp = e.target.closest('.h-time');
      if (!inp) return;
      const key = inp.dataset.key, field = inp.dataset.field;
      const sess = hoursPickerSessions.get(inp);
      const found = hoursCurrentPerson();

      if (found && HOURS_IS_MOBILE && sess && hoursTouchedOutside) {
        // 还原 DOM 与 state 到 picker 打开之前
        inp.value = sess.original;
        const days = found.person.hoursDays || {};
        const cur = days[key];
        if (cur) {
          const rec = { ...cur };
          if (sess.original) rec[field] = sess.original;
          else delete rec[field];
          Store.setHoursDay(found.person.id, key, rec, true);
        }
      } else if (found && HOURS_IS_MOBILE && sess) {
        // 手机端「完成」按钮分支:change 可能未触发,兜底写入 inp.value
        const days = found.person.hoursDays || {};
        const cur = days[key] || {};
        if (cur[field] !== inp.value) {
          const rec = { ...cur, [field]: inp.value };
          Store.setHoursDay(found.person.id, key, rec, true);
        }
      }
      // PC 端不做特殊处理,change 已经保存过

      hoursPickerSessions.delete(inp);
      hoursActivePicker = null;
      hoursTouchedOutside = false;
      setTimeout(() => {
        if (daysHost.contains(document.activeElement)) return;
        // 手机端:原地更新数字 + 统计,不破坏 DOM 结构
        // PC 端:维持原有完整重建逻辑
        if (HOURS_IS_MOBILE) refreshHoursCalc();
        else renderHoursDays();
      }, 0);
    });

    if (!hoursDocListenersBound) {
      document.addEventListener('mousedown', e => {
        const mt = document.getElementById('h-monthTitle');
        if (mt && !mt.contains(e.target)) {
          document.getElementById('h-picker')?.classList.remove('open');
        }
      });
      // 点击 人员名 label 外部 → 关闭弹层
      document.addEventListener('mousedown', e => {
        if (!e.target.closest('.h-person-label')) {
          document.getElementById('h-personPop')?.classList.remove('open');
        }
      });
      // 手机端:picker 打开期间监听任何外部触碰 → 标记为放弃
      // (iOS「完成」按钮在系统 UI 层,不会派发 pointerdown,所以不会被标记)
      if (HOURS_IS_MOBILE) {
        const markOutside = ev => {
          if (hoursActivePicker && !hoursActivePicker.contains(ev.target)) {
            hoursTouchedOutside = true;
          }
        };
        document.addEventListener('pointerdown', markOutside, true);
        document.addEventListener('touchstart', markOutside, { capture: true, passive: true });
      }
      hoursDocListenersBound = true;
    }

    document.getElementById('h-prevBtn').onclick = () => {
      const { y, m } = hoursParseYM(hoursUi().cursor);
      const nd = new Date(y, m - 1, 1);
      Store.setHoursSetting('cursor', `${nd.getFullYear()}-${Util.pad2(nd.getMonth()+1)}`, true);
      renderHoursAll();
    };
    document.getElementById('h-nextBtn').onclick = () => {
      const { y, m } = hoursParseYM(hoursUi().cursor);
      const nd = new Date(y, m + 1, 1);
      Store.setHoursSetting('cursor', `${nd.getFullYear()}-${Util.pad2(nd.getMonth()+1)}`, true);
      renderHoursAll();
    };
    document.getElementById('h-todayBtn').onclick = () => {
      const t = new Date();
      Store.setHoursSetting('cursor', `${t.getFullYear()}-${Util.pad2(t.getMonth()+1)}`, true);
      renderHoursAll();
    };

    document.getElementById('h-monthTitle').addEventListener('mousedown', e => {
      if (e.target.closest('.h-picker')) return;
      e.preventDefault();
      const picker = document.getElementById('h-picker');
      if (picker.classList.contains('open')) {
        picker.classList.remove('open');
      } else {
        hoursPickerYear = hoursParseYM(hoursUi().cursor).y;
        renderHoursPicker();
        picker.classList.add('open');
      }
    });
    document.getElementById('h-mpPrevYear').addEventListener('click', e => {
      e.stopPropagation(); hoursPickerYear--; renderHoursPicker();
    });
    document.getElementById('h-mpNextYear').addEventListener('click', e => {
      e.stopPropagation(); hoursPickerYear++; renderHoursPicker();
    });
    document.getElementById('h-mpGrid').addEventListener('click', e => {
      const btn = e.target.closest('button[data-month]');
      if (!btn) return;
      e.stopPropagation();
      const m = parseInt(btn.dataset.month, 10);
      Store.setHoursSetting('cursor', `${hoursPickerYear}-${Util.pad2(m+1)}`, true);
      document.getElementById('h-picker').classList.remove('open');
      renderHoursAll();
    });

    document.getElementById('h-stdHours').addEventListener('change', e => {
      Store.setHoursSetting('stdHours', Math.max(1, parseFloat(e.target.value) || 8), true);
      renderHoursDays();
    });
    document.getElementById('h-lunchHours').addEventListener('change', e => {
      Store.setHoursSetting('lunchHours', Math.max(0, parseFloat(e.target.value) || 0), true);
      renderHoursDays();
    });
    document.getElementById('h-cycleStart').addEventListener('change', e => {
      const v = parseInt(e.target.value, 10);
      Store.setHoursSetting('cycleStart', Math.max(1, Math.min(28, Number.isFinite(v) ? v : 1)), true);
      renderHoursAll();
    });
    const personInput = document.getElementById('h-personName');
    const personPop = document.getElementById('h-personPop');
    // 输入框现在只作为「显示当前人 + 输入过滤词」用,不再直接写入 selectedPerson。
    // 唯一的写入路径是点击 pop 中的条目。
    personInput.addEventListener('input', () => {
      renderPersonPop(personInput.value || '');
    });
    personInput.addEventListener('focus', () => {
      // 聚焦时清空显示让用户能直接输入过滤词
      personInput.dataset.lastDisplay = personInput.value;
      personInput.value = '';
      renderPersonPop('');
      personPop.classList.add('open');
    });
    personInput.addEventListener('blur', () => {
      // 失焦如果用户没选,恢复显示
      setTimeout(() => {
        if (!personPop.contains(document.activeElement)) {
          personInput.value = personInput.dataset.lastDisplay || '';
        }
      }, 0);
    });
    personInput.addEventListener('click', (e) => {
      e.stopPropagation();
      renderPersonPop(personInput.value || '');
      personPop.classList.add('open');
    });
    // 点击弹层条目 → 设置 selectedPersonId + 关闭
    personPop.addEventListener('mousedown', (e) => {
      const btn = e.target.closest('.h-person-item');
      if (!btn) return;
      e.preventDefault();
      const pid = btn.dataset.pid;
      Store.setHoursSetting('selectedPersonId', pid || null, true);
      const found = hoursCurrentPerson();
      personInput.value = found ? found.person.name : '';
      personInput.dataset.lastDisplay = personInput.value;
      personPop.classList.remove('open');
      renderHoursDays();
    });

    document.getElementById('h-clearBtn').onclick = (e) => {
      const found = hoursCurrentPerson();
      if (!found) { showToast('请先选择人员', 'info'); return; }
      const u = hoursUi();
      const { start, end } = hoursPeriodRange(u.cursor, u.cycleStart);
      const days = found.person.hoursDays || {};
      const startYmd = Util.ymd(start), endYmd = Util.ymd(end);
      let nToClear = 0;
      Object.keys(days).forEach(k => { if (k >= startYmd && k <= endYmd) nToClear++; });
      showConfirmPopover(e.currentTarget, {
        text: `清空当前周期 ${nToClear} 项数据?`,
        sub: `${found.person.name} · ${hoursFmtYmd(start)} – ${hoursFmtYmd(end)}`,
        confirmText: '清空',
        danger: true,
        onConfirm: () => {
          Store.clearHoursDaysInRange(found.person.id, startYmd, endYmd, true);
          renderHoursDays();
        }
      });
    };
    document.getElementById('h-exportBtn').onclick = () => {
      // 工时数据已经合并进主 store, 导出时只复制相关切片(便于人工查看/备份)
      const slice = {
        format: 'hours-export-v3',
        exportedAt: new Date().toISOString(),
        ui: hoursUi(),
        people: []
      };
      for (const d of Store.get().departments) {
        for (const p of (Store.get().people[d.id] || [])) {
          if (!p.hoursDays || !Object.keys(p.hoursDays).length) continue;
          slice.people.push({
            personId: p.id, name: p.name, deptId: d.id, deptName: d.name,
            hoursDays: p.hoursDays
          });
        }
      }
      const blob = new Blob([JSON.stringify(slice, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `月度工时${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    };
    const importFile = document.getElementById('h-importFile');
    const importBtn = document.getElementById('h-importBtn');
    importBtn.onclick = () => importFile.click();
    importFile.addEventListener('change', e => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!data || typeof data !== 'object') throw new Error('文件格式不正确');
          // 三种格式分别处理:
          //   v3 (新): { format:'hours-export-v3', people:[{personId,name,deptId,hoursDays}] }
          //   v2 (旧): { dataByPerson:{ name:{ days } } }  ← 按姓名匹配
          //   v1 (更旧): { days } 单人 → 兼容白海竜
          let nDays = 0;
          const v3 = data.format === 'hours-export-v3' && Array.isArray(data.people);
          const v2 = !v3 && data.dataByPerson;
          if (v3) for (const r of data.people) nDays += Object.keys(r.hoursDays || {}).length;
          else if (v2) for (const k in data.dataByPerson) nDays += Object.keys(data.dataByPerson[k]?.days || {}).length;
          else if (data.days) nDays = Object.keys(data.days).length;
          showConfirmPopover(importBtn, {
            text: `导入 ${nDays} 项数据?`,
            sub: '将合并到对应人员的工时记录里(同日覆盖)',
            confirmText: '继续导入',
            danger: true,
            onConfirm: () => {
              const apply = (personId, days) => {
                if (!personId || !days) return;
                for (const ymd in days) Store.setHoursDay(personId, ymd, days[ymd], true);
              };
              const matchByName = (name) => {
                const trimmed = (name || '').trim();
                if (!trimmed) return null;
                for (const d of Store.get().departments) {
                  for (const p of (Store.get().people[d.id] || [])) {
                    if ((p.name || '').trim() === trimmed) return p.id;
                  }
                }
                return null;
              };
              if (v3) {
                for (const r of data.people) {
                  // 先按 id 精确匹配, 没命中再按姓名匹配
                  const found = r.personId && Store.findPersonById(r.personId);
                  const pid = found ? r.personId : matchByName(r.name);
                  apply(pid, r.hoursDays);
                }
                if (data.ui) {
                  ['cursor','stdHours','lunchHours','cycleStart'].forEach(k => {
                    if (data.ui[k] != null) Store.setHoursSetting(k, data.ui[k], true);
                  });
                }
              } else if (v2) {
                for (const name in data.dataByPerson) {
                  const pid = matchByName(name);
                  if (pid) apply(pid, data.dataByPerson[name]?.days);
                }
                if (data.cursor) Store.setHoursSetting('cursor', data.cursor, true);
                if (Number(data.stdHours) > 0) Store.setHoursSetting('stdHours', Number(data.stdHours), true);
                if (Number.isFinite(Number(data.lunchHours))) Store.setHoursSetting('lunchHours', Number(data.lunchHours), true);
                if (Number(data.cycleStart) >= 1) Store.setHoursSetting('cycleStart', Math.floor(Number(data.cycleStart)), true);
              } else if (data.days) {
                const pid = matchByName('白 海竜');
                if (pid) apply(pid, data.days);
              }
              renderHoursAll();
              showToast('导入成功', 'success');
            }
          });
        } catch (err) { showToast('导入失败:' + err.message, 'error'); }
        finally { e.target.value = ''; }
      };
      reader.readAsText(file);
    });
  }

  function renderHours() {
    buildHoursPage();
  }

  async function exportPersonalPNG(btn) {
    if (typeof html2canvas === 'undefined') {
      showToast('html2canvas が読み込めません', 'error');
      return;
    }
    const root = document.getElementById('personalApp');
    if (!root) { showToast('个人视图未渲染', 'error'); return; }
    const prevBtnText = btn ? btn.textContent : '';
    if (btn) { btn.disabled = true; btn.textContent = '出力中…'; }
    await new Promise(r => setTimeout(r, 50));
    try {
      const canvas = await html2canvas(root, {
        scale: 2,
        backgroundColor: '#0a0a0b',
        useCORS: true,
        logging: false,
        windowWidth: root.scrollWidth,
        windowHeight: root.scrollHeight
      });
      const period = Store.get().ui.currentPeriod;
      const [year, month] = period.split('-');
      const link = document.createElement('a');
      link.download = `personal-shift-${year}${month}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      showToast('PNG出力完了', 'success');
    } catch (e) {
      showToast('出力エラー: ' + e.message, 'error');
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = prevBtnText; }
    }
  }

  return { renderSchedule, renderSettings, renderData, renderPersonal, renderHours, exportPersonalPNG };
})();

const Tests = (() => {
  const results = [];
  const assert = (name, cond, detail = '') => results.push({ name, ok: !!cond, detail });
  const eq = (name, actual, expected) => assert(name, JSON.stringify(actual) === JSON.stringify(expected), `actual=${JSON.stringify(actual)} expected=${JSON.stringify(expected)}`);

  const run = () => {
    results.length = 0;
    // Util
    eq('pad2(3)', Util.pad2(3), '03');
    eq('ymd', Util.ymd(new Date(2026, 4, 16)), '2026-05-16');
    // Period
    eq('Period.days length 2026-05 (16..6/15 = 31 days)', Period.days('2026-05').length, 31);
    eq('Period.days first', Period.days('2026-05')[0].ymd, '2026-05-16');
    eq('Period.days last', Period.days('2026-05')[Period.days('2026-05').length-1].ymd, '2026-06-15');
    eq('Period.prev', Period.prev('2026-05'), '2026-04');
    eq('Period.next', Period.next('2026-12'), '2027-01');
    // Holidays
    assert('Holidays GW 2026-05-05', Holidays.isHoliday('2026-05-05'));
    assert('Non-holiday 2026-05-20', !Holidays.isHoliday('2026-05-20'));
    // Store
    Store.reset();
    eq('Store default depts', Store.get().departments.length, 3);
    const pid = Store.addPerson('dept1', { name: '王 ギョウセイ', role: 'リーダー', annualLeave: 14, leaveResetMonth: 3 });
    eq('Store addPerson', Store.people('dept1').length, 1);
    Store.setCell('dept1', pid, '2026-05-17', 'contractRest');
    eq('Store cell contractRest', Store.cellStatus('dept1', pid, '2026-05-17'), 'contractRest');
    Store.cycleCell('dept1', pid, '2026-05-17'); // → paidLeave
    eq('Store cycle to paid', Store.cellStatus('dept1', pid, '2026-05-17'), 'paidLeave');
    Store.cycleCell('dept1', pid, '2026-05-17'); // → retired (✲)
    eq('Store cycle to retired (✲)', Store.cellStatus('dept1', pid, '2026-05-17'), 'retired');
    Store.cycleCell('dept1', pid, '2026-05-17'); // → work
    eq('Store cycle to work', Store.cellStatus('dept1', pid, '2026-05-17'), 'work');
    Store.updatePerson('dept1', pid, { retiredOn: '2026-05-20' });
    eq('Store retired derived', Store.cellStatus('dept1', pid, '2026-05-21'), 'retired');
    eq('Store required default', Store.requiredCount('dept1', '2026-05-16'), 22);
    Store.setRequired('dept1', '2026-05-16', 18);
    eq('Store required override', Store.requiredCount('dept1', '2026-05-16'), 18);
    Store.reset();

    // ===== hours 模块新数据模型 =====
    Store.reset();
    const hpid = Store.addPerson('dept1', { name: '白 海竜' });
    // 新建 person 自动带 hoursDays
    assert('addPerson initializes hoursDays', Store.findPersonById(hpid).person.hoursDays != null);
    // ui.hours 默认结构
    const uih = Store.get().ui.hours;
    assert('ui.hours has defaults', uih && uih.stdHours === 8 && uih.lunchHours === 1 && uih.cycleStart === 1);
    // setHoursDay 写入
    Store.setHoursDay(hpid, '2026-05-17', { in: '10:00', out: '19:30' });
    eq('setHoursDay write', Store.getHoursDays(hpid)['2026-05-17']?.in, '10:00');
    // setHoursDay 删除(空记录)
    Store.setHoursDay(hpid, '2026-05-17', null);
    eq('setHoursDay delete via null', Store.getHoursDays(hpid)['2026-05-17'], undefined);
    // findPersonById 跨部门
    const hpid2 = Store.addPerson('dept2', { name: '別人' });
    assert('findPersonById cross-dept', Store.findPersonById(hpid2)?.dept.id === 'dept2');
    assert('findPersonById missing → null', Store.findPersonById('p-nope') === null);
    // clearHoursDaysInRange
    Store.setHoursDay(hpid, '2026-05-01', { in: '09:00', out: '18:00' });
    Store.setHoursDay(hpid, '2026-05-15', { in: '09:00', out: '18:00' });
    Store.setHoursDay(hpid, '2026-06-01', { in: '09:00', out: '18:00' });
    eq('clearHoursDaysInRange returns count',
       Store.clearHoursDaysInRange(hpid, '2026-05-01', '2026-05-31'), 2);
    assert('clearHoursDaysInRange preserved outside',
           Store.getHoursDays(hpid)['2026-06-01']?.in === '09:00');
    // setHoursSetting
    Store.setHoursSetting('selectedPersonId', hpid);
    eq('setHoursSetting selectedPersonId', Store.get().ui.hours.selectedPersonId, hpid);
    Store.reset();

    // 注: hours-ledger-v2 → Store 的迁移逻辑跑在 Store.load() 内,
    // load 是模块私有,无法在测试里热重跑。迁移正确性靠浏览器刷新后人工核对
    // (旧 LS key 保留作为 backup,可对照)。
    return results;
  };

  const render = () => {
    if (!location.search.includes('test=1')) return;
    const host = document.getElementById('test-results');
    host.classList.remove('hidden');
    const out = run();
    const pass = out.filter(r => r.ok).length;
    const total = out.length;
    host.textContent = `Tests: ${pass}/${total} passed\n` +
      out.map(r => `${r.ok ? '✓' : '✗'} ${r.name}${r.ok ? '' : ' — ' + r.detail}`).join('\n');
  };

  return { run, render };
})();

window.addEventListener('DOMContentLoaded', () => { App.init(); Tests.render(); });
</script>
