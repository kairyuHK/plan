<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>月度总出勤表</title>
<style>
:root{
  --bg:#0a0a0b; --card:#161618; --border:#26262a;
  --text:#e8e8ea; --muted:#8a8a90;
  --accent:#7c5cff; --ok:#10b981; --warn:#f59e0b; --danger:#ef4444;
  --sat:#3b82f6; --sun:#ef4444; --today:#1e293b; --retired:#52525a;
  --r-card:12px; --r-btn:8px;
  --font:"Noto Sans JP",-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  --font-mono:ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;background:transparent;border:1px solid var(--border);border-radius:var(--r-btn);padding:6px 12px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{background:#1f1f23}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#6a4def}
button.danger{color:var(--danger);border-color:var(--danger)}
input,select{font:inherit;color:inherit;background:#1f1f23;border:1px solid var(--border);border-radius:var(--r-btn);padding:6px 10px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
/* hide native number spinners (Webkit + Firefox) */
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.nav{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:100;flex-wrap:wrap;isolation:isolate;will-change:transform;box-shadow:0 6px 0 var(--bg)}
@media (max-width:768px){
  .nav{position:fixed;top:0;left:0;right:0;width:100%}
  body{padding-top:var(--sticky-nav,50px)}
}
/* 手机竖屏:让「⚙ 设置 / ⬇⬆ 数据 / 🖨 打印」三个按钮换行后靠右对齐
   (flex-wrap 在新行重新分布 free space,给第一个按钮 margin-left:auto 即可) */
@media (max-width:640px){
  .nav button[data-route="#/settings"]{margin-left:auto}
}
.nav .brand{font-weight:600;margin-right:12px;cursor:pointer}
.nav .brand:hover{color:var(--accent)}
.nav .spacer{flex:1}
.nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.dirty{font-size:12px;color:var(--muted)}
.dirty.warn{color:var(--warn)}
.page{padding:14px 16px;max-width:100%}
.hidden{display:none!important}
#test-results{position:fixed;bottom:0;left:0;right:0;background:#000;color:#0f0;font-family:var(--font-mono);font-size:12px;padding:8px;max-height:40vh;overflow:auto;z-index:9999;white-space:pre-wrap}
/* schedule page */
.dept-tabs button{margin-right:4px}
.dept-tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.period-nav{display:inline-flex;gap:4px;align-items:center;font-family:var(--font-mono)}
.period-nav button{padding:3px 9px;font-size:13px;color:var(--muted);border-color:transparent;background:#1c1c20}
.period-nav button:hover{color:var(--accent);border-color:var(--border);background:#222227}
.period-nav span{color:var(--text);padding:0 6px}
.schedule-wrap{margin-top:10px}
table.schedule thead{position:sticky;top:var(--sticky-nav,50px);z-index:3;background:#1c1c20}
table.schedule thead th{background:#1c1c20}
table.schedule thead th.dept-name{background:#161618}
table.schedule{border-collapse:collapse;font-size:11px;background:var(--card);width:100%}
table.schedule th,table.schedule td{border:1px solid var(--border);padding:2px 4px;text-align:center;white-space:nowrap}
table.schedule col.col-role{width:60px}
table.schedule col.col-name{width:130px}
table.schedule col.col-sum{width:36px}
table.schedule col.col-day{width:27px}
table.schedule th{background:#1c1c20;font-weight:500}
table.schedule th.dept-name{text-align:left;padding-left:6px;font-weight:700;font-size:13px;color:var(--accent);background:var(--bg)}
table.schedule th.month-label{font-weight:700;font-size:12px;color:var(--text);background:#1c1c20;letter-spacing:1px}
table.schedule th.role-col,table.schedule td.role-col{min-width:60px;text-align:left;padding-left:6px}
table.schedule th.name-col,table.schedule td.name-col{min-width:110px;text-align:left;padding-left:6px;position:sticky;left:0;background:#1c1c20;z-index:1}
table.schedule td.name-col{background:var(--card)}
table.schedule th.sum-col,table.schedule td.sum-col{min-width:36px;color:var(--muted)}
table.schedule td.sum-col.over{color:var(--danger);font-weight:700}
table.schedule td.sum-col.under{color:var(--warn);font-weight:700}
table.schedule th:not(.role-col):not(.name-col):not(.sum-col):not(.dept-name):not(.month-label){width:27px;height:25px;box-sizing:border-box;padding:0;vertical-align:middle}
table.schedule td.day-cell{width:27px;height:25px;box-sizing:border-box;padding:0;cursor:pointer;font-family:var(--font-mono);font-size:13px;vertical-align:middle;line-height:1}
table.schedule td.day-cell:hover{background:#1f1f23}
table.schedule td.day-cell.contractRest{color:var(--text)}
table.schedule td.day-cell.paidLeave{color:var(--accent);font-weight:700}
table.schedule td.day-cell.retired{color:var(--retired);cursor:not-allowed;background:#111114}
body:not(.editing) table.schedule td.day-cell{cursor:default}
body:not(.editing) table.schedule td.day-cell:hover{background:transparent}
body:not(.editing) table.schedule td.required input{cursor:default;color:var(--muted)}
body:not(.editing) table.schedule td.required input:hover{background:transparent}
table.schedule th.sat{color:var(--sat)}
table.schedule th.sun{color:var(--sun)}
.today-badge{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;background:#f97316;color:#fff;border-radius:50%;font-weight:700;font-size:11px;line-height:1;font-family:var(--font-mono)}
/* row / column highlight (click name-col / date-th to toggle) */
table.schedule td.name-col{cursor:pointer}
table.schedule thead tr.head-row th[data-ymd],table.schedule thead tr.weekday-row th[data-ymd]{cursor:pointer}
table.schedule tr.hl-row td,table.schedule tr.hl-row th{background:rgba(94,234,212,0.10)}
table.schedule td.hl-col,table.schedule th.hl-col{background:var(--today)}
table.schedule tr.hl-row td.hl-col,table.schedule tr.hl-row th.hl-col{background:#2a3f5f}
/* keyboard focus indicator (kept silent — no visible outline; logic still tracks focused cell) */
table.schedule td.day-cell.cell-focus{position:relative}
/* color palette toolbar */
.color-palette{display:inline-flex;gap:6px;align-items:center;margin-left:12px}
.color-palette .swatch{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.color-palette .swatch:hover{outline:1px solid var(--muted);outline-offset:1px}
.color-palette .swatch.active{border-color:var(--text);box-shadow:0 0 0 1px var(--bg) inset}
.color-palette .swatch-clear{background:transparent;border:2px dashed var(--muted);color:var(--muted)}
.entry-hint{margin:8px 0 0;padding:6px 12px;background:rgba(124,92,255,0.08);border:1px solid rgba(124,92,255,0.25);border-radius:6px;font-size:12px;color:var(--text);font-family:var(--font-mono)}
.entry-hint kbd{display:inline-block;background:#1f1f23;border:1px solid var(--border);border-radius:3px;padding:0 5px;margin:0 2px;font-size:11px;color:var(--accent)}
table.schedule tr.stat-row td{background:#161618;font-family:var(--font-mono)}
table.schedule tr.stat-row td.label{text-align:left;padding-left:6px;color:var(--muted)}
table.schedule td.required{cursor:text;padding:0}
table.schedule td.required input{width:100%;padding:2px 0;font-size:12px;font-family:var(--font-mono);text-align:center;background:transparent;border:none;border-radius:0;color:var(--accent);font-weight:600}
table.schedule td.required input:hover{background:#1f1f23}
table.schedule td.required input:focus{background:#1f1f23;outline:1px solid var(--accent);outline-offset:-1px}
/* settings */
.settings-section{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:14px;margin-bottom:14px}
.settings-section h2{margin:0 0 10px;font-size:16px}
.settings-row{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #1f1f23;flex-wrap:wrap}
.settings-row:last-child{border-bottom:none}
.settings-row .grow{flex:1}
.settings-row input{width:auto}
.settings-row input.name-input{min-width:160px}
.settings-row input.num{width:60px}
.settings-row select.person-dept{min-width:96px;padding:6px 10px}
/* 行内确认弹层(贴近触发按钮,替代浏览器原生 confirm/prompt) */
.confirm-popover{position:fixed;z-index:1000;background:linear-gradient(180deg,#1d1d22 0%,#16161a 100%);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px 16px;box-shadow:0 24px 56px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.03) inset,0 1px 0 rgba(255,255,255,0.06) inset;min-width:220px;max-width:300px;font-size:13px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:confirmIn .2s cubic-bezier(0.2,0.8,0.2,1)}
.confirm-popover .confirm-text{color:var(--text);font-weight:600;font-size:14px;margin-bottom:4px;line-height:1.4;letter-spacing:.01em}
.confirm-popover .confirm-sub{color:var(--muted);font-size:12px;margin-bottom:12px;line-height:1.4}
.confirm-popover .confirm-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.confirm-popover button{padding:7px 14px;font-size:12px;font-weight:500;line-height:1;border-radius:7px;transition:transform .12s ease,background .15s,box-shadow .15s;letter-spacing:.01em}
.confirm-popover button:active{transform:scale(0.97)}
.confirm-popover button.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(124,92,255,0.35)}
.confirm-popover button.primary:hover{background:#6a4def;box-shadow:0 4px 12px rgba(124,92,255,0.45)}
.confirm-popover button.danger{background:var(--danger);border-color:var(--danger);color:#fff;box-shadow:0 2px 8px rgba(239,68,68,0.35)}
.confirm-popover button.danger:hover{background:#dc2626;box-shadow:0 4px 12px rgba(239,68,68,0.45)}
.confirm-popover input.confirm-input{width:100%;margin-bottom:10px;padding:9px 11px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:var(--text);font:inherit;font-size:13px;box-sizing:border-box;transition:border-color .15s,background .15s,box-shadow .15s}
.confirm-popover input.confirm-input:focus{border-color:var(--accent);background:rgba(0,0,0,0.45);outline:none;box-shadow:0 0 0 3px rgba(124,92,255,0.15)}
.confirm-popover button.confirm-extra{display:block;width:100%;margin-bottom:10px;padding:8px;font-size:12px;border-radius:8px}
@keyframes confirmIn{from{opacity:0;transform:translateY(-6px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
/* Toast 通知(临时显示,自动消失) */
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:2000;background:linear-gradient(180deg,#1d1d22 0%,#16161a 100%);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:10px 16px;color:var(--text);font-size:13px;font-weight:500;box-shadow:0 12px 32px rgba(0,0,0,0.5);animation:toastIn .25s cubic-bezier(0.2,0.8,0.2,1);display:flex;align-items:center;gap:8px;max-width:90vw}
.toast.success{border-left:3px solid var(--ok)}
.toast.error{border-left:3px solid var(--danger)}
.toast.info{border-left:3px solid var(--accent)}
.toast.hide{animation:toastOut .2s ease-in forwards}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-10px)}}
.settings-row .role-input{min-width:120px}
.settings-row>span,.settings-row>button,.settings-row>select{white-space:nowrap;flex-shrink:0}
.settings-sub-people{padding-left:8px;border-left:2px solid var(--border);margin-top:6px}
/* 手机竖屏:人员行改成 2 行 grid,避免控件被挤压成单字竖排 */
@media (max-width:640px){
  .settings-sub-people .settings-row{
    display:grid;
    grid-template-columns:1fr 1fr auto auto;
    grid-template-areas:
      "role  name  name  name"
      "leave dept  retire del";
    gap:6px 8px;
    align-items:center;
    padding:10px 0
  }
  .settings-sub-people .settings-row>.role-input{grid-area:role;min-width:0;width:100%}
  .settings-sub-people .settings-row>.name-input{grid-area:name;min-width:0;width:100%}
  .settings-sub-people .settings-row>span.grow{display:none}
  /* 「有休残:」label + 数字输入框 同占 leave 区(label 左,input 右) */
  .settings-sub-people .settings-row>span:nth-of-type(1){grid-area:leave;justify-self:start;font-size:12px}
  .settings-sub-people .settings-row>input.num{grid-area:leave;justify-self:end;width:54px}
  /* 「部门:」label + select 同占 dept 区 */
  .settings-sub-people .settings-row>span:nth-of-type(2){grid-area:dept;justify-self:start;font-size:12px}
  .settings-sub-people .settings-row>select.person-dept{grid-area:dept;justify-self:end;min-width:80px;padding:4px 6px}
  /* 辞职 / 删除 按钮 */
  .settings-sub-people .settings-row>button:nth-of-type(1){grid-area:retire;padding:6px 10px}
  .settings-sub-people .settings-row>button.danger{grid-area:del;padding:6px 10px}
}
/* data */
.data-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:14px;margin-bottom:14px}
.data-stats{font-family:var(--font-mono);color:var(--muted);font-size:13px;line-height:1.8}
.data-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
/* print */
@media print {
  @page { size: A4 landscape; margin: 4mm; }
  :root {
    /* iOS Safari forces a URL header + date/page footer into the print area on A4
       landscape, leaving only ~158mm of usable height (not the 198mm of @page margin
       math). Use 155mm to guarantee one page. Use mm — absolute in print. Previously
       `100vh` resolved to the device viewport (≈104mm in landscape) on iOS, clipping
       the table after ~17 rows. */
    --row-h: var(--row-h-fixed, calc(155mm / (var(--total-rows, 30))));
  }
  html, body { background: #fff; color: #000; padding-top: 0 !important; margin: 0 !important; height: 155mm; overflow: hidden; }
  #page-schedule.page { padding: 0 !important; height: 155mm; }
  .schedule-wrap { margin: 0 !important; height: 155mm; }
  .entry-hint { display: none !important; }
  table.schedule td.cell-focus { outline: none !important; }
  .color-palette { display: none !important; }
  /* preserve inline cell colors in print */
  table.schedule td.day-cell { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  /* kill sticky positions in print — iOS Safari / WebKit duplicates / shifts them otherwise */
  table.schedule thead { position: static !important; top: auto !important; box-shadow: none !important; }
  table.schedule th.name-col, table.schedule td.name-col { position: static !important; left: auto !important; }
  /* keep entire table on one page */
  table.schedule { page-break-inside: avoid; break-inside: avoid; }
  table.schedule tr { page-break-inside: avoid; break-inside: avoid; }
  .nav, #page-settings, #page-data, #modal-host, #test-results { display: none !important; }
  #page-schedule { padding: 0; }
  .schedule-wrap { overflow: visible; margin: 0; }
  table.schedule {
    background: #fff;
    width: 100%; height: 100%; table-layout: fixed;
    border-collapse: collapse;
    margin: 0;
  }
  table.schedule th, table.schedule td {
    border: 1px solid #999; padding: 0 2px; color: #000; background: #fff !important;
    line-height: 1 !important;
    height: var(--row-h) !important;
    font-size: calc(var(--row-h) * 0.55) !important;
    box-sizing: border-box;
  }
  table.schedule td.day-cell {
    height: var(--row-h) !important;
    font-size: calc(var(--row-h) * 0.7) !important;
    width: auto !important;
  }
  table.schedule th:not(.role-col):not(.name-col):not(.sum-col):not(.dept-name):not(.month-label) {
    height: var(--row-h) !important;
    width: auto !important;
  }
  table.schedule th.dept-name { font-size: calc(var(--row-h) * 0.65) !important; height: var(--row-h) !important; }
  table.schedule th.month-label { font-size: calc(var(--row-h) * 0.6) !important; height: var(--row-h) !important; }
  table.schedule td.required input { font-size: calc(var(--row-h) * 0.65) !important; }
  table.schedule th { background: #f5f5f5 !important; font-weight: 600; }
  /* clear interactive highlights in print */
  table.schedule tr.hl-row td, table.schedule tr.hl-row th,
  table.schedule td.hl-col, table.schedule th.hl-col,
  table.schedule tr.hl-row td.hl-col, table.schedule tr.hl-row th.hl-col {
    background: #fff !important;
  }
  /* row striping for body rows */
  table.schedule tbody tr:not(.stat-row):nth-child(even) td { background: #fafafa !important; }
  /* stat row bg (overrides striping) */
  table.schedule tr.stat-row td { background: #f5f5f5 !important; }
  table.schedule th.dept-name { text-align: left; padding-left: 6px; font-weight: 700; font-size: 14px; color: #000 !important; background: #fff !important; height: 26px; }
  table.schedule th.month-label { font-weight: 700; font-size: 13px; color: #000 !important; background: #ddd !important; letter-spacing: 2px; height: 26px; }
  /* fixed column widths — total ≈ 1078px (A4 landscape minus 10mm margins) */
  table.schedule col.col-role { width: 70px; }
  table.schedule col.col-name { width: 150px; }
  table.schedule col.col-sum { width: 30px; }
  table.schedule col.col-day { width: auto; }
  table.schedule th.role-col, table.schedule td.role-col { padding-left: 4px; font-size: 12px; }
  table.schedule th.name-col, table.schedule td.name-col { padding-left: 4px; position: static; background: #fff !important; font-size: 12px; }
  table.schedule th.sum-col, table.schedule td.sum-col { width: 32px; color: #000; }
  table.schedule td.sum-col.over { color: #b91c1c !important; font-weight: 700; }
  table.schedule td.sum-col.under { color: #b45309 !important; font-weight: 700; }
  /* day TH columns (no class on them) — width via :not() selector */
  table.schedule th:not(.role-col):not(.name-col):not(.sum-col):not(.dept-name):not(.month-label) { width: 26px; }
  table.schedule td.day-cell { width: 26px; height: var(--print-row-h, 22px); font-size: 13px; padding: 0; }
  table.schedule tbody tr:has(td.day-cell) td { height: var(--print-row-h, 22px); }
  table.schedule td.day-cell.contractRest { color: #000; }
  table.schedule td.day-cell.paidLeave { color: #000; font-weight: 700; background: #ddd !important; }
  table.schedule td.day-cell.retired { color: #888; background: #f5f5f5 !important; }
  table.schedule th.sat { color: #1d4ed8 !important; }
  table.schedule th.sun { color: #b91c1c !important; }
  .today-badge { background: #f97316 !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  table.schedule tr.stat-row td { background: #f5f5f5 !important; height: 22px; font-weight: 600; }
  table.schedule td.required { padding: 0; }
  table.schedule td.required input {
    width: 100%; height: 100%; padding: 0;
    border: none !important; background: transparent !important; color: #000;
    font-size: 12px; font-weight: 600; text-align: center;
    -webkit-appearance: none; appearance: none;
  }
  table.schedule td.required input::-webkit-outer-spin-button,
  table.schedule td.required input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; display: none; }
}
</style>
</head>
<body>
<nav class="nav">
  <span class="brand" data-route="#/schedule" title="返回排班主页">月度总出勤表</span>
  <span id="dept-tabs"></span>
  <span class="spacer"></span>
  <span id="period-nav"></span>
  <span id="dirty-indicator" class="dirty">✓ 已暂存</span>
  <button id="btn-edit-toggle">🔒 锁定</button>
  <button data-route="#/settings">⚙ 设置</button>
  <button data-route="#/data">⬇⬆ 数据</button>
  <button class="primary" id="btn-print">🖨 打印</button>
</nav>
<section id="page-schedule" class="page"></section>
<section id="page-settings" class="page hidden"></section>
<section id="page-data" class="page hidden"></section>
<div id="modal-host"></div>
<div id="test-results" class="hidden"></div>
<script>
'use strict';

const Util = (() => {
  const pad2 = n => String(n).padStart(2,'0');
  const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
  const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate()+n); return r; };
  const newId = (prefix) => prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const clone = obj => JSON.parse(JSON.stringify(obj));
  const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
  return { pad2, ymd, parseYmd, addDays, newId, clone, debounce };
})();

const Holidays = (() => {

const Period = (() => {
  // periodKey: 'YYYY-MM' represents YYYY-MM-16 ~ next month 15
  const WEEKDAY_JP = ['日','月','火','水','木','金','土']; // Date.getDay() → 0..6
  const todayKey = () => {
    const d = new Date();
    if (d.getDate() < 16) {
      const p = new Date(d.getFullYear(), d.getMonth() - 1, 1);
      return `${p.getFullYear()}-${Util.pad2(p.getMonth()+1)}`;
    }
    return `${d.getFullYear()}-${Util.pad2(d.getMonth()+1)}`;
  };
  const range = (key) => {
    const [y, m] = key.split('-').map(Number);
    const start = new Date(y, m - 1, 16);
    const end = new Date(y, m, 15);
    return { start, end };
  };
  const days = (key) => {
    const { start, end } = range(key);
    const out = [];
    for (let d = new Date(start); d <= end; d = Util.addDays(d, 1)) {
      const ymdStr = Util.ymd(d);
      out.push({
        ymd: ymdStr,
        day: d.getDate(),
        weekday: d.getDay(),
        weekdayJp: WEEKDAY_JP[d.getDay()],
        isSat: d.getDay() === 6,
        isSun: d.getDay() === 0,
        isHoliday: Holidays.isHoliday(ymdStr)
      });
    }
    return out;
  };
  const prev = (key) => {
    const [y, m] = key.split('-').map(Number);
    const p = new Date(y, m - 2, 1);
    return `${p.getFullYear()}-${Util.pad2(p.getMonth()+1)}`;
  };
  const next = (key) => {
    const [y, m] = key.split('-').map(Number);
    const n = new Date(y, m, 1);
    return `${n.getFullYear()}-${Util.pad2(n.getMonth()+1)}`;
  };
  const label = (key) => {
    const { start, end } = range(key);
    return `${start.getFullYear()}年${start.getMonth()+1}月${start.getDate()}日 ~ ${end.getMonth()+1}月${end.getDate()}日`;
  };
  return { todayKey, range, days, prev, next, label };
})();

const Store = (() => {
  const KEY = 'monthly-attendance-data-v1';
  const VERSION = 1;

  const defaults = () => ({
    version: VERSION,
    departments: [
      { id: 'dept1', name: '部门 A', requiredCount: 22 },
      { id: 'dept2', name: '部门 B', requiredCount: 22 },
      { id: 'dept3', name: '部门 C', requiredCount: 22 }
    ],
    people: { dept1: [], dept2: [], dept3: [] },
    attendance: {},
    cellColors: {},
    requiredPerDay: {},
    ui: { currentDept: 'dept1', currentPeriod: Period.todayKey(), editMode: false },
    lastExportAt: null
  });

  let state = load();
  const listeners = new Set();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return defaults();
      const parsed = JSON.parse(raw);
      if (parsed.version !== VERSION) return defaults();
      // backward-compat: old field name shortTermDispatch → requiredPerDay
      if (!parsed.requiredPerDay) parsed.requiredPerDay = parsed.shortTermDispatch || {};
      delete parsed.shortTermDispatch;
      if (!parsed.cellColors) parsed.cellColors = {};
      return parsed;
    } catch (_) { return defaults(); }
  }

  const persist = Util.debounce(() => {
    localStorage.setItem(KEY, JSON.stringify(state));
    listeners.forEach(fn => fn('persist'));
  }, 100);

  function commit(reason = 'change') {
    listeners.forEach(fn => fn(reason));
    persist();
  }

  // ---- selectors ----
  const get = () => state;
  const dept = (id = state.ui.currentDept) => state.departments.find(d => d.id === id);
  const people = (deptId = state.ui.currentDept) => state.people[deptId] || [];
  const peopleInPeriod = (deptId = state.ui.currentDept, periodKey = state.ui.currentPeriod) => {
    const all = state.people[deptId] || [];
    const { start, end } = Period.range(periodKey);
    const startYmd = Util.ymd(start);
    const endYmd = Util.ymd(end);
    return all.filter(p => {
      const addedOk = !p.addedOn || p.addedOn <= endYmd;
      const retiredOk = !p.retiredOn || p.retiredOn >= startYmd;
      const removedOk = !p.removedOn || p.removedOn > endYmd;
      return addedOk && retiredOk && removedOk;
    });
  };
  const cellKey = (deptId, personId, ymd) => `${deptId}|${personId}|${ymd}`;
  const dispKey = (deptId, ymd) => `${deptId}|${ymd}`;

  const cellStatus = (deptId, personId, ymd) => {
    const person = people(deptId).find(p => p.id === personId);
    if (person && person.retiredOn && ymd >= person.retiredOn) return 'retired';
    return state.attendance[cellKey(deptId, personId, ymd)] || 'work';
  };

  const DEFAULT_REQUIRED = 22;
  const requiredCount = (deptId, ymd) => {
    const v = state.requiredPerDay[dispKey(deptId, ymd)];
    if (v !== undefined && v !== null) return v;
    const d = dept(deptId);
    return (d && d.requiredCount != null) ? d.requiredCount : DEFAULT_REQUIRED;
  };

  // ---- mutators ----
  function setUi(patch) { Object.assign(state.ui, patch); commit('ui'); }

  function setCell(deptId, personId, ymd, status, color) {
    const k = cellKey(deptId, personId, ymd);
    if (status === 'work') {
      delete state.attendance[k];
      delete state.cellColors[k];
    } else {
      state.attendance[k] = status;
      if (color !== undefined) {
        if (color === null) delete state.cellColors[k];
        else state.cellColors[k] = color;
      }
    }
    commit('cell');
  }

  function cycleCell(deptId, personId, ymd, color) {
    const current = cellStatus(deptId, personId, ymd);
    if (current === 'retired') return;
    const next = current === 'work' ? 'contractRest'
               : current === 'contractRest' ? 'paidLeave'
               : 'work';
    setCell(deptId, personId, ymd, next, color);
  }

  const cellColor = (deptId, personId, ymd) => state.cellColors[cellKey(deptId, personId, ymd)] || null;

  function setRequired(deptId, ymd, n) {
    const k = dispKey(deptId, ymd);
    const raw = String(n).trim();
    if (raw === '') { delete state.requiredPerDay[k]; commit('required'); return; }
    state.requiredPerDay[k] = Math.max(0, Number(n) || 0);
    commit('required');
  }

  // departments
  function addDepartment(name) {
    const id = Util.newId('d');
    state.departments.push({ id, name, requiredCount: 10 });
    state.people[id] = [];
    commit('dept');
    return id;
  }
  function renameDepartment(id, name) {
    const d = state.departments.find(x => x.id === id);
    if (d) { d.name = name; commit('dept'); }
  }
  function setDeptRequired(id, n) {
    const d = state.departments.find(x => x.id === id);
    if (d) { d.requiredCount = Math.max(0, Number(n) || 0); commit('dept'); }
  }
  function removeDepartment(id) {
    state.departments = state.departments.filter(d => d.id !== id);
    delete state.people[id];
    for (const k of Object.keys(state.attendance)) if (k.startsWith(id + '|')) delete state.attendance[k];
    for (const k of Object.keys(state.requiredPerDay)) if (k.startsWith(id + '|')) delete state.requiredPerDay[k];
    if (state.ui.currentDept === id) state.ui.currentDept = state.departments[0]?.id || null;
    commit('dept');
  }

  // people
  function addPerson(deptId, person) {
    const { start } = Period.range(state.ui.currentPeriod);
    const defaultAddedOn = Util.ymd(start);
    const p = { id: Util.newId('p'), name: '', role: '', annualLeaveInit: 0, retiredOn: null, addedOn: defaultAddedOn, ...person };
    (state.people[deptId] = state.people[deptId] || []).push(p);
    commit('people');
    return p.id;
  }
  function updatePerson(deptId, personId, patch) {
    const list = state.people[deptId] || [];
    const i = list.findIndex(p => p.id === personId);
    if (i >= 0) { list[i] = { ...list[i], ...patch }; commit('people'); }
  }
  // soft-remove: keeps the person record + all historical attendance.
  // The person disappears from periods after `removedOn`, past periods still show them.
  function removePerson(deptId, personId) {
    const list = state.people[deptId] || [];
    const i = list.findIndex(p => p.id === personId);
    if (i >= 0) {
      const { start } = Period.range(state.ui.currentPeriod);
      list[i] = { ...list[i], removedOn: Util.ymd(start) };
      commit('people');
    }
  }
  // hard delete: nukes the person + all their attendance records. Use with care.
  function purgePerson(deptId, personId) {
    state.people[deptId] = (state.people[deptId] || []).filter(p => p.id !== personId);
    for (const k of Object.keys(state.attendance)) if (k.startsWith(`${deptId}|${personId}|`)) delete state.attendance[k];
    commit('people');
  }
  // transfer: 把人员从原部门调到新部门。原部门设 removedOn=今天(过去周期保留),
  // 新部门添加一份(新 id,addedOn=今天,清空 retiredOn)。
  // 不修改 attendance,原部门历史排班按原 personId 保留。
  function transferPerson(fromDeptId, personId, toDeptId) {
    if (fromDeptId === toDeptId) return;
    const fromList = state.people[fromDeptId] || [];
    const i = fromList.findIndex(p => p.id === personId);
    if (i < 0) return;
    const orig = fromList[i];
    const today = Util.ymd(new Date());
    fromList[i] = { ...orig, removedOn: today };
    (state.people[toDeptId] = state.people[toDeptId] || []).push({
      ...orig,
      id: Util.newId('p'),
      addedOn: today,
      removedOn: null,
      retiredOn: null
    });
    commit('people');
  }

  // data
  function exportJson() {
    state.lastExportAt = new Date().toISOString();
    commit('export');
    return JSON.stringify(state, null, 2);
  }
  function importJson(json) {
    const parsed = JSON.parse(json);
    if (parsed.version !== VERSION) throw new Error('版本不兼容');
    state = parsed;
    // 校正 UI 状态:导入数据的 currentDept / currentPeriod 可能在新数据集里不存在,
    // 不修正会让排班页拿不到部门数据而显示空白。
    if (!state.ui) state.ui = { currentDept: null, currentPeriod: Period.todayKey(), editMode: false };
    if (!state.departments.find(d => d.id === state.ui.currentDept)) {
      state.ui.currentDept = state.departments[0]?.id || null;
    }
    if (!state.ui.currentPeriod) state.ui.currentPeriod = Period.todayKey();
    commit('import');
  }
  function reset() { state = defaults(); commit('reset'); }

  function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }

  return {
    get, dept, people, peopleInPeriod, cellStatus, cellColor, requiredCount,
    setUi, setCell, cycleCell, setRequired,
    addDepartment, renameDepartment, setDeptRequired, removeDepartment,
    addPerson, updatePerson, removePerson, purgePerson, transferPerson,
    exportJson, importJson, reset, subscribe
  };
})();

const Render = (() => {
  function el(tag, attrsOrChildren, children) {
    let attrs = {};
    if (Array.isArray(attrsOrChildren) || typeof attrsOrChildren === 'string') {
      children = attrsOrChildren;
    } else if (attrsOrChildren && typeof attrsOrChildren === 'object' && attrsOrChildren.nodeType === undefined) {
      attrs = attrsOrChildren;
    }
    const [name, ...rest] = tag.split(/(?=[.#])/);
    const node = document.createElement(name);
    for (const part of rest) {
      if (part.startsWith('.')) node.classList.add(part.slice(1));
      else if (part.startsWith('#')) node.id = part.slice(1);
    }
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'class') node.className += ' ' + v;
      else if (k === 'dataset') Object.assign(node.dataset, v);
      else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
      else node.setAttribute(k, v);
    }
    if (children != null) {
      const arr = Array.isArray(children) ? children : [children];
      for (const c of arr) {
        if (c == null || c === false) continue;
        node.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
      }
    }
    return node;
  }
  const clear = (node) => { while (node.firstChild) node.removeChild(node.firstChild); };
  const mount = (host, node) => { clear(host); host.appendChild(node); };
  return { el, clear, mount };
})();

const App = (() => {
  const routes = {
    '#/schedule': 'page-schedule',
    '#/settings': 'page-settings',
    '#/data': 'page-data'
  };

  function showRoute() {
    const hash = location.hash in routes ? location.hash : '#/schedule';
    for (const [r, id] of Object.entries(routes)) {
      document.getElementById(id).classList.toggle('hidden', r !== hash);
    }
    if (hash === '#/schedule') Pages.renderSchedule();
    else if (hash === '#/settings') Pages.renderSettings();
    else if (hash === '#/data') Pages.renderData();
  }

  function updateDirtyIndicator() {
    const el = document.getElementById('dirty-indicator');
    const lastExport = Store.get().lastExportAt;
    if (lastExport) {
      const days = (Date.now() - new Date(lastExport).getTime()) / 86400000;
      if (days >= 7) { el.textContent = `⚠ ${Math.floor(days)} 天未导出`; el.classList.add('warn'); return; }
    }
    el.textContent = '✓ 已暂存';
    el.classList.remove('warn');
  }

  function bindNav() {
    document.querySelectorAll('[data-route]').forEach(b => {
      b.addEventListener('click', () => {
        if (b.dataset.route === '#/schedule') {
          history.replaceState(null, '', location.pathname + location.search);
          showRoute();
        } else {
          location.hash = b.dataset.route;
        }
      });
    });
    document.getElementById('btn-print').addEventListener('click', () => window.print());
    document.getElementById('btn-edit-toggle').addEventListener('click', () => {
      Store.setUi({ editMode: !Store.get().ui.editMode });
    });
    window.addEventListener('hashchange', showRoute);
  }

  function updateEditUI() {
    const editing = !!Store.get().ui.editMode;
    document.body.classList.toggle('editing', editing);
    const btn = document.getElementById('btn-edit-toggle');
    btn.textContent = editing ? '✏ 编辑中' : '🔒 锁定';
    btn.classList.toggle('primary', editing);
  }

  let originalTitle = '';
  function buildPrintTitle() {
    const d = Store.dept();
    const period = Store.get().ui.currentPeriod;
    const { start, end } = Period.range(period);
    const y = start.getFullYear();
    const m1 = Util.pad2(start.getMonth() + 1);
    const m2 = Util.pad2(end.getMonth() + 1);
    return `${d ? d.name : ''}月度出勤表${y}${m1}16-${m2}15`;
  }

  function init() {
    bindNav();
    showRoute();
    updateDirtyIndicator();
    updateEditUI();
    Store.subscribe(() => { showRoute(); updateDirtyIndicator(); updateEditUI(); });
    window.addEventListener('beforeprint', () => {
      originalTitle = document.title;
      document.title = buildPrintTitle();
      const peopleN = Store.peopleInPeriod().length;
      const totalRows = 3 + peopleN + 3;
      document.documentElement.style.setProperty('--total-rows', String(totalRows));
      const isMobile =
        /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent) ||
        (navigator.maxTouchPoints > 1) ||
        (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
      if (!isMobile) return;
      // Brute force: apply inline !important styles to every cell. Bypasses @media print
      // evaluation which iOS Safari sometimes skips. Use mm so iOS doesn't mis-resolve
      // `100vh` to the device viewport. 155mm caps content under Safari's URL header +
      // date/page footer (which eat ~40mm on A4 landscape).
      const BODY_H_MM = 155;
      const TABLE_H_MM = 153;
      const rH = TABLE_H_MM / totalRows; // mm per row
      // Pin body / page / wrap to A4 content height in mm — overrides screen `100vh`.
      document.documentElement.style.setProperty('height', `${BODY_H_MM}mm`, 'important');
      document.body.style.setProperty('height', `${BODY_H_MM}mm`, 'important');
      document.body.style.setProperty('overflow', 'hidden', 'important');
      const pageEl = document.getElementById('page-schedule');
      const wrapEl = document.querySelector('#page-schedule .schedule-wrap');
      if (pageEl) pageEl.style.setProperty('height', `${BODY_H_MM}mm`, 'important');
      if (wrapEl) wrapEl.style.setProperty('height', `${BODY_H_MM}mm`, 'important');
      const cells = document.querySelectorAll('#page-schedule table.schedule th, #page-schedule table.schedule td');
      cells.forEach(c => {
        c.style.setProperty('height', `${rH.toFixed(3)}mm`, 'important');
        c.style.setProperty('line-height', '1', 'important');
        c.style.setProperty('padding-top', '0', 'important');
        c.style.setProperty('padding-bottom', '0', 'important');
        let fontMul = 0.55;
        if (c.classList.contains('day-cell')) fontMul = 0.7;
        else if (c.classList.contains('dept-name')) fontMul = 0.65;
        else if (c.classList.contains('month-label')) fontMul = 0.6;
        else if (c.classList.contains('name-col') || c.classList.contains('role-col')) fontMul = 0.55;
        c.style.setProperty('font-size', `${(rH * fontMul).toFixed(3)}mm`, 'important');
      });
      const inputs = document.querySelectorAll('#page-schedule table.schedule td.required input');
      inputs.forEach(i => i.style.setProperty('font-size', `${(rH * 0.65).toFixed(3)}mm`, 'important'));
    });
    window.addEventListener('afterprint', () => {
      if (originalTitle) document.title = originalTitle;
      document.documentElement.style.removeProperty('--total-rows');
      document.documentElement.style.removeProperty('--row-h-fixed');
      // Clean up brute-force inline styles
      document.documentElement.style.removeProperty('height');
      document.body.style.removeProperty('height');
      document.body.style.removeProperty('overflow');
      const pageEl = document.getElementById('page-schedule');
      const wrapEl = document.querySelector('#page-schedule .schedule-wrap');
      if (pageEl) pageEl.style.removeProperty('height');
      if (wrapEl) wrapEl.style.removeProperty('height');
      const cells = document.querySelectorAll('#page-schedule table.schedule th, #page-schedule table.schedule td');
      cells.forEach(c => {
        c.style.removeProperty('height');
        c.style.removeProperty('font-size');
        c.style.removeProperty('line-height');
        c.style.removeProperty('padding-top');
        c.style.removeProperty('padding-bottom');
      });
      document.querySelectorAll('#page-schedule table.schedule td.required input').forEach(i => {
        i.style.removeProperty('font-size');
      });
    });
  }

  return { init, showRoute };
})();

const Pages = (() => {
  const highlightedRows = new Set();   // personId
  const highlightedCols = new Set();   // ymd
  let focusedCell = null;              // { personId, ymd } or null
  let activeColor = null;              // 'red'|'orange'|'yellow'|'green'|'blue'|'purple' or null
  const COLOR_MAP = {
    red: '#dc2626', orange: '#ea580c', yellow: '#ca8a04',
    green: '#16a34a', blue: '#2563eb', purple: '#9333ea'
  };
  function setActiveColor(c) { activeColor = (activeColor === c) ? null : c; renderPalette(); }

  function setFocus(personId, ymd) {
    const days = Period.days(Store.get().ui.currentPeriod);
    if (!days.find(d => d.ymd === ymd)) return;
    const ppl = Store.peopleInPeriod();
    if (!ppl.find(p => p.id === personId)) return;
    focusedCell = { personId, ymd };
    applyFocus();
  }

  function applyFocus() {
    document.querySelectorAll('.cell-focus').forEach(el => el.classList.remove('cell-focus'));
    if (!focusedCell) return;
    const sel = `td.day-cell[data-person="${focusedCell.personId}"][data-ymd="${focusedCell.ymd}"]`;
    const cell = document.querySelector(sel);
    if (cell) cell.classList.add('cell-focus');
  }

  function moveFocus(dx, dy) {
    if (!focusedCell) return;
    const days = Period.days(Store.get().ui.currentPeriod);
    const ppl = Store.peopleInPeriod();
    const di = days.findIndex(d => d.ymd === focusedCell.ymd);
    const pi = ppl.findIndex(p => p.id === focusedCell.personId);
    const newDi = Math.max(0, Math.min(days.length - 1, di + dx));
    const newPi = Math.max(0, Math.min(ppl.length - 1, pi + dy));
    focusedCell = { personId: ppl[newPi].id, ymd: days[newDi].ymd };
    applyFocus();
  }

  function setFocusedState(status) {
    if (!focusedCell) return;
    const deptId = Store.get().ui.currentDept;
    const days = Period.days(Store.get().ui.currentPeriod);
    const di = days.findIndex(d => d.ymd === focusedCell.ymd);
    const cur = { ...focusedCell };
    // advance focus first so re-render picks it up
    if (di < days.length - 1) {
      focusedCell = { personId: cur.personId, ymd: days[di + 1].ymd };
    }
    const st = Store.cellStatus(deptId, cur.personId, cur.ymd);
    if (st !== 'retired') {
      Store.setCell(deptId, cur.personId, cur.ymd, status, activeColor);
    } else {
      applyFocus();
    }
  }

  function toggleRow(personId) {
    if (highlightedRows.has(personId)) highlightedRows.delete(personId);
    else highlightedRows.add(personId);
    applyHighlight();
  }
  function toggleCol(ymd) {
    if (highlightedCols.has(ymd)) highlightedCols.delete(ymd);
    else highlightedCols.add(ymd);
    applyHighlight();
  }

  function applyHighlight() {

    const swatches = [
      { c: null, tag: 'button.swatch.swatch-clear', label: '×', title: '无色(默认)' },

  // global keyboard speed entry
  document.addEventListener('keydown', (e) => {
    if (!Store.get().ui.editMode || !focusedCell) return;
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    const k = e.key;
    if (k === '1') { setFocusedState('contractRest'); e.preventDefault(); }
    else if (k === '2') { setFocusedState('paidLeave'); e.preventDefault(); }
    else if (k === '3' || k === '0' || k === ' ') { setFocusedState('work'); e.preventDefault(); }
    else if (k === 'ArrowRight' || (k === 'Tab' && !e.shiftKey)) { moveFocus(1, 0); e.preventDefault(); }
    else if (k === 'ArrowLeft' || (k === 'Tab' && e.shiftKey)) { moveFocus(-1, 0); e.preventDefault(); }
    else if (k === 'ArrowDown') { moveFocus(0, 1); e.preventDefault(); }
    else if (k === 'ArrowUp') { moveFocus(0, -1); e.preventDefault(); }
    else if (k === 'Enter') {
      const ppl = Store.peopleInPeriod();
      const days = Period.days(Store.get().ui.currentPeriod);
      const pi = ppl.findIndex(p => p.id === focusedCell.personId);
      if (pi >= 0 && pi < ppl.length - 1) {
        focusedCell = { personId: ppl[pi + 1].id, ymd: days[0].ymd };
        applyFocus();
      }
      e.preventDefault();
    } else if (k === 'Escape') {
      focusedCell = null;
      applyFocus();
      e.preventDefault();
    }
  });

  function buildTable() {
    const wrap = Render.el('div.schedule-wrap');
    const tbl = Render.el('table.schedule');
    const days = Period.days(Store.get().ui.currentPeriod);
    const todayYmd = Util.ymd(new Date());
    tbl.appendChild(buildColgroup(days));
    tbl.appendChild(buildHeader(days, todayYmd));
    tbl.appendChild(buildBody(days, todayYmd));
    wrap.appendChild(tbl);
    // dynamic print row-height based on people count
    const peopleN = Store.peopleInPeriod(Store.get().ui.currentDept).length;
    const AVAIL = 560;
    const MIN = 14, MAX = 31;
    const rowH = Math.max(MIN, Math.min(MAX, Math.round(AVAIL / Math.max(1, peopleN))));
    wrap.style.setProperty('--print-row-h', rowH + 'px');
    // For mobile/touch devices, generate a print-specific <style> tag with hardcoded pixel
    // heights. Bypass CSS variables — iOS Safari may not resolve them correctly in print.
    const isMobile =
      /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent) ||
      (navigator.maxTouchPoints > 1) ||
      (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
    let mobileStyle = document.getElementById('mobile-print-style');
    if (isMobile) {
      const totalRows = 3 + peopleN + 3;
      // iOS Safari evaluates `100vh` as the device viewport (≈104mm in landscape),
      // not the A4 page height. Use mm — absolute in print, immune to that bug.
      // 155mm caps content under iOS Safari's URL header + date/page footer (which
      // together eat ~40mm out of the 202mm @page content area on A4 landscape).
      const BODY_H_MM = 155;
      const TABLE_H_MM = 153;
      const rH = TABLE_H_MM / totalRows; // mm per row
      if (!mobileStyle) {
        mobileStyle = document.createElement('style');
        mobileStyle.id = 'mobile-print-style';
        document.head.appendChild(mobileStyle);
      }
      mobileStyle.textContent = `
        @media print {
          html, body { height: ${BODY_H_MM}mm !important; overflow: hidden !important; }
          #page-schedule.page { height: ${BODY_H_MM}mm !important; }
          .schedule-wrap { height: ${BODY_H_MM}mm !important; }
          table.schedule th, table.schedule td {
            height: ${rH.toFixed(3)}mm !important;
            font-size: ${(rH * 0.55).toFixed(3)}mm !important;
            line-height: 1 !important;
            padding-top: 0 !important; padding-bottom: 0 !important;
          }
          table.schedule td.day-cell { font-size: ${(rH * 0.7).toFixed(3)}mm !important; }
          table.schedule th.dept-name { font-size: ${(rH * 0.65).toFixed(3)}mm !important; }
          table.schedule th.month-label { font-size: ${(rH * 0.6).toFixed(3)}mm !important; }
          table.schedule td.required input { font-size: ${(rH * 0.65).toFixed(3)}mm !important; }
          table.schedule th.name-col, table.schedule td.name-col { font-size: ${Math.min(2.9, rH * 0.6).toFixed(3)}mm !important; }
          table.schedule th.role-col, table.schedule td.role-col { font-size: ${Math.min(2.9, rH * 0.6).toFixed(3)}mm !important; }
        }
      `;
    } else if (mobileStyle) {
      mobileStyle.textContent = '';
    }
    return wrap;
  }

  function buildColgroup(days) {
    const cg = Render.el('colgroup');
    cg.appendChild(Render.el('col.col-role'));
    cg.appendChild(Render.el('col.col-name'));
    cg.appendChild(Render.el('col.col-sum'));
    cg.appendChild(Render.el('col.col-sum'));
    cg.appendChild(Render.el('col.col-sum'));
    for (let i = 0; i < days.length; i++) cg.appendChild(Render.el('col.col-day'));

  function buildHeader(days, todayYmd) {
    const thead = Render.el('thead');

    // Row 0: dept name (over 5 summary cols) + month-grouping cells
    const r0 = Render.el('tr.month-row');
    const curDept = Store.dept();
    r0.appendChild(Render.el('th.dept-name', { colspan: 5 }, curDept ? curDept.name : ''));
    let groupStart = 0;
    let currentMonth = parseInt(days[0].ymd.slice(5, 7), 10);
    for (let i = 1; i <= days.length; i++) {
      const month = i < days.length ? parseInt(days[i].ymd.slice(5, 7), 10) : null;
      if (i === days.length || month !== currentMonth) {
        r0.appendChild(Render.el('th.month-label', { colspan: i - groupStart }, `${currentMonth}月`));
        groupStart = i;
        currentMonth = month;
      }
    }
    thead.appendChild(r0);

    const r1 = Render.el('tr.head-row');
    r1.appendChild(Render.el('th.role-col', { rowspan: 2 }, '役職'));
    r1.appendChild(Render.el('th.name-col', { rowspan: 2 }, '氏名'));
    r1.appendChild(Render.el('th.sum-col', { rowspan: 2 }, '有休'));
    r1.appendChild(Render.el('th.sum-col', { rowspan: 2 }, '契休'));
    r1.appendChild(Render.el('th.sum-col', { rowspan: 2 }, '残'));
    for (const d of days) {
      const content = d.ymd === todayYmd
        ? Render.el('span.today-badge', String(d.day))
        : String(d.day);
      const th = Render.el('th', { dataset: { ymd: d.ymd }, onclick: () => toggleCol(d.ymd) }, content);
      if (d.isSat) th.classList.add('sat');
      if (d.isSun || d.isHoliday) th.classList.add('sun');
      r1.appendChild(th);
    }
    thead.appendChild(r1);
    const r2 = Render.el('tr.weekday-row');
    for (const d of days) {
      const th = Render.el('th', { dataset: { ymd: d.ymd }, onclick: () => toggleCol(d.ymd) }, d.weekdayJp);
      if (d.isSat) th.classList.add('sat');
      if (d.isSun || d.isHoliday) th.classList.add('sun');
      r2.appendChild(th);
    }
    thead.appendChild(r2);
    return thead;
  }

  function buildBody(days, todayYmd) {
    const tbody = Render.el('tbody');
    const deptId = Store.get().ui.currentDept;
    const periodKey = Store.get().ui.currentPeriod;
    const people = Store.peopleInPeriod(deptId, periodKey);

    if (people.length === 0) {
      tbody.appendChild(Render.el('tr',
        Render.el('td', { colspan: 5 + days.length, style: { padding: '12px', color: 'var(--muted)', textAlign: 'center' } },
          '本部门暂无人员，请到「⚙ 设置」添加')));
      return tbody;
    }

    for (const p of people) {
      const tr = Render.el('tr', { dataset: { personId: p.id } });
      tr.appendChild(Render.el('td.role-col', p.role || ''));
      tr.appendChild(Render.el('td.name-col', { onclick: () => toggleRow(p.id) }, p.name || ''));

      const sums = computeSums(deptId, p, periodKey, days);
      tr.appendChild(Render.el('td.sum-col', String(sums.paid)));
      const contractTd = Render.el('td.sum-col', String(sums.contract));
      if (sums.restCount > sums.contract) contractTd.classList.add('over');
      else if (sums.restCount < sums.contract) contractTd.classList.add('under');
      tr.appendChild(contractTd);
      tr.appendChild(Render.el('td.sum-col', String(sums.remaining)));

      for (const d of days) {
        const st = Store.cellStatus(deptId, p.id, d.ymd);
        const td = Render.el('td.day-cell',
          { dataset: { person: p.id, ymd: d.ymd } },
          st === 'contractRest' ? '〇' : st === 'paidLeave' ? '●' : st === 'retired' ? '✲' : ''
        );
        td.classList.add(st);
        const c = Store.cellColor(deptId, p.id, d.ymd);
        if (c && COLOR_MAP[c]) td.style.color = COLOR_MAP[c];
        if (st !== 'retired') {
          td.addEventListener('click', () => {
            if (!Store.get().ui.editMode) return;
            focusedCell = { personId: p.id, ymd: d.ymd };
            Store.cycleCell(deptId, p.id, d.ymd, activeColor);
          });
        }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }

    for (const row of buildStatRows(deptId, days)) tbody.appendChild(row);
    return tbody;
  }

  function computeSums(deptId, person, periodKey, days) {
    let paid = 0, restCount = 0;
    for (const d of days) {
      const st = Store.cellStatus(deptId, person.id, d.ymd);
      if (st === 'paidLeave') paid++;
      else if (st === 'contractRest') restCount++;
    }
    const contract = days.length >= 31 ? 9 : 8;
    return { paid, contract, restCount, remaining: (person.annualLeaveInit || 0) - paid };
  }

  function buildStatRows(deptId, days) {
    const out = [];
    const lineTotals = days.map(d => computeLineTotal(deptId, d.ymd));
    const requireds = days.map(d => Store.requiredCount(deptId, d.ymd));

    // Row 1: 必要人数 (editable, default 22)
    const r1 = Render.el('tr.stat-row');
    r1.appendChild(Render.el('td.label', { colspan: 5 }, '必要人数'));
    const editing = Store.get().ui.editMode;
    for (let i = 0; i < days.length; i++) {
      const td = Render.el('td.required', { dataset: { ymd: days[i].ymd } });
      const input = Render.el('input', {
        type: 'number',
        min: '0',
        value: String(requireds[i]),
        readonly: editing ? null : true,
        onchange: editing ? (e) => Store.setRequired(deptId, days[i].ymd, e.target.value) : null,
        onfocus: (e) => e.target.select()
      });
      td.appendChild(input);
      r1.appendChild(td);
    }
    out.push(r1);

    // Row 2: ライン合計 (auto)
    const r2 = Render.el('tr.stat-row');
    r2.appendChild(Render.el('td.label', { colspan: 5 }, 'ライン合計'));
    for (let i = 0; i < days.length; i++) r2.appendChild(Render.el('td', { dataset: { ymd: days[i].ymd } }, String(lineTotals[i])));
    out.push(r2);

    // Row 3: 派遣短期 = 必要人数 − ライン合計
    const r3 = Render.el('tr.stat-row');
    r3.appendChild(Render.el('td.label', { colspan: 5 }, '派遣短期'));
    for (let i = 0; i < days.length; i++) {
      const gap = requireds[i] - lineTotals[i];
      const td = Render.el('td', { dataset: { ymd: days[i].ymd } }, String(gap));
      if (gap > 0) td.style.color = 'var(--danger)';
      else if (gap < 0) td.style.color = 'var(--muted)';
      r3.appendChild(td);
    }
    out.push(r3);

    return out;
  }

  function computeLineTotal(deptId, ymd) {
    let total = 0;
    const periodKey = Store.get().ui.currentPeriod;
    for (const p of Store.peopleInPeriod(deptId, periodKey)) {
      if (Store.cellStatus(deptId, p.id, ymd) === 'work') total++;
    }
    return total;
  }

  function buildPersonRow(deptId, p) {
    const row = Render.el('div.settings-row', { dataset: { pid: p.id } });
    row.appendChild(Render.el('input.role-input', {
      placeholder: '役職', value: p.role || '',
      onchange: (e) => Store.updatePerson(deptId, p.id, { role: e.target.value })
    }));
    row.appendChild(Render.el('input.name-input', {
      placeholder: '氏名', value: p.name || '',
      onchange: (e) => Store.updatePerson(deptId, p.id, { name: e.target.value })
    }));
    row.appendChild(Render.el('span', { style: { color: 'var(--muted)' } }, '有休残:'));
    row.appendChild(Render.el('input.num', {
      type: 'number', min: '0', value: String(p.annualLeaveInit || 0),
      onchange: (e) => Store.updatePerson(deptId, p.id, { annualLeaveInit: Number(e.target.value) || 0 })
    }));
    // 部门下拉:选其他部门即调部门(原部门保留历史,新部门从今天起入职)
    row.appendChild(Render.el('span', { style: { color: 'var(--muted)' } }, '部门:'));
    const deptSelect = Render.el('select.person-dept');
    for (const d of Store.get().departments) {
      deptSelect.appendChild(Render.el('option', { value: d.id }, d.name));
    }
    deptSelect.value = deptId;
    deptSelect.addEventListener('change', (e) => {
      const newDeptId = e.target.value;
      if (newDeptId === deptId) return;
      const newDept = Store.get().departments.find(d => d.id === newDeptId);
      showConfirmPopover(deptSelect, {
        text: `调到「${newDept.name}」?`,
        sub: `${p.name || '该人员'} · 原部门历史保留`,
        confirmText: '调动',
        onConfirm: () => Store.transferPerson(deptId, p.id, newDeptId),
        onCancel: () => { deptSelect.value = deptId; }  // 取消时还原 select 显示
      });
    });
    row.appendChild(deptSelect);

    row.appendChild(Render.el('span.grow'));

    // 辞职按钮:设置 retiredOn,从该日起单元格显示 ✲。用 popover 统一确认/输入风格。
    const retireLabel = p.retiredOn ? `✲ ${p.retiredOn}` : '辞职';
    const retireBtn = Render.el('button', {
      title: p.retiredOn ? `已辞职 ${p.retiredOn} (点击修改/取消)` : '设置中途辞职日期'
    }, retireLabel);
    retireBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const today = Util.ymd(new Date());
      const cur = p.retiredOn || today;
      showConfirmPopover(retireBtn, {
        text: p.retiredOn ? '修改辞职日期' : '设置辞职日期',
        sub: p.name || '该人员',
        input: { type: 'date', value: cur },
        // 已辞职时提供「取消辞职」快捷按钮,等同于清空 retiredOn
        extra: p.retiredOn ? {
          text: '✕ 取消辞职',
          danger: true,
          onClick: () => Store.updatePerson(deptId, p.id, { retiredOn: null })
        } : null,
        confirmText: '保存',
        onConfirm: (v) => {
          if (!v) return; // date input 留空(理论上 iOS 不允许)
          Store.updatePerson(deptId, p.id, { retiredOn: v });
        }
      });
    });
    row.appendChild(retireBtn);

    // 删除按钮:软删除(从当前周期起隐藏,之前周期保留)
    const delBtn = Render.el('button.danger', {
      title: '从名单中删除(之前周期的出勤记录保留)'
    }, '删除');
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      showConfirmPopover(delBtn, {
        text: `删除 ${p.name || '该人员'}?`,
        sub: '之前周期的出勤记录保留',
        confirmText: '删除',
        danger: true,
        onConfirm: () => Store.removePerson(deptId, p.id)
      });
    });
    row.appendChild(delBtn);
    return row;
  }

  // 通用行内确认弹层。anchor 是触发按钮,popover 定位在它上方(空间不足时翻到下方)。
  // opts: { text, sub, confirmText, cancelText, danger, onConfirm,
  //         input?: { type, value, placeholder },  // 有则显示输入框,onConfirm 收到值
  //         extra?: { text, danger, onClick }       // 可选的额外操作按钮(如「取消辞职」)
  //       }
  function showConfirmPopover(anchor, opts) {
    document.querySelectorAll('.confirm-popover').forEach(el => el.remove());
    const pop = Render.el('div.confirm-popover');
    pop.appendChild(Render.el('div.confirm-text', opts.text || '确认?'));
    if (opts.sub) pop.appendChild(Render.el('div.confirm-sub', opts.sub));

    // 可选输入框
    let inputEl = null;
    if (opts.input) {
      inputEl = Render.el('input.confirm-input', {
        type: opts.input.type || 'text',
        value: opts.input.value || '',
        placeholder: opts.input.placeholder || ''
      });
      pop.appendChild(inputEl);
    }

    // 可选额外按钮(整行宽度,放在 input 和操作按钮之间)
    if (opts.extra) {
      const extraBtn = Render.el(opts.extra.danger ? 'button.confirm-extra.danger' : 'button.confirm-extra', {
        onclick: (e) => { e.stopPropagation(); close(); opts.extra.onClick && opts.extra.onClick(); }
      }, opts.extra.text);
      pop.appendChild(extraBtn);
    }

    const actions = Render.el('div.confirm-actions');
    let confirmed = false;
    const doConfirm = () => {
      const v = inputEl ? inputEl.value : null;
      confirmed = true;
      close();
      opts.onConfirm && opts.onConfirm(v);
    };
    const yesBtn = Render.el(opts.danger ? 'button.danger' : 'button.primary', {
      onclick: (e) => { e.stopPropagation(); doConfirm(); }
    }, opts.confirmText || '确认');
    const noBtn = Render.el('button', {
      onclick: (e) => { e.stopPropagation(); close(); }
    }, opts.cancelText || '取消');
    actions.appendChild(noBtn);
    actions.appendChild(yesBtn);
    pop.appendChild(actions);

    if (inputEl) {
      inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); doConfirm(); }
      });
    }

    document.body.appendChild(pop);
    // 定位:默认 anchor 左侧,左侧空间不足翻到右侧;垂直对齐 anchor 中线且不溢出视口
    const r = anchor.getBoundingClientRect();
    const pr = pop.getBoundingClientRect();
    const margin = 8;
    let left = r.left - pr.width - margin;
    if (left < margin) left = r.right + margin;
    if (left + pr.width > window.innerWidth - margin) left = Math.max(margin, window.innerWidth - pr.width - margin);
    let top = r.top + r.height / 2 - pr.height / 2;
    if (top < margin) top = margin;
    if (top + pr.height > window.innerHeight - margin) top = window.innerHeight - pr.height - margin;
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';

    const close = () => {
      pop.remove();
      document.removeEventListener('click', onDocClick, true);
      document.removeEventListener('keydown', onKey, true);
      window.removeEventListener('scroll', close, true);
      // 只有「未确认」(即取消 / 外部点击 / Esc / 滚动)才触发 onCancel
      if (!confirmed && opts.onCancel) opts.onCancel();
    };
    const onDocClick = (e) => { if (!pop.contains(e.target)) close(); };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    setTimeout(() => {
      document.addEventListener('click', onDocClick, true);
      document.addEventListener('keydown', onKey, true);
      window.addEventListener('scroll', close, true);
      if (inputEl) inputEl.focus();
    }, 0);
  }

  // Toast 通知:从顶部滑入,2.5 秒自动消失。替代 alert 用于非阻塞反馈。
  function showToast(msg, type) {
    document.querySelectorAll('.toast').forEach(el => el.remove());
    const toast = Render.el(`div.toast.${type || 'info'}`, msg);
    document.body.appendChild(toast);
    setTimeout(() => {
      toast.classList.add('hide');
      setTimeout(() => toast.remove(), 250);
    }, 2500);
  }

  function buildPersonAddRow(deptId) {
    const row = Render.el('div.settings-row');

    const showButton = () => {
      Render.clear(row);
      row.appendChild(Render.el('button.primary', {
        onclick: showInput
      }, '+ 新增人员'));
    };

    const showInput = () => {
      Render.clear(row);
      const input = Render.el('input.name-input', {
        type: 'text',
        placeholder: '新人员姓名',
        style: { flex: '1', minWidth: '0' }
      });
      const submit = () => {
        const name = input.value.trim();
        if (!name) { input.focus(); return; }
        // 保存滚动位置:整页重建后立即恢复,避免视觉跳动。
        const sy = window.scrollY;
        Store.addPerson(deptId, { name, role: '', annualLeaveInit: 0 });
        requestAnimationFrame(() => window.scrollTo(0, sy));
      };
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); submit(); }
        else if (e.key === 'Escape') { e.preventDefault(); showButton(); }
      });
      row.appendChild(input);
      row.appendChild(Render.el('button.primary', { onclick: submit }, '确认'));
      row.appendChild(Render.el('button', { onclick: showButton }, '取消'));
      // 等 DOM 挂载后 focus(setTimeout 0 让浏览器先完成布局,避免 iOS 键盘弹起时位置错乱)
      setTimeout(() => input.focus(), 0);
    };

    showButton();
    return row;
  }

  // ---- data page ----
  function renderData() {
    const host = document.getElementById('page-data');
    Render.clear(host);
    const s = Store.get();
    const card = Render.el('div.data-card');
    card.appendChild(Render.el('h2', { style: { marginTop: 0 } }, '数据管理'));

    const peopleCount = Object.values(s.people).reduce((sum, arr) => sum + arr.length, 0);
    const stats = Render.el('div.data-stats');
    stats.appendChild(Render.el('div', `部门数：${s.departments.length}`));
    stats.appendChild(Render.el('div', `人员总数：${peopleCount}`));
    stats.appendChild(Render.el('div', `排班记录条数：${Object.keys(s.attendance).length}`));
    stats.appendChild(Render.el('div', `必要人数覆盖条数：${Object.keys(s.requiredPerDay).length}（其余按默认 22）`));
    stats.appendChild(Render.el('div', `最近导出：${s.lastExportAt ? new Date(s.lastExportAt).toLocaleString('ja-JP') : '从未'}`));
    card.appendChild(stats);

    const actions = Render.el('div.data-actions');
    actions.appendChild(Render.el('button.primary', { onclick: doExport }, '⬇ 导出 JSON'));
    const importBtn = Render.el('button', {}, '⬆ 导入 JSON');
    importBtn.addEventListener('click', () => doImport(importBtn));
    actions.appendChild(importBtn);
    const resetBtn = Render.el('button.danger', {}, '⚠ 重置全部数据');
    resetBtn.addEventListener('click', () => doReset(resetBtn));
    actions.appendChild(resetBtn);
    card.appendChild(actions);
    host.appendChild(card);
  }

  function doExport() {
    const json = Store.exportJson();
    const d = Store.dept();
    const period = Store.get().ui.currentPeriod;
    const { start, end } = Period.range(period);
    const y = start.getFullYear();
    const m1 = Util.pad2(start.getMonth() + 1);
    const m2 = Util.pad2(end.getMonth() + 1);
    const name = `月度出勤表${y}${m1}16-${m2}15.json`;
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.click();
    URL.revokeObjectURL(url);
  }

  function doImport(anchor) {
    showConfirmPopover(anchor, {
      text: '导入 JSON?',
      sub: '将覆盖当前全部数据,建议先导出备份',
      confirmText: '选择文件',
      danger: true,
      onConfirm: () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'application/json,.json';
        input.onchange = () => {
          const file = input.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              Store.importJson(reader.result);
              showToast('导入成功', 'success');
              // 切回排班页(URL 保持干净)并强制重渲染
              history.replaceState(null, '', location.pathname + location.search);
              App.showRoute();
            } catch (e) { showToast('导入失败:' + e.message, 'error'); }
          };
          reader.readAsText(file);
        };
        input.click();
      }
    });
  }

  function doReset(anchor) {
    showConfirmPopover(anchor, {
      text: '重置全部数据?',
      sub: '部门、人员和排班记录将全部清空,此操作不可撤销',
      confirmText: '继续',
      danger: true,
      onConfirm: () => {
        // 二次确认,防止误触
        setTimeout(() => showConfirmPopover(anchor, {
          text: '最后确认',
          sub: '所有数据将丢失,无法恢复',
          confirmText: '清空',
          danger: true,
          onConfirm: () => {
            Store.reset();
            showToast('已重置为默认', 'success');
          }
        }), 50);
      }
    });
  }

  return { renderSchedule, renderSettings, renderData };
})();

const Tests = (() => {
  const results = [];
  const assert = (name, cond, detail = '') => results.push({ name, ok: !!cond, detail });
  const eq = (name, actual, expected) => assert(name, JSON.stringify(actual) === JSON.stringify(expected), `actual=${JSON.stringify(actual)} expected=${JSON.stringify(expected)}`);

  const run = () => {
    results.length = 0;
    // Util
    eq('pad2(3)', Util.pad2(3), '03');
    eq('ymd', Util.ymd(new Date(2026, 4, 16)), '2026-05-16');
    // Period
    eq('Period.days length 2026-05 (16..6/15 = 31 days)', Period.days('2026-05').length, 31);
    eq('Period.days first', Period.days('2026-05')[0].ymd, '2026-05-16');
    eq('Period.days last', Period.days('2026-05')[Period.days('2026-05').length-1].ymd, '2026-06-15');
    eq('Period.prev', Period.prev('2026-05'), '2026-04');
    eq('Period.next', Period.next('2026-12'), '2027-01');
    // Holidays
    assert('Holidays GW 2026-05-05', Holidays.isHoliday('2026-05-05'));
    assert('Non-holiday 2026-05-20', !Holidays.isHoliday('2026-05-20'));
    // Store
    Store.reset();
    eq('Store default depts', Store.get().departments.length, 3);
    const pid = Store.addPerson('dept1', { name: '王 ギョウセイ', role: 'リーダー', annualLeaveInit: 14 });
    eq('Store addPerson', Store.people('dept1').length, 1);
    Store.setCell('dept1', pid, '2026-05-17', 'contractRest');
    eq('Store cell contractRest', Store.cellStatus('dept1', pid, '2026-05-17'), 'contractRest');
    Store.cycleCell('dept1', pid, '2026-05-17'); // → paidLeave
    eq('Store cycle to paid', Store.cellStatus('dept1', pid, '2026-05-17'), 'paidLeave');
    Store.cycleCell('dept1', pid, '2026-05-17'); // → work
    eq('Store cycle to work', Store.cellStatus('dept1', pid, '2026-05-17'), 'work');
    Store.updatePerson('dept1', pid, { retiredOn: '2026-05-20' });
    eq('Store retired derived', Store.cellStatus('dept1', pid, '2026-05-21'), 'retired');
    eq('Store required default', Store.requiredCount('dept1', '2026-05-16'), 22);
    Store.setRequired('dept1', '2026-05-16', 18);
    eq('Store required override', Store.requiredCount('dept1', '2026-05-16'), 18);
    Store.reset();
    return results;
  };

  const render = () => {
    if (!location.search.includes('test=1')) return;
    const host = document.getElementById('test-results');
    host.classList.remove('hidden');
    const out = run();
    const pass = out.filter(r => r.ok).length;
    const total = out.length;
    host.textContent = `Tests: ${pass}/${total} passed\n` +
      out.map(r => `${r.ok ? '✓' : '✗'} ${r.name}${r.ok ? '' : ' — ' + r.detail}`).join('\n');
  };

  return { run, render };
})();

window.addEventListener('DOMContentLoaded', () => { App.init(); Tests.render(); });
</script>
