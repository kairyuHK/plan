    '2027-10-11','2027-11-03','2027-11-23'
  ]);
  const isHoliday = (ymd) => list.has(ymd);
  return { isHoliday };
})();

const Period = (() => {
  // periodKey: 'YYYY-MM' represents YYYY-MM-16 ~ next month 15
  const WEEKDAY_JP = ['日','月','火','水','木','金','土']; // Date.getDay() → 0..6
  const todayKey = () => {
    const d = new Date();
    if (d.getDate() < 16) {
      const p = new Date(d.getFullYear(), d.getMonth() - 1, 1);
      return `${p.getFullYear()}-${Util.pad2(p.getMonth()+1)}`;
    }
    return `${d.getFullYear()}-${Util.pad2(d.getMonth()+1)}`;
  };
  const range = (key) => {
    const [y, m] = key.split('-').map(Number);
    const start = new Date(y, m - 1, 16);
    const end = new Date(y, m, 15);
    return { start, end };
  };
  const days = (key) => {
    const { start, end } = range(key);
    const out = [];
    for (let d = new Date(start); d <= end; d = Util.addDays(d, 1)) {
      const ymdStr = Util.ymd(d);
      out.push({
        ymd: ymdStr,
        day: d.getDate(),
        weekday: d.getDay(),
        weekdayJp: WEEKDAY_JP[d.getDay()],
        isSat: d.getDay() === 6,
        isSun: d.getDay() === 0,
        isHoliday: Holidays.isHoliday(ymdStr)
      });
    }
    return out;
  };
  const prev = (key) => {
    const [y, m] = key.split('-').map(Number);
    const p = new Date(y, m - 2, 1);
    return `${p.getFullYear()}-${Util.pad2(p.getMonth()+1)}`;
  };
  const next = (key) => {
    const [y, m] = key.split('-').map(Number);
    const n = new Date(y, m, 1);
    return `${n.getFullYear()}-${Util.pad2(n.getMonth()+1)}`;
  };
  const label = (key) => {
    const { start, end } = range(key);
    return `${start.getFullYear()}年${start.getMonth()+1}月${start.getDate()}日 ~ ${end.getMonth()+1}月${end.getDate()}日`;
  };
  return { todayKey, range, days, prev, next, label };
})();

const Store = (() => {
  const KEY = 'monthly-attendance-data-v1';
  const VERSION = 1;

  const defaults = () => ({
    version: VERSION,
    departments: [
      { id: 'dept1', name: '部门 A', requiredCount: 22, printHeightMm: 192 },
      { id: 'dept2', name: '部门 B', requiredCount: 22, printHeightMm: 192 },
      { id: 'dept3', name: '部门 C', requiredCount: 22, printHeightMm: 192 }
    ],
    // 单元格尺寸覆盖。所有部门共享(用户调一次,所有部门生效)。
    // key 含义:
    //   col-role/col-name: 役職/氏名 列宽 px
    //   col-sum-paid/col-sum-contract/col-sum-remain: 有休/契休/残 列宽 px (3 个独立)
    //   col-day: 所有日期列统一宽度 px
    //   row-person: 所有人员行统一高度 px
    //   row-stat: 必要人数/ライン合計/派遣短期/過不足 4 行统一高度 px
    // 没设置的 key 用 CSS var() fallback 的默认值。
    sizes: {},
    people: { dept1: [], dept2: [], dept3: [] },
    attendance: {},
    cellColors: {},
    cellTexts: {},
    requiredPerDay: {},
    dispatchPerDay: {},
    ui: {
      currentDept: 'dept1',
      currentPeriod: Period.todayKey(),
      editMode: false,
      // 月度工时模块的全局设置 — 数据本身存在 person.hoursDays
      hours: hoursDefaultUi()
    },
    lastExportAt: null
  });

  // 月度工时 UI 默认值。cursor 用自然月(与排班 16-15 周期语义不同)。
  function hoursDefaultUi() {
    const t = new Date();
    return {
      cursor: `${t.getFullYear()}-${Util.pad2(t.getMonth()+1)}`,
      stdHours: 8,
      lunchHours: 1,
      cycleStart: 1,
      selectedPersonId: null
    };
  }

  let state = load();
  const listeners = new Set();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return defaults();
      const parsed = JSON.parse(raw);
      if (parsed.version !== VERSION) return defaults();
      // backward-compat: old field name shortTermDispatch → requiredPerDay
      if (!parsed.requiredPerDay) parsed.requiredPerDay = parsed.shortTermDispatch || {};
      delete parsed.shortTermDispatch;
      if (!parsed.dispatchPerDay) parsed.dispatchPerDay = {};
      if (!parsed.cellColors) parsed.cellColors = {};
      if (!parsed.cellTexts) parsed.cellTexts = {};
      // 旧数据兼容:部门缺少新字段时补默认值
      if (Array.isArray(parsed.departments)) {
        parsed.departments.forEach(d => {
          if (d.printHeightMm == null) d.printHeightMm = 192;
        });
      }
      // 旧数据兼容:人员 annualLeaveInit → annualLeave(默认 20)+ leaveResetMonth(默认 3)
      // 一次性纠正:旧版默认 11 → 3(仅在 _resetMonthDefault3Applied 标志未设置时执行,
      // 避免后续覆盖用户手动选择的 11)
      const needResetMonthFix = !parsed._resetMonthDefault3Applied;
      if (parsed.people && typeof parsed.people === 'object') {
        for (const did in parsed.people) {
          const list = parsed.people[did];
          if (!Array.isArray(list)) continue;
          list.forEach(p => {
            if (p.annualLeave == null) {
              p.annualLeave = (p.annualLeaveInit != null) ? Number(p.annualLeaveInit) : 20;
            }
            if (p.leaveResetMonth == null) p.leaveResetMonth = 3;
            else if (needResetMonthFix && p.leaveResetMonth === 11) p.leaveResetMonth = 3;
          });
        }
      }
      parsed._resetMonthDefault3Applied = true;
      if (!parsed.sizes) parsed.sizes = {};
      // 每个 person 兜底 hoursDays
      if (parsed.people && typeof parsed.people === 'object') {
        for (const did in parsed.people) {
          const list = parsed.people[did];
          if (!Array.isArray(list)) continue;
          list.forEach(p => { if (!p.hoursDays || typeof p.hoursDays !== 'object') p.hoursDays = {}; });
        }
      }
      // ui.hours 兜底
      if (parsed.ui) {
        if (!parsed.ui.hours || typeof parsed.ui.hours !== 'object') parsed.ui.hours = hoursDefaultUi();
        else {
          const def = hoursDefaultUi();
          for (const k in def) if (parsed.ui.hours[k] == null) parsed.ui.hours[k] = def[k];
        }
      }
      // 一次性迁移:旧 hours-ledger-v2 LS key → 主 store
      // 按姓名匹配 personId 把 days 搬进 person.hoursDays;匹配不上的留在
      // parsed._hoursLegacyOrphans 不丢,旧 LS key 保留不删,可以人工对照
      if (!parsed._hoursMigratedFromLegacy) {
        try {
          const rawLegacy = localStorage.getItem('hours-ledger-v2');
          if (rawLegacy) {
            const legacy = JSON.parse(rawLegacy);
            const orphans = {};
            if (legacy && legacy.dataByPerson && typeof legacy.dataByPerson === 'object') {
              for (const name in legacy.dataByPerson) {
                const bucket = legacy.dataByPerson[name];
                const days = (bucket && bucket.days) || {};
                if (!Object.keys(days).length) continue;
                const trimmed = (name || '').trim();
                let matched = null;
                if (trimmed) {
                  outer:
                  for (const did in parsed.people) {
                    for (const p of (parsed.people[did] || [])) {
                      if ((p.name || '').trim() === trimmed) { matched = p; break outer; }
                    }
                  }
                }
                if (matched) {
                  matched.hoursDays = matched.hoursDays || {};
                  for (const ymd in days) matched.hoursDays[ymd] = days[ymd];
                } else {
                  orphans[name] = { days };
                }
              }
            }
            // 选中的人:旧 selectedPersonName → selectedPersonId
            const sel = (legacy && legacy.selectedPersonName || '').trim();
            if (sel && parsed.ui && parsed.ui.hours) {
              outer2:
              for (const did in parsed.people) {
                for (const p of (parsed.people[did] || [])) {
                  if ((p.name || '').trim() === sel) { parsed.ui.hours.selectedPersonId = p.id; break outer2; }
                }
              }
            }
            // 全局设置迁移(cursor/stdHours/lunchHours/cycleStart)
            if (legacy && parsed.ui && parsed.ui.hours) {
              if (legacy.cursor) parsed.ui.hours.cursor = legacy.cursor;
              if (Number(legacy.stdHours) > 0) parsed.ui.hours.stdHours = Number(legacy.stdHours);
              if (Number.isFinite(Number(legacy.lunchHours))) parsed.ui.hours.lunchHours = Number(legacy.lunchHours);
              if (Number(legacy.cycleStart) >= 1) parsed.ui.hours.cycleStart = Math.floor(Number(legacy.cycleStart));
            }
            if (Object.keys(orphans).length) parsed._hoursLegacyOrphans = orphans;
          }
        } catch (_) {}
        parsed._hoursMigratedFromLegacy = true;
      }
      // 校正 ui.currentDept:如果指向已删除部门(或 null),改为第一个部门。
      // 否则 F5 后 select.value 设置失败,显示首项但 state 还是旧值,
      // 用户「选」首项时 onchange 不触发 → 看起来部门下拉无反应。
      if (parsed.ui && Array.isArray(parsed.departments) && parsed.departments.length > 0) {
        // '__personal__' / '__hours__' 是合法的虚拟视图 id,不强制改回真实部门
        const _virtualIds = ['__personal__', '__hours__'];
        if (!_virtualIds.includes(parsed.ui.currentDept) && !parsed.departments.find(d => d.id === parsed.ui.currentDept)) {
          parsed.ui.currentDept = parsed.departments[0].id;
        }
      }
      // 校正 ui.hours.selectedPersonId:指向不存在的人 → null
      if (parsed.ui && parsed.ui.hours && parsed.ui.hours.selectedPersonId) {
        let found = false;
        for (const did in parsed.people) {
          if ((parsed.people[did] || []).some(p => p.id === parsed.ui.hours.selectedPersonId)) { found = true; break; }
        }
        if (!found) parsed.ui.hours.selectedPersonId = null;
      }
      return parsed;
    } catch (_) { return defaults(); }
  }

  const persist = Util.debounce(() => {
    localStorage.setItem(KEY, JSON.stringify(state));
    listeners.forEach(fn => fn('persist'));
  }, 100);

  // 静默持久化:只写 localStorage,不触发 listeners(不重渲)。
  // 用于高频局部更新(点出勤格),避免每次点击触发整表重建 → 手机端卡顿的根因。
  const persistSilent = Util.debounce(() => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) {}
  }, 150);

  function commit(reason = 'change') {
    listeners.forEach(fn => fn(reason));
    persist();
  }

  // ---- selectors ----
  const get = () => state;
  const dept = (id = state.ui.currentDept) => state.departments.find(d => d.id === id);
  const people = (deptId = state.ui.currentDept) => state.people[deptId] || [];
  const peopleInPeriod = (deptId = state.ui.currentDept, periodKey = state.ui.currentPeriod) => {
    const all = state.people[deptId] || [];
    const { start, end } = Period.range(periodKey);
    const startYmd = Util.ymd(start);
    const endYmd = Util.ymd(end);
    return all.filter(p => {
      const addedOk = !p.addedOn || p.addedOn <= endYmd;
      const retiredOk = !p.retiredOn || p.retiredOn >= startYmd;
      const removedOk = !p.removedOn || p.removedOn > endYmd;
      // 调岗:本部门入职日(transferredOn 之前不归本部门)
      const transferredOk = !p.transferredOn || p.transferredOn <= endYmd;
      return addedOk && retiredOk && removedOk && transferredOk;
    });
  };
  const cellKey = (deptId, personId, ymd) => `${deptId}|${personId}|${ymd}`;
  const dispKey = (deptId, ymd) => `${deptId}|${ymd}`;

  const cellStatus = (deptId, personId, ymd) => {
    const person = people(deptId).find(p => p.id === personId);
    if (person && person.retiredOn && ymd >= person.retiredOn) return 'retired';
    return state.attendance[cellKey(deptId, personId, ymd)] || 'work';
  };
  // 统计某人员 [startYmd, endYmd] 区间内有休天数(扫 attendance 表,而非按天迭代,避免 O(N) 365 次)
  const paidLeaveDaysInRange = (deptId, personId, startYmd, endYmd) => {
    const prefix = `${deptId}|${personId}|`;
    let n = 0;
    for (const k in state.attendance) {
      if (!k.startsWith(prefix)) continue;
      if (state.attendance[k] !== 'paidLeave') continue;
      const ymd = k.slice(prefix.length);
      if (ymd >= startYmd && ymd <= endYmd) n++;
    }
    return n;
  };

  const DEFAULT_REQUIRED = 22;
  const requiredCount = (deptId, ymd) => {
    const v = state.requiredPerDay[dispKey(deptId, ymd)];
    if (v !== undefined && v !== null) return v;
    const d = dept(deptId);
    return (d && d.requiredCount != null) ? d.requiredCount : DEFAULT_REQUIRED;
  };
  const dispatchCount = (deptId, ymd) => {
    const v = state.dispatchPerDay[dispKey(deptId, ymd)];
    return (v !== undefined && v !== null) ? v : 0;
  };

  // ---- mutators ----
  function setUi(patch) { Object.assign(state.ui, patch); commit('ui'); }

  // silent=true:只 persist 不 commit(不触发整表重渲),调用方负责局部更新 DOM。
  function setCell(deptId, personId, ymd, status, color, silent) {
    const k = cellKey(deptId, personId, ymd);
    if (status === 'work') delete state.attendance[k];
    else state.attendance[k] = status;
    // 非 work(休息)状态强制清色 + 清文字 — 颜色/文字只属于出勤日
    if (status !== 'work') {
      delete state.cellColors[k];
      delete state.cellTexts[k];
    } else if (color !== undefined) {
      if (color === null) delete state.cellColors[k];
      else state.cellColors[k] = color;
    }
    if (silent) persistSilent();
    else commit('cell');
  }

  function cycleCell(deptId, personId, ymd, color, silent) {
    const current = cellStatus(deptId, personId, ymd);
    // 派生 retired(来自 retiredOn 字段,旧数据兼容)仍不可编辑
    const person = (state.people[deptId] || []).find(pp => pp.id === personId);
    const isDerivedRetired = current === 'retired' && person && person.retiredOn && ymd >= person.retiredOn;
    if (isDerivedRetired) return;
    // 选了颜色 → 当作"涂色刷",强制设为 work + 填色;不再切换状态
    // 选了「clear」(✕)→ 强制设为 work + 清色
    if (color === 'clear') { setCell(deptId, personId, ymd, 'work', null, silent); return; }
    if (color) { setCell(deptId, personId, ymd, 'work', color, silent); return; }
    // 没选颜色 → 状态循环 空→〇→有→✲→空(欠跳过,只能键盘 3 设置);
    // 已经是欠的格子点击会直接回到空
    const next = current === 'work' ? 'contractRest'
               : current === 'contractRest' ? 'paidLeave'
               : current === 'paidLeave' ? 'retired'
               : 'work';
    setCell(deptId, personId, ymd, next, undefined, silent);
  }

  const cellColor = (deptId, personId, ymd) => state.cellColors[cellKey(deptId, personId, ymd)] || null;
  // 返回 { text, color } 或 null。兼容旧版字符串格式。
  const cellText = (deptId, personId, ymd) => {
    const v = state.cellTexts[cellKey(deptId, personId, ymd)];
    if (!v) return null;
    if (typeof v === 'string') return { text: v, color: null }; // 旧版兼容
    return v;
  };

  // 设置单元格自定义文字+颜色。空字符串 = 清除。文字属于出勤日,会清空状态。
  function setCellText(deptId, personId, ymd, text, color) {
    const k = cellKey(deptId, personId, ymd);
    const t = (text || '').trim();
    if (!t) {
      delete state.cellTexts[k];
    } else {
      state.cellTexts[k] = { text: t, color: color || null };
      delete state.attendance[k]; // 出勤日
    }
    commit('cellText');
  }

  function setRequired(deptId, ymd, n) {
    const k = dispKey(deptId, ymd);
    const raw = String(n).trim();
    if (raw === '') { delete state.requiredPerDay[k]; commit('required'); return; }
    state.requiredPerDay[k] = Math.max(0, Number(n) || 0);
    commit('required');
  }

  function setDispatch(deptId, ymd, n, silent) {
    const k = dispKey(deptId, ymd);
    const raw = String(n).trim();
    if (raw === '' || Number(raw) === 0) {
      delete state.dispatchPerDay[k];
    } else {
      state.dispatchPerDay[k] = Math.max(0, Number(n) || 0);
    }
    if (silent) {
      // silent: 直接 setItem,绕开 debounce persist
      // (persist 100ms 后会触发 listeners → 整页重渲染破坏焦点,这是之前一直跳不过去的真凶)
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (_) {}
    } else {
      commit('dispatch');
    }
  }

  // departments
  function addDepartment(name) {
    const id = Util.newId('d');
    // 新部门自动带打印高度默认值 192mm,与现有部门保持一致
    state.departments.push({ id, name, requiredCount: 10, printHeightMm: 192 });
    state.people[id] = [];
    commit('dept');
    return id;
  }
  function renameDepartment(id, name) {
    const d = state.departments.find(x => x.id === id);
    if (d) { d.name = name; commit('dept'); }
  }
  function setDeptRequired(id, n) {
    const d = state.departments.find(x => x.id === id);
    if (d) { d.requiredCount = Math.max(0, Number(n) || 0); commit('dept'); }
  }
  function setDeptPrintHeight(id, mm) {
    const d = state.departments.find(x => x.id === id);
    if (d) {
      // 限制在合理范围 100-210mm 之间(A4 横向高度 210mm)
      d.printHeightMm = Math.max(100, Math.min(210, Number(mm) || 192));
      commit('dept');
    }
  }
  // 单元格尺寸:统一存到 state.sizes,key 见 defaults() 注释。
  // 单位 px,clamp 限制范围避免极端值破坏排版。
  const SIZE_LIMITS = {
    'col-role':       [10, 200],
    'col-name':       [20, 400],
    'col-sum-paid':   [10, 100],
    'col-sum-contract': [10, 100],
    'col-sum-remain': [10, 100],
    'col-day':        [12, 80],
    'row-person':     [14, 80],
    'row-stat':       [14, 80],
  };
  function setSize(key, px) {
    const limits = SIZE_LIMITS[key];
    if (!limits) return;
    const n = Math.max(limits[0], Math.min(limits[1], Math.round(Number(px) || 0)));
    state.sizes[key] = n;
    commit('size');
  }
  function resetSize(key) { delete state.sizes[key]; commit('size'); }
  function removeDepartment(id) {
    state.departments = state.departments.filter(d => d.id !== id);
    delete state.people[id];
    for (const k of Object.keys(state.attendance)) if (k.startsWith(id + '|')) delete state.attendance[k];
    for (const k of Object.keys(state.requiredPerDay)) if (k.startsWith(id + '|')) delete state.requiredPerDay[k];
    if (state.ui.currentDept === id) state.ui.currentDept = state.departments[0]?.id || null;
    commit('dept');
  }
  // 部门拖拽换位 — 与 reorderPerson 同结构。fromId/toId 是部门 id,beforeTarget=true 插到目标之前。
  function reorderDepartment(fromId, toId, beforeTarget) {
    const list = state.departments;
    const fromIdx = list.findIndex(d => d.id === fromId);
    if (fromIdx < 0 || fromId === toId) return;
    const [moved] = list.splice(fromIdx, 1);
    const newToIdx = list.findIndex(d => d.id === toId);
    if (newToIdx < 0) { list.splice(fromIdx, 0, moved); return; }
    const insertAt = beforeTarget ? newToIdx : newToIdx + 1;
    list.splice(insertAt, 0, moved);
    commit('dept');
  }

  // people
  function addPerson(deptId, person) {
    const { start } = Period.range(state.ui.currentPeriod);
    const defaultAddedOn = Util.ymd(start);
    const p = { id: Util.newId('p'), name: '', role: '', annualLeave: 20, leaveResetMonth: 3, retiredOn: null, addedOn: defaultAddedOn, hoursDays: {}, noAnnualLeave: false, ...person };
    if (!p.hoursDays) p.hoursDays = {};
    (state.people[deptId] = state.people[deptId] || []).push(p);
    commit('people');
    return p.id;
  }
  function updatePerson(deptId, personId, patch, silent) {
    const list = state.people[deptId] || [];
    const i = list.findIndex(p => p.id === personId);
    if (i >= 0) {
      list[i] = { ...list[i], ...patch };
      if (silent) persistSilent();
      else commit('people');
    }
  }
  // soft-remove: keeps the person record + all historical attendance.
  // The person disappears from periods after `removedOn`, past periods still show them.
  function removePerson(deptId, personId) {
    const list = state.people[deptId] || [];
    const i = list.findIndex(p => p.id === personId);
    if (i >= 0) {
      const { start } = Period.range(state.ui.currentPeriod);
      list[i] = { ...list[i], removedOn: Util.ymd(start) };
      commit('people');
    }
  }
  // hard delete: nukes the person + all their attendance records. Use with care.
  function purgePerson(deptId, personId) {
    state.people[deptId] = (state.people[deptId] || []).filter(p => p.id !== personId);
    for (const k of Object.keys(state.attendance)) if (k.startsWith(`${deptId}|${personId}|`)) delete state.attendance[k];
    commit('people');
  }
  // 在同一部门内把人员从源位置移动到目标位置。
  // toPid 为目标参考人员 id;beforeTarget=true 插到目标之前,否则之后。
  // 操作底层 state.people[deptId] 完整数组,跨越已软删除的人员(removedOn)保持其原位置稳定。
  function reorderPerson(deptId, fromPid, toPid, beforeTarget) {
    const list = state.people[deptId] || [];
    const fromIdx = list.findIndex(p => p.id === fromPid);
    if (fromIdx < 0 || fromPid === toPid) return;
    const [moved] = list.splice(fromIdx, 1);
    const newToIdx = list.findIndex(p => p.id === toPid);
    if (newToIdx < 0) { list.splice(fromIdx, 0, moved); return; } // 异常回滚
    const insertAt = beforeTarget ? newToIdx : newToIdx + 1;
    list.splice(insertAt, 0, moved);
    commit('people');
  }
  // transfer: 把人员从原部门调到新部门。原部门设 removedOn=今天(过去周期保留),
  // 新部门添加一份:保留原 addedOn(年度有休等以入职日为准),新增 transferredOn=今天
  // (本部门可见性从该日起算),清空 retiredOn。
  // 不修改 attendance,原部门历史排班按原 personId 保留。
  function transferPerson(fromDeptId, personId, toDeptId) {
    if (fromDeptId === toDeptId) return;
    const fromList = state.people[fromDeptId] || [];
    const i = fromList.findIndex(p => p.id === personId);
    if (i < 0) return;
    const orig = fromList[i];
    const today = Util.ymd(new Date());
    fromList[i] = { ...orig, removedOn: today };
    (state.people[toDeptId] = state.people[toDeptId] || []).push({
      ...orig,
      id: Util.newId('p'),
      transferredOn: today,
      removedOn: null,
      retiredOn: null,
      // 新部门的工时记录从空开始,不继承原部门的打卡数据
      hoursDays: {}
    });
    commit('people');
  }

  // data
  function exportJson() {
    state.lastExportAt = new Date().toISOString();
    commit('export');
    return JSON.stringify(state, null, 2);
  }
  function importJson(json) {
    const parsed = JSON.parse(json);
    if (parsed.version !== VERSION) throw new Error('版本不兼容');
    // 原子校验:所有字段都补齐 + 校正,验证全部通过后才赋值 state。
    // 之前的 bug:state = parsed 在校验之前,如果 parsed 缺 departments/people 等字段,
    // 后续校验代码抛 TypeError,但 state 已被破坏 → 整页崩溃,所有功能失效。
    if (!Array.isArray(parsed.departments)) throw new Error('数据缺失或损坏:departments');
    if (!parsed.people || typeof parsed.people !== 'object') throw new Error('数据缺失或损坏:people');
    if (!parsed.attendance) parsed.attendance = {};
    if (!parsed.cellColors) parsed.cellColors = {};
    if (!parsed.cellTexts) parsed.cellTexts = {};
    parsed.departments.forEach(d => {
      if (d.printHeightMm == null) d.printHeightMm = 192;
    });
    if (parsed.people && typeof parsed.people === 'object') {
      for (const did in parsed.people) {
        const list = parsed.people[did];
        if (!Array.isArray(list)) continue;
        list.forEach(p => {
          if (p.annualLeave == null) p.annualLeave = (p.annualLeaveInit != null) ? Number(p.annualLeaveInit) : 20;
          if (p.leaveResetMonth == null) p.leaveResetMonth = 3;
        });
      }
    }
    if (!parsed.sizes) parsed.sizes = {};
    if (!parsed.requiredPerDay) parsed.requiredPerDay = {};
    if (!parsed.dispatchPerDay) parsed.dispatchPerDay = {};
    if (!parsed.ui) parsed.ui = { currentDept: null, currentPeriod: Period.todayKey(), editMode: false };
    if (!['__personal__', '__hours__'].includes(parsed.ui.currentDept) && !parsed.departments.find(d => d.id === parsed.ui.currentDept)) {
      parsed.ui.currentDept = parsed.departments[0]?.id || null;
    }
    if (!parsed.ui.currentPeriod) parsed.ui.currentPeriod = Period.todayKey();
    // 所有验证 + 补全完成,才原子替换 state
    state = parsed;
    commit('import');
  }
  function reset() { state = defaults(); commit('reset'); }

  function subscribe(fn) { listeners.add(fn); return () => listeners.delete(fn); }

  // ---- hours API ----
  // 跨部门按 id 找人。返回 { dept, person } 或 null。
  function findPersonById(personId) {
    if (!personId) return null;
    for (const d of state.departments) {
      const p = (state.people[d.id] || []).find(pp => pp.id === personId);
      if (p) return { dept: d, person: p };
    }
    return null;
  }
  function getHoursDays(personId) {
    const found = findPersonById(personId);
    if (!found) return {};
    if (!found.person.hoursDays) found.person.hoursDays = {};
    return found.person.hoursDays;
  }
  // 写一天工时。rec = { in, out, tag } 或 null/空 → 删除该天。silent=不重渲。
  function setHoursDay(personId, ymd, rec, silent) {
    const found = findPersonById(personId);
    if (!found) return;
    if (!found.person.hoursDays) found.person.hoursDays = {};
    const days = found.person.hoursDays;
    const isEmpty = !rec || (!rec.in && !rec.out && !rec.tag);
    if (isEmpty) delete days[ymd];
    else days[ymd] = rec;
    if (silent) persistSilent();
    else commit('hours');
  }
  // 清空一人某区间的所有 days(用于"清空当前周期"按钮)
  function clearHoursDaysInRange(personId, startYmd, endYmd, silent) {
    const found = findPersonById(personId);
    if (!found || !found.person.hoursDays) return 0;
    const days = found.person.hoursDays;
    let n = 0;
    for (const k of Object.keys(days)) {
      if (k >= startYmd && k <= endYmd) { delete days[k]; n++; }
    }
    if (n) {
      if (silent) persistSilent();
      else commit('hours');
    }
    return n;
  }
  // 更新 ui.hours 单个字段。selectedPersonId 切人时通常想重渲 → 默认非 silent。
  function setHoursSetting(key, val, silent) {
    if (!state.ui.hours) state.ui.hours = hoursDefaultUi();
    state.ui.hours[key] = val;
    if (silent) persistSilent();
    else commit('hours');
  }

  return {
    get, dept, people, peopleInPeriod, cellStatus, cellColor, cellText, requiredCount, dispatchCount, paidLeaveDaysInRange,
    setUi, setCell, cycleCell, setRequired, setDispatch, setCellText,
    addDepartment, renameDepartment, setDeptRequired, setDeptPrintHeight, removeDepartment, reorderDepartment,
    setSize, resetSize,
    addPerson, updatePerson, removePerson, purgePerson, transferPerson, reorderPerson,
    findPersonById, getHoursDays, setHoursDay, clearHoursDaysInRange, setHoursSetting,
    exportJson, importJson, reset, subscribe
  };
})();

const Render = (() => {
  function el(tag, attrsOrChildren, children) {
    let attrs = {};
    if (Array.isArray(attrsOrChildren) || typeof attrsOrChildren === 'string') {
      children = attrsOrChildren;
    } else if (attrsOrChildren && typeof attrsOrChildren === 'object' && attrsOrChildren.nodeType === undefined) {
      attrs = attrsOrChildren;
    }
    const [name, ...rest] = tag.split(/(?=[.#])/);
    const node = document.createElement(name);
    for (const part of rest) {
      if (part.startsWith('.')) node.classList.add(part.slice(1));
      else if (part.startsWith('#')) node.id = part.slice(1);
    }
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'class') node.className += ' ' + v;
      else if (k === 'dataset') Object.assign(node.dataset, v);
      else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
      else node.setAttribute(k, v);
    }
    if (children != null) {
      const arr = Array.isArray(children) ? children : [children];
      for (const c of arr) {
        if (c == null || c === false) continue;
        node.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
      }
    }
    return node;
  }
  const clear = (node) => { while (node.firstChild) node.removeChild(node.firstChild); };
  const mount = (host, node) => { clear(host); host.appendChild(node); };
  return { el, clear, mount };
})();

const App = (() => {
  const routes = {
    '#/schedule': 'page-schedule',
    '#/settings': 'page-settings',
    '#/data': 'page-data'
  };

  function showRoute() {
    const hash = location.hash in routes ? location.hash : '#/schedule';
    for (const [r, id] of Object.entries(routes)) {
      document.getElementById(id).classList.toggle('hidden', r !== hash);
    }
    // 非 schedule 路由要主动隐藏 page-personal / page-hours(routes 映射里没有它们,默认不会被切换)
    if (hash !== '#/schedule') {
      document.getElementById('page-personal').classList.add('hidden');
      document.getElementById('page-hours').classList.add('hidden');
    }
    if (hash === '#/schedule') Pages.renderSchedule();
    else if (hash === '#/settings') Pages.renderSettings();
    else if (hash === '#/data') Pages.renderData();
  }

  function updateDirtyIndicator() {
    const el = document.getElementById('dirty-indicator');
    const lastExport = Store.get().lastExportAt;
    if (lastExport) {
      const days = (Date.now() - new Date(lastExport).getTime()) / 86400000;
      if (days >= 7) { el.textContent = `⚠ ${Math.floor(days)} 天未导出`; el.classList.add('warn'); return; }
    }
    el.textContent = '✓ 已暂存';
    el.classList.remove('warn');
  }

  function bindNav() {
    document.querySelectorAll('[data-route]').forEach(b => {
      b.addEventListener('click', () => {
        if (b.dataset.route === '#/schedule') {
          history.replaceState(null, '', location.pathname + location.search);
          showRoute();
        } else {
          location.hash = b.dataset.route;
        }
      });
    });
    document.getElementById('btn-print').addEventListener('click', () => window.print());
    document.getElementById('btn-personal-export').addEventListener('click', (e) => {
      Pages.exportPersonalPNG(e.currentTarget);
    });
    document.getElementById('btn-edit-toggle').addEventListener('click', () => {
      Store.setUi({ editMode: !Store.get().ui.editMode });
    });
    window.addEventListener('hashchange', showRoute);
    // 窗口宽度变化时重排 schedule。但**只在宽度变化时**重渲 —— iOS Safari 滚动时
    // URL 栏隐藏/显示会触发 resize 事件,但 innerWidth 不变(只 innerHeight 变),
    // 之前不区分导致每次滚动都触发 renderSchedule → DOM 重建 → 滚动位置归零的 bug。
    let resizeT;
    let lastResizeW = window.innerWidth;
    window.addEventListener('resize', () => {
      if (window.innerWidth === lastResizeW) return; // 仅高度变化(URL 栏开合)→ 忽略
      lastResizeW = window.innerWidth;
      clearTimeout(resizeT);
      resizeT = setTimeout(() => {
        const hash = location.hash in routes ? location.hash : '#/schedule';
        if (hash === '#/schedule') Pages.renderSchedule();
      }, 200);
    });
  }

  function updateEditUI() {
    const editing = !!Store.get().ui.editMode;
    const isPersonal = Store.get().ui.currentDept === '__personal__';
    const isHours = Store.get().ui.currentDept === '__hours__';
    document.body.classList.toggle('editing', editing && !isPersonal && !isHours);
    document.body.classList.toggle('personal-mode', isPersonal);
    document.body.classList.toggle('hours-mode', isHours);
    const btn = document.getElementById('btn-edit-toggle');
    btn.textContent = editing ? '✏ 编辑中' : '🔒 锁定';
    btn.classList.toggle('primary', editing);
  }

  let originalTitle = '';
  function buildPrintTitle() {
    const d = Store.dept();
    const period = Store.get().ui.currentPeriod;
    const { start, end } = Period.range(period);
    const y = start.getFullYear();
    const m1 = Util.pad2(start.getMonth() + 1);
    const m2 = Util.pad2(end.getMonth() + 1);
    return `${d ? d.name : ''}月度出勤表${y}${m1}16-${m2}15`;
  }

  // 关闭双击放大(保留双指捏合):用 touchend 检测同一元素 300ms 内二次轻点,拦截其默认缩放。
  // 不拦双指手势 → 捏合缩放保留。只在"同一元素"二次轻点才拦 → 快速点不同格子录入不受影响。
  // (纯 CSS touch-action:manipulation 在部分 iOS 版本对双击缩放不生效,JS 兜底更可靠。)
  function disableDoubleTapZoom() {
    let lastTapEnd = 0, lastTapTarget = null;
    document.addEventListener('touchend', e => {
      if (e.touches && e.touches.length > 0) return; // 多指(捏合)不处理
      const now = Date.now();
      if (now - lastTapEnd <= 300 && e.target === lastTapTarget) e.preventDefault();
      lastTapEnd = now;
      lastTapTarget = e.target;
    }, { passive: false });
  }

  function init() {
    disableDoubleTapZoom();
    bindNav();
    showRoute();
    updateDirtyIndicator();
    updateEditUI();
    Store.subscribe(() => { showRoute(); updateDirtyIndicator(); updateEditUI(); });
    window.addEventListener('beforeprint', () => {
      originalTitle = document.title;
      document.title = buildPrintTitle();
      const peopleN = Store.peopleInPeriod().length;
      // thead 3 行(月份/日期/星期) + N 人员行 + stat 4 行(必要/合計/派遣/不足)
      const totalRows = 3 + peopleN + 4;
      document.documentElement.style.setProperty('--total-rows', String(totalRows));
      // 应用当前部门的打印高度(每个部门可独立设置,默认 192mm)
      const curDept = Store.dept();
      const bodyH = (curDept && curDept.printHeightMm) || 192;
      // 只有「手机端 + 夕盛部门」组合才触发特殊缩放。
      // 原因:夕盛部门人员最多(~28 人),手机 Safari 打印 A4 横向时实际可用区比 PC 小
      // (Safari 最小边距 + URL/页码占用 30-50mm),默认 192mm body 会溢出到第 2 页。
      // 其他部门人少,bodyH 同 PC(192mm)就能塞 1 页,不需要缩放。PC 端任何部门都不动。
      // 试过但无效的方案:zoom 0.84 — Safari 打印模式按声明尺寸分页,不看 zoom。
      const isMobile = window.matchMedia('(max-width: 640px)').matches;
      const isHaraidashiYousei = !!(curDept && curDept.name === '夕盛');
      // 0.78:Safari iOS 实际可用 ≈ 160-180mm。192 × 0.78 = 150mm 稳塞 1 页;
      // 156mm 最大上限防止用户改大 printHeightMm 后又溢出。
      const MOBILE_BODY_SCALE = 0.78;
      const MOBILE_BODY_CAP_MM = 156;
      const declaredBodyH = (isMobile && isHaraidashiYousei)
        ? Math.min(bodyH * MOBILE_BODY_SCALE, MOBILE_BODY_CAP_MM)
        : bodyH;
      document.documentElement.style.setProperty('--print-body-h', declaredBodyH + 'mm');
      document.documentElement.style.setProperty('--print-row-h-base', (declaredBodyH - 2) + 'mm');
      // 手机端 (视口 ≤ 640px) 不给 day-cell 加 padding-top — 移动浏览器字体度量不同,加 padding 反而偏下
      document.documentElement.style.setProperty('--day-cell-pad-ratio', isMobile ? '0' : '0');
      // 払出 部门特例:打印时切换 body class,触发 day-cell 字号缩档(避免 有/〇 比 早/包 大)
      document.body.classList.toggle('print-dept-haraidashi', !!(curDept && curDept.name === '払出'));
      // 已彻底禁用 mobile-print-style 注入,beforeprint 不再做 brute-force inline 覆盖。
      // 所有平台统一走 base print CSS,部门高度由 --print-body-h 控制(已设)。
      // col 宽度交给 print CSS 处理(支持用户 --col-*-w 自定义 px 值;未设时 fallback 到 mm)。
      // 此处不再 inline 覆盖,inline 会压过 CSS 里的 var fallback 链,让用户自定义失效。
    });
    window.addEventListener('afterprint', () => {
      if (originalTitle) document.title = originalTitle;
      document.documentElement.style.removeProperty('--total-rows');
      document.documentElement.style.removeProperty('--row-h-fixed');
      document.documentElement.style.removeProperty('--print-body-h');
      document.documentElement.style.removeProperty('--print-row-h-base');
      document.documentElement.style.removeProperty('--day-cell-pad-ratio');
      document.body.classList.remove('print-dept-haraidashi');
      // 清除 beforeprint 给 col 加的 inline width(否则屏幕显示会异常)
      document.querySelectorAll('table.schedule col').forEach(c => c.style.removeProperty('width'));
      // Clean up brute-force inline styles
      document.documentElement.style.removeProperty('height');
      document.body.style.removeProperty('height');
      document.body.style.removeProperty('overflow');
      const pageEl = document.getElementById('page-schedule');
      const wrapEl = document.querySelector('#page-schedule .schedule-wrap');
      if (pageEl) pageEl.style.removeProperty('height');
      if (wrapEl) wrapEl.style.removeProperty('height');
      const cells = document.querySelectorAll('#page-schedule table.schedule th, #page-schedule table.schedule td');
      cells.forEach(c => {
        c.style.removeProperty('height');
        c.style.removeProperty('font-size');
        c.style.removeProperty('line-height');
        c.style.removeProperty('padding-top');
        c.style.removeProperty('padding-bottom');
      });
      document.querySelectorAll('#page-schedule table.schedule td.required input, #page-schedule table.schedule td.dispatch input').forEach(i => {
        i.style.removeProperty('font-size');
      });
    });
  }

  return { init, showRoute };
})();

const Pages = (() => {
  // 「個人」虚拟部门 id — 选中此项时进入个人排班视图(由两个固定人员组成)。
  // 出勤A = 「夕盛」部门「白 海竜」、出勤B = 「払出」部门「ビョウ セイイ」。
  // 「出」= cellStatus === 'work'(或文字标记为班次「早/晚」);其他状态(〇/有/欠/✲)= 「休」。
  const PERSONAL_VIEW = '__personal__';
  const HOURS_VIEW = '__hours__';
  const PERSONAL_A = { deptName: '夕盛', personName: '白 海竜' };
  const PERSONAL_B = { deptName: '払出', personName: 'ビョウ セイイ' };
  // 算作出勤的特殊文字(班次标记)— 与 computeLineTotal 保持一致
  const WORK_TEXTS_PERSONAL = new Set(['早', '晚', '早番', '遅番', '中']);

  const highlightedRows = new Set();   // personId
  const highlightedCols = new Set();   // ymd
  let focusedCell = null;              // { personId, ymd } or null
  let activeColor = null;              // 'red'|'orange'|'yellow'|'green'|'blue'|'purple' or null
  const COLOR_MAP = {
    red: '#dc2626', orange: '#ea580c', yellow: '#ca8a04',
    green: '#16a34a', blue: '#2563eb', purple: '#9333ea'
  };
  const CELL_STATUS_CLASSES = ['work', 'contractRest', 'paidLeave', 'absent', 'retired'];

  // 把单元格的视觉(状态 class + 显示字符 + 颜色)从 store 同步到一个 td 上。
  // buildBody 和 patchDayCell 共用 → 两条路径渲染逻辑绝对一致,不会出现"点了不更新"或"显示错"的偏差。
  // 只增删状态相关 class,保留 hl-col/hl-row/cell-focus 等高亮/焦点 class。
  function applyDayCellVisual(td, deptId, personId, ymd) {
    CELL_STATUS_CLASSES.forEach(c => td.classList.remove(c));
    td.classList.remove('has-text');
    td.style.removeProperty('background-color');
    td.style.removeProperty('color');
    const st = Store.cellStatus(deptId, personId, ymd);
    const ct = Store.cellText(deptId, personId, ymd); // { text, color } 或 null
    const displayChar = (ct && ct.text)
      || (st === 'contractRest' ? '〇' : st === 'paidLeave' ? '有' : st === 'absent' ? '欠' : st === 'retired' ? '✲' : '');
    td.textContent = displayChar;
    td.classList.add(st);
    if (ct && ct.text) td.classList.add('has-text');
    const c = Store.cellColor(deptId, personId, ymd);
    if (c && COLOR_MAP[c]) {
      td.style.setProperty('background-color', COLOR_MAP[c], 'important');
      td.style.setProperty('color', '#fff', 'important');
    } else if (ct && ct.color && COLOR_MAP[ct.color]) {
      td.style.setProperty('color', COLOR_MAP[ct.color], 'important');
    }
  }

  // 点出勤格后的局部更新:只改受影响的 3 处,不重建整表(手机端卡顿根因)。
  // 复用 computeSums / computeLineTotal 等全量渲染同款计算函数 → 显示值不可能与全量渲染不一致。
  function patchDayCell(deptId, personId, ymd) {
    const periodKey = Store.get().ui.currentPeriod;
    const days = Period.days(periodKey);
    const person = Store.peopleInPeriod(deptId, periodKey).find(p => p.id === personId);
    if (!person) return;
    // 1) 被点的格子本身
    const cell = document.querySelector(`td.day-cell[data-person="${personId}"][data-ymd="${ymd}"]`);
    if (cell) applyDayCellVisual(cell, deptId, personId, ymd);
    // 2) 该人员的 有休/契休/残 汇总(整周期重算)
    const sums = computeSums(deptId, person, periodKey, days);
    const row = document.querySelector(`tr[data-person-id="${personId}"]`);
    if (row) {
      const paidEl = row.querySelector('td.sum-col[data-sum="paid"]');
      if (paidEl) paidEl.textContent = String(sums.paid);
      const contractEl = row.querySelector('td.sum-col[data-sum="contract"]');
      if (contractEl) {
        contractEl.textContent = String(sums.contract);
        contractEl.classList.remove('over', 'under');
        if (sums.restCount > sums.contract) contractEl.classList.add('over');
        else if (sums.restCount < sums.contract) contractEl.classList.add('under');
      }
      const remainEl = row.querySelector('td.sum-col[data-sum="remain"]');
      if (remainEl) remainEl.textContent = sums.remaining == null ? '—' : String(sums.remaining);
    }
    // 3) 当天的 ライン合計 + 過不足
    const lineTotal = computeLineTotal(deptId, ymd);
    const ltEl = document.querySelector(`tr.stat-row td.linetotal[data-ymd="${ymd}"]`);
    if (ltEl) ltEl.textContent = String(lineTotal);
    const excess = lineTotal + Store.dispatchCount(deptId, ymd) - Store.requiredCount(deptId, ymd);
    const exEl = document.querySelector(`tr.stat-row td.excess[data-ymd="${ymd}"]`);
    if (exEl) {
      exEl.textContent = String(excess);
      exEl.style.color = excess < 0 ? 'var(--danger)' : excess > 0 ? 'var(--muted)' : '';
    }
  }
  function setActiveColor(c) { activeColor = (activeColor === c) ? null : c; activeTool = null; renderPalette(); }
  let activeTool = null; // 'text' = 文字工具激活;点击单元格弹 popover 输入一个字符
  function setActiveTool(tool) { activeTool = (activeTool === tool) ? null : tool; activeColor = null; renderPalette(); }

  function setFocus(personId, ymd) {
    const days = Period.days(Store.get().ui.currentPeriod);
    if (!days.find(d => d.ymd === ymd)) return;
    const ppl = Store.peopleInPeriod();
    if (!ppl.find(p => p.id === personId)) return;
    focusedCell = { personId, ymd };
    applyFocus();
  }

  function applyFocus() {
    document.querySelectorAll('.cell-focus').forEach(el => el.classList.remove('cell-focus'));
    if (!focusedCell) return;
    const sel = `td.day-cell[data-person="${focusedCell.personId}"][data-ymd="${focusedCell.ymd}"]`;
    const cell = document.querySelector(sel);
    if (cell) cell.classList.add('cell-focus');
  }

  function moveFocus(dx, dy) {
    if (!focusedCell) return;
    const days = Period.days(Store.get().ui.currentPeriod);
    const ppl = Store.peopleInPeriod();
    const di = days.findIndex(d => d.ymd === focusedCell.ymd);
    const pi = ppl.findIndex(p => p.id === focusedCell.personId);
    const newDi = Math.max(0, Math.min(days.length - 1, di + dx));
    const newPi = Math.max(0, Math.min(ppl.length - 1, pi + dy));
    focusedCell = { personId: ppl[newPi].id, ymd: days[newDi].ymd };
    applyFocus();
  }

  function setFocusedState(status) {
    if (!focusedCell) return;
    const deptId = Store.get().ui.currentDept;
    const days = Period.days(Store.get().ui.currentPeriod);
    const di = days.findIndex(d => d.ymd === focusedCell.ymd);
    const cur = { ...focusedCell };
    // advance focus first so re-render picks it up
    if (di < days.length - 1) {
      focusedCell = { personId: cur.personId, ymd: days[di + 1].ymd };
    }
    const st = Store.cellStatus(deptId, cur.personId, cur.ymd);
    // 派生 retired(来自人员的 retiredOn 字段)不可编辑;手动设的 ✲ 可以覆盖
    const person = (Store.people(deptId) || []).find(pp => pp.id === cur.personId);
    const isDerivedRetired = st === 'retired' && person && person.retiredOn && cur.ymd >= person.retiredOn;
    if (!isDerivedRetired) {
      Store.setCell(deptId, cur.personId, cur.ymd, status, activeColor);
    } else {
      applyFocus();
    }
  }

  function toggleRow(personId) {
    if (highlightedRows.has(personId)) highlightedRows.delete(personId);
    else highlightedRows.add(personId);
    applyHighlight();
  }
  function toggleCol(ymd) {
    if (highlightedCols.has(ymd)) highlightedCols.delete(ymd);
    else highlightedCols.add(ymd);
    applyHighlight();
  }

  function applyHighlight() {
    document.querySelectorAll('.hl-row, .hl-col').forEach(el => {
      el.classList.remove('hl-row');
      el.classList.remove('hl-col');
    });
    highlightedRows.forEach(pid => {
      document.querySelectorAll(`tr[data-person-id="${pid}"]`).forEach(tr => tr.classList.add('hl-row'));
    });
    highlightedCols.forEach(ymd => {
      document.querySelectorAll(`[data-ymd="${ymd}"]`).forEach(el => el.classList.add('hl-col'));
    });
  }

  // 通用拖拽尺寸调整。handle 是拖拽元素,key 是 state.sizes 的 key,axis 是 'x'(列宽) 或 'y'(行高),
  // measureSel 用于读初始尺寸(必须指向有真实 layout box 的元素 — th/td,不能是 col,
  //           因为 col 元素在手机 Safari 下 getBoundingClientRect 返回 0,导致拖动开始时尺寸被设成 0)。
  // applySel 用于拖动时实时改 inline width(列宽就是 col 元素,行高同 measureSel)。
  // 拖拽时直接改 documentElement 上的 CSS 变量,所有同类元素一起预览;松手后 Store.setSize 提交+重渲。
  // 双击 handle 重置该 key,清除 CSS 变量回退到默认值。
  function wireResize(handle, key, axis, measureSel, applySel) {
    const cssVar = '--' + key + (axis === 'x' ? '-w' : '-h');
    applySel = applySel || measureSel;
    const onStart = (clientPos) => {
      const ref = document.querySelector(measureSel);
      if (!ref) return;
      const rect = ref.getBoundingClientRect();
      const startSize = axis === 'x' ? rect.width : rect.height;
      let curSize = startSize;
      document.body.classList.add('resizing', axis === 'x' ? 'resizing-col' : 'resizing-row');
      const limits = { 'col-role':[10,200], 'col-name':[20,400], 'col-sum-paid':[10,100],
        'col-sum-contract':[10,100], 'col-sum-remain':[10,100], 'col-day':[12,80],
        'row-person':[14,80], 'row-stat':[14,80] }[key] || [8, 400];
      const onMove = (pos) => {
        const delta = pos - clientPos;
        curSize = Math.max(limits[0], Math.min(limits[1], Math.round(startSize + delta)));
        // 列宽:同时改 CSS 变量(打印 fallback 链) + 所有匹配 col 的 inline width(屏幕主路径)
        // 行高:只改 CSS 变量(tbody tr td 通过 var 读)
        document.documentElement.style.setProperty(cssVar, curSize + 'px');
        if (axis === 'x') {
          document.querySelectorAll(applySel).forEach(el => el.style.width = curSize + 'px');
        }
      };
      const onUp = () => {
        document.body.classList.remove('resizing', 'resizing-col', 'resizing-row');
        document.removeEventListener('mousemove', mm);
        document.removeEventListener('mouseup', mu);
        document.removeEventListener('touchmove', tm);
        document.removeEventListener('touchend', tu);
        if (curSize !== startSize) Store.setSize(key, curSize);
      };
      const mm = (e) => onMove(axis === 'x' ? e.clientX : e.clientY);
      const mu = () => onUp();
      const tm = (e) => { onMove(axis === 'x' ? e.touches[0].clientX : e.touches[0].clientY); e.preventDefault(); };
      const tu = () => onUp();
      document.addEventListener('mousemove', mm);
      document.addEventListener('mouseup', mu);
      document.addEventListener('touchmove', tm, { passive: false });
      document.addEventListener('touchend', tu);
    };
    handle.addEventListener('mousedown', (e) => {
      e.stopPropagation(); e.preventDefault();
      onStart(axis === 'x' ? e.clientX : e.clientY);
    });
    handle.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      e.preventDefault(); // 阻止手机长按出现的选择/放大镜/上下文菜单
      onStart(axis === 'x' ? e.touches[0].clientX : e.touches[0].clientY);
    }, { passive: false });
    handle.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      Store.resetSize(key);
    });
    handle.addEventListener('click', (e) => e.stopPropagation());
  }

  function renderSchedule() {
    // 「個人」虚拟视图:绕过整张排班表,渲染由两个固定人员组成的个人排班页
    const isPersonal = Store.get().ui.currentDept === PERSONAL_VIEW;
    const isHours = Store.get().ui.currentDept === HOURS_VIEW;
    if (isHours) {
      document.getElementById('page-schedule').classList.add('hidden');
      document.getElementById('page-personal').classList.add('hidden');
      document.getElementById('page-hours').classList.remove('hidden');
      renderDeptTabs();
      // hours 视图不需要主表的期间导航 — 它自己有月份选择器
      document.getElementById('period-nav').replaceChildren();
      renderHours();
      // nav 高度变化(从 3 行排班 nav 切到 1 行 hours nav)→ 同步 sticky 占位,
      // 否则手机端 body 仍保持旧的 padding-top,内容上方出现空白
      requestAnimationFrame(syncStickyOffsets);
      return;
    }
    if (isPersonal) {
      document.getElementById('page-schedule').classList.add('hidden');
      document.getElementById('page-personal').classList.remove('hidden');
      document.getElementById('page-hours').classList.add('hidden');
      renderDeptTabs();
      renderPeriodNav();
      renderPersonal();
      return;
    }
    document.getElementById('page-personal').classList.add('hidden');
    document.getElementById('page-hours').classList.add('hidden');
    document.getElementById('page-schedule').classList.remove('hidden');
    const host = document.getElementById('page-schedule');
    // 保存滚动位置:点 day-cell 等任何 store 操作都触发整页重渲(DOM rebuild),
    // 浏览器丢失滚动状态会回到顶部。RAF 里 rebuild 完成后还原。
    const savedScrollX = window.scrollX;
    const savedScrollY = window.scrollY;
    Render.clear(host);
    renderDeptTabs();
    renderPeriodNav();
    if (Store.get().ui.editMode) host.appendChild(buildEntryHint());
    host.appendChild(buildTable());
    // 用户自定义尺寸 → CSS 变量。每次 render 都清掉再重设,确保 reset (delete sizes[key]) 能回退到默认
    const root = document.documentElement;
    const sizes = Store.get().sizes || {};
    ['col-role-w','col-name-w','col-sum-paid-w','col-sum-contract-w','col-sum-remain-w','col-day-w','row-person-h','row-stat-h']
      .forEach(v => root.style.removeProperty('--' + v));
    Object.entries(sizes).forEach(([key, px]) => {
      const suffix = key.startsWith('col-') ? '-w' : '-h';
      root.style.setProperty('--' + key + suffix, px + 'px');
    });
    requestAnimationFrame(() => {
      syncStickyOffsets(); applyHighlight(); applyFocus();
      // 还原滚动位置 — DOM rebuild 后浏览器会回到 (0,0),用保存值同步回去
      if (window.scrollX !== savedScrollX || window.scrollY !== savedScrollY) {
        window.scrollTo(savedScrollX, savedScrollY);
      }
    });
  }

  function buildEntryHint() {
    const div = Render.el('div.entry-hint');
    const left = Render.el('span');
    left.innerHTML = '键盘: <kbd>1</kbd>=〇 <kbd>2</kbd>=有 <kbd>3</kbd>=空 <kbd>4</kbd>=✲　<kbd>→</kbd><kbd>↓</kbd> 移焦　<kbd>Enter</kbd> 下一人';
    div.appendChild(left);
    div.appendChild(buildColorPalette());

  function buildColorPalette() {
    const wrap = Render.el('div.color-palette');
    wrap.appendChild(Render.el('span', { style: { color: 'var(--muted)' } }, '颜色:'));
    const swatches = [
      { c: 'clear', tag: 'button.swatch.swatch-clear', label: '×', title: '出勤+清色(擦除已涂的颜色,保持出勤)' },
      { c: 'red',    tag: 'button.swatch', hex: COLOR_MAP.red,    title: '红' },
      { c: 'orange', tag: 'button.swatch', hex: COLOR_MAP.orange, title: '橙' },
      { c: 'yellow', tag: 'button.swatch', hex: COLOR_MAP.yellow, title: '黄' },
      { c: 'green',  tag: 'button.swatch', hex: COLOR_MAP.green,  title: '绿' },
      { c: 'blue',   tag: 'button.swatch', hex: COLOR_MAP.blue,   title: '蓝' },
      { c: 'purple', tag: 'button.swatch', hex: COLOR_MAP.purple, title: '紫' }
    ];
    for (const s of swatches) {
      const attrs = { onclick: () => setActiveColor(s.c), title: s.title };
      if (s.hex) attrs.style = { background: s.hex };
      const btn = Render.el(s.tag, attrs, s.label || '');
      btn.dataset.colorKey = s.c || '';
      if ((activeColor || '') === (s.c || '')) btn.classList.add('active');
      wrap.appendChild(btn);
    }
    // 文字工具按钮:激活后点击单元格弹 popover 输入一个字符
    const textBtn = Render.el('button.swatch.swatch-text', {
      onclick: () => setActiveTool('text'),
      title: '文字工具(点击单元格输入一个字符)'
    }, 'T');
    textBtn.dataset.toolKey = 'text';
    if (activeTool === 'text') textBtn.classList.add('active');
    wrap.appendChild(textBtn);
    return wrap;
  }

  function renderPalette() {
    document.querySelectorAll('.color-palette .swatch').forEach(b => {
      const isText = b.classList.contains('swatch-text');
      if (isText) b.classList.toggle('active', activeTool === 'text');
      else b.classList.toggle('active', (b.dataset.colorKey || '') === (activeColor || ''));
    });
  }

  function syncStickyOffsets() {
    const nav = document.querySelector('.nav');
    if (!nav) return;
    document.documentElement.style.setProperty('--sticky-nav', nav.offsetHeight + 'px');
  }

  let resizeT;
  window.addEventListener('resize', () => {
    clearTimeout(resizeT);
    resizeT = setTimeout(syncStickyOffsets, 60);
  });


  // global keyboard speed entry
  document.addEventListener('keydown', (e) => {
    if (!Store.get().ui.editMode || !focusedCell) return;
    const tag = e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    const k = e.key;
    if (k === '1') { setFocusedState('contractRest'); e.preventDefault(); }
    else if (k === '2') { setFocusedState('paidLeave'); e.preventDefault(); }
    else if (k === '3' || k === '0' || k === ' ') { setFocusedState('work'); e.preventDefault(); }
    else if (k === '4') { setFocusedState('retired'); e.preventDefault(); }
    else if (k === 'ArrowRight' || (k === 'Tab' && !e.shiftKey)) { moveFocus(1, 0); e.preventDefault(); }
    else if (k === 'ArrowLeft' || (k === 'Tab' && e.shiftKey)) { moveFocus(-1, 0); e.preventDefault(); }
    else if (k === 'ArrowDown') { moveFocus(0, 1); e.preventDefault(); }
    else if (k === 'ArrowUp') { moveFocus(0, -1); e.preventDefault(); }
    else if (k === 'Enter') {
      const ppl = Store.peopleInPeriod();
      const days = Period.days(Store.get().ui.currentPeriod);
      const pi = ppl.findIndex(p => p.id === focusedCell.personId);
      if (pi >= 0 && pi < ppl.length - 1) {
        focusedCell = { personId: ppl[pi + 1].id, ymd: days[0].ymd };
        applyFocus();
      }
      e.preventDefault();
    } else if (k === 'Escape') {
      focusedCell = null;
      applyFocus();
      e.preventDefault();
    }
  });

  function renderDeptTabs() {
    const host = document.getElementById('dept-tabs');
    Render.clear(host);
    const depts = Store.get().departments;
    let cur = Store.get().ui.currentDept;
    // 运行时保险:cur 指向已删除部门时立即同步,避免 select 显示与 state 脱节。
    // '__personal__' / '__hours__' 是合法的虚拟视图 id,不修正。
    if (depts.length > 0 && cur !== PERSONAL_VIEW && cur !== HOURS_VIEW && !depts.find(d => d.id === cur)) {
      cur = depts[0].id;
      Store.setUi({ currentDept: cur });
      return; // setUi 会触发 listener 重新渲染整页
    }
    // 自定义下拉:trigger 按钮 + 弹层
    const allOptions = [
      ...depts.map(d => ({ value: d.id, label: d.name })),
      { sep: true },
      { value: PERSONAL_VIEW, label: '個人' },
      { value: HOURS_VIEW, label: '月度工时' }
    ];
    const curOpt = allOptions.find(o => !o.sep && o.value === cur) || allOptions[0];
    const curLabel = curOpt && !curOpt.sep ? curOpt.label : '';

    const dd = Render.el('div.dept-dropdown');
    const trigger = Render.el('button.dept-trigger', { type: 'button' });
    trigger.innerHTML = `<span class="dept-trigger-name">${curLabel}</span><span class="dept-trigger-chev">▾</span>`;
    const pop = Render.el('div.dept-pop');
    pop.innerHTML = allOptions.map(o => {
      if (o.sep) return '<div class="dept-sep"></div>';
      const active = o.value === cur ? ' active' : '';
      return `<button type="button" class="dept-item${active}" data-val="${o.value}">${o.label}</button>`;
    }).join('');
    dd.appendChild(trigger);
    dd.appendChild(pop);
    host.appendChild(dd);

    const close = () => dd.classList.remove('open');
    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const opening = !dd.classList.contains('open');
      // 关掉同级其他弹层
      document.querySelectorAll('.dept-dropdown.open').forEach(d => d.classList.remove('open'));
      if (opening) dd.classList.add('open');
    });
    pop.addEventListener('click', (e) => {
      const btn = e.target.closest('.dept-item');
      if (!btn) return;
      e.stopPropagation();
      const val = btn.dataset.val;
      close();
      if ((val === PERSONAL_VIEW || val === HOURS_VIEW) && location.hash && location.hash !== '#/schedule') {
        history.replaceState(null, '', location.pathname + location.search);
      }
      Store.setUi({ currentDept: val });
    });
    // 点击外部 → 关闭(每次 renderDeptTabs 重新绑定也无所谓,旧 dd 被 clear 已从 DOM 移除)
    if (!renderDeptTabs._docBound) {
      document.addEventListener('mousedown', (ev) => {
        if (!ev.target.closest('.dept-dropdown')) {
          document.querySelectorAll('.dept-dropdown.open').forEach(d => d.classList.remove('open'));
        }
      });
      renderDeptTabs._docBound = true;
    }
  }

    host.classList.add('period-nav');

  function buildTable() {
    const wrap = Render.el('div.schedule-wrap');
    // 滚动时显示滚动条,停 800ms 后隐藏(覆盖式行为)。wrap 每次重建,监听随之重建,无泄漏。
    let scrollHideT;
    wrap.addEventListener('scroll', () => {
      wrap.classList.add('is-scrolling');
      clearTimeout(scrollHideT);
      scrollHideT = setTimeout(() => wrap.classList.remove('is-scrolling'), 800);
    }, { passive: true });
    const tbl = Render.el('table.schedule');
    const days = Period.days(Store.get().ui.currentPeriod);
    const todayYmd = Util.ymd(new Date());
    // 显式算 table 总宽。固定列严格按声明值,日期列自动撑满剩余 viewport(若用户未自定义)。
    // 这样 table.width 是具体 px → table-layout:fixed 严格生效;同时 table 总宽=viewport 不留空白。
    const sizes = Store.get().sizes || {};
    const fixedSum = (sizes['col-role'] || 60)
      + (sizes['col-name'] || 130)
      + (sizes['col-sum-paid'] || 36)
      + (sizes['col-sum-contract'] || 36)
      + (sizes['col-sum-remain'] || 36);
    // 真正可放表格的宽度 = page-schedule 内容宽(clientWidth 含左右内边距,要减掉)
    //   − 右侧预留的滚动条空间(scrollbar-gutter:stable,单侧 8px)。
    // 不减全的话自适应表格会比可视区宽 → 最后一列(15日)被挤到右边看不见。
    const GUTTER_W = 8; // scrollbar-gutter stable 仅右侧 8px
    const pageSchedule = document.getElementById('page-schedule');
    let containerW;
    if (pageSchedule) {
      const cs = getComputedStyle(pageSchedule);
      const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight); // 左右内边距(各 16px)
      containerW = pageSchedule.clientWidth - padX - GUTTER_W;
    } else {
      containerW = window.innerWidth - 32 - GUTTER_W;
    }
    // 自动日期列宽:剩余空间 / 天数,下限 27px(防止日期列太小);用户显式设过则用用户值(严格)
    const isAutoDay = sizes['col-day'] == null;
    const autoDayW = Math.max(27, Math.floor((containerW - fixedSum) / days.length));
    const dayW = isAutoDay ? autoDayW : sizes['col-day'];
    const totalW = fixedSum + dayW * days.length;
    // 自动模式:表格宽 = 容器宽。floor 取整余数(各列累加比容器少几十 px)由 table-layout:fixed
    //   均摊给各列(每列约 +1px,看不出),表格填满容器 → 消除右侧多余空隙,左右留白对称。
    // 自定义模式:严格用各列之和(用户指定的列宽不被重新分配)。
    tbl.style.width = (isAutoDay ? containerW : totalW) + 'px';
    tbl.appendChild(buildColgroup(days, dayW));
    tbl.appendChild(buildHeader(days, todayYmd));
    tbl.appendChild(buildBody(days, todayYmd));
    wrap.appendChild(tbl);
    // dynamic print row-height based on people count
    const peopleN = Store.peopleInPeriod(Store.get().ui.currentDept).length;
    const AVAIL = 560;
    const MIN = 14, MAX = 31;
    const rowH = Math.max(MIN, Math.min(MAX, Math.round(AVAIL / Math.max(1, peopleN))));
    wrap.style.setProperty('--print-row-h', rowH + 'px');
    // 彻底禁用 mobile-print-style — 直接从 DOM 移除残留元素(任何 textContent 都不留)
    document.querySelectorAll('#mobile-print-style, style[id="mobile-print-style"]').forEach(el => el.remove());
    return wrap;
  }

  function buildColgroup(days, dayW) {
    const cg = Render.el('colgroup');
    // inline style 优先级最高,直接写 px 值绕开所有 CSS 优先级 / box-sizing 解析差异问题。
    const sizes = Store.get().sizes || {};
    const applyCol = (col, sizeKey, defaultPx) => {
      const px = sizes[sizeKey];
      if (px != null) col.style.width = px + 'px';
      return col;
    };
    cg.appendChild(applyCol(Render.el('col.col-role'),         'col-role',         60));
    cg.appendChild(applyCol(Render.el('col.col-name'),         'col-name',         130));
    cg.appendChild(applyCol(Render.el('col.col-sum.s-paid'),   'col-sum-paid',     36));
    cg.appendChild(applyCol(Render.el('col.col-sum.s-contract'),'col-sum-contract',36));
    cg.appendChild(applyCol(Render.el('col.col-sum.s-remain'), 'col-sum-remain',   36));
    // 日期列宽:由 buildTable 计算后传入(用户自定义则用用户值,否则自动撑满 viewport)

  function buildHeader(days, todayYmd) {

    addFixedColHeader('th.sum-col.s-paid', '有休', 'col-sum-paid', 'table.schedule th.sum-col.s-paid', 'table.schedule col.col-sum.s-paid');
    addFixedColHeader('th.sum-col.s-contract', '契休', 'col-sum-contract', 'table.schedule th.sum-col.s-contract', 'table.schedule col.col-sum.s-contract');
    addFixedColHeader('th.sum-col.s-remain', '残', 'col-sum-remain', 'table.schedule th.sum-col.s-remain', 'table.schedule col.col-sum.s-remain');

    for (const d of days) {

      th.appendChild(colHandle);

      if (d.isSat) th.classList.add('sat');
      if (d.isSun || d.isHoliday) th.classList.add('sun');

    thead.appendChild(r2);
