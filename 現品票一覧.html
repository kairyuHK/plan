  h1{margin:0;font-size:1.28rem;font-weight:700;letter-spacing:.01em}

  .count{font-family:var(--font-num);font-size:.8rem;color:var(--muted);white-space:nowrap}
  .count b{color:var(--accent);font-size:1rem}

  .fchip{flex:0 0 auto;font:inherit;font-size:.8rem;cursor:pointer;white-space:nowrap;
    padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
    color:var(--fg);display:flex;gap:6px;align-items:center}
  .fchip .c{font-family:var(--font-num);font-size:.72rem;color:var(--muted)}
  .fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .fchip[aria-pressed="true"] .c{color:#fff;opacity:.85}

  main{padding-block:12px 32px}
  .group{margin-top:18px}
  .group:first-child{margin-top:4px}
  .ghead{display:flex;align-items:baseline;gap:9px;margin:0 2px 9px;
    position:sticky;top:calc(env(safe-area-inset-top,0px) + 2px);z-index:1}
  .gname{font-size:1.02rem;font-weight:700;color:var(--accent);
    background:var(--accent-soft);padding:3px 12px;border-radius:8px}
  .gcount{font-family:var(--font-num);font-size:.78rem;color:var(--muted)}

  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:12px 15px 13px;display:flex;flex-direction:column;gap:10px}
  .name{font-size:1rem;font-weight:600;line-height:1.45;text-wrap:balance;word-break:break-word}
  .row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .qty{display:flex;align-items:baseline;gap:4px;background:var(--accent-soft);
    color:var(--accent);padding:4px 12px;border-radius:10px}

  .qty .unit{font-size:.92rem;font-weight:600}
  .meta{margin:0;display:flex;gap:16px}
  .meta div{display:flex;flex-direction:column;gap:1px}
  .meta dt{font-size:.64rem;color:var(--muted);letter-spacing:.06em}
  .meta dd{margin:0;font-family:var(--font-num);font-size:.92rem;color:var(--fg)}
  .foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;

  .chip{font-family:var(--font-num);font-size:.7rem;color:var(--muted);
    background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
  .chip.alt{color:var(--warn);background:var(--warn-soft);border-color:transparent;font-family:var(--font-body)}
  .empty{text-align:center;color:var(--muted);padding:36px 0;font-size:.9rem}
  mark{background:var(--accent-soft);color:var(--accent);border-radius:3px;padding:0 1px}
</style>

const ORDER = ["盛付行","タレ混ぜ","ゆで卵","サラダ攪拌","フライヤー","鍋","蒸気"];
const list=document.getElementById('list');
const q=document.getElementById('q');
const n=document.getElementById('n');
const empty=document.getElementById('empty');
const chipsEl=document.getElementById('chips');
let active="";

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hi(text,term){
  const t=esc(String(text));
  if(!term) return t;
  const i=t.toLowerCase().indexOf(term.toLowerCase());
  if(i<0) return t;
  return t.slice(0,i)+'<mark>'+t.slice(i,i+term.length)+'</mark>'+t.slice(i+term.length);
}

// build filter chips
const counts={};
ORDER.forEach(l=>counts[l]=DATA.filter(d=>d.line===l).length);
function renderChips(){
  const all=`<button class="fchip" data-l="" aria-pressed="${active===""}">すべて<span class="c">${DATA.length}</span></button>`;
  chipsEl.innerHTML=all+ORDER.map(l=>
    `<button class="fchip" data-l="${l}" aria-pressed="${active===l}">${l}<span class="c">${counts[l]}</span></button>`
  ).join("");
}
chipsEl.addEventListener('click',e=>{
  const b=e.target.closest('.fchip'); if(!b) return;
  active=b.dataset.l; renderChips(); render();
});

function render(){
  const t=q.value.trim();
  const tl=t.toLowerCase();
  const rows=DATA.filter(d=>{
    if(active && d.line!==active) return false;
    if(t && !(d.name+d.order+d.mng+d.seq).toLowerCase().includes(tl)) return false;
    return true;
  });
  n.textContent=rows.length;
  empty.hidden=rows.length>0;
  let html="";
  for(const l of ORDER){
    const g=rows.filter(d=>d.line===l);
    if(!g.length) continue;
    html+=`<section class="group"><div class="ghead"><span class="gname">${l}</span><span class="gcount">${g.length}件</span></div><ul>`;
    html+=g.map(d=>`
      <li class="card">
        <div class="name">${hi(d.name,t)}</div>
        <div class="row">
          <div class="qty"><span class="num">${d.qty}</span><span class="unit">${d.unit}</span></div>
          <dl class="meta">
            <div><dt>注番</dt><dd>${hi(d.order,t)}</dd></div>
            <div><dt>管理番号</dt><dd>${hi(d.mng,t)}</dd></div>
          </dl>
        </div>
        <div class="foot">
          <span class="chip">No.${d.seq}</span>
          <span class="chip">表${d.src}</span>
          ${d.pages?`<span class="chip">${d.pages}</span>`:""}
          ${d.jikan?`<span class="chip alt">製造時間${d.jikan}</span>`:""}
        </div>
      </li>`).join("");
    html+=`</ul></section>`;
  }
  list.innerHTML=html;
}
renderChips();
render();
q.addEventListener('input',render);
</script>
