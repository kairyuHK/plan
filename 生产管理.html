// 当输入的名字命中便当库时,锁定 LINE 速度与人数输入,并填入便当数据
function updateBentoLinkUI(name) {
  const key = (name || '').trim();
  const b = key ? bentoMap.get(key) : null;
  if (b) {
    const spd = parseFloat(b.speed);
    if (spd > 0) libLineSpeedInput.value = spd;
    if (Array.isArray(b.line)) libPeopleInput.value = b.line.length;
    libLineSpeedInput.disabled = true;
    libPeopleInput.disabled = true;
    libLineSpeedInput.title = '由配置表 · 便当库自动同步';
    libPeopleInput.title = '由配置表 · 便当库自动同步';
    libLineSpeedInput.placeholder = '由便当库同步';
    libPeopleInput.placeholder = '由便当库同步';
  } else {
    libLineSpeedInput.disabled = false;
    libPeopleInput.disabled = false;
    libLineSpeedInput.title = '';
    libPeopleInput.title = '';
    libLineSpeedInput.placeholder = '流水线速度';
    libPeopleInput.placeholder = '人数 (可输入?)';
  }
}

libAddBtn.addEventListener('click', () => {
  const name = libNameInput.value.trim();
  const speed = parseFloat(libSpeedInput.value);
  const lineSpeed = parseFloat(libLineSpeedInput.value) || 0;
  const people = parsePeople(libPeopleInput.value);
  const meterPeople = Math.max(1, parseInt(libMeterPeopleInput.value) || 1);
  if (!name) { libNameInput.focus(); return; }
  if (!speed || speed <= 0) { libSpeedInput.focus(); return; }
  if (editingLibId) {
    const item = findLibItem(editingLibId);
    if (item) { item.name = name; item.speed = speed; item.lineSpeed = lineSpeed; item.people = people; item.meterPeople = meterPeople; item.color = selectedColor; }
    const editedId = editingLibId;
    cancelEditLib();
    applyBentoOverlay();
    propagateLibChange(editedId);
  } else {
    library.push({ id: uid(), name, speed, lineSpeed, people, meterPeople, color: selectedColor });
    libNameInput.value = ''; libSpeedInput.value = ''; libLineSpeedInput.value = ''; libPeopleInput.value = ''; libMeterPeopleInput.value = '';
    applyBentoOverlay();
    updateBentoLinkUI('');
  }
  saveLibrary();
  renderLibList();
  libNameInput.focus();
});

// 同步「弹窗便当名」的可点状态:只有当 libItem 已链接到配置表的便当(有 bentoId)时,
// 才显示成可点的链接样式 + tooltip;否则就是普通文本,点了也不响应。
function refreshNameLinkState(nameEl, libId) {
  const it = findLibItem(libId);
  const linked = !!(it && it.bentoId);
  nameEl.classList.toggle('is-bento-link', linked);
  nameEl.title = linked ? `跳转到配置表 · ${it.name}` : '';
}
function propagateLibChange(libId) {
  const item = findLibItem(libId);
  if (!item) return;
  const affectedLines = new Set();
  document.querySelectorAll(`.card[data-type="job"]`).forEach(card => {
    if (card.dataset.libId !== libId) return;
    card.dataset.name = item.name;
    card.dataset.color = item.color;
    card.style.borderLeftColor = item.color;
    const letterEl = card.querySelector('.compact-name-letter');
    const display = popupQ(card, '.card-name-display');
    if (letterEl) { letterEl.textContent = (item.name || '').charAt(0); letterEl.style.color = item.color || ''; }
    if (display) { display.textContent = item.name; refreshNameLinkState(display, libId); }
    const lineSpdInp = popupQ(card, '.line-speed');
    const peopleInp = popupQ(card, '.people');
    const meterInp = popupQ(card, '.meter-people');
    if (lineSpdInp) {
      // 按卡片所在线解析流水线速度(显示用)
      const _lineId = getLineIdFromNode(card);
      const _ls = resolveItemLineSpeed(item, _lineId);
      lineSpdInp.value = _ls > 0 ? _ls : '';
    }
    if (peopleInp) peopleInp.value = (item.people === '?' || item.people === '？') ? '?' : (item.people > 0 ? item.people : '');
    // 品名速度 / 计量人数 已改为每张卡独立快照,品名库编辑不再回写已有卡片(避免改动之前日期的计划)。
    affectedLines.add(card.closest('.line'));
  });
  affectedLines.forEach(l => l && recalc(l));
  if (affectedLines.size) scheduleSaveBoard();
}
// 把品名库当前的「品名速度 / 计量人数」推送到当前显示日期(currentDate)所有该品名的卡片上。
// 只影响打开的这一天的 DOM 与存储,其它日期的快照不动。
function applyLibToCurrentDate(libId) {
  const item = findLibItem(libId);
  if (!item) return;
  const affectedLines = new Set();
  let count = 0;
  document.querySelectorAll('.card[data-type="job"]').forEach(card => {
    if (card.dataset.libId !== libId) return;
    // 按卡片所在线解析速度,把当前库的默认/覆盖值推送到卡片快照
    const lineId = getLineIdFromNode(card);
    const resolved = resolveItemSpeed(item, lineId);
    card.dataset.speed = resolved > 0 ? String(resolved) : '';
    const meterInp = popupQ(card, '.meter-people');
    if (meterInp) meterInp.value = item.meterPeople > 0 ? item.meterPeople : 1;
    // 同时更新流水线速度输入(显示用)
    const lineSpdInp = popupQ(card, '.line-speed');
    if (lineSpdInp) {
      const resolvedLs = resolveItemLineSpeed(item, lineId);
      lineSpdInp.value = resolvedLs > 0 ? resolvedLs : '';
    }
    affectedLines.add(card.closest('.line'));
    count++;
  });
  affectedLines.forEach(l => l && recalc(l));
  if (affectedLines.size) scheduleSaveBoard();
  showToast(count > 0
    ? `已应用到 ${currentDate} 的 ${count} 张「${item.name}」卡片`
    : `${currentDate} 没有「${item.name}」的卡片`);
}

  else if (cardTop + cardH > s + wrapH - 8) wrap.scrollTop = Math.max(0, cardTop + cardH - wrapH + 20);
}

// 弹窗查询助手：当 popup 被移到 body 下时，从 card._popup 查找
function popupQ(card, sel) {

    if (inPopup) return inPopup;
  }

function detachPopup(card) {
  const popup = card.querySelector(':scope > .card-expanded');
  if (popup && popup.parentElement === card) {
    card._popup = popup;
    popup.classList.add('popup-detached');
    popup.classList.toggle('is-rest', card.classList.contains('rest'));
    popup.classList.toggle('is-error', card.classList.contains('error'));
    document.body.appendChild(popup);
  }
}
function reattachPopup(card) {
  if (card._popup) {
    card._popup.classList.remove('popup-detached', 'is-rest', 'is-error');
    card.appendChild(card._popup);
    card._popup = null;
  }
}
function syncPopupState(card) {
  if (!card._popup) return;
  card._popup.classList.toggle('is-rest', card.classList.contains('rest'));
  card._popup.classList.toggle('is-error', card.classList.contains('error'));
}

function setActiveCard(card) {
  if (activeCard && activeCard !== card) {
    activeCard.classList.remove('active');
    reattachPopup(activeCard);
  }
  activeCard = card;
  if (card) {
    card.classList.add('active');
    detachPopup(card);
    requestAnimationFrame(() => {
      ensureRoomForPopup(card);
      positionCardPopup(card);
    });
  }
}

// 若卡片下方空间不足容纳弹窗，向下滚动 wrap 让卡片视觉上移
function ensureRoomForPopup(card) {
  const popup = card._popup || card.querySelector('.card-expanded');
  if (!popup) return;
  popup.style.top = '0px'; popup.style.left = '0px';
  const popupRect = popup.getBoundingClientRect();
  const cardRect = card.getBoundingClientRect();
  const vh = window.innerHeight;
  const margin = 8;
  const spaceBelow = vh - cardRect.bottom - 6;
  const needed = popupRect.height + margin;
  if (spaceBelow >= needed) return;
  const wrap = card.closest('.cards-wrap');
  if (!wrap) return;
  const deficit = needed - spaceBelow;
  const room = wrap.scrollHeight - wrap.clientHeight - wrap.scrollTop;
  const adjust = Math.min(deficit, Math.max(0, room));
  if (adjust > 0) {
    scrollSyncing = true;
    document.querySelectorAll('.cards-wrap').forEach(w => w.scrollTop += adjust);
    timelineBody.scrollTop += adjust;
    scrollSyncing = false;
  }
}

// 弹窗始终贴在卡片下方；若仍不下放则贴底（可与卡片重叠），永不覆盖 sticky 表头(线头/时间轴头)
function getStickyHeadersBottom() {
  // 取所有 sticky 表头里 bottom 最大的(因 line-head 和 timeline-head 都 sticky top:0)
  let maxBottom = 0;
  document.querySelectorAll('.line-head, .timeline-head').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.bottom > maxBottom) maxBottom = r.bottom;
  });
  return maxBottom;
}
function positionCardPopup(card) {
  const popup = card._popup || card.querySelector('.card-expanded');
  if (!popup) return;
  popup.style.top = '0px'; popup.style.left = '0px';
  popup.style.maxHeight = ''; // 重置后再算
  const cardRect = card.getBoundingClientRect();
  const popupRect = popup.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  const margin = 8;
  const minTop = Math.max(margin, getStickyHeadersBottom() + margin); // 不允许进入表头区
  // 限制 popup 高度,确保不会越过表头
  const availH = vh - minTop - margin;
  if (popupRect.height > availH) {
    popup.style.maxHeight = availH + 'px';
  }
  const ph = Math.min(popupRect.height, availH);
  let top = cardRect.bottom + 6;
  if (top + ph + margin > vh) {
    top = Math.max(minTop, vh - ph - margin);
  }
  if (top < minTop) top = minTop;
  let left = cardRect.left;
  if (left + popupRect.width + margin > vw) left = vw - popupRect.width - margin;
  if (left < margin) left = margin;
  popup.style.top = top + 'px';
  popup.style.left = left + 'px';
}

function repositionActivePopup() {
  if (!activeCard) return;
  // 输入框聚焦时（手机端键盘弹起引发的滚动/视口变化）冻结弹窗位置，避免乱飞
  const popup = activeCard._popup;
  if (popup && popup.contains(document.activeElement)) return;
  positionCardPopup(activeCard);
}

function wireCardEvents(node, type) {
  const delBtn = node.querySelector('.card-del');
  const compactDel = node.querySelector('.compact-del');
  if (compactDel) {
    const handleDel = (e) => {
      e.stopPropagation(); e.preventDefault();
      const line = node.closest('.line');
      if (activeCard === node) setActiveCard(null);
      node.remove(); recalc(line); scheduleSaveBoard();
    };
    compactDel.addEventListener('click', handleDel);
    compactDel.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    compactDel.addEventListener('mousedown', (e) => e.stopPropagation());
  }
  let inputsToWatch;
  if (type === 'job') {
    inputsToWatch = [node.querySelector('.meter-people'), node.querySelector('.line-speed'), node.querySelector('.qty'), node.querySelector('.people')];
  } else {
    inputsToWatch = [node.querySelector('.rest-min'), node.querySelector('.rest-fixed'), node.querySelector('.rest-name-input')];
  }
  inputsToWatch.forEach(inp => {
    if (inp) inp.addEventListener('input', () => {
      if (inp.classList.contains('rest-name-input')) node.querySelector('.compact-name').textContent = inp.value || '休息';
      recalc(node.closest('.line'));
      scheduleSaveBoard();
    });
  });
  const meterInp = node.querySelector('.meter-people');
  if (meterInp) {
    meterInp.addEventListener('change', () => {
      const libId = node.dataset.libId;
      if (libId) propagateLibChange(libId);
    });
  }
  delBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const line = node.closest('.line');
    if (activeCard === node) setActiveCard(null);
    node.remove(); recalc(line); scheduleSaveBoard();
  });
  attachCardInteraction(node);
}

// ============ 拖动 & 点击交互 ============
// 短按抬手 → 弹出窗口；按住 350ms 后移动 → 拖动换位
const HOLD_MS = 350;
const MOVE_THRESHOLD = 8;
let dropIndicator = null;

function insertCardInGrid(grid, node, clientY) {
  const after = getDragAfter(grid, clientY);
  if (after == null) grid.appendChild(node); else grid.insertBefore(node, after);
}
function getDragAfter(grid, y) {
  const cards = [...grid.querySelectorAll('.card:not(.dragging)')];
  for (const c of cards) {
    const box = c.getBoundingClientRect();
    if (y < box.top + box.height / 2) return c;

}
function ensureDropIndicator() {
  if (!dropIndicator) {
    dropIndicator = document.createElement('div');
    dropIndicator.className = 'drop-indicator';
  }
  return dropIndicator;
}
function updateDropIndicator(grid, clientY) {
  const ind = ensureDropIndicator();
  if (ind.parentElement !== grid) grid.appendChild(ind);
  const rect = grid.getBoundingClientRect();
  ind.style.top = (clientY - rect.top) + 'px';

// ============ 拖拽时边缘自动滚动 ============
// 鼠标/手指停在视口顶部或底部触发区时,自动滚动卡片区域(并同步时间轴/其他列)
let autoScrollRAF = null;
let autoScrollSpeed = 0;
let autoScrollDragCtx = null; // { card, x, y } — 最近一次拖动坐标,用于滚动后重算插入位

// 选出真正能滚的容器:.main(移动端) 或 任意 .cards-wrap(桌面端)
function getScrollContainer() {
  const main = document.querySelector('.main');
  if (main && main.scrollHeight > main.clientHeight + 1) return main;
  const wrap = document.querySelector('.cards-wrap');
  if (wrap && wrap.scrollHeight > wrap.clientHeight + 1) return wrap;
  return null;
}
function applyScroll(delta) {
  const ct = getScrollContainer();
  if (!ct) return false;
  const maxScroll = ct.scrollHeight - ct.clientHeight;
  const before = ct.scrollTop;
  const next = Math.max(0, Math.min(maxScroll, before + delta));
  if (next === before) return false;
  if (ct.classList.contains('main')) {
    ct.scrollTop = next;
  } else {
    // 桌面:同步所有列 + 时间轴
    scrollSyncing = true;
    document.querySelectorAll('.cards-wrap').forEach(w => {
      w.scrollTop = Math.max(0, Math.min(w.scrollHeight - w.clientHeight, w.scrollTop + delta));
    });
    if (timelineBody) timelineBody.scrollTop = Math.max(0, Math.min(timelineBody.scrollHeight - timelineBody.clientHeight, timelineBody.scrollTop + delta));
    scrollSyncing = false;
  }
  return true;
}
function setAutoScroll(speed) {
  autoScrollSpeed = speed;
  if (speed === 0) {
    if (autoScrollRAF) { cancelAnimationFrame(autoScrollRAF); autoScrollRAF = null; }
    return;
  }
  if (autoScrollRAF) return;
  const tick = () => {
    autoScrollRAF = null;
    if (autoScrollSpeed === 0) return;
    const moved = applyScroll(autoScrollSpeed);
    if (!moved) { autoScrollSpeed = 0; return; } // 撞到顶/底就停
    if (autoScrollDragCtx) {
      const { card, x, y } = autoScrollDragCtx;
      reinsertAt(card, x, y);
    }
    autoScrollRAF = requestAnimationFrame(tick);
  };
  autoScrollRAF = requestAnimationFrame(tick);
}
function reinsertAt(card, x, y) {
  card.style.visibility = 'hidden';
  const el = document.elementFromPoint(x, y);
  card.style.visibility = '';
  if (!el) return;
  const grid = el.closest('.cards-grid');
  if (!grid) return;
  insertCardInGrid(grid, card, y);
  updateDropIndicator(grid, y);
}
function updateAutoScrollFromPointer(card, x, y) {
  autoScrollDragCtx = { card, x, y };
  const ct = getScrollContainer();
  if (!ct) { setAutoScroll(0); return; }
  const r = ct.getBoundingClientRect();
  // 触发区:可视区高度 40%(避开 iOS 底部 home 手势区),最小 80,最大 140
  const zone = Math.min(140, Math.max(80, Math.floor((r.bottom - r.top) * 0.4)));
  const minSpeed = 10;  // 进入触发区即可见的移动速度 (~600 px/s)
  const maxSpeed = 28;
  const maxScroll = ct.scrollHeight - ct.clientHeight;
  if (y < r.top + zone && ct.scrollTop > 0) {
    const dist = Math.max(0, y - r.top);
    const speed = minSpeed + (maxSpeed - minSpeed) * (1 - dist / zone);
    setAutoScroll(-Math.round(speed));
  } else if (y > r.bottom - zone && ct.scrollTop < maxScroll) {
    const dist = Math.max(0, r.bottom - y);
    const speed = minSpeed + (maxSpeed - minSpeed) * (1 - dist / zone);
    setAutoScroll(Math.round(speed));
  } else {
    setAutoScroll(0);
  }
}
function stopAutoScroll() {
  setAutoScroll(0);
  autoScrollDragCtx = null;
}

function attachCardInteraction(card) {
  let holdTimer = null;
  let holdReady = false;
  let dragMode = false;
  let movedPastThreshold = false; // 手指/鼠标移过阈值,触发了滚动→ touchend 不应弹窗
  let startX = 0, startY = 0;
  let activePointerId = null;

  function startDrag() {
    holdReady = true;
    card.classList.add('dragging');
    setActiveCard(null);
    // 记一下起拖时所在线 id,finalize 时跟落点比对 —— 跨线就重新解析速度
    card._dragOriginLineId = getLineIdFromNode(card);
    if (navigator.vibrate) try { navigator.vibrate(25); } catch (e) {}
  }
  function doDragMove(x, y) {
    dragMode = true;
    reinsertAt(card, x, y);
    updateAutoScrollFromPointer(card, x, y);
  }
  function finalize(wasTap) {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    stopAutoScroll();
    if (dragMode) {
      card.classList.remove('dragging');
      hideDropIndicator();
      // 跨线拖动:按新落点的线重新解析品名速度 / 流水线速度 → 写回 dataset/输入框
      if (card.dataset.type === 'job') {
        const newLineId = getLineIdFromNode(card);
        const originLineId = card._dragOriginLineId;
        if (newLineId && newLineId !== originLineId) {
          const _li = findLibItem(card.dataset.libId);
          if (_li) {
            const resSpd = resolveItemSpeed(_li, newLineId);
            card.dataset.speed = resSpd > 0 ? String(resSpd) : '';
            const lineSpdInp = popupQ(card, '.line-speed');
            if (lineSpdInp) {
              const resLs = resolveItemLineSpeed(_li, newLineId);
              lineSpdInp.value = resLs > 0 ? resLs : '';
            }
          }
        }
      }
      delete card._dragOriginLineId;
      document.querySelectorAll('.line').forEach(l => recalc(l));
      scheduleSaveBoard();
    } else if (holdReady) {
      // Held but didn't move — treat as tap
      card.classList.remove('dragging');
      setActiveCard(card);
    } else if (wasTap && !movedPastThreshold) {
      setActiveCard(card);
    }
    holdReady = false; dragMode = false; movedPastThreshold = false; activePointerId = null;
  }

  // --- Touch (mobile): hold-then-drag, with passive control of preventDefault
  card.addEventListener('touchstart', (e) => {
    // 多指(缩放等)直接放弃拖拽,把已有计时器清掉
    if (e.touches.length !== 1) {
      if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
      if (holdReady || dragMode) { card.classList.remove('dragging'); hideDropIndicator(); stopAutoScroll(); }
      holdReady = false; dragMode = false; movedPastThreshold = true; // 缩放后 touchend 也不要弹窗
      return;
    }
    if (e.target.closest('input, button, .card-expanded')) return;
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY;
    holdReady = false; dragMode = false; movedPastThreshold = false;
    holdTimer = setTimeout(startDrag, HOLD_MS);
  }, { passive: true });

  card.addEventListener('touchmove', (e) => {
    if (!holdTimer && !holdReady) return;
    const t = e.touches[0];
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if (!holdReady) {
      if (Math.hypot(dx, dy) > MOVE_THRESHOLD) {
        clearTimeout(holdTimer); holdTimer = null;
        movedPastThreshold = true; // 用户是在滚动,touchend 不要当成 tap
      }
      return;
    }
    e.preventDefault();
    doDragMove(t.clientX, t.clientY);
  }, { passive: false });

  card.addEventListener('touchend', () => finalize(!holdReady));
  card.addEventListener('touchcancel', () => {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    stopAutoScroll();
    if (dragMode || holdReady) { card.classList.remove('dragging'); hideDropIndicator(); }
    holdReady = false; dragMode = false; movedPastThreshold = true;
  });

  // --- Mouse (desktop): move threshold OR hold time triggers drag
  card.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    if (e.target.closest('input, button, .card-expanded')) return;
    startX = e.clientX; startY = e.clientY;
    holdReady = false; dragMode = false;
    holdTimer = setTimeout(startDrag, HOLD_MS);

    const onMove = (me) => {
      const dx = me.clientX - startX, dy = me.clientY - startY;
      if (!holdReady && Math.hypot(dx, dy) > MOVE_THRESHOLD) {
        clearTimeout(holdTimer); holdTimer = null;
        startDrag();
      }
      if (holdReady) doDragMove(me.clientX, me.clientY);
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      finalize(!holdReady);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    e.preventDefault();
  });
}

// 点击卡片之外（且不在弹窗内）关闭弹窗
document.addEventListener('mousedown', (e) => {

function fitCardCompact(card, height) {
  // 短卡片时减小上下 padding，给圆圈更多空间
  card.style.paddingTop = height < 32 ? '1px' : '';
  card.style.paddingBottom = height < 32 ? '1px' : '';
  const letterEl = card.querySelector('.compact-name-letter');
  if (letterEl) {
    // 圆圈外径 = min(22, 卡片高度 - 2)，下限 10px 保证可读
    const size = Math.max(10, Math.min(22, height - 2));
    letterEl.style.width = size + 'px';
    letterEl.style.height = size + 'px';
    letterEl.style.fontSize = Math.max(7, Math.round(size * 0.62)) + 'px';
    letterEl.style.borderWidth = size < 14 ? '1px' : '1.5px';
  }
  const restTag = card.querySelector('.rest-tag');
  if (restTag) {
    const fs = Math.max(8, Math.min(11, height - 14));
    restTag.style.fontSize = fs + 'px';
    restTag.style.padding = height < 24 ? '1px 4px' : '';
  }
}

function recalc(line) {
  const grid = line.querySelector('.cards-grid');
  const startSec = parseClock(line.querySelector('.start-time').value);
  const gapMin = parseFloat(line.querySelector('.gap').value) || 0;
  const gapSec = gapMin * 60;
  const baseSec = TIME_START_HOUR * 3600;
  let totalQty = 0, totalSec = 0, cursor = startSec, lastEnd = null;
  let prevVisualBottom = -Infinity;
  const cards = grid.querySelectorAll('.card');
  cards.forEach((card, i) => {
    const type = card.dataset.type;
    const tStart = popupQ(card, '.t-start');
    const tEnd = popupQ(card, '.t-end');
    let cardStart = null, cardEnd = null, duration = 0;
    if (type === 'job') {
      const libItem = findLibItem(card.dataset.libId);
      // 优先用卡片快照里的速度,缺省再回落到品名库当前值。
      const _cardSpeed = parseFloat(card.dataset.speed);
      const speed = (_cardSpeed > 0) ? _cardSpeed : ((libItem && libItem.speed > 0) ? libItem.speed : 0);
      const qty = parseFloat(popupQ(card, '.qty').value) || 0;
      const peopleRaw = popupQ(card, '.people').value;
      const peopleIsQ = (peopleRaw === '?' || peopleRaw === '？');
      const people = peopleIsQ ? 0 : (parseFloat(peopleRaw) || 0);
      const meterPeopleInp = popupQ(card, '.meter-people');
      let meterPeople = Math.max(1, parseInt(meterPeopleInp && meterPeopleInp.value) || 1);
      // 单卡修改计量人数不再回写品名库,避免影响其它卡片(尤其是之前日期的快照)。
      if (speed > 0 && qty > 0 && meterPeople > 0) duration = (qty / (speed * meterPeople)) * 60;
      popupQ(card, '.duration').textContent = '耗时 ' + fmtDuration(duration);
      if (cursor != null && duration > 0) { cardStart = cursor; cardEnd = cursor + duration; cursor = cardEnd + gapSec; lastEnd = cardEnd; }
      totalQty += qty; totalSec += duration;
      const letterEl = card.querySelector('.compact-name-letter');
      if (letterEl) {
        letterEl.textContent = (card.dataset.name || '').charAt(0);
        letterEl.style.color = card.dataset.color || '';
      }
      const peopleEl = card.querySelector('.compact-people');
      if (peopleEl) peopleEl.textContent = peopleIsQ ? '?' : (people > 0 ? String(people) : '—');
      const timeEl = card.querySelector('.compact-time');
      if (timeEl) timeEl.textContent = duration > 0 ? fmtDuration(duration) : '—';
    } else if (type === 'rest') {
      const restMin = parseFloat(popupQ(card, '.rest-min').value) || 0;
      duration = restMin * 60;
      const fixedSec = parseClock(popupQ(card, '.rest-fixed').value);
      let realStart;
      if (fixedSec != null) { realStart = (cursor != null && cursor > fixedSec) ? cursor : fixedSec; } else { realStart = cursor; }
      if (realStart != null && duration > 0) { cardStart = realStart; cardEnd = realStart + duration; cursor = cardEnd; lastEnd = cardEnd; }
      card.querySelector('.compact-time').textContent = duration > 0 ? fmtDuration(duration) : '';
    }
    if (cardStart != null && cardEnd != null) {
      tStart.textContent = fmtClock(cardStart); tEnd.textContent = fmtClock(cardEnd);
      // 打印模式:卡片严格按真实时长落到 secToPx 位置,跟时间轴 1:1 对齐。
      // MIN_CARD_PX = 0:不再人为撑高,否则卡片很多 / 很短时会累加溢出到第二页;
      // MIN_GAP_PX  = 0:卡片相邻直接接续,不再硬留 1px 间隙累加成漂移。
      const isPrint = document.body.classList.contains('printing-compact');
      const MIN_CARD_PX = isPrint ? 0 : 24;
      const MIN_GAP_PX = isPrint ? 0 : 1;
      let top = secToPx(cardStart);
      const height = Math.max(secToPx(cardEnd) - secToPx(cardStart), MIN_CARD_PX);
      if (top < prevVisualBottom + MIN_GAP_PX) top = prevVisualBottom + MIN_GAP_PX;
      card.style.top = top + 'px'; card.style.height = height + 'px';
      fitCardCompact(card, height);
      prevVisualBottom = top + height;
      card.classList.toggle('error', cardStart < baseSec || cardEnd > TIME_END_HOUR * 3600);
    } else {
      // 草稿卡片（无耗时）：定位在上一卡片视觉底部之下，无上一卡片则按起始时间放置
      let top;
      if (prevVisualBottom > -Infinity) top = prevVisualBottom + 2;
      else if (startSec != null) top = secToPx(startSec);
      else top = i * 28;
      card.style.top = top + 'px'; card.style.height = '26px';
      fitCardCompact(card, 26);
      prevVisualBottom = top + 26;
      tStart.textContent = '—'; tEnd.textContent = '—';
      if (type === 'job') popupQ(card, '.duration').textContent = '耗时 —';
      card.classList.remove('error');
    }
    syncPopupState(card);
  });
  setFootVal(line.querySelector('.qty-total'), totalQty.toLocaleString());
  setFootVal(line.querySelector('.time-total'), fmtDurationHM(totalSec));
  setFootVal(line.querySelector('.finish-total'), (lastEnd != null) ? fmtClock(lastEnd) : '—');
  mirrorActualFinishSize(line);
  recalcGlobal();
}

function mirrorActualFinishSize(line) {
  const ft = line.querySelector('.finish-total');
  const af = line.querySelector('.actual-finish');
  if (!ft || !af) return;
  // setFootVal 在下一帧才设最终字号,这里也等一帧再读
  requestAnimationFrame(() => {
    af.style.fontSize = getComputedStyle(ft).fontSize;
  });
}

function setFootVal(el, text) {
  if (!el) return;
  el.textContent = text;
  el.style.fontSize = '';
  requestAnimationFrame(() => {
    let fs = parseFloat(getComputedStyle(el).fontSize) || 13;
    let guard = 40;
    while (el.scrollWidth > el.clientWidth + 1 && fs > 4 && guard-- > 0) {
      fs -= 0.5;
      el.style.fontSize = fs + 'px';
    }
  });
}

window.addEventListener('resize', () => {
  document.querySelectorAll('.line').forEach(line => {
    ['.qty-total','.time-total','.finish-total'].forEach(sel => {
      const el = line.querySelector(sel);
      if (el) setFootVal(el, el.textContent);
    });
    mirrorActualFinishSize(line);
  });
});

function recalcGlobal() {
  let q = 0, s = 0, cnt = 0, latestFinish = null;
  document.querySelectorAll('.line').forEach(line => {
    line.querySelectorAll('.card[data-type="job"]').forEach(card => {
      const libItem = findLibItem(card.dataset.libId);
      const _cardSpeed = parseFloat(card.dataset.speed);
      const speed = (_cardSpeed > 0) ? _cardSpeed : ((libItem && libItem.speed > 0) ? libItem.speed : 0);
      const qty = parseFloat(popupQ(card, '.qty').value) || 0;
      const mp = Math.max(1, parseInt(popupQ(card, '.meter-people') && popupQ(card, '.meter-people').value) || (libItem && libItem.meterPeople) || 1);
      cnt++; q += qty;
      if (speed > 0 && qty > 0) s += (qty / (speed * mp)) * 60;
    });
    const ft = line.querySelector('.finish-total');
    if (ft && ft.textContent && ft.textContent !== '—') {
      const sec = parseClock(ft.textContent);
      if (sec != null && (latestFinish == null || sec > latestFinish)) latestFinish = sec;
    }
  });
  document.getElementById('totalAll').textContent = `总计 ${q.toLocaleString()} 个`;
  const dur = document.getElementById('totalDur');
  const fin = document.getElementById('totalFinish');
  if (dur) dur.textContent = `耗时 ${fmtDuration(s)}`;
  if (fin) fin.textContent = `结束 ${latestFinish != null ? fmtClock(latestFinish) : '—'}`;
}

// 编辑只标记未保存；只有 doSaveOverwrite 才真正写 localStorage
let unsaved = false;
function markUnsaved() {
  if (unsaved) return;
  unsaved = true;
  document.body.classList.add('has-unsaved');
}
function clearUnsaved() {
  unsaved = false;
  document.body.classList.remove('has-unsaved');
}
function scheduleSaveBoard() { markUnsaved(); pushHistory(); }

// ============ 撤回/重做 ============
const undoStack = [];
const redoStack = [];
const HISTORY_MAX = 100;
let lastSnapshot = null;
let suppressHistory = false;
function snapshotStr() { try { return JSON.stringify(captureState()); } catch (e) { return null; } }
function pushHistory() {
  if (suppressHistory) return;
  const cur = snapshotStr();
  if (cur == null) return;
  if (lastSnapshot != null && lastSnapshot !== cur) {
    undoStack.push(lastSnapshot);
    if (undoStack.length > HISTORY_MAX) undoStack.shift();
    redoStack.length = 0;
  }
  lastSnapshot = cur;
  updateUndoButtons();
}
function updateUndoButtons() {
  const u = document.getElementById('undoBtn');
  const r = document.getElementById('redoBtn');
  if (u) u.disabled = undoStack.length === 0;
  if (r) r.disabled = redoStack.length === 0;
}
function doUndo() {
  if (!undoStack.length) return;
  const cur = snapshotStr();
  const prev = undoStack.pop();
  if (cur != null) redoStack.push(cur);
  suppressHistory = true;
  try { applyState(JSON.parse(prev)); } finally { suppressHistory = false; }
  lastSnapshot = prev;
  markUnsaved();
  updateUndoButtons();
}
function doRedo() {
  if (!redoStack.length) return;
  const cur = snapshotStr();
  const next = redoStack.pop();
  if (cur != null) undoStack.push(cur);
  suppressHistory = true;
  try { applyState(JSON.parse(next)); } finally { suppressHistory = false; }
  lastSnapshot = next;
  markUnsaved();
  updateUndoButtons();
}

function collectAllBoards() {
  const boards = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith(STORAGE_BOARD_PREFIX)) {
      const date = key.slice(STORAGE_BOARD_PREFIX.length);
      try { boards[date] = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
    }
  }
  return boards;
}

function saveJSON() {
  exportMenu && exportMenu.classList.remove('show');
  setActiveCard(null);
  saveBoard();
  const d = new Date();
  const ds = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  const defaultName = `生产计划板${ds}.json`;
  // 用 popover 替代原生 prompt
  const anchor = document.getElementById('exportBtn') || document.body;
  showConfirmPopover(anchor, {
    text: '导出 JSON',
    sub: '保存为本地文件',
    input: { type: 'text', value: defaultName, placeholder: '文件名' },
    confirmText: '保存',
    onConfirm: (v) => {
      const name = (v || '').trim();
      if (!name) return;
      const filename = /\.json$/i.test(name) ? name : name + '.json';
      let library = [];
      try { library = JSON.parse(localStorage.getItem(STORAGE_LIB) || '[]'); } catch (e) {}
      const boards = collectAllBoards();
      const payload = { version: 2, type: 'production-board', library, boards, board: boards[currentDate] || {} };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.download = filename;
      a.href = URL.createObjectURL(blob);
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      const dayCount = Object.keys(boards).length;
      showToast(`已保存 ${filename}(${dayCount} 天数据)`, 'success');
    }
  });
}

function importJSON() {
  exportMenu && exportMenu.classList.remove('show');
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let data;
      try {
        data = JSON.parse(r.result);
        if (data.type !== 'production-board') throw new Error('文件类型不匹配');
        if (!Array.isArray(data.library)) throw new Error('品名库数据结构错误');
        const hasBoards = data.boards && typeof data.boards === 'object' && Object.keys(data.boards).length > 0;
        const hasBoard = data.board && typeof data.board === 'object';
        if (!hasBoards && !hasBoard) throw new Error('计划板数据结构错误');
        const dayCount = hasBoards ? Object.keys(data.boards).length : 1;
        const anchor = document.getElementById('exportBtn') || document.body;
        showConfirmPopover(anchor, {
          text: `导入 ${dayCount} 天数据?`,
          sub: '将覆盖当前所有数据,建议先备份',
          confirmText: '继续导入',
          danger: true,
          onConfirm: () => {
            localStorage.setItem(STORAGE_LIB, JSON.stringify(data.library));
            const keysToRemove = [];
            for (let i = 0; i < localStorage.length; i++) {
              const k = localStorage.key(i);
              if (k && k.startsWith(STORAGE_BOARD_PREFIX)) keysToRemove.push(k);
            }
            keysToRemove.forEach(k => localStorage.removeItem(k));
            if (data.boards && Object.keys(data.boards).length > 0) {
              for (const date in data.boards) {
                localStorage.setItem(STORAGE_BOARD_PREFIX + date, JSON.stringify(data.boards[date]));
              }
            } else {
              localStorage.setItem(boardKey(), JSON.stringify(data.board));
            }
            window.skipAutoSave = true;
            location.reload();
          }
        });
      } catch (e) {
        showToast('导入失败: ' + e.message, 'error');
      }
    };
    r.readAsText(f);
  };
  inp.click();
}

function doSaveOverwrite() {
  exportMenu && exportMenu.classList.remove('show');
  setActiveCard(null);
  saveBoard();
  clearUnsaved();
  const ts = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  showToast(`💾 已保存（${ts}）`);
}
function captureState() {
  const state = { lines: [], hiddenLines: [...hiddenLines] };
  document.querySelectorAll('.line').forEach(line => {
    const lineData = { startTime: line.querySelector('.start-time').value, gap: line.querySelector('.gap').value, actualFinish: line.querySelector('.actual-finish').value, cards: [] };
    line.querySelectorAll('.card').forEach(card => {
      const type = card.dataset.type;
      if (type === 'job') {
        const _li = findLibItem(card.dataset.libId);
        // 极旧卡片无 dataset.speed 时,按当前所在线解析回退,而不是直接用 item.speed 默认值
        const _lid = getLineIdFromNode(card);
        const _fallbackSpd = _li ? resolveItemSpeed(_li, _lid) : 0;
        lineData.cards.push({ type: 'job', libId: card.dataset.libId, name: card.dataset.name, color: card.dataset.color, speed: card.dataset.speed || (_fallbackSpd > 0 ? String(_fallbackSpd) : ''), lineSpeed: popupQ(card, '.line-speed').value, qty: popupQ(card, '.qty').value, people: popupQ(card, '.people').value, meterPeople: popupQ(card, '.meter-people') ? popupQ(card, '.meter-people').value : (_li ? _li.meterPeople : 1) });
      } else if (type === 'rest') {
        lineData.cards.push({ type: 'rest', name: popupQ(card, '.rest-name-input').value, min: popupQ(card, '.rest-min').value, fixed: popupQ(card, '.rest-fixed').value });
      }
    });
    state.lines.push(lineData);
  });
  return state;
}
function saveBoard() {
  try { localStorage.setItem(boardKey(), JSON.stringify(captureState())); } catch (e) {}
}

function applyState(state) {
  if (!state || !state.lines) return;
  if (Array.isArray(state.hiddenLines)) {
    hiddenLines = new Set(state.hiddenLines.map(Number));
    updateBoardLayout();
  }
  document.querySelectorAll('.cards-grid').forEach(g => g.querySelectorAll('.card').forEach(c => c.remove()));
  activeCard = null;
  const lineEls = document.querySelectorAll('.line');
  state.lines.forEach((lineData, idx) => {
    const lineEl = lineEls[idx];
    if (!lineEl) return;
    if (lineData.startTime) lineEl.querySelector('.start-time').value = lineData.startTime;
    if (lineData.gap != null) lineEl.querySelector('.gap').value = lineData.gap;
    lineEl.querySelector('.actual-finish').value = lineData.actualFinish || '';
    const grid = lineEl.querySelector('.cards-grid');
    (lineData.cards || []).forEach(c => {
      if (c.type === 'job') {
        const libItem = findLibItem(c.libId) || { id: c.libId, name: c.name || '未知品名', color: c.color || '#8b949e', speed: parseFloat(c.speed) || 0, lineSpeed: parseFloat(c.lineSpeed) || 0, people: parsePeople(c.people), meterPeople: 1 };
        addJobCard(grid, libItem, c);
      } else if (c.type === 'rest') {
        addRestCard(grid, c);
      }
    });
    recalc(lineEl);
  });
}
function loadBoard() {
  let state;
  try { const raw = localStorage.getItem(boardKey()); if (!raw) return; state = JSON.parse(raw); } catch (e) { return; }
  applyState(state);
}

function updateBoardLayout() {
  const visibleCount = LINE_COUNT - hiddenLines.size;
  document.querySelectorAll('.line').forEach(line => {
    line.style.display = hiddenLines.has(+line.dataset.line) ? 'none' : '';
  });
  if (visibleCount > 0) {
    const isMobile = window.innerWidth <= 900;

function prevDayISO(iso) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() - 1);
  const z = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
}

// 执行从指定日期复制到当前日期
function doCopyFromDate(srcDate) {
  if (!srcDate) return;
  if (srcDate === currentDate) { showToast('源日期不能是当前日期', 'error'); return; }
  const raw = localStorage.getItem(STORAGE_BOARD_PREFIX + srcDate);
  if (!raw) { showToast(`${srcDate} 暂无数据`, 'error'); return; }
  const anchor = document.getElementById('copyDayBtn') || document.body;
  showConfirmPopover(anchor, {
    text: `复制 ${srcDate}?`,
    sub: `将覆盖当前 ${currentDate} 的数据`,
    confirmText: '复制',
    danger: true,
    onConfirm: () => {
      let state;
      try { state = JSON.parse(raw); } catch (e) { showToast('复制失败: 数据解析错误', 'error'); return; }
      setActiveCard(null);
      document.querySelectorAll('.line').forEach(line => {
        line.querySelectorAll('.card').forEach(c => c.remove());
        const st = line.querySelector('.start-time'); if (st) st.value = '08:00';
        const gp = line.querySelector('.gap'); if (gp) gp.value = '0';
      });
      hiddenLines = new Set();
      applyState(state);
      document.querySelectorAll('.line').forEach(l => recalc(l));
      updateBoardLayout();
      saveBoard();
      undoStack.length = 0; redoStack.length = 0;
      lastSnapshot = snapshotStr();
      updateUndoButtons();
      markUnsaved();
      document.getElementById('copyDayModal').classList.remove('show');
      showToast(`已复制 ${srcDate} 的数据到 ${currentDate}`, 'success');
    }
  });
}

function trimGridForExport(minVisH) {
  let minTop = Infinity, maxBottom = 0;
  // 只统计「真正排上时间的卡片」(t-start / t-end 不是占位符)。
  // 草稿卡片(没填数量/速度等)走 recalc 的 else 分支也会拿到一个回退 style.top,
  // 如果算进 maxBottom 会把可见底部兜到 timeline 末尾,导致 19:30 之后的 20-22 永远裁不掉。
  const isPlaceholder = s => !s || s === '' || s === '--:--' || s === '—' || s === '-' || /^[\-—]+$/.test(s.trim());
  document.querySelectorAll('.card').forEach(c => {
    const tStartEl = popupQ(c, '.t-start');
    const tEndEl   = popupQ(c, '.t-end');
    const tStart = tStartEl ? tStartEl.textContent.trim() : '';
    const tEnd   = tEndEl ? tEndEl.textContent.trim() : '';
    if (isPlaceholder(tStart) || isPlaceholder(tEnd)) return; // 跳过草稿
    const top = parseFloat(c.style.top) || 0;
    const h = parseFloat(c.style.height) || 0;
    if (top < minTop) minTop = top;
    if (top + h > maxBottom) maxBottom = top + h;
  });
  if (maxBottom <= 0 || minTop === Infinity) return () => {};
  const shift = Math.max(0, minTop - 4);
  // visH 至少撑到 minVisH(= 一页的卡片预算高度),否则卡片少的时候页面会比 Chrome 打印预览的
  // 纸面短一截,纸面下方留出深色背景(用户误以为页面里有黑条)。撑到预算高度后,
  // 多余空间填白,实际打印纸张是空白,不影响内容布局。
  let visH = maxBottom - shift + 8;
  if (typeof minVisH === 'number' && minVisH > visH) visH = minVisH;
  const restoreFns = [];
  // 用 setProperty 加 important 优先级 —— 手机端 @media (max-width: 900px) 里有
  // `.cards-wrap { height: auto }` 等规则,普通 inline 干不过它就会让卡片区缩水,
  // 手机打印出现纸面下半部分大片空白。
  const setStyles = (el, styles) => {
    const prev = {};
    for (const k in styles) {
      prev[k] = el.style.getPropertyValue(k);
      const v = styles[k];
      if (v === '') el.style.removeProperty(k);
      else el.style.setProperty(k, v, 'important');
    }
    restoreFns.push(() => {
      for (const k in prev) {
        if (prev[k]) el.style.setProperty(k, prev[k]);
        else el.style.removeProperty(k);
      }
    });
  };
  document.querySelectorAll('.cards-grid').forEach(grid => {
    setStyles(grid, { transform: shift > 0 ? `translateY(-${shift}px)` : '', height: (visH + shift) + 'px' });
    const wrap = grid.parentElement;
    if (wrap && wrap.classList.contains('cards-wrap')) {
      setStyles(wrap, { height: visH + 'px', overflow: 'hidden', flex: 'none' });
    }
  });
  const ti = document.getElementById('timelineInner');
  if (ti) setStyles(ti, { transform: shift > 0 ? `translateY(-${shift}px)` : '', height: (visH + shift) + 'px' });
  const tb = document.getElementById('timelineBody');
  if (tb) setStyles(tb, { height: visH + 'px', overflow: 'hidden', flex: 'none' });
  return () => restoreFns.forEach(fn => fn());
}

// 打印前把每条线的「实结」<input type="time"> 替换成 <span>,值用 input 的 value。
// 这样实结跟「结束」的纯 span 用完全相同的渲染路径,不再受 input/datetime shadow DOM
// 的字号、baseline、padding 怪癖影响。打印结束在 cleanup 里换回 input。
function replaceActualFinishWithSpan() {
  const undo = [];
  document.querySelectorAll('.actual-finish-wrap').forEach(wrap => {
    const input = wrap.querySelector('.actual-finish');
    if (!input) return;
    const val = (input.value || '').trim() || '—';
    const span = document.createElement('span');
    span.className = 'foot-val actual-finish actual-finish-print';
    span.textContent = val;
    wrap.replaceChild(span, input);
    undo.push(() => {
      if (span.parentElement === wrap) wrap.replaceChild(input, span);
    });
  });
  return () => undo.forEach(fn => fn());
}

function setupPrintLayout() {
  setActiveCard(null);
  const root = document.documentElement;
  const origHourPxStr = getComputedStyle(root).getPropertyValue('--hour-px').trim();
  const origHourPx = parseFloat(origHourPxStr) || 140;

  // 手机横屏 body 上有 mob-ls 类,它把 line-foot/timeline-foot 隐藏、line-head 拉到
  // 92px,等等 —— 这些规则即使在打印态下也会通过 specificity 漏过去几条,导致手机
  // 横屏打印跟 PC 不一致。打印期间直接把这个类移除,cleanup 时再加回来,确保打印
  // 走的是同一套 body.printing.printing-compact PC 规则。
  const wasMobLs = document.body.classList.contains('mob-ls');
  if (wasMobLs) document.body.classList.remove('mob-ls');

  // 关键:无论手机还是 PC,打印基线统一拉到 140 px/hour。
  // 手机原始是 100,PC 是 140;如果不统一,后面 cardRange / 压缩比例两边算不一样,
  // 打印出来就会不一样。
  const PRINT_BASELINE_HOUR_PX = 140;
  root.style.setProperty('--hour-px', PRINT_BASELINE_HOUR_PX + 'px');

  // 切到打印模式再测卡片范围。MIN_CARD_PX=0 / MIN_GAP_PX=0 已生效,
  // 卡片严格落在真实 secToPx 位置,cardRange 干净,不被 24px MIN 撑大。
  document.body.classList.add('printing-compact');
  renderTimeline();
  document.querySelectorAll('.cards-grid').forEach(g => {
    g.style.height = (getTotalPx() + 16) + 'px';
    renderGridLines(g);
  });
  document.querySelectorAll('.line').forEach(l => recalc(l));

  let minTop = Infinity, maxBottom = 0;
  document.querySelectorAll('.card').forEach(c => {
    const t = parseFloat(c.style.top) || 0;
    const h = parseFloat(c.style.height) || 0;
    if (t < minTop) minTop = t;
    if (t + h > maxBottom) maxBottom = t + h;
  });
  const cardRange = (maxBottom > 0 && minTop !== Infinity) ? (maxBottom - minTop) : 0;

  // A4 横向 6mm 边距 ≈ 748px 可用高:
  // A4 横向 6mm 边距 ≈ 748px 可用高:
  //   topbar 25 + main border 3 + line-head 65.5 + line-foot 69.5 = 163
  //   trimGridForExport 在 cards 预算上额外加 ~12px padding
  //   → 实际卡片区 = PAGE_H_FOR_CARDS + 12, 总计 = PAGE_H_FOR_CARDS + 175
  //   565 + 175 = 740, 留 8px buffer。
  const PAGE_H_FOR_CARDS = 565;
  let newHourPx = PRINT_BASELINE_HOUR_PX;
  if (cardRange > 0) {
    // 不管太密(>预算)还是太稀(<预算),都按比例缩放让 cardRange 精确等于 PAGE_H_FOR_CARDS,
    // 这样卡片永远填满整页,既不超出也不会在下方留出大片空白。
    // 上限 280 px/hour(=2x 基线),数据极少时不至于拉得太夸张;下限 1 px/hour 应对极端密集。
    newHourPx = Math.max(1, Math.min(280, PRINT_BASELINE_HOUR_PX * (PAGE_H_FOR_CARDS / cardRange)));
  }
  // 只要跟基线差超过 0.5px/hour 就需要重排
  const needRescale = Math.abs(newHourPx - PRINT_BASELINE_HOUR_PX) > 0.5;
  if (needRescale) {
    root.style.setProperty('--hour-px', newHourPx + 'px');
    renderTimeline();
    document.querySelectorAll('.cards-grid').forEach(g => {
      g.style.height = (getTotalPx() + 16) + 'px';
      renderGridLines(g);
    });
    document.querySelectorAll('.line').forEach(l => recalc(l));
  }
  // 把页面卡片预算传给 trim,让 visH 不低于 PAGE_H_FOR_CARDS —— 卡片少的时候页面仍铺满
  // 一张 A4 横向纸面预算,Chrome 打印预览不会再露出纸张下方的深色背景。
  const restore = trimGridForExport(PAGE_H_FOR_CARDS);
  const restoreInputs = replaceActualFinishWithSpan();

  return () => {
    restoreInputs();
    restore();
    document.body.classList.remove('printing-compact');
    if (wasMobLs) document.body.classList.add('mob-ls');
    // 一开始就把 --hour-px 拉到了 140 基线,无论有没有二次 rescale 都得还原
    root.style.setProperty('--hour-px', origHourPxStr);
    renderTimeline();
    document.querySelectorAll('.cards-grid').forEach(g => {
      g.style.height = (getTotalPx() + 16) + 'px';
      renderGridLines(g);
    });
    document.querySelectorAll('.line').forEach(l => recalc(l));
  };
}

let _printCleanup = null;
let _printCleanedUp = false;
function _doPrintCleanup() {
  if (_printCleanedUp) return;
  _printCleanedUp = true;
  document.body.classList.remove('printing');
  if (_printCleanup) { _printCleanup(); _printCleanup = null; }
}
// 每次 beforeprint 都重新跑 setupPrintLayout。iOS 打印对话框里切换方向 / 纸张大小
// 会触发多次 beforeprint。如果直接跳过(因为 body.printing 已经在),用户看到的
// 就是上次的旧布局 —— 但 iOS 在不同方向下需要的压缩比不一样,必须重算。
// 重算前先把上次的 cleanup 跑一遍把 inline 还原,再重新计算。
window.addEventListener('beforeprint', () => {
  if (_printCleanup) {
    try { _printCleanup(); } catch(e) {}
    _printCleanup = null;
  }
  document.body.classList.remove('printing');
  _printCleanedUp = false;
  _printCleanup = setupPrintLayout();
  document.body.classList.add('printing');
});
window.addEventListener('afterprint', () => {
  _doPrintCleanup();
});

function doPrint() {
  exportMenu.classList.remove('show');
  setTimeout(() => {
    _printCleanedUp = false;
    _printCleanup = setupPrintLayout();
    document.body.classList.add('printing');
    setTimeout(() => {
      // === cleanup 触发器 ===
      // ⚠️ 不能用定时兜底 —— 手机打印对话框停留时间不可预测,定时太短会在用户
      // 确认前就还原布局,实际打印到的就是「下方空白」的原样;定时太长又会卡屏幕。
      // 只依赖事件:afterprint(关闭对话框)+ matchMedia('print') 退出 + 焦点回来。
      window.addEventListener('afterprint', _doPrintCleanup, { once: true });
      const mq = window.matchMedia('print');
      const mqHandler = (e) => {
        if (!e.matches) { _doPrintCleanup(); mq.removeEventListener('change', mqHandler); }
      };
      mq.addEventListener('change', mqHandler);
      // visibilitychange:iOS Safari 关掉打印对话框后页面会从 hidden 切回 visible。
      const onVis = () => {
        if (document.visibilityState === 'visible') {
          _doPrintCleanup();
          document.removeEventListener('visibilitychange', onVis);
        }
      };
      document.addEventListener('visibilitychange', onVis);
      window.print();
    }, 80);
  }, 40);
}

async function doExportPdf() {
  exportMenu.classList.remove('show');
  if (typeof html2canvas === 'undefined' || !window.jspdf) {
    showToast('PDF 导出需要网络连接(html2canvas / jsPDF)', 'error');
    return;
  }
  const orig = exportBtn.textContent;
  exportBtn.textContent = '生成PDF…';
  exportBtn.disabled = true;
  let cleanup = null;
  // A4 横向 96dpi ≈ 1123 × 794
  const PAGE_W = 1123, PAGE_H = 794;
  const stage = document.createElement('div');
  stage.style.cssText = `position:fixed;left:0;top:0;width:${PAGE_W}px;height:${PAGE_H}px;background:#fff;z-index:-1;overflow:hidden;pointer-events:none`;
  document.body.appendChild(stage);
  const savedWidth = document.documentElement.style.width;
  try {
    cleanup = setupPrintLayout();
    document.body.classList.add('printing');
    document.documentElement.style.width = PAGE_W + 'px';
    await new Promise(r => setTimeout(r, 120));
    const canvas = await html2canvas(document.body, {
      backgroundColor: '#fff', scale: 2, useCORS: true, logging: false,
      width: PAGE_W, height: PAGE_H, windowWidth: PAGE_W, windowHeight: PAGE_H,
    });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    const pdfW = pdf.internal.pageSize.getWidth();
    const pdfH = pdf.internal.pageSize.getHeight();
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, pdfW, pdfH);
    const date = new Date().toLocaleDateString('zh-CN').replace(/\//g, '-');
    pdf.save(`生产计划板_${date}.pdf`);
  } catch (err) {
    showToast('PDF 导出失败: ' + err.message, 'error');
  } finally {
    document.body.classList.remove('printing');
    if (cleanup) cleanup();
    document.documentElement.style.width = savedWidth;
    stage.remove();
    exportBtn.textContent = orig;
    exportBtn.disabled = false;
  }
}

async function doExportPng() {
  exportMenu.classList.remove('show');
  if (typeof html2canvas === 'undefined') {
    showToast('截图功能需要网络连接(html2canvas)', 'error');
    return;
  }
  const orig = exportBtn.textContent;
  exportBtn.textContent = '截图中…';
  exportBtn.disabled = true;

  // 关闭活动卡片，避免 fixed 抽屉混入截图
  setActiveCard(null);

  // 临时展开所有可滚动容器，让 html2canvas 抓到完整内容
  const restoreFns = [];
  const override = (el, styles) => {
    if (!el) return;
    const prev = {};
    for (const k in styles) { prev[k] = el.style[k]; el.style[k] = styles[k]; }
    restoreFns.push(() => { for (const k in prev) el.style[k] = prev[k]; });
  };
  override(document.documentElement, { overflow: 'visible', height: 'auto' });
  override(document.body, { overflow: 'visible', height: 'auto' });
  override(document.querySelector('.main'), { height: 'auto', overflow: 'visible' });
  override(document.querySelector('.timeline'), { overflow: 'visible', height: 'auto' });
  override(document.querySelector('.timeline-body'), { overflow: 'visible', height: 'auto' });
  document.querySelectorAll('.line').forEach(l => override(l, { overflow: 'visible' }));
  document.querySelectorAll('.cards-wrap').forEach(w => override(w, { overflow: 'visible', height: 'auto', flex: 'none' }));

  await new Promise(r => setTimeout(r, 50));

  try {
    const width = Math.max(document.body.scrollWidth, document.documentElement.scrollWidth);
    const height = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
    const canvas = await html2canvas(document.body, {
      backgroundColor: '#111827', scale: 2, useCORS: true, logging: false,
      width, height, windowWidth: width, windowHeight: height,
    });
    const link = document.createElement('a');
    link.download = `生产计划板_${new Date().toLocaleDateString('zh-CN').replace(/\//g,'-')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (err) {
    showToast('截图失败: ' + err.message, 'error');
  } finally {
    restoreFns.forEach(fn => fn());
    exportBtn.textContent = orig;
    exportBtn.disabled = false;
  }
}

const _clockMq = window.matchMedia('(max-width: 900px) and (orientation: portrait)');
function tick() {

const DOW_JP = ['日','月','火','水','木','金','土'];
const JP_FIXED_HOLIDAYS = new Set([
  '01-01','02-11','02-23','04-29','05-03','05-04','05-05','08-11','11-03','11-23'
]);
function getNthWeekdayDate(year, month, weekday, n) {
  let count = 0;
  for (let d = 1; d <= 31; d++) {
    const dt = new Date(year, month - 1, d);
    if (dt.getMonth() !== month - 1) break;
    if (dt.getDay() === weekday && ++count === n) return d;
  }
  return -1;
}
function isJpHoliday(date) {
  const y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate();
  const md = `${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  if (JP_FIXED_HOLIDAYS.has(md)) return true;
  if (m === 1  && d === getNthWeekdayDate(y, 1,  1, 2)) return true;
  if (m === 3  && (d === 20 || d === 21)) return true;
  if (m === 7  && d === getNthWeekdayDate(y, 7,  1, 3)) return true;
  if (m === 9  && d === getNthWeekdayDate(y, 9,  1, 3)) return true;
  if (m === 9  && (d === 22 || d === 23)) return true;
  if (m === 10 && d === getNthWeekdayDate(y, 10, 1, 2)) return true;
  if (date.getDay() === 1) {
    const sun = new Date(y, m - 1, d - 1);
    const smd = `${String(sun.getMonth()+1).padStart(2,'0')}-${String(sun.getDate()).padStart(2,'0')}`;
    if (JP_FIXED_HOLIDAYS.has(smd)) return true;
  }
  return false;
}
// ============ 日式自定义日历 ============
let calPopover = null;
let calView = null; // {year, month}
function openCalendar(anchorEl) {
  if (calPopover) { closeCalendar(); return; }
  const [y, m] = currentDate.split('-').map(Number);
  calView = { year: y, month: m };
  calPopover = document.createElement('div');
  calPopover.className = 'cal-popover';
  document.body.appendChild(calPopover);
  // click 监听器只能在元素创建时挂一次。
  // 之前在 renderCalendar() 里挂导致每次翻页都新增一个监听器,
  // 第 N 次点击会触发 N 个监听器,月份连跳多次,跨年时表现为"一年一年"乱跳。
  calPopover.addEventListener('click', (e) => {
    const t = e.target;
    const act = t.dataset && t.dataset.act;
    if (act === 'prev') {
      calView.month--;
      if (calView.month < 1) { calView.month = 12; calView.year--; }
      renderCalendar();
    } else if (act === 'next') {
      calView.month++;
      if (calView.month > 12) { calView.month = 1; calView.year++; }
      renderCalendar();
    } else if (act === 'today') {
      switchDate(todayStr()); closeCalendar();
    } else if (t.dataset && t.dataset.date) {
      switchDate(t.dataset.date); closeCalendar();
    }
  });
  renderCalendar();
  positionCalendar(anchorEl);
  setTimeout(() => {
    document.addEventListener('mousedown', calOutside);
    document.addEventListener('touchstart', calOutside, { passive: true });
    window.addEventListener('resize', closeCalendar);
  }, 0);
}
function closeCalendar() {
  if (calPopover) { calPopover.remove(); calPopover = null; }
  document.removeEventListener('mousedown', calOutside);
  document.removeEventListener('touchstart', calOutside);
  window.removeEventListener('resize', closeCalendar);
}
function calOutside(e) {
  if (!calPopover) return;
  if (calPopover.contains(e.target)) return;
  if (e.target.closest('.timeline-head')) return;
  closeCalendar();
}
function renderCalendar() {
  if (!calPopover) return;
  const { year, month } = calView;
  const first = new Date(year, month - 1, 1);
  const firstDow = first.getDay(); // 日=0 ... 土=6
  const lastDay = new Date(year, month, 0).getDate();
  const prevLast = new Date(year, month - 1, 0).getDate();
  const today = todayStr();
  const cells = [];
  for (let i = firstDow - 1; i >= 0; i--) {
    const pm = month === 1 ? 12 : month - 1;
    const py = month === 1 ? year - 1 : year;
    cells.push({ y: py, m: pm, d: prevLast - i, other: true });
  }
  for (let d = 1; d <= lastDay; d++) cells.push({ y: year, m: month, d, other: false });
  let nextD = 1;
  while (cells.length < 42) {
    const nm = month === 12 ? 1 : month + 1;
    const ny = month === 12 ? year + 1 : year;
    cells.push({ y: ny, m: nm, d: nextD++, other: true });
  }
  let html = `
    <div class="cal-head">
      <button class="cal-nav" data-act="prev" type="button" aria-label="上一月">‹</button>
      <div class="cal-title">${year}年 ${String(month).padStart(2,'0')}月</div>
      <button class="cal-nav" data-act="next" type="button" aria-label="下一月">›</button>
    </div>
    <div class="cal-dows">
      <div class="cal-dow sun">日</div><div class="cal-dow">月</div><div class="cal-dow">火</div><div class="cal-dow">水</div><div class="cal-dow">木</div><div class="cal-dow">金</div><div class="cal-dow sat">土</div>
    </div>
    <div class="cal-grid">`;
  cells.forEach(c => {
    const dt = new Date(c.y, c.m - 1, c.d);
    const dow = dt.getDay();
    const holi = isJpHoliday(dt);
    const ds = `${c.y}-${String(c.m).padStart(2,'0')}-${String(c.d).padStart(2,'0')}`;
    const cls = ['cal-day'];
    if (c.other) cls.push('other');
    if (dow === 6) cls.push('sat');
    if (dow === 0 || holi) cls.push('sun');
    if (ds === today) cls.push('today');
    if (ds === currentDate) cls.push('selected');
    html += `<button type="button" class="${cls.join(' ')}" data-date="${ds}">${c.d}</button>`;
  });
  html += `</div>
    <div class="cal-foot">
      <button type="button" class="cal-today-btn" data-act="today">今日</button>
    </div>`;
  calPopover.innerHTML = html;
  // click 监听器在 openCalendar 中只挂一次,这里不再重复挂(否则会累加)
}
function positionCalendar(anchor) {
  if (!calPopover) return;
  const r = anchor.getBoundingClientRect();
  const pop = calPopover.getBoundingClientRect();
  const margin = 8;
  let left = r.left + r.width / 2 - pop.width / 2;
  let top = r.bottom + 6;
  if (left + pop.width > window.innerWidth - margin) left = window.innerWidth - pop.width - margin;
  if (left < margin) left = margin;
  if (top + pop.height > window.innerHeight - margin) {
    top = Math.max(margin, window.innerHeight - pop.height - margin);
  }
  calPopover.style.left = left + 'px';
  calPopover.style.top = top + 'px';
}

function updateDateHeader() {
  const [y, m, day] = currentDate.split('-').map(Number);

  const isToday = currentDate === todayStr();
  const head = document.getElementById('timelineHead');
  head.innerHTML =

let _suppressDateBroadcast = false;
function broadcastPlanDate() {

function switchDate(newDate) {

function onBentoSynced(affected) {

(function syncFootH() {

/* === 现代化弹层 / Toast === */
.confirm-popover{position:fixed;z-index:10000;background:linear-gradient(180deg,#1d1d22 0%,#16161a 100%);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px 16px;box-shadow:0 24px 56px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.03) inset,0 1px 0 rgba(255,255,255,0.06) inset;min-width:220px;max-width:300px;font-size:13px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:confirmIn .2s cubic-bezier(0.2,0.8,0.2,1);font-family:inherit;color:#e8e8e8}
.confirm-popover .confirm-text{font-weight:600;font-size:14px;margin-bottom:4px;line-height:1.4;letter-spacing:.01em}
.confirm-popover .confirm-sub{color:#9ca0a8;font-size:12px;margin-bottom:12px;line-height:1.4}
.confirm-popover .confirm-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.confirm-popover button{font:inherit;padding:7px 14px;font-size:12px;font-weight:500;line-height:1;border-radius:7px;border:1px solid #2a2d33;background:transparent;color:#e8e8e8;cursor:pointer;transition:transform .12s,background .15s,box-shadow .15s;letter-spacing:.01em}
.confirm-popover button:hover{background:#1f1f23}
.confirm-popover button:active{transform:scale(0.97)}
.confirm-popover button.primary{background:var(--accent);border-color:var(--accent);color:#14181f;box-shadow:0 2px 8px rgba(var(--accent-rgb),0.35)}
.confirm-popover button.primary:hover{background:var(--accent-light);box-shadow:0 4px 12px rgba(var(--accent-rgb),0.45)}
.confirm-popover button.danger{background:#ef4444;border-color:#ef4444;color:#fff;box-shadow:0 2px 8px rgba(239,68,68,0.35)}
.confirm-popover button.danger:hover{background:#dc2626;box-shadow:0 4px 12px rgba(239,68,68,0.45)}
.confirm-popover input.confirm-input,.confirm-popover select.confirm-input{width:100%;margin-bottom:10px;padding:9px 11px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:#e8e8e8;font:inherit;font-size:13px;box-sizing:border-box;transition:border-color .15s,background .15s,box-shadow .15s}
.confirm-popover input.confirm-input:focus,.confirm-popover select.confirm-input:focus{border-color:var(--accent);background:rgba(0,0,0,0.45);outline:none;box-shadow:0 0 0 3px rgba(var(--accent-rgb),0.18)}

@keyframes confirmIn{from{opacity:0;transform:translateY(-6px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:20000;background:linear-gradient(180deg,#1d1d22 0%,#16161a 100%);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:10px 16px;color:#e8e8e8;font:inherit;font-size:13px;font-weight:500;box-shadow:0 12px 32px rgba(0,0,0,0.5);animation:toastIn .25s cubic-bezier(0.2,0.8,0.2,1);display:flex;align-items:center;gap:8px;max-width:90vw}

.toast.hide{animation:toastOut .2s ease-in forwards}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-10px)}}

<script>
// === 字体调节(便当名 / 卡片文字) ===
(function(){
  const FONT_KEY = 'config-font-prefs-v1';
  const DEFAULTS = { bentoSize: 32, bentoWeight: 600, matsSize: 15, matsWeight: 400 };
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
  function clampStep(v, lo, hi, step){ return clamp(Math.round(v/step)*step, lo, hi); }
  function load(){
    try {
      const p = JSON.parse(localStorage.getItem(FONT_KEY) || '{}');
      return {
        bentoSize: clamp(+p.bentoSize || DEFAULTS.bentoSize, 16, 56),
        bentoWeight: clampStep(+p.bentoWeight || DEFAULTS.bentoWeight, 300, 900, 100),
        matsSize: clamp(+p.matsSize || DEFAULTS.matsSize, 10, 24),
        matsWeight: clampStep(+p.matsWeight || DEFAULTS.matsWeight, 300, 900, 100)
      };
    } catch(_) { return Object.assign({}, DEFAULTS); }
  }
  function save(s){ try { localStorage.setItem(FONT_KEY, JSON.stringify(s)); } catch(_){} }
  function apply(s){
    const r = document.documentElement.style;
    r.setProperty('--bento-title-size', s.bentoSize + 'px');
    r.setProperty('--bento-title-weight', String(s.bentoWeight));
    r.setProperty('--mats-size', s.matsSize + 'px');
    r.setProperty('--mats-weight', String(s.matsWeight));
  }
  function syncUI(s){
    const setRange = (id, val) => { const el = document.getElementById(id); if(el) el.value = val; };
    const setText  = (id, val) => { const el = document.getElementById(id); if(el) el.textContent = val; };
    setRange('fp-bento-size', s.bentoSize);     setText('fp-bento-size-v', s.bentoSize + 'px');
    setRange('fp-bento-weight', s.bentoWeight); setText('fp-bento-weight-v', s.bentoWeight);
    setRange('fp-mats-size', s.matsSize);       setText('fp-mats-size-v', s.matsSize + 'px');
    setRange('fp-mats-weight', s.matsWeight);   setText('fp-mats-weight-v', s.matsWeight);
  }
  const state = load();
  apply(state);
  function init(){
    const pop = document.getElementById('font-pop');
    const btn = document.getElementById('btn-font');
    if(!pop || !btn) return;
    syncUI(state);
    btn.addEventListener('click', e => { e.stopPropagation(); pop.classList.toggle('show'); });
    document.addEventListener('click', e => {
      if(!pop.contains(e.target) && e.target !== btn) pop.classList.remove('show');
    });
    const bind = (id, key) => {
      const el = document.getElementById(id); if(!el) return;
      el.addEventListener('input', () => {
        state[key] = parseInt(el.value, 10);
        apply(state); save(state); syncUI(state);
      });
    };
    bind('fp-bento-size', 'bentoSize');
    bind('fp-bento-weight', 'bentoWeight');
    bind('fp-mats-size', 'matsSize');
    bind('fp-mats-weight', 'matsWeight');
    document.getElementById('fp-reset').addEventListener('click', () => {
      Object.assign(state, DEFAULTS);
      apply(state); save(state); syncUI(state);
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

// === 现代化 popover/toast(替代原生 confirm/alert/prompt) ===
function showConfirmPopover(anchor, opts) {
  document.querySelectorAll('.confirm-popover').forEach(el => el.remove());
  const pop = document.createElement('div');
  pop.className = 'confirm-popover';
  const textEl = document.createElement('div'); textEl.className = 'confirm-text'; textEl.textContent = opts.text || '确认?'; pop.appendChild(textEl);
  if (opts.sub) { const s = document.createElement('div'); s.className = 'confirm-sub'; s.textContent = opts.sub; pop.appendChild(s); }
  let inputEl = null;
  if (opts.input) {
    if (opts.input.options) {
      inputEl = document.createElement('select'); inputEl.className = 'confirm-input';
      for (const o of opts.input.options) { const op = document.createElement('option'); op.value = o.value; op.textContent = o.label; inputEl.appendChild(op); }
      if (opts.input.value != null) inputEl.value = opts.input.value;
    } else {
      inputEl = document.createElement('input'); inputEl.className = 'confirm-input';
      inputEl.type = opts.input.type || 'text';
      inputEl.value = opts.input.value || '';
      inputEl.placeholder = opts.input.placeholder || '';
    }
    pop.appendChild(inputEl);
  }
  if (opts.extra) {
    const eb = document.createElement('button'); eb.className = 'confirm-extra' + (opts.extra.danger ? ' danger' : '');
    eb.textContent = opts.extra.text;
    eb.onclick = (e) => { e.stopPropagation(); close(); opts.extra.onClick && opts.extra.onClick(); };
    pop.appendChild(eb);
  }
  const actions = document.createElement('div'); actions.className = 'confirm-actions';
  let confirmed = false;
  const doConfirm = () => { const v = inputEl ? inputEl.value : null; confirmed = true; close(); opts.onConfirm && opts.onConfirm(v); };
  const noBtn = document.createElement('button'); noBtn.textContent = opts.cancelText || '取消';
  noBtn.onclick = (e) => { e.stopPropagation(); close(); };
  const yesBtn = document.createElement('button'); yesBtn.className = opts.danger ? 'danger' : 'primary'; yesBtn.textContent = opts.confirmText || '确认';
  yesBtn.onclick = (e) => { e.stopPropagation(); doConfirm(); };
  actions.appendChild(noBtn); actions.appendChild(yesBtn); pop.appendChild(actions);
  if (inputEl) inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doConfirm(); } });
  document.body.appendChild(pop);
  const pr = pop.getBoundingClientRect(); const m = 8;
  const r = anchor && anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : null;
  if (!r || (r.width === 0 && r.height === 0)) {
    pop.style.left = ((window.innerWidth - pr.width) / 2) + 'px';
    pop.style.top  = ((window.innerHeight - pr.height) / 2) + 'px';
  } else {
    let left = r.left - pr.width - m; if (left < m) left = r.right + m;
    if (left + pr.width > window.innerWidth - m) left = Math.max(m, window.innerWidth - pr.width - m);

  if (m === 3  && (d === 20 || d === 21)) return true;
  if (m === 7  && d === calNthWd(y, 7,  1, 3)) return true;
  if (m === 9  && d === calNthWd(y, 9,  1, 3)) return true;

  saveState();
}

// 取「某条生产线」的默认布局。没存过就用 SEED_LINE 自动初始化一份。
// 没传 lineId(空字符串/null)就退回到全局的 state.line 兜底。
function getLineTemplate(lineId) {
  if (!lineId) return state.line;
  if (!state.lineTemplates[lineId] || !state.lineTemplates[lineId].length) {
    state.lineTemplates[lineId] = SEED_LINE.map(p => ({ id: uid("pos"), slot: p.slot, row: p.row, label: p.label }));
  }
  return state.lineTemplates[lineId];
}

// 重置某条生产线的默认布局为 SEED_LINE。
function resetLineTemplateToSeed(lineId) {
  if (!lineId) { resetLineToSeed(); return; }
  state.lineTemplates[lineId] = SEED_LINE.map(p => ({ id: uid("pos"), slot: p.slot, row: p.row, label: p.label }));
  saveState();
}

// 用某条生产线的默认布局覆盖一个便当的卡片;同时清空 assignments(布局换了,旧分配失效)。
function applyLineTemplateToBento(bento, lineId) {
  const tpl = getLineTemplate(lineId);
  bento.line = tpl.map(p => ({ id: uid("pos"), slot: p.slot, row: p.row, label: p.label }));
  bento.assignments = {};
  saveState();
}

// 重置单个便当的卡片布局为种子
function resetBentoLine(bento) {
  bento.assignments = {};
  bento.line = SEED_LINE.map(p => ({ id: uid("pos"), slot: p.slot, row: p.row, label: p.label }));
  saveState();
}

function toggleAssignment(bentoId, posId, matId) {
  const b = state.bentos.find(x => x.id === bentoId);
  if (!b) return;
  if (!b.assignments[posId]) b.assignments[posId] = [];
  const arr = b.assignments[posId];
  const i = arr.indexOf(matId);
  if (i >= 0) arr.splice(i, 1); else arr.push(matId);
  if (arr.length === 0) delete b.assignments[posId];
  saveState();
}

function addBento(name) {
  name = (name || "").trim();
  if (!name) return null;
  if (state.bentos.some(b => b.name === name)) return null;
  const b = {
    id: uid("ben"),
    name,
    assignments: {},
    // 新便当：复制当前模板作为初始卡片布局（独立 posId）
    line: state.line.map(p => ({ id: uid("pos"), slot: p.slot, row: p.row, label: p.label }))
  };
  state.bentos.push(b);
  saveState();
  return b;
}

function deleteBento(id) {
  state.bentos = state.bentos.filter(b => b.id !== id);
  if (state.current.bentoId === id) state.current.bentoId = null;
  if (state.current.editingBentoId === id) state.current.editingBentoId = null;
  saveState();
}

function renameBento(id, name) {
  name = (name || "").trim();
  if (!name) return false;
  if (state.bentos.some(b => b.id !== id && b.name === name)) return false;
  const b = state.bentos.find(x => x.id === id);
  if (!b) return false;
  b.name = name;
  saveState();
  return true;
}

function maxSlot(line) {
  return (line || []).reduce((m,p) => p.slot > m ? p.slot : m, 0);
}

function findSlot(line, slot, row) {
  return (line || []).find(p => p.slot === slot && p.row === row);
}

function getBentoByName(name) {
  return state.bentos.find(b => b.name === name);
}

function matchBentos(prefix) {
  const p = (prefix || "").trim().toLowerCase();
  const list = p ? state.bentos.filter(b => b.name.toLowerCase().includes(p)) : state.bentos.slice();
  // 排序:有输入时前缀匹配优先,其次包含位置靠前的优先;同档按中文名升序
  if (p) {
    list.sort((a, b) => {
      const an = a.name.toLowerCase(), bn = b.name.toLowerCase();
      const ai = an.indexOf(p), bi = bn.indexOf(p);
      if (ai !== bi) return ai - bi;
      return a.name.localeCompare(b.name, "zh-Hans-CN");
    });
  } else {
    list.sort((a, b) => a.name.localeCompare(b.name, "zh-Hans-CN"));
  }
  return list;
}

function colorToHex(c) {
  if (!c) return "#888888";
  if (c.startsWith("#")) return c;
  const m = c.match(/hsl\((\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)%\s+(\d+(?:\.\d+)?)%\)/);
  if (!m) return "#888888";
  const h = parseFloat(m[1]) / 360, s = parseFloat(m[2]) / 100, l = parseFloat(m[3]) / 100;
  function f(n) {
    const k = (n + h*12) % 12;
    const a = s * Math.min(l, 1-l);
    const v = l - a * Math.max(-1, Math.min(k-3, 9-k, 1));
    return Math.round(v*255).toString(16).padStart(2,"0");
  }
  return "#" + f(0) + f(8) + f(4);
}

function runSelfTests() {
  const tests = [];
  function assert(name, cond, detail="") { tests.push({ name, ok: !!cond, detail }); }

  // seed produces 14 positions across 8 slots
  const s = defaultState();
  seedLineIfEmpty(s);
  assert("seed produces 14 positions", s.line.length === 14, "got " + s.line.length);
  const slots = new Set(s.line.map(p => p.slot));
  assert("seed spans 8 columns", slots.size === 8 && Math.max(...slots) === 8);
  const find = (slot, row) => s.line.find(p => p.slot === slot && p.row === row);
  assert("col1 top is 2", find(1,"top")?.label === "2");
  assert("col1 bottom is 1", find(1,"bottom")?.label === "1");
  assert("col6 has no bottom", !find(6,"bottom"));
  assert("col7 lid pair", find(7,"top")?.label === "盖盖2" && find(7,"bottom")?.label === "盖盖1");
  assert("col8 bottom only", find(8,"bottom")?.label === "装框" && !find(8,"top"));

  // load/save roundtrip
  const before = JSON.stringify(state);
  saveState();
  const reloaded = loadState();
  assert("save/load roundtrip", JSON.stringify({...reloaded, line: reloaded.line.map(p=>({slot:p.slot,row:p.row,label:p.label}))}) === JSON.stringify({...JSON.parse(before), line: JSON.parse(before).line.map(p=>({slot:p.slot,row:p.row,label:p.label}))}));

  // materials cascade
  const snap = JSON.parse(JSON.stringify(state));
  state = defaultState(); seedLineIfEmpty(state);
  const m1 = addMaterial("鸡腿", "#ff0000");
  assert("addMaterial returns object", !!m1 && m1.name === "鸡腿");
  assert("addMaterial dedup by name", addMaterial("鸡腿") === null);
  state.bentos.push({ id:"b1", name:"x", assignments:{ "p1":[m1.id, "other"] } });
  deleteMaterialCascade(m1.id);
  assert("deleteMaterialCascade removes from pool", !state.materials.some(m => m.id === m1.id));
  assert("deleteMaterialCascade removes from assignments", !state.bentos[0].assignments["p1"].includes(m1.id));
  assert("deleteMaterialCascade keeps others", state.bentos[0].assignments["p1"].includes("other"));
  state = snap; saveState();

  // match + max slot
  const snap2 = JSON.parse(JSON.stringify(state));
  state = defaultState(); seedLineIfEmpty(state);
  assert("maxSlot is 8", maxSlot(state.line) === 8);
  state.bentos.push({ id:"x", name:"鸡腿便当", assignments:{}, line:[] }, { id:"y", name:"牛肉便当", assignments:{}, line:[] });
  assert("matchBentos prefix 鸡", matchBentos("鸡").length === 1);
  assert("matchBentos empty returns all", matchBentos("").length === 2);
  assert("getBentoByName exact", getBentoByName("牛肉便当")?.id === "y");
  state = snap2; saveState();

  // toggleAssignment (使用便当自己的 line)
  const snap3 = JSON.parse(JSON.stringify(state));
  state = defaultState(); seedLineIfEmpty(state);
  const mA = addMaterial("A");
  const bA = addBento("test便当");
  const pos1 = bA.line[0];
  toggleAssignment(bA.id, pos1.id, mA.id);
  assert("toggleAssignment adds", bA.assignments[pos1.id]?.includes(mA.id));
  toggleAssignment(bA.id, pos1.id, mA.id);
  assert("toggleAssignment removes", !bA.assignments[pos1.id] || bA.assignments[pos1.id].length === 0);
  state = snap3; saveState();

  // 每便当独立 line
  const snap4 = JSON.parse(JSON.stringify(state));
  state = defaultState(); seedLineIfEmpty(state);
  const bZ = addBento("z便当");
  assert("new bento has own line copy", Array.isArray(bZ.line) && bZ.line.length === state.line.length);
  assert("bento line ids are independent", bZ.line[0].id !== state.line[0].id);
  addSlot(bZ.line);
  assert("addSlot to bento increases its line", bZ.line.length === SEED_LINE.length + 1);
  assert("addSlot does not affect template", state.line.length === SEED_LINE.length);
  state = snap4; saveState();

  const failed = tests.filter(t => !t.ok);
  if (failed.length) {
    showBanner("自检失败:\n" + failed.map(t => "✗ " + t.name + (t.detail?" — "+t.detail:"")).join("\n"), "err");
  } else {
    showBanner("✓ 自检通过 (" + tests.length + " 项)", "ok");
  }
}
