function trimGridForExport() {
  let minTop = Infinity, maxBottom = 0;
  document.querySelectorAll('.card').forEach(c => {
    const top = parseFloat(c.style.top) || 0;
    const h = parseFloat(c.style.height) || 0;
    if (top < minTop) minTop = top;
    if (top + h > maxBottom) maxBottom = top + h;
  });
  if (maxBottom <= 0 || minTop === Infinity) return () => {};
  const shift = Math.max(0, minTop - 4);
  const visH = maxBottom - shift + 8;
  const restoreFns = [];
  const setStyles = (el, styles) => {
    const prev = {};
    for (const k in styles) { prev[k] = el.style[k]; el.style[k] = styles[k]; }
    restoreFns.push(() => { for (const k in prev) el.style[k] = prev[k]; });
  };
  document.querySelectorAll('.cards-grid').forEach(grid => {
    setStyles(grid, { transform: shift > 0 ? `translateY(-${shift}px)` : '', height: (visH + shift) + 'px' });
    const wrap = grid.parentElement;
    if (wrap && wrap.classList.contains('cards-wrap')) {
      setStyles(wrap, { height: visH + 'px', overflow: 'hidden', flex: 'none' });
    }
  });
  const ti = document.getElementById('timelineInner');
  if (ti) setStyles(ti, { transform: shift > 0 ? `translateY(-${shift}px)` : '', height: (visH + shift) + 'px' });
  const tb = document.getElementById('timelineBody');
  if (tb) setStyles(tb, { height: visH + 'px', overflow: 'hidden', flex: 'none' });
  return () => restoreFns.forEach(fn => fn());
}

function setupPrintLayout() {
  setActiveCard(null);
  const root = document.documentElement;
  const origHourPxStr = getComputedStyle(root).getPropertyValue('--hour-px').trim();
  const origHourPx = parseFloat(origHourPxStr) || 140;

  let minTop = Infinity, maxBottom = 0;
  document.querySelectorAll('.card').forEach(c => {
    const t = parseFloat(c.style.top) || 0;
    const h = parseFloat(c.style.height) || 0;
    if (t < minTop) minTop = t;
    if (t + h > maxBottom) maxBottom = t + h;
  });
  const cardRange = (maxBottom > 0 && minTop !== Infinity) ? (maxBottom - minTop) : 0;

  document.body.classList.add('printing-compact');

  const PAGE_H_FOR_CARDS = 771 - 132;
  let newHourPx = origHourPx;
  if (cardRange > PAGE_H_FOR_CARDS && cardRange > 0) {
    newHourPx = Math.max(18, origHourPx * (PAGE_H_FOR_CARDS / cardRange));
  }
  const needRescale = Math.abs(newHourPx - origHourPx) > 0.5;
  if (needRescale) root.style.setProperty('--hour-px', newHourPx + 'px');
  renderTimeline();
  document.querySelectorAll('.cards-grid').forEach(g => {
    g.style.height = (getTotalPx() + 16) + 'px';
    renderGridLines(g);
  });
  document.querySelectorAll('.line').forEach(l => recalc(l));
  const restore = trimGridForExport();
  return () => {
    restore();
    document.body.classList.remove('printing-compact');
    if (needRescale) root.style.setProperty('--hour-px', origHourPxStr);
    renderTimeline();
    document.querySelectorAll('.cards-grid').forEach(g => {
      g.style.height = (getTotalPx() + 16) + 'px';
      renderGridLines(g);
    });
    document.querySelectorAll('.line').forEach(l => recalc(l));
  };
}

async function doExportPdf() {
  exportMenu.classList.remove('show');
  if (typeof html2canvas === 'undefined' || !window.jspdf) {
    alert('PDF 导出需要网络连接（加载 html2canvas / jsPDF），请确认网络后重试。');
    return;
  }
  const orig = exportBtn.textContent;
  exportBtn.textContent = '生成PDF…';
  exportBtn.disabled = true;
  let cleanup = null;
  // A4 横向 96dpi ≈ 1123 × 794
  const PAGE_W = 1123, PAGE_H = 794;
  const stage = document.createElement('div');
  stage.style.cssText = `position:fixed;left:0;top:0;width:${PAGE_W}px;height:${PAGE_H}px;background:#fff;z-index:-1;overflow:hidden;pointer-events:none`;
  document.body.appendChild(stage);
  const savedWidth = document.documentElement.style.width;
  try {
    cleanup = setupPrintLayout();
    document.body.classList.add('printing');
    document.documentElement.style.width = PAGE_W + 'px';
    await new Promise(r => setTimeout(r, 120));
    const canvas = await html2canvas(document.body, {
      backgroundColor: '#fff', scale: 2, useCORS: true, logging: false,
      width: PAGE_W, height: PAGE_H, windowWidth: PAGE_W, windowHeight: PAGE_H,
    });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    const pdfW = pdf.internal.pageSize.getWidth();
    const pdfH = pdf.internal.pageSize.getHeight();
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, pdfW, pdfH);
    const date = new Date().toLocaleDateString('zh-CN').replace(/\//g, '-');
    pdf.save(`生产计划板_${date}.pdf`);
  } catch (err) {
    alert('PDF 导出失败: ' + err.message);
  } finally {
    document.body.classList.remove('printing');
    if (cleanup) cleanup();
    document.documentElement.style.width = savedWidth;
    stage.remove();

async function doExportPng() {
  exportMenu.classList.remove('show');
  if (typeof html2canvas === 'undefined') {
    alert('截图功能需要网络连接（加载 html2canvas），请确认网络后重试。');
    return;
  }
  const orig = exportBtn.textContent;
  exportBtn.textContent = '截图中…';
  exportBtn.disabled = true;

  // 关闭活动卡片，避免 fixed 抽屉混入截图
  setActiveCard(null);

  // 临时展开所有可滚动容器，让 html2canvas 抓到完整内容
  const restoreFns = [];
  const override = (el, styles) => {
    if (!el) return;
    const prev = {};
    for (const k in styles) { prev[k] = el.style[k]; el.style[k] = styles[k]; }
    restoreFns.push(() => { for (const k in prev) el.style[k] = prev[k]; });
  };
  override(document.documentElement, { overflow: 'visible', height: 'auto' });
  override(document.body, { overflow: 'visible', height: 'auto' });
  override(document.querySelector('.main'), { height: 'auto', overflow: 'visible' });
  override(document.querySelector('.timeline'), { overflow: 'visible', height: 'auto' });
  override(document.querySelector('.timeline-body'), { overflow: 'visible', height: 'auto' });
  document.querySelectorAll('.line').forEach(l => override(l, { overflow: 'visible' }));
  document.querySelectorAll('.cards-wrap').forEach(w => override(w, { overflow: 'visible', height: 'auto', flex: 'none' }));

  await new Promise(r => setTimeout(r, 50));

  try {
    const width = Math.max(document.body.scrollWidth, document.documentElement.scrollWidth);
    const height = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
    const canvas = await html2canvas(document.body, {
      backgroundColor: '#111827', scale: 2, useCORS: true, logging: false,
      width, height, windowWidth: width, windowHeight: height,
    });
    const link = document.createElement('a');
    link.download = `生产计划板_${new Date().toLocaleDateString('zh-CN').replace(/\//g,'-')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  } catch (err) {
    alert('截图失败：' + err.message);
  } finally {
    restoreFns.forEach(fn => fn());
    exportBtn.textContent = orig;
    exportBtn.disabled = false;
  }
}

const DOW_JP = ['日','月','火','水','木','金','土'];
const JP_FIXED_HOLIDAYS = new Set([
  '01-01','02-11','02-23','04-29','05-03','05-04','05-05','08-11','11-03','11-23'
]);
function getNthWeekdayDate(year, month, weekday, n) {
  let count = 0;
  for (let d = 1; d <= 31; d++) {
    const dt = new Date(year, month - 1, d);
    if (dt.getMonth() !== month - 1) break;
    if (dt.getDay() === weekday && ++count === n) return d;
  }
  return -1;
}
function isJpHoliday(date) {
  const y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate();
  const md = `${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  if (JP_FIXED_HOLIDAYS.has(md)) return true;
  if (m === 1  && d === getNthWeekdayDate(y, 1,  1, 2)) return true;
  if (m === 3  && (d === 20 || d === 21)) return true;
  if (m === 7  && d === getNthWeekdayDate(y, 7,  1, 3)) return true;
  if (m === 9  && d === getNthWeekdayDate(y, 9,  1, 3)) return true;
  if (m === 9  && (d === 22 || d === 23)) return true;
  if (m === 10 && d === getNthWeekdayDate(y, 10, 1, 2)) return true;
  if (date.getDay() === 1) {
    const sun = new Date(y, m - 1, d - 1);
    const smd = `${String(sun.getMonth()+1).padStart(2,'0')}-${String(sun.getDate()).padStart(2,'0')}`;
    if (JP_FIXED_HOLIDAYS.has(smd)) return true;
  }
  return false;
}
// ============ 日式自定义日历 ============
let calPopover = null;
let calView = null; // {year, month}
function openCalendar(anchorEl) {
  if (calPopover) { closeCalendar(); return; }
  const [y, m] = currentDate.split('-').map(Number);
  calView = { year: y, month: m };
  calPopover = document.createElement('div');
  calPopover.className = 'cal-popover';
  document.body.appendChild(calPopover);
  renderCalendar();
  positionCalendar(anchorEl);
  setTimeout(() => {
    document.addEventListener('mousedown', calOutside);
    document.addEventListener('touchstart', calOutside, { passive: true });
    window.addEventListener('resize', closeCalendar);
  }, 0);
}
function closeCalendar() {
  if (calPopover) { calPopover.remove(); calPopover = null; }
  document.removeEventListener('mousedown', calOutside);
  document.removeEventListener('touchstart', calOutside);
  window.removeEventListener('resize', closeCalendar);
}
function calOutside(e) {
  if (!calPopover) return;
  if (calPopover.contains(e.target)) return;
  if (e.target.closest('.timeline-head')) return;
  closeCalendar();
}
function renderCalendar() {
  if (!calPopover) return;
  const { year, month } = calView;
  const first = new Date(year, month - 1, 1);
  const firstDow = first.getDay(); // 日=0 ... 土=6
  const lastDay = new Date(year, month, 0).getDate();
  const prevLast = new Date(year, month - 1, 0).getDate();
  const today = todayStr();
  const cells = [];
  for (let i = firstDow - 1; i >= 0; i--) {
    const pm = month === 1 ? 12 : month - 1;
    const py = month === 1 ? year - 1 : year;
    cells.push({ y: py, m: pm, d: prevLast - i, other: true });
  }
  for (let d = 1; d <= lastDay; d++) cells.push({ y: year, m: month, d, other: false });
  let nextD = 1;
  while (cells.length < 42) {
    const nm = month === 12 ? 1 : month + 1;
    const ny = month === 12 ? year + 1 : year;
    cells.push({ y: ny, m: nm, d: nextD++, other: true });
  }
  let html = `
    <div class="cal-head">
      <button class="cal-nav" data-act="prev" type="button" aria-label="上一月">‹</button>
      <div class="cal-title">${year}年 ${String(month).padStart(2,'0')}月</div>
      <button class="cal-nav" data-act="next" type="button" aria-label="下一月">›</button>
    </div>
    <div class="cal-dows">
      <div class="cal-dow sun">日</div><div class="cal-dow">月</div><div class="cal-dow">火</div><div class="cal-dow">水</div><div class="cal-dow">木</div><div class="cal-dow">金</div><div class="cal-dow sat">土</div>
    </div>
    <div class="cal-grid">`;
  cells.forEach(c => {
    const dt = new Date(c.y, c.m - 1, c.d);
    const dow = dt.getDay();
    const holi = isJpHoliday(dt);
    const ds = `${c.y}-${String(c.m).padStart(2,'0')}-${String(c.d).padStart(2,'0')}`;
    const cls = ['cal-day'];
    if (c.other) cls.push('other');
    if (dow === 6) cls.push('sat');
    if (dow === 0 || holi) cls.push('sun');
    if (ds === today) cls.push('today');
    if (ds === currentDate) cls.push('selected');
    html += `<button type="button" class="${cls.join(' ')}" data-date="${ds}">${c.d}</button>`;
  });
  html += `</div>
    <div class="cal-foot">
      <button type="button" class="cal-today-btn" data-act="today">今日</button>
    </div>`;
  calPopover.innerHTML = html;
  calPopover.addEventListener('click', (e) => {
    const t = e.target;
    const act = t.dataset && t.dataset.act;
    if (act === 'prev') {
      calView.month--; if (calView.month < 1) { calView.month = 12; calView.year--; }
      renderCalendar();
    } else if (act === 'next') {
      calView.month++; if (calView.month > 12) { calView.month = 1; calView.year++; }
      renderCalendar();
    } else if (act === 'today') {
      switchDate(todayStr()); closeCalendar();
    } else if (t.dataset && t.dataset.date) {
      switchDate(t.dataset.date); closeCalendar();
    }
  });
}
function positionCalendar(anchor) {
  if (!calPopover) return;
  const r = anchor.getBoundingClientRect();
  const pop = calPopover.getBoundingClientRect();
  const margin = 8;
  let left = r.left + r.width / 2 - pop.width / 2;
  let top = r.bottom + 6;
  if (left + pop.width > window.innerWidth - margin) left = window.innerWidth - pop.width - margin;
  if (left < margin) left = margin;
  if (top + pop.height > window.innerHeight - margin) {
    top = Math.max(margin, window.innerHeight - pop.height - margin);
  }
  calPopover.style.left = left + 'px';
  calPopover.style.top = top + 'px';
}

function updateDateHeader() {
  const [y, m, day] = currentDate.split('-').map(Number);
  const d = new Date(y, m - 1, day);
  const dow = d.getDay();
  const isHoliday = isJpHoliday(d);
  const dowClass = (dow === 0 || isHoliday) ? 'dow-red' : dow === 6 ? 'dow-sat' : 'dow-weekday';
  const isToday = currentDate === todayStr();
  const head = document.getElementById('timelineHead');
  head.innerHTML =

    `<span class="date-day ${dowClass}">${String(day).padStart(2,'0')}日</span>` +
    `<span class="date-dow ${dowClass}">（${DOW_JP[dow]}）</span>` +
    (isToday ? '' : `<button class="date-back-today" type="button" title="回到今天">今</button>`);
  const backBtn = head.querySelector('.date-back-today');
  if (backBtn) backBtn.addEventListener('click', (e) => { e.stopPropagation(); switchDate(todayStr()); });
}

let _suppressDateBroadcast = false;
function broadcastPlanDate() {
  if (_suppressDateBroadcast) return;
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'plan-date-changed', date: currentDate }, '*');

function switchDate(newDate) {
  if (newDate === currentDate) return;
  try { saveBoard(); } catch (e) {} // 先把当前日期数据落盘
  setActiveCard(null);
  currentDate = newDate;

  lastSnapshot = snapshotStr();
  updateUndoButtons();
  clearUnsaved();
}
updateDateHeader();
// 每分钟检查日期是否跨天(到第二天时,若选的是"昨天的今天"应该提醒,但不强切)
setInterval(() => { if (currentDate === todayStr()) updateDateHeader(); }, 60000);

function onBentoSynced(affected) {

// 监听 localStorage 同源变化(如果 iframe 共享存储)
window.addEventListener('storage', (e) => {
  if (window.skipAutoSave) return; // 父壳导入数据时设此 flag,阻止旧内存 library 被回写

// 响应其他 iframe 询问"当前日期" + 接收他人切换的日期(三 app 公用一个日期)

setTimeout(broadcastPlanDate, 0);

  <button class="btn-tab" data-screen="line">线设置</button>
  <span class="grow"></span>
  <div class="menu-wrap"><button id="btn-export">输出 ▾</button>
    <div class="menu" id="export-menu">
      <div class="menu-item" data-act="print">打印</div>
      <div class="menu-item" data-act="image">导出图片</div>
    </div>
  </div>
</header>
<main id="content"></main>
<div class="backdrop" id="backdrop"></div>
<div class="modal" id="save-modal">
  <div class="box">
    <h3>保存为</h3>
    <input id="save-name" spellcheck="false">
    <div class="actions">
      <button id="save-cancel">取消</button>
      <button id="save-ok" class="primary">保存</button>
    </div>
  </div>
</div>
<aside class="drawer" id="materials-drawer">
  <header>材料库 <button id="materials-close" style="float:right;background:transparent;color:var(--fg);border:1px solid var(--line);padding:2px 8px;border-radius:4px;cursor:pointer">×</button></header>
  <div class="list" id="materials-list"></div>
  <div class="add">
    <input id="materials-name" placeholder="新材料名">
    <button id="materials-add">添加</button>
  </div>
</aside>
<script>
const STORAGE_KEY = "bento-conveyor-v1";

const SEED_LINE = [
  { slot: 1, row: "top",    label: "2" },
  { slot: 1, row: "bottom", label: "1" },
  { slot: 2, row: "top",    label: "3" },
  { slot: 2, row: "bottom", label: "4" },
  { slot: 3, row: "top",    label: "5" },
  { slot: 3, row: "bottom", label: "6" },
  { slot: 4, row: "top",    label: "7" },
  { slot: 4, row: "bottom", label: "8" },
  { slot: 5, row: "top",    label: "フリー1" },
  { slot: 5, row: "bottom", label: "9" },
  { slot: 6, row: "top",    label: "フリー2" },
  { slot: 7, row: "top",    label: "盖盖2" },
  { slot: 7, row: "bottom", label: "盖盖1" },
  { slot: 8, row: "bottom", label: "装框" }
];

function uid(prefix) { return prefix + "-" + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }

function defaultState() {
  return {
    version: 1,
    materials: [],
    line: [],
    bentos: [],
    meta: { people: "", speed: "" },
    mono: false,
    current: { screen: "operate", bentoId: null, editingBentoId: null }
  };
}

function seedLineIfEmpty(s) {
  if (s.line.length === 0) {
    s.line = SEED_LINE.map(p => ({ id: uid("pos"), slot: p.slot, row: p.row, label: p.label }));
  }
}

function migrate(s) {
  s._migrations = s._migrations || {};
  if (!s.meta) s.meta = { people: "", speed: "" };
  if (typeof s.mono !== "boolean") s.mono = false;
  if (!s._migrations.freeLabels) {
    for (const p of s.line) {
      if (p.label === "10") p.label = "フリー1";
      else if (p.label === "11") p.label = "フリー2";
    }
    s._migrations.freeLabels = true;
  }
  // 每个便当独立的卡片布局：旧数据迁移时把全局 state.line 复制给每个便当
  // 保留原 posId 以兼容旧 assignments 引用
  for (const b of s.bentos) {
    if (!Array.isArray(b.line) || b.line.length === 0) {
      b.line = s.line.map(p => ({ id: p.id, slot: p.slot, row: p.row, label: p.label }));
    }
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      const s = defaultState();
      seedLineIfEmpty(s);
      return s;
    }
    const s = JSON.parse(raw);
    if (!s || s.version !== 1) {
      const fresh = defaultState();
      seedLineIfEmpty(fresh);
      return fresh;
    }
    seedLineIfEmpty(s);
    migrate(s);
    return s;
  } catch (e) {
    const s = defaultState();
    seedLineIfEmpty(s);
    migrate(s);
    return s;
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  broadcastBentos();
}
// === 排班数据 & 计划板日期(跨 iframe 接收) ===
let scheduleData = { lines: [], positions: {}, people: [], schedules: {} };
let planDate = (function(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
})();
window.addEventListener('message', (e) => {
  if (!e.data || typeof e.data !== 'object') return;
  if (e.data.type === 'schedule-changed') {
    scheduleData = {
      lines: Array.isArray(e.data.lines) ? e.data.lines : [],
      positions: e.data.positions || {},
      people: Array.isArray(e.data.people) ? e.data.people : [],
      schedules: e.data.schedules || {}
    };
    render();
  } else if (e.data.type === 'plan-date-changed') {
    if (typeof e.data.date === 'string' && e.data.date) {
      planDate = e.data.date;
      render();
    }
  }
});
// 启动时主动请求一次
try {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'schedule-request' }, '*');
    window.parent.postMessage({ type: 'plan-date-request' }, '*');
  }
} catch (_) {}

// === 简易日历(切换 planDate,广播给计划板/排班表) ===
const CAL_DOW_JP = ['日','月','火','水','木','金','土'];
const CAL_FIXED_HOL = new Set(['01-01','02-11','02-23','04-29','05-03','05-04','05-05','08-11','11-03','11-23']);
function calNthWd(y, mo, wd, n) {
  let c = 0;
  for (let d = 1; d <= 31; d++) {
    const dt = new Date(y, mo - 1, d);
    if (dt.getMonth() !== mo - 1) break;
    if (dt.getDay() === wd && ++c === n) return d;
  }
  return -1;
}
function calIsJpHol(date) {
  const y = date.getFullYear(), m = date.getMonth() + 1, d = date.getDate();
  const md = `${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  if (CAL_FIXED_HOL.has(md)) return true;
  if (m === 1  && d === calNthWd(y, 1,  1, 2)) return true;
  if (m === 3  && (d === 20 || d === 21)) return true;
  if (m === 7  && d === calNthWd(y, 7,  1, 3)) return true;
  if (m === 9  && d === calNthWd(y, 9,  1, 3)) return true;
  if (m === 9  && (d === 22 || d === 23)) return true;
  if (m === 10 && d === calNthWd(y, 10, 1, 2)) return true;
  if (date.getDay() === 1) {
    const sun = new Date(y, m - 1, d - 1);
    const smd = `${String(sun.getMonth()+1).padStart(2,'0')}-${String(sun.getDate()).padStart(2,'0')}`;
    if (CAL_FIXED_HOL.has(smd)) return true;
  }
  return false;
}
let _dateCal = null;
let _dateCalView = null;
function openDateCal(anchor) {
  if (_dateCal) { closeDateCal(); return; }
  const [y, m] = planDate.split('-').map(Number);
  _dateCalView = { year: y, month: m };
  _dateCal = document.createElement('div');
  _dateCal.className = 'cal-popover';
  document.body.appendChild(_dateCal);
  renderDateCal();
  positionDateCal(anchor);
  setTimeout(() => {
    document.addEventListener('mousedown', dateCalOutside);
    document.addEventListener('touchstart', dateCalOutside, { passive: true });
    window.addEventListener('resize', closeDateCal);
  }, 0);
}
function closeDateCal() {
  if (_dateCal) { _dateCal.remove(); _dateCal = null; }
  document.removeEventListener('mousedown', dateCalOutside);
  document.removeEventListener('touchstart', dateCalOutside);
  window.removeEventListener('resize', closeDateCal);
}
function dateCalOutside(e) {
  if (!_dateCal) return;
  if (_dateCal.contains(e.target)) return;
  if (e.target.closest && e.target.closest('.chip.accent.clickable')) return;
  closeDateCal();
}
function renderDateCal() {
  if (!_dateCal) return;
  const { year, month } = _dateCalView;
  const firstDow = new Date(year, month - 1, 1).getDay();
  const lastDay = new Date(year, month, 0).getDate();
  const prevLast = new Date(year, month - 1, 0).getDate();
  const today = todayString();
  const cells = [];
  for (let i = firstDow - 1; i >= 0; i--) {
    const pm = month === 1 ? 12 : month - 1;
    const py = month === 1 ? year - 1 : year;
    cells.push({ y: py, m: pm, d: prevLast - i, other: true });
  }
  for (let d = 1; d <= lastDay; d++) cells.push({ y: year, m: month, d, other: false });
  let nd = 1;
  while (cells.length < 42) {
    const nm = month === 12 ? 1 : month + 1;
    const ny = month === 12 ? year + 1 : year;
    cells.push({ y: ny, m: nm, d: nd++, other: true });
  }
  let html = `
    <div class="cal-head">
      <button class="cal-nav" data-act="prev" type="button" aria-label="上一月">‹</button>
      <div class="cal-title">${year}年 ${String(month).padStart(2,'0')}月</div>
      <button class="cal-nav" data-act="next" type="button" aria-label="下一月">›</button>
    </div>
    <div class="cal-dows">
      <div class="cal-dow sun">日</div><div class="cal-dow">月</div><div class="cal-dow">火</div><div class="cal-dow">水</div><div class="cal-dow">木</div><div class="cal-dow">金</div><div class="cal-dow sat">土</div>
    </div>
    <div class="cal-grid">`;
  cells.forEach(c => {
    const dt = new Date(c.y, c.m - 1, c.d);
    const dow = dt.getDay();
    const holi = calIsJpHol(dt);
    const ds = `${c.y}-${String(c.m).padStart(2,'0')}-${String(c.d).padStart(2,'0')}`;
    const cls = ['cal-day'];
    if (c.other) cls.push('other');
    if (dow === 6) cls.push('sat');
    if (dow === 0 || holi) cls.push('sun');
    if (ds === today) cls.push('today');
    if (ds === planDate) cls.push('selected');
    html += `<button type="button" class="${cls.join(' ')}" data-date="${ds}">${c.d}</button>`;
  });
  html += `</div>
    <div class="cal-foot">
      <button type="button" class="cal-today-btn" data-act="today">今日</button>
    </div>`;
  _dateCal.innerHTML = html;
  _dateCal.addEventListener('click', (e) => {
    const t = e.target;
    const act = t.dataset && t.dataset.act;
    if (act === 'prev') {
      _dateCalView.month--; if (_dateCalView.month < 1) { _dateCalView.month = 12; _dateCalView.year--; }
      renderDateCal();
    } else if (act === 'next') {
      _dateCalView.month++; if (_dateCalView.month > 12) { _dateCalView.month = 1; _dateCalView.year++; }
      renderDateCal();
    } else if (act === 'today') {
      pickDate(todayString()); closeDateCal();
    } else if (t.dataset && t.dataset.date) {
      pickDate(t.dataset.date); closeDateCal();
    }
  });
}
function positionDateCal(anchor) {
  if (!_dateCal) return;
  const r = anchor.getBoundingClientRect();
  const pop = _dateCal.getBoundingClientRect();
  const margin = 8;
  let left = r.left + r.width / 2 - pop.width / 2;
  let top = r.bottom + 6;
  if (left + pop.width > window.innerWidth - margin) left = window.innerWidth - pop.width - margin;
  if (left < margin) left = margin;
  if (top + pop.height > window.innerHeight - margin) top = Math.max(margin, r.top - pop.height - 6);
  _dateCal.style.left = left + 'px';
  _dateCal.style.top = top + 'px';
}
function pickDate(newDate) {
  if (newDate === planDate) return;
  planDate = newDate;
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'plan-date-changed', date: planDate }, '*');
    }
  } catch (_) {}
  render();
}
// 工具:取某便当某位置已排班的人名(可能是 [id...] 或 [[id...]])
// 位置名匹配做归一化 + 别名映射,双向兼容排班表/配置表的不同写法
const POS_ALIAS = {
  // 排班表写法 → 配置表写法
  '蓋1': '盖盖1',
  '蓋2': '盖盖2',
  '取り': '装框'
};
// 反向映射:配置表写法 → 排班表写法
const POS_ALIAS_REV = {};
for (const k in POS_ALIAS) POS_ALIAS_REV[POS_ALIAS[k]] = k;
// 把一个 posLabel 展开成可能的等价 key 集合(原值、trim、数字去零/补零、别名双向映射)
function _posLabelKeys(posLabel) {
  const tries = new Set();
  const orig = String(posLabel);
  tries.add(orig);
  const trimmed = orig.trim();
  tries.add(trimmed);
  if (/^\d+$/.test(trimmed)) {
    const n = parseInt(trimmed, 10);
    tries.add(String(n));                  // 去前导零:"01" → "1"
    tries.add(String(n).padStart(2, '0')); // 补两位:  "1"  → "01"
  }
  if (POS_ALIAS[trimmed]) tries.add(POS_ALIAS[trimmed]);
  if (POS_ALIAS_REV[trimmed]) tries.add(POS_ALIAS_REV[trimmed]);
  return tries;
}

// 在某条线某日的排班里,根据 posLabel 取出已分配的人员 ID 列表
function _personIdsAt(bento, posLabel) {
  if (!bento || !bento.lineId || posLabel == null) return [];
  const dateSched = scheduleData.schedules[planDate];
  if (!dateSched) return [];
  const lineSched = dateSched[bento.lineId];
  if (!lineSched) return [];
  let raw = null;
  for (const key of _posLabelKeys(posLabel)) {
    if (lineSched[key] != null) { raw = lineSched[key]; break; }
  }
  if (!raw) return [];
  const ids = [];
  const visit = v => {
    if (v == null) return;
    if (Array.isArray(v)) v.forEach(visit);
    else ids.push(v);
  };
  visit(raw);
  return ids;
}

// 返回 [{name, borrowed}] —— borrowed=true 时表示该人 homeLine ≠ bento.lineId(借调)
function getPersonInfosForCell(bento, posLabel) {
  return _personIdsAt(bento, posLabel).map(id => {
    const p = scheduleData.people.find(x => x.id === id);
    if (!p) return null;
    return { name: p.name, borrowed: !!(p.homeLine && p.homeLine !== bento.lineId) };
  }).filter(Boolean);
}

// 当日某条线是否有任意岗位被分配过人(用于"全线空班"判定)
function _lineHasAnyAssignment(lineId) {
  if (!lineId) return false;
  const dateSched = scheduleData.schedules && scheduleData.schedules[planDate];
  if (!dateSched) return false;
  const lineSched = dateSched[lineId];
  if (!lineSched) return false;
  for (const key in lineSched) {
    const v = lineSched[key];
    if (Array.isArray(v) ? v.length > 0 : v != null) return true;
  }
  return false;
}

// "応援"位置:卡片标签不在排班表中该线已配置的标准位置列表里
// (例:线 1 标准位是 1~9,卡片标 "10" 即视为支援/借调位)
function isSupportCell(bento, posLabel) {
  if (!bento || !bento.lineId || posLabel == null) return false;
  const positions = scheduleData.positions && scheduleData.positions[bento.lineId];
  if (!Array.isArray(positions) || positions.length === 0) return false;
  const norm = s => String(s).trim();
  const set = new Set();
  positions.forEach(p => {
    const t = norm(p);
    set.add(t);
    if (/^\d+$/.test(t)) {
      const n = parseInt(t, 10);
      set.add(String(n));
      set.add(String(n).padStart(2, '0'));
    }
    if (POS_ALIAS[t]) set.add(POS_ALIAS[t]);
    if (POS_ALIAS_REV[t]) set.add(POS_ALIAS_REV[t]);
  });
  for (const k of _posLabelKeys(posLabel)) {
    if (set.has(k)) return false;
  }
  return true;
}
// === 跨 iframe 桥:把便当库变更广播给父壳(由父壳中转给计划板) ===
function broadcastBentos() {
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: 'bento-changed',
        bentos: Array.isArray(state.bentos) ? state.bentos : []
      }, '*');
    }
  } catch (e) {}
}
window.addEventListener('message', (e) => {
  if (!e.data || typeof e.data !== 'object') return;
  if (e.data.type === 'bento-request') broadcastBentos();
});

let state = loadState();
saveState();

function showBanner(msg, kind) {
  const b = document.getElementById("banner");
  b.textContent = msg;
  b.className = "show " + (kind || "");
}

function randomColor() {
  const hue = Math.floor(Math.random()*360);
  return `hsl(${hue} 70% 65%)`;
}

function addMaterial(name, color) {
  name = (name || "").trim();
  if (!name) return null;
  if (state.materials.some(m => m.name === name)) return null;
  const m = { id: uid("mat"), name, color: color || randomColor() };
  state.materials.push(m);
  saveState();
  return m;
}

function deleteMaterialCascade(id) {
  state.materials = state.materials.filter(m => m.id !== id);
  for (const b of state.bentos) {
    for (const k in b.assignments) {
      b.assignments[k] = b.assignments[k].filter(mid => mid !== id);
    }
  }
  saveState();
}

function updateMaterial(id, patch) {
  const m = state.materials.find(x => x.id === id);
  if (!m) return false;
  if (patch.name !== undefined) {
    const t = patch.name.trim();
    if (!t || state.materials.some(x => x.id !== id && x.name === t)) return false;
    m.name = t;
  }
  if (patch.color !== undefined) m.color = patch.color;
  saveState();
  return true;
}

function countMaterialUsage(matId) {
  let n = 0;
  for (const b of state.bentos) for (const k in b.assignments) if (b.assignments[k].includes(matId)) n++;
  return n;
}

function getBentosUsingMaterial(matId) {
  const result = [];
  for (const b of state.bentos) {
    for (const k in b.assignments) {
      if (b.assignments[k].includes(matId)) {
        result.push({ id: b.id, name: b.name });
        break;
      }
    }
  }
  return result;
}

// 卡片操作函数（接受 line 数组，便于按便当独立操作）
function addSlot(line) {
  const ns = maxSlot(line) + 1;
  line.push({ id: uid("pos"), slot: ns, row: "bottom", label: String(ns) });
  saveState();
}

function deleteSlotPositionFrom(bento, posId) {
  bento.line = bento.line.filter(p => p.id !== posId);
  delete bento.assignments[posId];
  compactSlots(bento.line);
  saveState();
}

// 旧 API（线设置模板编辑用） — 仅操作 state.line
function deleteSlotPosition(posId) {
  state.line = state.line.filter(p => p.id !== posId);
  compactSlots(state.line);
  saveState();
}

function compactSlots(line) {
  if (!line || !line.length) return;
  const used = [...new Set(line.map(p => p.slot))].sort((a,b) => a - b);
  const remap = new Map();
  used.forEach((s, i) => remap.set(s, i + 1));
  for (const p of line) p.slot = remap.get(p.slot);
}

function todayString() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function updateSlotPosition(line, posId, patch) {
  const p = line.find(x => x.id === posId);
  if (!p) return false;
  if (patch.slot !== undefined) {
    const n = parseInt(patch.slot, 10);
    if (!isFinite(n) || n < 1) return false;
    p.slot = n;
  }
  if (patch.row !== undefined) {
    if (patch.row !== "top" && patch.row !== "bottom") return false;
    p.row = patch.row;
  }
  if (patch.label !== undefined) p.label = String(patch.label);
  saveState();
  return true;
}

// 重置模板（state.line）；不影响每个便当已有的 line
function resetLineToSeed() {
  state.line = SEED_LINE.map(p => ({ id: uid("pos"), slot: p.slot, row: p.row, label: p.label }));
  saveState();
}

// 把当前模板复制到所有便当（覆盖各便当的 line，清空 assignments）
function applyTemplateToAll() {
  for (const b of state.bentos) {
    b.line = state.line.map(p => ({ id: uid("pos"), slot: p.slot, row: p.row, label: p.label }));
    b.assignments = {};
  }
  saveState();
}

// 重置单个便当的卡片布局为种子
function resetBentoLine(bento) {
  bento.assignments = {};
  bento.line = SEED_LINE.map(p => ({ id: uid("pos"), slot: p.slot, row: p.row, label: p.label }));
  saveState();
}

function toggleAssignment(bentoId, posId, matId) {
  const b = state.bentos.find(x => x.id === bentoId);
  if (!b) return;
  if (!b.assignments[posId]) b.assignments[posId] = [];
  const arr = b.assignments[posId];
  const i = arr.indexOf(matId);
  if (i >= 0) arr.splice(i, 1); else arr.push(matId);
  if (arr.length === 0) delete b.assignments[posId];
  saveState();
}

function addBento(name) {
  name = (name || "").trim();
  if (!name) return null;
  if (state.bentos.some(b => b.name === name)) return null;
  const b = {
    id: uid("ben"),
    name,
    assignments: {},
    // 新便当：复制当前模板作为初始卡片布局（独立 posId）
    line: state.line.map(p => ({ id: uid("pos"), slot: p.slot, row: p.row, label: p.label }))
  };
  state.bentos.push(b);
  saveState();
  return b;
}

function deleteBento(id) {
  state.bentos = state.bentos.filter(b => b.id !== id);
  if (state.current.bentoId === id) state.current.bentoId = null;
  if (state.current.editingBentoId === id) state.current.editingBentoId = null;
  saveState();
}

function renameBento(id, name) {
  name = (name || "").trim();
  if (!name) return false;
  if (state.bentos.some(b => b.id !== id && b.name === name)) return false;
  const b = state.bentos.find(x => x.id === id);
  if (!b) return false;
  b.name = name;
  saveState();
  return true;
}

function maxSlot(line) {
  return (line || []).reduce((m,p) => p.slot > m ? p.slot : m, 0);
}

function findSlot(line, slot, row) {
  return (line || []).find(p => p.slot === slot && p.row === row);
}

function getBentoByName(name) {
  return state.bentos.find(b => b.name === name);
}

function matchBentos(prefix) {
  const p = (prefix || "").trim().toLowerCase();
  const list = p ? state.bentos.filter(b => b.name.toLowerCase().includes(p)) : state.bentos.slice();
  // 排序:有输入时前缀匹配优先,其次包含位置靠前的优先;同档按中文名升序
  if (p) {
    list.sort((a, b) => {
      const an = a.name.toLowerCase(), bn = b.name.toLowerCase();
      const ai = an.indexOf(p), bi = bn.indexOf(p);
      if (ai !== bi) return ai - bi;
      return a.name.localeCompare(b.name, "zh-Hans-CN");
    });
  } else {
    list.sort((a, b) => a.name.localeCompare(b.name, "zh-Hans-CN"));
  }
  return list;
}

function colorToHex(c) {
  if (!c) return "#888888";
  if (c.startsWith("#")) return c;
  const m = c.match(/hsl\((\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)%\s+(\d+(?:\.\d+)?)%\)/);
  if (!m) return "#888888";
  const h = parseFloat(m[1]) / 360, s = parseFloat(m[2]) / 100, l = parseFloat(m[3]) / 100;
  function f(n) {
    const k = (n + h*12) % 12;
    const a = s * Math.min(l, 1-l);
    const v = l - a * Math.max(-1, Math.min(k-3, 9-k, 1));
    return Math.round(v*255).toString(16).padStart(2,"0");
  }
  return "#" + f(0) + f(8) + f(4);
}

function runSelfTests() {
  const tests = [];
  function assert(name, cond, detail="") { tests.push({ name, ok: !!cond, detail }); }

  // seed produces 14 positions across 8 slots
  const s = defaultState();
  seedLineIfEmpty(s);
  assert("seed produces 14 positions", s.line.length === 14, "got " + s.line.length);
  const slots = new Set(s.line.map(p => p.slot));
  assert("seed spans 8 columns", slots.size === 8 && Math.max(...slots) === 8);
  const find = (slot, row) => s.line.find(p => p.slot === slot && p.row === row);
  assert("col1 top is 2", find(1,"top")?.label === "2");
  assert("col1 bottom is 1", find(1,"bottom")?.label === "1");
  assert("col6 has no bottom", !find(6,"bottom"));
  assert("col7 lid pair", find(7,"top")?.label === "盖盖2" && find(7,"bottom")?.label === "盖盖1");
  assert("col8 bottom only", find(8,"bottom")?.label === "装框" && !find(8,"top"));

  // load/save roundtrip
  const before = JSON.stringify(state);
  saveState();
  const reloaded = loadState();
  assert("save/load roundtrip", JSON.stringify({...reloaded, line: reloaded.line.map(p=>({slot:p.slot,row:p.row,label:p.label}))}) === JSON.stringify({...JSON.parse(before), line: JSON.parse(before).line.map(p=>({slot:p.slot,row:p.row,label:p.label}))}));

  // materials cascade
  const snap = JSON.parse(JSON.stringify(state));
  state = defaultState(); seedLineIfEmpty(state);
  const m1 = addMaterial("鸡腿", "#ff0000");
  assert("addMaterial returns object", !!m1 && m1.name === "鸡腿");
  assert("addMaterial dedup by name", addMaterial("鸡腿") === null);
  state.bentos.push({ id:"b1", name:"x", assignments:{ "p1":[m1.id, "other"] } });
  deleteMaterialCascade(m1.id);
  assert("deleteMaterialCascade removes from pool", !state.materials.some(m => m.id === m1.id));
  assert("deleteMaterialCascade removes from assignments", !state.bentos[0].assignments["p1"].includes(m1.id));
  assert("deleteMaterialCascade keeps others", state.bentos[0].assignments["p1"].includes("other"));
  state = snap; saveState();

  // match + max slot
  const snap2 = JSON.parse(JSON.stringify(state));
  state = defaultState(); seedLineIfEmpty(state);
  assert("maxSlot is 8", maxSlot(state.line) === 8);
  state.bentos.push({ id:"x", name:"鸡腿便当", assignments:{}, line:[] }, { id:"y", name:"牛肉便当", assignments:{}, line:[] });
  assert("matchBentos prefix 鸡", matchBentos("鸡").length === 1);
  assert("matchBentos empty returns all", matchBentos("").length === 2);
  assert("getBentoByName exact", getBentoByName("牛肉便当")?.id === "y");
  state = snap2; saveState();

  // toggleAssignment (使用便当自己的 line)
  const snap3 = JSON.parse(JSON.stringify(state));
  state = defaultState(); seedLineIfEmpty(state);
  const mA = addMaterial("A");
  const bA = addBento("test便当");
  const pos1 = bA.line[0];
  toggleAssignment(bA.id, pos1.id, mA.id);
  assert("toggleAssignment adds", bA.assignments[pos1.id]?.includes(mA.id));
  toggleAssignment(bA.id, pos1.id, mA.id);
  assert("toggleAssignment removes", !bA.assignments[pos1.id] || bA.assignments[pos1.id].length === 0);
  state = snap3; saveState();

  // 每便当独立 line
  const snap4 = JSON.parse(JSON.stringify(state));
  state = defaultState(); seedLineIfEmpty(state);
  const bZ = addBento("z便当");
  assert("new bento has own line copy", Array.isArray(bZ.line) && bZ.line.length === state.line.length);
  assert("bento line ids are independent", bZ.line[0].id !== state.line[0].id);
  addSlot(bZ.line);
  assert("addSlot to bento increases its line", bZ.line.length === SEED_LINE.length + 1);
  assert("addSlot does not affect template", state.line.length === SEED_LINE.length);
  state = snap4; saveState();

  const failed = tests.filter(t => !t.ok);
  if (failed.length) {
    showBanner("自检失败:\n" + failed.map(t => "✗ " + t.name + (t.detail?" — "+t.detail:"")).join("\n"), "err");
  } else {
    showBanner("✓ 自检通过 (" + tests.length + " 项)", "ok");
  }
}

function moveOrSwap(line, posId, targetSlot, targetRow) {
  const pos = line.find(p => p.id === posId);
  if (!pos) return;
  if (pos.slot === targetSlot && pos.row === targetRow) return;
  const occupant = line.find(p => p !== pos && p.slot === targetSlot && p.row === targetRow);
  if (occupant) {
    // swap
    occupant.slot = pos.slot;
    occupant.row = pos.row;
  }
  pos.slot = targetSlot;
  pos.row = targetRow;
  compactSlots(line);
  saveState();
}

function moveLinePosition(line, posId, targetCol, targetRow) {
  const pos = line.find(p => p.id === posId);
  if (!pos) return;
  pos.slot = -1; // detach
  for (const p of line) {
    if (p === pos) continue;
    if (p.slot >= targetCol) p.slot += 1;
  }
  pos.slot = targetCol;
  if (targetRow) pos.row = targetRow;
  // compact
  const used = [...new Set(line.map(p => p.slot))].sort((a,b) => a - b);
  const remap = new Map();
  used.forEach((s, i) => remap.set(s, i + 1));
  for (const p of line) p.slot = remap.get(p.slot);
  saveState();
}

function flipAnimate(oldRects) {
  const wrap = document.querySelector(".line-wrap");
  if (!wrap) return;
  for (const cell of wrap.querySelectorAll(".cell[data-pos-id]")) {
    const r0 = oldRects.get(cell.dataset.posId);
    if (!r0) continue;
    const r1 = cell.getBoundingClientRect();
    const dx = r0.left - r1.left, dy = r0.top - r1.top;
    if (dx === 0 && dy === 0) continue;
    cell.style.transition = "none";
    cell.style.transform = `translate(${dx}px, ${dy}px)`;
    cell.offsetHeight; // force reflow
    requestAnimationFrame(() => {
      cell.style.transition = "transform .28s cubic-bezier(.2,.7,.3,1)";
      cell.style.transform = "";
    });
  }
}

function setupOperateDrag(wrap, bento) {
  for (const cell of wrap.querySelectorAll(".cell[data-pos-id]")) {
    cell.addEventListener("pointerdown", e => startCellPress(e, cell, wrap, bento));
  }
}

function setupOperateDragVertical(wrap, bento) {
  for (const cell of wrap.querySelectorAll(".cell[data-pos-id]")) {
    cell.addEventListener("pointerdown", e => startCellPressVertical(e, cell, wrap, bento));
  }
}

function startCellPressVertical(e, cell, wrap, bento) {
  if (e.button !== undefined && e.button !== 0) return;
  const posId = cell.dataset.posId;
  const origin = cell.getBoundingClientRect();
  const startX = e.clientX, startY = e.clientY;
  let dragging = false, ghost = null, indicator = null, drop = null, highlightedCell = null;
  const blockTouch = ev => { if (dragging) ev.preventDefault(); };
  document.addEventListener("touchmove", blockTouch, { passive: false });

  const timer = setTimeout(() => {
    dragging = true;
    cell.classList.add("dragging");
    ghost = cell.cloneNode(true);
    ghost.classList.remove("dragging");
    ghost.className = "drag-ghost";
    ghost.style.width = origin.width + "px";
    ghost.style.height = origin.height + "px";
    ghost.style.left = (e.clientX - origin.width/2) + "px";
    ghost.style.top = (e.clientY - origin.height/2) + "px";
    document.body.appendChild(ghost);
    indicator = document.createElement("div");
    indicator.className = "drop-indicator";
    document.body.appendChild(indicator);
    try { cell.setPointerCapture(e.pointerId); } catch(_) {}
  }, 350);

  function onMove(ev) {
    if (!dragging) {
      if (Math.hypot(ev.clientX - startX, ev.clientY - startY) > 8) clearTimeout(timer);
      return;
    }
    ev.preventDefault();
    ghost.style.left = (ev.clientX - origin.width/2) + "px";
    ghost.style.top = (ev.clientY - origin.height/2) + "px";

    // Suppress indicator when finger is still inside the dragged cell's original rect
    if (ev.clientX >= origin.left && ev.clientX <= origin.right &&
        ev.clientY >= origin.top && ev.clientY <= origin.bottom) {
      if (highlightedCell) { highlightedCell.classList.remove("drop-target"); highlightedCell = null; }
      indicator.style.display = "none";
      drop = null;
      return;
    }

    const allCells = [...wrap.querySelectorAll(".cell[data-slot]")].filter(c => c !== cell);
    let hitCell = null;
    for (const c of allCells) {
      const r = c.getBoundingClientRect();
      if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) {
        hitCell = c; break;
      }
    }
    if (highlightedCell && highlightedCell !== hitCell) {
      highlightedCell.classList.remove("drop-target"); highlightedCell = null;
    }
    if (hitCell) {
      drop = { mode:"cell", slot: parseInt(hitCell.dataset.slot,10), row: hitCell.dataset.row };
      hitCell.classList.add("drop-target");
      highlightedCell = hitCell;
      indicator.style.display = "none";
    } else {
      indicator.style.display = "";
      // Use .vrow rects directly for slot bounds (each vrow is one slot)
      const vrows = [...wrap.querySelectorAll(".vrow")];
      const slots = [];
      for (const v of vrows) {
        const c = v.querySelector("[data-slot]");
        if (!c) continue;
        const s = parseInt(c.dataset.slot, 10);
        const r = v.getBoundingClientRect();
        slots.push([s, { top: r.top, bottom: r.bottom }]);
      }
      slots.sort((a,b) => a[0] - b[0]);
      const wrapRect = wrap.getBoundingClientRect();
      let targetCol, indicatorY;
      if (slots.length === 0) {
        targetCol = 1; indicatorY = wrapRect.top;
      } else {
        let placed = false;
        for (let i = 0; i < slots.length; i++) {
          const [s, ext] = slots[i];
          const mid = (ext.top + ext.bottom) / 2;
          if (ev.clientY < mid) { targetCol = s; indicatorY = ext.top - 4; placed = true; break; }
        }
        if (!placed) {
          const [lastS, lastExt] = slots[slots.length - 1];
          targetCol = lastS + 1; indicatorY = lastExt.bottom + 2;
        }
      }
      const wrapMidX = wrapRect.left + wrapRect.width / 2;
      const row = ev.clientX < wrapMidX ? "bottom" : "top";
      drop = { mode:"insert", slot:targetCol, row };
      indicator.style.left = wrapRect.left + "px";
      indicator.style.top = indicatorY + "px";
      indicator.style.width = wrapRect.width + "px";
      indicator.style.height = "4px";
    }
  }

  function cleanup() {
    clearTimeout(timer);
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    document.removeEventListener("touchmove", blockTouch, { passive: false });
    if (ghost) ghost.remove();
    if (indicator) indicator.remove();
    if (highlightedCell) highlightedCell.classList.remove("drop-target");
    cell.classList.remove("dragging");
  }

  function onUp() {
    if (!dragging) { cleanup(); return; }
    const d = drop;
    cleanup();
    if (d) {
      if (bento && bento.line) {
        if (d.mode === "cell") moveOrSwap(bento.line, posId, d.slot, d.row);
        else moveLinePosition(bento.line, posId, d.slot, d.row);
      }
      render();
    }
  }
  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onUp);
}

function startCellPress(e, cell, wrap, bento) {
  if (e.button !== undefined && e.button !== 0) return;
  const posId = cell.dataset.posId;
  const origin = cell.getBoundingClientRect();
  const startX = e.clientX, startY = e.clientY;
  let dragging = false;
  let ghost = null, indicator = null;
  let drop = null; // { mode:"cell"|"insert", slot, row } or null
  let highlightedCell = null;
  const blockTouch = ev => { if (dragging) ev.preventDefault(); };
  document.addEventListener("touchmove", blockTouch, { passive: false });

  const timer = setTimeout(() => {
    dragging = true;
    cell.classList.add("dragging");
    ghost = cell.cloneNode(true);
    ghost.classList.remove("dragging");
    ghost.className = "drag-ghost";
    ghost.style.width = origin.width + "px";
    ghost.style.height = origin.height + "px";
    ghost.style.left = (e.clientX - origin.width/2) + "px";
    ghost.style.top = (e.clientY - origin.height/2) + "px";
    document.body.appendChild(ghost);

    indicator = document.createElement("div");
    indicator.className = "drop-indicator";
    document.body.appendChild(indicator);

    try { cell.setPointerCapture(e.pointerId); } catch(_) {}
  }, 350);

  function onMove(ev) {
    if (!dragging) {
      if (Math.hypot(ev.clientX - startX, ev.clientY - startY) > 8) clearTimeout(timer);
      return;
    }
    ev.preventDefault();
    ghost.style.left = (ev.clientX - origin.width/2) + "px";
    ghost.style.top = (ev.clientY - origin.height/2) + "px";

    // Hit-test: is pointer inside any cell (occupied or empty) besides dragged?
    const allCells = [...wrap.querySelectorAll(".cell[data-slot]")].filter(c => c !== cell);
    let hitCell = null;
    for (const c of allCells) {
      const r = c.getBoundingClientRect();
      if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) {
        hitCell = c; break;
      }
    }

    // Clear previous highlight
    if (highlightedCell && highlightedCell !== hitCell) {
      highlightedCell.classList.remove("drop-target");
      highlightedCell = null;
    }

    if (hitCell) {
      // Cell mode: swap with / move into this cell
      drop = { mode: "cell", slot: parseInt(hitCell.dataset.slot, 10), row: hitCell.dataset.row };
      hitCell.classList.add("drop-target");
      highlightedCell = hitCell;
      indicator.style.display = "none";
    } else {
      // Insert mode: find nearest column gap
      indicator.style.display = "";
      const bounds = new Map();
      for (const c of allCells) {
        const s = parseInt(c.dataset.slot, 10);
        const r = c.getBoundingClientRect();
        if (!bounds.has(s)) bounds.set(s, { left: r.left, right: r.right });
        else {
          const v = bounds.get(s);
          v.left = Math.min(v.left, r.left); v.right = Math.max(v.right, r.right);
        }
      }
      const slots = [...bounds.entries()].sort((a,b) => a[0] - b[0]);
      const wrapRect = wrap.getBoundingClientRect();
      let targetCol, indicatorX;
      if (slots.length === 0) {
        targetCol = 1; indicatorX = wrapRect.left;
      } else {
        let placed = false;
        for (let i = 0; i < slots.length; i++) {
          const [s, ext] = slots[i];
          const mid = (ext.left + ext.right) / 2;
          if (ev.clientX < mid) { targetCol = s; indicatorX = ext.left - 6; placed = true; break; }
        }
        if (!placed) {
          const [lastS, lastExt] = slots[slots.length - 1];
          targetCol = lastS + 1; indicatorX = lastExt.right + 2;
        }
      }
      // Row by pointer Y relative to belt midline
      const beltMid = wrapRect.top + wrapRect.height / 2;
      const row = ev.clientY < beltMid ? "top" : "bottom";
      drop = { mode: "insert", slot: targetCol, row };
      indicator.style.left = indicatorX + "px";
      indicator.style.top = wrapRect.top + "px";
      indicator.style.height = wrapRect.height + "px";
    }
  }

  function cleanup() {
    clearTimeout(timer);
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    document.removeEventListener("touchmove", blockTouch, { passive: false });
    if (ghost) ghost.remove();
    if (indicator) indicator.remove();
    if (highlightedCell) highlightedCell.classList.remove("drop-target");
    cell.classList.remove("dragging");
  }

  function onUp() {
    if (!dragging) { cleanup(); return; }
    const d = drop;
    if (d) {
      const oldRects = new Map();
      for (const c of wrap.querySelectorAll(".cell[data-pos-id]")) {
        oldRects.set(c.dataset.posId, c.getBoundingClientRect());
      }
      cleanup();
      if (bento && bento.line) {
        if (d.mode === "cell") moveOrSwap(bento.line, posId, d.slot, d.row);
        else moveLinePosition(bento.line, posId, d.slot, d.row);
      }
      render();
      flipAnimate(oldRects);
    } else {
      cleanup();
    }
  }

  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onUp);
}

  // _skipFitRaf 留到 afterprint 再清,防止任何 stale rAF 在截屏前夕覆盖我们的同步 fit

function renderLineGridVertical(line, cellRenderer) {
  const wrap = document.createElement("div"); wrap.className = "line-wrap";
  const grid = document.createElement("div"); grid.className = "line-grid vertical";
  const N = Math.max(maxSlot(line), 1);
  for (let s = 1; s <= N; s++) {
    const vrow = document.createElement("div"); vrow.className = "vrow";
    vrow.appendChild(cellRenderer(findSlot(line, s, "bottom"), s, "bottom"));
    const belt = document.createElement("div"); belt.className = "vbelt";
    vrow.appendChild(belt);
    vrow.appendChild(cellRenderer(findSlot(line, s, "top"), s, "top"));
    grid.appendChild(vrow);
  }
  wrap.appendChild(grid);
  return wrap;
}

function buildGrid(line, cellRenderer) {
  return isVerticalLayout() ? renderLineGridVertical(line, cellRenderer) : renderLineGrid(line, cellRenderer);
}

let _skipFitRaf = false;
function fitAllCells(root, opts) {
  const sync = opts && opts.sync;
  const minSize = (opts && typeof opts.minSize === "number") ? opts.minSize : 7;
  const work = () => {
    if (!sync && _skipFitRaf) return;
    for (const mats of root.querySelectorAll(".cell .mats")) {
      const items = [...mats.children];
      if (!items.length) continue;
      for (const el of items) el.style.fontSize = "";
      let size = parseFloat(getComputedStyle(items[0]).fontSize);
      let guard = 30;
      while (guard-- > 0 && size > minSize && (mats.scrollHeight > mats.clientHeight + 1 || items.some(el => el.scrollWidth > el.clientWidth + 1))) {
        size -= 1;
        for (const el of items) el.style.fontSize = size + "px";
      }
    }
  };
  if (sync) work(); else requestAnimationFrame(work);
}

function renderLineGrid(line, cellRenderer) {
  const wrap = document.createElement("div"); wrap.className = "line-wrap";
  const grid = document.createElement("div"); grid.className = "line-grid";
  const N = Math.max(maxSlot(line), 1);
  const cols = `repeat(${N}, minmax(var(--cell-min, 120px), 1fr))`;

  const top = document.createElement("div"); top.className = "row"; top.style.gridTemplateColumns = cols;
  const bot = document.createElement("div"); bot.className = "row"; bot.style.gridTemplateColumns = cols;
  for (let s = 1; s <= N; s++) {
    top.appendChild(cellRenderer(findSlot(line, s, "top"), s, "top"));
    bot.appendChild(cellRenderer(findSlot(line, s, "bottom"), s, "bottom"));
  }
  grid.appendChild(top);
  const belt = document.createElement("div"); belt.className = "belt";
  grid.appendChild(belt);
  grid.appendChild(bot);
  wrap.appendChild(grid);
  return wrap;
}

      wrap.appendChild(it);
    }
  }
  c.appendChild(wrap);
}

function render() {
  // 每渲染前压实当前操作便当 + 模板的 slot 编号
  compactSlots(state.line);
  for (const b of state.bentos) compactSlots(b.line);
  for (const b of document.querySelectorAll("header .btn-tab")) {
    b.classList.toggle("active", b.dataset.screen === state.current.screen);
  }
  if (state.current.screen === "operate") renderOperate();
  else if (state.current.screen === "bentos") renderBentos();
  else if (state.current.screen === "edit") renderEdit();
  else if (state.current.screen === "line") renderLine();
}

function setupAutocomplete() {
  const inp = document.getElementById("bento-search");
  let acEl = null;
  let selIdx = -1;
  let opts = [];

  function close() { if (acEl) { acEl.remove(); acEl = null; selIdx = -1; } }
  function refresh() {
    if (!acEl) return;
    [...acEl.children].forEach((el,i) => el.classList.toggle("sel", i === selIdx));
  }
  function update() {
    close();
    opts = matchBentos(inp.value);
    if (opts.length === 0) return;
    acEl = document.createElement("div"); acEl.className = "autocomplete";
    const r = inp.getBoundingClientRect();
    acEl.style.left = r.left + "px"; acEl.style.top = (r.bottom + 4) + "px";
    for (let i = 0; i < opts.length; i++) {
      const o = opts[i];
      const el = document.createElement("div"); el.className = "opt"; el.textContent = o.name;
      el.onmousedown = (e) => { e.preventDefault(); pick(o); };
      acEl.appendChild(el);
    }
    document.body.appendChild(acEl);
  }
  function pick(b) {
    inp.value = b.name;
    state.current = { ...state.current, screen: "operate", bentoId: b.id };
    saveState(); close(); render();
  }
  inp.addEventListener("focus", update);
  inp.addEventListener("input", update);
  inp.addEventListener("blur", () => setTimeout(close, 100));
  inp.addEventListener("keydown", (e) => {
    if (!acEl) return;
    if (e.key === "ArrowDown") { selIdx = Math.min(selIdx+1, opts.length-1); refresh(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { selIdx = Math.max(selIdx-1, 0); refresh(); e.preventDefault(); }
    else if (e.key === "Enter") {
      if (selIdx >= 0) pick(opts[selIdx]);
      else if (opts.length === 1) pick(opts[0]);
      e.preventDefault();
    } else if (e.key === "Escape") close();
  });
}

for (const b of document.querySelectorAll("header .btn-tab")) {
  b.onclick = () => { state.current = { ...state.current, screen: b.dataset.screen }; saveState(); render(); };
}
setupAutocomplete();

document.addEventListener("wheel", (e) => {
  const wrap = e.target.closest(".line-wrap");
  if (!wrap) return;
  if (wrap.scrollWidth <= wrap.clientWidth) return;
  const delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if (delta === 0) return;
  wrap.scrollLeft += delta;
  e.preventDefault();
}, { passive: false });

window.matchMedia("(orientation:portrait)").addEventListener("change", () => render());
let _resizeT;
window.addEventListener("resize", () => { clearTimeout(_resizeT); _resizeT = setTimeout(() => render(), 200); });

function saveJSON() {
  saveState();
  const d = new Date();
  const ds = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  const modal = document.getElementById("save-modal");
  const input = document.getElementById("save-name");
  input.value = "配置表" + ds + ".json";
  modal.classList.add("show");
  setTimeout(() => { input.focus(); input.select(); }, 0);

  function close() {
    modal.classList.remove("show");
    document.getElementById("save-ok").onclick = null;
    document.getElementById("save-cancel").onclick = null;
    input.onkeydown = null;
  }
  function doSave() {
    let name = input.value.trim();
    if (!name) return;
    if (!/\.json$/i.test(name)) name += ".json";
    const payload = {
      version: state.version,
      materials: state.materials,
      line: state.line,
      bentos: state.bentos,
      meta: state.meta,
      _migrations: state._migrations
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
    const a = document.createElement("a");
    a.download = name;
    a.href = URL.createObjectURL(blob);
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    close();
    showBanner(`✓ 已保存 ${state.bentos.length} 个便当 / ${state.materials.length} 个材料 / ${state.line.length} 个位置`, "ok");
  }
  document.getElementById("save-ok").onclick = doSave;
  document.getElementById("save-cancel").onclick = close;
  input.onkeydown = (e) => {
    if (e.key === "Enter") { e.preventDefault(); doSave(); }
    else if (e.key === "Escape") close();
  };
}

function loadHtml2Canvas() {
  if (window.html2canvas) return Promise.resolve(window.html2canvas);
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
    s.onload = () => resolve(window.html2canvas);
    s.onerror = () => reject(new Error("无法加载 html2canvas (检查网络)"));
    document.head.appendChild(s);
  });
}

async function exportImage() {
  const bento = state.current.bentoId ? state.bentos.find(b => b.id === state.current.bentoId) : null;
  const target = document.getElementById("content");
  if (!target) return;
  try {
    const h2c = await loadHtml2Canvas();
    const dpr = Math.max(window.devicePixelRatio || 1, 2);
    const canvas = await h2c(target, {
      backgroundColor: getComputedStyle(document.body).backgroundColor || "#0f1115",
      scale: dpr,
      useCORS: true,
      windowWidth: target.scrollWidth,
      windowHeight: target.scrollHeight
    });
    canvas.toBlob(blob => {
      const a = document.createElement("a");
      a.download = (bento ? bento.name : "配置") + ".png";
      a.href = URL.createObjectURL(blob);
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
  } catch (e) {
    alert("导出图片失败: " + e.message);
  }
}

function importJSON() {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "application/json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (data.version !== 1) throw new Error("版本不匹配");
        if (!Array.isArray(data.materials) || !Array.isArray(data.line) || !Array.isArray(data.bentos)) throw new Error("数据结构错误");
        if (!confirm("将覆盖当前所有数据,继续?")) return;
        state = data;
        if (!state.current) state.current = { screen:"operate", bentoId:null, editingBentoId:null };
        seedLineIfEmpty(state);
        migrate(state);
        saveState();
        render();
      } catch (e) { alert("导入失败: " + e.message); }
    };
    r.readAsText(f);
  };
  inp.click();
}
const exportMenu = document.getElementById("export-menu");
document.getElementById("btn-export").onclick = (e) => {
  e.stopPropagation();
  exportMenu.classList.toggle("show");
};
exportMenu.onclick = (e) => {
  const act = e.target.dataset.act;
  if (!act) return;
  exportMenu.classList.remove("show");
  if (act === "print") window.print();
  else if (act === "image") exportImage();
};
document.addEventListener("click", (e) => {
  if (!e.target.closest(".menu-wrap")) exportMenu.classList.remove("show");
});

function init() {
  if (!state.current.bentoId && state.bentos.length > 0) {
    state.current.bentoId = state.bentos[0].id;
    saveState();
  }
  if (state.mono) document.body.classList.add("mono");
  render();
  if (new URLSearchParams(location.search).get("test") === "1") runSelfTests();
  // 配置表加载后立即广播一次便当库,让计划板可同步
  broadcastBentos();
}
init();
<\/script>

<script>
const btns = document.querySelectorAll('.tabs button[data-app]');
const frames = document.querySelectorAll('iframe');
const loaded = new Set();

// === 统一导入导出:覆盖三个 app 全部 localStorage 数据 ===
const BUNDLE_KEYS_EXACT = [
  'shift-schedule-data-v1',     // 排班表
  'productLibrary_v3',          // 计划板 品名库
  'productionBoardCurrentDate', // 计划板 当前日期
  'productionBoard_v1',         // 计划板 legacy 单日
  'bento-conveyor-v1',          // 配置表
];
const BUNDLE_KEY_PREFIXES = ['productionBoard_v1_']; // 计划板 每日存档
const STORAGE_LAST_EXPORT_AT = 'production-management-last-export-at';
const EXPORT_KEEP_DAYS = 30;
const EXPORT_REMIND_DAYS = 25;

function isoDateNDaysAgo(n) {
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - n);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function collectBundleEntries() {
  const out = {};
  const cutoff = isoDateNDaysAgo(EXPORT_KEEP_DAYS); // YYYY-MM-DD 字典序可直接比较
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k) continue;
    // 排班表:parse 后只保留近 30 天的 schedules
    if (k === 'shift-schedule-data-v1') {
      try {
        const obj = JSON.parse(localStorage.getItem(k) || 'null');
        if (obj && obj.schedules && typeof obj.schedules === 'object') {
          const filtered = {};
          for (const date in obj.schedules) {
            if (date >= cutoff) filtered[date] = obj.schedules[date];
          }
          obj.schedules = filtered;
        }
        out[k] = JSON.stringify(obj);
      } catch (_) {
        out[k] = localStorage.getItem(k);
      }
      continue;
    }
    // 计划板每日存档:key 末尾 YYYY-MM-DD,旧于截止日直接丢
    if (k.startsWith('productionBoard_v1_')) {
      const date = k.slice('productionBoard_v1_'.length);
      if (date >= cutoff) out[k] = localStorage.getItem(k);
      continue;
    }
    // 其他全局 key:整包含
    if (BUNDLE_KEYS_EXACT.includes(k)) {
      out[k] = localStorage.getItem(k);
    }
  }
  return out;
}

function checkExportReminder() {
  let last;
  try { last = localStorage.getItem(STORAGE_LAST_EXPORT_AT); } catch (_) { return; }
  if (!last) return; // 还从没导出过,不打扰
  const lastTs = Date.parse(last);
  if (isNaN(lastTs)) return;
  const daysSince = Math.floor((Date.now() - lastTs) / (1000 * 60 * 60 * 24));
  if (daysSince < EXPORT_REMIND_DAYS) return;
  if (document.getElementById('export-reminder')) return;
  const b = document.createElement('div');
  b.id = 'export-reminder';
  b.innerHTML = `⚠ 距离上次导出已 <b>&nbsp;${daysSince} 天</b>&nbsp;,建议尽快备份 <button id="reminderExport">立即导出</button><button class="close" id="reminderClose" title="关闭">×</button>`;
  document.body.appendChild(b);
  b.querySelector('#reminderExport').onclick = () => { b.remove(); exportAll(); };
  b.querySelector('#reminderClose').onclick = () => b.remove();
}

function exportAll() {
  const entries = collectBundleEntries();
  if (Object.keys(entries).length === 0) {
    alert('当前没有可导出的数据');
    return;
  }
  const bundle = {
    version: 1,
    type: 'production-management-bundle',
    exportedAt: new Date().toISOString(),
    entries
  };
  const yymmdd = d => String(d.getFullYear() % 100).padStart(2,'0') + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0); // 下月 0 号 = 本月最后一天
  const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `生产管理${yymmdd(monthStart)}-${yymmdd(monthEnd)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  // 记录本次导出时间;关闭横幅(如果有)
  try { localStorage.setItem(STORAGE_LAST_EXPORT_AT, new Date().toISOString()); } catch (_) {}
  const b = document.getElementById('export-reminder');
  if (b) b.remove();
}

function importAll() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'application/json,.json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let bundle;
      try { bundle = JSON.parse(r.result); }
      catch (e) { alert('文件不是有效 JSON: ' + e.message); return; }
      if (!bundle || bundle.type !== 'production-management-bundle' || !bundle.entries) {
        alert('不是「生产管理」统一导出文件(type 或 entries 字段不符)');
        return;
      }
      const keyCount = Object.keys(bundle.entries).length;
      if (!confirm(`将覆盖当前所有数据(${keyCount} 项),继续?\n建议先点「导出」备份当前数据。`)) return;
      // 1) 先关掉各 iframe 的自动保存 + storage 事件回写,防止它们在导入写盘期间用旧内存数据覆盖刚写入的 key
      frames.forEach(f => {
        try { if (f.contentWindow) f.contentWindow.skipAutoSave = true; } catch (_) {}
      });
      // 2) 清除现有相关 key
      const toRemove = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k) continue;
        if (BUNDLE_KEYS_EXACT.includes(k) || BUNDLE_KEY_PREFIXES.some(p => k.startsWith(p))) toRemove.push(k);
      }
      toRemove.forEach(k => localStorage.removeItem(k));
      // 3) 写入新数据
      for (const k in bundle.entries) {
        try { localStorage.setItem(k, bundle.entries[k]); } catch (e) { console.warn('write fail', k, e); }
      }
      // 4) 重载所有 iframe,让它们从最新 localStorage 重新 init
      loaded.clear();
      frames.forEach(f => {
        const app = f.dataset.app;
        if (app) f.srcdoc = getHtml(app);
        loaded.add(app);
      });
      alert(`✓ 已导入 ${keyCount} 项数据,所有 app 已重新加载。`);
    };
    r.readAsText(f);
  };
  inp.click();
}
// === 跨 iframe 数据桥:中转便当/排班/日期变更与请求,缓存最新快照 ===
const snapshots = { 'bento-changed': null, 'schedule-changed': null, 'plan-date-changed': null };
const requestToChange = {
  'bento-request': 'bento-changed',
  'schedule-request': 'schedule-changed',
  'plan-date-request': 'plan-date-changed'
};
window.addEventListener('message', (e) => {
  if (!e.data || typeof e.data !== 'object') return;
  const t = e.data.type;
  if (t === 'bento-changed' || t === 'schedule-changed' || t === 'plan-date-changed') {
    snapshots[t] = e.data;
    frames.forEach(f => {
      if (f.contentWindow && f.contentWindow !== e.source) {
        try { f.contentWindow.postMessage(e.data, '*'); } catch (_) {}
      }
    });
  } else if (t in requestToChange) {
    const snap = snapshots[requestToChange[t]];
    if (snap && e.source) {
      try { e.source.postMessage(snap, '*'); } catch (_) {}
    }
    frames.forEach(f => {
      if (f.contentWindow && f.contentWindow !== e.source) {
        try { f.contentWindow.postMessage(e.data, '*'); } catch (_) {}
      }
    });
  }
});
function getHtml(app){
  return document.getElementById('data-'+app).textContent.replaceAll('<\\/script', '</script');
}
function ensureLoaded(app){
  if(loaded.has(app)) return;
  const frame = document.querySelector('iframe[data-app="'+app+'"]');
  frame.srcdoc = getHtml(app);
  loaded.add(app);
}
function activate(app, instant){
  ensureLoaded(app);
  const targetIdx = APP_ORDER.indexOf(app);
  if (targetIdx === -1) return;
  btns.forEach(b => b.classList.toggle('active', b.dataset.app === app));
  frames.forEach(f => {
    const idx = APP_ORDER.indexOf(f.dataset.app);
    if (idx === -1) return;
    // 当前 = translateX(0),左侧 app = -100%,右侧 app = +100%
    if (instant) { f.style.transition = 'none'; void f.offsetHeight; }
    f.style.transform = `translateX(${(idx - targetIdx) * 100}%)`;
    f.classList.toggle('active', idx === targetIdx);
    if (instant) {
      void f.offsetHeight;
      requestAnimationFrame(() => { f.style.transition = ''; });
    }
  });
  if(location.hash !== '#'+app) location.hash = app;
  try{ localStorage.setItem('workbench-last-app', app); }catch(_){}
}
btns.forEach(b => b.addEventListener('click', () => activate(b.dataset.app)));
document.getElementById('exportAllBtn').addEventListener('click', exportAll);
document.getElementById('importAllBtn').addEventListener('click', importAll);

// === 手机端左右滑屏切换 app ===
const APP_ORDER = ['plan', 'config', 'schedule'];
function switchAppByDirection(dir) {
  const cur = (location.hash.slice(1)) || APP_ORDER[0];
  const i = APP_ORDER.indexOf(cur);
  if (i === -1) return;
  const next = dir === 'left' ? i + 1 : i - 1;
  if (next < 0 || next >= APP_ORDER.length) return;
  activate(APP_ORDER[next]);
}
function attachSwipe(doc) {
  if (!doc || doc.__swipeAttached) return;
  doc.__swipeAttached = true;
  let sx = null, sy = 0, st = 0;
  doc.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { sx = null; return; }
    const t = e.target;
    // 在交互元素或显式标 data-no-swipe 的容器内不触发,避免和按钮/输入冲突
    if (t.matches && t.matches('input,select,textarea,button,a,label')) { sx = null; return; }
    if (t.closest && t.closest('[data-no-swipe]')) { sx = null; return; }
    sx = e.touches[0].clientX;
    sy = e.touches[0].clientY;
    st = Date.now();
  }, { passive: true });
  doc.addEventListener('touchend', (e) => {
    if (sx == null) return;
    const tc = e.changedTouches[0];
    const dx = tc.clientX - sx;
    const dy = tc.clientY - sy;
    const dt = Date.now() - st;
    sx = null;
    // 阈值:水平 > 80px,水平远大于垂直,时长 < 500ms(一个"挥手")
    if (Math.abs(dx) > 80 && Math.abs(dx) > 2 * Math.abs(dy) && dt < 500) {
      switchAppByDirection(dx > 0 ? 'right' : 'left');
    }
  }, { passive: true });
}
// 父壳自身也挂一份(切到边界露出空白区时也能滑)
attachSwipe(document);
// 每个 iframe 加载完成后给它的 document 挂监听;重载(导入时)会重置 __swipeAttached
frames.forEach(f => {
  f.addEventListener('load', () => {
    try { attachSwipe(f.contentDocument); } catch (_) {}
  });
});
window.addEventListener('hashchange', () => {
  const app = location.hash.slice(1);
  if(['schedule','plan','config'].includes(app)) activate(app);
});
(function init(){
  // 决定首屏激活的 Tab
  let firstApp = 'plan';
  const fromHash = location.hash.slice(1);
  if(['schedule','plan','config'].includes(fromHash)) firstApp = fromHash;
  else {
    try{
      const last = localStorage.getItem('workbench-last-app');
      if(['schedule','plan','config'].includes(last)) firstApp = last;
    }catch(_){}
  }
  activate(firstApp, true); // 首次定位无动画
  // 预加载其余 iframe(隐藏运行,后台广播数据让跨 app 同步生效)
  setTimeout(() => {
    ['plan','config','schedule'].forEach(app => { if(!loaded.has(app)) ensureLoaded(app); });
  }, 50);
  // 检查导出提醒
  setTimeout(checkExportReminder, 600);
})();
