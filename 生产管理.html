<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>生产管理</title>
<style>
:root{--accent:#fb923c;--accent-rgb:251,146,60;--accent-dark:color-mix(in srgb,var(--accent),#000 15%);--accent-light:color-mix(in srgb,var(--accent),#fff 18%)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0b0e;color:#ececf1;font:14px/1.4 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:pan-y pinch-zoom;overscroll-behavior:none}
.tabs{display:flex;height:48px;background:linear-gradient(180deg,#14161d 0%,#0a0b0e 100%);border-bottom:1px solid #1d2029;align-items:center;padding:0 12px;gap:4px;flex-wrap:nowrap;overflow-x:hidden;touch-action:manipulation;backdrop-filter:blur(20px) saturate(160%);-webkit-backdrop-filter:blur(20px) saturate(160%);box-shadow:0 1px 0 rgba(255,255,255,.02) inset,0 4px 16px rgba(0,0,0,.4)}
.tabs button{font:inherit;font-weight:500;color:#9ca0a8;background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 14px;cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);white-space:nowrap;flex:0 0 auto;letter-spacing:.2px}
.tabs button:hover{background:rgba(255,255,255,.05);color:#e8e8e8}
.tabs button.active{background:linear-gradient(180deg,var(--accent) 0%,var(--accent-dark) 100%);color:#14181f;font-weight:600;box-shadow:0 0 0 1px rgba(var(--accent-rgb),.4),0 4px 14px rgba(var(--accent-rgb),.28),0 1px 0 rgba(255,255,255,.18) inset}
.tabs button.active:hover{background:linear-gradient(180deg,var(--accent-light) 0%,var(--accent) 100%);color:#14181f}
.tabs .spacer{flex:1 1 auto}
.tabs .io-btn{border:none;color:#9ca0a8;padding:6px 12px;font-size:13px;display:inline-flex;align-items:center;gap:5px;background:transparent;border-radius:6px;transition:color .18s,background .18s}
.tabs .io-btn:hover{color:var(--accent);background:rgba(var(--accent-rgb),.08)}
/* 主题色选择器 */
.theme-btn{position:relative;width:28px;height:28px;padding:0;border:1px solid rgba(255,255,255,.1);border-radius:50%;background:var(--accent);cursor:pointer;flex:0 0 auto;box-shadow:0 2px 6px rgba(0,0,0,.4),0 0 0 2px rgba(var(--accent-rgb),.18);transition:transform .15s,box-shadow .2s}
.theme-btn:hover{transform:scale(1.08);box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 3px rgba(var(--accent-rgb),.28)}
.theme-pop{position:absolute;top:48px;right:12px;z-index:300;background:linear-gradient(180deg,#1d1d22 0%,#16161a 100%);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px;box-shadow:0 24px 56px rgba(0,0,0,.7);display:none;animation:confirmIn .18s cubic-bezier(.2,.8,.2,1)}
.theme-pop.show{display:block}
.theme-pop .grid{display:grid;grid-template-columns:repeat(6,28px);gap:8px;margin-bottom:10px}
.theme-pop .sw{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;transition:transform .12s,border-color .15s;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.theme-pop .sw:hover{transform:scale(1.12)}
.theme-pop .sw.active{border-color:#fff;transform:scale(1.12)}
.theme-pop .row{display:flex;align-items:center;gap:8px;font-size:12px;color:#9ca0a8}
.theme-pop .row input[type=color]{width:32px;height:24px;padding:0;border:1px solid #2a2d33;border-radius:5px;background:transparent;cursor:pointer}
.theme-pop .row input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.theme-pop .row input[type=color]::-webkit-color-swatch{border:none;border-radius:3px}
.theme-pop .row .reset{margin-left:auto;background:transparent;border:1px solid #2a2d33;color:#9ca0a8;padding:4px 10px;border-radius:5px;font:inherit;font-size:11px;cursor:pointer}
.theme-pop .row .reset:hover{color:#e8e8e8;border-color:#3a3f47}
@media (max-width:600px){.tabs{padding:0 8px;height:44px}.tabs button{padding:6px 10px;font-size:13px}.tabs .io-btn{padding:5px 8px;font-size:12px}}
.frame-wrap{position:fixed;top:44px;left:0;right:0;bottom:0;background:#0f1115;overflow:hidden}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0f1115;transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);pointer-events:none;will-change:transform}
iframe.active{pointer-events:auto}
/* 导出提醒横幅 */
#export-reminder{position:fixed;bottom:16px;right:16px;background:#f59e0b;color:#14181f;padding:10px 14px;border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.5);z-index:200;font-size:13px;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);font-weight:500;animation:reminderIn .25s ease-out}
@keyframes reminderIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
#export-reminder button{background:#14181f;color:#f59e0b;border:none;padding:5px 12px;border-radius:5px;cursor:pointer;font:inherit;font-weight:600}
#export-reminder button:hover{background:#000;color:#fff}
#export-reminder .close{background:transparent;color:#14181f;padding:0 4px;font-size:18px;line-height:1}
#export-reminder .close:hover{background:transparent;color:#000}

/* === 打印时父壳必须白底 ===
   plan/config/schedule 在 iframe 里,window.print() 实际渲染的是父壳。
   父壳本身是深色主题(html / body / .tabs / .frame-wrap / iframe 都是 #0f1115),
   不强制成白底的话手机端打印整张深色,iframe 内部的白色排版反而像被框在黑卡里。
   同时把顶部 tab 栏隐藏,只让 iframe 的内容铺满整页。 */
@media print {
  @page { size: landscape; margin: 6mm; }
  /* iOS Safari iframe 打印不认 mm 单位的 height 和 contain:strict —— 会让 iframe 收缩
     到内容自然高度,纸面下半部分留大片空白。改用百分比让 iframe 一层层撑满父容器,
     最终铺满整张纸,然后 iframe 内部 body.printing 自己负责把内容铺满。 */
  html, body {
    background: #fff !important;
    width: 100% !important;
    height: 100% !important;
    overflow: hidden !important;
    margin: 0 !important; padding: 0 !important;
  }
  .tabs { display: none !important; }
  .frame-wrap {
    position: static !important; top: auto !important; background: #fff !important;
    width: 100% !important;
    height: 100% !important;
    overflow: hidden !important;
    margin: 0 !important; padding: 0 !important;
  }
  iframe { display: none !important; }
  iframe.active {
    display: block !important;
    position: static !important;
    background: #fff !important;
    transform: none !important;
    width: 100% !important;
    height: 100% !important;
    border: 0 !important;
    overflow: hidden !important;
    break-inside: avoid !important;
    page-break-inside: avoid !important;
  }
  #export-reminder { display: none !important; }
}
/* === 现代化弹层 / Toast(父壳) === */
.confirm-popover{position:fixed;z-index:10000;background:linear-gradient(180deg,#1d1d22 0%,#16161a 100%);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px 16px;box-shadow:0 24px 56px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.03) inset,0 1px 0 rgba(255,255,255,0.06) inset;min-width:220px;max-width:300px;font-size:13px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:confirmIn .2s cubic-bezier(0.2,0.8,0.2,1);font-family:inherit;color:#e8e8e8}
.confirm-popover .confirm-text{font-weight:600;font-size:14px;margin-bottom:4px;line-height:1.4;letter-spacing:.01em}
.confirm-popover .confirm-sub{color:#9ca0a8;font-size:12px;margin-bottom:12px;line-height:1.4}
.confirm-popover .confirm-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.confirm-popover button{font:inherit;padding:7px 14px;font-size:12px;font-weight:500;line-height:1;border-radius:7px;border:1px solid #2a2d33;background:transparent;color:#e8e8e8;cursor:pointer;transition:transform .12s,background .15s,box-shadow .15s;letter-spacing:.01em}
.confirm-popover button:hover{background:#1f1f23}
.confirm-popover button:active{transform:scale(0.97)}
.confirm-popover button.primary{background:var(--accent);border-color:var(--accent);color:#14181f;box-shadow:0 2px 8px rgba(var(--accent-rgb),0.35)}
.confirm-popover button.primary:hover{background:var(--accent-light);box-shadow:0 4px 12px rgba(var(--accent-rgb),0.45)}
.confirm-popover button.danger{background:#ef4444;border-color:#ef4444;color:#fff;box-shadow:0 2px 8px rgba(239,68,68,0.35)}
.confirm-popover button.danger:hover{background:#dc2626;box-shadow:0 4px 12px rgba(239,68,68,0.45)}
@keyframes confirmIn{from{opacity:0;transform:translateY(-6px) scale(.94)}to{opacity:1;transform:translateY(0) scale(1)}}
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:20000;background:linear-gradient(180deg,#1d1d22 0%,#16161a 100%);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:10px 16px;color:#e8e8e8;font:inherit;font-size:13px;font-weight:500;box-shadow:0 12px 32px rgba(0,0,0,0.5);animation:toastIn .25s cubic-bezier(0.2,0.8,0.2,1);display:flex;align-items:center;gap:8px;max-width:90vw}
.toast.success{border-left:3px solid #10b981}
.toast.error{border-left:3px solid #ef4444}
.toast.info{border-left:3px solid var(--accent)}
.toast.hide{animation:toastOut .2s ease-in forwards}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-10px)}}
</style>
</head>
<body>
<div class="tabs">
  <button data-app="plan" class="active">🏭 生产计划板</button>
  <button data-app="config">⚙ 配置表</button>
  <button data-app="schedule">📅 岗位排班表</button>
  <span class="spacer"></span>
  <button class="io-btn" id="importAllBtn" title="导入全部三个 app 的数据(覆盖现有)">导入</button>
  <button class="io-btn" id="exportAllBtn" title="导出全部三个 app 的数据到一个 JSON 文件">导出</button>
  <button class="theme-btn" id="themeBtn" title="主题色" aria-label="切换主题色"></button>
</div>
<div class="theme-pop" id="themePop">
  <div class="grid" id="themeGrid"></div>
  <div class="row">
    <span>自定义</span>
    <input type="color" id="themeCustom" value="#fb923c">
    <button class="reset" id="themeReset" type="button">重置</button>
  </div>
</div>
<div class="frame-wrap">
  <iframe data-app="plan"></iframe>
  <iframe data-app="config"></iframe>
  <iframe data-app="schedule"></iframe>
</div>
<script type="text/html" id="data-schedule"><!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>岗位排班表</title>
<script>
// 主题色监听:父壳广播 theme-changed 时更新 --accent / --accent-rgb
(function(){
  function apply(c, rgb){
    if(c) document.documentElement.style.setProperty('--accent', c);
    if(rgb) document.documentElement.style.setProperty('--accent-rgb', rgb);
  }
  window.addEventListener('message', e => {
    if(!e.data || e.data.type !== 'theme-changed') return;
    apply(e.data.accent, e.data.accentRgb);
  });
  // 加载完成后主动向父壳要一次当前主题(防 iframe 比广播晚到)
  try { window.parent && window.parent.postMessage({type:'theme-request'}, '*'); } catch(_){}
})();
<\/script>
<style>
:root{
  /* 调和「月度工时统计」色板:更深底 + 微蓝紫表面 + 柔边框 */
  --bg:#0a0b0e; --card:#14161d; --border:#262936;
  --text:#ececf1; --muted:#8a8d99;
  --accent:#fb923c; --accent-rgb:251,146,60; --accent-dark:color-mix(in srgb,var(--accent),#000 15%); --accent-light:color-mix(in srgb,var(--accent),#fff 18%); --accent-glow:rgba(var(--accent-rgb),.18); --ok:#10b981; --warn:#f59e0b; --danger:#ef4444;
  --line-xs:#f59e0b; --line-l01:#3b82f6; --line-l02:#06b6d4;
  --line-l03:#10b981; --line-l04:#ec4899; --line-l05:#f97316;
  --line-tsk:#8b5cf6; --line-short:#64748b;
  --r-card:12px; --r-btn:8px;
  --font: -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  --font-mono: ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.022) 1px,transparent 0);background-size:22px 22px;background-attachment:fixed}
button{font:inherit;color:inherit;background:transparent;border:1px solid var(--border);border-radius:var(--r-btn);padding:8px 12px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{background:#1f1f23}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#fa8520}
input,select{font:inherit;color:inherit;background:#1f1f23;border:1px solid var(--border);border-radius:var(--r-btn);padding:8px 10px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.nav{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.nav .brand{font-weight:600;margin-right:auto}
.nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.page{padding:16px;max-width:1400px;margin:0 auto}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:0;margin-bottom:16px;overflow:hidden}
.card-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:2px solid var(--border);font-weight:600}
.card .muted{color:var(--muted);font-weight:400;font-size:13px}
.pos-list{list-style:none;margin:0;padding:8px 16px}
.pos-list li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.pos-list li:last-child{border-bottom:none}
.pos-name{flex:1}
.pos-list button{padding:4px 10px;font-size:12px}
.pos-list button.danger{border-color:var(--danger);color:var(--danger)}
.pos-list button:disabled{opacity:.4;cursor:not-allowed}
.add-pos{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
.add-pos input{flex:1}
.toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.toolbar input[type=search]{flex:1;max-width:320px}
.people-list{list-style:none;margin:0;padding:8px 16px}
.people-list li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.people-list li:last-child{border-bottom:none}
.pname{flex:1}
.people-list select{padding:4px 8px;font-size:12px}
.people-list button{padding:4px 10px;font-size:12px}
.people-list button.danger{border-color:var(--danger);color:var(--danger)}
.people-list button:disabled{opacity:.4;cursor:not-allowed}
.sched-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.sched-bar input[type=date]{font-family:var(--font-mono)}
.sched-bar .danger-btn{border-color:var(--danger);color:var(--danger)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;padding:6px 10px;line-height:1;color:var(--text)}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn svg{display:block}
/* 复制某日 弹窗 (复用 #picker-host 的遮罩样式) */
#copy-day-host{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:101;padding:16px}
#copy-day-host.hidden{display:none}
.copy-modal{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);width:100%;max-width:440px;max-height:80vh;display:flex;flex-direction:column;padding:14px 16px;gap:10px;animation:pickerIn .2s ease}
.copy-modal .head{display:flex;align-items:center;gap:8px}
.copy-modal .head .title{font-weight:600;flex:1;font-size:14px}
.copy-modal .head .close{background:transparent;border:none;color:var(--muted);cursor:pointer;font-size:22px;padding:0 4px;line-height:1}
.copy-modal .head .close:hover{color:var(--text)}
.copy-modal .row{display:flex;gap:8px;align-items:center}
.copy-modal .row input[type=date]{flex:1;font-family:var(--font-mono);background:#1f1f23;border:1px solid var(--border);border-radius:var(--r-btn);color:var(--text);padding:8px 10px}
.copy-modal .row input[type=date]:focus{border-color:var(--accent);outline:none}
.copy-modal .row button{background:var(--accent);border:1px solid var(--accent);color:#fff;padding:8px 16px;border-radius:var(--r-btn);cursor:pointer;font:inherit}
.copy-modal .list-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.copy-modal .list{display:flex;flex-direction:column;gap:6px;overflow:auto;max-height:300px}
.copy-modal .item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#1a1d22;border:1px solid var(--border);border-radius:6px;cursor:pointer;transition:background .12s,border-color .12s}
.copy-modal .item:hover{background:rgba(124,92,255,.12);border-color:var(--accent)}
.copy-modal .item .date{flex:1;font-weight:600;font-variant-numeric:tabular-nums}
.copy-modal .item .dow{color:var(--muted);font-size:11px;min-width:28px}
.copy-modal .item .meta{color:var(--muted);font-size:11px}
.copy-modal .item.today .date{color:var(--accent)}
.copy-modal .empty{color:var(--muted);text-align:center;padding:20px;font-size:13px}
@media (max-width:1023px){
  #copy-day-host{align-items:flex-end}
  .copy-modal{max-width:none;border-radius:var(--r-card) var(--r-card) 0 0}
}
#autosave-status{margin-left:auto;font-size:12px}
.line-tabs{display:none;gap:4px;margin-bottom:12px;overflow-x:auto}
.line-tabs button{flex:0 0 auto;padding:6px 14px;border-color:var(--border)}
.line-tabs button.active{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}
.line-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.line-card{margin-bottom:0}
.assign-list{list-style:none;margin:0;padding:8px 16px 16px}
.assign-list li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.assign-list li:last-child{border-bottom:none}
.assign-list .pos-name{flex:1;color:var(--muted);font-size:13px}
.assign-btn{min-width:120px;text-align:left;font-size:13px;padding:6px 10px}
.assign-btn.empty{border-style:dashed;color:var(--muted)}
.borrowed{color:var(--accent);font-size:11px}

@media (max-width: 1023px){
  .line-tabs{display:flex}
  .line-grid{grid-template-columns:1fr}
  .line-card{display:none}
  .line-card.mobile-active{display:block}
  .assign-btn{min-width:0;flex:0 0 50%;min-height:44px}
  /* 手机端:日期 + 生产线切换栏固定在视口顶部,滑动排班内容时不滚走 */
  .sched-header{
    position:sticky;top:0;z-index:20;
    background:var(--bg);
    margin:-16px -16px 8px;
    padding:12px 16px 6px;
    box-shadow:0 4px 12px rgba(0,0,0,.35);
  }
  .sched-header .sched-bar{margin-bottom:8px}
  .sched-header .line-tabs{margin-bottom:0}
}
@media (min-width: 1600px){
  .line-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
}
#picker-host{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
#picker-host.hidden{display:none}
.picker{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);width:100%;max-width:480px;max-height:80vh;display:flex;flex-direction:column;animation:pickerIn .2s ease}
@keyframes pickerIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.picker .ph-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.picker .ph-head .title{font-weight:600;flex:1}
.picker .ph-body{padding:8px 16px 16px;overflow:auto}
.picker .ph-search{padding:8px 16px;border-bottom:1px solid var(--border)}
.picker .ph-search input{width:100%}
.picker .person-row{display:flex;align-items:center;gap:8px;padding:8px 4px;border-radius:6px;cursor:pointer;min-height:44px}
.picker .person-row:hover{background:#1f1f23}
.picker .person-row.disabled{opacity:.35;cursor:not-allowed;background:transparent}
.picker .person-row .pname{flex:1}

  const todayISO = () => {
    const d = new Date();
    const z = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
  };
  const prevDay = iso => {

    const z = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;

<script>
// === 现代化 popover/toast(替代原生 confirm/alert/prompt) ===
function showConfirmPopover(anchor, opts) {
  document.querySelectorAll('.confirm-popover').forEach(el => el.remove());
  const pop = document.createElement('div');
  pop.className = 'confirm-popover';
  const textEl = document.createElement('div'); textEl.className = 'confirm-text'; textEl.textContent = opts.text || '确认?'; pop.appendChild(textEl);
  if (opts.sub) { const s = document.createElement('div'); s.className = 'confirm-sub'; s.textContent = opts.sub; pop.appendChild(s); }
  let inputEl = null;
  if (opts.input) {
    if (opts.input.options) {
      inputEl = document.createElement('select'); inputEl.className = 'confirm-input';
      for (const o of opts.input.options) {
        const op = document.createElement('option'); op.value = o.value; op.textContent = o.label; inputEl.appendChild(op);
      }
      if (opts.input.value != null) inputEl.value = opts.input.value;
    } else {
      inputEl = document.createElement('input'); inputEl.className = 'confirm-input';
      inputEl.type = opts.input.type || 'text';
      inputEl.value = opts.input.value || '';
      inputEl.placeholder = opts.input.placeholder || '';
    }
    pop.appendChild(inputEl);
  }
  if (opts.extra) {
    const eb = document.createElement('button'); eb.className = 'confirm-extra' + (opts.extra.danger ? ' danger' : '');
    eb.textContent = opts.extra.text;
    eb.onclick = (e) => { e.stopPropagation(); close(); opts.extra.onClick && opts.extra.onClick(); };
    pop.appendChild(eb);
  }
  const actions = document.createElement('div'); actions.className = 'confirm-actions';
  let confirmed = false;
  const doConfirm = () => { const v = inputEl ? inputEl.value : null; confirmed = true; close(); opts.onConfirm && opts.onConfirm(v); };
  const noBtn = document.createElement('button'); noBtn.textContent = opts.cancelText || '取消';
  noBtn.onclick = (e) => { e.stopPropagation(); close(); };
  const yesBtn = document.createElement('button'); yesBtn.className = opts.danger ? 'danger' : 'primary'; yesBtn.textContent = opts.confirmText || '确认';
  yesBtn.onclick = (e) => { e.stopPropagation(); doConfirm(); };
  actions.appendChild(noBtn); actions.appendChild(yesBtn); pop.appendChild(actions);
  if (inputEl) inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); doConfirm(); } });
  document.body.appendChild(pop);
  const pr = pop.getBoundingClientRect(); const m = 8;
  // 没传 anchor 或 anchor 不在视口里 → 居中显示
  const r = anchor && anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : null;
  if (!r || (r.width === 0 && r.height === 0)) {
    pop.style.left = ((window.innerWidth - pr.width) / 2) + 'px';
    pop.style.top  = ((window.innerHeight - pr.height) / 2) + 'px';
  } else {
    let left = r.left - pr.width - m; if (left < m) left = r.right + m;
    if (left + pr.width > window.innerWidth - m) left = Math.max(m, window.innerWidth - pr.width - m);
    let top = r.top + r.height/2 - pr.height/2; if (top < m) top = m;
    if (top + pr.height > window.innerHeight - m) top = window.innerHeight - pr.height - m;
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
  }
  const close = () => {
    pop.remove();
    document.removeEventListener('click', onDoc, true);
    document.removeEventListener('keydown', onKey, true);
    window.removeEventListener('scroll', close, true);
    if (!confirmed && opts.onCancel) opts.onCancel();
  };
  const onDoc = (e) => { if (!pop.contains(e.target)) close(); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  setTimeout(() => {
    document.addEventListener('click', onDoc, true);
    document.addEventListener('keydown', onKey, true);
    window.addEventListener('scroll', close, true);
    if (inputEl) inputEl.focus();
  }, 0);
}
function showToast(msg, type) {
  document.querySelectorAll('.toast').forEach(el => el.remove());
  const t = document.createElement('div'); t.className = 'toast ' + (type || 'info'); t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.classList.add('hide'); setTimeout(() => t.remove(), 250); }, 2500);
}
<\/script>
<script>
const JpHolidays = (() => {
  const pad = n => String(n).padStart(2,'0');
  const iso = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
  const nthMonday = (y, m, n) => {
    const first = new Date(y, m-1, 1);
    const firstMon = ((8 - first.getDay()) % 7) + 1;
    return firstMon + (n-1)*7;
  };
  const vernal = y => Math.floor(20.8431 + 0.242194 * (y - 1980)) - Math.floor((y - 1980) / 4);
  const autumnal = y => Math.floor(23.2488 + 0.242194 * (y - 1980)) - Math.floor((y - 1980) / 4);
  function compute(y){
    const list = [
      [1, 1, '元日'],
      [1, nthMonday(y,1,2), '成人の日'],
      [2, 11, '建国記念の日'],
      [2, 23, '天皇誕生日'],
      [3, vernal(y), '春分の日'],
      [4, 29, '昭和の日'],
      [5, 3, '憲法記念日'],
      [5, 4, 'みどりの日'],
      [5, 5, 'こどもの日'],
      [7, nthMonday(y,7,3), '海の日'],
      [8, 11, '山の日'],
      [9, nthMonday(y,9,3), '敬老の日'],
      [9, autumnal(y), '秋分の日'],
      [10, nthMonday(y,10,2), 'スポーツの日'],
      [11, 3, '文化の日'],
      [11, 23, '勤労感謝の日'],
    ];
    const map = new Map();
    list.forEach(([m,d,name]) => map.set(iso(y,m,d), name));
    // 振替休日: holiday on Sunday → next non-holiday day becomes a substitute
    list.forEach(([m,d]) => {
      const dt = new Date(y, m-1, d);
      if(dt.getDay() === 0){
        do { dt.setDate(dt.getDate()+1); } while(map.has(iso(dt.getFullYear(), dt.getMonth()+1, dt.getDate())));
        map.set(iso(dt.getFullYear(), dt.getMonth()+1, dt.getDate()), '振替休日');
      }
    });
    // 国民の休日: any non-Sunday weekday sandwiched between two holidays
    [...map.keys()].sort().forEach(k => {
      const [yy,mm,dd] = k.split('-').map(Number);
      const between = new Date(yy, mm-1, dd-1);
      const before = new Date(yy, mm-1, dd-2);
      const bIso = iso(before.getFullYear(), before.getMonth()+1, before.getDate());
      const mIso = iso(between.getFullYear(), between.getMonth()+1, between.getDate());
      if(map.has(bIso) && !map.has(mIso) && between.getDay() !== 0){
        map.set(mIso, '国民の休日');
      }
    });
    return map;
  }
  const cache = new Map();
  function forYear(y){ if(!cache.has(y)) cache.set(y, compute(y)); return cache.get(y); }
  function nameOf(isoStr){
    const y = Number(isoStr.slice(0,4));
    return forYear(y).get(isoStr) || null;
  }
  return { forYear, nameOf };
})();

const DEPT_OF = { xs:'A', l01:'A', l02:'B', l03:'B', l04:'B', l05:'B', tsk:'C', short:'short' };
function sameDept(a, b){ return !!a && !!b && DEPT_OF[a] === DEPT_OF[b]; }
const Store = (() => {

    {id:'l03', name:'03'}, {id:'l04', name:'04'}, {id:'l05', name:'05'},
    {id:'tsk', name:'値付け'},
    // virtual: true 的线只在「人员库」里作为 homeLine 选项出现,
    // 不会渲染到排班表的线 tab / 卡片网格、配置表的便当生产线下拉里。
    // 这里挂的人在任何真实线的岗位弹窗里会自动出现在「借调」区。
    {id:'short', name:'短期', virtual:true}
  ];
  function emptyData(){
    const positions = {}; DEFAULT_LINES.forEach(l => positions[l.id]=[]);
    return { version:1, lines:Util.clone(DEFAULT_LINES), positions, people:[], schedules:{}, lastExportAt:null, lastChangeAt:null };
  }
  function sanitize(s){
    const d = emptyData();
    if(!s || typeof s !== 'object') return d;
    s.version = 1;
    s.lines = Array.isArray(s.lines) && s.lines.length ? s.lines : d.lines;
    const _lineIds = new Set(s.lines.map(l => l.id));
    d.lines.forEach(dl => { if(!_lineIds.has(dl.id)) s.lines.push(dl); });
    s.positions = (s.positions && typeof s.positions === 'object') ? s.positions : {};
    s.lines.forEach(l => { if(!Array.isArray(s.positions[l.id])) s.positions[l.id] = []; });
    s.people = Array.isArray(s.people) ? s.people : [];
    s.schedules = (s.schedules && typeof s.schedules === 'object') ? s.schedules : {};
    for(const date in s.schedules){
      for(const ln in s.schedules[date]){
        for(const pos in s.schedules[date][ln]){
          const v = s.schedules[date][ln][pos];
          if(v && !Array.isArray(v)) s.schedules[date][ln][pos] = [v];
          else if(Array.isArray(v) && v.length === 0) s.schedules[date][ln][pos] = null;
        }
      }
    }
    if(s.lastExportAt === undefined) s.lastExportAt = null;
    if(s.lastChangeAt === undefined) s.lastChangeAt = null;
    return s;
  }
  let state = emptyData();
  const listeners = new Set();
  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        state = sanitize(Object.assign(emptyData(), parsed));
      } else {
        state = emptyData();
      }
    }catch(e){ console.warn('load failed', e); state = emptyData(); }
  }
  function save(){
    state.lastChangeAt = new Date().toISOString();
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ console.warn('save failed', e); }
    listeners.forEach(fn => fn());
    broadcastSchedule();
  }
  function broadcastSchedule(){
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'schedule-changed',
          lines: state.lines,
          positions: state.positions,
          people: state.people,
          schedules: state.schedules
        }, '*');
      }
    } catch (e) {}
  }
  window.addEventListener('message', (e) => {
    if (!e.data || typeof e.data !== 'object') return;
    if (e.data.type === 'schedule-request') broadcastSchedule();
  });
  // 加载完后广播一次,让其他 iframe 同步初始数据
  setTimeout(broadcastSchedule, 0);
  function subscribe(fn){ listeners.add(fn); return () => listeners.delete(fn); }
  function get(){ return state; }
  function replace(newState){ state = sanitize(Object.assign(emptyData(), newState)); save(); }
  function reset(){ state = emptyData(); save(); }

  // People
  function addPerson(name, homeLine){
    state.people.push({ id: Util.uid('p'), name: name.trim(), homeLine });
    save();
  }
  function updatePerson(id, patch){
    const p = state.people.find(x=>x.id===id); if(!p) return;
    Object.assign(p, patch); save();
  }
  function deletePerson(id){
    // 软删除:从人员库移除,但保留 state.people 里的记录(打 deleted 标记),
    // 这样历史排班卡片仍能通过 id 查到姓名,不会被抹除。
    const p = state.people.find(x=>x.id===id);
    if(p) p.deleted = true;
    save();
  }
  function findPersonUsage(id){
    let count = 0;
    for(const date in state.schedules){
      for(const ln in state.schedules[date]){
        for(const pos in state.schedules[date][ln]){
          const v = state.schedules[date][ln][pos];
          if(Array.isArray(v) && v.includes(id)) count++;
        }
      }
    }
    return count;
  }

  // Positions
  function addPosition(lineId, name){
    if(!state.positions[lineId]) state.positions[lineId]=[];
    state.positions[lineId].push(name.trim()); save();
  }
  function renamePosition(lineId, idx, newName){
    state.positions[lineId][idx] = newName.trim(); save();
  }
  function deletePosition(lineId, idx){
    state.positions[lineId].splice(idx,1); save();
  }
  function movePosition(lineId, idx, dir){
    const arr = state.positions[lineId]; const j = idx+dir;
    if(j<0 || j>=arr.length) return;
    [arr[idx], arr[j]] = [arr[j], arr[idx]]; save();
  }

  // Schedules
  function realLines(){ return state.lines.filter(l => !l.virtual); }
  function ensureDay(date){
    if(!state.schedules[date]){
      state.schedules[date] = {};
      realLines().forEach(l => state.schedules[date][l.id] = {});
    }
  }
  function getDay(date){
    const day = state.schedules[date];
    const out = {};
    realLines().forEach(l => {
      out[l.id] = {};
      const positions = state.positions[l.id] || [];
      positions.forEach(pos => {
        const v = day && day[l.id] && day[l.id][pos];
        out[l.id][pos] = Array.isArray(v) ? v : (v ? [v] : []);
      });
    });
    return out;
  }
  function assign(date, lineId, posName, personIds){
    ensureDay(date);
    if(!state.schedules[date][lineId]) state.schedules[date][lineId] = {};
    if(personIds == null || (Array.isArray(personIds) && personIds.length === 0)){
      state.schedules[date][lineId][posName] = null;
    } else if(Array.isArray(personIds)){
      state.schedules[date][lineId][posName] = personIds.slice(0, 3);
    } else {
      state.schedules[date][lineId][posName] = [personIds];
    }
    save();
  }
  function clearDay(date){
    ensureDay(date);
    realLines().forEach(l => { state.schedules[date][l.id] = {}; });
    save();
  }
  function copyDay(fromDate, toDate){
    if(!state.schedules[fromDate]) return false;
    ensureDay(toDate);
    state.schedules[toDate] = Util.clone(state.schedules[fromDate]);
    save();
    return true;
  }
  function lastScheduledDate(beforeDate){
    const keys = Object.keys(state.schedules).filter(d => d < beforeDate).sort();
    return keys.length ? keys[keys.length-1] : null;
  }
  function assignedPeopleOnDay(date, exceptLine, exceptPos){
    const set = new Set();
    const day = state.schedules[date]; if(!day) return set;
    for(const ln in day){
      for(const pos in day[ln]){
        if(ln===exceptLine && pos===exceptPos) continue;
        const v = day[ln][pos];
        if(Array.isArray(v)) v.forEach(id => set.add(id));
        else if(v) set.add(v);
      }
    }
    return set;
  }

  function markExported(){ state.lastExportAt = new Date().toISOString(); save(); }

  return {
    load, save, subscribe, get, replace, reset,
    addPerson, updatePerson, deletePerson, findPersonUsage,
    addPosition, renamePosition, deletePosition, movePosition,
    ensureDay, getDay, assign, clearDay, copyDay, lastScheduledDate, assignedPeopleOnDay,
    markExported, emptyData,
  };
})();

  function fmtDateJp(iso){
    // 统一为 YYYY-MM-DD,和配置表顶部日期 chip 一致

  }

  function openCalendar(){

  }

  function renderCalendar(){
    const host = document.getElementById('cal-host'); if(!host) return;
    const y = calViewYear, m = calViewMonth;
    const firstDow = new Date(y, m-1, 1).getDay(); // 0=Sun
    const offset = firstDow; // 周日起首,和计划板一致
    const daysInMonth = new Date(y, m, 0).getDate();
    const daysInPrev = new Date(y, m-1, 0).getDate();
    const cells = [];
    for(let i = offset; i > 0; i--){
      cells.push({d: daysInPrev - i + 1, y: m===1?y-1:y, m: m===1?12:m-1, other: true});

            <div class="cal-host hidden" id="cal-host"></div>
          </span>

          return `<div class="card line-card" data-line="${line.id}">

            </div>

                  return `<li data-pos="${escapeHtml(pos)}">

              }
            </ul>
          </div>`;
        }).join('')}
      </div>
    `];
    root.innerHTML = html.join('');

    document.getElementById('sched-date-btn').addEventListener('click', e => {
      e.stopPropagation();
      const host = document.getElementById('cal-host');
      if(host.classList.contains('hidden')){ openCalendar(); } else { closeCalendar(); }
    });
    document.addEventListener('click', calOutsideListener);
    root.querySelectorAll('#line-tabs button').forEach(b => {
      b.addEventListener('click', () => {
        currentTabLine = b.dataset.line;
        root.querySelectorAll('#line-tabs button').forEach(x => x.classList.toggle('active', x===b));
        root.querySelectorAll('.line-card').forEach(c => c.classList.toggle('mobile-active', c.dataset.line===currentTabLine));
      });
    });
    root.querySelectorAll('.line-card').forEach(c => c.classList.toggle('mobile-active', c.dataset.line===currentTabLine));

    document.getElementById('copy-day').addEventListener('click', () => openCopyDayHost());
    root.querySelectorAll('.assign-btn').forEach(b => {
      b.addEventListener('click', () => openPicker(b.dataset.line, b.dataset.pos));
    });
    updateAutosaveStatus();
  }

  const DOW_JP_S = ['日','月','火','水','木','金','土'];
  function openCopyDayHost(){
    const host = document.getElementById('copy-day-host');
    const sched = Store.get().schedules || {};
    const todayIso = Util.todayISO();
    const dates = Object.keys(sched).filter(d => d !== currentDate && sched[d]).sort((a,b) => b.localeCompare(a));
    const items = dates.length === 0
      ? '<div class="empty">还没有其他日期的排班数据</div>'
      : dates.map(d => {
          const [y,m,da] = d.split('-').map(Number);
          const dow = new Date(y, m-1, da).getDay();
          let cnt = 0;
          const dd = sched[d];
          if (dd) for (const ln in dd) for (const pos in dd[ln]) {
            const v = dd[ln][pos];
            if (Array.isArray(v)) cnt += v.length;
            else if (v) cnt++;
          }
          const isToday = d === todayIso;
          return `<div class="item${isToday?' today':''}" data-date="${d}">
            <span class="date">${d}</span>
            <span class="dow">（${DOW_JP_S[dow]}）</span>
            <span class="meta">${cnt} 人${isToday?' · 今日':''}</span>
          </div>`;
        }).join('');
    const def = Util.prevDay(currentDate);
    host.innerHTML = `
      <div class="copy-modal" data-stop>
        <div class="head">
          <span class="title">复制某日排班 → ${currentDate}</span>
          <button class="close" type="button" data-close>×</button>
        </div>
        <div class="row">
          <input type="date" id="copy-day-input" value="${def}" max="${currentDate}">
          <button id="copy-day-do" type="button">复制</button>
        </div>
        <div class="list-label">已保存的日期</div>
        <div class="list">${items}</div>
      </div>
    `;
    host.classList.remove('hidden');
    host.querySelector('[data-close]').onclick = () => host.classList.add('hidden');
    host.onclick = (e) => { if (e.target === host) host.classList.add('hidden'); };
    host.querySelector('.copy-modal').onclick = (e) => e.stopPropagation();
    host.querySelector('#copy-day-do').onclick = (e) => {
      const v = (host.querySelector('#copy-day-input').value || '').trim();
      if (!v) return;
      doCopyFromSchedDate(v, e.currentTarget);
    };
    host.querySelectorAll('.item').forEach(it => {
      it.onclick = (e) => doCopyFromSchedDate(it.dataset.date, e.currentTarget);
    });
  }
  function doCopyFromSchedDate(srcDate, anchor){
    if (srcDate === currentDate) { showToast('源日期不能是当前日期', 'error'); return; }
    if (!Store.get().schedules[srcDate]) { showToast(`${srcDate} 暂无排班数据`, 'error'); return; }
    showConfirmPopover(anchor, {
      text: `复制 ${srcDate} 的排班?`,
      sub: `将覆盖当前 ${currentDate} 的数据`,
      confirmText: '复制',
      danger: true,
      onConfirm: () => {
        Store.copyDay(srcDate, currentDate);
        document.getElementById('copy-day-host').classList.add('hidden');
      }
    });
  }

  function openPicker(lineId, posName){
    const host = document.getElementById('picker-host');
    const s = Store.get();
    let query = '';

    function getCurrentIds(){
      const v = Store.get().schedules[currentDate]?.[lineId]?.[posName];
      return Array.isArray(v) ? v.slice() : (v ? [v] : []);
    }

    function render(){
      const currentIds = getCurrentIds();
      const used = Store.assignedPeopleOnDay(currentDate, lineId, posName);
      const q = query.trim().toLowerCase();
      const match = p => !q || p.name.toLowerCase().includes(q);
      const home = s.people.filter(p => !p.deleted && sameDept(p.homeLine, lineId) && match(p)).sort(byName);
      const others = s.people.filter(p => !p.deleted && !sameDept(p.homeLine, lineId) && match(p)).sort(byName);
      const row = (p) => {
        const selected = currentIds.includes(p.id);
        const full = currentIds.length >= 3 && !selected;
        const disabled = (used.has(p.id) && !selected) || full;
        return `<div class="person-row ${disabled?'disabled':''} ${selected?'selected':''}" data-pid="${p.id}">
          <span class="check">${selected ? '✓' : ''}</span>
          <span class="pname">${escapeHtml(p.name)}</span>
          <span class="home">${s.lines.find(l=>l.id===p.homeLine)?.name||''}</span>
        </div>`;
      };
      host.innerHTML = `
        <div class="picker">
          <div class="ph-head">
            <div class="title">选择 ${escapeHtml(s.lines.find(l=>l.id===lineId).name)} · ${escapeHtml(posName)} <span class="count">${currentIds.length}/3</span></div>
            <button data-act="close">✕</button>
          </div>
          <div class="ph-search"><input id="picker-search" placeholder="搜索…" value="${escapeHtml(query)}" autofocus></div>
          <div class="ph-body">
            <div class="section-title">本部门人员 (${home.length})</div>
            ${home.length? home.map(row).join('') : '<div class="muted" style="padding:8px 4px">（无)</div>'}
            ${others.length? `<details><summary class="section-title" style="cursor:pointer">调动 (${others.length})</summary>${others.map(row).join('')}</details>` : ''}
          </div>
          <div class="btn-row">
            <button data-act="clear">清空</button>
            <div class="spacer"></div>
            <button data-act="done" class="primary">完成</button>
          </div>
        </div>
      `;
      host.classList.remove('hidden');
      const close = () => { host.classList.add('hidden'); host.innerHTML=''; };
      host.querySelector('[data-act="close"]').onclick = close;
      host.querySelector('[data-act="done"]').onclick = close;
      host.querySelector('[data-act="clear"]').onclick = () => { Store.assign(currentDate, lineId, posName, null); render(); };
      host.querySelectorAll('.person-row').forEach(r => {
        if(r.classList.contains('disabled')) return;
        r.onclick = () => {
          const ids = getCurrentIds();
          const i = ids.indexOf(r.dataset.pid);
          if(i >= 0) ids.splice(i, 1);
          else if(ids.length < 3) ids.push(r.dataset.pid);
          Store.assign(currentDate, lineId, posName, ids.length ? ids : null);
          render();
        };
      });
      const search = host.querySelector('#picker-search');
      search.addEventListener('input', e => { query = e.target.value; render(); search.focus(); search.setSelectionRange(query.length, query.length); });
      host.onclick = e => { if(e.target===host) close(); };
    }
    render();
  }

  function updateAutosaveStatus(){
    const el = document.getElementById('autosave-status'); if(!el) return;
    const s = Store.get();
    const change = s.lastChangeAt ? new Date(s.lastChangeAt) : null;
    const exp = s.lastExportAt ? new Date(s.lastExportAt) : null;
    if(!change){ el.textContent = '✓ 暂无数据'; el.style.color = 'var(--muted)'; return; }
    if(!exp || change > exp){
      el.textContent = '⚠ 有未导出的更改';
      el.style.color = 'var(--warn)';
    } else {
      el.textContent = '✓ 已暂存 · 已导出';
      el.style.color = 'var(--ok)';
    }
  }

  function doExport(){
    const data = Store.get();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const z = n => String(n).padStart(2,'0');
    const d = new Date();
    a.href = url;
    a.download = `岗位排班表${String(d.getFullYear()).slice(-2)}-${z(d.getMonth()+1)}-${z(d.getDate())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    Store.markExported();
  }

  function doImport(anchor){
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.addEventListener('change', () => {
      const file = input.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        let incoming;
        try {
          incoming = JSON.parse(reader.result);
          if(!incoming || typeof incoming !== 'object' || !Array.isArray(incoming.lines)){
            showToast('文件格式不正确', 'error'); return;
          }
        } catch(err) {
          showToast('解析失败: ' + err.message, 'error'); return;
        }
        const apply = (mode) => {
          if(mode === 'replace'){
            Store.replace(incoming);
          } else {
            const merged = Util.clone(Store.get());
            const byId = new Map(merged.people.map(p=>[p.id,p]));
            (incoming.people||[]).forEach(p => byId.set(p.id, p));
            merged.people = [...byId.values()];
            (incoming.lines||[]).forEach(l => {
              const a = merged.positions[l.id] || [];
              const b = (incoming.positions||{})[l.id] || [];
              const set = new Set(a);
              b.forEach(x => { if(!set.has(x)){ a.push(x); set.add(x); } });
              merged.positions[l.id] = a;
            });
            Object.assign(merged.schedules, incoming.schedules||{});
            Store.replace(merged);
          }
          showToast('导入完成', 'success');
        };
        const cur = Store.get();
        const hasExisting = cur.people.length || Object.keys(cur.schedules).length;
        if (!hasExisting) { apply('replace'); return; }
        showConfirmPopover(anchor, {
          text: '导入数据',
          sub: '当前已有数据,选择导入模式',
          confirmText: '覆盖全部',
          danger: true,
          extra: { text: '合并保留现有', onClick: () => apply('merge') },
          onConfirm: () => apply('replace')
        });
      };
      reader.readAsText(file);
    });
    input.click();
  }

  return { renderSettings, renderPeople, renderSchedule, openPicker, updateAutosaveStatus, doImport, doExport, escapeHtml };
})();
<\/script>
<script>
(function(){
  if(!location.search.includes('test=1')) return;
  const KEY = 'shift-schedule-data-v1';
  const backup = localStorage.getItem(KEY);
  const results = [];
  const assert = (name, cond, detail='') => results.push({name, ok: !!cond, detail});

  // Util
  assert('todayISO returns YYYY-MM-DD', /^\d{4}-\d{2}-\d{2}$/.test(Util.todayISO()));
  assert('prevDay subtracts one day', Util.prevDay('2026-03-01')==='2026-02-28');
  assert('prevDay handles month boundary', Util.prevDay('2026-01-01')==='2025-12-31');
  assert('uid returns string with prefix', Util.uid('p').startsWith('p'));
  assert('clone produces independent copy', (()=>{const a={x:[1]};const b=Util.clone(a);b.x.push(2);return a.x.length===1;})());

  // Store
  localStorage.removeItem(KEY);
  Store.replace(Store.emptyData());
  Store.addPosition('xs','岗位A');
  Store.addPosition('xs','岗位B');
  assert('addPosition stores in order', JSON.stringify(Store.get().positions.xs)==='["岗位A","岗位B"]');
  Store.movePosition('xs',0,1);
  assert('movePosition swaps', Store.get().positions.xs[0]==='岗位B');
  Store.renamePosition('xs',0,'岗位B2');
  assert('renamePosition updates', Store.get().positions.xs[0]==='岗位B2');
  Store.deletePosition('xs',0);
  assert('deletePosition removes', Store.get().positions.xs.length===1);

  Store.addPerson('张三','xs');
  const pid = Store.get().people[0].id;
  assert('addPerson creates with id', !!pid && Store.get().people[0].name==='张三');
  Store.updatePerson(pid,{name:'张三丰'});
  assert('updatePerson updates fields', Store.get().people[0].name==='张三丰');

  Store.addPosition('xs','岗位C');
  Store.assign('2026-05-26','xs','岗位C', [pid]);
  assert('assign stores person ids as array', Array.isArray(Store.get().schedules['2026-05-26'].xs['岗位C']) && Store.get().schedules['2026-05-26'].xs['岗位C'][0]===pid);
  assert('findPersonUsage counts assignments', Store.findPersonUsage(pid)===1);

  const day = Store.getDay('2026-05-26');
  assert('getDay returns all lines', Object.keys(day).length===7);
  assert('getDay returns positions as arrays', Array.isArray(day.xs['岗位C']) && day.xs['岗位C'][0]===pid);

  const usedExceptC = Store.assignedPeopleOnDay('2026-05-26','xs','岗位C');
  assert('assignedPeopleOnDay excludes exceptPos', !usedExceptC.has(pid));
  Store.assign('2026-05-26','xs','岗位A', [pid]);
  const usedAlsoA = Store.assignedPeopleOnDay('2026-05-26','xs','岗位C');
  assert('assignedPeopleOnDay includes others', usedAlsoA.has(pid) && !usedAlsoA.has('xxx'));

  // Multi-person at one position
  Store.get().people.push({id:'p2', name:'李四', homeLine:'xs'});
  Store.assign('2026-05-26','xs','岗位C', [pid, 'p2']);
  assert('assign supports multiple people', Store.get().schedules['2026-05-26'].xs['岗位C'].length===2);
  assert('findPersonUsage spans positions', Store.findPersonUsage(pid)===2);
  Store.assign('2026-05-26','xs','岗位C', [pid, 'p2', 'p3', 'p4']);
  assert('assign caps at 3', Store.get().schedules['2026-05-26'].xs['岗位C'].length===3);

  Store.copyDay('2026-05-26','2026-05-27');
  assert('copyDay copies assignments', Store.get().schedules['2026-05-27'].xs['岗位C'][0]===pid);

  Store.deletePerson(pid);
  assert('deletePerson soft-deletes person', !!Store.get().people.find(p=>p.id===pid && p.deleted));
  assert('deletePerson keeps id in past schedules', Store.get().schedules['2026-05-26'].xs['岗位C'].includes(pid));
  assert('deletePerson keeps others', Store.get().schedules['2026-05-26'].xs['岗位C'].includes('p2'));
  Store.assign('2026-05-26','xs','岗位C', null);
  assert('assign null clears position', Store.get().schedules['2026-05-26'].xs['岗位C']===null);

  assert('lastScheduledDate returns most recent before', Store.lastScheduledDate('2026-06-01')==='2026-05-27');

  // Render results
  const div = document.createElement('div');
  div.style.cssText='position:fixed;inset:0;background:#000;color:#fff;padding:16px;overflow:auto;z-index:9999;font-family:monospace;font-size:12px';
  const pass = results.filter(r=>r.ok).length;
  div.innerHTML = `<h3>Tests: ${pass}/${results.length} passed</h3>` +
    results.map(r => `<div style="color:${r.ok?'#10b981':'#ef4444'}">${r.ok?'✓':'✗'} ${r.name}${r.detail?' — '+r.detail:''}</div>`).join('');
  document.body.appendChild(div);
  // Restore real user data (do NOT leave test data in either localStorage or in-memory store)
  if(backup !== null) localStorage.setItem(KEY, backup); else localStorage.removeItem(KEY);
  Store.load();
})();

<script>
(function(){
  Store.load();
  const pages = ['schedule','people','settings'];
  const renderers = {
    schedule: Pages.renderSchedule,
    people: Pages.renderPeople,
    settings: Pages.renderSettings,
  };
  let current = 'schedule';
  function route(name){
    if(!pages.includes(name)) name='schedule';
    current = name;
    pages.forEach(p => document.getElementById('page-'+p).classList.toggle('hidden', p!==name));
    document.querySelectorAll('.nav button[data-route]').forEach(b => b.classList.toggle('active', b.dataset.route===name));
    if(location.hash !== '#/'+name) location.hash = '#/'+name;
    renderers[name]();
  }
  document.querySelectorAll('.nav button[data-route]').forEach(b => b.addEventListener('click', () => route(b.dataset.route)));
  document.querySelectorAll('.nav button[data-action]').forEach(b => b.addEventListener('click', () => {
    if(b.dataset.action === 'import') Pages.doImport(b);
    else if(b.dataset.action === 'export') Pages.doExport();
  }));
  window.addEventListener('hashchange', () => route((location.hash.match(/^#\/(\w+)/)||[])[1]));
  Store.subscribe(() => renderers[current]());
  route((location.hash.match(/^#\/(\w+)/)||[])[1]);
})();

  /* 移动端弹出窗口与桌面一致：浮动定位贴近卡片，由 JS 计算 */

  body.printing.printing-compact .line-num.xiusheng { font-size: 11px !important; }
  body.printing.printing-compact .line-label { font-size: 7px !important; letter-spacing: 1px !important; }
  body.printing.printing-compact .date-month,
  body.printing.printing-compact .date-day,
  body.printing.printing-compact .date-dow { font-size: 12px !important; }
  body.printing.printing-compact .foot-label { font-size: 7px !important; }
  body.printing.printing-compact .foot-val { font-size: 11px !important; }
  body.printing.printing-compact .card { font-size: 10px !important; padding: 1px 4px !important; }
  body.printing.printing-compact .card-name-display { font-size: 11px !important; padding: 1px 2px !important; }
  body.printing.printing-compact .compact-name-letter { width: 14px !important; height: 14px !important; font-size: 9px !important; border-width: 1px !important; }
  body.printing.printing-compact .compact-people,
  body.printing.printing-compact .compact-time,
  body.printing.printing-compact .compact-name { font-size: 10px !important; }
  body.printing.printing-compact .range,
  body.printing.printing-compact .t-start,
  body.printing.printing-compact .t-end { font-size: 9px !important; }
  body.printing.printing-compact .duration { font-size: 9px !important; }
  body.printing.printing-compact .tick .label { font-size: 9px !important; padding: 0 2px !important; }

  /* === 手机端打印:只做「还原 mobile 屏幕特有的隐藏 / 撑高」,
         其它一律让 body.printing.printing-compact 的 PC 打印规则接管,
         这样手机和 PC 打印出来一模一样 === */
  @media (max-width: 900px) {
    body.printing { font-size: 14px !important; width: auto !important; height: auto !important; overflow: visible !important; }
    body.printing .brand-sub { display: inline !important; }
    body.printing #totalAll { display: inline !important; }
    body.printing .main { overflow: visible !important; align-items: stretch !important; }
    body.printing .board {
      grid-template-columns: repeat(6, 1fr) !important;
      grid-auto-rows: auto !important;
      min-width: 0 !important;
      overflow: visible !important;
    }
    body.printing .line { flex: 1 1 0 !important; width: auto !important; overflow: visible !important; min-height: 0 !important; }
    /* 注意:cards-wrap / timeline-body 不能 overflow: visible —— 会让 trimGridForExport
       inline 设的 overflow: hidden 失效,timeline 列底部 22:00 之类的时间刻度就会漏出来 */
    body.printing .timeline { position: static !important; align-self: stretch !important; overflow: visible !important; }
    body.printing .timeline-head, body.printing .timeline-foot,
    body.printing .line-head, body.printing .line-foot { position: static !important; }
    body.printing .card-compact .compact-time { display: inline !important; }
    /* 手机横屏 CSS 把底栏 / 时间轴底栏隐藏了,打印时必须恢复 */
    body.printing .line-foot, body.printing .timeline-foot { display: flex !important; }
    /* mobile 竖屏 .line-foot .foot-row 强行 height:18px,打印里要放开让 grid/flex 决定高度 */
    body.printing .line-foot .foot-row { height: auto !important; }
  }

  /* === 实结 input 在打印中渲染成纯文本,并且和「结束」那一行的数值左右严格对齐 ===
     原本 .actual-finish-wrap 有 padding/margin 偏移,.foot-val.actual-finish 有 margin:0 -3px 0 0,
     导致打印里 实结的时间数字比 结束 数字水平错位 ~3px。这里把所有 padding/margin/border 拉平。 */
  body.printing .actual-finish-wrap {
    display: inline-flex !important;
    align-items: baseline !important;
    border: none !important; background: transparent !important;
    padding: 0 !important; margin: 0 !important;
    height: auto !important; line-height: inherit !important;
  }
  body.printing .foot-val.actual-finish {
    background: transparent !important; border: none !important;
    padding: 0 !important; margin: 0 !important;
    width: auto !important; min-width: 0 !important;
    height: auto !important;
    vertical-align: baseline !important;
    text-align: right !important;
    /* 字号显式跟「结束」对齐,不再用 inherit,避免接到 body 的 14px */
    font-size: 11px !important;
    font-weight: 600 !important;
    line-height: 1.15 !important;
  }
  /* webkit datetime 内部 shadow DOM 也要显式 11px,html2canvas / jsPDF 才能拿到对的字号 */
  body.printing .foot-val.actual-finish::-webkit-datetime-edit,
  body.printing .foot-val.actual-finish::-webkit-datetime-edit-fields-wrapper,
  body.printing .foot-val.actual-finish::-webkit-datetime-edit-hour-field,
  body.printing .foot-val.actual-finish::-webkit-datetime-edit-minute-field,
  body.printing .foot-val.actual-finish::-webkit-datetime-edit-text,
  body.printing .foot-val.actual-finish::-webkit-datetime-edit-ampm-field {
    font-size: 11px !important;
    font-weight: 600 !important;
    line-height: 1.15 !important;
  }
  /* 两行的 .foot-val 都右对齐 + 行用 baseline 让 input 跟 span 的文字基线齐高,
     这样「结束」「实结」的时间数字垂直方向一致、最后一位数字也在同一垂直线上。 */
  body.printing .line-foot .foot-row { align-items: baseline !important; }
  body.printing .line-foot .foot-val { text-align: right !important; }

  /* === 手机/PC 打印强制使用同一套 CSS 变量,保证排版完全一致 === */
  body.printing { --time-col-w: 56px !important; }

  /* 打印底栏要塞 4 行(数量/耗时/结束/实结)。
     之前固定 60px,baseline 对齐 + webkit datetime input 实际渲染比预计高 1-2px,
     最后一行「实结」被截。改成固定 68px,行 line-height 1.1 收紧,留出余量。
     两边底栏(timeline-foot / line-foot)同高,视觉对齐。 */
  body.printing.printing-compact .line-foot,
  body.printing.printing-compact .timeline-foot { height: 68px !important; min-height: 68px !important; padding: 2px 6px !important; }
  body.printing.printing-compact .line-foot .foot-row { margin-bottom: 1px !important; line-height: 1.1 !important; }
  body.printing.printing-compact .line-foot .foot-row:last-child { margin-bottom: 0 !important; }

  /* === 打印时:右上角的「耗时 / 结束 / 时钟」都隐藏,只保留「总计」 === */
  body.printing #totalDur,
  body.printing #totalFinish,
  body.printing .clock { display: none !important; }
  body.printing #totalAll {
    display: inline-block !important;
    color: #000 !important;
    font-size: 12px !important;
    font-weight: 700 !important;
    margin-left: auto !important;
    white-space: nowrap !important;
    order: 99 !important; /* 强行排到 topbar-right 最右,clock 让位到左侧 */
  }
  /* 让 topbar-right 把「总计」推到最右边 */
  body.printing .topbar-right { justify-content: flex-end !important; }

  /* 日期整体收在 timeline-head 边框内:overflow:hidden 防止 absolute 子元素外溢,
     再把 mobile 屏幕用的 absolute date-year 强行拉回 flex 流 */
  body.printing .timeline-head { overflow: hidden !important; position: relative !important; box-sizing: border-box !important; }
  body.printing .date-year {
    position: static !important;
    top: auto !important; left: auto !important; right: auto !important; bottom: auto !important;
    /* 基础样式里 .date-year 有 transform: translateX(-50%) 用于绝对定位居中,
       打印态改成 static 后这条 transform 仍然生效,会把 year 整体往左推自己一半宽度,
       配合 timeline-head 的 overflow:hidden 就把 "2026" 的 "2" 削掉了 */
    transform: none !important;
    align-self: center !important;
    padding: 0 !important; margin: 0 0 1px !important;
  }
  body.printing .date-month, body.printing .date-day, body.printing .date-dow {
    padding: 0 !important; margin: 0 !important;
    transform: none !important;
  }
  /* === PC 端打印:日期所有元素强制黑色 ===
     默认 .date-year 是 var(--accent) 橙色、.date-day 是 var(--text) 亮灰,
     打印里要么花、要么白底白字看不见。统一压黑 + 关掉渐变文字技巧。 */
  body.printing .date-year,
  body.printing .date-month,
  body.printing .date-day,
  body.printing .date-dow {
    color: #000 !important;
    -webkit-text-fill-color: #000 !important;
    background: transparent !important;
    background-image: none !important;
    -webkit-background-clip: border-box !important;
    background-clip: border-box !important;
    opacity: 1 !important;
    box-shadow: none !important;
    border: none !important;
  }

  /* === 打印强制黑白:覆盖品名色 / 主题色 / 行号橙、结束蓝、实结紫 等等 === */
  body.printing .card { border-left: 1px solid #999 !important; }
  body.printing .card.rest { background: #f0f0f0 !important; }
  body.printing .compact-name-letter { color: #000 !important; border-color: #999 !important; background: transparent !important; }
  body.printing .line-num,
  body.printing .foot-val.time,
  body.printing .foot-val.finish,
  body.printing .foot-val.actual-finish,
  body.printing #totalDur,
  body.printing #totalFinish,
  body.printing .tick.hour-20,
  body.printing .brand,
  body.printing .brand-sub { color: #000 !important; }
  body.printing .brand .dot { background: #000 !important; }
  body.printing .tick.hour-20 { border-top-color: #888 !important; }
  body.printing .grid-line.hour-20 { border-top-color: #aaa !important; opacity: 0.6 !important; }
  /* 实结 input 的 Chrome 内部 datetime 各字段也要拉成黑色 */
  body.printing .foot-val.actual-finish::-webkit-datetime-edit,
  body.printing .foot-val.actual-finish::-webkit-datetime-edit-fields-wrapper,
  body.printing .foot-val.actual-finish::-webkit-datetime-edit-hour-field,
  body.printing .foot-val.actual-finish::-webkit-datetime-edit-minute-field,
  body.printing .foot-val.actual-finish::-webkit-datetime-edit-text,
  body.printing .foot-val.actual-finish::-webkit-datetime-edit-ampm-field { color: #000 !important; }

.confirm-popover{position:fixed;z-index:10000;background:linear-gradient(180deg,#1d1d22 0%,#16161a 100%);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px 16px;box-shadow:0 24px 56px rgba(0,0,0,0.7),0 0 0 1px rgba(255,255,255,0.03) inset,0 1px 0 rgba(255,255,255,0.06) inset;min-width:220px;max-width:300px;font-size:13px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:confirmIn .2s cubic-bezier(0.2,0.8,0.2,1);font-family:inherit;color:#e8e8e8}

.confirm-popover button.primary:hover{background:var(--accent-light);box-shadow:0 4px 12px rgba(var(--accent-rgb),0.45)}

/* ========== 视觉精修:在深色基础上加深度/层次/微高光 ========== */
html,body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"tnum"}
::selection{background:rgba(var(--accent-rgb),.28);color:#fff}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(255,255,255,.06);border-radius:8px;border:2px solid transparent;background-clip:padding-box}

/* 顶栏 — 玻璃质感 */
/* 顶栏跟 line-head/timeline-head 用同一组梯度,从 tab 栏一路衔接到内容区,层级清晰不再颠倒。
   保留 backdrop blur 让身后的 body 辐射光晕能淡淡透上来,质感不死。 */
.topbar{background:linear-gradient(180deg,rgba(26,29,38,.94) 0%,rgba(16,18,26,.97) 100%)!important;backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid #1d2029!important;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 18px rgba(0,0,0,.24)!important}
.brand{letter-spacing:.3px}
.brand .dot{box-shadow:0 0 12px rgba(var(--accent-rgb),.55)}
.top-btn{transition:all .18s cubic-bezier(.4,0,.2,1)}
.top-btn:hover{background:rgba(255,255,255,.05)!important;border-color:rgba(255,255,255,.1)!important;color:var(--text)!important}
.top-btn:active{transform:scale(.97)}
/* 时间轴日期头(顶部大日期)— 微高光。注意:不要设 position,否则会覆盖手机端的 sticky */
#timelineHead .date-year,#timelineHead .date-month,#timelineHead .date-day,#timelineHead .date-dow{transition:color .2s}
/* 流水线列容器:上白下黑微梯度,但限定在一屏内完成过渡(background-size: 100% 100vh + no-repeat),
   这样手机竖屏 .line 被拉到 2-3 屏高时,底部不会被压得比 PC 更黑;低于一屏的部分回到纯 --line-bg */
.line{background:linear-gradient(180deg,rgba(255,255,255,.012) 0%,rgba(0,0,0,.04) 100%) top/100% 100vh no-repeat var(--line-bg);box-shadow:1px 0 0 rgba(255,255,255,.03) inset,-1px 0 0 rgba(0,0,0,.18) inset}
.line-head{border-bottom-color:rgba(255,255,255,.06)!important}
.line-head .line-name{letter-spacing:.4px}
/* === 高级感统一色板 ===
   把蓝灰偏向调成「近中性深灰 + 一丝暖」的色,跟主题色橙形成冷暖对比,整体更克制。
   RGB 比值接近 1:1:1.1(几乎平,少量蓝),不再像之前 18:21:26 那样发冷。 */
.line-foot,.timeline-foot,.timeline-head,.timeline-body,.line-head{
  background:linear-gradient(180deg,rgba(26,29,38,.94) 0%,rgba(16,18,26,.97) 100%)!important;
}
/* 柔化 LINE 列之间的竖向分隔线 —— 把原本 #3a3f47 偏亮的分隔色改成低透明白,更克制不抢眼 */
.board{background:rgba(255,255,255,.045)!important}
.line-foot,.timeline-foot{
  border-top-color:rgba(255,255,255,.05)!important;
  box-shadow:0 -1px 0 rgba(255,255,255,.04) inset,0 -8px 18px rgba(0,0,0,.22);
}
.timeline-head,.line-head{
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 8px 18px rgba(0,0,0,.22);
}
.timeline-head:hover{
  background:linear-gradient(180deg,rgba(28,28,32,.95) 0%,rgba(16,16,18,.98) 100%)!important;
}
/* 线头数字「夕盛/01-05」— 微金属感渐变文字 + 字距,质感更高级 */
.line-name,.line-num{
  background:linear-gradient(180deg,#f5f6f8 0%,#a6abb3 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:.5px;font-feature-settings:"tnum";
}
/* === 导出 PDF / 打印态:html2canvas 不支持 background-clip:text,
   渐变会被当成元素背景色渲染成一块灰条。这里强制改回纯文字色。 === */
body.printing .line-name,
body.printing .line-num{
  background:none !important;
  -webkit-background-clip:border-box !important;
  background-clip:border-box !important;
  -webkit-text-fill-color:currentColor !important;
  color:#000 !important;
}
/* 日期栏的「日」字加一道极细橙色底光,作为焦点 */
.date-day{
  text-shadow:0 0 18px rgba(var(--accent-rgb),.18);
}
.qty-total,.time-total,.finish-total,#totalAll,#totalDur,#totalFinish{font-feature-settings:"tnum"}
/* 卡片 — 微梯度 + 顶部 1px 亮线 + 柔阴影,hover 抬升 */
.card{box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 2px 6px rgba(0,0,0,.32),0 1px 2px rgba(0,0,0,.2)!important;transition:transform .18s cubic-bezier(.4,0,.2,1),box-shadow .18s,border-color .18s}
.card:not(.expanded):hover{transform:translateX(1px);box-shadow:0 1px 0 rgba(255,255,255,.08) inset,0 4px 14px rgba(0,0,0,.42),0 1px 2px rgba(0,0,0,.25)!important}
.card.expanded,.card.active,.card-expanded{box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 16px 40px rgba(0,0,0,.55),0 0 0 1px rgba(var(--accent-rgb),.22)!important}
/* 输入框(卡片字段)— 聚焦光晕 */
.field-input,.gap,.start-time,.actual-finish{transition:border-color .15s,box-shadow .15s,background .15s}
.field-input:focus,.gap:focus,.start-time:focus,.actual-finish:focus{border-color:var(--accent)!important;box-shadow:0 0 0 3px rgba(var(--accent-rgb),.18)!important}
/* 按钮 — 通用微动效 */
button{transition:transform .12s,background .15s,border-color .15s,box-shadow .15s}
button:active{transform:scale(.97)}
.head-btn{transition:all .18s cubic-bezier(.4,0,.2,1)}
.head-btn:hover{background:rgba(var(--accent-rgb),.08)!important;border-color:rgba(var(--accent-rgb),.35)!important;color:var(--accent)!important}
/* picker / modal 弹层 — 更深的玻璃 + 更柔阴影 */
.picker-modal,#libModal .modal-card{background:linear-gradient(180deg,#1d2027 0%,#13161b 100%)!important;border-color:rgba(255,255,255,.08)!important;box-shadow:0 24px 64px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03) inset!important;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
/* 数字大屏(总计 / 耗时)— 微金属感 */
#totalAll,#totalDur,#totalFinish{background:linear-gradient(180deg,#fff 0%,#cbd0d8 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* === 打印硬限制 === 必须放在所有 body.printing 规则之后 ===
   前面的 body.printing { overflow: visible !important; height: auto !important } 是为了
   让 trimGridForExport 测尺寸的时候不被 body 容器卡住,但 Chrome 打印 iframe 时如果
   body 真的 overflow: visible + height auto,内容会一直铺到 iframe 之外,在打印预览
   纸面外的灰色区域漏出 line-foot / timeline 的副本。
   ⚠️ 全部包在 @media print 里 —— 屏幕态完全不受影响,即使 cleanup 没跑屏幕也正常。 */
@media print {
  body.printing,
  html:has(body.printing) {
    width: 285mm !important;
    max-width: 285mm !important;
    height: 198mm !important;
    max-height: 198mm !important;
    overflow: hidden !important;
    margin: 0 !important;
    padding: 0 !important;
  }
}

      for (const o of opts.input.options) { const op = document.createElement('option'); op.value = o.value; op.textContent = o.label; inputEl.appendChild(op); }
      if (opts.input.value != null) inputEl.value = opts.input.value;

  let confirmed = false;
  const doConfirm = () => { const v = inputEl ? inputEl.value : null; confirmed = true; close(); opts.onConfirm && opts.onConfirm(v); };
  const noBtn = document.createElement('button'); noBtn.textContent = opts.cancelText || '取消';
  noBtn.onclick = (e) => { e.stopPropagation(); close(); };
  const yesBtn = document.createElement('button'); yesBtn.className = opts.danger ? 'danger' : 'primary'; yesBtn.textContent = opts.confirmText || '确认';
  yesBtn.onclick = (e) => { e.stopPropagation(); doConfirm(); };
  actions.appendChild(noBtn); actions.appendChild(yesBtn); pop.appendChild(actions);

    pop.style.top  = ((window.innerHeight - pr.height) / 2) + 'px';

    let left = r.left - pr.width - m; if (left < m) left = r.right + m;
    if (left + pr.width > window.innerWidth - m) left = Math.max(m, window.innerWidth - pr.width - m);
    let top = r.top + r.height/2 - pr.height/2; if (top < m) top = m;
    if (top + pr.height > window.innerHeight - m) top = window.innerHeight - pr.height - m;
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
  }
  const close = () => {
    pop.remove();
    document.removeEventListener('click', onDoc, true);
    document.removeEventListener('keydown', onKey, true);
    window.removeEventListener('scroll', close, true);
    if (!confirmed && opts.onCancel) opts.onCancel();
  };
  const onDoc = (e) => { if (!pop.contains(e.target)) close(); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  setTimeout(() => {
    document.addEventListener('click', onDoc, true);
    document.addEventListener('keydown', onKey, true);
    window.addEventListener('scroll', close, true);
    if (inputEl) inputEl.focus();
  }, 0);
}

function applyBentoOverlay() {

  return ((sec - baseSec) / 3600) * hourPx;
}
function getTotalPx() {
  const hourPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour-px'));
  return (TIME_END_HOUR - TIME_START_HOUR) * hourPx;
}

function renderTimeline() {
  const totalPx = getTotalPx();
  timelineInner.style.height = (totalPx + 16) + 'px';
  timelineInner.innerHTML = '';
  const totalMin = (TIME_END_HOUR - TIME_START_HOUR) * 60;
  for (let m = 0; m <= totalMin; m += TIME_TICK_MIN) {
    const hour = TIME_START_HOUR + Math.floor(m / 60);
    const min = m % 60;
    const tick = document.createElement('div');
    tick.className = 'tick';
    if (min === 0) tick.classList.add('hour');
    if (hour === 20 && min === 0) tick.classList.add('hour-20');
    tick.style.top = secToPx((hour * 60 + min) * 60) + 'px';
    if (min === 0) {
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = `${String(hour).padStart(2,'0')}:00`;
      tick.appendChild(label);
    }
    timelineInner.appendChild(tick);
  }
}
function renderGridLines(grid) {
  grid.querySelectorAll('.grid-line').forEach(el => el.remove());
  const totalMin = (TIME_END_HOUR - TIME_START_HOUR) * 60;
  for (let m = 0; m <= totalMin; m += TIME_TICK_MIN) {
    const hour = TIME_START_HOUR + Math.floor(m / 60);
    const min = m % 60;
    const ln = document.createElement('div');
    ln.className = 'grid-line';
    if (min === 0) ln.classList.add('hour');
    if (hour === 20 && min === 0) ln.classList.add('hour-20');
    ln.style.top = secToPx((hour * 60 + min) * 60) + 'px';
    grid.appendChild(ln);
  }
}

// 扫描当前显示日期(currentDate)板子上所有 libId 卡片的快照,
// 返回 {speed, mp, divergent, count, lineIds, singleLineId}。
// speed=null 表示当天没有该品名的卡片(信息列显示库默认值)。
// singleLineId: 所有卡片都在同一条线时返回该 lineId,否则返回 null(用于按线挑选显示速度)。
function getDaySnapshotForLib(libId) {
  let speed = null, mp = null, divergent = false, count = 0;
  const lineIds = new Set();
  document.querySelectorAll('.card[data-type="job"]').forEach(card => {
    if (card.dataset.libId !== libId) return;
    const s = parseFloat(card.dataset.speed) || 0;
    const meterInp = popupQ(card, '.meter-people');
    const m = Math.max(1, parseInt(meterInp && meterInp.value) || 1);
    const lid = getLineIdFromNode(card);
    if (lid) lineIds.add(lid);
    if (count === 0) { speed = s; mp = m; }
    else if (s !== speed || m !== mp) divergent = true;
    count++;
  });
  const singleLineId = lineIds.size === 1 ? Array.from(lineIds)[0] : null;
  return { speed, mp, divergent, count, lineIds, singleLineId };
}
function renderLibList() {
  if (library.length === 0) {
    libList.innerHTML = '<div class="lib-empty">还没有品名，添加你的第一个品名</div>';
    return;
  }
  // 统计每个 bentoId 被多少个品名库项链接,用于处理"重复共享项"
  const linkCount = new Map();
  library.forEach(it => {
    if (it && it.bentoId) linkCount.set(it.bentoId, (linkCount.get(it.bentoId) || 0) + 1);
  });
  libList.innerHTML = '';
  [...library].sort((a, b) => (a.name || '').localeCompare(b.name || '', 'zh-CN')).forEach(item => {
    const row = document.createElement('div');
    row.className = 'lib-item';
    row.style.setProperty('--lib-color', item.color);
    const peopleText = fmtPeople(item.people);
    // 信息列:优先显示「当天卡片快照」的速度/计量人数,没有卡片时回落到库默认值。
    // 流水线/品名速度都改为「按所在线」解析:卡片只在一条线 → 用那条线的覆盖值;多条线则用默认。
    const snap = getDaySnapshotForLib(item.id);
    const libSpeed = item.speed;
    const libMeter = item.meterPeople > 0 ? item.meterPeople : 1;
    // 按线解析流水线速度(显示用):
    //   - 卡片都在一条线 → 用 resolveItemLineSpeed(item, singleLineId)
    //   - 多条线或无卡片  → 回退默认 item.lineSpeed
    const resolvedLineSpeed = snap.singleLineId
      ? resolveItemLineSpeed(item, snap.singleLineId)
      : (parseFloat(item.lineSpeed) || 0);
    const lineSpdText = resolvedLineSpeed > 0 ? `${resolvedLineSpeed}` : '—';
    // 当流水线速度是按线覆盖来的(不是默认值) → 加角标提示
    const lineSpdLineMark = (snap.singleLineId && item.lineSpeedByLine && item.lineSpeedByLine[snap.singleLineId] > 0)
      ? `<sup style="color:var(--accent);font-size:9px" title="${LINE_ID_DISPLAY[snap.singleLineId]} 线的覆盖值">†</sup>`
      : '';
    let dispSpeed, dispMeter, daySuffix = '';
    if (snap.count > 0) {
      dispSpeed = snap.speed > 0 ? snap.speed : libSpeed;
      dispMeter = snap.mp > 0 ? snap.mp : libMeter;
      // 判断「跟库不同」时也要按线解析的默认值比较:卡片在 01 上 → 比的是 01 的目标值
      const expectedSpeed = snap.singleLineId ? resolveItemSpeed(item, snap.singleLineId) : libSpeed;
      const diffSpeed = (snap.speed > 0 && snap.speed !== expectedSpeed);
      const diffMeter = (snap.mp !== libMeter);
      if (diffSpeed || diffMeter) {
        daySuffix = ` <span class="ns-day-mark" title="${currentDate} 卡片快照与品名库${snap.singleLineId ? LINE_ID_DISPLAY[snap.singleLineId]+' 线' : '默认'}值不同(应为:速度 ${expectedSpeed} · 计量 ${libMeter})">·当日</span>`;
      }
      if (snap.divergent) {
        daySuffix += ` <span class="ns-day-mark" style="color:var(--warn)" title="${currentDate} 同品名多张卡数值不一致,显示的是第一张">≠</span>`;
      }
      // 卡片在按线覆盖的线上 + 用的就是覆盖值 → 加角标(同流水线速度)
      if (snap.singleLineId && item.speedByLine && item.speedByLine[snap.singleLineId] > 0
          && snap.speed > 0 && snap.speed === item.speedByLine[snap.singleLineId]) {
        daySuffix += `<sup style="color:var(--accent);font-size:9px" title="${LINE_ID_DISPLAY[snap.singleLineId]} 线的覆盖值">†</sup>`;
      }
    } else {
      dispSpeed = libSpeed;
      dispMeter = libMeter;
    }
    const meterText = dispMeter > 0 ? `${dispMeter}` : '1';
    // 同一便当被多于 1 项链接时,这些重复项允许手动删除,直至只剩 1 项
    const isDup = item._bentoLinked && (linkCount.get(item.bentoId) || 0) > 1;
    const lockedByBento = item._bentoLinked && !isDup;
    const linkBadge = item._bentoLinked
      ? (isDup
          ? '<span class="bento-link" title="此便当在品名库中有重复条目,可删除多余的">🍱<sup style="color:var(--warn);font-size:9px">×N</sup></span> '
          : '<span class="bento-link" title="已链接配置表便当库,LINE速度与人数自动同步">🍱</span> ')
      : '';
    const delBtnHtml = lockedByBento
      ? `<button class="lib-item-btn del" title="已链接便当库,不可删除(请在配置表 · 便当库中删除该便当)" disabled>×</button>`
      : `<button class="lib-item-btn del" title="${isDup ? '删除重复的共享项' : '删除'}">×</button>`;
    // 按线设置:左列品名速度(plan 板自有,可改),右列流水线速度(若 _bentoLinked 则锁定,由配置表同步)
    const hasOverride = hasPerLineSpeed(item);
    const perLineActiveCls = hasOverride ? ' active' : '';
    const perLineTitle = hasOverride ? '按线设置(已有覆盖)' : '按线设置(留空 = 用默认)';
    const lineSpeedReadonly = lockedByBento; // 流水线速度受便当库管控时只读
    // 値付け(tsk) 不在按线速度面板里出现 —— 値付け线上的卡片直接用品名/流水线速度默认值。
    // 当卡片只在一条线上时,给那一行加 active-line,整行(标签+两个输入框)高亮成主题色。
    const activeLid = snap.singleLineId || null;
    const perLineRows = LINE_IDS_ORDER.filter(lid => lid !== 'tsk').map(lid => {
      const sV = (item.speedByLine && item.speedByLine[lid] > 0) ? item.speedByLine[lid] : '';
      const lV = (item.lineSpeedByLine && item.lineSpeedByLine[lid] > 0) ? item.lineSpeedByLine[lid] : '';
      const sCls = sV !== '' ? ' has-override' : '';
      const lCls = lV !== '' ? ' has-override' : '';
      const rowCls = (lid === activeLid) ? 'pl-row active-line' : 'pl-row';
      const lockTip = lineSpeedReadonly ? 'title="由配置表 · 便当库自动同步" readonly disabled' : '';
      return `<div class="${rowCls}">
        <span class="pl-line">${LINE_ID_DISPLAY[lid]}</span>
        <input type="number" class="pl-speed${sCls}" data-line="${lid}" min="0" step="0.01" inputmode="decimal" placeholder="默认 ${item.speed || '—'}" value="${sV}">
        <input type="number" class="pl-line-speed${lCls}" data-line="${lid}" min="0" step="0.01" inputmode="decimal" placeholder="默认 ${item.lineSpeed || '—'}" value="${lV}" ${lockTip}>
      </div>`;
    }).join('');
    row.innerHTML = `
      <div class="lib-item-row">
        <div class="lib-item-name">${linkBadge}${escapeHtml(item.name)}</div>
        <div class="lib-item-info">品名 <span class="ns">${dispSpeed}</span> · 计量 <span class="ns">${meterText}</span>${daySuffix}<br>流水线 ${lineSpdText}${lineSpdLineMark}<br>${peopleText}</div>
        <div class="lib-item-btns">
          <button class="lib-item-btn per-line${perLineActiveCls}" title="${perLineTitle}">📏</button>
          <button class="lib-item-btn apply" title="把当前的品名速度 / 计量人数 应用到 ${currentDate} 该品名的所有卡片(其它日期不变)">⤓</button>
          <button class="lib-item-btn edit" title="编辑">✎</button>
          ${delBtnHtml}
        </div>
      </div>
      <div class="lib-per-line">
        <div class="pl-title">按生产线设置（留空 = 用默认值）</div>
        <div class="pl-head"><span>线</span><span>品名速度</span><span>流水线速度</span></div>
        ${perLineRows}
      </div>
    `;
    row.querySelector('.lib-item-btn.apply').addEventListener('click', () => applyLibToCurrentDate(item.id));
    row.querySelector('.lib-item-btn.edit').addEventListener('click', () => startEditLib(item.id));
    // 按线展开
    row.querySelector('.lib-item-btn.per-line').addEventListener('click', () => {
      row.classList.toggle('expanded');
    });
    // 按线输入:实时落库
    row.querySelectorAll('.lib-per-line .pl-speed').forEach(inp => {
      inp.addEventListener('change', () => {
        const lid = inp.dataset.line;
        const v = parseFloat(inp.value);
        if (!item.speedByLine) item.speedByLine = {};
        if (v > 0) item.speedByLine[lid] = v;
        else delete item.speedByLine[lid];
        inp.classList.toggle('has-override', v > 0);
        saveLibrary();
        // 更新按钮高亮(是否有任何覆盖)
        row.querySelector('.lib-item-btn.per-line').classList.toggle('active', hasPerLineSpeed(item));
      });
    });
    row.querySelectorAll('.lib-per-line .pl-line-speed').forEach(inp => {
      if (inp.disabled) return;
      inp.addEventListener('change', () => {
        const lid = inp.dataset.line;
        const v = parseFloat(inp.value);
        if (!item.lineSpeedByLine) item.lineSpeedByLine = {};
        if (v > 0) item.lineSpeedByLine[lid] = v;
        else delete item.lineSpeedByLine[lid];
        inp.classList.toggle('has-override', v > 0);
        saveLibrary();
        row.querySelector('.lib-item-btn.per-line').classList.toggle('active', hasPerLineSpeed(item));
      });
    });
    if (!lockedByBento) {
      const delBtn = row.querySelector('.lib-item-btn.del');
      delBtn.addEventListener('click', () => {

          text: `删除品名「${item.name}」?`,
          sub: isDup ? '库中还会保留另一条同名条目' : '该品名将从库中移除',
          confirmText: '删除',
          danger: true,
          onConfirm: () => {
            library = library.filter(x => x.id !== item.id);
            saveLibrary();
            if (editingLibId === item.id) cancelEditLib();
            renderLibList();
          }

    libList.appendChild(row);
  });

  libLineSpeedInput.value = item.lineSpeed || '';
  libPeopleInput.value = (item.people === '?' || item.people === '？') ? '?' : (item.people || '');
  libMeterPeopleInput.value = item.meterPeople > 0 ? item.meterPeople : 1;
  selectedColor = item.color;

function cancelEditLib() {
