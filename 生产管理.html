<html lang="zh-CN">
<head>

<title>生产管理</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0f1115;color:#e8e8e8;font:14px/1.4 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden;touch-action:pan-y pinch-zoom;overscroll-behavior:none}
.tabs{display:flex;height:44px;background:#0a0c10;border-bottom:1px solid #2a2d33;align-items:center;padding:0 8px;gap:4px;flex-wrap:nowrap;overflow-x:hidden;touch-action:manipulation}
.tabs button{font:inherit;color:#888;background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 14px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;white-space:nowrap;flex:0 0 auto}
.tabs button:hover{background:#15181d;color:#e8e8e8}
.tabs button.active{background:#fb923c;color:#000;border-color:#fb923c;font-weight:600}
.tabs .spacer{flex:1 1 auto}
.tabs .io-btn{border:none;color:#bbb;padding:5px 10px;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.tabs .io-btn:hover{color:#fb923c;background:transparent}
.frame-wrap{position:fixed;top:44px;left:0;right:0;bottom:0;background:#0f1115;overflow:hidden}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0f1115;transform:translateX(100%);transition:transform .32s cubic-bezier(.4,0,.2,1);pointer-events:none;will-change:transform}
iframe.active{pointer-events:auto}
@media (max-width:600px){.tabs button{padding:6px 10px;font-size:13px}.tabs .io-btn{padding:5px 8px;font-size:12px}}
/* 导出提醒横幅 */
#export-reminder{position:fixed;bottom:16px;right:16px;background:#f59e0b;color:#14181f;padding:10px 14px;border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.5);z-index:200;font-size:13px;display:flex;align-items:center;gap:10px;max-width:calc(100vw - 32px);font-weight:500;animation:reminderIn .25s ease-out}
@keyframes reminderIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
#export-reminder button{background:#14181f;color:#f59e0b;border:none;padding:5px 12px;border-radius:5px;cursor:pointer;font:inherit;font-weight:600}
#export-reminder button:hover{background:#000;color:#fff}
#export-reminder .close{background:transparent;color:#14181f;padding:0 4px;font-size:18px;line-height:1}
#export-reminder .close:hover{background:transparent;color:#000}
</style>
</head>
<body>

  <button data-app="plan" class="active">🏭 生产计划板</button>
  <button data-app="config">⚙ 配置表</button>
  <button data-app="schedule">📅 岗位排班表</button>
  <span class="spacer"></span>
  <button class="io-btn" id="importAllBtn" title="导入全部三个 app 的数据(覆盖现有)">导入</button>
  <button class="io-btn" id="exportAllBtn" title="导出全部三个 app 的数据到一个 JSON 文件">导出</button>
</div>
<div class="frame-wrap">
  <iframe data-app="plan"></iframe>
  <iframe data-app="config"></iframe>
  <iframe data-app="schedule"></iframe>
</div>

<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>岗位排班表</title>
<style>
:root{
  /* 与配置表共用色板,保证三个 app 视觉一致 */
  --bg:#0f1115; --card:#1a1d22; --border:#2a2d33;
  --text:#e8e8e8; --muted:#888;
  --accent:#fb923c; --ok:#10b981; --warn:#f59e0b; --danger:#ef4444;
  --line-xs:#f59e0b; --line-l01:#3b82f6; --line-l02:#06b6d4;
  --line-l03:#10b981; --line-l04:#ec4899; --line-l05:#f97316;
  --line-tsk:#8b5cf6;
  --r-card:12px; --r-btn:8px;
  --font: -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  --font-mono: ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;background:transparent;border:1px solid var(--border);border-radius:var(--r-btn);padding:8px 12px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover{background:#1f1f23}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:#fa8520}
input,select{font:inherit;color:inherit;background:#1f1f23;border:1px solid var(--border);border-radius:var(--r-btn);padding:8px 10px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.nav{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.nav .brand{font-weight:600;margin-right:auto}
.nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.page{padding:16px;max-width:1400px;margin:0 auto}
.hidden{display:none!important}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:0;margin-bottom:16px;overflow:hidden}
.card-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:2px solid var(--border);font-weight:600}
.card .muted{color:var(--muted);font-weight:400;font-size:13px}

.line-tabs{display:none;gap:4px;margin-bottom:12px;overflow-x:auto}

.line-card{margin-bottom:0}
.assign-list{list-style:none;margin:0;padding:8px 16px 16px}
.assign-list li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)}
.assign-list li:last-child{border-bottom:none}
.assign-list .pos-name{flex:1;color:var(--muted);font-size:13px}

</style>
</head>

<script>
const Util = (() => {
  const todayISO = () => {
    const d = new Date();
    const z = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
  };
  const prevDay = iso => {
    const d = new Date(iso + 'T00:00:00');
    d.setDate(d.getDate()-1);
    const z = n => String(n).padStart(2,'0');
    return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;
  };
  const uid = (prefix='p') => prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const clone = obj => JSON.parse(JSON.stringify(obj));
  return { todayISO, prevDay, uid, clone };
})();

<script>
const JpHolidays = (() => {
  const pad = n => String(n).padStart(2,'0');
  const iso = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
  const nthMonday = (y, m, n) => {
    const first = new Date(y, m-1, 1);
    const firstMon = ((8 - first.getDay()) % 7) + 1;
    return firstMon + (n-1)*7;
  };
  const vernal = y => Math.floor(20.8431 + 0.242194 * (y - 1980)) - Math.floor((y - 1980) / 4);
  const autumnal = y => Math.floor(23.2488 + 0.242194 * (y - 1980)) - Math.floor((y - 1980) / 4);
  function compute(y){
    const list = [
      [1, 1, '元日'],
      [1, nthMonday(y,1,2), '成人の日'],
      [2, 11, '建国記念の日'],
      [2, 23, '天皇誕生日'],
      [3, vernal(y), '春分の日'],
      [4, 29, '昭和の日'],
      [5, 3, '憲法記念日'],
      [5, 4, 'みどりの日'],
      [5, 5, 'こどもの日'],
      [7, nthMonday(y,7,3), '海の日'],
      [8, 11, '山の日'],
      [9, nthMonday(y,9,3), '敬老の日'],
      [9, autumnal(y), '秋分の日'],
      [10, nthMonday(y,10,2), 'スポーツの日'],
      [11, 3, '文化の日'],
      [11, 23, '勤労感謝の日'],
    ];
    const map = new Map();
    list.forEach(([m,d,name]) => map.set(iso(y,m,d), name));
    // 振替休日: holiday on Sunday → next non-holiday day becomes a substitute
    list.forEach(([m,d]) => {
      const dt = new Date(y, m-1, d);
      if(dt.getDay() === 0){
        do { dt.setDate(dt.getDate()+1); } while(map.has(iso(dt.getFullYear(), dt.getMonth()+1, dt.getDate())));
        map.set(iso(dt.getFullYear(), dt.getMonth()+1, dt.getDate()), '振替休日');
      }
    });
    // 国民の休日: any non-Sunday weekday sandwiched between two holidays
    [...map.keys()].sort().forEach(k => {
      const [yy,mm,dd] = k.split('-').map(Number);
      const between = new Date(yy, mm-1, dd-1);
      const before = new Date(yy, mm-1, dd-2);
      const bIso = iso(before.getFullYear(), before.getMonth()+1, before.getDate());
      const mIso = iso(between.getFullYear(), between.getMonth()+1, between.getDate());
      if(map.has(bIso) && !map.has(mIso) && between.getDay() !== 0){
        map.set(mIso, '国民の休日');
      }
    });
    return map;
  }
  const cache = new Map();
  function forYear(y){ if(!cache.has(y)) cache.set(y, compute(y)); return cache.get(y); }
  function nameOf(isoStr){
    const y = Number(isoStr.slice(0,4));

<script>
const Store = (() => {
  const KEY = 'shift-schedule-data-v1';
  const DEFAULT_LINES = [
    {id:'xs', name:'夕盛'},
    {id:'l01', name:'01'}, {id:'l02', name:'02'},
    {id:'l03', name:'03'}, {id:'l04', name:'04'}, {id:'l05', name:'05'},
    {id:'tsk', name:'値付け'}
  ];
  function emptyData(){
    const positions = {}; DEFAULT_LINES.forEach(l => positions[l.id]=[]);
    return { version:1, lines:Util.clone(DEFAULT_LINES), positions, people:[], schedules:{}, lastExportAt:null, lastChangeAt:null };
  }
  function sanitize(s){
    const d = emptyData();
    if(!s || typeof s !== 'object') return d;
    s.version = 1;
    s.lines = Array.isArray(s.lines) && s.lines.length ? s.lines : d.lines;
    const _lineIds = new Set(s.lines.map(l => l.id));
    d.lines.forEach(dl => { if(!_lineIds.has(dl.id)) s.lines.push(dl); });
    s.positions = (s.positions && typeof s.positions === 'object') ? s.positions : {};
    s.lines.forEach(l => { if(!Array.isArray(s.positions[l.id])) s.positions[l.id] = []; });
    s.people = Array.isArray(s.people) ? s.people : [];
    s.schedules = (s.schedules && typeof s.schedules === 'object') ? s.schedules : {};
    for(const date in s.schedules){
      for(const ln in s.schedules[date]){
        for(const pos in s.schedules[date][ln]){
          const v = s.schedules[date][ln][pos];
          if(v && !Array.isArray(v)) s.schedules[date][ln][pos] = [v];
          else if(Array.isArray(v) && v.length === 0) s.schedules[date][ln][pos] = null;
        }
      }
    }
    if(s.lastExportAt === undefined) s.lastExportAt = null;
    if(s.lastChangeAt === undefined) s.lastChangeAt = null;
    return s;
  }
  let state = emptyData();
  const listeners = new Set();
  function load(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        state = sanitize(Object.assign(emptyData(), parsed));
      } else {
        state = emptyData();
      }
    }catch(e){ console.warn('load failed', e); state = emptyData(); }
  }
  function save(){
    state.lastChangeAt = new Date().toISOString();
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ console.warn('save failed', e); }
    listeners.forEach(fn => fn());
    broadcastSchedule();
  }
  function broadcastSchedule(){
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({
          type: 'schedule-changed',
          lines: state.lines,
          positions: state.positions,
          people: state.people,
          schedules: state.schedules
        }, '*');
      }
    } catch (e) {}
  }
  window.addEventListener('message', (e) => {
    if (!e.data || typeof e.data !== 'object') return;
    if (e.data.type === 'schedule-request') broadcastSchedule();
  });
  // 加载完后广播一次,让其他 iframe 同步初始数据
  setTimeout(broadcastSchedule, 0);
  function subscribe(fn){ listeners.add(fn); return () => listeners.delete(fn); }
  function get(){ return state; }
  function replace(newState){ state = sanitize(Object.assign(emptyData(), newState)); save(); }
  function reset(){ state = emptyData(); save(); }

  // People
  function addPerson(name, homeLine){
    state.people.push({ id: Util.uid('p'), name: name.trim(), homeLine });
    save();
  }
  function updatePerson(id, patch){
    const p = state.people.find(x=>x.id===id); if(!p) return;
    Object.assign(p, patch); save();
  }
  function deletePerson(id){
    state.people = state.people.filter(p=>p.id!==id);
    for(const date in state.schedules){
      for(const ln in state.schedules[date]){
        for(const pos in state.schedules[date][ln]){
          const v = state.schedules[date][ln][pos];
          if(Array.isArray(v)){
            const filtered = v.filter(pid => pid !== id);
            state.schedules[date][ln][pos] = filtered.length ? filtered : null;
          }
        }
      }
    }
    save();
  }
  function findPersonUsage(id){
    let count = 0;
    for(const date in state.schedules){
      for(const ln in state.schedules[date]){
        for(const pos in state.schedules[date][ln]){
          const v = state.schedules[date][ln][pos];
          if(Array.isArray(v) && v.includes(id)) count++;
        }
      }
    }
    return count;
  }

  // Positions
  function addPosition(lineId, name){
    if(!state.positions[lineId]) state.positions[lineId]=[];
    state.positions[lineId].push(name.trim()); save();
  }
  function renamePosition(lineId, idx, newName){
    state.positions[lineId][idx] = newName.trim(); save();
  }
  function deletePosition(lineId, idx){
    state.positions[lineId].splice(idx,1); save();
  }
  function movePosition(lineId, idx, dir){
    const arr = state.positions[lineId]; const j = idx+dir;
    if(j<0 || j>=arr.length) return;
    [arr[idx], arr[j]] = [arr[j], arr[idx]]; save();
  }

  // Schedules
  function ensureDay(date){
    if(!state.schedules[date]){
      state.schedules[date] = {};
      state.lines.forEach(l => state.schedules[date][l.id] = {});
    }
  }
  function getDay(date){
    const day = state.schedules[date];
    const out = {};
    state.lines.forEach(l => {
      out[l.id] = {};
      const positions = state.positions[l.id] || [];
      positions.forEach(pos => {
        const v = day && day[l.id] && day[l.id][pos];
        out[l.id][pos] = Array.isArray(v) ? v : (v ? [v] : []);
      });
    });
    return out;
  }
  function assign(date, lineId, posName, personIds){
    ensureDay(date);
    if(!state.schedules[date][lineId]) state.schedules[date][lineId] = {};
    if(personIds == null || (Array.isArray(personIds) && personIds.length === 0)){
      state.schedules[date][lineId][posName] = null;
    } else if(Array.isArray(personIds)){
      state.schedules[date][lineId][posName] = personIds.slice(0, 3);
    } else {
      state.schedules[date][lineId][posName] = [personIds];
    }
    save();
  }
  function clearDay(date){
    ensureDay(date);
    state.lines.forEach(l => { state.schedules[date][l.id] = {}; });
    save();
  }
  function copyDay(fromDate, toDate){
    if(!state.schedules[fromDate]) return false;
    ensureDay(toDate);
    state.schedules[toDate] = Util.clone(state.schedules[fromDate]);
    save();
    return true;
  }
  function lastScheduledDate(beforeDate){
    const keys = Object.keys(state.schedules).filter(d => d < beforeDate).sort();
    return keys.length ? keys[keys.length-1] : null;
  }
  function assignedPeopleOnDay(date, exceptLine, exceptPos){
    const set = new Set();
    const day = state.schedules[date]; if(!day) return set;
    for(const ln in day){
      for(const pos in day[ln]){
        if(ln===exceptLine && pos===exceptPos) continue;
        const v = day[ln][pos];
        if(Array.isArray(v)) v.forEach(id => set.add(id));
        else if(v) set.add(v);
      }
    }
    return set;
  }

  function markExported(){ state.lastExportAt = new Date().toISOString(); save(); }

  return {
    load, save, subscribe, get, replace, reset,
    addPerson, updatePerson, deletePerson, findPersonUsage,
    addPosition, renamePosition, deletePosition, movePosition,
    ensureDay, getDay, assign, clearDay, copyDay, lastScheduledDate, assignedPeopleOnDay,
    markExported, emptyData,
  };
})();

    updateAutosaveStatus();
  }

  const DOW_JP_S = ['日','月','火','水','木','金','土'];
  function openCopyDayHost(){
    const host = document.getElementById('copy-day-host');
    const sched = Store.get().schedules || {};
    const todayIso = Util.todayISO();
    const dates = Object.keys(sched).filter(d => d !== currentDate && sched[d]).sort((a,b) => b.localeCompare(a));
    const items = dates.length === 0
      ? '<div class="empty">还没有其他日期的排班数据</div>'
      : dates.map(d => {
          const [y,m,da] = d.split('-').map(Number);
          const dow = new Date(y, m-1, da).getDay();
          let cnt = 0;
          const dd = sched[d];
          if (dd) for (const ln in dd) for (const pos in dd[ln]) {
            const v = dd[ln][pos];
            if (Array.isArray(v)) cnt += v.length;
            else if (v) cnt++;
          }
          const isToday = d === todayIso;
          return `<div class="item${isToday?' today':''}" data-date="${d}">
            <span class="date">${d}</span>
            <span class="dow">（${DOW_JP_S[dow]}）</span>
            <span class="meta">${cnt} 人${isToday?' · 今日':''}</span>
          </div>`;
        }).join('');
    const def = Util.prevDay(currentDate);
    host.innerHTML = `
      <div class="copy-modal" data-stop>
        <div class="head">
          <span class="title">复制某日排班 → ${currentDate}</span>
          <button class="close" type="button" data-close>×</button>
        </div>
        <div class="row">
          <input type="date" id="copy-day-input" value="${def}" max="${currentDate}">
          <button id="copy-day-do" type="button">复制</button>
        </div>
        <div class="list-label">已保存的日期</div>
        <div class="list">${items}</div>
      </div>
    `;
    host.classList.remove('hidden');
    host.querySelector('[data-close]').onclick = () => host.classList.add('hidden');
    host.onclick = (e) => { if (e.target === host) host.classList.add('hidden'); };
    host.querySelector('.copy-modal').onclick = (e) => e.stopPropagation();
    host.querySelector('#copy-day-do').onclick = () => {
      const v = (host.querySelector('#copy-day-input').value || '').trim();
      if (!v) return;
      doCopyFromSchedDate(v);
    };
    host.querySelectorAll('.item').forEach(it => {
      it.onclick = () => doCopyFromSchedDate(it.dataset.date);
    });
  }
  function doCopyFromSchedDate(srcDate){
    if (srcDate === currentDate) { alert('源日期不能是当前日期'); return; }
    if (!Store.get().schedules[srcDate]) { alert(`${srcDate} 暂无排班数据`); return; }
    if (!confirm(`将 ${srcDate} 的排班复制到 ${currentDate},覆盖当前数据?`)) return;
    Store.copyDay(srcDate, currentDate);
    document.getElementById('copy-day-host').classList.add('hidden');
  }

  function openPicker(lineId, posName){
    const host = document.getElementById('picker-host');
    const s = Store.get();
    let query = '';

    function getCurrentIds(){
      const v = Store.get().schedules[currentDate]?.[lineId]?.[posName];
      return Array.isArray(v) ? v.slice() : (v ? [v] : []);
    }

    function render(){
      const currentIds = getCurrentIds();
      const used = Store.assignedPeopleOnDay(currentDate, lineId, posName);
      const q = query.trim().toLowerCase();
      const match = p => !q || p.name.toLowerCase().includes(q);
      const home = s.people.filter(p => p.homeLine===lineId && match(p)).sort(byName);
      const others = s.people.filter(p => p.homeLine!==lineId && match(p)).sort(byName);
      const row = (p) => {
        const selected = currentIds.includes(p.id);
        const full = currentIds.length >= 3 && !selected;
        const disabled = (used.has(p.id) && !selected) || full;
        return `<div class="person-row ${disabled?'disabled':''} ${selected?'selected':''}" data-pid="${p.id}">
          <span class="check">${selected ? '✓' : ''}</span>
          <span class="pname">${escapeHtml(p.name)}</span>
          <span class="home">${s.lines.find(l=>l.id===p.homeLine)?.name||''}</span>
        </div>`;
      };
      host.innerHTML = `
        <div class="picker">
          <div class="ph-head">
            <div class="title">选择 ${escapeHtml(s.lines.find(l=>l.id===lineId).name)} · ${escapeHtml(posName)} <span class="count">${currentIds.length}/3</span></div>
            <button data-act="close">✕</button>
          </div>
          <div class="ph-search"><input id="picker-search" placeholder="搜索…" value="${escapeHtml(query)}" autofocus></div>
          <div class="ph-body">
            <div class="section-title">本线人员 (${home.length})</div>
            ${home.length? home.map(row).join('') : '<div class="muted" style="padding:8px 4px">（无)</div>'}
            ${others.length? `<details><summary class="section-title" style="cursor:pointer">借调 (${others.length})</summary>${others.map(row).join('')}</details>` : ''}
          </div>
          <div class="btn-row">
            <button data-act="clear">清空</button>
            <div class="spacer"></div>
            <button data-act="done" class="primary">完成</button>
          </div>
        </div>
      `;
      host.classList.remove('hidden');
      const close = () => { host.classList.add('hidden'); host.innerHTML=''; };
      host.querySelector('[data-act="close"]').onclick = close;
      host.querySelector('[data-act="done"]').onclick = close;
      host.querySelector('[data-act="clear"]').onclick = () => { Store.assign(currentDate, lineId, posName, null); render(); };
      host.querySelectorAll('.person-row').forEach(r => {
        if(r.classList.contains('disabled')) return;
        r.onclick = () => {
          const ids = getCurrentIds();
          const i = ids.indexOf(r.dataset.pid);
          if(i >= 0) ids.splice(i, 1);
          else if(ids.length < 3) ids.push(r.dataset.pid);
          Store.assign(currentDate, lineId, posName, ids.length ? ids : null);
          render();
        };
      });
      const search = host.querySelector('#picker-search');
      search.addEventListener('input', e => { query = e.target.value; render(); search.focus(); search.setSelectionRange(query.length, query.length); });
      host.onclick = e => { if(e.target===host) close(); };
    }
    render();
  }

  function updateAutosaveStatus(){
    const el = document.getElementById('autosave-status'); if(!el) return;
    const s = Store.get();
    const change = s.lastChangeAt ? new Date(s.lastChangeAt) : null;
    const exp = s.lastExportAt ? new Date(s.lastExportAt) : null;
    if(!change){ el.textContent = '✓ 暂无数据'; el.style.color = 'var(--muted)'; return; }
    if(!exp || change > exp){
      el.textContent = '⚠ 有未导出的更改';
      el.style.color = 'var(--warn)';
    } else {
      el.textContent = '✓ 已暂存 · 已导出';
      el.style.color = 'var(--ok)';
    }
  }

  function doExport(){
    const data = Store.get();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const z = n => String(n).padStart(2,'0');
    const d = new Date();
    a.href = url;
    a.download = `岗位排班表${String(d.getFullYear()).slice(-2)}-${z(d.getMonth()+1)}-${z(d.getDate())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    Store.markExported();
  }

  function doImport(){
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/json,.json';
    input.addEventListener('change', () => {
      const file = input.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try{
          const incoming = JSON.parse(reader.result);
          if(!incoming || typeof incoming !== 'object' || !Array.isArray(incoming.lines)){
            alert('文件格式不正确'); return;
          }
          const cur = Store.get();
          const hasExisting = cur.people.length || Object.keys(cur.schedules).length;
          let mode = 'replace';
          if(hasExisting){
            const ans = confirm('确定用此文件覆盖当前全部数据?\n\n确定 = 覆盖(建议先导出备份)\n取消 = 合并模式(保留现有内容并合并新数据)');
            mode = ans ? 'replace' : 'merge';
          }
          if(mode === 'replace'){
            Store.replace(incoming);
          } else {
            const merged = Util.clone(Store.get());
            const byId = new Map(merged.people.map(p=>[p.id,p]));
            (incoming.people||[]).forEach(p => byId.set(p.id, p));
            merged.people = [...byId.values()];
            (incoming.lines||[]).forEach(l => {
              const a = merged.positions[l.id] || [];
              const b = (incoming.positions||{})[l.id] || [];
              const set = new Set(a);
              b.forEach(x => { if(!set.has(x)){ a.push(x); set.add(x); } });
              merged.positions[l.id] = a;
            });
            Object.assign(merged.schedules, incoming.schedules||{});
            Store.replace(merged);
          }
          alert('导入完成');
        }catch(err){ alert('解析失败: ' + err.message); }
      };
      reader.readAsText(file);
    });
    input.click();
  }

  return { renderSettings, renderPeople, renderSchedule, openPicker, updateAutosaveStatus, doImport, doExport, escapeHtml };
})();

<script>
(function(){
  if(!location.search.includes('test=1')) return;
  const KEY = 'shift-schedule-data-v1';
  const backup = localStorage.getItem(KEY);
  const results = [];
  const assert = (name, cond, detail='') => results.push({name, ok: !!cond, detail});

  // Util
  assert('todayISO returns YYYY-MM-DD', /^\d{4}-\d{2}-\d{2}$/.test(Util.todayISO()));
  assert('prevDay subtracts one day', Util.prevDay('2026-03-01')==='2026-02-28');
  assert('prevDay handles month boundary', Util.prevDay('2026-01-01')==='2025-12-31');
  assert('uid returns string with prefix', Util.uid('p').startsWith('p'));
  assert('clone produces independent copy', (()=>{const a={x:[1]};const b=Util.clone(a);b.x.push(2);return a.x.length===1;})());

  // Store
  localStorage.removeItem(KEY);
  Store.replace(Store.emptyData());
  Store.addPosition('xs','岗位A');
  Store.addPosition('xs','岗位B');
  assert('addPosition stores in order', JSON.stringify(Store.get().positions.xs)==='["岗位A","岗位B"]');
  Store.movePosition('xs',0,1);
  assert('movePosition swaps', Store.get().positions.xs[0]==='岗位B');
  Store.renamePosition('xs',0,'岗位B2');
  assert('renamePosition updates', Store.get().positions.xs[0]==='岗位B2');
  Store.deletePosition('xs',0);
  assert('deletePosition removes', Store.get().positions.xs.length===1);

  Store.addPerson('张三','xs');
  const pid = Store.get().people[0].id;
  assert('addPerson creates with id', !!pid && Store.get().people[0].name==='张三');
  Store.updatePerson(pid,{name:'张三丰'});
  assert('updatePerson updates fields', Store.get().people[0].name==='张三丰');

  Store.addPosition('xs','岗位C');
  Store.assign('2026-05-26','xs','岗位C', [pid]);
  assert('assign stores person ids as array', Array.isArray(Store.get().schedules['2026-05-26'].xs['岗位C']) && Store.get().schedules['2026-05-26'].xs['岗位C'][0]===pid);
  assert('findPersonUsage counts assignments', Store.findPersonUsage(pid)===1);

  const day = Store.getDay('2026-05-26');
  assert('getDay returns all lines', Object.keys(day).length===7);
  assert('getDay returns positions as arrays', Array.isArray(day.xs['岗位C']) && day.xs['岗位C'][0]===pid);

  const usedExceptC = Store.assignedPeopleOnDay('2026-05-26','xs','岗位C');
  assert('assignedPeopleOnDay excludes exceptPos', !usedExceptC.has(pid));
  Store.assign('2026-05-26','xs','岗位A', [pid]);
  const usedAlsoA = Store.assignedPeopleOnDay('2026-05-26','xs','岗位C');
  assert('assignedPeopleOnDay includes others', usedAlsoA.has(pid) && !usedAlsoA.has('xxx'));

  // Multi-person at one position
  Store.get().people.push({id:'p2', name:'李四', homeLine:'xs'});
  Store.assign('2026-05-26','xs','岗位C', [pid, 'p2']);
  assert('assign supports multiple people', Store.get().schedules['2026-05-26'].xs['岗位C'].length===2);
  assert('findPersonUsage spans positions', Store.findPersonUsage(pid)===2);
  Store.assign('2026-05-26','xs','岗位C', [pid, 'p2', 'p3', 'p4']);
  assert('assign caps at 3', Store.get().schedules['2026-05-26'].xs['岗位C'].length===3);

  Store.copyDay('2026-05-26','2026-05-27');
  assert('copyDay copies assignments', Store.get().schedules['2026-05-27'].xs['岗位C'][0]===pid);

  Store.deletePerson(pid);
  assert('deletePerson removes person', !Store.get().people.find(p=>p.id===pid));
  assert('deletePerson removes from arrays', !Store.get().schedules['2026-05-26'].xs['岗位C'].includes(pid));
  assert('deletePerson keeps others', Store.get().schedules['2026-05-26'].xs['岗位C'].includes('p2'));
  Store.assign('2026-05-26','xs','岗位C', null);
  assert('assign null clears position', Store.get().schedules['2026-05-26'].xs['岗位C']===null);

  assert('lastScheduledDate returns most recent before', Store.lastScheduledDate('2026-06-01')==='2026-05-27');

  // Render results
  const div = document.createElement('div');
  div.style.cssText='position:fixed;inset:0;background:#000;color:#fff;padding:16px;overflow:auto;z-index:9999;font-family:monospace;font-size:12px';
  const pass = results.filter(r=>r.ok).length;
  div.innerHTML = `<h3>Tests: ${pass}/${results.length} passed</h3>` +
    results.map(r => `<div style="color:${r.ok?'#10b981':'#ef4444'}">${r.ok?'✓':'✗'} ${r.name}${r.detail?' — '+r.detail:''}</div>`).join('');
  document.body.appendChild(div);
  // Restore real user data (do NOT leave test data in either localStorage or in-memory store)
  if(backup !== null) localStorage.setItem(KEY, backup); else localStorage.removeItem(KEY);
  Store.load();
})();

<script>
(function(){
  Store.load();
  const pages = ['schedule','people','settings'];
  const renderers = {
    schedule: Pages.renderSchedule,
    people: Pages.renderPeople,
    settings: Pages.renderSettings,
  };
  let current = 'schedule';
  function route(name){
    if(!pages.includes(name)) name='schedule';
    current = name;
    pages.forEach(p => document.getElementById('page-'+p).classList.toggle('hidden', p!==name));
    document.querySelectorAll('.nav button[data-route]').forEach(b => b.classList.toggle('active', b.dataset.route===name));
    if(location.hash !== '#/'+name) location.hash = '#/'+name;
    renderers[name]();
  }
  document.querySelectorAll('.nav button[data-route]').forEach(b => b.addEventListener('click', () => route(b.dataset.route)));
  document.querySelectorAll('.nav button[data-action]').forEach(b => b.addEventListener('click', () => {
    if(b.dataset.action === 'import') Pages.doImport();
    else if(b.dataset.action === 'export') Pages.doExport();
  }));
  window.addEventListener('hashchange', () => route((location.hash.match(/^#\/(\w+)/)||[])[1]));
  Store.subscribe(() => renderers[current]());
  route((location.hash.match(/^#\/(\w+)/)||[])[1]);
})();

  .card.rest .compact-time { color: var(--rest); }
  .card.rest .card-name-display { color: var(--rest); }

  .rest-tag {

  .line-foot {
    flex-shrink: 0;

    border-top: 1px solid var(--border-strong);
    padding: 9px 11px;
  }
  .foot-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .foot-row:last-child { margin-bottom: 0; }
  .foot-label { color: var(--text-mute); font-size: 10px; letter-spacing: 0.4px; font-weight: 500; }
  .foot-val { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }
  .foot-val.time { color: var(--accent); font-size: 14px; }
  .foot-val.finish { color: var(--blue); font-size: 14px; }
  .actual-finish-wrap {
    display: inline-flex; align-items: center; gap: 4px;
    cursor: pointer;
    background: transparent; border: 1px dashed transparent;
    /* 右侧不留 padding/margin,确保 input 右边缘和上面"结束"行数字右边缘对齐 */
    padding: 1px 0 1px 6px; border-radius: 4px; margin: -1px 0 -1px -6px;
    transition: border-color 0.15s var(--ease), background 0.15s var(--ease);
  }
  .actual-finish-wrap:hover { border-color: rgba(255,255,255,0.12); background: rgba(255,255,255,0.03); }
  .actual-finish-wrap:focus-within { border-color: var(--rest); background: rgba(167,139,250,0.08); }
  .foot-val.actual-finish {
    color: var(--rest); font-size: 14px;
    background: transparent; border: none;
    padding: 0; margin: 0 -3px 0 0;
    font-family: inherit; font-variant-numeric: tabular-nums;
    outline: none; cursor: pointer;
    color-scheme: dark;
    -webkit-appearance: none; appearance: none;
    /* 在 wrapper 里不要 flex-grow,让图标 + 时间整体贴右 */
    flex: 0 0 auto; width: auto; min-width: 0;
    text-align: right;
  }
  /* 干掉原生右侧的小箭头/图标,因为我们已在左边放了自己的 🕐 */
  .foot-val.actual-finish::-webkit-calendar-picker-indicator { display: none; -webkit-appearance: none; }
  .foot-val.actual-finish::-webkit-inner-spin-button,
  .foot-val.actual-finish::-webkit-clear-button { display: none; }
  /* 去掉 Chrome 内部 datetime 编辑区的默认 padding,让数字紧贴 input 右边缘 */
  .foot-val.actual-finish::-webkit-datetime-edit,
  .foot-val.actual-finish::-webkit-datetime-edit-fields-wrapper { padding: 0; margin: 0; }
  /* 显式把 Chrome 时间输入的各个字段都染成紫色;font 从 input 继承,这样手机端 JS 缩字号能跟随 */
  .foot-val.actual-finish::-webkit-datetime-edit,
  .foot-val.actual-finish::-webkit-datetime-edit-fields-wrapper,
  .foot-val.actual-finish::-webkit-datetime-edit-hour-field,
  .foot-val.actual-finish::-webkit-datetime-edit-minute-field,
  .foot-val.actual-finish::-webkit-datetime-edit-text,

    color: var(--rest);
    font: inherit;
    font-variant-numeric: tabular-nums;

  .foot-val .unit { color: var(--text-mute); font-size: 10px; font-weight: 400; margin-left: 2px; }

  .pager {
    display: none; position: fixed; bottom: 8px; left: 50%;

    border: 1px solid var(--border); border-radius: 20px;

  .pager .pip { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); transition: all 0.2s; }
  .pager .pip.active { background: var(--accent); width: 18px; border-radius: 3px; }
  @media (max-width: 900px) { .pager { display: none; } }

  @media (max-width: 900px) and (orientation: portrait) {
    .line-config { display: none; }
    .card { z-index: 2; }
    .grid-line { z-index: 0; }
    /* 列分隔线：直接给 .line 加右边框，保证延伸到视口最底部 */
    .board { gap: 0; background: transparent; }
    .line { border-right: 1px solid var(--border); min-height: calc(100vh - 52px); }
    .line:last-child { border-right: none; }
    /* 竖屏线头：夕盛(上) → +品名(中) → +休息(下)，底部留空隙 */
    .timeline-head { height: 88px; }
    .line-head { padding: 4px 4px 8px; gap: 3px; height: 88px; }
    .line-head-row1 { flex-direction: column; align-items: stretch; justify-content: space-between; gap: 3px; width: 100%; flex: 1; }
    /* 统一 line-num 字号与盒模型，保证 夕盛 / 01-05 与下方 LINE 都在同一基线上 */
    .line-num, .line-num.xiusheng {
      display: block; height: auto; line-height: 1;
      font-size: 14px; font-weight: 800;
      text-align: left;
    }
    .line-label { text-align: left; line-height: 1; margin-top: 2px; }
    .head-btns { flex-direction: column; gap: 3px; margin-left: 0; width: 100%; }
    .head-btn { width: 100%; justify-content: center; height: 20px; }
    /* 竖屏底部统计栏：固定布局，不因数字过长而换行/竖排；数字过长时由 JS 缩放字号 */
    .line-foot { padding: 8px 8px; overflow: hidden; box-sizing: border-box; }
    /* 4 行各占固定 18px,行间距 2px;input 的原生高度被压到一致 */
    .line-foot .foot-row { gap: 4px; flex-wrap: nowrap; min-width: 0; align-items: center; height: 18px; margin-bottom: 2px; }
    .line-foot .foot-row:last-child { margin-bottom: 0; }
    .line-foot .foot-label { flex: 0 0 auto; white-space: nowrap; }
    .line-foot .foot-val { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-align: right; }
    /* 实结 input + wrapper 都限制成 18px 高,避免比其他行高 */
    .line-foot .actual-finish-wrap { height: 18px; padding-top: 0; padding-bottom: 0; margin-top: 0; margin-bottom: 0; }
    .line-foot .foot-val.actual-finish { height: 18px; line-height: 18px; }
    /* 数量数字固定 10px */
    .line-foot .qty-total { font-size: 10px !important; }
  }

  /* 手机横屏:用 max-height 精准匹配 (iPhone 横屏宽可能 > 900px) */
  @media (orientation: landscape) and (max-height: 500px) {
    .timeline-head {
      height: 108px !important;
      padding: 4px 2px 6px !important;
      justify-content: center !important;

    .date-year {

      font-size: 8px !important;
      letter-spacing: 0.5px !important;

  @media (max-width: 900px) and (orientation: landscape) {
    .line-head { height: 108px; padding-bottom: 12px; }

  /* 移动端弹出窗口与桌面一致：浮动定位贴近卡片，由 JS 计算 */

  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(5, 8, 13, 0.55);
    z-index: 100; display: none;
    align-items: center; justify-content: center;
    padding: 20px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .modal-mask.show { display: flex; animation: maskIn 0.16s var(--ease); }
  @keyframes maskIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: var(--panel-elevated);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-lg);
    width: 100%; max-width: 640px;
    max-height: 85vh; display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
    animation: modalIn 0.18s var(--ease);

  .modal-head {

  .modal-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
  .modal-body::-webkit-scrollbar { width: 4px; }
  .modal-body::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

  .color-picker {

<script>
const LINE_COUNT = 6;
const STORAGE_LIB = 'productLibrary_v3';
const STORAGE_BOARD_PREFIX = 'productionBoard_v1_';
const STORAGE_BOARD_LEGACY = 'productionBoard_v1';
const STORAGE_CURRENT_DATE = 'productionBoardCurrentDate';
// 配置表(便当库)使用的 localStorage 键 — 与 data-config iframe 中的 STORAGE_KEY 保持一致
const BENTO_STORAGE_KEY = 'bento-conveyor-v1';
let bentoMap = new Map();
function setBentoMapFromArray(bentos) {
  bentoMap = new Map();
  (Array.isArray(bentos) ? bentos : []).forEach(b => {
    if (b && typeof b.name === 'string' && b.name.trim()) bentoMap.set(b.name.trim(), b);
  });
}
function refreshBentoMapFromStorage() {
  try {
    const raw = localStorage.getItem(BENTO_STORAGE_KEY);
    if (!raw) { bentoMap = new Map(); return; }
    const s = JSON.parse(raw);
    setBentoMapFromArray(s && s.bentos);
  } catch (e) { bentoMap = new Map(); }
}
// 兼容旧调用名:刷新策略改为优先用最近一次 postMessage 数据;若无则读 localStorage
function refreshBentoMap() {
  if (bentoMap && bentoMap.size > 0) return; // 已经有 postMessage 同步的数据,不要被本地存储覆盖
  refreshBentoMapFromStorage();
}
// 把便当库的 名字 / LINE 速度 / 人数覆盖到品名库匹配项上;返回受影响 lib 项的 id 列表
// 链接策略:优先 bentoId(可跟随便当改名);若无 bentoId 或失效则按 name 兜底匹配,并写入 bentoId 形成稳定链接
// 注意:调用前请先用 refreshBentoMapFromStorage() 或 setBentoMapFromArray() 准备好 bentoMap
function applyBentoOverlay() {
  const bentoIdMap = new Map();
  for (const b of bentoMap.values()) {
    if (b && b.id) bentoIdMap.set(b.id, b);
  }
  const affected = [];
  if (!Array.isArray(library)) return affected;
  library.forEach(item => {
    if (!item) return;
    const wasLinked = !!item._bentoLinked;
    const prevName = item.name;
    const prevSpeed = item.lineSpeed;
    const prevPeople = item.people;
    let b = null;
    // 1) 用 bentoId 找(便当改名也能跟随)
    if (item.bentoId) {
      b = bentoIdMap.get(item.bentoId) || null;
      if (!b) delete item.bentoId; // 便当已被删除,清掉失效链接
    }
    // 2) 兜底:用名字找;命中即写入 bentoId 建立稳定链接
    if (!b && item.name) {
      const m = bentoMap.get(item.name.trim());
      if (m) { b = m; if (m.id) item.bentoId = m.id; }
    }
    if (b) {
      item._bentoLinked = true;
      if (typeof b.name === 'string' && b.name.trim()) item.name = b.name.trim();
      const spd = parseFloat(b.speed);
      if (spd > 0) item.lineSpeed = spd;
      if (Array.isArray(b.line)) item.people = b.line.length;
    } else {
      item._bentoLinked = false;
    }
    if (wasLinked !== item._bentoLinked
        || prevName !== item.name
        || prevSpeed !== item.lineSpeed
        || prevPeople !== item.people) {
      affected.push(item.id);
    }
  });
  // 3) 自动建项:便当库里有但品名库还没对应项的便当,直接生成一条新品名(已链接)
  const linkedIds = new Set();
  library.forEach(it => { if (it && it.bentoId) linkedIds.add(it.bentoId); });
  for (const b of bentoMap.values()) {
    if (!b || !b.id || linkedIds.has(b.id)) continue;
    // 名字撞库时建立链接,不重复创建
    const byName = library.find(it => it && it.name && b.name && it.name.trim() === b.name.trim());
    if (byName) {
      byName.bentoId = b.id;
      byName._bentoLinked = true;
      const spd = parseFloat(b.speed);
      if (spd > 0) byName.lineSpeed = spd;
      if (Array.isArray(b.line)) byName.people = b.line.length;
      linkedIds.add(b.id);
      if (!affected.includes(byName.id)) affected.push(byName.id);
      continue;
    }
    const newItem = {
      id: uid(),
      name: (b.name || '').trim(),
      speed: 0, // 品名速度:便当库没有此字段,由用户后续手动填写
      lineSpeed: parseFloat(b.speed) > 0 ? parseFloat(b.speed) : 0,
      people: Array.isArray(b.line) ? b.line.length : 0,
      meterPeople: 1,
      color: COLORS[library.length % COLORS.length],
      bentoId: b.id,
      _bentoLinked: true
    };
    library.push(newItem);
    linkedIds.add(b.id);
    affected.push(newItem.id);
  }
  return affected;
}
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
let currentDate = localStorage.getItem(STORAGE_CURRENT_DATE) || todayStr();
function boardKey(date) { return STORAGE_BOARD_PREFIX + (date || currentDate); }
// 旧版数据迁移:把无日期的 productionBoard_v1 转到今天键(如果今天还没数据)
(function migrateOldBoard() {
  const legacy = localStorage.getItem(STORAGE_BOARD_LEGACY);
  if (!legacy) return;

function fmtPeople(v) {

function parsePeople(raw) {

function fmtDuration(seconds) {
  if (!isFinite(seconds) || seconds <= 0) return '—';
  const s = Math.round(seconds);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const ss = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;
  return `${m}:${String(ss).padStart(2,'0')}`;
}
function fmtDurationHM(seconds) {
  if (!isFinite(seconds) || seconds <= 0) return '—';
  const totalMin = Math.round(seconds / 60);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}`;
  return `0:${String(m).padStart(2,'0')}`;
}
function parseClock(str) {
  if (!str || !/^\d{1,2}:\d{2}$/.test(str)) return null;
  const [h, m] = str.split(':').map(Number);
  if (h > 23 || m > 59) return null;
  return h * 3600 + m * 60;
}
function fmtClock(totalSec) {
  if (!isFinite(totalSec) || totalSec < 0) return '—';
  const dayOffset = Math.floor(totalSec / 86400);
  const rem = totalSec % 86400;
  const h = Math.floor(rem / 3600);
  const m = Math.floor((rem % 3600) / 60);
  const base = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  return dayOffset > 0 ? `${base}+${dayOffset}d` : base;
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function secToPx(sec) {
  const baseSec = TIME_START_HOUR * 3600;
  const hourPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour-px'));
  return ((sec - baseSec) / 3600) * hourPx;
}
function getTotalPx() {
  const hourPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hour-px'));
  return (TIME_END_HOUR - TIME_START_HOUR) * hourPx;
}

function renderTimeline() {
  const totalPx = getTotalPx();
  timelineInner.style.height = (totalPx + 16) + 'px';
  timelineInner.innerHTML = '';
  const totalMin = (TIME_END_HOUR - TIME_START_HOUR) * 60;
  for (let m = 0; m <= totalMin; m += TIME_TICK_MIN) {
    const hour = TIME_START_HOUR + Math.floor(m / 60);
    const min = m % 60;
    const tick = document.createElement('div');
    tick.className = 'tick';
    if (min === 0) tick.classList.add('hour');
    if (hour === 20 && min === 0) tick.classList.add('hour-20');
    tick.style.top = secToPx((hour * 60 + min) * 60) + 'px';
    if (min === 0) {
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = `${String(hour).padStart(2,'0')}:00`;
      tick.appendChild(label);
    }
    timelineInner.appendChild(tick);
  }
}
function renderGridLines(grid) {
  grid.querySelectorAll('.grid-line').forEach(el => el.remove());
  const totalMin = (TIME_END_HOUR - TIME_START_HOUR) * 60;
  for (let m = 0; m <= totalMin; m += TIME_TICK_MIN) {
    const hour = TIME_START_HOUR + Math.floor(m / 60);
    const min = m % 60;
    const ln = document.createElement('div');
    ln.className = 'grid-line';
    if (min === 0) ln.classList.add('hour');
    if (hour === 20 && min === 0) ln.classList.add('hour-20');
    ln.style.top = secToPx((hour * 60 + min) * 60) + 'px';
    grid.appendChild(ln);
  }
}

function renderLibList() {

  }
  // 统计每个 bentoId 被多少个品名库项链接,用于处理"重复共享项"
  const linkCount = new Map();
  library.forEach(it => {

  libList.innerHTML = '';

    // 同一便当被多于 1 项链接时,这些重复项允许手动删除,直至只剩 1 项
    const isDup = item._bentoLinked && (linkCount.get(item.bentoId) || 0) > 1;
    const lockedByBento = item._bentoLinked && !isDup;
    const linkBadge = item._bentoLinked
      ? (isDup

      : '';

      : `<button class="lib-item-btn del" title="${isDup ? '删除重复的共享项' : '删除'}">×</button>`;

function propagateLibChange(libId) {
  const item = findLibItem(libId);
  if (!item) return;
  const affectedLines = new Set();
  document.querySelectorAll(`.card[data-type="job"]`).forEach(card => {
    if (card.dataset.libId !== libId) return;
    card.dataset.name = item.name;
    card.dataset.color = item.color;
    card.style.borderLeftColor = item.color;
    const letterEl = card.querySelector('.compact-name-letter');
    const display = popupQ(card, '.card-name-display');
    if (letterEl) { letterEl.textContent = (item.name || '').charAt(0); letterEl.style.color = item.color || ''; }
    if (display) display.textContent = item.name;
    const lineSpdInp = popupQ(card, '.line-speed');
    const peopleInp = popupQ(card, '.people');
    const meterInp = popupQ(card, '.meter-people');
    if (lineSpdInp) lineSpdInp.value = item.lineSpeed > 0 ? item.lineSpeed : '';
    if (peopleInp) peopleInp.value = (item.people === '?' || item.people === '？') ? '?' : (item.people > 0 ? item.people : '');
    if (meterInp) meterInp.value = item.meterPeople > 0 ? item.meterPeople : 1;
    affectedLines.add(card.closest('.line'));
  });
  affectedLines.forEach(l => l && recalc(l));
  if (affectedLines.size) scheduleSaveBoard();
}

  if (!savedData) {
    scrollCardIntoView(node);
    setActiveCard(node);
    setTimeout(() => node.querySelector('.qty').focus({ preventScroll: true }), 80);
  }
}

function scrollCardIntoView(card) {
  const wrap = card.closest('.cards-wrap');
  if (!wrap) return;
  const cardTop = parseFloat(card.style.top) || 0;
  const cardH = parseFloat(card.style.height) || 26;
  const wrapH = wrap.clientHeight;
  const s = wrap.scrollTop;
  if (cardTop < s + 8) wrap.scrollTop = Math.max(0, cardTop - 20);
  else if (cardTop + cardH > s + wrapH - 8) wrap.scrollTop = Math.max(0, cardTop + cardH - wrapH + 20);
}

function addRestCard(grid, savedData) {
  const node = document.createElement('div');
  node.className = 'card rest';
  node.dataset.type = 'rest';
  const nameVal = savedData?.name != null ? savedData.name : '午休';
  const minVal = savedData?.min != null ? savedData.min : 60;
  const fixedVal = savedData?.fixed || '';
  node.innerHTML = `
    <div class="card-compact">
      <span class="rest-tag">休息</span>
      <span class="compact-name">${escapeHtml(nameVal)}</span>
      <span class="compact-time"></span>
    </div>
    <div class="card-expanded">
      <div class="card-top">
        <span class="rest-tag">休息</span>
        <input class="card-name-display rest-name-input" type="text" value="${escapeHtml(nameVal)}" maxlength="20" style="background:transparent;border:none;color:var(--rest);font-family:inherit;font-size:14px;font-weight:700;outline:none;flex:1;min-width:0;padding:3px 4px;">
        <button class="card-del">×</button>
      </div>
      <div class="card-fields">
        <div class="field">
          <span class="field-label">时长分</span>
          <input class="field-input rest-min" type="number" min="0" step="1" value="${minVal}" inputmode="numeric">
        </div>
        <div class="field">
          <span class="field-label">指定开始</span>
          <input class="field-input rest-fixed" type="time" value="${fixedVal}">
        </div>
      </div>
      <div class="card-meta">
        <span class="range"><span class="t-start">—</span> → <span class="t-end">—</span></span>
      </div>
    </div>
  `;
  wireCardEvents(node, 'rest');
  grid.appendChild(node);
  recalc(grid.closest('.line'));
  if (!savedData) {
    scrollCardIntoView(node);
    setActiveCard(node);
  }
}

// 弹窗查询助手：当 popup 被移到 body 下时，从 card._popup 查找
function popupQ(card, sel) {
  if (card._popup) {
    const inPopup = card._popup.querySelector(sel);
    if (inPopup) return inPopup;
  }
  return card.querySelector(sel);
}

function detachPopup(card) {
  const popup = card.querySelector(':scope > .card-expanded');
  if (popup && popup.parentElement === card) {
    card._popup = popup;
    popup.classList.add('popup-detached');
    popup.classList.toggle('is-rest', card.classList.contains('rest'));
    popup.classList.toggle('is-error', card.classList.contains('error'));
    document.body.appendChild(popup);
  }
}
function reattachPopup(card) {
  if (card._popup) {
    card._popup.classList.remove('popup-detached', 'is-rest', 'is-error');
    card.appendChild(card._popup);
    card._popup = null;
  }
}
function syncPopupState(card) {
  if (!card._popup) return;
  card._popup.classList.toggle('is-rest', card.classList.contains('rest'));
  card._popup.classList.toggle('is-error', card.classList.contains('error'));
}

function setActiveCard(card) {
  if (activeCard && activeCard !== card) {
    activeCard.classList.remove('active');
    reattachPopup(activeCard);
  }
  activeCard = card;
  if (card) {
    card.classList.add('active');
    detachPopup(card);
    requestAnimationFrame(() => {
      ensureRoomForPopup(card);
      positionCardPopup(card);
    });
  }
}

// 若卡片下方空间不足容纳弹窗，向下滚动 wrap 让卡片视觉上移
function ensureRoomForPopup(card) {
  const popup = card._popup || card.querySelector('.card-expanded');
  if (!popup) return;
  popup.style.top = '0px'; popup.style.left = '0px';
  const popupRect = popup.getBoundingClientRect();
  const cardRect = card.getBoundingClientRect();
  const vh = window.innerHeight;
  const margin = 8;
  const spaceBelow = vh - cardRect.bottom - 6;
  const needed = popupRect.height + margin;
  if (spaceBelow >= needed) return;
  const wrap = card.closest('.cards-wrap');
  if (!wrap) return;
  const deficit = needed - spaceBelow;
  const room = wrap.scrollHeight - wrap.clientHeight - wrap.scrollTop;
  const adjust = Math.min(deficit, Math.max(0, room));
  if (adjust > 0) {
    scrollSyncing = true;
    document.querySelectorAll('.cards-wrap').forEach(w => w.scrollTop += adjust);
    timelineBody.scrollTop += adjust;
    scrollSyncing = false;
  }
}

// 弹窗始终贴在卡片下方；若仍不下放则贴底（可与卡片重叠），永不覆盖 sticky 表头(线头/时间轴头)
function getStickyHeadersBottom() {
  // 取所有 sticky 表头里 bottom 最大的(因 line-head 和 timeline-head 都 sticky top:0)
  let maxBottom = 0;
  document.querySelectorAll('.line-head, .timeline-head').forEach(el => {
    const r = el.getBoundingClientRect();
    if (r.bottom > maxBottom) maxBottom = r.bottom;
  });
  return maxBottom;
}
function positionCardPopup(card) {
  const popup = card._popup || card.querySelector('.card-expanded');
  if (!popup) return;
  popup.style.top = '0px'; popup.style.left = '0px';
  popup.style.maxHeight = ''; // 重置后再算
  const cardRect = card.getBoundingClientRect();
  const popupRect = popup.getBoundingClientRect();
  const vw = window.innerWidth, vh = window.innerHeight;
  const margin = 8;
  const minTop = Math.max(margin, getStickyHeadersBottom() + margin); // 不允许进入表头区
  // 限制 popup 高度,确保不会越过表头
  const availH = vh - minTop - margin;
  if (popupRect.height > availH) {
    popup.style.maxHeight = availH + 'px';
  }
  const ph = Math.min(popupRect.height, availH);
  let top = cardRect.bottom + 6;
  if (top + ph + margin > vh) {
    top = Math.max(minTop, vh - ph - margin);
  }
  if (top < minTop) top = minTop;
  let left = cardRect.left;
  if (left + popupRect.width + margin > vw) left = vw - popupRect.width - margin;
  if (left < margin) left = margin;
  popup.style.top = top + 'px';
  popup.style.left = left + 'px';
}

function repositionActivePopup() {
  if (!activeCard) return;
  // 输入框聚焦时（手机端键盘弹起引发的滚动/视口变化）冻结弹窗位置，避免乱飞
  const popup = activeCard._popup;
  if (popup && popup.contains(document.activeElement)) return;
  positionCardPopup(activeCard);
}

function wireCardEvents(node, type) {
  const delBtn = node.querySelector('.card-del');
  const compactDel = node.querySelector('.compact-del');
  if (compactDel) {
    const handleDel = (e) => {
      e.stopPropagation(); e.preventDefault();
      const line = node.closest('.line');
      if (activeCard === node) setActiveCard(null);
      node.remove(); recalc(line); scheduleSaveBoard();
    };
    compactDel.addEventListener('click', handleDel);
    compactDel.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    compactDel.addEventListener('mousedown', (e) => e.stopPropagation());
  }
  let inputsToWatch;
  if (type === 'job') {
    inputsToWatch = [node.querySelector('.meter-people'), node.querySelector('.line-speed'), node.querySelector('.qty'), node.querySelector('.people')];
  } else {
    inputsToWatch = [node.querySelector('.rest-min'), node.querySelector('.rest-fixed'), node.querySelector('.rest-name-input')];
  }
  inputsToWatch.forEach(inp => {
    if (inp) inp.addEventListener('input', () => {
      if (inp.classList.contains('rest-name-input')) node.querySelector('.compact-name').textContent = inp.value || '休息';
      recalc(node.closest('.line'));
      scheduleSaveBoard();
    });
  });
  const meterInp = node.querySelector('.meter-people');
  if (meterInp) {
    meterInp.addEventListener('change', () => {
      const libId = node.dataset.libId;
      if (libId) propagateLibChange(libId);
    });
  }
  delBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const line = node.closest('.line');
    if (activeCard === node) setActiveCard(null);
    node.remove(); recalc(line); scheduleSaveBoard();
  });
  attachCardInteraction(node);
}

// ============ 拖动 & 点击交互 ============
// 短按抬手 → 弹出窗口；按住 350ms 后移动 → 拖动换位
const HOLD_MS = 350;
const MOVE_THRESHOLD = 8;
let dropIndicator = null;

function insertCardInGrid(grid, node, clientY) {
  const after = getDragAfter(grid, clientY);
  if (after == null) grid.appendChild(node); else grid.insertBefore(node, after);
}
function getDragAfter(grid, y) {
  const cards = [...grid.querySelectorAll('.card:not(.dragging)')];
  for (const c of cards) {
    const box = c.getBoundingClientRect();
    if (y < box.top + box.height / 2) return c;
  }
  return null;
}
function ensureDropIndicator() {
  if (!dropIndicator) {
    dropIndicator = document.createElement('div');
    dropIndicator.className = 'drop-indicator';
  }
  return dropIndicator;
}
function updateDropIndicator(grid, clientY) {
  const ind = ensureDropIndicator();
  if (ind.parentElement !== grid) grid.appendChild(ind);
  const rect = grid.getBoundingClientRect();
  ind.style.top = (clientY - rect.top) + 'px';
}
function hideDropIndicator() {
  if (dropIndicator && dropIndicator.parentElement) dropIndicator.parentElement.removeChild(dropIndicator);
}

// ============ 拖拽时边缘自动滚动 ============
// 鼠标/手指停在视口顶部或底部触发区时,自动滚动卡片区域(并同步时间轴/其他列)
let autoScrollRAF = null;
let autoScrollSpeed = 0;
let autoScrollDragCtx = null; // { card, x, y } — 最近一次拖动坐标,用于滚动后重算插入位

// 选出真正能滚的容器:.main(移动端) 或 任意 .cards-wrap(桌面端)
function getScrollContainer() {
  const main = document.querySelector('.main');
  if (main && main.scrollHeight > main.clientHeight + 1) return main;
  const wrap = document.querySelector('.cards-wrap');
  if (wrap && wrap.scrollHeight > wrap.clientHeight + 1) return wrap;
  return null;
}
function applyScroll(delta) {
  const ct = getScrollContainer();
  if (!ct) return false;
  const maxScroll = ct.scrollHeight - ct.clientHeight;
  const before = ct.scrollTop;
  const next = Math.max(0, Math.min(maxScroll, before + delta));
  if (next === before) return false;
  if (ct.classList.contains('main')) {
    ct.scrollTop = next;
  } else {
    // 桌面:同步所有列 + 时间轴
    scrollSyncing = true;
    document.querySelectorAll('.cards-wrap').forEach(w => {
      w.scrollTop = Math.max(0, Math.min(w.scrollHeight - w.clientHeight, w.scrollTop + delta));
    });
    if (timelineBody) timelineBody.scrollTop = Math.max(0, Math.min(timelineBody.scrollHeight - timelineBody.clientHeight, timelineBody.scrollTop + delta));
    scrollSyncing = false;
  }
  return true;
}
function setAutoScroll(speed) {
  autoScrollSpeed = speed;
  if (speed === 0) {
    if (autoScrollRAF) { cancelAnimationFrame(autoScrollRAF); autoScrollRAF = null; }
    return;
  }
  if (autoScrollRAF) return;
  const tick = () => {
    autoScrollRAF = null;
    if (autoScrollSpeed === 0) return;
    const moved = applyScroll(autoScrollSpeed);
    if (!moved) { autoScrollSpeed = 0; return; } // 撞到顶/底就停
    if (autoScrollDragCtx) {
      const { card, x, y } = autoScrollDragCtx;
      reinsertAt(card, x, y);
    }
    autoScrollRAF = requestAnimationFrame(tick);
  };
  autoScrollRAF = requestAnimationFrame(tick);
}
function reinsertAt(card, x, y) {
  card.style.visibility = 'hidden';
  const el = document.elementFromPoint(x, y);
  card.style.visibility = '';
  if (!el) return;
  const grid = el.closest('.cards-grid');
  if (!grid) return;
  insertCardInGrid(grid, card, y);
  updateDropIndicator(grid, y);
}
function updateAutoScrollFromPointer(card, x, y) {
  autoScrollDragCtx = { card, x, y };
  const ct = getScrollContainer();
  if (!ct) { setAutoScroll(0); return; }
  const r = ct.getBoundingClientRect();
  // 触发区:可视区高度 40%(避开 iOS 底部 home 手势区),最小 80,最大 140
  const zone = Math.min(140, Math.max(80, Math.floor((r.bottom - r.top) * 0.4)));
  const minSpeed = 10;  // 进入触发区即可见的移动速度 (~600 px/s)
  const maxSpeed = 28;
  const maxScroll = ct.scrollHeight - ct.clientHeight;
  if (y < r.top + zone && ct.scrollTop > 0) {
    const dist = Math.max(0, y - r.top);
    const speed = minSpeed + (maxSpeed - minSpeed) * (1 - dist / zone);
    setAutoScroll(-Math.round(speed));
  } else if (y > r.bottom - zone && ct.scrollTop < maxScroll) {
    const dist = Math.max(0, r.bottom - y);
    const speed = minSpeed + (maxSpeed - minSpeed) * (1 - dist / zone);
    setAutoScroll(Math.round(speed));
  } else {
    setAutoScroll(0);
  }
}
function stopAutoScroll() {
  setAutoScroll(0);
  autoScrollDragCtx = null;
}

function attachCardInteraction(card) {
  let holdTimer = null;
  let holdReady = false;
  let dragMode = false;
  let movedPastThreshold = false; // 手指/鼠标移过阈值,触发了滚动→ touchend 不应弹窗
  let startX = 0, startY = 0;
  let activePointerId = null;

  function startDrag() {
    holdReady = true;
    card.classList.add('dragging');
    setActiveCard(null);
    if (navigator.vibrate) try { navigator.vibrate(25); } catch (e) {}
  }
  function doDragMove(x, y) {
    dragMode = true;
    reinsertAt(card, x, y);
    updateAutoScrollFromPointer(card, x, y);
  }
  function finalize(wasTap) {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    stopAutoScroll();
    if (dragMode) {
      card.classList.remove('dragging');
      hideDropIndicator();
      document.querySelectorAll('.line').forEach(l => recalc(l));
      scheduleSaveBoard();
    } else if (holdReady) {
      // Held but didn't move — treat as tap
      card.classList.remove('dragging');
      setActiveCard(card);
    } else if (wasTap && !movedPastThreshold) {
      setActiveCard(card);
    }
    holdReady = false; dragMode = false; movedPastThreshold = false; activePointerId = null;
  }

  // --- Touch (mobile): hold-then-drag, with passive control of preventDefault
  card.addEventListener('touchstart', (e) => {
    // 多指(缩放等)直接放弃拖拽,把已有计时器清掉
    if (e.touches.length !== 1) {
      if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
      if (holdReady || dragMode) { card.classList.remove('dragging'); hideDropIndicator(); stopAutoScroll(); }
      holdReady = false; dragMode = false; movedPastThreshold = true; // 缩放后 touchend 也不要弹窗
      return;
    }
    if (e.target.closest('input, button, .card-expanded')) return;
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY;
    holdReady = false; dragMode = false; movedPastThreshold = false;
    holdTimer = setTimeout(startDrag, HOLD_MS);
  }, { passive: true });

  card.addEventListener('touchmove', (e) => {
    if (!holdTimer && !holdReady) return;
    const t = e.touches[0];
    const dx = t.clientX - startX, dy = t.clientY - startY;
    if (!holdReady) {
      if (Math.hypot(dx, dy) > MOVE_THRESHOLD) {
        clearTimeout(holdTimer); holdTimer = null;
        movedPastThreshold = true; // 用户是在滚动,touchend 不要当成 tap
      }
      return;
    }
    e.preventDefault();
    doDragMove(t.clientX, t.clientY);
  }, { passive: false });

  card.addEventListener('touchend', () => finalize(!holdReady));
  card.addEventListener('touchcancel', () => {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    stopAutoScroll();
    if (dragMode || holdReady) { card.classList.remove('dragging'); hideDropIndicator(); }
    holdReady = false; dragMode = false; movedPastThreshold = true;
  });

  // --- Mouse (desktop): move threshold OR hold time triggers drag
  card.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    if (e.target.closest('input, button, .card-expanded')) return;
    startX = e.clientX; startY = e.clientY;
    holdReady = false; dragMode = false;
    holdTimer = setTimeout(startDrag, HOLD_MS);

    const onMove = (me) => {
      const dx = me.clientX - startX, dy = me.clientY - startY;
      if (!holdReady && Math.hypot(dx, dy) > MOVE_THRESHOLD) {
        clearTimeout(holdTimer); holdTimer = null;
        startDrag();
      }
      if (holdReady) doDragMove(me.clientX, me.clientY);
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      finalize(!holdReady);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    e.preventDefault();
  });
}

// 点击卡片之外（且不在弹窗内）关闭弹窗
document.addEventListener('mousedown', (e) => {
  if (!e.target.closest('.card') && !e.target.closest('.card-expanded')) setActiveCard(null);
});
document.addEventListener('touchstart', (e) => {
  if (!e.target.closest('.card') && !e.target.closest('.card-expanded')) setActiveCard(null);
}, { passive: true });

function fitCardCompact(card, height) {
  // 短卡片时减小上下 padding，给圆圈更多空间
  card.style.paddingTop = height < 32 ? '1px' : '';
  card.style.paddingBottom = height < 32 ? '1px' : '';
  const letterEl = card.querySelector('.compact-name-letter');
  if (letterEl) {
    // 圆圈外径 = min(22, 卡片高度 - 2)，下限 10px 保证可读
    const size = Math.max(10, Math.min(22, height - 2));
    letterEl.style.width = size + 'px';
    letterEl.style.height = size + 'px';
    letterEl.style.fontSize = Math.max(7, Math.round(size * 0.62)) + 'px';
    letterEl.style.borderWidth = size < 14 ? '1px' : '1.5px';
  }
  const restTag = card.querySelector('.rest-tag');
  if (restTag) {
    const fs = Math.max(8, Math.min(11, height - 14));
    restTag.style.fontSize = fs + 'px';
    restTag.style.padding = height < 24 ? '1px 4px' : '';
  }
}

function recalc(line) {
  const grid = line.querySelector('.cards-grid');
  const startSec = parseClock(line.querySelector('.start-time').value);
  const gapMin = parseFloat(line.querySelector('.gap').value) || 0;
  const gapSec = gapMin * 60;
  const baseSec = TIME_START_HOUR * 3600;
  let totalQty = 0, totalSec = 0, cursor = startSec, lastEnd = null;
  let prevVisualBottom = -Infinity;
  const cards = grid.querySelectorAll('.card');
  cards.forEach((card, i) => {
    const type = card.dataset.type;
    const tStart = popupQ(card, '.t-start');
    const tEnd = popupQ(card, '.t-end');
    let cardStart = null, cardEnd = null, duration = 0;
    if (type === 'job') {
      const libItem = findLibItem(card.dataset.libId);
      const speed = (libItem && libItem.speed > 0) ? libItem.speed : 0;
      const qty = parseFloat(popupQ(card, '.qty').value) || 0;
      const peopleRaw = popupQ(card, '.people').value;
      const peopleIsQ = (peopleRaw === '?' || peopleRaw === '？');
      const people = peopleIsQ ? 0 : (parseFloat(peopleRaw) || 0);
      const meterPeopleInp = popupQ(card, '.meter-people');
      let meterPeople = Math.max(1, parseInt(meterPeopleInp && meterPeopleInp.value) || 1);
      if (libItem && libItem.meterPeople !== meterPeople) {
        libItem.meterPeople = meterPeople;
        saveLibrary();
      }
      if (speed > 0 && qty > 0 && meterPeople > 0) duration = (qty / (speed * meterPeople)) * 60;
      popupQ(card, '.duration').textContent = '耗时 ' + fmtDuration(duration);
      if (cursor != null && duration > 0) { cardStart = cursor; cardEnd = cursor + duration; cursor = cardEnd + gapSec; lastEnd = cardEnd; }
      totalQty += qty; totalSec += duration;
      const letterEl = card.querySelector('.compact-name-letter');
      if (letterEl) {
        letterEl.textContent = (card.dataset.name || '').charAt(0);
        letterEl.style.color = card.dataset.color || '';
      }
      const peopleEl = card.querySelector('.compact-people');
      if (peopleEl) peopleEl.textContent = peopleIsQ ? '?' : (people > 0 ? String(people) : '—');
      const timeEl = card.querySelector('.compact-time');
      if (timeEl) timeEl.textContent = duration > 0 ? fmtDuration(duration) : '—';
    } else if (type === 'rest') {
      const restMin = parseFloat(popupQ(card, '.rest-min').value) || 0;
      duration = restMin * 60;
      const fixedSec = parseClock(popupQ(card, '.rest-fixed').value);
      let realStart;
      if (fixedSec != null) { realStart = (cursor != null && cursor > fixedSec) ? cursor : fixedSec; } else { realStart = cursor; }
      if (realStart != null && duration > 0) { cardStart = realStart; cardEnd = realStart + duration; cursor = cardEnd; lastEnd = cardEnd; }
      card.querySelector('.compact-time').textContent = duration > 0 ? fmtDuration(duration) : '';
    }
    if (cardStart != null && cardEnd != null) {
      tStart.textContent = fmtClock(cardStart); tEnd.textContent = fmtClock(cardEnd);
      let top = secToPx(cardStart);
      const height = Math.max(secToPx(cardEnd) - secToPx(cardStart), 24);
      if (top < prevVisualBottom + 1) top = prevVisualBottom + 1;
      card.style.top = top + 'px'; card.style.height = height + 'px';
      fitCardCompact(card, height);
      prevVisualBottom = top + height;
      card.classList.toggle('error', cardStart < baseSec || cardEnd > TIME_END_HOUR * 3600);
    } else {
      // 草稿卡片（无耗时）：定位在上一卡片视觉底部之下，无上一卡片则按起始时间放置
      let top;
      if (prevVisualBottom > -Infinity) top = prevVisualBottom + 2;
      else if (startSec != null) top = secToPx(startSec);
      else top = i * 28;
      card.style.top = top + 'px'; card.style.height = '26px';
      fitCardCompact(card, 26);
      prevVisualBottom = top + 26;
      tStart.textContent = '—'; tEnd.textContent = '—';
      if (type === 'job') popupQ(card, '.duration').textContent = '耗时 —';
      card.classList.remove('error');
    }
    syncPopupState(card);
  });
  setFootVal(line.querySelector('.qty-total'), totalQty.toLocaleString());
  setFootVal(line.querySelector('.time-total'), fmtDurationHM(totalSec));
  setFootVal(line.querySelector('.finish-total'), (lastEnd != null) ? fmtClock(lastEnd) : '—');
  mirrorActualFinishSize(line);
  recalcGlobal();
}

function mirrorActualFinishSize(line) {
  const ft = line.querySelector('.finish-total');
  const af = line.querySelector('.actual-finish');
  if (!ft || !af) return;
  // setFootVal 在下一帧才设最终字号,这里也等一帧再读
  requestAnimationFrame(() => {
    af.style.fontSize = getComputedStyle(ft).fontSize;
  });
}

function setFootVal(el, text) {
  if (!el) return;
  el.textContent = text;
  el.style.fontSize = '';
  requestAnimationFrame(() => {
    let fs = parseFloat(getComputedStyle(el).fontSize) || 13;
    let guard = 40;
    while (el.scrollWidth > el.clientWidth + 1 && fs > 4 && guard-- > 0) {
      fs -= 0.5;
      el.style.fontSize = fs + 'px';
    }
  });
}

function recalcGlobal() {
  let q = 0, s = 0, cnt = 0, latestFinish = null;
  document.querySelectorAll('.line').forEach(line => {
    line.querySelectorAll('.card[data-type="job"]').forEach(card => {
      const libItem = findLibItem(card.dataset.libId);
      const speed = (libItem && libItem.speed > 0) ? libItem.speed : 0;
      const qty = parseFloat(popupQ(card, '.qty').value) || 0;
      const mp = Math.max(1, parseInt(popupQ(card, '.meter-people') && popupQ(card, '.meter-people').value) || (libItem && libItem.meterPeople) || 1);
      cnt++; q += qty;
      if (speed > 0 && qty > 0) s += (qty / (speed * mp)) * 60;
    });
    const ft = line.querySelector('.finish-total');
    if (ft && ft.textContent && ft.textContent !== '—') {
      const sec = parseClock(ft.textContent);
      if (sec != null && (latestFinish == null || sec > latestFinish)) latestFinish = sec;
    }
  });
  document.getElementById('totalAll').textContent = `总计 ${q.toLocaleString()} 个`;
  const dur = document.getElementById('totalDur');
  const fin = document.getElementById('totalFinish');
  if (dur) dur.textContent = `耗时 ${fmtDuration(s)}`;
  if (fin) fin.textContent = `结束 ${latestFinish != null ? fmtClock(latestFinish) : '—'}`;
}

// ============ 撤回/重做 ============
const undoStack = [];
const redoStack = [];
const HISTORY_MAX = 100;
let lastSnapshot = null;
let suppressHistory = false;
function snapshotStr() { try { return JSON.stringify(captureState()); } catch (e) { return null; } }
function pushHistory() {
  if (suppressHistory) return;
  const cur = snapshotStr();
  if (cur == null) return;
  if (lastSnapshot != null && lastSnapshot !== cur) {
    undoStack.push(lastSnapshot);
    if (undoStack.length > HISTORY_MAX) undoStack.shift();
    redoStack.length = 0;
  }
  lastSnapshot = cur;
  updateUndoButtons();
}
function updateUndoButtons() {
  const u = document.getElementById('undoBtn');
  const r = document.getElementById('redoBtn');
  if (u) u.disabled = undoStack.length === 0;
  if (r) r.disabled = redoStack.length === 0;
}
function doUndo() {
  if (!undoStack.length) return;
  const cur = snapshotStr();
  const prev = undoStack.pop();
  if (cur != null) redoStack.push(cur);
  suppressHistory = true;
  try { applyState(JSON.parse(prev)); } finally { suppressHistory = false; }
  lastSnapshot = prev;
  markUnsaved();
  updateUndoButtons();
}
function doRedo() {
  if (!redoStack.length) return;
  const cur = snapshotStr();
  const next = redoStack.pop();
  if (cur != null) undoStack.push(cur);
  suppressHistory = true;
  try { applyState(JSON.parse(next)); } finally { suppressHistory = false; }
  lastSnapshot = next;
  markUnsaved();
  updateUndoButtons();
}

function collectAllBoards() {
  const boards = {};
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith(STORAGE_BOARD_PREFIX)) {
      const date = key.slice(STORAGE_BOARD_PREFIX.length);
      try { boards[date] = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
    }
  }
  return boards;
}

function saveJSON() {
  exportMenu && exportMenu.classList.remove('show');
  setActiveCard(null);
  saveBoard();
  const d = new Date();
  const ds = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  const defaultName = `生产计划板${ds}.json`;
  const name = prompt('文件名', defaultName);
  if (!name) return;
  const filename = /\.json$/i.test(name) ? name : name + '.json';
  let library = [];
  try { library = JSON.parse(localStorage.getItem(STORAGE_LIB) || '[]'); } catch (e) {}
  const boards = collectAllBoards();
  // version 2: 包含 boards(全部历史日期); board 字段保留当天数据作旧版兼容
  const payload = { version: 2, type: 'production-board', library, boards, board: boards[currentDate] || {} };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.download = filename;
  a.href = URL.createObjectURL(blob);
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  const dayCount = Object.keys(boards).length;
  showToast(`📤 已保存 ${filename}(${dayCount} 天数据)`);
}

function importJSON() {
  exportMenu && exportMenu.classList.remove('show');
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (data.type !== 'production-board') throw new Error('文件类型不匹配');
        if (!Array.isArray(data.library)) throw new Error('品名库数据结构错误');
        const hasBoards = data.boards && typeof data.boards === 'object' && Object.keys(data.boards).length > 0;
        const hasBoard = data.board && typeof data.board === 'object';
        if (!hasBoards && !hasBoard) throw new Error('计划板数据结构错误');
        const dayCount = hasBoards ? Object.keys(data.boards).length : 1;
        if (!confirm(`将覆盖当前所有数据(导入 ${dayCount} 天),继续?`)) return;
        localStorage.setItem(STORAGE_LIB, JSON.stringify(data.library));
        // 清除旧的每日数据
        const keysToRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(STORAGE_BOARD_PREFIX)) keysToRemove.push(k);
        }
        keysToRemove.forEach(k => localStorage.removeItem(k));
        // 写入新数据(新格式优先,否则按旧格式写入当天)
        if (hasBoards) {
          for (const date in data.boards) {
            localStorage.setItem(STORAGE_BOARD_PREFIX + date, JSON.stringify(data.boards[date]));
          }
        } else {
          localStorage.setItem(boardKey(), JSON.stringify(data.board));
        }
        window.skipAutoSave = true;
        location.reload();
      } catch (e) {
        alert('导入失败: ' + e.message);
      }
    };
    r.readAsText(f);
  };
  inp.click();
}

function captureState() {
  const state = { lines: [], hiddenLines: [...hiddenLines] };
  document.querySelectorAll('.line').forEach(line => {
    const lineData = { startTime: line.querySelector('.start-time').value, gap: line.querySelector('.gap').value, actualFinish: line.querySelector('.actual-finish').value, cards: [] };
    line.querySelectorAll('.card').forEach(card => {
      const type = card.dataset.type;
      if (type === 'job') {
        const _li = findLibItem(card.dataset.libId);
        lineData.cards.push({ type: 'job', libId: card.dataset.libId, name: card.dataset.name, color: card.dataset.color, speed: _li ? _li.speed : '', lineSpeed: popupQ(card, '.line-speed').value, qty: popupQ(card, '.qty').value, people: popupQ(card, '.people').value, meterPeople: popupQ(card, '.meter-people') ? popupQ(card, '.meter-people').value : (_li ? _li.meterPeople : 1) });
      } else if (type === 'rest') {
        lineData.cards.push({ type: 'rest', name: popupQ(card, '.rest-name-input').value, min: popupQ(card, '.rest-min').value, fixed: popupQ(card, '.rest-fixed').value });
      }
    });
    state.lines.push(lineData);
  });
  return state;
}
function saveBoard() {
  try { localStorage.setItem(boardKey(), JSON.stringify(captureState())); } catch (e) {}
}

function applyState(state) {
  if (!state || !state.lines) return;
  if (Array.isArray(state.hiddenLines)) {
    hiddenLines = new Set(state.hiddenLines.map(Number));
    updateBoardLayout();
  }
  document.querySelectorAll('.cards-grid').forEach(g => g.querySelectorAll('.card').forEach(c => c.remove()));
  activeCard = null;
  const lineEls = document.querySelectorAll('.line');
  state.lines.forEach((lineData, idx) => {
    const lineEl = lineEls[idx];
    if (!lineEl) return;
    if (lineData.startTime) lineEl.querySelector('.start-time').value = lineData.startTime;
    if (lineData.gap != null) lineEl.querySelector('.gap').value = lineData.gap;
    lineEl.querySelector('.actual-finish').value = lineData.actualFinish || '';
    const grid = lineEl.querySelector('.cards-grid');
    (lineData.cards || []).forEach(c => {
      if (c.type === 'job') {
        const libItem = findLibItem(c.libId) || { id: c.libId, name: c.name || '未知品名', color: c.color || '#8b949e', speed: parseFloat(c.speed) || 0, lineSpeed: parseFloat(c.lineSpeed) || 0, people: parsePeople(c.people), meterPeople: 1 };
        addJobCard(grid, libItem, c);
      } else if (c.type === 'rest') {
        addRestCard(grid, c);
      }
    });
    recalc(lineEl);
  });
}
function loadBoard() {
  let state;
  try { const raw = localStorage.getItem(boardKey()); if (!raw) return; state = JSON.parse(raw); } catch (e) { return; }
  applyState(state);
}

function updateBoardLayout() {

    line.style.display = hiddenLines.has(+line.dataset.line) ? 'none' : '';

    p.style.display = hiddenLines.has(i + 1) ? 'none' : '';

}

function doCopyFromDate(srcDate) {
  if (!srcDate) return;
  if (srcDate === currentDate) { alert('源日期不能是当前日期'); return; }
  const raw = localStorage.getItem(STORAGE_BOARD_PREFIX + srcDate);
  if (!raw) { alert(`${srcDate} 暂无数据`); return; }
  if (!confirm(`将 ${srcDate} 的生产计划复制到 ${currentDate},覆盖当前数据?`)) return;
  let state;
  try { state = JSON.parse(raw); } catch (e) { alert('复制失败: 数据解析错误'); return; }
  setActiveCard(null);
  document.querySelectorAll('.line').forEach(line => {
    line.querySelectorAll('.card').forEach(c => c.remove());
    const st = line.querySelector('.start-time'); if (st) st.value = '08:00';
    const gp = line.querySelector('.gap'); if (gp) gp.value = '0';
  });
  hiddenLines = new Set();
  applyState(state);
  document.querySelectorAll('.line').forEach(l => recalc(l));
  updateBoardLayout();
  saveBoard();
  undoStack.length = 0; redoStack.length = 0;
  lastSnapshot = snapshotStr();
  updateUndoButtons();
  markUnsaved();
  document.getElementById('copyDayModal').classList.remove('show');
  showToast(`📋 已复制 ${srcDate} 的数据到 ${currentDate}`);
}
