function moveOrSwap(line, posId, targetSlot, targetRow) {
  const pos = line.find(p => p.id === posId);
  if (!pos) return;
  if (pos.slot === targetSlot && pos.row === targetRow) return;
  const occupant = line.find(p => p !== pos && p.slot === targetSlot && p.row === targetRow);
  if (occupant) {
    // swap
    occupant.slot = pos.slot;
    occupant.row = pos.row;
  }
  pos.slot = targetSlot;
  pos.row = targetRow;
  compactSlots(line);
  saveState();
}

function moveLinePosition(line, posId, targetCol, targetRow) {
  const pos = line.find(p => p.id === posId);
  if (!pos) return;
  pos.slot = -1; // detach
  for (const p of line) {
    if (p === pos) continue;
    if (p.slot >= targetCol) p.slot += 1;
  }
  pos.slot = targetCol;
  if (targetRow) pos.row = targetRow;
  // compact
  const used = [...new Set(line.map(p => p.slot))].sort((a,b) => a - b);
  const remap = new Map();
  used.forEach((s, i) => remap.set(s, i + 1));
  for (const p of line) p.slot = remap.get(p.slot);
  saveState();
}

function flipAnimate(oldRects) {
  const wrap = document.querySelector(".line-wrap");
  if (!wrap) return;
  for (const cell of wrap.querySelectorAll(".cell[data-pos-id]")) {
    const r0 = oldRects.get(cell.dataset.posId);
    if (!r0) continue;
    const r1 = cell.getBoundingClientRect();
    const dx = r0.left - r1.left, dy = r0.top - r1.top;
    if (dx === 0 && dy === 0) continue;
    cell.style.transition = "none";
    cell.style.transform = `translate(${dx}px, ${dy}px)`;
    cell.offsetHeight; // force reflow
    requestAnimationFrame(() => {
      cell.style.transition = "transform .28s cubic-bezier(.2,.7,.3,1)";
      cell.style.transform = "";
    });
  }
}

function setupOperateDrag(wrap, bento) {
  for (const cell of wrap.querySelectorAll(".cell[data-pos-id]")) {
    cell.addEventListener("pointerdown", e => startCellPress(e, cell, wrap, bento));
  }
}

function setupOperateDragVertical(wrap, bento) {
  for (const cell of wrap.querySelectorAll(".cell[data-pos-id]")) {
    cell.addEventListener("pointerdown", e => startCellPressVertical(e, cell, wrap, bento));
  }
}

function startCellPressVertical(e, cell, wrap, bento) {
  if (e.button !== undefined && e.button !== 0) return;
  const posId = cell.dataset.posId;
  const origin = cell.getBoundingClientRect();
  const startX = e.clientX, startY = e.clientY;
  let dragging = false, ghost = null, indicator = null, drop = null, highlightedCell = null;
  const blockTouch = ev => { if (dragging) ev.preventDefault(); };
  document.addEventListener("touchmove", blockTouch, { passive: false });

  const timer = setTimeout(() => {
    dragging = true;
    cell.classList.add("dragging");
    ghost = cell.cloneNode(true);
    ghost.classList.remove("dragging");
    ghost.className = "drag-ghost";
    ghost.style.width = origin.width + "px";
    ghost.style.height = origin.height + "px";
    ghost.style.left = (e.clientX - origin.width/2) + "px";
    ghost.style.top = (e.clientY - origin.height/2) + "px";
    document.body.appendChild(ghost);
    indicator = document.createElement("div");
    indicator.className = "drop-indicator";
    document.body.appendChild(indicator);
    try { cell.setPointerCapture(e.pointerId); } catch(_) {}
  }, 350);

  function onMove(ev) {
    if (!dragging) {
      if (Math.hypot(ev.clientX - startX, ev.clientY - startY) > 8) clearTimeout(timer);
      return;
    }
    ev.preventDefault();
    ghost.style.left = (ev.clientX - origin.width/2) + "px";
    ghost.style.top = (ev.clientY - origin.height/2) + "px";

    // Suppress indicator when finger is still inside the dragged cell's original rect
    if (ev.clientX >= origin.left && ev.clientX <= origin.right &&
        ev.clientY >= origin.top && ev.clientY <= origin.bottom) {
      if (highlightedCell) { highlightedCell.classList.remove("drop-target"); highlightedCell = null; }
      indicator.style.display = "none";
      drop = null;
      return;
    }

    const allCells = [...wrap.querySelectorAll(".cell[data-slot]")].filter(c => c !== cell);
    let hitCell = null;
    for (const c of allCells) {
      const r = c.getBoundingClientRect();
      if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) {
        hitCell = c; break;
      }
    }
    if (highlightedCell && highlightedCell !== hitCell) {
      highlightedCell.classList.remove("drop-target"); highlightedCell = null;
    }
    if (hitCell) {
      drop = { mode:"cell", slot: parseInt(hitCell.dataset.slot,10), row: hitCell.dataset.row };
      hitCell.classList.add("drop-target");
      highlightedCell = hitCell;
      indicator.style.display = "none";
    } else {
      indicator.style.display = "";
      // Use .vrow rects directly for slot bounds (each vrow is one slot)
      const vrows = [...wrap.querySelectorAll(".vrow")];
      const slots = [];
      for (const v of vrows) {
        const c = v.querySelector("[data-slot]");
        if (!c) continue;
        const s = parseInt(c.dataset.slot, 10);
        const r = v.getBoundingClientRect();
        slots.push([s, { top: r.top, bottom: r.bottom }]);
      }
      slots.sort((a,b) => a[0] - b[0]);
      const wrapRect = wrap.getBoundingClientRect();
      let targetCol, indicatorY;
      if (slots.length === 0) {
        targetCol = 1; indicatorY = wrapRect.top;
      } else {
        let placed = false;
        for (let i = 0; i < slots.length; i++) {
          const [s, ext] = slots[i];
          const mid = (ext.top + ext.bottom) / 2;
          if (ev.clientY < mid) { targetCol = s; indicatorY = ext.top - 4; placed = true; break; }
        }
        if (!placed) {
          const [lastS, lastExt] = slots[slots.length - 1];
          targetCol = lastS + 1; indicatorY = lastExt.bottom + 2;
        }
      }
      const wrapMidX = wrapRect.left + wrapRect.width / 2;
      const row = ev.clientX < wrapMidX ? "bottom" : "top";
      drop = { mode:"insert", slot:targetCol, row };
      indicator.style.left = wrapRect.left + "px";
      indicator.style.top = indicatorY + "px";
      indicator.style.width = wrapRect.width + "px";
      indicator.style.height = "4px";
    }
  }

  function cleanup() {
    clearTimeout(timer);
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    document.removeEventListener("touchmove", blockTouch, { passive: false });
    if (ghost) ghost.remove();
    if (indicator) indicator.remove();
    if (highlightedCell) highlightedCell.classList.remove("drop-target");
    cell.classList.remove("dragging");
  }

  function onUp() {
    if (!dragging) { cleanup(); return; }
    const d = drop;
    cleanup();
    if (d) {
      if (bento && bento.line) {
        if (d.mode === "cell") moveOrSwap(bento.line, posId, d.slot, d.row);
        else moveLinePosition(bento.line, posId, d.slot, d.row);
      }
      render();
    }
  }
  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onUp);
}

function startCellPress(e, cell, wrap, bento) {
  if (e.button !== undefined && e.button !== 0) return;
  const posId = cell.dataset.posId;
  const origin = cell.getBoundingClientRect();
  const startX = e.clientX, startY = e.clientY;
  let dragging = false;
  let ghost = null, indicator = null;
  let drop = null; // { mode:"cell"|"insert", slot, row } or null
  let highlightedCell = null;
  const blockTouch = ev => { if (dragging) ev.preventDefault(); };
  document.addEventListener("touchmove", blockTouch, { passive: false });

  const timer = setTimeout(() => {
    dragging = true;
    cell.classList.add("dragging");
    ghost = cell.cloneNode(true);
    ghost.classList.remove("dragging");
    ghost.className = "drag-ghost";
    ghost.style.width = origin.width + "px";
    ghost.style.height = origin.height + "px";
    ghost.style.left = (e.clientX - origin.width/2) + "px";
    ghost.style.top = (e.clientY - origin.height/2) + "px";
    document.body.appendChild(ghost);

    indicator = document.createElement("div");
    indicator.className = "drop-indicator";
    document.body.appendChild(indicator);

    try { cell.setPointerCapture(e.pointerId); } catch(_) {}
  }, 350);

  function onMove(ev) {
    if (!dragging) {
      if (Math.hypot(ev.clientX - startX, ev.clientY - startY) > 8) clearTimeout(timer);
      return;
    }
    ev.preventDefault();
    ghost.style.left = (ev.clientX - origin.width/2) + "px";
    ghost.style.top = (ev.clientY - origin.height/2) + "px";

    // Hit-test: is pointer inside any cell (occupied or empty) besides dragged?
    const allCells = [...wrap.querySelectorAll(".cell[data-slot]")].filter(c => c !== cell);
    let hitCell = null;
    for (const c of allCells) {
      const r = c.getBoundingClientRect();
      if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) {
        hitCell = c; break;
      }
    }

    // Clear previous highlight
    if (highlightedCell && highlightedCell !== hitCell) {
      highlightedCell.classList.remove("drop-target");
      highlightedCell = null;
    }

    if (hitCell) {
      // Cell mode: swap with / move into this cell
      drop = { mode: "cell", slot: parseInt(hitCell.dataset.slot, 10), row: hitCell.dataset.row };
      hitCell.classList.add("drop-target");
      highlightedCell = hitCell;
      indicator.style.display = "none";
    } else {
      // Insert mode: find nearest column gap
      indicator.style.display = "";
      const bounds = new Map();
      for (const c of allCells) {
        const s = parseInt(c.dataset.slot, 10);
        const r = c.getBoundingClientRect();
        if (!bounds.has(s)) bounds.set(s, { left: r.left, right: r.right });
        else {
          const v = bounds.get(s);
          v.left = Math.min(v.left, r.left); v.right = Math.max(v.right, r.right);
        }
      }
      const slots = [...bounds.entries()].sort((a,b) => a[0] - b[0]);
      const wrapRect = wrap.getBoundingClientRect();
      let targetCol, indicatorX;
      if (slots.length === 0) {
        targetCol = 1; indicatorX = wrapRect.left;
      } else {
        let placed = false;
        for (let i = 0; i < slots.length; i++) {
          const [s, ext] = slots[i];
          const mid = (ext.left + ext.right) / 2;
          if (ev.clientX < mid) { targetCol = s; indicatorX = ext.left - 6; placed = true; break; }
        }
        if (!placed) {
          const [lastS, lastExt] = slots[slots.length - 1];
          targetCol = lastS + 1; indicatorX = lastExt.right + 2;
        }
      }
      // Row by pointer Y relative to belt midline
      const beltMid = wrapRect.top + wrapRect.height / 2;
      const row = ev.clientY < beltMid ? "top" : "bottom";
      drop = { mode: "insert", slot: targetCol, row };
      indicator.style.left = indicatorX + "px";
      indicator.style.top = wrapRect.top + "px";
      indicator.style.height = wrapRect.height + "px";
    }
  }

  function cleanup() {
    clearTimeout(timer);
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    document.removeEventListener("touchmove", blockTouch, { passive: false });
    if (ghost) ghost.remove();
    if (indicator) indicator.remove();
    if (highlightedCell) highlightedCell.classList.remove("drop-target");
    cell.classList.remove("dragging");
  }

  function onUp() {
    if (!dragging) { cleanup(); return; }
    const d = drop;
    if (d) {
      const oldRects = new Map();
      for (const c of wrap.querySelectorAll(".cell[data-pos-id]")) {
        oldRects.set(c.dataset.posId, c.getBoundingClientRect());
      }
      cleanup();
      if (bento && bento.line) {
        if (d.mode === "cell") moveOrSwap(bento.line, posId, d.slot, d.row);
        else moveLinePosition(bento.line, posId, d.slot, d.row);
      }
      render();
      flipAnimate(oldRects);
    } else {
      cleanup();
    }
  }

  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onUp);
}

let _forceHorizontal = false;
function isVerticalLayout() {
  if (_forceHorizontal) return false;
  return window.matchMedia("(max-width:720px) and (orientation:portrait)").matches;
}
window.addEventListener("beforeprint", () => {
  _forceHorizontal = true;
  _skipFitRaf = true;
  render();
  document.body.classList.add("printing");
  document.body.offsetHeight; // 强制 reflow,让 printing 布局生效后再测
  fitAllCells(document.getElementById("content"), { sync: true, minSize: 6 });
  document.body.classList.remove("printing");
  // _skipFitRaf 留到 afterprint 再清,防止任何 stale rAF 在截屏前夕覆盖我们的同步 fit
});
window.addEventListener("afterprint", () => {
  _forceHorizontal = false;
  _skipFitRaf = false;

});

function renderLineGridVertical(line, cellRenderer) {
  const wrap = document.createElement("div"); wrap.className = "line-wrap";
  const grid = document.createElement("div"); grid.className = "line-grid vertical";
  const N = Math.max(maxSlot(line), 1);
  for (let s = 1; s <= N; s++) {
    const vrow = document.createElement("div"); vrow.className = "vrow";
    vrow.appendChild(cellRenderer(findSlot(line, s, "bottom"), s, "bottom"));
    const belt = document.createElement("div"); belt.className = "vbelt";
    vrow.appendChild(belt);
    vrow.appendChild(cellRenderer(findSlot(line, s, "top"), s, "top"));
    grid.appendChild(vrow);
  }
  wrap.appendChild(grid);
  return wrap;
}

function buildGrid(line, cellRenderer) {
  return isVerticalLayout() ? renderLineGridVertical(line, cellRenderer) : renderLineGrid(line, cellRenderer);
}

let _skipFitRaf = false;
function fitAllCells(root, opts) {
  const sync = opts && opts.sync;
  const minSize = (opts && typeof opts.minSize === "number") ? opts.minSize : 7;
  const work = () => {
    if (!sync && _skipFitRaf) return;
    for (const mats of root.querySelectorAll(".cell .mats")) {
      const items = [...mats.children];
      if (!items.length) continue;
      for (const el of items) el.style.fontSize = "";
      let size = parseFloat(getComputedStyle(items[0]).fontSize);
      let guard = 30;
      while (guard-- > 0 && size > minSize && (mats.scrollHeight > mats.clientHeight + 1 || items.some(el => el.scrollWidth > el.clientWidth + 1))) {
        size -= 1;
        for (const el of items) el.style.fontSize = size + "px";
      }
    }
  };
  if (sync) work(); else requestAnimationFrame(work);
}

function renderLineGrid(line, cellRenderer) {
  const wrap = document.createElement("div"); wrap.className = "line-wrap";
  const grid = document.createElement("div"); grid.className = "line-grid";
  const N = Math.max(maxSlot(line), 1);
  const cols = `repeat(${N}, minmax(var(--cell-min, 120px), 1fr))`;

  const top = document.createElement("div"); top.className = "row"; top.style.gridTemplateColumns = cols;
  const bot = document.createElement("div"); bot.className = "row"; bot.style.gridTemplateColumns = cols;
  for (let s = 1; s <= N; s++) {
    top.appendChild(cellRenderer(findSlot(line, s, "top"), s, "top"));
    bot.appendChild(cellRenderer(findSlot(line, s, "bottom"), s, "bottom"));
  }
  grid.appendChild(top);
  const belt = document.createElement("div"); belt.className = "belt";
  grid.appendChild(belt);
  grid.appendChild(bot);
  wrap.appendChild(grid);
  return wrap;
}

let pickerEl = null;
function closePicker() { if (pickerEl) { pickerEl.remove(); pickerEl = null; } }
function openPicker(anchor, bentoId, posId) {
  closePicker();
  const b = state.bentos.find(x => x.id === bentoId);
  const sel = new Set(b.assignments[posId] || []);
  const p = document.createElement("div"); p.className = "picker";
  if (state.materials.length === 0) {
    p.innerHTML = '<div class="empty">先在「材料库」中添加材料</div>';
  } else {
    const sortedMats = [...state.materials].sort((a, b) => a.name.localeCompare(b.name, "zh-Hans-CN"));
    for (const m of sortedMats) {
      const opt = document.createElement("div");
      opt.className = "opt" + (sel.has(m.id) ? " sel" : "");
      const sw = document.createElement("span"); sw.className = "swatch"; sw.style.background = m.color;
      const nm = document.createElement("span"); nm.textContent = m.name; nm.style.color = m.color;
      opt.appendChild(sw); opt.appendChild(nm);
      opt.onclick = (e) => {
        e.stopPropagation();
        toggleAssignment(bentoId, posId, m.id);
        const nowSel = (b.assignments[posId] || []).includes(m.id);
        opt.classList.toggle("sel", nowSel);
        renderEdit();
      };
      p.appendChild(opt);
    }
  }
  const r = anchor.getBoundingClientRect();
  const isMobilePortrait = window.matchMedia("(max-width:720px) and (orientation:portrait)").matches;
  document.body.appendChild(p);
  const pickerH = p.offsetHeight;
  const spaceBelow = window.innerHeight - r.bottom - 8;
  const spaceAbove = r.top - 8;
  if (isMobilePortrait) {
    p.style.left = "5vw";
    p.style.right = "5vw";
    p.style.width = "auto";
    p.style.minWidth = "0";
    p.style.maxHeight = Math.min(300, Math.max(spaceBelow, spaceAbove, 160)) + "px";
    if (spaceBelow >= Math.min(pickerH, 160)) {
      p.style.top = (r.bottom + 4) + "px";
    } else {
      p.style.bottom = (window.innerHeight - r.top + 4) + "px";
      p.style.top = "auto";
    }
  } else {
    p.style.left = Math.min(r.left, window.innerWidth - 240) + "px";
    if (spaceBelow >= pickerH || spaceBelow >= spaceAbove) {
      p.style.top = (r.bottom + 4) + "px";
    } else {
      p.style.bottom = (window.innerHeight - r.top + 4) + "px";
      p.style.top = "auto";
    }
  }
  pickerEl = p;
  const onDismiss = (ev) => {
    if (pickerEl && !pickerEl.contains(ev.target)) { closePicker(); document.removeEventListener("pointerdown", onDismiss); }
  };
  setTimeout(() => document.addEventListener("pointerdown", onDismiss), 0);
}

function renderEdit() {
  const c = document.getElementById("content");
  c.innerHTML = "";
  const b = state.bentos.find(x => x.id === state.current.editingBentoId);
  if (!b) {
    c.innerHTML = '<p style="color:var(--muted)">无效便当 — <a href="#" id="back-list" style="color:var(--accent)">回便当库</a></p>';
    document.getElementById("back-list").onclick = (e) => { e.preventDefault(); state.current = { ...state.current, screen: "bentos" }; saveState(); render(); };
    return;
  }

  // 确保便当有自己的 line(兼容老数据)。
  // 优先用 b.lineId 对应那条生产线的默认布局,没 lineId 才退回 state.line 全局兜底。
  if (!Array.isArray(b.line) || b.line.length === 0) {
    const tpl = getLineTemplate(b.lineId);
    b.line = tpl.map(p => ({ id: uid("pos"), slot: p.slot, row: p.row, label: p.label }));
    saveState();
  }

  const tb = document.createElement("div"); tb.className = "edit-toolbar";
  const nameInp = document.createElement("input"); nameInp.value = b.name;
  nameInp.onblur = () => {
    if (!renameBento(b.id, nameInp.value)) nameInp.value = b.name;
  };
  // 每个便当在每条生产线上的 LINE 速度可能不一样 —— b.lineSpeeds 是 { lineId: 速度 }。
  // b.speed 始终保持「当前选中那条线」的速度,这样下游(plan 板 / broadcast)代码不动。
  if (!b.lineSpeeds || typeof b.lineSpeeds !== "object") b.lineSpeeds = {};
  // 历史数据兜底:有 b.speed 但 lineSpeeds 里还没存 → 把当前 speed 落到当前 lineId 上
  if (b.lineId && b.speed && b.lineSpeeds[b.lineId] == null) {
    b.lineSpeeds[b.lineId] = b.speed;
  }
  const speedInp = document.createElement("input");
  speedInp.placeholder = "LINE速度";
  speedInp.value = b.speed || "";
  speedInp.style.flex = "0 0 140px";
  speedInp.oninput = () => {
    b.speed = speedInp.value;
    if (b.lineId) b.lineSpeeds[b.lineId] = speedInp.value;
    saveState();
  };
  // 生产线下拉(来自排班表)。値付け(tsk)不允许在便当库里指派 —— 业务约定:値付け线不参与便当生产
  const lineSel = document.createElement("select");
  lineSel.style.cssText = "flex:0 0 130px;background:#1a1d22;border:1px solid var(--line);color:var(--fg);padding:6px 10px;border-radius:4px;font:inherit;font-size:14px";
  const emptyOpt = document.createElement("option"); emptyOpt.value = ""; emptyOpt.textContent = "（未选生产线）";
  lineSel.appendChild(emptyOpt);
  (scheduleData.lines || []).filter(ln => !ln.virtual && ln.id !== 'tsk').forEach(ln => {
    const opt = document.createElement("option");
    opt.value = ln.id; opt.textContent = ln.name;
    lineSel.appendChild(opt);
  });
  // 老数据兜底:如果当前便当之前指派的是 値付け,先把这条 option 临时挂回去显示,让用户能看到再切走
  if (b.lineId === 'tsk') {
    const opt = document.createElement("option");
    opt.value = 'tsk';
    opt.textContent = '値付け（已停用,请改选其他线）';
    opt.style.color = '#f87171';
    lineSel.appendChild(opt);
  }
  lineSel.value = b.lineId || "";
  lineSel.onchange = () => {
    const newLineId = lineSel.value || null;
    if (newLineId === b.lineId) return;
    // 切线之前先把当前 speed 落档到旧 lineId(覆盖前最后存一次)
    if (b.lineId && b.speed) b.lineSpeeds[b.lineId] = b.speed;

    // 「新建状态」= 之前没有 lineId(b.lineId 为 null/空);此时第一次选生产线才弹确认。
    // 「修改状态」= 已经有 lineId,只是换到另一条线;不弹框,只切换生产线 + 同步 speed,
    //               布局(b.line / assignments)保持不变。
    const wasUnset = !b.lineId;

    if (newLineId) {
      b.lineId = newLineId;
      // 把这条线之前存过的 LINE 速度调出来当前生效;没存过就清空让用户填新值
      const saved = b.lineSpeeds[newLineId];
      b.speed = (saved != null && saved !== "") ? saved : "";

      if (wasUnset) {
        // 新建场景:第一次选生产线 → 弹 popover,默认套用该线的卡片布局
        const lineName = (scheduleData.lines || []).find(l => l.id === newLineId)?.name || newLineId;
        showConfirmPopover(lineSel, {
          text: `套用「${lineName}」默认布局?`,
          sub: '会覆盖当前便当的卡片和材料分配',
          confirmText: '套用',
          cancelText: '保持不变',
          onConfirm: () => {
            applyLineTemplateToBento(b, newLineId);
            renderEdit();
          },
          onCancel: () => {
            // 不套用布局,只切换生产线 + 同步 speed
            saveState();
            renderEdit();
          }
        });
        return;
      }
      // 修改场景:布局原样保留,只换 lineId + speed
    } else {
      b.lineId = null;
      // 没选线时 speed 保留显示但不再归属任何线
    }

    renderEdit(); // 刷新 speedInp 的值
  };
  const cardBtn = document.createElement("button"); cardBtn.textContent = "管理卡片";
  const addCardBtn = document.createElement("button"); addCardBtn.textContent = "+ 卡片";

  back.onclick = () => { state.current = { ...state.current, screen: "bentos" }; saveState(); render(); };
  tb.appendChild(nameInp); tb.appendChild(speedInp); tb.appendChild(lineSel); tb.appendChild(addCardBtn); tb.appendChild(cardBtn); tb.appendChild(back); tb.appendChild(done);
  c.appendChild(tb);

  // 卡片管理面板（默认隐藏，按"管理卡片"展开）
  const cardPanel = document.createElement("div");
  cardPanel.className = "line-screen";
  cardPanel.style.display = "none";
  cardPanel.style.marginBottom = "10px";
  cardBtn.onclick = () => {
    const showing = cardPanel.style.display !== "none";
    cardPanel.style.display = showing ? "none" : "";

  };
  const renderCardPanel = () => {

    table.innerHTML = "<thead><tr><th>列号</th><th>排</th><th>位号/名</th><th></th></tr></thead>";
    const tbody = document.createElement("tbody");
    const sorted = b.line.slice().sort((a,bb) => a.slot - bb.slot || (a.row === "top" ? -1 : 1));
    for (const p of sorted) {

      slotInp.onchange = () => {

      const tdRow = document.createElement("td");
      for (const r of ["bottom","top"]) {

        if (p.row === r) rb.checked = true;

        tdRow.appendChild(lab);
      }

      const tdLabel = document.createElement("td");

// === 自定义便当颜色 popover ===
// 解决 native <input type=color> 对话框遮住屏幕、针管(eyedropper)无法取到被遮区域颜色的问题。
// 包含:预设色板 / hex 输入 / EyeDropper API(取色时 popover 自身先隐藏)/ 重置默认。
// 7 色精简预设(覆盖主要色相):ivory · 橙 · 黄 · 绿 · 青绿 · 蓝 · 紫
// 想要其它颜色用「更多颜色」开系统拾色器,或针管取色
const BENTO_COLOR_PRESETS = [
  '#ede6d3','#fb923c','#facc15','#34d399','#5eead4','#60a5fa','#a78bfa'
];
function closeBentoColorPopover() {
  document.querySelectorAll('.bento-color-popover').forEach(p => p.remove());
}
function openBentoColorPopover(anchorEl, bento, onChange) {
  closeBentoColorPopover();
  const pop = document.createElement('div');
  pop.className = 'bento-color-popover';
  const current = bento.color || '#ede6d3';
  pop.innerHTML = `
    <div class="bcp-row">
      <div class="bcp-current"></div>
      <input type="text" class="bcp-hex" maxlength="7" spellcheck="false">
    </div>
    <div class="bcp-palette"></div>
    <div class="bcp-actions">
      <button class="bcp-btn eye" title="从屏幕取色 (针管)">⊕ 取色</button>
      <label class="bcp-btn more" title="调出系统拾色器 — 完整色谱、色相条、RGB/HSL">
        🎨 更多颜色
        <input type="color" class="bcp-native" style="position:absolute;opacity:0;width:1px;height:1px;pointer-events:none">
      </label>
      <button class="bcp-btn reset" title="重置为默认颜色">重置</button>
    </div>
  `;
  document.body.appendChild(pop);

  // 定位:锚点正下方;若下方空间不够、上方空间够,则翻到锚点上方,避免针管按钮等被裁
  const r = anchorEl.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(window.innerWidth - 244, r.left)) + 'px';
  const popH = pop.offsetHeight;
  const spaceBelow = window.innerHeight - r.bottom - 8;
  const spaceAbove = r.top - 8;
  if (popH > spaceBelow && spaceAbove >= popH) {
    pop.style.top = (r.top - popH - 6) + 'px';
  } else {
    // 下方放不下、上方也放不下 → 钳制到视窗内,起码不超出底部
    const top = Math.min(r.bottom + 6, window.innerHeight - popH - 8);
    pop.style.top = Math.max(8, top) + 'px';
  }

  const currentEl = pop.querySelector('.bcp-current');
  const hexInp = pop.querySelector('.bcp-hex');
  const paletteEl = pop.querySelector('.bcp-palette');
  const eyeBtn = pop.querySelector('.bcp-btn.eye');
  const resetBtn = pop.querySelector('.bcp-btn.reset');

  function paint(c) {
    currentEl.style.background = c;
    hexInp.value = c;
  }
  function apply(c) {
    bento.color = c;
    paint(c);
    anchorEl.style.background = c;
    anchorEl.classList.remove('default');
    saveState();
    if (onChange) onChange();
  }
  paint(current);

  // 预设色板
  BENTO_COLOR_PRESETS.forEach(c => {
    const btn = document.createElement('button');
    btn.style.background = c;
    btn.title = c;
    btn.onclick = (e) => { e.stopPropagation(); apply(c); };
    paletteEl.appendChild(btn);
  });

  // hex 输入(实时校验)
  hexInp.addEventListener('input', () => {
    let v = hexInp.value.trim();
    if (v && !v.startsWith('#')) v = '#' + v;
    if (/^#[0-9a-fA-F]{6}$/.test(v)) apply(v);
  });

  // 针管:用浏览器 EyeDropper API。仅桌面 Chrome/Edge 95+ 支持,移动端浏览器全都没有。
  // 不支持的平台直接移除按钮,避免出现「点了没反应」的灰按钮。
  if (typeof window.EyeDropper === 'undefined') {
    eyeBtn.remove();
  } else {
    eyeBtn.onclick = async (e) => {
      e.stopPropagation();
      pop.classList.add('hidden');
      try {
        const res = await new window.EyeDropper().open();
        apply(res.sRGBHex);
      } catch (_) { /* 用户取消 */ }
      pop.classList.remove('hidden');
    };
  }

  // 更多颜色:label + input[type=color] 联动 —— 移动端原生支持,不需要 JS .click()
  const nativeInp = pop.querySelector('.bcp-native');
  nativeInp.value = current;
  nativeInp.addEventListener('input', () => apply(nativeInp.value));

  // 重置
  resetBtn.onclick = (e) => {
    e.stopPropagation();
    if (bento.color) {
      delete bento.color;
      saveState();
      if (onChange) onChange();
    }
    closeBentoColorPopover();
  };

  // 点击 popover 外关闭(下一帧再挂,避免本次 click 立刻把自己关掉)
  setTimeout(() => {
    const onDocClick = (ev) => {
      if (pop.contains(ev.target) || anchorEl.contains(ev.target)) return;
      closeBentoColorPopover();
      document.removeEventListener('mousedown', onDocClick);
    };
    document.addEventListener('mousedown', onDocClick);
  }, 0);
}

function setupAutocomplete() {
  const inp = document.getElementById("bento-search");
  let acEl = null;
  let selIdx = -1;
  let opts = [];

  function close() { if (acEl) { acEl.remove(); acEl = null; selIdx = -1; } }
  function refresh() {
    if (!acEl) return;
    [...acEl.children].forEach((el,i) => el.classList.toggle("sel", i === selIdx));
  }
  function update() {
    close();
    opts = matchBentos(inp.value);
    if (opts.length === 0) return;
    acEl = document.createElement("div"); acEl.className = "autocomplete";
    const r = inp.getBoundingClientRect();
    acEl.style.left = r.left + "px"; acEl.style.top = (r.bottom + 4) + "px";
    for (let i = 0; i < opts.length; i++) {
      const o = opts[i];
      const el = document.createElement("div"); el.className = "opt"; el.textContent = o.name;
      el.onmousedown = (e) => { e.preventDefault(); pick(o); };
      acEl.appendChild(el);
    }
    document.body.appendChild(acEl);
  }
  function pick(b) {
    inp.value = b.name;
    state.current = { ...state.current, screen: "operate", bentoId: b.id };
    saveState(); close(); render();
  }
  inp.addEventListener("focus", update);
  inp.addEventListener("input", update);
  inp.addEventListener("blur", () => setTimeout(close, 100));
  inp.addEventListener("keydown", (e) => {
    if (!acEl) return;
    if (e.key === "ArrowDown") { selIdx = Math.min(selIdx+1, opts.length-1); refresh(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { selIdx = Math.max(selIdx-1, 0); refresh(); e.preventDefault(); }
    else if (e.key === "Enter") {
      if (selIdx >= 0) pick(opts[selIdx]);
      else if (opts.length === 1) pick(opts[0]);
      e.preventDefault();
    } else if (e.key === "Escape") close();
  });
}

for (const b of document.querySelectorAll("header .btn-tab")) {

document.addEventListener("wheel", (e) => {
  const wrap = e.target.closest(".line-wrap");
  if (!wrap) return;
  if (wrap.scrollWidth <= wrap.clientWidth) return;
  const delta = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if (delta === 0) return;
  wrap.scrollLeft += delta;
  e.preventDefault();
}, { passive: false });

function saveJSON() {
  saveState();
  const d = new Date();
  const ds = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  const modal = document.getElementById("save-modal");
  const input = document.getElementById("save-name");
  input.value = "配置表" + ds + ".json";
  modal.classList.add("show");
  setTimeout(() => { input.focus(); input.select(); }, 0);

  function close() {
    modal.classList.remove("show");
    document.getElementById("save-ok").onclick = null;
    document.getElementById("save-cancel").onclick = null;
    input.onkeydown = null;
  }
  function doSave() {
    let name = input.value.trim();
    if (!name) return;
    if (!/\.json$/i.test(name)) name += ".json";
    const payload = {
      version: state.version,
      materials: state.materials,
      line: state.line,
      bentos: state.bentos,
      meta: state.meta,
      _migrations: state._migrations
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
    const a = document.createElement("a");
    a.download = name;
    a.href = URL.createObjectURL(blob);
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    close();
    showBanner(`✓ 已保存 ${state.bentos.length} 个便当 / ${state.materials.length} 个材料 / ${state.line.length} 个位置`, "ok");
  }
  document.getElementById("save-ok").onclick = doSave;
  document.getElementById("save-cancel").onclick = close;
  input.onkeydown = (e) => {
    if (e.key === "Enter") { e.preventDefault(); doSave(); }
    else if (e.key === "Escape") close();
  };
}

function loadHtml2Canvas() {
  if (window.html2canvas) return Promise.resolve(window.html2canvas);
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
    s.onload = () => resolve(window.html2canvas);
    s.onerror = () => reject(new Error("无法加载 html2canvas (检查网络)"));
    document.head.appendChild(s);
  });
}

async function exportImage() {
  const bento = state.current.bentoId ? state.bentos.find(b => b.id === state.current.bentoId) : null;
  const target = document.getElementById("content");
  if (!target) return;
  try {
    const h2c = await loadHtml2Canvas();
    const dpr = Math.max(window.devicePixelRatio || 1, 2);
    const canvas = await h2c(target, {
      backgroundColor: getComputedStyle(document.body).backgroundColor || "#0f1115",
      scale: dpr,
      useCORS: true,
      windowWidth: target.scrollWidth,
      windowHeight: target.scrollHeight
    });
    canvas.toBlob(blob => {
      const a = document.createElement("a");
      a.download = (bento ? bento.name : "配置") + ".png";
      a.href = URL.createObjectURL(blob);
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
  } catch (e) {
    showToast('导出图片失败: ' + e.message, 'error');
  }
}

function importJSON() {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "application/json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let data;

      const last = localStorage.getItem('workbench-last-app');
      if(['schedule','plan','config'].includes(last)) firstApp = last;
    }catch(_){}
  }
  activate(firstApp, true); // 首次定位无动画
  // 预加载其余 iframe(隐藏运行,后台广播数据让跨 app 同步生效)
  setTimeout(() => {
    ['plan','config','schedule'].forEach(app => { if(!loaded.has(app)) ensureLoaded(app); });
  }, 50);
  // 检查导出提醒
  setTimeout(checkExportReminder, 600);
})();
</script>
</body>
</html>
