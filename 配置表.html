<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>便当摆盘指挥屏</title>
<style>
  :root { --bg:#0f1115; --fg:#e8e8e8; --line:#2a2d33; --accent:#fb923c; --soft:#1a1d22; --muted:#888; }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.4 -apple-system,"PingFang SC","Microsoft Yahei",sans-serif;background:var(--bg);color:var(--fg);min-height:100vh}
  #banner{display:none;padding:8px 12px;white-space:pre-wrap;font-family:monospace}
  #banner.show{display:block}
  #banner.ok{background:#14532d;color:#bbf7d0}
  #banner.err{background:#7f1d1d;color:#fecaca}
  header{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:#0a0c10;align-items:center;flex-wrap:wrap}
  header input,header button,header select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#1a1d22;color:var(--fg)}
  header input{min-width:240px}
  header .grow{flex:1}
  header .btn-tab{cursor:pointer}
  header .btn-tab.active{background:var(--accent);color:#000;border-color:var(--accent)}
  #content{padding:16px}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;display:none}
  .backdrop.show{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:340px;background:#0f1115;border-left:1px solid var(--line);transform:translateX(100%);transition:transform .15s;z-index:10;display:flex;flex-direction:column}
  .drawer.show{transform:translateX(0)}
  .drawer header{flex:0 0 auto;padding:12px;border-bottom:1px solid var(--line);font-weight:bold;background:none}
  .drawer .list{flex:1;overflow:auto;padding:8px 12px}
  .drawer .row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
  .drawer .row .swatch{width:24px;height:24px;border-radius:4px;border:1px solid var(--line);cursor:pointer;flex:0 0 auto;padding:0}
  .drawer .row .name{flex:1;background:transparent;border:none;color:var(--fg);font:inherit;padding:4px;min-width:0}
  .drawer .row .name:focus{outline:1px solid var(--accent);border-radius:3px}
  .drawer .row .del{background:transparent;border:none;color:#aaa;cursor:pointer;font-size:18px}
  .drawer .row .del:hover{color:#ef4444}
  .drawer .add{flex:0 0 auto;display:flex;gap:6px;padding:12px;border-top:1px solid var(--line)}
  .drawer .add input{flex:1;background:#1a1d22;border:1px solid var(--line);color:var(--fg);padding:6px;border-radius:4px;font:inherit;min-width:0}
  .drawer .add button{background:var(--accent);color:#000;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;font:inherit}
  .line-grid{display:flex;flex-direction:column;gap:10px;padding:16px 0;width:max-content;min-width:100%}
  .line-grid .row{display:grid;gap:10px}
  .line-grid .cell{background:#1a1d22;border:1px solid var(--line);border-radius:8px;padding:10px;min-height:78px;display:flex;flex-direction:column;position:relative}
  .line-grid .cell.empty{background:transparent;border:1px dashed #2a2d33}
  .line-grid .cell .lbl{position:absolute;top:4px;left:6px;font-size:12px;color:var(--muted);text-align:left;pointer-events:none}
  .line-grid .cell .mats{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:2px;font-size:20px;font-weight:600;line-height:1.2}
  .belt{height:8px;background:linear-gradient(90deg,#1f2937 0,#374151 50%,#1f2937 100%);border-radius:4px;position:relative;margin:6px 0}
  .belt::after{content:"▶";position:absolute;right:-2px;top:-9px;color:var(--accent);font-size:20px}
  .meta-bar{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;margin:4px 0}
  .meta-bar label{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
  .meta-bar input{background:#1a1d22;border:1px solid var(--line);color:var(--fg);padding:5px 8px;border-radius:6px;font:inherit;width:90px;text-align:center}
  .meta-bar input:focus{outline:1px solid var(--accent);border-color:var(--accent)}
  .bento-title{text-align:center;font-size:34px;font-weight:700;letter-spacing:2px;margin:8px 0 4px;min-height:42px}
  .bento-title .muted{color:var(--muted);font-weight:400;font-size:18px}
  .line-wrap{overflow-x:auto}
  .autocomplete{position:absolute;background:#0a0c10;border:1px solid var(--line);border-radius:6px;min-width:240px;max-height:280px;overflow:auto;z-index:5}
  .autocomplete .opt{padding:6px 10px;cursor:pointer}
  .autocomplete .opt:hover,.autocomplete .opt.sel{background:#1a1d22;color:var(--accent)}
  .autocomplete .empty{padding:8px 10px;color:var(--muted)}
  .line-grid .cell[data-pos-id]{cursor:grab;touch-action:none;user-select:none}
  .line-grid .cell.dragging{opacity:.25}
  .drag-ghost{position:fixed;pointer-events:none;z-index:1000;opacity:.92;box-shadow:0 12px 32px rgba(0,0,0,.6);transform:rotate(-2deg) scale(1.04);background:#1a1d22;border:1px solid var(--accent);border-radius:8px;padding:10px;display:flex;flex-direction:column;box-sizing:border-box}
  .drop-indicator{position:fixed;width:4px;background:var(--accent);border-radius:2px;pointer-events:none;z-index:999;box-shadow:0 0 12px var(--accent),0 0 4px var(--accent)}
  .line-grid .cell.drop-target{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 12px var(--accent);background:rgba(251,146,60,.1)}
  .bentos-screen{max-width:720px;margin:0 auto}
  .bentos-screen .toolbar{display:flex;gap:8px;margin-bottom:12px}
  .bentos-screen .toolbar input{flex:1;background:#1a1d22;border:1px solid var(--line);color:var(--fg);padding:6px 10px;border-radius:4px;font:inherit}
  .bentos-screen .toolbar button{background:var(--accent);color:#000;border:none;padding:6px 14px;border-radius:4px;cursor:pointer;font:inherit}
  .bentos-screen .item{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
  .bentos-screen .item .name{flex:1;cursor:pointer;font-size:16px}
  .bentos-screen .item .name:hover{color:var(--accent)}
  .bentos-screen .item button{background:transparent;border:1px solid var(--line);color:var(--fg);padding:4px 10px;border-radius:4px;cursor:pointer}
  .bentos-screen .item button.del:hover{border-color:#ef4444;color:#ef4444}
  .bentos-screen .empty{color:var(--muted);text-align:center;padding:40px}
  .edit-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .edit-toolbar input{flex:1;background:#1a1d22;border:1px solid var(--line);color:var(--fg);padding:6px 10px;border-radius:4px;font:inherit;font-size:18px}
  .edit-toolbar button{background:transparent;border:1px solid var(--line);color:var(--fg);padding:6px 12px;border-radius:4px;cursor:pointer;font:inherit}
  .edit-toolbar .done{background:var(--accent);color:#000;border-color:var(--accent)}
  .line-grid .cell.clickable{cursor:pointer}
  .line-grid .cell.clickable:hover{border-color:var(--accent)}
  .picker{position:fixed;background:#0a0c10;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);padding:6px;z-index:20;max-height:300px;overflow:auto;min-width:200px}
  .picker .opt{padding:6px 8px;cursor:pointer;border-radius:4px;display:flex;align-items:center;gap:8px}
  .picker .opt:hover{background:var(--soft)}
  .picker .opt.sel:before{content:"✓";color:var(--accent);width:14px;display:inline-block}
  .picker .opt:not(.sel):before{content:"";width:14px;display:inline-block}
  .picker .opt .swatch{width:14px;height:14px;border-radius:3px;border:1px solid var(--line)}
  .picker .empty{padding:10px;color:var(--muted);font-size:13px}
  .line-screen{max-width:560px;margin:0 auto}
  .line-screen .actions{display:flex;gap:8px;margin-bottom:12px}
  .line-screen .actions button{background:transparent;border:1px solid var(--line);color:var(--fg);padding:6px 12px;border-radius:4px;cursor:pointer;font:inherit}
  .line-screen .actions .done{background:var(--accent);color:#000;border-color:var(--accent)}
  .line-screen .actions .danger{border-color:#ef4444;color:#ef4444}
  .line-screen table{width:100%;border-collapse:collapse}
  .line-screen th,.line-screen td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
  .line-screen th{color:var(--muted);font-weight:normal;font-size:12px}
  .line-screen td input{background:#1a1d22;border:1px solid var(--line);color:var(--fg);padding:4px 6px;border-radius:4px;font:inherit;width:80px}
  .line-screen td input.label{width:140px}
  .line-screen td label{display:inline-flex;align-items:center;gap:4px;margin-right:8px}
  .line-screen td button.del{background:transparent;border:none;color:#aaa;cursor:pointer;font-size:18px}
  .line-screen td button.del:hover{color:#ef4444}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
  .modal.show{display:flex}
  .modal .box{background:#0f1115;border:1px solid var(--line);border-radius:8px;padding:18px;min-width:320px;max-width:90vw}
  .modal h3{margin:0 0 12px;font-size:16px}
  .modal input{width:100%;background:#1a1d22;border:1px solid var(--line);color:var(--fg);padding:8px 10px;border-radius:6px;font:inherit;box-sizing:border-box}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
  .modal button{background:transparent;border:1px solid var(--line);color:var(--fg);padding:6px 14px;border-radius:6px;cursor:pointer;font:inherit}
  .modal button.primary{background:var(--accent);color:#000;border-color:var(--accent)}
  .menu-wrap{position:relative;display:inline-block}
  .menu{position:absolute;right:0;top:calc(100% + 4px);background:#0a0c10;border:1px solid var(--line);border-radius:6px;min-width:120px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:none;z-index:30}
  .menu.show{display:block}
  .menu-item{padding:8px 12px;cursor:pointer;font:inherit;color:var(--fg)}
  .menu-item:hover{background:var(--soft);color:var(--accent)}
  @media print {
    header, .backdrop, .drawer, .picker, .autocomplete { display:none !important; }
    body{background:#fff;color:#000}
    .line-grid .cell{background:#fff;border-color:#000}
    .belt{background:#ccc}
  }
  @media (max-width: 720px) {
    body{font-size:14px}
    header{padding:6px 8px;gap:6px}
    header input,header button,header select{padding:5px 8px;font-size:13px}
    header input{min-width:0;flex:1 1 120px}
    header .grow{display:none}
    #content{padding:8px}
    .line-grid{padding:8px 0;gap:6px}
    .line-grid .cell{min-height:56px;padding:6px;border-radius:6px;--cell-min:88px}
    .line-grid .cell .lbl{font-size:11px;top:2px;left:4px}
    .line-grid .cell .mats{font-size:15px;gap:1px}
    .bento-title{font-size:22px;min-height:32px;margin:4px 0 2px;letter-spacing:1px}
    .bento-title .muted{font-size:13px}
    .belt{height:6px;margin:4px 0}
    .drawer{width:88vw}
    .picker{max-width:90vw}
    .bentos-screen .item .name{font-size:15px}
    .line-screen td input{width:60px}
    .line-screen td input.label{width:100px}
  }
  @media (max-width: 720px) and (orientation: portrait) {
    .line-grid .cell{--cell-min:78px}
    .line-grid .cell .mats{font-size:14px}
    .line-grid .cell .lbl{font-size:10px}
  }
  @media (max-width: 900px) and (orientation: landscape) and (max-height: 500px) {
    header{padding:4px 8px}
    .bento-title{font-size:18px;min-height:24px;margin:2px 0}
    .line-grid{padding:4px 0;gap:4px}
    .line-grid .cell{min-height:48px;--cell-min:72px}
    .line-grid .cell .mats{font-size:13px}
    .belt{height:5px;margin:3px 0}
  }
</style>
</head>
<body>
<div id="banner"></div>
<header>
  <input id="bento-search" placeholder="便当名…" autocomplete="off">
  <button class="btn-tab" data-screen="operate">操作屏</button>
  <button class="btn-tab" data-screen="bentos">便当库</button>
  <button id="btn-materials">材料库</button>
  <button class="btn-tab" data-screen="line">线设置</button>
  <span class="grow"></span>
  <button id="btn-import">导入</button>
  <div class="menu-wrap"><button id="btn-export">导出 ▾</button>
    <div class="menu" id="export-menu">
      <div class="menu-item" data-act="save">保存</div>
      <div class="menu-item" data-act="print">打印</div>
      <div class="menu-item" data-act="image">导出图片</div>
    </div>
  </div>
</header>
<main id="content"></main>
<div class="backdrop" id="backdrop"></div>
<div class="modal" id="save-modal">
  <div class="box">
    <h3>保存为</h3>
    <input id="save-name" spellcheck="false">
    <div class="actions">
      <button id="save-cancel">取消</button>
      <button id="save-ok" class="primary">保存</button>
    </div>
  </div>
</div>
<aside class="drawer" id="materials-drawer">
  <header>材料库 <button id="materials-close" style="float:right;background:transparent;color:var(--fg);border:1px solid var(--line);padding:2px 8px;border-radius:4px;cursor:pointer">×</button></header>
  <div class="list" id="materials-list"></div>
  <div class="add">
    <input id="materials-name" placeholder="新材料名">
    <button id="materials-add">添加</button>
  </div>
</aside>
<script>
const STORAGE_KEY = "bento-conveyor-v1";

const SEED_LINE = [
  { slot: 1, row: "top",    label: "2" },
  { slot: 1, row: "bottom", label: "1" },
  { slot: 2, row: "top",    label: "3" },
  { slot: 2, row: "bottom", label: "4" },
  { slot: 3, row: "top",    label: "5" },
  { slot: 3, row: "bottom", label: "6" },
  { slot: 4, row: "top",    label: "7" },
  { slot: 4, row: "bottom", label: "8" },
  { slot: 5, row: "top",    label: "フリー1" },
  { slot: 5, row: "bottom", label: "9" },
  { slot: 6, row: "top",    label: "フリー2" },
  { slot: 7, row: "top",    label: "盖盖2" },
  { slot: 7, row: "bottom", label: "盖盖1" },
  { slot: 8, row: "bottom", label: "装框" }
];

function uid(prefix) { return prefix + "-" + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }

function defaultState() {
  return {
    version: 1,
    materials: [],
    line: [],
    bentos: [],
    meta: { people: "", speed: "" },
    current: { screen: "operate", bentoId: null, editingBentoId: null }
  };
}

function seedLineIfEmpty(s) {
  if (s.line.length === 0) {
    s.line = SEED_LINE.map(p => ({ id: uid("pos"), slot: p.slot, row: p.row, label: p.label }));
  }
}

function migrate(s) {
  s._migrations = s._migrations || {};
  if (!s.meta) s.meta = { people: "", speed: "" };
  if (!s._migrations.freeLabels) {
    for (const p of s.line) {
      if (p.label === "10") p.label = "フリー1";
      else if (p.label === "11") p.label = "フリー2";
    }
    s._migrations.freeLabels = true;
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      const s = defaultState();
      seedLineIfEmpty(s);
      return s;
    }
    const s = JSON.parse(raw);
    if (!s || s.version !== 1) {
      const fresh = defaultState();
      seedLineIfEmpty(fresh);
      return fresh;
    }
    seedLineIfEmpty(s);
    migrate(s);
    return s;
  } catch (e) {
    const s = defaultState();
    seedLineIfEmpty(s);
    migrate(s);
    return s;
  }
}

function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let state = loadState();
saveState();

function showBanner(msg, kind) {
  const b = document.getElementById("banner");
  b.textContent = msg;
  b.className = "show " + (kind || "");
}

function randomColor() {
  const hue = Math.floor(Math.random()*360);
  return `hsl(${hue} 70% 65%)`;
}

function addMaterial(name, color) {
  name = (name || "").trim();
  if (!name) return null;
  if (state.materials.some(m => m.name === name)) return null;
  const m = { id: uid("mat"), name, color: color || randomColor() };
  state.materials.push(m);
  saveState();
  return m;
}

function deleteMaterialCascade(id) {
  state.materials = state.materials.filter(m => m.id !== id);
  for (const b of state.bentos) {
    for (const k in b.assignments) {
      b.assignments[k] = b.assignments[k].filter(mid => mid !== id);
    }
  }
  saveState();
}

function updateMaterial(id, patch) {
  const m = state.materials.find(x => x.id === id);
  if (!m) return false;
  if (patch.name !== undefined) {
    const t = patch.name.trim();
    if (!t || state.materials.some(x => x.id !== id && x.name === t)) return false;
    m.name = t;
  }
  if (patch.color !== undefined) m.color = patch.color;
  saveState();
  return true;
}

function countMaterialUsage(matId) {
  let n = 0;
  for (const b of state.bentos) for (const k in b.assignments) if (b.assignments[k].includes(matId)) n++;
  return n;
}

function addSlot() {
  const ns = maxSlot() + 1;
  state.line.push({ id: uid("pos"), slot: ns, row: "bottom", label: String(ns) });
  saveState();
}

function deleteSlotPosition(posId) {
  state.line = state.line.filter(p => p.id !== posId);
  for (const b of state.bentos) delete b.assignments[posId];
  saveState();
}

function updateSlotPosition(posId, patch) {
  const p = state.line.find(x => x.id === posId);
  if (!p) return false;
  if (patch.slot !== undefined) {
    const n = parseInt(patch.slot, 10);
    if (!isFinite(n) || n < 1) return false;
    p.slot = n;
  }
  if (patch.row !== undefined) {
    if (patch.row !== "top" && patch.row !== "bottom") return false;
    p.row = patch.row;
  }
  if (patch.label !== undefined) p.label = String(patch.label);
  saveState();
  return true;
}

function resetLineToSeed() {
  for (const b of state.bentos) b.assignments = {};
  state.line = SEED_LINE.map(p => ({ id: uid("pos"), slot: p.slot, row: p.row, label: p.label }));
  saveState();
}

function toggleAssignment(bentoId, posId, matId) {
  const b = state.bentos.find(x => x.id === bentoId);
  if (!b) return;
  if (!b.assignments[posId]) b.assignments[posId] = [];
  const arr = b.assignments[posId];
  const i = arr.indexOf(matId);
  if (i >= 0) arr.splice(i, 1); else arr.push(matId);
  if (arr.length === 0) delete b.assignments[posId];
  saveState();
}

function addBento(name) {
  name = (name || "").trim();
  if (!name) return null;
  if (state.bentos.some(b => b.name === name)) return null;
  const b = { id: uid("ben"), name, assignments: {} };
  state.bentos.push(b);
  saveState();
  return b;
}

function deleteBento(id) {
  state.bentos = state.bentos.filter(b => b.id !== id);
  if (state.current.bentoId === id) state.current.bentoId = null;
  if (state.current.editingBentoId === id) state.current.editingBentoId = null;
  saveState();
}

function renameBento(id, name) {
  name = (name || "").trim();
  if (!name) return false;
  if (state.bentos.some(b => b.id !== id && b.name === name)) return false;
  const b = state.bentos.find(x => x.id === id);
  if (!b) return false;
  b.name = name;
  saveState();
  return true;
}

function maxSlot() {
  return state.line.reduce((m,p) => p.slot > m ? p.slot : m, 0);
}

function findSlot(slot, row) {
  return state.line.find(p => p.slot === slot && p.row === row);
}

function getBentoByName(name) {
  return state.bentos.find(b => b.name === name);
}

function matchBentos(prefix) {
  const p = (prefix || "").trim().toLowerCase();
  if (!p) return state.bentos.slice(0, 10);
  return state.bentos.filter(b => b.name.toLowerCase().includes(p)).slice(0, 10);
}

function colorToHex(c) {
  if (!c) return "#888888";
  if (c.startsWith("#")) return c;
  const m = c.match(/hsl\((\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)%\s+(\d+(?:\.\d+)?)%\)/);
  if (!m) return "#888888";
  const h = parseFloat(m[1]) / 360, s = parseFloat(m[2]) / 100, l = parseFloat(m[3]) / 100;
  function f(n) {
    const k = (n + h*12) % 12;
    const a = s * Math.min(l, 1-l);
    const v = l - a * Math.max(-1, Math.min(k-3, 9-k, 1));
    return Math.round(v*255).toString(16).padStart(2,"0");
  }
  return "#" + f(0) + f(8) + f(4);
}

function runSelfTests() {
  const tests = [];
  function assert(name, cond, detail="") { tests.push({ name, ok: !!cond, detail }); }

  // seed produces 14 positions across 8 slots
  const s = defaultState();
  seedLineIfEmpty(s);
  assert("seed produces 14 positions", s.line.length === 14, "got " + s.line.length);
  const slots = new Set(s.line.map(p => p.slot));
  assert("seed spans 8 columns", slots.size === 8 && Math.max(...slots) === 8);
  const find = (slot, row) => s.line.find(p => p.slot === slot && p.row === row);
  assert("col1 top is 2", find(1,"top")?.label === "2");
  assert("col1 bottom is 1", find(1,"bottom")?.label === "1");
  assert("col6 has no bottom", !find(6,"bottom"));
  assert("col7 lid pair", find(7,"top")?.label === "盖盖2" && find(7,"bottom")?.label === "盖盖1");
  assert("col8 bottom only", find(8,"bottom")?.label === "装框" && !find(8,"top"));

  // load/save roundtrip
  const before = JSON.stringify(state);
  saveState();
  const reloaded = loadState();
  assert("save/load roundtrip", JSON.stringify({...reloaded, line: reloaded.line.map(p=>({slot:p.slot,row:p.row,label:p.label}))}) === JSON.stringify({...JSON.parse(before), line: JSON.parse(before).line.map(p=>({slot:p.slot,row:p.row,label:p.label}))}));

  // materials cascade
  const snap = JSON.parse(JSON.stringify(state));
  state = defaultState(); seedLineIfEmpty(state);
  const m1 = addMaterial("鸡腿", "#ff0000");
  assert("addMaterial returns object", !!m1 && m1.name === "鸡腿");
  assert("addMaterial dedup by name", addMaterial("鸡腿") === null);
  state.bentos.push({ id:"b1", name:"x", assignments:{ "p1":[m1.id, "other"] } });
  deleteMaterialCascade(m1.id);
  assert("deleteMaterialCascade removes from pool", !state.materials.some(m => m.id === m1.id));
  assert("deleteMaterialCascade removes from assignments", !state.bentos[0].assignments["p1"].includes(m1.id));
  assert("deleteMaterialCascade keeps others", state.bentos[0].assignments["p1"].includes("other"));
  state = snap; saveState();

  // match + max slot
  const snap2 = JSON.parse(JSON.stringify(state));
  state = defaultState(); seedLineIfEmpty(state);
  assert("maxSlot is 8", maxSlot() === 8);
  state.bentos.push({ id:"x", name:"鸡腿便当", assignments:{} }, { id:"y", name:"牛肉便当", assignments:{} });
  assert("matchBentos prefix 鸡", matchBentos("鸡").length === 1);
  assert("matchBentos empty returns all", matchBentos("").length === 2);
  assert("getBentoByName exact", getBentoByName("牛肉便当")?.id === "y");
  state = snap2; saveState();

  // toggleAssignment
  const snap3 = JSON.parse(JSON.stringify(state));
  state = defaultState(); seedLineIfEmpty(state);
  const mA = addMaterial("A");
  const bA = addBento("test便当");
  const pos1 = state.line[0];
  toggleAssignment(bA.id, pos1.id, mA.id);
  assert("toggleAssignment adds", bA.assignments[pos1.id]?.includes(mA.id));
  toggleAssignment(bA.id, pos1.id, mA.id);
  assert("toggleAssignment removes", !bA.assignments[pos1.id] || bA.assignments[pos1.id].length === 0);
  state = snap3; saveState();

  // reset
  const snap4 = JSON.parse(JSON.stringify(state));
  state = defaultState(); seedLineIfEmpty(state);
  const mZ = addMaterial("Z");
  const bZ = addBento("z便当");
  const posX = state.line[0];
  toggleAssignment(bZ.id, posX.id, mZ.id);
  resetLineToSeed();
  assert("reset wipes assignments", Object.keys(bZ.assignments).length === 0);
  assert("reset restores 14 positions", state.line.length === 14);
  state = snap4; saveState();

  const failed = tests.filter(t => !t.ok);
  if (failed.length) {
    showBanner("自检失败:\n" + failed.map(t => "✗ " + t.name + (t.detail?" — "+t.detail:"")).join("\n"), "err");
  } else {
    showBanner("✓ 自检通过 (" + tests.length + " 项)", "ok");
  }
}

function moveOrSwap(posId, targetSlot, targetRow) {
  const pos = state.line.find(p => p.id === posId);
  if (!pos) return;
  if (pos.slot === targetSlot && pos.row === targetRow) return;
  const occupant = state.line.find(p => p !== pos && p.slot === targetSlot && p.row === targetRow);
  if (occupant) {
    // swap
    occupant.slot = pos.slot;
    occupant.row = pos.row;
  }
  pos.slot = targetSlot;
  pos.row = targetRow;
  saveState();
}

function moveLinePosition(posId, targetCol, targetRow) {
  const pos = state.line.find(p => p.id === posId);
  if (!pos) return;
  pos.slot = -1; // detach
  for (const p of state.line) {
    if (p === pos) continue;
    if (p.slot >= targetCol) p.slot += 1;
  }
  pos.slot = targetCol;
  if (targetRow) pos.row = targetRow;
  // compact
  const used = [...new Set(state.line.map(p => p.slot))].sort((a,b) => a - b);
  const remap = new Map();
  used.forEach((s, i) => remap.set(s, i + 1));
  for (const p of state.line) p.slot = remap.get(p.slot);
  saveState();
}

function flipAnimate(oldRects) {
  const wrap = document.querySelector(".line-wrap");
  if (!wrap) return;
  for (const cell of wrap.querySelectorAll(".cell[data-pos-id]")) {
    const r0 = oldRects.get(cell.dataset.posId);
    if (!r0) continue;
    const r1 = cell.getBoundingClientRect();
    const dx = r0.left - r1.left, dy = r0.top - r1.top;
    if (dx === 0 && dy === 0) continue;
    cell.style.transition = "none";
    cell.style.transform = `translate(${dx}px, ${dy}px)`;
    cell.offsetHeight; // force reflow
    requestAnimationFrame(() => {
      cell.style.transition = "transform .28s cubic-bezier(.2,.7,.3,1)";
      cell.style.transform = "";
    });
  }
}

function setupOperateDrag(wrap) {
  for (const cell of wrap.querySelectorAll(".cell[data-pos-id]")) {
    cell.addEventListener("pointerdown", e => startCellPress(e, cell, wrap));
  }
}

function startCellPress(e, cell, wrap) {
  if (e.button !== undefined && e.button !== 0) return;
  const posId = cell.dataset.posId;
  const origin = cell.getBoundingClientRect();
  const startX = e.clientX, startY = e.clientY;
  let dragging = false;
  let ghost = null, indicator = null;
  let drop = null; // { mode:"cell"|"insert", slot, row } or null
  let highlightedCell = null;

  const timer = setTimeout(() => {
    dragging = true;
    cell.classList.add("dragging");
    ghost = cell.cloneNode(true);
    ghost.classList.remove("dragging");
    ghost.className = "drag-ghost";
    ghost.style.width = origin.width + "px";
    ghost.style.height = origin.height + "px";
    ghost.style.left = (e.clientX - origin.width/2) + "px";
    ghost.style.top = (e.clientY - origin.height/2) + "px";
    document.body.appendChild(ghost);

    indicator = document.createElement("div");
    indicator.className = "drop-indicator";
    document.body.appendChild(indicator);

    try { cell.setPointerCapture(e.pointerId); } catch(_) {}
  }, 350);

  function onMove(ev) {
    if (!dragging) {
      if (Math.hypot(ev.clientX - startX, ev.clientY - startY) > 8) clearTimeout(timer);
      return;
    }
    ev.preventDefault();
    ghost.style.left = (ev.clientX - origin.width/2) + "px";
    ghost.style.top = (ev.clientY - origin.height/2) + "px";

    // Hit-test: is pointer inside any cell (occupied or empty) besides dragged?
    const allCells = [...wrap.querySelectorAll(".cell[data-slot]")].filter(c => c !== cell);
    let hitCell = null;
    for (const c of allCells) {
      const r = c.getBoundingClientRect();
      if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom) {
        hitCell = c; break;
      }
    }

    // Clear previous highlight
    if (highlightedCell && highlightedCell !== hitCell) {
      highlightedCell.classList.remove("drop-target");
      highlightedCell = null;
    }

    if (hitCell) {
      // Cell mode: swap with / move into this cell
      drop = { mode: "cell", slot: parseInt(hitCell.dataset.slot, 10), row: hitCell.dataset.row };
      hitCell.classList.add("drop-target");
      highlightedCell = hitCell;
      indicator.style.display = "none";
    } else {
      // Insert mode: find nearest column gap
      indicator.style.display = "";
      const bounds = new Map();
      for (const c of allCells) {
        const s = parseInt(c.dataset.slot, 10);
        const r = c.getBoundingClientRect();
        if (!bounds.has(s)) bounds.set(s, { left: r.left, right: r.right });
        else {
          const v = bounds.get(s);
          v.left = Math.min(v.left, r.left); v.right = Math.max(v.right, r.right);
        }
      }
      const slots = [...bounds.entries()].sort((a,b) => a[0] - b[0]);
      const wrapRect = wrap.getBoundingClientRect();
      let targetCol, indicatorX;
      if (slots.length === 0) {
        targetCol = 1; indicatorX = wrapRect.left;
      } else {
        let placed = false;
        for (let i = 0; i < slots.length; i++) {
          const [s, ext] = slots[i];
          const mid = (ext.left + ext.right) / 2;
          if (ev.clientX < mid) { targetCol = s; indicatorX = ext.left - 6; placed = true; break; }
        }
        if (!placed) {
          const [lastS, lastExt] = slots[slots.length - 1];
          targetCol = lastS + 1; indicatorX = lastExt.right + 2;
        }
      }
      // Row by pointer Y relative to belt midline
      const beltMid = wrapRect.top + wrapRect.height / 2;
      const row = ev.clientY < beltMid ? "top" : "bottom";
      drop = { mode: "insert", slot: targetCol, row };
      indicator.style.left = indicatorX + "px";
      indicator.style.top = wrapRect.top + "px";
      indicator.style.height = wrapRect.height + "px";
    }
  }

  function cleanup() {
    clearTimeout(timer);
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", onUp);
    document.removeEventListener("pointercancel", onUp);
    if (ghost) ghost.remove();
    if (indicator) indicator.remove();
    if (highlightedCell) highlightedCell.classList.remove("drop-target");
    cell.classList.remove("dragging");
  }

  function onUp() {
    if (!dragging) { cleanup(); return; }
    const d = drop;
    if (d) {
      const oldRects = new Map();
      for (const c of wrap.querySelectorAll(".cell[data-pos-id]")) {
        oldRects.set(c.dataset.posId, c.getBoundingClientRect());
      }
      cleanup();
      if (d.mode === "cell") moveOrSwap(posId, d.slot, d.row);
      else moveLinePosition(posId, d.slot, d.row);
      render();
      flipAnimate(oldRects);
    } else {
      cleanup();
    }
  }

  document.addEventListener("pointermove", onMove);
  document.addEventListener("pointerup", onUp);
  document.addEventListener("pointercancel", onUp);
}

function renderLineGrid(cellRenderer) {
  const wrap = document.createElement("div"); wrap.className = "line-wrap";
  const grid = document.createElement("div"); grid.className = "line-grid";
  const N = Math.max(maxSlot(), 1);
  const cols = `repeat(${N}, minmax(var(--cell-min, 120px), 1fr))`;

  const top = document.createElement("div"); top.className = "row"; top.style.gridTemplateColumns = cols;
  const bot = document.createElement("div"); bot.className = "row"; bot.style.gridTemplateColumns = cols;
  for (let s = 1; s <= N; s++) {
    top.appendChild(cellRenderer(findSlot(s, "top"), s, "top"));
    bot.appendChild(cellRenderer(findSlot(s, "bottom"), s, "bottom"));
  }
  grid.appendChild(top);
  const belt = document.createElement("div"); belt.className = "belt";
  grid.appendChild(belt);
  grid.appendChild(bot);
  wrap.appendChild(grid);
  return wrap;
}

function renderLine() {
  const c = document.getElementById("content");
  c.innerHTML = "";
  const wrap = document.createElement("div"); wrap.className = "line-screen";

  const actions = document.createElement("div"); actions.className = "actions";
  const done = document.createElement("button"); done.className = "done"; done.textContent = "完成";
  done.onclick = () => { state.current = { ...state.current, screen: "operate" }; saveState(); render(); };
  const add = document.createElement("button"); add.textContent = "+ 添加槽位";
  add.onclick = () => { addSlot(); renderLine(); };
  const reset = document.createElement("button"); reset.className = "danger"; reset.textContent = "恢复默认布局";
  reset.onclick = () => {
    if (confirm("将清空所有便当的材料分配并重置 14 个位置,继续?")) {
      resetLineToSeed(); renderLine();
    }
  };
  actions.appendChild(done); actions.appendChild(add); actions.appendChild(reset);
  wrap.appendChild(actions);

  const table = document.createElement("table");
  table.innerHTML = "<thead><tr><th>列号</th><th>排</th><th>位号/名</th><th></th></tr></thead>";
  const tbody = document.createElement("tbody");
  const sorted = state.line.slice().sort((a,b) => a.slot - b.slot || (a.row === "top" ? -1 : 1));
  for (const p of sorted) {
    const tr = document.createElement("tr");

    const tdSlot = document.createElement("td");
    const slotInp = document.createElement("input"); slotInp.type = "number"; slotInp.min = "1"; slotInp.value = p.slot;
    slotInp.onchange = () => {
      if (!updateSlotPosition(p.id, { slot: slotInp.value })) slotInp.value = p.slot;
      else renderLine();
    };
    tdSlot.appendChild(slotInp);

    const tdRow = document.createElement("td");
    for (const r of ["bottom","top"]) {
      const label = document.createElement("label");
      const rb = document.createElement("input"); rb.type = "radio"; rb.name = "row-" + p.id; rb.value = r;
      if (p.row === r) rb.checked = true;
      rb.onchange = () => { if (rb.checked) { updateSlotPosition(p.id, { row: r }); renderLine(); } };
      label.appendChild(rb); label.appendChild(document.createTextNode(r === "top" ? "上" : "下"));
      tdRow.appendChild(label);
    }

    const tdLabel = document.createElement("td");
    const labelInp = document.createElement("input"); labelInp.className = "label"; labelInp.value = p.label;
    labelInp.onblur = () => { updateSlotPosition(p.id, { label: labelInp.value }); };
    tdLabel.appendChild(labelInp);

    const tdDel = document.createElement("td");
    const del = document.createElement("button"); del.className = "del"; del.textContent = "×";
    del.onclick = () => {
      if (confirm(`删除位置 "${p.label}"?将从所有便当中移除该位的材料。`)) {
        deleteSlotPosition(p.id); renderLine();
      }
    };
    tdDel.appendChild(del);

    tr.appendChild(tdSlot); tr.appendChild(tdRow); tr.appendChild(tdLabel); tr.appendChild(tdDel);
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  c.appendChild(wrap);
}

let pickerEl = null;
function closePicker() { if (pickerEl) { pickerEl.remove(); pickerEl = null; } }
function openPicker(anchor, bentoId, posId) {
  closePicker();

  const sel = new Set(b.assignments[posId] || []);
  const p = document.createElement("div"); p.className = "picker";
  if (state.materials.length === 0) {
    p.innerHTML = '<div class="empty">先在「材料库」中添加材料</div>';
  } else {
    for (const m of state.materials) {
      const opt = document.createElement("div");
      opt.className = "opt" + (sel.has(m.id) ? " sel" : "");
      const sw = document.createElement("span"); sw.className = "swatch"; sw.style.background = m.color;
      const nm = document.createElement("span"); nm.textContent = m.name; nm.style.color = m.color;
      opt.appendChild(sw); opt.appendChild(nm);
      opt.onclick = (e) => { e.stopPropagation(); toggleAssignment(bentoId, posId, m.id); renderEdit(); };
      p.appendChild(opt);
    }
  }
  const r = anchor.getBoundingClientRect();
  p.style.left = Math.min(r.left, window.innerWidth - 240) + "px";
  p.style.top = (r.bottom + 4) + "px";
  document.body.appendChild(p);
  pickerEl = p;
  setTimeout(() => {
    document.addEventListener("mousedown", function once(ev) {
      if (pickerEl && !pickerEl.contains(ev.target)) { closePicker(); document.removeEventListener("mousedown", once); }
    });
  }, 0);
}

      const it = document.createElement("div"); it.className = "item";
      const nm = document.createElement("div"); nm.className = "name"; nm.textContent = b.name;
      nm.onclick = () => { state.current = { ...state.current, screen: "edit", editingBentoId: b.id }; saveState(); render(); };
      const ed = document.createElement("button"); ed.textContent = "改";
      ed.onclick = () => nm.click();
      const dl = document.createElement("button"); dl.className = "del"; dl.textContent = "删";
      dl.onclick = () => {
        if (confirm(`删除便当 "${b.name}"?`)) { deleteBento(b.id); render(); }
      };
      it.appendChild(nm); it.appendChild(ed); it.appendChild(dl);
      wrap.appendChild(it);
    }
  }
  c.appendChild(wrap);
}

function render() {
  for (const b of document.querySelectorAll("header .btn-tab")) {
    b.classList.toggle("active", b.dataset.screen === state.current.screen);
  }
  if (state.current.screen === "operate") renderOperate();
  else if (state.current.screen === "bentos") renderBentos();
  else if (state.current.screen === "edit") renderEdit();
  else if (state.current.screen === "line") renderLine();
}

function setupAutocomplete() {
  const inp = document.getElementById("bento-search");
  let acEl = null;
  let selIdx = -1;
  let opts = [];

  function close() { if (acEl) { acEl.remove(); acEl = null; selIdx = -1; } }
  function refresh() {
    if (!acEl) return;
    [...acEl.children].forEach((el,i) => el.classList.toggle("sel", i === selIdx));
  }
  function update() {
    close();
    opts = matchBentos(inp.value);
    if (opts.length === 0) return;
    acEl = document.createElement("div"); acEl.className = "autocomplete";
    const r = inp.getBoundingClientRect();
    acEl.style.left = r.left + "px"; acEl.style.top = (r.bottom + 4) + "px";
    for (let i = 0; i < opts.length; i++) {
      const o = opts[i];
      const el = document.createElement("div"); el.className = "opt"; el.textContent = o.name;
      el.onmousedown = (e) => { e.preventDefault(); pick(o); };
      acEl.appendChild(el);
    }
    document.body.appendChild(acEl);
  }
  function pick(b) {
    inp.value = b.name;
    state.current = { ...state.current, screen: "operate", bentoId: b.id };
    saveState(); close(); render();
  }
  inp.addEventListener("focus", update);
  inp.addEventListener("input", update);
  inp.addEventListener("blur", () => setTimeout(close, 100));
  inp.addEventListener("keydown", (e) => {
    if (!acEl) return;
    if (e.key === "ArrowDown") { selIdx = Math.min(selIdx+1, opts.length-1); refresh(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { selIdx = Math.max(selIdx-1, 0); refresh(); e.preventDefault(); }
    else if (e.key === "Enter") {
      if (selIdx >= 0) pick(opts[selIdx]);
      else if (opts.length === 1) pick(opts[0]);
      e.preventDefault();
    } else if (e.key === "Escape") close();
  });
}

for (const b of document.querySelectorAll("header .btn-tab")) {
  b.onclick = () => { state.current = { ...state.current, screen: b.dataset.screen }; saveState(); render(); };
}
setupAutocomplete();

function saveJSON() {
  saveState();
  const d = new Date();
  const ds = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  const modal = document.getElementById("save-modal");
  const input = document.getElementById("save-name");
  input.value = "bento-conveyor-" + ds + ".json";
  modal.classList.add("show");
  setTimeout(() => { input.focus(); input.select(); }, 0);

  function close() {
    modal.classList.remove("show");
    document.getElementById("save-ok").onclick = null;
    document.getElementById("save-cancel").onclick = null;
    input.onkeydown = null;
  }
  function doSave() {
    let name = input.value.trim();
    if (!name) return;
    if (!/\.json$/i.test(name)) name += ".json";
    const payload = {
      version: state.version,
      materials: state.materials,
      line: state.line,
      bentos: state.bentos,
      meta: state.meta,
      _migrations: state._migrations
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
    const a = document.createElement("a");
    a.download = name;
    a.href = URL.createObjectURL(blob);
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    close();
    showBanner(`✓ 已保存 ${state.bentos.length} 个便当 / ${state.materials.length} 个材料 / ${state.line.length} 个位置`, "ok");
  }
  document.getElementById("save-ok").onclick = doSave;
  document.getElementById("save-cancel").onclick = close;
  input.onkeydown = (e) => {
    if (e.key === "Enter") { e.preventDefault(); doSave(); }
    else if (e.key === "Escape") close();
  };
}

function exportImage() {
  const bento = state.current.bentoId ? state.bentos.find(b => b.id === state.current.bentoId) : null;
  const N = Math.max(maxSlot(), 1);
  const dpr = window.devicePixelRatio || 1;
  const cellW = 160, cellH = 110, gap = 12, pad = 24;
  const titleH = bento ? 60 : 0;
  const beltH = 14;
  const hasMeta = !!(state.meta?.people || state.meta?.speed);
  const metaH = hasMeta ? 28 : 0;
  const W = pad*2 + N*cellW + (N-1)*gap;
  const H = pad*2 + titleH + metaH + cellH + beltH + cellH;

  const canvas = document.createElement("canvas");
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, W, H);

  let y = pad;
  if (bento) {
    ctx.fillStyle = "#111";
    ctx.font = "700 32px -apple-system, PingFang SC, Microsoft Yahei, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(bento.name, W/2, y + titleH/2);
    y += titleH;
  }
  const metaParts = [];
  if (state.meta?.people) metaParts.push("人数: " + state.meta.people);
  if (state.meta?.speed) metaParts.push("LINE速度: " + state.meta.speed);
  if (metaParts.length) {
    ctx.fillStyle = "#444";
    ctx.font = "16px -apple-system, PingFang SC, Microsoft Yahei, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(metaParts.join("    "), W/2, y + 12);
    y += 28;
  }

  function drawCell(pos, x, y) {
    ctx.fillStyle = "#fafafa";
    ctx.strokeStyle = pos ? "#333" : "#bbb";
    ctx.lineWidth = pos ? 1.5 : 1;
    if (!pos) ctx.setLineDash([4,4]); else ctx.setLineDash([]);
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(x, y, cellW, cellH, 8) : ctx.rect(x, y, cellW, cellH);
    if (pos) ctx.fill();
    ctx.stroke();
    ctx.setLineDash([]);
    if (!pos) return;
    ctx.fillStyle = "#888";
    ctx.font = "12px -apple-system, PingFang SC, Microsoft Yahei, sans-serif";
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.fillText(pos.label, x + 8, y + 6);
    const ids = bento ? (bento.assignments[pos.id] || []) : [];
    if (ids.length === 0) return;
    ctx.font = "600 20px -apple-system, PingFang SC, Microsoft Yahei, sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const lineH = 24;
    const total = ids.length * lineH;
    let ty = y + cellH/2 - total/2 + lineH/2;
    for (const mid of ids) {
      const m = state.materials.find(x => x.id === mid);
      if (!m) continue;
      ctx.fillStyle = m.color || "#111";
      ctx.fillText(m.name, x + cellW/2, ty);
      ty += lineH;
    }
  }

  for (let s = 1; s <= N; s++) {
    const x = pad + (s-1)*(cellW + gap);
    drawCell(findSlot(s, "top"), x, y);
    drawCell(findSlot(s, "bottom"), x, y + cellH + beltH);
  }
  const beltY = y + cellH + 3;
  const beltGrad = ctx.createLinearGradient(pad, 0, W-pad, 0);
  beltGrad.addColorStop(0, "#cbd5e1");
  beltGrad.addColorStop(0.5, "#94a3b8");
  beltGrad.addColorStop(1, "#cbd5e1");
  ctx.fillStyle = beltGrad;
  ctx.fillRect(pad, beltY, W - pad*2, beltH - 6);
  ctx.fillStyle = "#fb923c";
  ctx.font = "16px sans-serif";
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ctx.fillText("▶", W - pad + 2, beltY + (beltH-6)/2);

  const a = document.createElement("a");
  a.download = (bento ? bento.name : "配置") + ".png";
  canvas.toBlob(blob => {
    a.href = URL.createObjectURL(blob);
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
}

function importJSON() {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = "application/json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (data.version !== 1) throw new Error("版本不匹配");
        if (!Array.isArray(data.materials) || !Array.isArray(data.line) || !Array.isArray(data.bentos)) throw new Error("数据结构错误");
        if (!confirm("将覆盖当前所有数据,继续?")) return;
        state = data;
        if (!state.current) state.current = { screen:"operate", bentoId:null, editingBentoId:null };
        seedLineIfEmpty(state);
        migrate(state);
        saveState();
        render();
      } catch (e) { alert("导入失败: " + e.message); }
    };
    r.readAsText(f);
  };
  inp.click();
}
document.getElementById("btn-import").onclick = importJSON;

const exportMenu = document.getElementById("export-menu");
document.getElementById("btn-export").onclick = (e) => {
  e.stopPropagation();
  exportMenu.classList.toggle("show");
};
exportMenu.onclick = (e) => {
  const act = e.target.dataset.act;
  if (!act) return;
  exportMenu.classList.remove("show");
  if (act === "save") saveJSON();
  else if (act === "print") window.print();
  else if (act === "image") exportImage();
};
document.addEventListener("click", (e) => {
  if (!e.target.closest(".menu-wrap")) exportMenu.classList.remove("show");
});

function init() {
  if (!state.current.bentoId && state.bentos.length > 0) {
    state.current.bentoId = state.bentos[0].id;
    saveState();
  }
  render();
  if (new URLSearchParams(location.search).get("test") === "1") runSelfTests();
}
init();
</script>
